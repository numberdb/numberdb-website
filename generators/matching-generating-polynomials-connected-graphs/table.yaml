# Draft document for matching-generating polynomial table T248.
# Publishing is a person's act.
Title: Matching-generating polynomials of connected graphs
Definition: >-
  For a connected simple graph $G$, let $m_k(G)$ be the number of matchings
  with $k$ edges and let $m_0(G)=1$. Listed is the matching-generating
  polynomial $M(G,x)=\sum_{k\geq0}m_k(G)x^k$ CITE{WikiMatching}
  CITE{MathWorldMatching}.
Keywords:
  - matching polynomial
  - matching-generating polynomial
  - matching generating function
  - monomer-dimer
  - Hosoya index
Parameters:
  g:
    type: Symbolic
    title: graph
    constraints: a connected simple graph, named by its canonical graph6 string
    display: $G$
Comments:
  comment-graph6: >-
    Graphs are named by their graph6 string CITE{Graph6}, McKay's compact
    encoding, taken after a canonical relabelling so that the name depends on
    the graph and not on how its vertices happen to be numbered. Recover the
    graph in Sage with `Graph(name)`, and produce the name used here with
    `g.canonical_label(algorithm='sage').graph6_string()`. The same names index
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomials]
    and HREF{Tutte_polynomials_of_connected_graphs}[the Tutte polynomials].
  comment-counts: >-
    $M(G,x)$ records the matching counts $m_k(G)$ directly. It does not record
    the number of vertices, so graphs of different sizes can share it: $K_3$
    and $K_{1,3}$ have $M(G,x)=3x+1$.
  comment-hosoya: >-
    $M(G,1)=\sum_k m_k(G)$ is the number of matchings of $G$, called its Hosoya
    index; for $K_7$ it is $232$.
  comment-shared-values: >-
    The 996 graphs here have 379 distinct matching-generating polynomials. The
    largest class of connected graphs with the same matching-generating
    polynomial has 13 graphs.
Formulas:
  formula-signed-form: >-
    If $G$ has $n$ vertices and $\mu(G,x)$ is the signed matching polynomial,
    then $\mu(G,x)=x^nM(G,-x^{-2})$.
  formula-line-graph: >-
    $M(G,x)=I(L(G),x)$, where $I$ is the independence polynomial and $L(G)$ is
    the line graph of $G$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.graphs.graph import Graph

      G = Graph('EIe_')                  # C_6, by its name here
      mu = G.matching_polynomial()
      x = mu.parent().gen()
      n = G.num_verts()
      sum(abs(mu[n - 2*k]) * x**k for k in range(n // 2 + 1))
Similar tables:
  - table: HREF{T239}[Signed matching polynomials of connected graphs]
    relation: >-
      uses the same graph names and stores
      $\mu(G,x)=\sum_k(-1)^k m_k(G)x^{n-2k}$; for a graph with $n$ vertices,
      $\mu(G,x)=x^nM(G,-x^{-2})$, so the two tables encode the same matching
      counts in different one-variable polynomials. This table is the likely
      target for a reader holding matching counts or a Hosoya-index
      computation; the signed table is the convention used for roots and
      characteristic-polynomial identities.
  - table: HREF{Independence_polynomials_of_trees}[Independence polynomials of trees]
    relation: for every graph $G$, $M(G,x)$ is the independence polynomial $I(L(G),x)$ of its line graph
  - table: HREF{Chromatic_polynomials_of_connected_graphs}[Chromatic polynomials of connected graphs]
    relation: uses the same canonical graph6 index for connected graphs on at most seven vertices
  - table: HREF{Tutte_polynomials_of_connected_graphs}[Tutte polynomials of connected graphs]
    relation: uses the same canonical graph6 index for connected graphs on at most seven vertices, but the matching-generating polynomial is not determined by the Tutte polynomial
  - table: HREF{Entropy_constants_of_lattice_models}[Entropy constants of lattice models]
    relation: the dimer model counts perfect matchings of lattice regions; for a graph $G$ with an even number $n$ of vertices, the coefficient of $x^{n/2}$ in $M(G,x)$ counts perfect matchings

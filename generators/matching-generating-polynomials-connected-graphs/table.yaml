Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds $M(G,x)$ for every connected graph $G$ on at most seven vertices
  rigour details: >-
    The generator enumerates connected simple graphs with $1\leq |V(G)|\leq7$
    using Sage, takes each graph's `canonical_label(algorithm='sage')`, and
    stores the canonical graph6 string. It counts matchings by exact
    enumeration of edge subsets and forms $M(G,x)$ over $\mathbb{Z}[x]$.


    The 996 graph6 strings are exactly the keys of
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomial
    table] and HREF{Tutte_polynomials_of_connected_graphs}[the Tutte
    polynomial table]. The count of equal-polynomial classes in comment
    CITE{comment-shared-values} was computed from the same exact rows. Formula
    CITE{formula-signed-form} agreed against the stored signed rows before the
    split, and formula CITE{formula-line-graph} agreed on the 109 graphs whose
    line graph is connected and has at most seven vertices.
Display properties:
  number-header: $M(G,x)$

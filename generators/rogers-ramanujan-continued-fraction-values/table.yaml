Title: Values of the Rogers–Ramanujan continued fraction $R(e^{-\pi\sqrt r})$
Definition: >-
  For a positive integer $r$, set $q=e^{-\pi\sqrt r}$. The row stores
  the Rogers–Ramanujan continued fraction
  $R(q)=\cfrac{q^{1/5}}{1+\cfrac{q}{1+\cfrac{q^2}{1+\cfrac{q^3}{1+\cdots}}}}$,
  with $q^{1/5}$ taken as the positive real fifth root
  CITE{MathWorldRogersRamanujan}.
Parameters:
  r:
    type: Z
    title: positive integer
    display: $r$
    constraints: positive integer
Comments:
  comment-cm-point: >-
    The CM point is $\tau=i\sqrt r$, so the family nome is
    $q=e^{\pi i\tau}=e^{-\pi\sqrt r}$. The order is
    $\mathbb{Z}[\sqrt{-r}]$, of discriminant $-4r$.
  comment-convergence: >-
    For these rows $0<q<1$, so the continued fraction converges to its
    value inside the unit disk CITE{MathWorldRogersRamanujan}.
Formulas:
  formula-product: >-
    $R(q)=q^{1/5}\prod_{k=0}^{\infty}
    \frac{(1-q^{5k+1})(1-q^{5k+4})}
    {(1-q^{5k+2})(1-q^{5k+3})}$
    CITE{MathWorldRogersRamanujan}.
  formula-j: >-
    If $u=R(q)$ and $z=i\sqrt r/2$, so that $q=e^{2\pi i z}$, then
    $j(z)=-\frac{(u^{20}-228u^{15}+494u^{10}+228u^5+1)^3}
    {u^5(u^{10}+11u^5-1)^5}$ CITE{Duke} CITE{MathWorldRogersRamanujan}.
  formula-order-two: >-
    If $u_r=R(e^{-\pi\sqrt r})$, then
    $u_r u_{4r}^2=(u_{4r}-u_r^2)/(u_{4r}+u_r^2)$
    CITE{MathWorldRogersRamanujan}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.integer_ring import ZZ
      from sage.rings.real_arb import RealBallField

      r = 2
      terms = 80
      RBF = RealBallField(numberdb.bits(100, losing=256))
      q = (-RBF.pi() * RBF(ZZ(r)).sqrt()).exp()
      value = q ** (ZZ(1) / ZZ(5))
      for k in range(terms):
          value *= (1 - q ** (5 * k + 1)) * (1 - q ** (5 * k + 4))
          value /= (1 - q ** (5 * k + 2)) * (1 - q ** (5 * k + 3))
      value

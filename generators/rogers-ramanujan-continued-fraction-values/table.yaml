Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $R(e^{-\pi\sqrt r})$ for every integer $1\leq r\leq100$,
    matching the range of HREF{T295}[the singular moduli],
    HREF{T296}[$K(k_r)$], and HREF{T297}[Ramanujan's class invariants]
  rigour details: >-
    The generator computes the product in CITE{formula-product} in Sage's
    arb-backed `RealBallField`, using a finite product with an explicit
    positive tail bound. Before the values are sent, the generator checks the
    continued-fraction recurrence, CITE{formula-j}, and
    CITE{formula-order-two} on the computed range.

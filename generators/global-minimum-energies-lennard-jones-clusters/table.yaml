Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds the global-minimum rows $2\leq n\leq150$ from the Cambridge
    Cluster Database table read on 2026-09-23
  rigour details: >-
    The values for $n=2,3,4$ are exact by CITE{formula-exact-small}. The
    remaining values are transcribed from the Cambridge Cluster Database table
    CITE{CCDTable} at the six decimal places printed by the source. The
    generator recomputes the Lennard-Jones energy in CITE{formula-potential}
    from the source coordinate archive CITE{CCDTar} for every $3\leq n\leq150$
    and checks that every recomputed coordinate energy is within
    $5\cdot10^{-6}$ of the printed value. It also checks that 125 of the 148
    coordinate rows agree to the printed sixth decimal; among the others, the
    largest discrepancy from the printed value is less than $1.34\cdot10^{-6}$,
    caused by the rounded coordinates published in the archive.
Display properties:
  number-header: $E_n/\epsilon$

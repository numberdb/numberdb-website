# Draft document for T377, Arithmetic factors in the moments of the Riemann
# zeta function. It was created through the API with X-Draft: yes and
# Numbers: [] so generate.py can fill it once. Publishing is a person's act.
Title: Arithmetic factors $a_k$ in the moments of the Riemann zeta function
Definition: >-
  For $k>0$ rational, $a_k$ is the Euler product in CITE{formula-ak}. It is
  the arithmetic factor in CITE{formula-moment} for the averaged $2k$-th
  moment of $\zeta(s)$ CITE{WikiZeta}.
Keywords:
  - Riemann zeta moment
  - zeta moment
  - arithmetic factor
  - Euler product
  - Keating-Snaith
  - CFKRS
Parameters:
  k:
    type: Q
    title: half moment exponent
    display: $k$
    constraints: $k>0$
Comments:
  comment-indexing: >-
    The parameter is $k$, not the full exponent $2k$: $k=1$ is the second
    moment and $k=2$ is the fourth moment.
  comment-factor: >-
    The leading constant is normalized as $c_k=a_k f_U(k)$. This table stores
    the arithmetic factor $a_k$ alone, not the random-matrix factor $f_U(k)$.
Formulas:
  formula-moment: >-
    $\frac1T\int_0^T |\zeta(1/2+it)|^{2k}\,dt\sim
    c_k(\log T)^{k^2}$, with $c_k=a_k f_U(k)$.
  formula-ak: >-
    $a_k=\prod_p \left(1-\frac1p\right)^{k^2}
    \sum_{m=0}^{\infty}
    \left(\frac{\Gamma(m+k)}{m!\Gamma(k)}\right)^2p^{-m}$,
    where the product runs over rational primes.
  formula-ak-integer: >-
    If $k$ is a positive integer, then
    $a_k=\prod_p \left(1-\frac1p\right)^{(k-1)^2}
    \sum_{j=0}^{k-1}{k-1\choose j}^2p^{-j}$ CITE{CFKRS}.
  formula-controls: >-
    $a_1=1$, and
    $a_2=\prod_p(1-p^{-2})=1/\zeta(2)=6/\pi^2$.
Programs:
  program-pari-integers:
    language: PARI/GP
    code: |-
      default(realprecision, 140)
      k = 3
      prodeulerrat((1 - 1/p)^((k - 1)^2) *
        sum(j = 0, k - 1, binomial(k - 1, j)^2/p^j), 1, 2)
Similar tables:
  - table: HREF{Named_rational_Euler_products_over_primes}[Named rational Euler products over primes]
    relation: contains $a_2=6/\pi^2$ as the squarefree-density product in another context
  - table: HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[Values of the Riemann zeta function at rational numbers]
    relation: contains $\zeta(2)$, which gives the control value $a_2=1/\zeta(2)$

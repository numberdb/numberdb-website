    bib: >-
      J. Brian Conrey, David W. Farmer, Jon P. Keating, Michael O.
      Rubinstein and Nina C. Snaith, Integral moments of L-functions,
      Proceedings of the London Mathematical Society 91 (2005), 33-104.
    arxiv: math/0206018
Tags:
  - number theory
  - L-function
Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds $k=1/2,1,3/2,\ldots,6$ and every integer $7\leq k\leq12$
  rigour details: >-
    The generator computes the small-prime local factors directly with arb's
    hypergeometric function, computes the middle prime range from the exact
    power-series coefficients of $\log$ CITE{formula-ak}, and computes the
    remaining prime tail from prime-zeta values. The written 100 digits were
    computed with 140-digit settings and recomputed with 160-digit settings;
    the written digits agreed. The checks include $a_1=1$, $a_2=6/\pi^2$,
    and the integer rows against PARI's `prodeulerrat` applied to
    CITE{formula-ak-integer}.

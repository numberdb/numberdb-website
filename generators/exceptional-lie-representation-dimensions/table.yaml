Data properties:
  type: Z
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every nontrivial irreducible representation with
    $\dim V(\lambda)\leq10^6$ for $G_2$,
    $\dim V(\lambda)\leq10^7$ for $F_4$ and $E_6$,
    $\dim V(\lambda)\leq10^8$ for $E_7$, and
    $\dim V(\lambda)\leq10^{12}$ for $E_8$
  rigour details: >-
    All entries are exact integers computed from Weyl's dimension formula
    CITE{formula-weyl-dimension}. The generator reads the positive roots
    and fundamental weights from Sage's root-system data CITE{SageRootSystem},
    evaluates the product over positive coroots with exact rational
    arithmetic, and checks that each result is integral. The finite range is
    checked by enumerating the dominant weights a second way, by total label
    sum. The fundamental representation dimensions are checked against the
    standard values $7,14$ for $G_2$, $26,52,273,1274$ for $F_4$, $27,78,351,
    2925,351,27$ for $E_6$, $56,133,912,1539,8645,27664,365750$ for $E_7$,
    and $248,3875,30380,147250,2450240,6696000,146325270,6899079264$ for
    $E_8$. For each algebra, the set of distinct stored dimensions, together
    with the omitted trivial dimension $1$, is checked against the
    corresponding OEIS b-file through the stated bound: CITE{OEISG2},
    CITE{OEISF4}, CITE{OEISE6}, CITE{OEISE7} and CITE{OEISE8}.
Display properties:
  number-header: $\dim V_{\mathfrak g}(\lambda)$

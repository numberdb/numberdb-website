# Draft document for T256. Publishing is a person's act.
Title: Dimensions of the irreducible representations of the exceptional simple Lie algebras
Definition: >-
  For an exceptional complex simple Lie algebra $\mathfrak g$
  CITE{WikiExceptional}, this table stores
  $\dim V_{\mathfrak g}(\lambda)$ for nonzero dominant integral highest
  weights $\lambda$.
Parameters:
  algebra:
    type: Symbolic
    title: exceptional simple Lie algebra
    display: $\mathfrak g$
    constraints: one of $G_2$, $F_4$, $E_6$, $E_7$ or $E_8$
    values:
      G2: $G_2$
      F4: $F_4$
      E6: $E_6$
      E7: $E_7$
      E8: $E_8$
  weight:
    type: Symbolic
    title: highest weight
    display: $\lambda$
    constraints: >-
      a nonzero tuple $(a_1,\ldots,a_r)$ of nonnegative integers, where
      $r$ is the rank of $\mathfrak g$
Comments:
  bourbaki-numbering: >-
    Weights are written as Dynkin labels in Bourbaki node numbering, the
    numbering used by Sage's root-system data CITE{SageRootSystem}. For
    example, in this convention $E_8$ has
    $\dim V(1,0,0,0,0,0,0,0)=3875$ and
    $\dim V(0,0,0,0,0,0,0,1)=248$.
  trivial-representation: >-
    The zero highest weight, whose representation has dimension $1$, is
    omitted.
  equal-dimensions: >-
    Weights with the same dimension remain separate rows. This includes
    dual pairs such as the two $27$-dimensional representations of $E_6$
    and repeated dimensions such as the two $77$-dimensional
    representations of $G_2$.
  classical-types: >-
    The classical simple Lie algebras are not included. Their familiar
    families of representations often have binomial-coefficient or short
    product dimensions, so their small values are better found through
    their own classical constructions.
Formulas:
  formula-weyl-dimension: >-
    Weyl's dimension formula is
    $\dim V(\lambda)=\prod_{\alpha\in\Phi^+}
    \frac{\langle\lambda+\rho,\alpha^\vee\rangle}
    {\langle\rho,\alpha^\vee\rangle}$, where $\Phi^+$ is the set of
    positive roots and $\rho$ is the half-sum of the positive roots
    CITE{WikiWeyl}.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.combinat.root_system.root_system import RootSystem
      from sage.rings.rational_field import QQ

      ambient = RootSystem("E8").ambient_space()
      weights = ambient.fundamental_weights()
      rho = ambient.rho()
      labels = (0, 0, 0, 0, 0, 0, 0, 1)
      lam = ambient.zero()
      for a, i in zip(labels, ambient.index_set()):
          lam += QQ(a) * weights[i]
      dimension = QQ(1)
      for alpha in ambient.positive_roots():
          coroot = alpha.associated_coroot()
          dimension *= QQ((lam + rho).scalar(coroot)) / QQ(rho.scalar(coroot))
      dimension                                  # 248

Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the rational classes listed in CITE{ElkiesANTS}: the unique class
    for each $M\leq4$ and the Birch and Elkies classes at $M=5$; Elkies states
    that the existence of any rational class with $M>5$ is open
  sources:
    - CITE{Montanus2006}
    - CITE{SijslingVoight}
    - CITE{ElkiesANTS}
  rigour details: >-
    Every stored value is an exact polynomial over $\mathbb Q$. The generator
    transcribes $f$ from CITE{Montanus2006} for the Montanus rows and from
    CITE{ElkiesANTS} for the Elkies row, derives $g$ as the polynomial part of
    $f^{3/2}$ at infinity, sets $h=f^3-g^2$, and checks the degree conditions
    and the extremality criterion $2fg'-3f'g\in\mathbb Q^*$ exactly. The Birch
    $M=5$ row is also checked against Example 1.8 of CITE{SijslingVoight},
    which prints $f$, $g$ and $h$.
Display properties:
  number-header: $f(t)$, $g(t)$, or $h(t)$

Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the five examples printed in CITE{Montanus2006}; that source
    states uniqueness up to equivalence for the $M\leq4$ rows, while the
    $M=5$ row is Birch's symmetric example
  sources:
    - CITE{Montanus2006}
    - CITE{SijslingVoight}
  rigour details: >-
    Every stored value is an exact polynomial over $\mathbb Q$. The generator
    transcribes $f$ and $h$ from CITE{Montanus2006}, derives $g$ as the exact
    square root of $f^3-h$, and checks $h=f^3-g^2$ and the degree conditions
    exactly. The $M=5$ row is also checked against Example 1.8 of
    CITE{SijslingVoight}, which prints $f$, $g$ and $h$.
Display properties:
  number-header: $f(t)$, $g(t)$, or $h(t)$

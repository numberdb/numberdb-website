Title: Davenport-Stothers polynomial triples
Definition: >-
  A Davenport-Stothers polynomial triple of type $M$ is a triple
  $f,g,h\in\mathbb Q[t]$ with $h=f^3-g^2\ne0$, $\deg f=2M$,
  $\deg g=3M$ and $\deg h=M+1$. This table stores the parts $f$, $g$
  and $h$ of the printed representatives in CITE{Montanus2006}.
Parameters:
  M:
    type: Z
    title: half-degree
    display: $M$
    constraints: a positive integer with $\deg f=2M$
    values:
      1: $M=1$
      2: $M=2$
      3: $M=3$
      4: $M=4$
      5: $M=5$
  tree:
    type: Symbolic
    title: tree label
    constraints: a label for the equivalence class of the Hall dessin represented by the row
    values:
      unique: unique
      Birch: Birch
  part:
    type: Symbolic
    title: part
    show-in-parameter-list: 'no'
    values:
      f: $f(t)$
      g: $g(t)$
      h: $h(t)$
Comments:
  comment-equivalence: >-
    Two triples are equivalent in the sense of CITE{Montanus2006} when
    constants $u,w\in\mathbb C^*$ and $v\in\mathbb C$ carry $f_1,g_1,h_1$
    to $w^2 f_1(ut+v)$, $w^3 g_1(ut+v)$ and $w^6 h_1(ut+v)$. The table
    stores one representative of each class printed here, with the variable
    renamed to $t$.
  comment-tree-label: >-
    For $M\leq4$, CITE{Montanus2006} states that the displayed triples are
    the only ones up to equivalence, so their tree label is `unique`. For
    $M=5$, the stored row is Birch's symmetric example.
Formulas:
  formula-defining-relation:
    name: defining relation
    text: $h(t)=f(t)^3-g(t)^2$.
  formula-belyi-map:
    name: Belyi map
    text: >-
      $f(t)^3/h(t)=1+g(t)^2/h(t)$ is the Belyi map attached to the Hall
      dessin of the triple CITE{SijslingVoight}.

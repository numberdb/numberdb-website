# The table document for a draft to be created on numberdb.org. Publishing is
# a person's act on the site; the generator beside this file fills the entries.
Title: $\mathcal{L}$-invariants of elliptic curves over $\mathbb{Q}$ with split multiplicative reduction
Definition: >-
  Let $E/\mathbb{Q}$ be the reduced global minimal model recovered from
  $(c_4,c_6)$ by Formula CITE{formula-model-from-invariants}, and let $p$ be a
  prime of split multiplicative reduction for $E$. If $q_E\in\mathbb{Q}_p$ is
  the Tate period and $\log_p$ is the Iwasawa $p$-adic logarithm with
  $\log_p(p)=0$, this table gives the Mazur-Tate-Teitelbaum invariant
  $\mathcal{L}_E=\log_p(q_E)/\operatorname{ord}_p(q_E)$ CITE{MTT}.
Keywords:
  - L-invariant
  - Mazur-Tate-Teitelbaum invariant
  - MTT invariant
  - Tate period
  - exceptional zero
Parameters:
  N:
    type: Z
    title: conductor of $E$
    display: $N$
    constraints: $N\geq1$
  c4:
    type: Z
    title: invariant $c_4$ of the reduced global minimal model of $E$
    display: $c_4$
  c6:
    type: Z
    title: invariant $c_6$ of the reduced global minimal model of $E$
    display: $c_6$
  p:
    type: Z
    title: prime of split multiplicative reduction
    display: $p$
    constraints: $p$ is prime and $E$ has split multiplicative reduction at $p$
Comments:
  comment-index: >-
    The curve is identified by $N$, $c_4$ and $c_6$. Each entry comment gives
    the Cremona label from Sage's mini Cremona database CITE{SageCremona} and
    the corresponding LMFDB CITE{LMFDB} label.
  comment-log-branch: >-
    The logarithm is Iwasawa's branch, so $\log_p(p)=0$. With another branch,
    the quotient $\log_p(q_E)/\operatorname{ord}_p(q_E)$ changes by the chosen
    value of $\log_p(p)$.
  comment-precision: >-
    The $p$-adic precision is the least $n$ with $p^n\geq10^{50}$, for example
    $O(2^{167})$, $O(3^{105})$, $O(5^{72})$, $O(7^{60})$ and $O(11^{49})$.
Formulas:
  formula-model-from-invariants: >-
    For the reduced models in this table, $b_2$ is the unique element of
    $\{-4,-3,0,1,4,5\}$ with $b_2\equiv -c_6\pmod{12}$,
    $b_4=(b_2^2-c_4)/24$, and
    $b_6=(-c_6-b_2^3+36b_2b_4)/216$. The model has
    $a_1\equiv b_2\pmod 2$, $a_3\equiv b_6\pmod 2$ with
    $a_1,a_3\in\{0,1\}$ and $a_2\in\{-1,0,1\}$, and
    $a_2=(b_2-a_1^2)/4$, $a_4=(b_4-a_1a_3)/2$ and
    $a_6=(b_6-a_3^2)/4$.
  formula-l-invariant: >-
    If $q_E$ is the Tate period of $E$ at the split multiplicative prime $p$,
    then $\mathcal{L}_E=\log_p(q_E)/\operatorname{ord}_p(q_E)$, where
    $\log_p$ is the branch with $\log_p(p)=0$.

Title: Faltings heights of elliptic curves over $\mathbb{Q}$
Definition: >-
  The Faltings height $h(E)$ CITE{Wiki} of an elliptic curve
  $E/\mathbb{Q}$ is $-\frac12\log A$, where $A$ is the period-lattice area
  in CITE{formula-area}. This table gives $h(E)$ and, when different, the
  stable Faltings height $h_{\mathrm{st}}(E)$ in the LMFDB and Sage
  normalisation.
Parameters:
  N:
    type: Z
    title: conductor
    display: $N$
    constraints: $N\geq 1$
  c4:
    type: Z
    title: invariant $c_4$ of a minimal model of $E$
    display: $c_4$
  c6:
    type: Z
    title: invariant $c_6$ of a minimal model of $E$
    display: $c_6$
  quantity:
    type: Symbolic
    title: quantity
    display: quantity
    values:
      h: $h(E)$
      stable: $h_{\mathrm{st}}(E)$
Comments:
  comment-normalisation: >-
    Sage CITE{SageFaltings} notes that some authors use
    $-\frac1{2\pi}\log A$ instead; this table uses the LMFDB convention
    CITE{LMFDBHeight}.
  comment-stable-rows: >-
    For a semistable curve $h_{\mathrm{st}}(E)=h(E)$ by
    CITE{formula-semistable}, so its $h_{\mathrm{st}}(E)$ row is omitted; a
    row with quantity `stable` therefore records a curve that is not
    semistable.
  comment-labels: >-
    The curve is identified by $N$, $c_4$ and $c_6$. A model of
    $E/\mathbb{Q}$ is given by $E: y^2 = x^3 - 27 c_4 x - 54 c_6$, as in
    HREF{Real_periods_of_elliptic_curves_over_Q_of_rank_1}[the rank-one
    real-period table]. Each entry comment gives both labels for the curve.
    The LMFDB curve number and the Cremona curve number may differ
    CITE{SageCremonaLabels}: LMFDB 11.a2 is Cremona 11a1
    CITE{LMFDBData11a2}.
  comment-isogeny-classes: >-
    The Faltings height $h(E)$ is not constant on an isogeny class. In the
    isogeny class 11.a, the Faltings ratios $\rho(E)$ of LMFDB 11.a1,
    11.a2 and 11.a3 are $25$, $5$ and $1$. By
    CITE{formula-isogeny-height}, a $4$-isogeny with $c=2$ leaves the
    height unchanged, which is why LMFDB 15.a4 and 15.a5 hold the same
    value; a quadratic twist by $-1$ does the same across classes, as for
    LMFDB 20.a1 and 80.b1.
Formulas:
  formula-area: >-
    If $\omega_1,\omega_2$ is a $\mathbb{Z}$-basis of the period lattice
    $\Lambda_E$ of the Néron differential $dx/(2y+a_1x+a_3)$ on a global
    minimal model of $E$ CITE{Silverman}, then
    $A=|\operatorname{Im}(\overline{\omega_1}\omega_2)|$ and
    $h(E)=-\frac12\log A$.
  formula-stable-height: >-
    $h_{\mathrm{st}}(E)=h(E)+\frac1{12}
    (\log\operatorname{denom}(j(E))-\log|\Delta_{\min}(E)|)$.
  formula-semistable: >-
    If $E$ is semistable, then $h_{\mathrm{st}}(E)=h(E)$.
  formula-isogeny-height: >-
    If $\varphi:E\to E'$ is an isogeny over $\mathbb{Q}$ of degree $d$ and
    $\varphi^*\omega_{E'}=c\,\omega_E$ for Néron differentials, then
    $h(E')=h(E)+\frac12\log d-\log|c|$.
  formula-faltings-ratio: >-
    If $E_{\min}$ is the curve of minimal Faltings height in a
    $\mathbb{Q}$-isogeny class, then
    $\rho(E)=\exp(2(h(E)-h(E_{\min})))$ is the index of
    $\Lambda_{E_{\min}}$ in $\Lambda_E$ CITE{LMFDBRatio} CITE{Stevens}.
Programs:
  program-sage:
    language: Sage
    code: |-
      E = EllipticCurve([0, -1, 1, -10, -20])       # Cremona 11a1, LMFDB 11.a2
      E.faltings_height(prec=150)
      E.faltings_height(stable=True, prec=150)

      F = EllipticCurve([0, 0, 1, -270, -1708])     # Cremona 27a2, LMFDB 27.a1
      F.faltings_height(prec=150)
      F.faltings_height(stable=True, prec=150)

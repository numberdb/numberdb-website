Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every elliptic curve over $\mathbb{Q}$ with conductor
    $N\leq100$, one row for $h(E)$ and, for curves that are not semistable,
    a second row for $h_{\mathrm{st}}(E)$
  rigour details: >-
    The generator enumerates the $306$ curves in Sage's mini Cremona database
    with conductor $N\leq100$ and adds stable-height entries for the $160$
    non-semistable curves. For each curve it computes the period-lattice area
    in Sage's RealBallField from the AGM formulas used by Sage's period
    lattice code CITE{SagePeriodSource}, with $192$ guard bits beyond the
    $100$ written digits. The values were compared on every entry with
    Sage's own faltings_height() CITE{SageFaltings};
    CITE{formula-stable-height} was checked on every stable-height row;
    CITE{formula-faltings-ratio} was checked on every isogeny class in the
    range; and the values for LMFDB 11.a1, 11.a2, 11.a3 and 27.a1 were
    compared with the LMFDB JSON data pages CITE{LMFDBData11a1}
    CITE{LMFDBData11a2} CITE{LMFDBData11a3} CITE{LMFDBData27a1}.
Display properties:
  number-header: height
  group parameters: [['N'], ['c4', 'c6'], ['quantity']]

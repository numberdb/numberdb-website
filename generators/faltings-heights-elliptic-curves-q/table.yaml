Title: Faltings heights of elliptic curves over $\mathbb{Q}$
Definition: >-
  For an elliptic curve $E/\mathbb{Q}$ with global minimal model and Neron
  differential $\omega=dx/(2y+a_1x+a_3)$, this table gives the Faltings height
  $h(E)$ CITE{Wiki} and the stable Faltings height $h_{\mathrm{st}}(E)$,
  defined by CITE{formula-area} and CITE{formula-stable-height} with the
  period lattice of $\omega$, in the LMFDB and Sage normalisation
  CITE{LMFDBHeight} CITE{SageFaltings}.
Parameters:
  N:
    type: Z
    title: conductor
    display: $N$
    constraints: $N\geq 1$
  c4:
    type: Z
    title: fourth c-invariant
    display: $c_4$
  c6:
    type: Z
    title: sixth c-invariant
    display: $c_6$
  quantity:
    type: Symbolic
    title: quantity
    display: quantity
    values:
      h: $h(E)$
      stable: $h_{\mathrm{st}}(E)$
Comments:
  comment-normalisation: >-
    The normalisation is $-\frac12\log A$, where $A$ is the period-lattice
    area for a global minimal model. Sage CITE{SageFaltings} notes that some
    authors use $-\frac1{2\pi}\log A$ instead; this table uses the LMFDB
    convention CITE{LMFDBHeight}.
  comment-stable-rows: >-
    If $E$ is semistable, then
    $\operatorname{denom}(j)=|\Delta_{\min}|$ and
    $h_{\mathrm{st}}(E)=h(E)$. Those stable-height rows are omitted rather
    than stored twice. A row with quantity `stable` therefore records a
    non-semistable curve.
  comment-labels: >-
    The curve is identified by $N$, $c_4$ and $c_6$, as in the neighbouring
    elliptic-curve tables. Each entry comment gives both labels for the
    curve. The LMFDB curve number and the Cremona curve number may differ:
    LMFDB $11.a2$ is Cremona $11a1$ CITE{LMFDBData11a2}.
  comment-isogeny-classes: >-
    The unstable height is not constant on an isogeny class. In the isogeny
    class $11.a$, the Faltings ratios $\rho(E)$ of LMFDB $11.a1$, $11.a2$
    and $11.a3$ are $25$, $5$ and $1$.
Formulas:
  formula-area: >-
    If $\omega_1,\omega_2$ is a $\mathbb{Z}$-basis of $\Lambda_E$, then
    $A=|\operatorname{Im}(\overline{\omega_1}\omega_2)|$ and
    $h(E)=-\frac12\log A$.
  formula-stable-height: >-
    $h_{\mathrm{st}}(E)=h(E)+\frac1{12}
    (\log\operatorname{denom}(j(E))-\log|\Delta_{\min}(E)|)$.
  formula-semistable: >-
    If $E$ is semistable, then $h_{\mathrm{st}}(E)=h(E)$.
  formula-faltings-ratio: >-
    If $E_{\min}$ is the curve of minimal Faltings height in a
    $\mathbb{Q}$-isogeny class, then
    $\rho(E)=\exp(2(h(E)-h(E_{\min})))$ is the index of the Neron lattice of
    $E_{\min}$ in the Neron lattice of $E$ CITE{LMFDBRatio} CITE{Stevens}.
Programs:
  program-sage:
    language: Sage
    code: |-
      E = EllipticCurve([0, -1, 1, -10, -20])       # Cremona 11a1, LMFDB 11.a2
      E.faltings_height(prec=150)
      E.faltings_height(stable=True, prec=150)

      F = EllipticCurve([0, 0, 1, -270, -1708])     # LMFDB 27.a1
      F.faltings_height(prec=150)
      F.faltings_height(stable=True, prec=150)

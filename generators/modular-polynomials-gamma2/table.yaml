Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every prime $\ell\ne3$ with $\ell\leq23$
  rigour details: >-
    The generator computes exact $q$-expansions of $\gamma_2(\tau)$ and
    $\gamma_2(\ell\tau)$ from the branch in Formula CITE{formula-branch} and
    finds the one-dimensional rational kernel among monomials $x^a y^b$ with
    $0\leq a,b\leq\ell+1$ and
    $\ell a+b\equiv\ell+1\pmod 3$. For the rows in this table, the resulting
    polynomial is irreducible over $\mathbb Q(y)$. The result is primitive over
    $\mathbb Z$, has leading coefficient $1$ in $x^{\ell+1}$, and is compared
    with PARI/GP's exact `polmodular(ell,5)` output CITE{PARIpolmodular}.
Display properties:
  number-header: $\Phi^{\gamma_2}_\ell(x,y)$

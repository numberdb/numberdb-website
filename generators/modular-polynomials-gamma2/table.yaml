Title: Modular polynomials for $\gamma_2=\sqrt[3]{j}$
Definition: >-
  Let $\gamma_2$ be the branch with $\gamma_2(\tau)^3=j(\tau)$ and
  $\gamma_2(\tau)=q^{-1/3}(1+O(q))$, where $j$ is the modular $j$-invariant.
  The entry is the monic minimal polynomial of $\gamma_2(\ell\tau)$ over
  $\mathbb Q(\gamma_2(\tau))$.
Parameters:
  ell:
    type: Z
    title: prime level
    display: $\ell$
    constraints: $\ell$ is prime and $\ell\ne3$
Comments:
  comment-normalisation: >-
    The polynomial lies in $\mathbb Z[x,y]$ and is normalised so that the
    coefficient of $x^{\ell+1}$ is $1$.
  comment-variables: >-
    The variable $x$ is the value at $\ell\tau$, and $y$ is the value at
    $\tau$; for the rows in this table each polynomial is symmetric,
    $\Phi^{\gamma_2}_\ell(x,y)=\Phi^{\gamma_2}_\ell(y,x)$.
  comment-pari: >-
    PARI/GP calls this invariant number $5$ in `polmodular` CITE{PARIpolmodular}.
  comment-level: >-
    $\gamma_2$ has level $3$, so this table uses prime levels $\ell$ coprime to
    $3$; PARI/GP's `polmodular(3,5)` is correspondingly undefined.
Formulas:
  formula-branch: >-
    If $q=e^{2\pi i\tau}$, then
    $\gamma_2(\tau)=q^{-1/3}(1+O(q))$ and $\gamma_2(\tau)^3=j(\tau)$.
  formula-relation: >-
    $\Phi^{\gamma_2}_\ell(\gamma_2(\ell\tau),\gamma_2(\tau))=0$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      \\ prime level 11, invariant 5 = gamma_2; PARI/GP prints the polynomial nested in x
      polmodular(11, 5)

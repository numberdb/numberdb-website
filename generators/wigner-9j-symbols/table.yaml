Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every canonical symmetry class with all $j_i\leq2$ whose value is
    not zero, other than the symbol with every $j_i=0$; this cutoff covers the
    small angular momenta through $2$ and gives 230 rows
  rigour details: |-
    The generator evaluates CITE{formula-6j-sum}. Each Wigner $6j$ symbol in the sum is evaluated from Racah's finite sum with exact rational arithmetic, using integer-scaled angular momenta so every factorial argument is checked before it is used. The generator keeps each term as a rational coefficient times the square root of a squarefree rational number. Sums that are rational are written exactly; the remaining real algebraic values are converted to arb balls for storage.

    Before any entry is returned, the generator recomputes every row at all 72 symmetry images and requires the phase rule in CITE{comment-symmetry}. It checks every row against the finite sum of Wigner $3j$ symbols in CITE{formula-3j-sum}, and it checks the zero-entry formula CITE{formula-zero-entry} wherever that formula applies.
Display properties:
  number-header: $\begin{Bmatrix}j_1&j_2&j_3\\j_4&j_5&j_6\\j_7&j_8&j_9\end{Bmatrix}$

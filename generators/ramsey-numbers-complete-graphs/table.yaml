# Draft document for T439. Publishing is a person's act.
Title: Ramsey numbers $R(k_1,\ldots,k_r)$ of complete graphs
Definition: >-
  The Ramsey number $R(k_1,\ldots,k_r)$ CITE{Rad} CITE{Wiki} is the least
  positive integer $N$ such that every $r$-colouring of the edges of $K_N$
  contains a monochromatic clique $K_{k_i}$ in some colour $i$.
Keywords:
  - Ramsey number
  - complete graph Ramsey number
  - multicolor Ramsey number
  - graph Ramsey number
Parameters:
  r:
    type: Z
    title: number of colours
    display: $r$
    constraints: $r\geq 2$
  k:
    type: Symbolic
    title: clique-size tuple
    display: $k_1,\ldots,k_r$
    constraints: a weakly increasing tuple of $r$ positive integers, written with commas
Comments:
  comment-order: >-
    The tuple is stored weakly increasing because $R(k_1,\ldots,k_r)$ is fixed
    under permutations of its arguments.
  comment-convention: >-
    The entries use the forcing convention: $R(k_1,\ldots,k_r)$ is the least
    $N$ that forces a monochromatic clique. Some sources use the avoidance
    convention: the largest order of a complete graph whose edge-colouring
    avoids all listed monochromatic cliques, which is one less.
  comment-induced: >-
    DS1 defines graph Ramsey numbers using subgraphs that are not necessarily
    induced. For complete graphs, the non-induced subgraph condition is the
    usual monochromatic clique condition.
  comment-bounds: >-
    An entry written as an integer interval $[a,b]$ means that DS1 revision #18
    records a construction proving $R(k_1,\ldots,k_r)\geq a$ and a proof of
    $R(k_1,\ldots,k_r)\leq b$.
  comment-lower-only: >-
    DS1 revision #18 also records one-sided lower bounds for larger complete
    graph Ramsey numbers. Those are not entries here because this table stores
    integers and closed integer intervals.
Formulas:
  formula-trivial: >-
    $R(1,t)=1$ and $R(2,t)=t$ for every $t\geq1$.
  formula-recursive-upper: >-
    $R(k_1,\ldots,k_r)\leq 2-r+\sum_{i=1}^r
    R(k_1,\ldots,k_i-1,\ldots,k_r)$, with strict inequality when the right side
    is even and at least one summand is even CITE{Rad}.
Similar tables:
  - table: HREF{Diagonal_Ramsey_numbers}[Diagonal Ramsey numbers]
    relation: its nontrivial entries through $n=7$ are the diagonal numbers $R(n,n)$ from this table, and it carries the diagonal bounds on to $n=10$
Links:
  Wiki:
    title: "Wikipedia: Ramsey's theorem"
    url: "https://en.wikipedia.org/wiki/Ramsey%27s_theorem"
Tags:
  - combinatorics
Data properties:
  type: Z
  rigour: proven
  repeats: HREF{Diagonal_Ramsey_numbers}[Diagonal Ramsey numbers]
  rigour details: >-
    The exact values and integer intervals are transcribed from DS1 revision
    #18 CITE{Rad}. For two colours, the lower endpoints for $R(k_1,k_2)$ with
    $3\leq k_1\leq7$ and $k_1\leq k_2\leq13$ are from Table Ia; the upper
    endpoints for $k_1=3$ are from Table Ia, and the upper endpoints for
    $4\leq k_1\leq7$ are the Angeltveit-McKay bounds in Table Ib. The
    multicolour exact values and two-sided bounds are the values and ranges
    stated in section 6.1. The generator checks the diagonal rows against
    HREF{Diagonal_Ramsey_numbers}[the diagonal Ramsey numbers] and checks the
    recursive upper bound $R(k_1,\ldots,k_r)\leq
    2-r+\sum_{i=1}^r R(k_1,\ldots,k_i-1,\ldots,k_r)$ on every multicolour
    interval whose upper endpoint it can check from earlier stored rows. The
    width of an interval is ignorance about the exact Ramsey number, not
    numerical error.
  complete: 'no'
  complete-note: >-
    it holds every DS1 entry $R(k_1,k_2)$ with $3\leq k_1\leq7$ and
    $k_1\leq k_2\leq13$, exact where DS1 gives an exact value and as an
    interval otherwise, and the complete-graph multicolour exact values or
    explicit two-sided bounds stated in DS1 revision #18, section 6.1; it
    omits the trivial values involving a clique of size 1 or 2, which are
    given by $R(1,t)=1$ and $R(2,t)=t$

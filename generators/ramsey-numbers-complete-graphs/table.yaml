Data properties:
  type: Z
  rigour: proven
  repeats: HREF{Diagonal_Ramsey_numbers}
  rigour details: >-
    The exact values and integer intervals are transcribed from DS1 revision
    #18 CITE{Rad}. For two colours, the lower endpoints through
    $3\leq k\leq7$ and $k\leq l\leq13$ are from Table Ia; the upper endpoints
    for $k=3$ are from Table Ia, and the upper endpoints for $4\leq k\leq7$
    are the Angeltveit-McKay bounds in Table Ib. The multicolour exact values
    and two-sided bounds are the values and ranges stated in section 6.1. The
    generator checks the trivial identities $R(2,t)=t$, the diagonal rows
    against T6, and the displayed recursive upper bound on every multicolour
    interval whose upper endpoint it can check from earlier stored rows. The
    width of an interval is ignorance about the exact Ramsey number, not
    numerical error.
  complete: 'no'
  complete-note: >-
    it holds $R(1,1)$, every trivial two-colour value $R(2,t)$ with
    $2\leq t\leq13$, every DS1 two-sided entry $R(k,l)$ with
    $3\leq k\leq7$ and $k\leq l\leq13$, and the complete-graph multicolour
    exact values or explicit two-sided bounds stated in DS1 revision #18,
    section 6.1

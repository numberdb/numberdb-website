Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every cubic field with $|D|\leq 3000$, the 419 complex and the
    96 totally real ones
  rigour details: >-
    The fundamental units are PARI's, from bnfinit and certified by
    bnfcertify on every field, which removes the generalised Riemann
    hypothesis that bnfinit assumes. Each unit is taken exactly, as a
    polynomial in $a$ with rational coefficients, and checked to be an
    algebraic integer of norm $\pm1$; the real roots of the reduced
    polynomial are isolated in interval arithmetic at 461 bits, the unit is
    evaluated at them by Horner's rule in balls, and the logarithms and the
    determinant are arb's, so the digits written are those the ball supports
    (the worst entry, $D=1772$, supports 133). PARI's floating regulator is
    not used for the value. The enumeration rests on Hunter's theorem
    CITE{Cohen1993}: every cubic field with $|D|\leq 3000$ is generated by an
    algebraic integer of trace $0$ or $1$ whose minimal polynomial
    $x^3+a_2x^2+a_1x+a_0$ has $|a_1|\leq 18$ and $|a_0|\leq 43$, the bound
    using Hermite's constant $\gamma_2=2/\sqrt3$; the fields found in that
    box, 419 complex and 96 totally real, are exactly the terms of OEIS
    A023679 CITE{OEIS-neg} and A006832 CITE{OEIS-pos} up to 3000 counted
    with multiplicity, and the
    totally real ones are also those of Sage's enumerate_totallyreal_fields_prim.
    Outside the generator, when this was written, the class number formula
    from $h_K$ and each value was compared on all 515 fields with the residue
    that PARI's lfunrootres computes from the Dedekind zeta function, a
    computation sharing no code with bnfinit; 21 values with the twelve
    digits on their LMFDB pages CITE{LMFDB-complex} CITE{LMFDB-real}; the
    entry for $D=-23$ with the 34 digits of
    OEIS A202539 and with the logarithm of A060006; the four cyclic fields
    of conductor at most $29$ with $|L(1,\chi)|^2$ for both cubic characters
    from the stored table of Dirichlet $L$-values; and the pairs of units that Wikipedia and the
    LMFDB give for $D=49$ were shown to have the same regulator as the pair
    here. The controls that must fail failed.

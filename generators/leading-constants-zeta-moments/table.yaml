Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds $k=1/2,1,3/2,\ldots,6$ and every integer $7\leq k\leq12$
  rigour details: >-
    The generator computes $a_k$ by the same Euler-product method as the
    arithmetic-factor table, multiplies by the Barnes $G$-function factor
    computed in arb ball arithmetic, and writes only digits that agree between
    140-digit and 160-digit computations. The checks include $c_1=1$,
    $c_2=1/(2\pi^2)$, the integer rows against PARI's `prodeulerrat`
    CITE{PARIProdEulerRat}, and the computed $a_k$ values against
    HREF{T377}[the arithmetic-factor table].

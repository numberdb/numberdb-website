# Draft document for T378, Leading constants in the moments of the Riemann
# zeta function. It was created through the API with X-Draft: yes and
# Numbers: [] so generate.py can fill it once. Publishing is a person's act.
Title: Leading constants $c_k$ of the moments of the Riemann zeta function
Definition: >-
  For $k>0$ rational, $c_k=a_kG(1+k)^2/G(1+2k)$, where $a_k$ is the
  arithmetic factor in CITE{formula-ak}. It is the leading constant in the
  conjectured asymptotic for the averaged $2k$-th moment of $\zeta(s)$
  CITE{WikiZeta}.
Keywords:
  - Riemann zeta moment
  - zeta moment
  - leading constant
  - Keating-Snaith
  - CFKRS
  - random matrix factor
Parameters:
  k:
    type: Q
    title: half moment exponent
    display: $k$
    constraints: $k>0$
Comments:
  comment-indexing: >-
    The parameter is $k$, not the full exponent $2k$: $k=1$ is the second
    moment and $k=2$ is the fourth moment.
  comment-conjecture: >-
    The product defining $a_k$ and the Barnes $G$-function factor define
    $c_k$ unconditionally. The moment asymptotic is a theorem for $k=1$ and
    $k=2$; the other rows are constants in the Keating-Snaith and CFKRS
    conjectures CITE{KeatingSnaith} CITE{CFKRS}.
Formulas:
  formula-moment: >-
    Conjecturally, $\frac1T\int_0^T |\zeta(1/2+it)|^{2k}\,dt\sim
    c_k(\log T)^{k^2}$.
  formula-factor: >-
    $c_k=a_k f_U(k)$, where $f_U(k)=G(1+k)^2/G(1+2k)$.
  formula-ak: >-
    $a_k=\prod_p \left(1-\frac1p\right)^{k^2}
    \sum_{m=0}^{\infty}
    \left(\frac{\Gamma(m+k)}{m!\Gamma(k)}\right)^2p^{-m}$, where the product
    runs over rational primes CITE{CFKRS}.
  formula-integer-random-matrix: >-
    If $k$ is a positive integer, then
    $f_U(k)=\prod_{j=0}^{k-1}\frac{j!}{(j+k)!}$ and
    $(k^2)!f_U(k)=1,2,42,24024,701149020,\ldots$ for
    $k=1,2,3,4,5,\ldots$.
  formula-controls: >-
    $c_1=1$ and $c_2=1/(2\pi^2)$.
Programs:
  program-pari-integers:
    language: PARI/GP
    code: |-
      \\ positive integer k only: the finite Euler-product formula is not valid for half-integers
      default(realprecision, 140)
      k = 3
      a = prodeulerrat((1 - 1/p)^((k - 1)^2) *
        sum(j = 0, k - 1, binomial(k - 1, j)^2/p^j), 1, 2)
      f = prod(j = 0, k - 1, factorial(j)/factorial(j + k))
      a * f

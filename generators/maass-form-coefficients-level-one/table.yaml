Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $a_p$ for the first ten LMFDB rigorous Maass forms of level $1$,
    weight $0$ and trivial character, for every prime $p<50$
  rigour details: >-
    The generator uses the LMFDB all-data downloads CITE{LMFDBDownloadFirst} as
    the source format and stores the centers and error bounds for the prime
    coefficient rows. The LMFDB reliability statement says that each rigorous
    Maass form is proven to approximate a true Maass form and that the decimal
    coefficients are proven close to the coefficients of an actual Maass form
    CITE{LMFDBReliability}. The LMFDB completeness statement says that each
    database entry gives error intervals containing the data for exactly one
    Maass form CITE{LMFDBCompleteness}. The generator parses each decimal
    center and source radius as an exact rational number and returns a Sage
    interval widened by one unit in the last displayed decimal place, so that
    the stored ball contains the LMFDB interval after the center is rounded.
    It writes $60$ significant digits. Before the draft
    was created, the truncated spectral-parameter labels were compared with
    T84, and the source coefficients with composite indices were checked
    against the Hecke relations in CITE{formula-hecke} wherever the needed
    composite coefficient was among the $1000$ downloaded coefficients.
Display properties:
  number-header: $a_p$
  group parameters: [['R'], ['p']]

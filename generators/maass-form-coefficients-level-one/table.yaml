Title: Fourier coefficients of Maass forms of level 1
Definition: >-
  Let $f$ be a Maass cusp form of weight $0$ for
  $\mathrm{SL}_2(\mathbb{Z})$, ordered by its positive spectral parameter $R$
  and normalized by $a_1=1$. This table gives the Fourier coefficient $a_p$
  at a prime $p$ in the expansion described by the LMFDB coefficient knowl
  CITE{LMFDBCoefficients} for Maass forms.
Parameters:
  R:
    type: Symbolic
    title: truncated spectral parameter
    display: $R'$
    constraints: >-
      $R'$ is the truncated spectral-parameter label used for the corresponding
      row of HREF{Spectral_parameters_of_Maass_forms_of_level_1}[T84]
  p:
    type: Z
    title: prime
    display: $p$
    constraints: $p$ is prime
Comments:
  comment-index: >-
    The first parameter is a label, not an approximation to be used in a
    computation. It is the first five characters of the LMFDB spectral
    parameter string, matching the entry keys in
    HREF{Spectral_parameters_of_Maass_forms_of_level_1}[the spectral-parameter
    table].
  comment-symmetry: >-
    For even forms the Fourier expansion uses
    $\cos(2\pi n x)$, and for odd forms it uses $\sin(2\pi n x)$. Each entry
    with $p=2$ gives the LMFDB label, the symmetry and the Fricke sign for that
    form.
  comment-range: >-
    Composite coefficients are omitted. They are determined from the prime
    coefficients by the Hecke relations stated in CITE{formula-hecke} for
    these forms.
Formulas:
  formula-expansion: >-
    If $f$ is even, then
    $f(x+iy)=\sum_{n\geq1}a_n\sqrt{y}K_{iR}(2\pi n y)\cos(2\pi n x)$.
    If $f$ is odd, replace the cosine by $\sin(2\pi n x)$.
  formula-lfunction: >-
    The coefficients define the Dirichlet series
    $L(f,s)=\sum_{n\geq1}a_n n^{-s}$.
  formula-hecke: >-
    For the normalized level-one Hecke eigenforms here,
    $a_{mn}=a_m a_n$ when $(m,n)=1$, and $a_{p^2}=a_p^2-1$ for each prime $p$.
Programs:
  program-python:
    language: Python
    code: |-
      from urllib.request import urlopen

      url = "https://www.lmfdb.org/ModularForm/GL2/Q/Maass/download_coefficients/1.0.1.1.1"
      text = urlopen(url).read().decode()
      body = text.split("\n", 2)[2].strip()
      coefficients = body[1:-1].split(", ")
      coefficients[1]       # a_2 with its source error

Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds $L_{\Delta(k,n)}(t)$ for every pair with $4\leq n\leq20$
    and $2\leq k\leq\lfloor n/2\rfloor$; the range stops at $n=20$ because the longest
    stored polynomial, $L_{\Delta(9,20)}(t)$, has 682 characters
  rigour details: The Ehrhart polynomials are computed exactly from CITE{formula-inclusion-exclusion},
    an inclusion-exclusion count of bounded integer compositions. The rows were checked
    by direct coefficient counts from CITE{formula-coefficient}; their normalized
    volumes were checked against Eulerian numbers through CITE{formula-volume}; and
    the symmetry $\Delta(k,n)\cong\Delta(n-k,n)$ was checked on the computed polynomials.

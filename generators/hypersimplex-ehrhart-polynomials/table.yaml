Title: Ehrhart and $h^*$-polynomials of the hypersimplices
Definition: >-
  The hypersimplex $\Delta(k,n)$ is the lattice polytope
  $\{x\in[0,1]^n:x_1+\cdots+x_n=k\}$, equivalently the convex hull of the
  $0$-$1$ vectors in $\mathbb{R}^n$ with exactly $k$ ones
  CITE{WikiHypersimplex}. The table stores its Ehrhart polynomial
  $L_{\Delta(k,n)}(t)$ and its $h^*$-polynomial CITE{WikiEhrhart}.
Keywords:
  - hypersimplex
  - Ehrhart polynomial
  - Ehrhart h-star polynomial
  - Ehrhart h* polynomial
  - delta polynomial
  - uniform matroid
  - Veronese type
  - Grassmannian
  - dice sums
Parameters:
  n:
    type: Z
    title: ambient dimension
    display: $n$
    constraints: $n$ is an integer with $n\geq4$
  k:
    type: Z
    title: coordinate sum
    display: $k$
    constraints: $k$ is an integer with $2\leq k\leq\lfloor n/2\rfloor$
  form:
    type: Symbolic
    title: form of the polynomial
    display: form
    constraints: either `ehrhart` or `h-star`
    values:
      ehrhart: $L_{\Delta(k,n)}(t)$
      h-star: $h^*_{\Delta(k,n)}(z)$
Comments:
  comment-lattice: >-
    The lattice is the affine lattice cut out by $x_1+\cdots+x_n=k$ inside
    $\mathbb{Z}^n$.
  comment-symmetry: >-
    The map $x\mapsto\mathbf{1}-x$ identifies $\Delta(k,n)$ with
    $\Delta(n-k,n)$, so this table stores one representative of each pair.
  comment-standard-simplex: >-
    The omitted case $k=1$ is the standard simplex, with
    $L(t)=\binom{t+n-1}{n-1}$ and $h^*(z)=1$.
Formulas:
  formula-coefficient: >-
    $L_{\Delta(k,n)}(t)$ is the coefficient of $q^{kt}$ in
    $(1+q+\cdots+q^t)^n$.
  formula-inclusion-exclusion: >-
    $L_{\Delta(k,n)}(t)=\sum_{i=0}^{k-1}(-1)^i\binom{n}{i}
    \binom{(k-i)t-i+n-1}{n-1}$.
  formula-series: >-
    $\sum_{t\geq0}L_{\Delta(k,n)}(t)z^t=
    h^*_{\Delta(k,n)}(z)/(1-z)^n$.
  formula-volume: >-
    $h^*_{\Delta(k,n)}(1)$ is the Eulerian number $A(n-1,k-1)$, the
    normalized volume of $\Delta(k,n)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb

      from math import factorial

      from sage.arith.misc import binomial
      from sage.rings.rational_field import QQ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      T = PolynomialRing(QQ, "t")
      t = T.gen()

      def binomial_polynomial(f, r):
          value = T.one()
          for j in range(r):
              value *= f - QQ(j)
          return value / QQ(factorial(r))

      def hypersimplex_ehrhart(k, n):
          return sum((-1)**i * binomial(n, i) *
                     binomial_polynomial((k - i) * t - i + n - 1, n - 1)
                     for i in range(k))

      hypersimplex_ehrhart(2, 6)

Title: Ehrhart polynomials of the hypersimplices
Definition: The hypersimplex $\Delta(k,n)$ is the lattice polytope $\{x\in[0,1]^n:x_1+\cdots+x_n=k\}$,
  equivalently the convex hull of the $0$-$1$ vectors in $\mathbb{R}^n$ with exactly
  $k$ ones CITE{WikiHypersimplex}. The table stores its Ehrhart polynomial $L_{\Delta(k,n)}(t)$
  CITE{WikiEhrhart}.
Keywords:
- hypersimplex
- Ehrhart polynomial
- uniform matroid
- Veronese type
- Grassmannian
- dice sums
Parameters:
  n:
    type: Z
    title: ambient dimension
    display: $n$
    constraints: $n$ is an integer with $n\geq4$
  k:
    type: Z
    title: coordinate sum
    display: $k$
    constraints: $k$ is an integer with $2\leq k\leq\lfloor n/2\rfloor$
Comments:
  comment-connections: The hypersimplex $\Delta(k,n)$ is the matroid polytope of the
    uniform matroid $U_{k,n}$ CITE{WikiHypersimplex} and the moment polytope for the
    torus action on the Grassmannian $\mathrm{Gr}(k,n)$ CITE{Postnikov2018}. The coefficient
    formula CITE{formula-coefficient} says that $L_{\Delta(k,n)}(t)$ counts the ways
    $n$ dice with faces $0,1,\dots,t$ can sum to $kt$. It is also the Hilbert function
    of the squarefree Veronese algebra generated by the degree-$k$ squarefree monomials
    in $n$ variables CITE{Katzman}.
  comment-lattice: Lattice points are counted in $\mathbb{Z}^n$. Since $t\Delta(k,n)$
    lies in the hyperplane $x_1+\cdots+x_n=kt$, the normalized volume in CITE{formula-volume}
    is taken with respect to the lattice $\{x\in\mathbb{Z}^n:x_1+\cdots+x_n=0\}$.
  comment-symmetry: The map $x\mapsto\mathbf{1}-x$ identifies $\Delta(k,n)$ with $\Delta(n-k,n)$,
    so $\Delta(n-k,n)$ has the same two polynomials; for $k>n/2$, look up $\Delta(n-k,n)$.
  comment-standard-simplex: The omitted case $k=1$ is the standard simplex, with $L(t)=\binom{t+n-1}{n-1}$.
Formulas:
  formula-coefficient: $L_{\Delta(k,n)}(t)$ is the coefficient of $q^{kt}$ in $(1+q+\cdots+q^t)^n$.
  formula-inclusion-exclusion: $L_{\Delta(k,n)}(t)=\sum_{i=0}^{k-1}(-1)^i\binom{n}{i}
    \binom{(k-i)t-i+n-1}{n-1}$.
  formula-series: $\sum_{t\geq0}L_{\Delta(k,n)}(t)z^t= h^*_{\Delta(k,n)}(z)/(1-z)^n$.
  formula-volume: $h^*_{\Delta(k,n)}(1)$ is the Eulerian number $A(n-1,k-1)$, the
    number of permutations of $n-1$ letters with $k-1$ descents, and it is the normalized
    volume of $\Delta(k,n)$.
Programs:
  program-sage:
    language: Sage
    code: "n, k = 6, 2\nT = PolynomialRing(QQ, \"t\"); t = T.gen()\n\nsum((-1)**i\
      \ * binomial(n, i) * binomial((k - i)*t - i + n - 1, n - 1)\n    for i in range(k))"
Similar tables:
- table: HREF{T244}[Ehrhart $h^*$-polynomials of the hypersimplices]
  relation: gives the numerator $h^*_{\Delta(k,n)}(z)$ of the Ehrhart series; this
    table gives the counting polynomial $L_{\Delta(k,n)}(t)$, and the two determine
    each other by CITE{formula-series}. A reader holding an Ehrhart counting polynomial
    wants this table; a reader holding the numerator wants T244.
- table: HREF{T232}[Ehrhart polynomials of the Birkhoff polytopes]
  relation: the transportation-polytope Ehrhart-polynomial analogue with all row and
    column sums fixed

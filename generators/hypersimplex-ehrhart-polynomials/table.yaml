Title: Ehrhart and $h^*$-polynomials of the hypersimplices
Definition: >-
  The hypersimplex $\Delta(k,n)$ is the lattice polytope
  $\{x\in[0,1]^n:x_1+\cdots+x_n=k\}$, equivalently the convex hull of the
  $0$-$1$ vectors in $\mathbb{R}^n$ with exactly $k$ ones
  CITE{WikiHypersimplex}. The table stores its Ehrhart polynomial
  $L_{\Delta(k,n)}(t)$ and its $h^*$-polynomial CITE{WikiEhrhart}.
Keywords:
  - hypersimplex
  - Ehrhart polynomial
  - Ehrhart h-star polynomial
  - Ehrhart h* polynomial
  - delta polynomial
  - uniform matroid
  - Veronese type
  - Grassmannian
  - dice sums
Parameters:
  n:
    type: Z
    title: ambient dimension
    display: $n$
    constraints: $n$ is an integer with $n\geq4$
  k:
    type: Z
    title: coordinate sum
    display: $k$
    constraints: $k$ is an integer with $2\leq k\leq\lfloor n/2\rfloor$
  form:
    type: Symbolic
    title: form of the polynomial
    display: form
    constraints: either `ehrhart` or `h-star`
    values:
      ehrhart: $L_{\Delta(k,n)}(t)$
      h-star: $h^*_{\Delta(k,n)}(z)$
Comments:
  comment-connections: >-
    The hypersimplex $\Delta(k,n)$ is the matroid polytope of the uniform
    matroid $U_{k,n}$ CITE{WikiHypersimplex} and the moment polytope for the
    torus action on the Grassmannian $\mathrm{Gr}(k,n)$ CITE{Postnikov2018}.
    The coefficient formula CITE{formula-coefficient} says that
    $L_{\Delta(k,n)}(t)$ counts the ways $n$ dice with faces $0,1,\dots,t$
    can sum to $kt$. It is also the Hilbert function of the squarefree
    Veronese algebra generated by the degree-$k$ squarefree monomials in $n$
    variables CITE{Katzman}. The $h^*$-polynomial is also called the Ehrhart
    $\delta$-polynomial.
  comment-lattice: >-
    Lattice points are counted in $\mathbb{Z}^n$. Since $t\Delta(k,n)$ lies in
    the hyperplane $x_1+\cdots+x_n=kt$, the normalized volume in
    CITE{formula-volume} is taken with respect to the lattice
    $\{x\in\mathbb{Z}^n:x_1+\cdots+x_n=0\}$.
  comment-symmetry: >-
    The map $x\mapsto\mathbf{1}-x$ identifies $\Delta(k,n)$ with
    $\Delta(n-k,n)$, so $\Delta(n-k,n)$ has the same two polynomials; for
    $k>n/2$, look up $\Delta(n-k,n)$.
  comment-standard-simplex: >-
    The omitted case $k=1$ is the standard simplex, with
    $L(t)=\binom{t+n-1}{n-1}$ and $h^*(z)=1$.
Formulas:
  formula-coefficient: >-
    $L_{\Delta(k,n)}(t)$ is the coefficient of $q^{kt}$ in
    $(1+q+\cdots+q^t)^n$.
  formula-inclusion-exclusion: >-
    $L_{\Delta(k,n)}(t)=\sum_{i=0}^{k-1}(-1)^i\binom{n}{i}
    \binom{(k-i)t-i+n-1}{n-1}$.
  formula-series: >-
    $\sum_{t\geq0}L_{\Delta(k,n)}(t)z^t=
    h^*_{\Delta(k,n)}(z)/(1-z)^n$.
  formula-volume: >-
    $h^*_{\Delta(k,n)}(1)$ is the Eulerian number $A(n-1,k-1)$, the number of
    permutations of $n-1$ letters with $k-1$ descents, and it is the normalized
    volume of $\Delta(k,n)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      n, k = 6, 2
      T = PolynomialRing(QQ, "t"); t = T.gen()
      Z = PolynomialRing(QQ, "z"); z = Z.gen()

      L = sum((-1)**i * binomial(n, i) * binomial((k - i)*t - i + n - 1, n - 1)
              for i in range(k))
      h = (sum(L(j)*z**j for j in range(n)) * (1 - z)**n).truncate(n)
      L, h

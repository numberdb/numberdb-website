Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds both forms for every pair with $4\leq n\leq20$ and
    $2\leq k\leq\lfloor n/2\rfloor$
  rigour details: >-
    The Ehrhart polynomials are computed exactly from
    CITE{formula-inclusion-exclusion}, an inclusion-exclusion count of bounded
    integer compositions. The $h^*$-polynomials are obtained from the
    generating-function relation CITE{formula-series}. Before the draft was
    filled, the rows were checked by direct coefficient counts from
    CITE{formula-coefficient}; their normalized volumes were checked against
    Eulerian numbers; the symmetry $\Delta(k,n)\cong\Delta(n-k,n)$ was checked
    on the computed polynomials; and the rows with $k=2$ were compared with
    OEIS A275514 CITE{OEISHStar2}, whose title calls them Ehrhart coefficients
    but whose rows are the $h^*$-vectors.

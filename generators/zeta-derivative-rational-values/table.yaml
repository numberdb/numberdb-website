# Draft document for T228, values of the derivative and logarithmic derivative
# of the Riemann zeta function at rational arguments. It began as proposal 2 of
# agents/table-ideas/BATCH-2026-09-13T0847.md.
# Created through the API with X-Draft: yes, then filled by generate.py beside
# it. Publishing is a person's act.
Title: Values of the derivative $\zeta'(s)$ and logarithmic derivative $\zeta'(s)/\zeta(s)$ of the Riemann zeta function at rational numbers
Definition: >-
  $\zeta(s)$ is the Riemann zeta function, $\sum_{n\geq1}n^{-s}$ for
  $\Re(s)>1$ continued meromorphically away from its pole at $s=1$
  CITE{DLMFZeta}. The table holds its derivative $\zeta'(s)$ and its
  logarithmic derivative $\zeta'(s)/\zeta(s)$ at rational $s$.
Keywords:
  - derivative of the Riemann zeta function
  - zeta derivative
  - logarithmic derivative of the Riemann zeta function
  - von Mangoldt Dirichlet series
Parameters:
  s:
    type: Q
    title: argument
    display: $s$
    constraints: >-
      $s\in\mathbb{Q}$; $s\neq1$; for $\zeta'(s)/\zeta(s)$, also
      $\zeta(s)\neq0$
  quantity:
    type: Symbolic
    title: derivative or logarithmic derivative
    display: quantity
    values:
      derivative: $\zeta'(s)$
      logderivative: $\zeta'(s)/\zeta(s)$
Comments:
  comment-sign: >-
    $\Lambda(n)$ is the von Mangoldt function, equal to $\log p$ when $n$ is
    a positive power of a prime $p$ and to $0$ otherwise. The table holds
    $\zeta'(s)/\zeta(s)$ itself, not its negative, which is the Dirichlet
    series in CITE{formula-von-mangoldt}.
  comment-poles-zeros: >-
    The derivative $\zeta'(s)$ is finite at the trivial zeros
    $s=-2,-4,\ldots$, but the logarithmic derivative has simple poles there
    and is not listed.
Formulas:
  formula-von-mangoldt: >-
    For $\Re(s)>1$,
    $-\zeta'(s)/\zeta(s)=\sum_{n\geq1}\Lambda(n)n^{-s}$
    CITE{DLMFDirichlet}.
  formula-zero: >-
    $\zeta'(0)=-\frac12\log(2\pi)$ CITE{DLMFSpecial}.
  formula-negative-even: >-
    For $m\geq1$,
    $\zeta'(-2m)=(-1)^m\frac{(2m)!}{2(2\pi)^{2m}}\zeta(2m+1)$
    CITE{DLMFSpecial}.
  formula-bendersky: >-
    For $k\geq1$,
    $\zeta'(-k)=\frac{B_{k+1}}{k+1}H_k-\log A_k$, where
    $H_k=\sum_{j=1}^k 1/j$ and $A_k$ are the HREF{T227}[Bendersky
    constants].
  formula-reflection-logderivative: >-
    For noninteger $s$ where both logarithmic derivatives are finite,
    $\frac{\zeta'(1-s)}{\zeta(1-s)}=\log(2\pi)+\frac\pi2\tan\frac{\pi s}2-\psi(s)-\frac{\zeta'(s)}{\zeta(s)}$
    CITE{DLMFReflection}.
  formula-positive-even-derivative: >-
    For $n\geq1$,
    $\zeta'(2n)=\frac{(-1)^{n+1}(2\pi)^{2n}}{2(2n)!}\left(2n\,\zeta'(1-2n)-(\psi(2n)-\log(2\pi))B_{2n}\right)$
    CITE{DLMFSpecial}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      s = ComplexBallField(400)(QQ(1) / QQ(2))
      zeta_prime = s.zetaderiv(1)
      print(zeta_prime.real())
      print((zeta_prime / s.zeta()).real())

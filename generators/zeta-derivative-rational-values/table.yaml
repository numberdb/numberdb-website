# Draft document for T228, values of the derivative of the Riemann zeta
# function at rational arguments. It began as proposal 2 of
# agents/table-ideas/BATCH-2026-09-13T0847.md and was split from the
# logarithmic derivative table T246 before review. Publishing is a person's act.
Title: Values of the derivative $\zeta'(s)$ of the Riemann zeta function at rational numbers
Definition: >-
  $\zeta(s)$ is the Riemann zeta function, $\sum_{n\geq1}n^{-s}$ for
  $\Re(s)>1$ continued meromorphically away from its pole at $s=1$
  CITE{DLMFZeta}. The table holds its derivative $\zeta'(s)$ at rational
  $s$ where it is finite.
Keywords:
  - derivative of the Riemann zeta function
  - zeta derivative
Parameters:
  s:
    type: Q
    title: argument
    display: $s$
    constraints: $s\in\mathbb{Q}$; $s\neq1$
Comments:
  comment-trivial-zeros: >-
    The derivative $\zeta'(s)$ is finite at the trivial zeros
    $s=-2,-4,\ldots$.
Formulas:
  formula-zero: >-
    $\zeta'(0)=-\frac12\log(2\pi)$ CITE{DLMFSpecial}.
  formula-negative-even: >-
    For $m\geq1$,
    $\zeta'(-2m)=(-1)^m\frac{(2m)!}{2(2\pi)^{2m}}\zeta(2m+1)$
    CITE{DLMFSpecial}.
  formula-bendersky: >-
    For $k\geq1$,
    $\zeta'(-k)=\frac{B_{k+1}}{k+1}H_k-\log A_k$, where
    $H_k=\sum_{j=1}^k 1/j$ and $A_k$ are the HREF{T227}[Bendersky
    constants].
  formula-positive-even-derivative: >-
    For $n\geq1$,
    $\zeta'(2n)=\frac{(-1)^{n+1}(2\pi)^{2n}}{2(2n)!}\left(2n\,\zeta'(1-2n)-(\psi(2n)-\log(2\pi))B_{2n}\right)$
    CITE{DLMFSpecial}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      s = ComplexBallField(400)(QQ(1) / QQ(2))
      print(s.zetaderiv(1).real())
Similar tables:
  - table: HREF{T246}[Values of the logarithmic derivative $\zeta'(s)/\zeta(s)$ of the Riemann zeta function at rational numbers]
    relation: >-
      stores $\zeta'(s)/\zeta(s)$; dividing this table's values by
      HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[the
      corresponding values of $\zeta(s)$] gives that table where
      $\zeta(s)\neq0$, but a reader holding the quotient is likely looking
      for the logarithmic derivative table
  - table: HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[Values of the Riemann zeta function at rational numbers]
    relation: stores $\zeta(s)$ at the same kind of rational arguments, whose derivative in $s$ is recorded here
  - table: HREF{T227}[Glaisher-Kinkelin constant $A$ and Bendersky constants $A_k$]
    relation: stores the constants $A_k$ that give closed forms for $\zeta'(-k)$
  - table: HREF{Taylor_coefficients_of_completed_Riemann_zeta_function_at_1_over_2}[Taylor coefficients of the completed Riemann zeta function at 1/2]
    relation: stores derivatives of the completed zeta function at the centre of the critical strip
  - table: HREF{Values_of_the_Hurwitz_zeta_function_at_pairs_of_rational_numbers}[Values of the Hurwitz zeta function at pairs of rational numbers]
    relation: $\zeta(s)$ is the Hurwitz zeta function at $x=1$

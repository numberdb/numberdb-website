Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value is computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=96)` bits. The imaginary part is required
    to contain zero before the real part is returned. The entries are checked
    against the values of $\zeta(s)$ in
    HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[the zeta
    table], the identities in CITE{formula-zero} and
    CITE{formula-negative-even}, and independent mpmath computations at
    selected half-integer arguments.
  complete: 'no'
  complete-note: >-
    it holds both quantities for every rational argument $s=a/b$ in lowest
    terms with $b\leq4$ and $-20\leq s\leq20$ at which the quantity is finite
Display properties:
  number-header: value

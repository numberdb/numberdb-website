Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every odd exponent $p$ with $1\leq p\leq 49$
  rigour details: >-
    The generator constructs $F_p(a)$ by exact interpolation at
    $a=N(N+1)/2$ for $0\leq N\leq (p+1)/2$, with exact integer sums as the
    ordinates. Before the draft was created, the entries were checked against
    CITE{formula-bernoulli-polynomials} for every odd $p\leq 49$, against
    OEIS A093556 CITE{OEISnumerators} and A093557 CITE{OEISdenominators} for
    $m\leq 11$, against the small polynomials and inverse identities in
    CITE{Wiki}, against CITE{formula-even-powers} for $m\leq 12$, and against
    OEIS A000537 CITE{OEIScubes} for the cubic-sum values with $N\leq 100$.

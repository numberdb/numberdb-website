Title: Faulhaber polynomials $F_p(a)$
Definition: >-
  For a positive odd integer $p$, the Faulhaber polynomial $F_p(a)$ is the
  polynomial in $\mathbb{Q}[a]$ with
  $F_p(N(N+1)/2)=\sum_{k=1}^{N}k^p$ for every positive integer $N$, where
  $a=N(N+1)/2$ is the triangular number CITE{Wiki}.
Parameters:
  p:
    type: Z
    title: odd exponent
    display: $p$
    constraints: $p$ is a positive odd integer
Comments:
  comment-index: >-
    The table is indexed by the exponent $p=2m-1$, rather than by $m$,
    because the exponent is what names the power sum. With $m=(p+1)/2$, the
    polynomial $F_p(a)$ has degree $m$.
  comment-variable: >-
    This table uses the triangular number $a=N(N+1)/2$. Knuth writes
    $u=N(N+1)=2a$ CITE{Knuth}; the conversion from his coefficients is stated
    in CITE{formula-knuth}.
  comment-even-powers: >-
    Even power sums are not entries here, because they are not polynomials in
    $a$ alone. They are polynomials in $N$ and $a$, as in
    CITE{formula-even-powers}.
Formulas:
  formula-defining: >-
    $F_p(N(N+1)/2)=\sum_{k=1}^{N}k^p$ for positive odd $p$.
  formula-sums-of-powers: >-
    $F_p(N(N+1)/2)=S_p(N)$, where $S_p(N)$ is the
    HREF{T179}[sum of powers] polynomial evaluated at $N$.
  formula-bernoulli-polynomials: >-
    $F_p(N(N+1)/2)=\frac{B_{p+1}(N+1)-B_{p+1}(1)}{p+1}$, where $B_j(x)$ are
    the HREF{Bernoulli_polynomials}[Bernoulli polynomials].
  formula-knuth: >-
    If $p=2m-1$ and $A(m,j)$ are Knuth's coefficients, then
    $F_p(a)=\frac{1}{2m}\sum_{j=0}^{m-1}A(m,j)(2a)^{m-j}$ CITE{OEISnumerators}.
  formula-even-powers: >-
    For $m\geq 1$,
    $\sum_{k=1}^{N}k^{2m}=\frac{N+\frac12}{2m+1}F_{2m+1}'(N(N+1)/2)$, where
    the prime denotes differentiation with respect to $a$ CITE{Wiki}.
  formula-inverse-small: >-
    $4a^3=3F_5(a)+F_3(a)$, $8a^4=4F_7(a)+4F_5(a)$, and
    $16a^5=5F_9(a)+10F_7(a)+F_5(a)$ CITE{Wiki}.
  formula-divisibility: >-
    $F_1(a)=a$, and for every odd $p\geq 3$ the quotient
    $F_p(a)/a^2$ belongs to $\mathbb{Q}[a]$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing
      from sage.rings.rational_field import QQ

      R = PolynomialRing(QQ, 'a')
      a = R.gen()

      def faulhaber_polynomial(p):
          degree = (p + 1) // 2
          points = []
          for N in range(degree + 1):
              x = QQ(N * (N + 1)) / QQ(2)
              y = sum(QQ(k) ** p for k in range(1, N + 1))
              points.append((x, y))
          value = R.zero()
          for i, (xi, yi) in enumerate(points):
              term = R(yi)
              for j, (xj, _) in enumerate(points):
                  if i != j:
                      term *= (a - QQ(xj)) / QQ(xi - xj)
              value += term
          return value

      faulhaber_polynomial(51)      # the next odd exponent after this table

Data properties:
  type: Q
  rigour: exact
  complete: no
  complete-note: it holds every odd prime $p<1000$
  rigour details: >-
    The generator computes the Legendre sequence from exact Legendre symbols
    and forms the aperiodic autocorrelations by integer arithmetic. The values
    are exact rational numbers. The run checked every value against the same
    sequence built by Euler's criterion rather than Sage's Legendre symbol,
    against the known small values for $p=3,5,7,11,13$, and against the
    $L^4$-norm formula computed from all ordered coefficient pairs.
Display properties:
  number-header: $F_p$

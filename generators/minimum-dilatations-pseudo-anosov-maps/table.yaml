Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds the exact values in the contiguous range $1\leq g\leq5$
  rigour details: >-
    The mathematical identification of these roots with $\delta_g^+$ is
    Theorems 1.1 and 1.2 and the genus-one statement recalled by Lanneau and
    Thiffeault CITE{LT}. The generator isolates the real root greater than $1$
    of each exact polynomial in interval arithmetic and verifies that the
    polynomial changes sign across the isolating interval before writing $100$
    digits.
Display properties:
  number-header: $\delta_g^+$

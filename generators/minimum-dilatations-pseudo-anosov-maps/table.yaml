Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: 'it holds the exact values known in the cited small-genus results:
    $1\leq g\leq5$ and $g=7,8$; genus $6$ is open in CITE{HironakaSurvey}'
  rigour details: Genus $1$ is the torus case recalled by Lanneau and Thiffeault,
    $\delta_2^+$ is Theorem 1.1, and $\delta_3^+,\ldots,\delta_5^+$ are Theorem 1.2
    of CITE{LT}. The genus $7$ and $8$ lower bounds are Theorem 1.3 of CITE{LT}; the
    genus $7$ bound is realized by Aaber and Dunfield CITE{AD} and independently by
    Kin and Takasawa CITE{KT}, and the genus $8$ bound is realized by Hironaka CITE{Hironaka}.
    The generator isolates the real root greater than $1$ of each exact polynomial
    in interval arithmetic and verifies that the polynomial changes sign across the
    isolating interval before writing $100$ digits.

Title: Minimum dilatations of pseudo-Anosov maps with orientable invariant foliations
Definition: For a closed orientable surface $\Sigma_g$ of genus $g\geq1$, $\delta_g^+$
  is the minimum dilatation $\lambda>1$ among pseudo-Anosov homeomorphisms CITE{Wiki}
  of $\Sigma_g$ whose invariant measured foliations are orientable CITE{LT}.
Parameters:
  g:
    type: Z
    title: genus
    display: $g$
    constraints: $g\geq1$
Comments:
  comment-convention: $\delta_g^+$ is taken over a restricted class, so it is at least
    the unrestricted minimum $\delta_g$ over all pseudo-Anosov homeomorphisms of $\Sigma_g$.
    The two are equal for $g=1$ and $g=2$ CITE{LT}, so those rows are also $\delta_1$
    and $\delta_2$.
  comment-salem: 'For $2\leq g\leq5$, the values are Salem numbers and are largest
    roots of the degree $2g$ polynomials listed in CITE{formula-polynomials}. The
    rows $g=4$ and $g=5$ are less than $1.3$ and also occur in HREF{T284}[the table
    of Salem numbers less than $1.3$]. The values for $g=7,8$ are reciprocal Perron
    numbers but not Salem numbers: each has three algebraic conjugates outside the
    unit circle.'
  comment-monotonicity: Lanneau and Thiffeault prove $\delta_6^+\geq\delta_5^+$, so
    the orientable minimum dilatations are not strictly decreasing with genus CITE{LT}.
    The known values also have $\delta_7^+<\delta_8^+$.
Formulas:
  formula-polynomials: For the rows held here, $\delta_g^+$ is the largest real root
    of $P_g(x)$. The polynomials are $P_1=x^2-3x+1$, $P_2=x^4-x^3-x^2-x+1$, $P_3=x^6-x^4-x^3-x^2+1$,
    $P_4=x^8-x^5-x^4-x^3+1$, $P_5=x^{10}+x^9-x^7-x^6-x^5-x^4-x^3+x+1$, $P_7=x^{14}+x^{13}-x^9-x^8-x^7-x^6-x^5+x+1$,
    and $P_8=x^{16}-x^9-x^8-x^7+1$ CITE{LT}.
  formula-entropy: The topological entropy of a pseudo-Anosov homeomorphism with dilatation
    $\lambda$ is $\log\lambda$ CITE{LT}.
Programs:
  program-python:
    language: Sage
    code: |-
      from sage.all import PolynomialRing, QQ, RealField

      RR = RealField(400)
      R = PolynomialRing(QQ, 'x')
      x = R.gen()
      polynomials = {
          1: x**2 - 3*x + 1,
          2: x**4 - x**3 - x**2 - x + 1,
          3: x**6 - x**4 - x**3 - x**2 + 1,
          4: x**8 - x**5 - x**4 - x**3 + 1,
          5: x**10 + x**9 - x**7 - x**6 - x**5 - x**4 - x**3 + x + 1,
          7: x**14 + x**13 - x**9 - x**8 - x**7 - x**6 - x**5 + x + 1,
          8: x**16 - x**9 - x**8 - x**7 + 1,
      }
      print({g: max(p.roots(RR, multiplicities=False))
             for g, p in polynomials.items()})

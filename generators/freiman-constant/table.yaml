Title: Freiman's constant
Definition: >-
  Freiman's constant $c_F$ is the endpoint of the last gap in the Lagrange
  spectrum CITE{MathWorldFreiman}: every real number greater than $c_F$ lies
  in the Markov spectrum CITE{WikiMarkovSpectrum}, and the same threshold is
  the start of Hall's ray in the Lagrange spectrum CITE{CusickFlahive}. It is
  the quadratic irrational in Formula CITE{formula-value}.
Keywords:
  - Freiman constant
  - Hall ray
  - Lagrange spectrum
  - Markov spectrum
Parameters: ''
Comments:
  comment-hall-ray: >-
    The half-line beginning at $c_F$ is often called Hall's ray. This table
    stores the endpoint, not the continuum of all values on the ray.
  comment-less-than-three: >-
    The discrete part of the Markov and Lagrange spectra with value less than
    $3$ is stored in
    HREF{Lagrange_numbers_of_the_Markov_spectrum}[Lagrange numbers $L_m$ of
    the Markov spectrum].
  comment-name: >-
    Freiman proved the endpoint result in his monograph CITE{Freiman}; Cusick
    and Flahive give the value and spectrum context CITE{CusickFlahive}.
Formulas:
  formula-value: >-
    $c_F=\dfrac{2221564096+283748\sqrt{462}}{491993569}$.
  formula-minimal-polynomial: >-
    $491993569c_F^2-4443128192c_F+10031248672=0$, with $c_F>4$.
Programs:
  program-sage:
    language: SageMath
    code: |-
      R = RealBallField(400)
      (R(2221564096) + R(283748) * R(462).sqrt()) / R(491993569)
Similar tables:
  - table: HREF{Lagrange_numbers_of_the_Markov_spectrum}[Lagrange numbers $L_m$ of the Markov spectrum]
    relation: store the discrete Markov and Lagrange spectrum values less than $3$
  - table: HREF{Khinchin's_means}[Khinchin's means]
    relation: describe almost-sure limits of regular continued fractions, while Freiman's constant is an extremal threshold
  - table: HREF{Lévy's_constant}[Lévy's constant]
    relation: describes the almost-sure denominator growth rate for the same regular continued fraction

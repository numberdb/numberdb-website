Data properties:
  type: C
  rigour: proven
  complete: 'no'
  complete-note: every nontrivial character and every nonzero $a$ for the primes $5\leq p\leq19$ is here
  rigour details: >-
    Each value is a complex ball at 397 bits: the sum of the $p-1$ terms
    $\chi(x)e^{2\pi ir}$, where $r$ is the exact rational $(ax+\bar x)/p$
    reduced modulo $1$, each term arb's exponential of a ball containing its
    exact argument. The generator builds $\chi_p(n,\cdot)$ from Conrey's
    definition, not from a library, and requires it to agree with Sage's
    character on every value before any entry at that prime is returned. A
    hundred digits are written. The remaining checks are stated in the
    generator attached to the table.
Display properties:
  number-header: $K(a,\chi;p)$

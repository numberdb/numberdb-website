  - table: HREF{Gauss_sums_of_primitive_Dirichlet_characters}[Gauss sums of primitive Dirichlet characters]
    relation: the boundary cases $a=0$ or $b=0$ of the two-parameter twisted sums
  - table: HREF{Jacobi_sums_of_pairs_of_Dirichlet_characters_modulo_a_prime}[Jacobi sums of pairs of Dirichlet characters modulo a prime]
    relation: the same characters under the same Conrey labels
  - table: HREF{Roots_of_unity}[Roots of unity]
    relation: the values $\chi(x)$ and $e^{2\pi i(ax+\bar x)/p}$ that are summed

References:
  Lochs:
    bib: >-
      G. Lochs, Vergleich der Genauigkeit von Dezimalbruch und Kettenbruch,
      Abhandlungen aus dem Mathematischen Seminar der Universität Hamburg 27
      (1964), 142-144.
    doi: 10.1007/BF02993063
    mr: '0162753'
Tags:
  - number theory
  - continued fractions
  - dynamical systems
  - special values
Data properties:
  type: R
  rigour: proven
  complete: 'yes'
  rigour details: >-
    The value follows from CITE{formula-lochs} and was computed in real ball
    arithmetic, with $\pi$, $\log 2$ and $\log 10$ taken as balls rather than
    as rounded constants, so every stored digit is covered by the enclosure.

    It was compared with the decimal expansion in OEIS A086819
    CITE{OEISA086819}, and the identity $L=\frac{\log 10}{2\beta}$ was checked
    against the Khinchin-Lévy constant in HREF{Lévy's_constant}[Lévy's
    constant].
Display properties:
  number-header: $L$

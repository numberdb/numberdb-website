Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds all four listed functions at $x=0$ and at every nonzero
    rational $x=a/b$ in lowest terms with $b\leq4$ and $|x|\leq5$
  rigour details: Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=64)` bits, then returned as a real ball after
    checking that its imaginary part contained zero. The entries were checked
    against mpmath at 150 decimal digits, against the Wronskian in CITE{formula-wronskian}
    at every stored argument, against the Gamma identities in CITE{formula-initial-values},
    and against the OEIS values at $x=0$ CITE{OEISAiZero} CITE{OEISAiPrimeZero}
    CITE{OEISBiZero} CITE{OEISBiPrimeZero}. The widest returned ball had radius
    less than $10^{-115}$ for 100 requested digits.

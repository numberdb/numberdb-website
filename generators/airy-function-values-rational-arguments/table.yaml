Title: Values of Airy functions $\operatorname{Ai}(x)$, $\operatorname{Bi}(x)$ and their derivatives
Definition: This table gives the standard real values of the Airy functions
  $\operatorname{Ai}(x)$ and $\operatorname{Bi}(x)$, and of their first derivatives
  $\operatorname{Ai}'(x)$ and $\operatorname{Bi}'(x)$ CITE{Wiki} CITE{DLMFAiryEquation},
  for rational real arguments $x$.
Keywords:
- Airy function
- Airy function values
- Airy Ai
- Airy Bi
- Airy derivative
- AiryAi
- AiryBi
- Ai(0)
- Bi(0)
- Tracy-Widom distribution
- WKB turning point
Parameters:
  function:
    type: Symbolic
    title: function
    display: function
    values:
      Ai: $\operatorname{Ai}(x)$
      Ai-prime: $\operatorname{Ai}'(x)$
      Bi: $\operatorname{Bi}(x)$
      Bi-prime: $\operatorname{Bi}'(x)$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\in\mathbb{Q}$
Comments:
  comment-standard-solutions: >-
    The normalisation is the standard pair of solutions
    of Airy's differential equation in CITE{DLMFAiryEquation}. Values on both
    sides of the origin are listed: $\operatorname{Ai}$ decays and $\operatorname{Bi}$
    grows for positive $x$, while both functions oscillate for negative $x$.
  comment-initial-values: >-
    At $x=0$ the four entries are Gamma-function values;
    the identities are CITE{formula-initial-values}.
Formulas:
  formula-initial-values: >-
    $\operatorname{Ai}(0)=1/(3^{2/3}\Gamma(2/3))$,
    $\operatorname{Ai}'(0)=-1/(3^{1/3}\Gamma(1/3))$, $\operatorname{Bi}(0)=1/(3^{1/6}\Gamma(2/3))$,
    and $\operatorname{Bi}'(0)=3^{1/6}/\Gamma(1/3)$ CITE{DLMFInitialValues}.
    The Gamma values are in HREF{Values_of_the_Gamma_function_at_rational_numbers#1/3}[$\Gamma(1/3)$]
    and HREF{Values_of_the_Gamma_function_at_rational_numbers#2/3}[$\Gamma(2/3)$].
  formula-wronskian: >-
    For real $x$, $\operatorname{Ai}(x)\operatorname{Bi}'(x)-\operatorname{Ai}'(x)\operatorname{Bi}(x)=1/\pi$
    CITE{DLMFWronskian}.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.complex_arb import ComplexBallField

      from sage.rings.rational_field import QQ


      CBF = ComplexBallField(numberdb.bits(100, losing=64))

      x = CBF(QQ(1))


      x.airy_ai().real()

      x.airy_ai_prime().real()

      x.airy_bi().real()

      x.airy_bi_prime().real()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      x = mpmath.mpf(1)


      mpmath.airyai(x)

      mpmath.airyai(x, derivative=1)

      mpmath.airybi(x)

      mpmath.airybi(x, derivative=1)'

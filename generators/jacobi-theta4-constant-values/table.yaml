Title: Values of the Jacobi theta constant $\theta_4(0,q)$
Definition: >-
  For a real nome $0<q<1$, this table stores the Jacobi theta constant
  $\theta_4(0,q)$, with $q=e^{i\pi\tau}$ and
  $\theta_4(z,q)=1+2\sum_{n=1}^{\infty}(-1)^nq^{n^2}\cos(2nz)$
  CITE{DLMFThetaNotation} CITE{DLMFThetaDefinitions}.
Keywords:
- Jacobi theta
- theta constant
- theta four
Parameters:
  q:
    type: Q
    title: real nome
    display: $q$
    constraints: $0<q<1$
Comments:
  comment-nome: >-
    The parameter is the real nome $q$, not the lattice parameter $\tau$. In
    this rectangular case $0<q<1$, the relation $q=e^{i\pi\tau}$ determines
    $\tau=\log(q)/(i\pi)$ uniquely CITE{DLMFThetaNotation}.
  comment-theta1: >-
    The table stores a theta constant, so $z=0$ is not a parameter. There is
    no nonzero companion for $\theta_1(0,q)$, since $\theta_1(z,q)$ is odd in
    $z$ CITE{DLMFThetaDefinitions}.
Formulas:
  formula-series: >-
    $\theta_4(0,q)=1+2\sum_{n=1}^{\infty}(-1)^nq^{n^2}$.
  formula-jacobi-identity: >-
    $\theta_3(0,q)^4=\theta_2(0,q)^4+\theta_4(0,q)^4$
    CITE{DLMFThetaIdentities}.
Programs:
  program-sage:
    language: Sage
    code: |
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=80))
      q = QQ(1) / QQ(10)
      tau = CBF(0, -1) * CBF(q).log() / CBF.pi()
      value = CBF(0).jacobi_theta(tau)[3]
      assert value.imag().contains_zero()
      value.real()

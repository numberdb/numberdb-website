Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $\theta_4(0,q)$ for every decimal grid point $q=j/1000$, with
    $j=1,\ldots,900$
  rigour details: >-
    Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=80)` bits, after converting the real nome to
    $\tau=\log(q)/(i\pi)$. The imaginary part was checked to contain zero, and
    the real part was returned. Before the draft was filled, the run compared
    every value with the defining $q$-series with an explicit tail bound and
    checked CITE{formula-jacobi-identity} across the stored range.

Tags:
- special values
- special functions
- hypergeometric functions
- period
- elliptic curves
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds the twelve amplitudes $\varphi=t\pi$ with
    $t\in\{1/24,1/12,1/8,1/6,5/24,1/4,7/24,1/3,3/8,5/12,11/24,1/2\}$
    and every reduced elliptic parameter $m=a/b\in[0,1)$ with $b\leq12$
  rigour details: >-
    Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=64)` bits, with the imaginary part checked to
    contain zero, and returned as its real part. The identities
    CITE{formula-complete} and CITE{formula-zero-parameter} were checked across
    the stored rows where they apply, and representative rows were checked
    against mpmath quadrature at higher precision.
Display properties:
  number-header: $F(\varphi,m)$

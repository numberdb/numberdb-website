Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $p\in\{\tfrac14,\tfrac13,\tfrac12,\tfrac23,\tfrac34\}$, every
    support endpoint $1\leq N\leq16$, every degree
    $1\leq n\leq\min(N,4)$, and every zero $1\leq k\leq n$; the full grid
    of the Askey-normalised Krawtchouk polynomial table would continue through
    $n=N$, and the degrees $n>4$ are omitted to keep this zeros table within
    the entry limit
  rigour details: >-
    The generator builds $K_n(x;p,N)$ exactly in $\mathbb Q[x]$, using Sage
    rationals for every division, and isolates its roots in Sage's real
    interval field. Each stored interval is returned only after Sage has
    isolated all $n$ simple real roots. The generator checks the exact
    polynomial against the generating function CITE{formula-generating-function},
    checks Vieta's formula for the isolated intervals, checks the reflection
    relation CITE{formula-reflection} on the stored grid, and checks the
    Hamming-scheme scaling relation against an independently computed
    Hamming-scheme polynomial for $q=2,3,4$.
Display properties:
  number-header: $x_k$
  group parameters: [['p'], ['N'], ['n'], ['k']]

  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every row with $n\leq 10$, every $d_i\leq 10$, and
    $\prod_i d_i\leq 100$
  rigour details: >-
    The generator computes in the exact ring $\mathbb Z[h]$ from Formula
    CITE{formula-total}. It checks the quintic threefold value
    $1+10h^2-40h^3$ from CITE{ChernWiki}, verifies Formula
    CITE{formula-first} on every row, and compares the Euler characteristic
    from Formula CITE{formula-euler} with Hirzebruch's generating function
    quoted in CITE{CIWiki} on every row in the table.

# The table document for the weight 2 newform part of proposal 6 in
# agents/table-ideas/BATCH-2026-09-10T2109.md. Created as draft T217 through
# the API (X-Draft: yes), filled by generate.py beside it, and offered for
# review; publishing is a person's act on the site.
Title: Hecke polynomials of weight 2 newforms
Definition: >-
  For a normalized newform $f(q)=\sum_{n\geq1}a_nq^n$ of weight $2$,
  trivial character and level $N$, let $K_f=\mathbb{Q}(a_n:n\geq1)$ be its
  coefficient field. For a prime $p$, this table gives the characteristic
  polynomial $\chi_{f,p}(x)$ of multiplication by the Hecke eigenvalue $a_p$
  CITE{WikiHecke} on $K_f$.
Parameters:
  label:
    type: Symbolic
    title: LMFDB newform label
    display: label
    constraints: >-
      the label has the form $N.2.a.o$ for a weight $2$ newform orbit of
      trivial character on $\Gamma_0(N)$, with $[K_f:\mathbb{Q}]\geq2$
  p:
    type: Z
    title: prime
    display: $p$
    constraints: $p$ is prime
Comments:
  comment-labels: >-
    The labels are the LMFDB labels CITE{LMFDBPage} for weight $2$ newform
    orbits with trivial character. The character orbit is `a`, and the final
    letter names the Hecke orbit at that level.
  comment-dimension-one: >-
    Dimension-one newforms are omitted. For such a form $K_f=\mathbb{Q}$ and
    $\chi_{f,p}(x)=x-a_p$ is a linear polynomial; the corresponding $a_p$ are
    the elliptic-curve traces in Cremona and LMFDB tables.
  comment-characteristic: >-
    The table stores the characteristic polynomial on $K_f$, not the minimal
    polynomial of $a_p$. Its degree is $[K_f:\mathbb{Q}]$, the dimension of
    the newform orbit. The two polynomials agree exactly when $a_p$ generates
    $K_f$, and those are the rows the table keeps.
  comment-omitted-rows: >-
    Rows where $a_p$ does not generate $K_f$ are omitted, because
    $\chi_{f,p}$ is then a proper power of the minimal polynomial of $a_p$
    and carries nothing the generating primes do not already give. In the
    extreme $a_p\in\mathbb{Q}$ and $\chi_{f,p}(x)=(x-a_p)^{[K_f:\mathbb{Q}]}$:
    at $f=23.2.a.a$ and $p=13$ the eigenvalue is $a_{13}=3$ and the
    characteristic polynomial is $(x-3)^2$, which is a small integer and the
    degree of a field rather than a number worth looking up.
  comment-repeats: >-
    A polynomial can answer for more than one row. The $686$ entries hold
    $424$ distinct polynomials, of which $317$ occur once; the repetitions are
    small-height quadratics, $x^2-8$ and $x^2-12$ occurring $14$ times each.
    Some repeat within a single orbit, where two primes give conjugate
    eigenvalues: $a_5$ and $a_7$ of $39.2.a.b$ are both roots of $x^2-8$.
  comment-normalisation: >-
    The eigenvalues are the usual Fourier coefficients $a_p$, not the
    analytically normalised values $a_p/\sqrt{p}$. If $p\mid N$, $a_p$ is the
    eigenvalue of $U_p$: it is $-w_p$ for the Atkin-Lehner sign $w_p$ when
    $p^2\nmid N$, and it is $0$ when $p^2\mid N$.
Formulas:
  formula-eigenvalue: >-
    If $p\nmid N$, then $T_pf=a_pf$. If $p\mid N$, the same symbol $a_p$
    denotes the eigenvalue of the operator $U_p$ on $f$.
  formula-characteristic: >-
    $\chi_{f,p}(x)=\prod_{\sigma:K_f\hookrightarrow\mathbb{C}}
    (x-\sigma(a_p))$, counted with multiplicity.
Programs:
  program-sage:
    language: Sage
    code: |-
      import sage.rings.polynomial.laurent_polynomial_ring
      from sage.modular.modform.constructor import Newforms

      f = Newforms(23, 2, names='a')[0]
      f.coefficient(2).matrix().charpoly('x')     # x^2 + x - 1
      f.coefficient(13).matrix().charpoly('x')    # x^2 - 6*x + 9
  program-pari:
    language: PARI/GP
    code: |-
      mf = mfinit([23, 2], 0);                    \\ new cuspidal space
      charpoly(mfheckemat(mf, 13))                \\ x^2 - 6*x + 9

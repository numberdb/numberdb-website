Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every weight $2$ newform orbit of trivial character and level
    $N\leq100$ whose coefficient field has degree at least $2$, for the primes
    $p\leq59$ at which $a_p$ generates that field
  rigour details: >-
    The generator enumerates Sage's `Newforms(N, 2)` CITE{SageNewforms} for
    $N\leq100$, uses the LMFDB label order CITE{LMFDBAPI1} CITE{LMFDBAPI2},
    and keeps exactly the $50$ orbits whose coefficient field has degree at
    least $2$. For each retained orbit and each prime $p\leq59$, it takes the
    exact Sage coefficient $a_p$, builds the multiplication matrix of $a_p$
    on $K_f$, and computes $\det(xI-m_{a_p})$ by a permutation expansion over
    $\mathbb{Q}$, keeping the row when that polynomial is irreducible, which
    is to say when $a_p$ generates $K_f$. Before the draft was created, the labels and degrees were
    compared with the LMFDB API data, including the LMFDB page for 23.2.a.a
    CITE{LMFDB23}. For every level $N\leq100$ and every prime $p\leq59$, the
    product of the polynomials
    over all newform orbits, including dimension-one orbits omitted from the
    table, was required to equal PARI/GP's
    `charpoly(mfheckemat(mfinit([N,2],0),p))` CITE{PARIHecke}.
Display properties:
  number-header: $\chi_{f,p}(x)$
  group parameters: [['label'], ['p']]

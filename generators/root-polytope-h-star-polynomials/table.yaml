Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds $h^*_{P_\Phi}(z)$ for $A_n$ and $B_n$ with $2\leq n\leq20$, $C_n$ with $3\leq
    n\leq20$, $D_n$ with $4\leq n\leq20$, and the exceptional types $E_6$, $E_7$, $E_8$, $F_4$ and $G_2$;
    the range matches the companion Ehrhart-polynomial table, and the $A_1$ case is given in the comments
  rigour details: All entries are exact polynomials. The $A_n$, $C_n$ and $D_n$ rows use the formulas
    of CITE{ABHPS}; the $B_n$, $F_4$ and $G_2$ rows use the growth-series formula of CITE{BacherHarpeVenkov};
    the $E_6$, $E_7$ and $E_8$ rows are recovered from the coordination sequences of CITE{ConwaySloane}.
    The rows reproduced the first ten b-file terms of CITE{OEISG2}, CITE{OEISF4}, CITE{OEISE6}, CITE{OEISE7}
    and CITE{OEISE8}; the $A_n$, $B_n$ and $D_n$ rows were compared with CITE{OEISA}, CITE{OEISB} and
    CITE{OEISD}.

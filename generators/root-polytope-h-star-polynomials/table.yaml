# Draft document for T243, split from T233. Publishing is a person's act.
Title: Ehrhart $h^*$-polynomials of the root polytopes
Definition: For an irreducible crystallographic root system $\Phi$ CITE{WikiRootSystem}, let $P_\Phi=\operatorname{conv}(\Phi)$
  be the full root polytope in the root lattice $\mathbb{Z}\Phi$. This table stores the Ehrhart $h^*$-polynomial
  $h^*_{P_\Phi}(z)$, the numerator of its Ehrhart series CITE{WikiEhrhart}.
Keywords:
- root polytope
- Ehrhart polynomial
- Ehrhart h-star polynomial
- Ehrhart h* polynomial
- h-star polynomial
- h* polynomial
- growth series
- coordination sequence
- crystal ball sequence
- root lattice
Tags:
- polynomial
- combinatorics
- discrete geometry
Parameters:
  type:
    type: Symbolic
    title: Dynkin type
    display: type
    constraints: $A_n$ with $n\geq1$, $B_n$ with $n\geq2$, $C_n$ with $n\geq3$, $D_n$ with $n\geq4$, or
      one of $E_6$, $E_7$, $E_8$, $F_4$, $G_2$
Comments:
  conventions: 'Some authors use root polytope for $\operatorname{conv}(\Phi^+\cup\{0\})$; this table
    uses $P_\Phi=\operatorname{conv}(\Phi)$. Counting in $\mathbb{Z}\Phi$ matters: for $C_n$ and $D_n$
    in the usual coordinates, $\mathbb{Z}^n$ also contains $\pm e_i\in P_\Phi$, and counting in $\mathbb{Z}^n$
    gives a different polynomial.'
  small-rank-coincidences: '$n$ follows Bourbaki''s ranges, which list each irreducible root system once:
    $C_2\cong B_2$ and $D_3\cong A_3$. $A_1$ is omitted as a row because its root polytope is a segment,
    with $L_{A_1}(t)=2t+1$ and $h^*_{A_1}(z)=1+z$.'
  palindromic-h-star: Among these entries, the palindromic $h^*$-polynomials are those for $A_n$, $C_n$,
    $D_n$, $E_6$ and $B_2$; the other $h^*$ rows are not palindromic.
Formulas:
  formula-series: $\sum_{t\geq0}L_\Phi(t)z^t=h^*_{P_\Phi}(z)/(1-z)^{r+1}$, where $r=\operatorname{rank}(\Phi)$
    CITE{WikiEhrhart}.
  formula-binomial-transform: If $h^*_{P_\Phi}(z)=\sum_i h_i^*z^i$, then $L_\Phi(t)=\sum_i h_i^*\binom{t+r-i}{r}$.
  formula-growth-series: If $s_\Phi(m)$ counts root-lattice points of word length exactly $m$ with respect
    to the roots, then $\sum_{m\geq0}s_\Phi(m)z^m=h^*_{P_\Phi}(z)/(1-z)^r$ for $\Phi$ of type $A_n$, $B_n$,
    $C_n$, $D_n$, $F_4$ or $G_2$ CITE{BacherHarpeVenkov}; for $A_n$, $C_n$ and $D_n$ this is also obtained
    from unimodular triangulations of the root polytopes CITE{ABHPS}.
  formula-classical-h-star: $h^*_{A_n}(z)=\sum_{k=0}^n\binom nk^2z^k$, $h^*_{B_n}(z)=\sum_{k=0}^n\left(\binom{2n+1}{2k}-2n\binom{n-1}{k-1}\right)z^k$,
    $h^*_{C_n}(z)=\sum_{k=0}^n\binom{2n}{2k}z^k$, and $h^*_{D_n}(z)=\sum_{k=0}^n\left(\binom{2n}{2k}-2n\binom{n-2}{k-1}\right)z^k$
    CITE{ABHPS} CITE{BaakeGrimm}.
  formula-exceptional-h-star: $h^*_{G_2}(z)=1+10z+7z^2$, $h^*_{F_4}(z)=1+44z+198z^2+140z^3+z^4$, $h^*_{E_6}(z)=1+66z+645z^2+1384z^3+645z^4+66z^5+z^6$,
    $h^*_{E_7}(z)=1+119z+2037z^2+8211z^3+8787z^4+2037z^5+119z^6+z^7$, and $h^*_{E_8}(z)=1+232z+7228z^2+55384z^3+133510z^4+107224z^5+24508z^6+232z^7+z^8$
    CITE{ConwaySloane}.
Programs:
  program-sage:
    language: Sage
    code: 'from sage.arith.misc import binomial

      from sage.rings.rational_field import QQ

      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing


      Z = PolynomialRing(QQ, "z")

      z = Z.gen()

      n = 4

      sum(QQ(binomial(n, k)**2)*z**k for k in range(n + 1))  # h^*_{A_4}(z)'

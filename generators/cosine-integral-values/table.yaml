# The table document for T193, Values of the cosine integral $\operatorname{Ci}(x)$. It began as proposal 5 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which put seven
# functions in one table; they are six tables now, one per named
# function, and the relations between them are in `Similar tables`.
Title: Values of the cosine integral $\operatorname{Ci}(x)$
Definition: The cosine integral is $\operatorname{Ci}(x)=\gamma+\log x+\int_0^x(\cos
  t-1)/t\,\mathrm{d}t$ CITE{DLMFIntegralDefinitions}, where $\gamma$ is HREF{Stieltjes_constants#0}[the
  Euler-Mascheroni constant]. This table holds it at rational $x>0$.
Keywords:
- cosine integral
- Ci
- trigonometric integral
- Ci(1)
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments: {}
Formulas:
  formula-si-ci: For $x>0$, $\operatorname{Si}(x)=\int_0^x\sin(t)/t\,dt$ and $\operatorname{Ci}(x)=\gamma+\log
    x+\int_0^x(\cos(t)-1)/t\,dt$ CITE{DLMFIntegralDefinitions}.
  formula-parity: The functions $\operatorname{Si}$ and $\operatorname{Shi}$ are
    odd CITE{DLMFIntegralDefinitions}. With the principal branch of the logarithm,
    for $x>0$, $\operatorname{Ci}(-x)=\operatorname{Ci}(x)+i\pi$ and $\operatorname{Chi}(-x)=\operatorname{Chi}(x)+i\pi$
    CITE{DLMFAnalyticContinuation}.
Programs:
  program-sage:
    language: Sage
    code: "import numberdb.sage as numberdb\nfrom sage.rings.rational_field import\
      \ QQ\nfrom sage.rings.real_arb import RealBallField\n\nRBF = RealBallField(numberdb.bits(100,\
      \ losing=64))\nx = RBF(QQ(1))\nx.Ei()\n-RBF(-QQ(1)).Ei()\nRBF(QQ(2)).log_integral()\n\
      x.Si()\nx.Ci()\nx.Shi()\nx.Chi()\n      x.Ci()"
  program-python:
    language: Python
    code: "import mpmath\n\nmpmath.mp.dps = 100\nmpmath.ei(1)\nmpmath.e1(1)\n\
      mpmath.li(2)\nmpmath.si(1)\nmpmath.ci(1)\nmpmath.shi(1)\nmpmath.chi(1)\n\
      \      mpmath.ci(1)"
Similar tables:
- table: HREF{Values_of_the_sine_integral}[Values of the sine integral $\operatorname{Si}(x)$]
  relation: the companion trigonometric integral
- table: HREF{Values_of_the_hyperbolic_cosine_integral}[Values of the hyperbolic
    cosine integral $\operatorname{Chi}(x)$]
  relation: $\operatorname{Chi}$ is the same integral with $\cosh$ in place of
    $\cos$
- table: HREF{Gibbs_constant}[Wilbraham-Gibbs constant]
  relation: stores $\operatorname{Si}(\pi)$ and its normalisations
- table: HREF{Stieltjes_constants}[Stieltjes constants]
  relation: contains $\gamma_0$, the Euler-Mascheroni constant appearing in $\operatorname{Ei}$,
    $\operatorname{Ci}$ and $\operatorname{Chi}$

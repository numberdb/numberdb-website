# The table document for named rational Euler products over primes, proposal 5
# of agents/table-ideas/BATCH-2026-09-07T0207.md. It was created as draft T167
# through the API (X-Draft: yes), filled by generate.py beside it, and then
# offered for review; publishing is a person's act on the site.
Title: Named rational Euler products over primes
Definition: >-
  This table stores selected constants defined by rational Euler products over
  primes CITE{WikiEulerProduct} CITE{MathWorldPrimeProducts}
  CITE{Finch2003} CITE{Mathar2009}.
Parameters:
  product:
    type: Symbolic
    title: product
    display: $P$
    constraints: >-
      $P$ is one of the rational Euler products or affine products named in
      this table
    values:
      artin: $\prod_p(1-\frac{1}{p(p-1)})$
      stephens: $\prod_p(1-\frac{p}{p^3-1})$
      artin-rank-2: $\prod_p(1-\frac{1}{p^2(p-1)})$
      feller-tornier-product: $\prod_p(1-\frac{2}{p^2})$
      feller-tornier: $\frac12+\frac12\prod_p(1-\frac{2}{p^2})$
      heath-brown-moroz: $\prod_p(1-\frac1p)^7(1+\frac{7p+1}{p^2})$
      taniguchi: $\prod_p(1-\frac{3}{p^3}+\frac{2}{p^4}+\frac{1}{p^5}-\frac{1}{p^6})$
      barban: $\prod_p(1+\frac{3p^2-1}{p(p+1)(p^2-1)})$
      sarnak: $\prod_{p\geq3}(1-\frac{p+2}{p^3})$
      squarefree-density: $\prod_p(1-\frac{1}{p^2})$
      ramanujan: $\prod_p(1+\frac{1}{p^2})$
      landau-totient: $\prod_p(1+\frac{1}{p(p-1)})$
Comments:
  comment-scope: >-
    The product named in the parameter is the value stored. Each product is
    either $\prod_{p\in S}F(p)$ for a rational function
    $F(x)\in\mathbb Q(x)$ with $F(p)=1+O(p^{-2})$, or the stated affine
    transform of such a product. The Feller-Tornier row stores
    $\frac12+\frac12\prod_p(1-2/p^2)$ while the product part
    $\prod_p(1-2/p^2)$ is stored separately.
  comment-existing: >-
    HREF{Hafner-Sarnak-McCurley_constant}[The Hafner-Sarnak-McCurley constant]
    and HREF{Twin_prime_constant}[the twin prime constant] are similar named
    Euler products already held by the corpus, so they are linked here rather
    than repeated as rows.
  comment-zeta: >-
    The squarefree-density, Ramanujan and Landau-totient rows have the
    closed forms in CITE{formula-zeta-controls}. They are included because
    these prime products are commonly met in that form and because they are
    controls for the computation of the other rows.
Formulas:
  formula-zeta-controls: >-
    The Euler product for the Riemann zeta function gives
    $\prod_p(1-p^{-2})=1/\zeta(2)=6/\pi^2$ and
    $\prod_p(1+p^{-2})=\zeta(2)/\zeta(4)=15/\pi^2$
    CITE{MathWorldPrimeProducts}; also
    $\prod_p(1+\frac{1}{p(p-1)})=\zeta(2)\zeta(3)/\zeta(6)$
    CITE{WikiTotientSummatory}.
  formula-prime-zeta-expansion: >-
    For a rational function $F$ with $F(p)=1+O(p^{-2})$,
    $\log\prod_pF(p)=\sum_{j\geq2}c_jP(j)$ when
    $\log F(x)=\sum_{j\geq2}c_jx^{-j}$ and $P(j)$ is
    HREF{Values_of_the_prime_zeta_function_at_rational_numbers}[the prime
    zeta function].
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      default(realprecision, 140)
      prodeulerrat(1 - 1/(p*(p - 1)))                       \\ Artin
      prodeulerrat(1 - p/(p^3 - 1))                          \\ Stephens
      (1 + prodeulerrat(1 - 2/p^2))/2                        \\ Feller-Tornier
      prodeulerrat(1 - (p + 2)/p^3, 1, 3)                    \\ Sarnak
Similar tables:
  - table: HREF{Twin_prime_constant}[Twin prime constant]
    relation: another named rational Euler product over primes
  - table: HREF{Hafner-Sarnak-McCurley_constant}[Hafner-Sarnak-McCurley constant]
    relation: another named rational Euler product over primes
  - table: HREF{Values_of_the_prime_zeta_function_at_rational_numbers}[Values of the prime zeta function at rational numbers]
    relation: the logarithms of these rational Euler products can be expanded through prime zeta values
  - table: HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[Values of the Riemann zeta function at rational numbers]
    relation: three rows have closed forms in Riemann zeta values

Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds the Artin, Stephens, rank-$2$ Artin, Feller-Tornier,
    Heath-Brown-Moroz, Taniguchi, Barban, Sarnak, squarefree-density,
    Ramanujan and Landau-totient products listed in the parameter values
  rigour details: >-
    Values were computed with PARI's prodeulerrat CITE{PARI} at $140$ decimal
    digits, and $100$ digits are written. The same values were recomputed at
    $160$ decimal digits before the draft was filled, with the same stored
    digits.

    The Artin, Stephens, rank-$2$ Artin, Feller-Tornier, Heath-Brown-Moroz,
    Taniguchi, Barban, Sarnak and Ramanujan rows were compared with the
    corresponding OEIS decimal expansions named in the links. The
    squarefree-density, Ramanujan and Landau-totient rows were also compared
    with the closed forms in CITE{formula-zeta-controls}.

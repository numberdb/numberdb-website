Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds Artin's constant, Stephens' constant, the rank-$2$ Artin
    constant, the Feller-Tornier product part, the Feller-Tornier constant,
    the Heath-Brown-Moroz constant, Taniguchi's constant, Barban's constant,
    Sarnak's constant, the squarefree density, $\prod_p(1+p^{-2})=15/\pi^2$,
    and Landau's totient constant
  rigour details: >-
    Values were computed with PARI's prodeulerrat CITE{PARI} at $140$ decimal
    digits, and $100$ digits are written. The values were recomputed at $160$
    decimal digits, and the $100$ written digits agree.

    Each row was compared with the corresponding OEIS decimal expansion named
    in the links. The squarefree density, $\prod_p(1+p^{-2})$, and Landau's
    totient constant were also compared with the closed forms in
    CITE{formula-zeta-controls}.

# The table document for named rational Euler products over primes, proposal 5
# of agents/table-ideas/BATCH-2026-09-07T0207.md. It was created as draft T167
# through the API (X-Draft: yes), filled by generate.py beside it, and then
# offered for review; publishing is a person's act on the site.
Title: Named rational Euler products over primes
Definition: >-
  The entries are constants given by rational Euler products
  $\prod_{p\in S}F(p)$, where $F(x)\in\mathbb Q(x)$ and
  $F(p)=1+O(p^{-2})$ as $p\to\infty$ CITE{MathWorldPrimeProducts}.
Parameters:
  product:
    type: Symbolic
    title: product
    display: $P$
    constraints: >-
      $P$ is one of the products listed with the entries; the Feller-Tornier
      constant is $\frac12+\frac12$ times one of those products
    values:
      artin: Artin's constant, $\prod_p(1-\frac{1}{p(p-1)})$
      stephens: Stephens' constant, $\prod_p(1-\frac{p}{p^3-1})$
      artin-rank-2: rank-$2$ Artin constant, $\prod_p(1-\frac{1}{p^2(p-1)})$
      feller-tornier-product: Feller-Tornier product part, $\prod_p(1-\frac{2}{p^2})$
      feller-tornier: Feller-Tornier constant, $\frac12+\frac12\prod_p(1-\frac{2}{p^2})$
      heath-brown-moroz: Heath-Brown-Moroz constant, $\prod_p(1-\frac1p)^7(1+\frac{7p+1}{p^2})$
      taniguchi: Taniguchi's constant, $\prod_p(1-\frac{3}{p^3}+\frac{2}{p^4}+\frac{1}{p^5}-\frac{1}{p^6})$
      barban: Barban's constant, $\prod_p(1+\frac{3p^2-1}{p(p+1)(p^2-1)})$
      sarnak: Sarnak's constant, $\prod_{p\geq3}(1-\frac{p+2}{p^3})$
      squarefree-density: squarefree density, $\prod_p(1-\frac{1}{p^2})$
      ramanujan: $15/\pi^2$, $\prod_p(1+\frac{1}{p^2})$
      landau-totient: Landau's totient constant, $\prod_p(1+\frac{1}{p(p-1)})$
Comments:
  comment-scope: >-
    All entries are themselves products except the Feller-Tornier constant,
    which is $\frac12+\frac12\prod_p(1-2/p^2)$. For all entries except
    Sarnak's constant, $S$ is the set of all primes; for Sarnak's constant,
    $S$ is the primes $p\geq3$. The condition $F(p)=1+O(p^{-2})$ gives
    absolute convergence because $\sum_p p^{-2}$ converges CITE{WikiEulerProduct}
    CITE{Finch2003}.
  comment-zeta: >-
    The squarefree density, $\prod_p(1+p^{-2})$, and Landau's totient constant
    have the closed forms in CITE{formula-zeta-controls}.
Formulas:
  formula-zeta-controls: >-
    The Euler product for the Riemann zeta function gives
    $\prod_p(1-p^{-2})=1/\zeta(2)=6/\pi^2$ and
    $\prod_p(1+p^{-2})=\zeta(2)/\zeta(4)=15/\pi^2$
    CITE{MathWorldPrimeProducts}; also
    $\prod_p(1+\frac{1}{p(p-1)})=\zeta(2)\zeta(3)/\zeta(6)$
    CITE{WikiTotientSummatory}.
  formula-prime-zeta-expansion: >-
    For a rational function $F$ with $F(p)=1+O(p^{-2})$,
    $\log\prod_pF(p)=\sum_{j\geq2}c_jP(j)$ when
    $\log F(x)=\sum_{j\geq2}c_jx^{-j}$ and $P(j)$ is
    HREF{Values_of_the_prime_zeta_function_at_rational_numbers}[the prime
    zeta function] CITE{Mathar2009}.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      default(realprecision, 140)
      prodeulerrat(1 - 1/(p*(p - 1)))                       \\ Artin
      prodeulerrat(1 - p/(p^3 - 1))                          \\ Stephens
      (1 + prodeulerrat(1 - 2/p^2))/2                        \\ Feller-Tornier
      prodeulerrat(1 - (p + 2)/p^3, 1, 3)                    \\ Sarnak

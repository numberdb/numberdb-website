Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds $A_n$ for $1\leq n\leq15$, $B_n$ and ${}^2A_n$ for
    $2\leq n\leq15$, $C_n$ for $3\leq n\leq15$, $D_n$ and ${}^2D_n$ for
    $4\leq n\leq15$, and all fixed-rank exceptional, Suzuki and Ree
    families listed in the family parameter
  sources:
    - CITE{Hiss}
    - CITE{WikiSimple}
  rigour details: >-
    The entries are exact integer polynomials computed from the product
    formulas in the Formulas section. The generator multiplies the factors
    in $\mathbb Z[q]$ and uses no division. Its self-check compares eight
    small classical cases with GAP group orders, and compares 180
    specialisations with HREF{Orders_of_finite_simple_groups_of_Lie_type}[the
    stored finite simple group orders] after multiplying by the central
    factor $d(q)$ stated in CITE{formula-simple-quotients}.
Display properties:
  number-header: $P(q)$

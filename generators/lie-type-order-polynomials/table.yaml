# Draft document for T258. Publishing is a person's act.
Title: Orders of finite groups of Lie type as polynomials in $q$
Definition: >-
  For a Lie type and rank, this table stores the order polynomial
  $P(q)$ in the field-size parameter $q$ for the corresponding finite group
  of Lie type CITE{Hiss}.
Parameters:
  family:
    type: Symbolic
    title: Lie type
    display: family
    constraints: >-
      one of $A$, $B$, $C$, $D$, $E_6$, $E_7$, $E_8$, $F_4$, $G_2$,
      ${}^2A$, ${}^2D$, ${}^2E_6$, ${}^3D_4$, ${}^2B_2$, ${}^2F_4$ or
      ${}^2G_2$
    values:
      A: $A_n$
      B: $B_n$
      C: $C_n$
      D: $D_n$
      E6: $E_6$
      E7: $E_7$
      E8: $E_8$
      F4: $F_4$
      G2: $G_2$
      2A: ${}^2A_n$
      2D: ${}^2D_n$
      2E6: ${}^2E_6$
      3D4: ${}^3D_4$
      2B2: ${}^2B_2$
      2F4: ${}^2F_4$
      2G2: ${}^2G_2$
  n:
    type: Z
    title: rank
    display: $n$
    constraints: >-
      $n\geq1$ for $A_n$, $n\geq2$ for $B_n$ and ${}^2A_n$,
      $n\geq3$ for $C_n$, and $n\geq4$ for $D_n$ and ${}^2D_n$; the
      fixed-rank families use the displayed subscript as $n$
Comments:
  convention: >-
    The polynomial variable is $q$. For the Suzuki and Ree families,
    group orders are obtained only at $q=2^{2m+1}$ for ${}^2B_2$ and
    ${}^2F_4$, and at $q=3^{2m+1}$ for ${}^2G_2$.
  central-quotients: >-
    The companion table HREF{Orders_of_finite_simple_groups_of_Lie_type}[Orders
    of finite simple groups of Lie type] stores the simple central
    quotients. Where that quotient has a central factor $d(q)$, its order is
    $P(q)/d(q)$ rather than $P(q)$.
  repeated-types: >-
    The $B_n$ and $C_n$ rows have the same polynomial for each listed rank.
    The $C_2$ row is not repeated, following the convention used for the
    finite simple groups of Lie type.
  tits-group: >-
    The Tits group ${}^2F_4(2)'$ is a single finite simple group rather than
    a family in the parameter $q$, so it is not a row of this polynomial table.
Formulas:
  formula-classical: >-
    $P_{A_n}(q)=q^{n(n+1)/2}\prod_{i=2}^{n+1}(q^i-1)$,
    $P_{B_n}(q)=P_{C_n}(q)=q^{n^2}\prod_{i=1}^n(q^{2i}-1)$, and
    $P_{D_n}(q)=q^{n(n-1)}(q^n-1)\prod_{i=1}^{n-1}(q^{2i}-1)$.
  formula-exceptional: >-
    $P_{E_6}(q)=q^{36}\prod_{i\in\{2,5,6,8,9,12\}}(q^i-1)$,
    $P_{E_7}(q)=q^{63}\prod_{i\in\{2,6,8,10,12,14,18\}}(q^i-1)$,
    $P_{E_8}(q)=q^{120}\prod_{i\in\{2,8,12,14,18,20,24,30\}}(q^i-1)$,
    $P_{F_4}(q)=q^{24}(q^2-1)(q^6-1)(q^8-1)(q^{12}-1)$, and
    $P_{G_2}(q)=q^6(q^2-1)(q^6-1)$.
  formula-steinberg: >-
    $P_{{}^2A_n}(q)=q^{n(n+1)/2}\prod_{i=2}^{n+1}(q^i-(-1)^i)$,
    $P_{{}^2D_n}(q)=q^{n(n-1)}(q^n+1)\prod_{i=1}^{n-1}(q^{2i}-1)$,
    $P_{{}^2E_6}(q)=q^{36}\prod_{i\in\{2,5,6,8,9,12\}}(q^i-(-1)^i)$, and
    $P_{{}^3D_4}(q)=q^{12}(q^8+q^4+1)(q^6-1)(q^2-1)$.
  formula-suzuki-ree: >-
    $P_{{}^2B_2}(q)=q^2(q^2+1)(q-1)$,
    $P_{{}^2F_4}(q)=q^{12}(q^6+1)(q^4-1)(q^3+1)(q-1)$, and
    $P_{{}^2G_2}(q)=q^3(q^3+1)(q-1)$.
  formula-simple-quotients: >-
    The finite simple group order in
    HREF{Orders_of_finite_simple_groups_of_Lie_type}[the companion table] is
    $P(q)/d(q)$, where
    $d(q)=(n+1,q-1)$ for $A_n$, $d(q)=(n+1,q+1)$ for ${}^2A_n$,
    $d(q)=(2,q-1)$ for $B_n$ and $C_n$, $d(q)=(4,q^n-1)$ for $D_n$,
    $d(q)=(4,q^n+1)$ for ${}^2D_n$, $d(q)=(3,q-1)$ for $E_6$,
    $d(q)=(3,q+1)$ for ${}^2E_6$, and $d(q)=(2,q-1)$ for $E_7$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, "q")
      q = R.gen()
      n = 3
      polynomial = q ** (n * (n + 1) // 2)
      for i in range(2, n + 2):
          polynomial *= q ** i - 1
      polynomial
Similar tables:
  - table: HREF{Orders_of_finite_simple_groups_of_Lie_type}[Orders of finite simple groups of Lie type]
    relation: stores integer orders of the corresponding simple central quotients at prime-power values of $q$

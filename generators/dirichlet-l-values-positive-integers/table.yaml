Data properties:
  type: C
  rigour: proven
  complete: 'no'
  complete-note: every primitive character of conductor $q\leq 30$ at $s=1,2,3$ is here, 503 entries
  rigour details: >-
    Each value is a complex ball at $397$ bits: the sum CITE{formula-hurwitz}
    with arb's Hurwitz zeta function at $s=2,3$ and arb's digamma function
    at $s=1$, the character value $\chi(a)=e^{2\pi ir}$ being arb's
    exponential of a ball containing the exact rational $r$, which is
    computed from Conrey's definition of the label by discrete logarithms.
    A hundred digits are written; the widest ball, at $(29,27,1)$, supports
    $117$. Before any entry is returned the generator requires, for every
    character of every modulus in range, that the hand-built character
    agree with Sage's character of the same Conrey number at every argument
    and in primitivity; and for the entry, that the ball overlap a second
    enclosure computed from Sage's exact character values by a hand-written
    Euler-Maclaurin summation of each $\zeta(s,a/q)$ or $\psi(a/q)$, whose
    remainder is bounded by the first omitted term; that
    CITE{formula-closed-form}, with Sage's exact Gauss sum and exact
    $B_{s,\bar\chi}$ enclosed in balls, CITE{formula-cotangent} and
    CITE{formula-logarithm} hold where they apply; and, for a real
    character, that the imaginary part contain $0$ and the value contain
    the rational multiple of $\pi^s/\sqrt{q}$ of CITE{formula-real}.
    Outside the generator, every one of the $501$ entries with $q>1$ agrees
    with PARI's lfun at $120$ digits, the character handed to PARI as its
    Conrey label; the $19$ real characters at $s=1$ reproduce the stored
    digits of the residues $\kappa_D$; $\zeta(2)$, $\zeta(3)$ and $\pi/4$
    reproduce their stored digits; for $q\leq 11$ the closed form assembled
    from the stored digits of the Gauss sums and of the generalized
    Bernoulli numbers on this site reproduces every entry of matching
    parity; $L(2,\chi_4(3,\cdot))$ contains arb's Catalan constant,
    $L(3,\chi_4(3,\cdot))$ contains $\pi^3/32$, and the real part of
    $L(1,\chi_5(2,\cdot))$ contains the $300$ digits of OEIS A381152.
    Controls that must fail did: a value against PARI's value for the
    conjugate character, $\kappa_{-3}$ against $\kappa_{-4}$, the closed
    form with $B_{1,\bar\chi}$ in place of $B_{2,\bar\chi}$, and the
    constants shifted by $10^{-90}$.

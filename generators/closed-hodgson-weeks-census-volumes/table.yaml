Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds exactly the two orientable Hodgson-Weeks census manifolds whose
    volume is less than $1$
  rigour details: >-
    Each volume was computed in arb at `numberdb.bits(digits, losing=64)` bits
    from integer gluing equations extracted from SnapPy 3.3.2. For each row,
    the generator proves by a Krawczyk test that a box of complex balls
    contains a solution of the square system made from $m-1$ edge equations and
    the Dehn filling equation; the omitted edge equation follows because the
    edge equations multiply to the identity. Every shape ball has positive
    imaginary part, and every logarithmic edge equation and filling equation
    is pinned to $2\pi i$. The volume is the sum of the Bloch-Wigner
    dilogarithms of those shape balls, using arb's polylogarithm, as in
    CITE{formula-bloch-wigner}; the widest ball supports $117$ digits while
    the table writes $100$. Outside the generator, both values were compared
    with SnapPy's high-precision volumes; the Weeks row was compared with
    CITE{formula-weeks} using the stored zeta value
    HREF{Values_of_Dedekind_zeta_functions_of_cubic_fields_at_2#-23,1}[$\zeta_K(2)$],
    and the Meyerhoff row was compared with CITE{formula-meyerhoff} using
    PARI's `lfun` for the quartic field. This is the interval-arithmetic
    gluing-equation style described by CITE{HIKMOT} and SnapPy's verified
    computation documentation CITE{SnapPyVerify}.
Display properties:

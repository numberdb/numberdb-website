Title: Volumes of the closed hyperbolic 3-manifolds of the Hodgson-Weeks census
Definition: >-
  Listed is $\mathrm{Vol}(M)$, the volume of the complete hyperbolic metric
  with curvature $-1$ on a closed orientable hyperbolic 3-manifold $M$ in the
  Hodgson-Weeks census CITE{HodgsonWeeks} CITE{SnapPyCensus}.
Keywords:
  - Weeks manifold
  - Fomenko-Matveev-Weeks manifold
  - Meyerhoff manifold
  - Hodgson Weeks census
  - closed census
  - closed hyperbolic 3-manifold
Parameters:
  name:
    type: Symbolic
    title: SnapPy census name
    display: $M$
    constraints: >-
      $M$ is the SnapPy name of a closed orientable hyperbolic 3-manifold in
      the Hodgson-Weeks census
Comments:
  comment-census: >-
    SnapPy's $\mathtt{OrientableClosedCensus}$ contains $11031$ closed
    hyperbolic manifolds from the Hodgson-Weeks census CITE{SnapPyCensus}. The
    nonorientable closed census has $17$ entries in SnapPy and is not part of
    this table.
  comment-names: >-
    The name records a Dehn filling description of a cusped SnapPea census
    manifold and is not unique. The Meyerhoff manifold is listed here as
    $m003(-2,3)$, and SnapPy identifies $m004(5,1)$ with the same census
    entry.
  comment-range: >-
    The next entry by volume is $m007(3,1)$, often called Vol3, whose volume
    is
    HREF{Values_of_the_Clausen_functions_at_rational_multiples_of#2,1/3}[Gieseking's
    constant] $\mathrm{Cl}_2(\pi/3)$, the volume of the regular ideal
    tetrahedron.
  comment-minimal: >-
    The Weeks manifold is the unique smallest-volume closed orientable
    hyperbolic 3-manifold CITE{GabaiMeyerhoffMilley}, and its decimal
    expansion is OEIS A126774 CITE{OEISWeeks}. The Meyerhoff manifold is the
    second row of the census by volume CITE{WikiMeyerhoff}.
Formulas:
  formula-bloch-wigner: >-
    $\mathrm{Vol}(M)=\sum_{i=1}^{m}D(z_i)$ for a filled ideal triangulation
    of $M$ by tetrahedra with shapes $z_1,\ldots,z_m$ in the upper half
    plane, where
    $D(z)=\operatorname{Im}\mathrm{Li}_2(z)+\arg(1-z)\log|z|$ is the
    Bloch-Wigner dilogarithm CITE{NeumannZagier}. The shapes satisfy the
    edge equations and the Dehn filling equation of the triangulation.
  formula-weeks: >-
    $\mathrm{Vol}(m003(-3,1))=
    \frac{3\cdot23^{3/2}}{4\pi^4}\zeta_K(2)$, where
    HREF{Values_of_Dedekind_zeta_functions_of_cubic_fields_at_2#-23,1}[$\zeta_K(2)$]
    is the value at $2$ of the Dedekind zeta function of the cubic field $K$
    generated by a root of $x^3-x+1$ CITE{WikiWeeks}.
  formula-meyerhoff: >-
    $\mathrm{Vol}(m003(-2,3))=
    12\cdot283^{3/2}\zeta_K(2)/(2\pi)^6$, where $K$ is the quartic field of
    discriminant $-283$ CITE{WikiMeyerhoff}.
Programs:
  program-snappy:
    language: Python
    code: |-
      from snappy import OrientableClosedCensus

      for M in OrientableClosedCensus:
          if M.volume() < 1:
              print(OrientableClosedCensus.identify(M), M.high_precision().volume(), M.homology())

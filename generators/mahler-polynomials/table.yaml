Title: Mahler polynomials $g_n(x)$
Definition: >-
  For an integer $n\geq 0$, the Mahler polynomial $g_n(x)$ is the
  coefficient polynomial in $\mathbb{Z}[x]$ defined by
  $\sum_{n=0}^{\infty}g_n(x)\frac{t^n}{n!}
  =\exp(x(1+t-e^t))$ CITE{Wiki} CITE{MathWorld}.
Parameters:
  n:
    type: Z
    title: index
    display: $n$
    constraints: $n\geq 0$
Comments:
  comment-notation: >-
    This table uses the notation $g_n(x)$ from CITE{Wiki}. MathWorld writes
    $s_n(x)$ for the same polynomials CITE{MathWorld}.
  comment-associated-stirling: >-
    The coefficient of $(-x)^k$ counts partitions of an $n$-element set into
    $k$ blocks, each of size at least two. These numbers are the associated
    Stirling numbers of the second kind CITE{OEISassociated}.
Formulas:
  formula-generating-function: >-
    $\sum_{n=0}^{\infty}g_n(x)\frac{t^n}{n!}=\exp(x(1+t-e^t))$.
  formula-coefficients: >-
    $g_n(x)=\sum_{k=0}^{\lfloor n/2\rfloor}(-1)^k A(n,k)x^k$, where
    $A(n,k)$ is the number of partitions of an $n$-element set into $k$
    blocks of size at least two. Equivalently,
    $A(n,k)=B_{n,k}(0,1,1,\dots)$ for the
    HREF{Partial_Bell_polynomials}[partial Bell polynomials].
  formula-coefficient-recurrence: >-
    The numbers $A(n,k)$ in CITE{formula-coefficients} satisfy
    $A(0,0)=1$ and
    $A(n,k)=kA(n-1,k)+(n-1)A(n-2,k-1)$ for $n\geq1$, with
    $A(n,k)=0$ outside $0\leq k\leq\lfloor n/2\rfloor$.
  formula-touchard: >-
    $g_n(x)=\sum_{j=0}^{n}\binom{n}{j}x^{n-j}T_j(-x)$, where $T_j(y)$ is the
    HREF{Touchard_polynomials}[Touchard polynomial].
  formula-no-singletons: >-
    $g_n(-1)$ is the number of partitions of an $n$-element set with no
    singleton block CITE{OEISnosingletons}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, 'x')
      x = R.gen()

      def mahler_polynomial(n):
          rows = [[ZZ(0) for _ in range(n // 2 + 2)] for _ in range(n + 1)]
          rows[0][0] = ZZ(1)
          for m in range(1, n + 1):
              for k in range(1, m // 2 + 1):
                  rows[m][k] = ZZ(k) * rows[m - 1][k]
                  if m >= 2:
                      rows[m][k] += ZZ(m - 1) * rows[m - 2][k - 1]
          return sum(ZZ((-1)**k) * rows[n][k] * x**k
                     for k in range(n // 2 + 1))

      mahler_polynomial(51)      # the next one after this table

# generate.py beside it and offered for review. Publishing is a person's act.
Title: Normalised Hecke eigenvalues of level one cusp forms
Definition: >-
  For the $i$th normalised Hecke eigenform
  $f_{k,i}(q)=\sum_{m\geq1}a_mq^m$ in
  $S_k(\mathrm{SL}_2(\mathbb{Z}))$ CITE{WikiCusp}, ordered by increasing real
  $T_2$-eigenvalue $a_2$ CITE{WikiHecke}, this table gives the
  Deligne-normalised eigenvalue $a_p/p^{(k-1)/2}$ for primes $p$.
Parameters:
  k:
    type: Z
    title: weight
    display: $k$
    constraints: $k$ is even and $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$
  i:
    type: Z
    title: position by increasing $a_2$
    display: $i$
    constraints: >-
      $1\leq i\leq\dim S_k(\mathrm{SL}_2(\mathbb{Z}))$, with positions counted
      after sorting the eigenforms by increasing $a_2$
  p:
    type: Z
    title: prime
    display: $p$
    constraints: $p$ is prime
Comments:
  comment-normalisation: >-
    The table uses the arithmetic normalisation $a_1=1$. The value stored here
    lies in $[-2,2]$ by the Ramanujan-Petersson theorem CITE{WikiRamanujanPetersson},
    and is not divided by an additional factor of $2$.
  comment-ordering: >-
    Library orderings are not used as table orderings. In each weight, the
    generator takes the exact roots of the $T_2$ characteristic polynomial,
    orders them increasingly in the real numbers, and uses that ordering for
    every prime. Each entry comment names the same $a_2$ ordering through the
    row $(k,2)$ of
    HREF{Hecke_polynomials_of_level_one_cusp_forms}[the Hecke polynomial
    table].
  comment-angle: >-
    The Satake angle $\theta_p\in[0,\pi]$ is determined by
    $a_p/p^{(k-1)/2}=2\cos\theta_p$. This table stores the normalised
    eigenvalue rather than the angle.
Formulas:
  formula-euler-factor: >-
    For $\operatorname{Re}s>(k+1)/2$, the Euler factor of $L(f_{k,i},s)$ at
    $p$ is $(1-a_pp^{-s}+p^{k-1-2s})^{-1}$.
  formula-satake-angle: >-
    $a_p/p^{(k-1)/2}=2\cos\theta_p$, where $\theta_p$ is the Satake angle in
    $[0,\pi]$.
  formula-hecke-relation: >-
    For a normalised eigenform, $a_{p^2}=a_p^2-p^{k-1}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.modular.modform.constructor import Newforms
      f = Newforms(1, 12, names='a')[0]
      f[2] / (2^5 * sqrt(2))       # -0.5303300858899106...
  program-pari:
    language: PARI/GP
    code: |-
      mf = mfinit([1, 12], 0);
      mfcoefs(mfeigenbasis(mf)[1], 2)[2] / (2^5 * sqrt(2))

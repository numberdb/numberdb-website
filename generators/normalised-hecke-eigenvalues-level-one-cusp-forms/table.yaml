Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every even weight $12\leq k\leq40$ with
    $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$, every eigenform in the
    increasing-$a_2$ ordering, and every prime $p\leq61$
  rigour details: >-
    The generator computes exact Hecke matrices with Sage and checks their
    characteristic polynomials against PARI/GP's `mfheckemat` CITE{PARIModular}.
    For each prime $p$, it expresses $T_p$ exactly as a polynomial in $T_2$,
    evaluates that polynomial at the exact algebraic roots of the $T_2$
    characteristic polynomial in increasing real order, and only then coerces
    $a_p/p^{(k-1)/2}$ into Sage's real ball field before writing the stored
    digits. It checks Deligne's bound on every entry. The weight $12$ rows were
    checked against the Ramanujan tau values in
    HREF{Q-expansion_of_the_modular_discriminant}[the modular discriminant
    table], and an independent run compared every row with Sage's `Newforms`
    coefficient embeddings CITE{SageNewforms}.
Display properties:
  number-header: $a_p/p^{(k-1)/2}$
  group parameters: [['k'], ['i'], ['p']]

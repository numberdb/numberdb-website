Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every cubic field with $|D|\leq 3000$, the 419 complex and the
    96 totally real ones
  rigour details: >-
    Each value is a real ball at 461 bits, by one of two routes. For $D<0$
    it is $\zeta(2)L(2,\rho)$ with $L(2,\rho)$ the combination of Epstein
    zeta functions of formula CITE{formula-forms}; the identity behind that
    formula is made a finite check on each field by Sturm's theorem
    CITE{Sturm1987}, since $L(s,\rho)$ is the $L$-series of a modular form
    of weight one, level $|D|$ and character $(D/\cdot)$ CITE{Serre1977},
    the theta series $\sum q^{Q(m,n)}$ of each form of discriminant $D$ is
    a modular form of the same weight, level and character CITE{Zagier2008},
    and two such forms agree once their Fourier coefficients agree up to
    $|D|\prod_{p\mid D}(1+1/p)/12$. The generator computes that many
    coefficients and five more on both sides in exact arithmetic, from the
    representation numbers of the forms and from the Dirichlet coefficients
    of $\zeta_K(s)/\zeta(s)$ (PARI's dirzetak and Moebius inversion), and
    refuses the field if any differ; each $\varepsilon(C)$ is read off the
    decomposition in $K$ of two primes represented by $Q_C$, which must
    agree. Each $Z_Q(2)$ is the Chowla-Selberg expansion with $\pi$,
    $\zeta(3)$, the exponentials and cosines arb's, the Bessel sum cut where
    an explicit bound on its tail falls below $2^{-481}$ and that bound
    added to the radius; the expansion was checked to 137 digits against
    $4\zeta(2)G$ for $m^2+n^2$, $G$ Catalan's constant, and against
    $6\zeta(2)L(2,\chi_{-3})$ for $m^2+mn+n^2$, both from the Hurwitz zeta
    function in balls, and to six digits against a brute-force sum for two
    forms of discriminant $-23$ and $-56$. For $D>0$ the value is
    $-8\pi^6\zeta_K(-1)/D^{3/2}$ with $\zeta_K(-1)=-S/63$ exact, $S$ a
    positive integer from Siegel's formula CITE{Louboutin2004} as the table
    of $\zeta_K(1-2m)$ computes it, and the rational compared with PARI's
    lfun at $s=-1$ recognised with denominator at most $10^{20}$. Every
    value of either kind is compared with PARI's lfun at $s=2$ at 110
    digits, which uses the Dirichlet coefficients and the functional
    equation and shares no code with either route, and the generator refuses
    a value unless the two agree to 100 digits; all 515 do. The seven cyclic
    values are also compared with $\zeta(2)|L(2,\chi)|^2$ from the Hurwitz
    zeta function in balls. Each value is written to 100 significant digits,
    fewer than any ball supports (the worst, $D=-2991$ with $h(D)=48$,
    supports 136). The class number in each comment is PARI's bnfinit
    certified by bnfcertify. The enumeration rests on Hunter's theorem
    CITE{Cohen1993}: every cubic field with $|D|\leq 3000$ is generated by
    an algebraic integer of trace $0$ or $1$ whose minimal polynomial
    $x^3+a_2x^2+a_1x+a_0$ has $|a_1|\leq 18$ and $|a_0|\leq 43$, and the
    fields found in that box, 419 complex and 96 totally real, are exactly
    the terms of OEIS A023679 CITE{OEIS-neg} and A006832 CITE{OEIS-pos} up
    to 3000 counted with multiplicity. Outside the generator, when this was
    written, the 96 rationals $\zeta_K(-1)$ were compared with the values
    stored in the table of $\zeta_K(1-2m)$; the four cyclic values of
    conductor at most $29$ with the $L(2,\chi)$ stored in the table of
    Dirichlet $L$-values; the value for $D=-23$ with the 52 digits of the
    Weeks volume in OEIS A126774 CITE{OEIS-Weeks} through formula
    CITE{formula-weeks}; and every value for $D<0$ with
    $16\pi^5\zeta_K'(-1)/|D|^{3/2}$ from PARI's derivative. The controls
    that must fail failed.

# The table document for the values at s = 2 of the Dedekind zeta functions
# of cubic fields, proposal 5 of agents/table-ideas/BATCH-2026-09-06T1042.md.
# Created as a draft through the API (X-Draft: yes) and filled by generate.py
# beside it; publishing is a person's act on the site.
Title: Values of Dedekind zeta functions of cubic fields at 2
Definition: >-
  Let $K$ be a cubic field CITE{Wiki-cubic} of discriminant $D$ and
  $\zeta_K(s)=\sum_{\mathfrak{a}}N(\mathfrak{a})^{-s}$ its Dedekind zeta
  function CITE{Wiki}, summed over the nonzero ideals of $\mathcal{O}_K$.
  Listed is $\zeta_K(2)$.
Parameters:
  D:
    type: Z
    title: discriminant of $K$
    display: $D$
    constraints: $D$ the discriminant of a cubic field
  k:
    type: Z
    title: index of $K$ among the cubic fields of discriminant $D$
    display: $k$
    constraints: $k\geq 1$
Comments:
  comment-index: >-
    Non-isomorphic cubic fields can share a discriminant, which quadratic
    fields never do. The fields of discriminant $D$ are numbered
    $k=1,2,\ldots$ in lexicographic order of the coefficient vectors
    $(a_2,a_1,a_0)$ of their reduced defining polynomials
    $x^3+a_2x^2+a_1x+a_0$, the polynomial PARI's polredabs returns for the
    field and the LMFDB displays as its defining polynomial; this is the
    index of HREF{Regulators_of_cubic_fields}[the table of regulators of cubic fields]
    and HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[the table of residues of Dedekind zeta functions of cubic fields],
    which hold the same 515 fields. Seven discriminants with $|D|\leq 3000$
    carry more than one field: $D=-972$ and $-1836$ two each, and $D=-1228$,
    $-1356$, $-2075$, $-2188$ and $-2891$ three each; so for $D=-1228$, $k=1$
    is $x^3-x^2+x-7$, $k=2$ is $x^3-x^2+7x-1$ and $k=3$ is $x^3+4x-6$. Every
    other $D$ here carries a single field, with $k=1$. The LMFDB's own index
    for fields sharing a discriminant is not this order, and the label in
    each entry's comment was read from that field's LMFDB page.
  comment-entries: >-
    The comment on each entry gives the reduced polynomial $f$, so that
    $K=\mathbb{Q}(a)$ with $f(a)=0$; the Galois group of the Galois closure,
    $C_3$ or $S_3$; the class number $h_K$; and the LMFDB label. For a
    totally real field it also gives the rational number $\zeta_K(-1)$ from
    which the value follows by the functional equation
    CITE{formula-functional-equation}; those rationals, with $\zeta_K(-3)$
    and $\zeta_K(-5)$, are held in
    HREF{Values_of_Dedekind_zeta_functions_of_totally_real_cubic_fields_at_negative_odd_integers}[the table of values of Dedekind zeta functions of totally real cubic fields at negative odd integers].
  comment-signature: >-
    The sign of $D$ is the signature: $D<0$ for a complex cubic field, with
    one real and one pair of complex embeddings, and $D>0$ for a totally
    real one. For $D>0$ the value is the rational multiple
    $-8\zeta_K(-1)/D^{3/2}$ of $\pi^6$, by the functional equation
    CITE{formula-functional-equation} and the Siegel-Klingen theorem, so
    that $\zeta_K(2)=8\pi^6/(21\cdot 7^3)$ for $D=49$. For $D<0$ the
    function $\zeta_K$ vanishes at $s=-1$, and the functional equation gives
    $\zeta_K(2)$ as a multiple of the derivative $\zeta_K'(-1)$ instead. By
    Zagier's theorem CITE{Zagier1986}, $|D|^{1/2}\zeta_K(2)/\pi^4$ is then a
    rational linear combination of values of the Bloch-Wigner dilogarithm at
    elements of $K$, with no closed form known for the coefficients in
    general.
  comment-volume: >-
    For $D<0$ the value is a hyperbolic volume. By Borel's formula
    CITE{Borel1981}, the volume of the quotient of hyperbolic 3-space by the
    group of units of norm one of a maximal order in a quaternion algebra
    over $K$, ramified at the real place of $K$ and at a finite set $S$ of
    primes, is $|D|^{3/2}\zeta_K(2)\prod_{\mathfrak{p}\in S}(N\mathfrak{p}-1)/(16\pi^4)$.
    The Weeks manifold CITE{Wiki-Weeks}, the closed hyperbolic 3-manifold of
    least volume, arises this way from the field of discriminant $-23$ with
    $S$ the prime of norm $5$ CITE{CFJR2001}, and its volume
    $0.9427073627\ldots$ (OEIS A126774 CITE{OEIS-Weeks}) is
    $3\cdot 23^{3/2}\zeta_K(2)/(4\pi^4)$, formula CITE{formula-weeks}.
    Volumes of hyperbolic knot complements are held in
    HREF{Hyperbolic_volumes_of_the_prime_knots_with_at_most_ten_crossings}[the table of hyperbolic volumes of prime knots].
  comment-galois: >-
    $D$ is a perfect square exactly for the cyclic cubic fields, those with
    Galois group $C_3$, all of which are totally real; the seven here have
    conductors $7$, $9$, $13$, $19$, $31$, $37$ and $43$. For a cyclic field
    $\zeta_K(s)=\zeta(s)L(s,\chi)L(s,\bar\chi)$ with $\chi$ a cubic
    Dirichlet character of that conductor, so
    $\zeta_K(2)=\zeta(2)|L(2,\chi)|^2$, formula CITE{formula-cyclic}; the
    comment on each of the seven names such a $\chi$ by its Conrey label,
    and $L(2,\chi)$ itself is held in
    HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[the table of Dirichlet $L$-values]
    for conductors up to $29$, that is for $D=49$, $81$, $169$ and $361$.
    The other 508 fields have Galois group $S_3$, and for them
    $\zeta_K(2)=\zeta(2)L(2,\rho)$ with $\rho$ the two-dimensional
    representation of $S_3$, formula CITE{formula-artin}.
  comment-forms: >-
    For a complex cubic field, $L(2,\rho)$ is a combination of Epstein zeta
    functions of the positive definite binary quadratic forms of
    discriminant $D$, formula CITE{formula-forms}, because the primes
    represented by the forms of one class all decompose in $K$ in the same
    way. The thirteen pure cubic fields here, those with $D=-3f^2$, are
    named $\mathbb{Q}(\sqrt[3]{m})$ in their comments with the least $m$
    for which that holds; $\mathbb{Q}(\sqrt[3]{2})$ is $D=-108$.
  comment-values: >-
    Every value exceeds $1$, since $\zeta_K(2)$ is an Euler product of
    factors greater than $1$, and the values decrease towards $1$ as the
    field has fewer small prime ideals. The largest here is
    $\zeta_K(2)=1.3529\ldots$ for $D=-2700$, where $2$, $3$ and $5$ all
    ramify, and the smallest is $1.0246\ldots$ for $D=-2707$; the first
    entry, $D=-23$, has $\zeta_K(2)=1.1100010060\ldots$.
  comment-quadratic: >-
    For a quadratic field of discriminant $D$ the analogous value is
    $\zeta_K(2)=\zeta(2)L(2,\chi_D)$, a single Dirichlet $L$-value, held in
    HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[the table of Dirichlet $L$-values]
    for $|D|\leq 30$; for a cubic field the corresponding $L$-function has
    degree two and only splits into Dirichlet $L$-functions when the field
    is cyclic.
Formulas:
  formula-artin: >-
    $\zeta_K(s)=\zeta(s)\,L(s,\rho)$ and so $\zeta_K(2)=\zeta(2)L(2,\rho)$
    for a cubic field with Galois closure $L$ and
    $\mathrm{Gal}(L/\mathbb{Q})=S_3$, where $\rho$ is the irreducible
    two-dimensional representation of $S_3$, because the permutation
    representation of $S_3$ on the three embeddings of $K$ is $1\oplus\rho$.
    Here $\zeta(2)=\pi^2/6$ is in
    HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[the table of values of the Riemann zeta function].
  formula-forms: >-
    For $D<0$, $L(2,\rho)=\frac12\sum_{C}\varepsilon(C)\,Z_{Q_C}(2)$, where
    $C$ runs over the $h(D)$ classes of primitive positive definite binary
    quadratic forms of discriminant $D$, $Q_C$ is a form in the class,
    $Z_Q(s)=\sum_{(m,n)\neq(0,0)}Q(m,n)^{-s}$ is the Epstein zeta function
    of $Q$, and $\varepsilon(C)=1$ if the primes represented by $Q_C$ split
    completely in $K$ and $\varepsilon(C)=-\frac12$ if they stay prime.
    This is Hecke's description of $L(s,\rho)$ as the $L$-series of a
    modular form of weight one CITE{Serre1977}: $\rho$ is induced from a
    cubic character $\psi$ of the ring class group of the order of
    discriminant $D$ in $\mathbb{Q}(\sqrt{D})$, $L(s,\rho)=\sum_C\psi(C)\zeta(s,C)$
    with $\zeta(s,C)=\frac12 Z_{Q_C}(s)$, and $\psi(C)+\psi(C^{-1})=2\varepsilon(C)$.
    Each $Z_Q(2)$ is given by the Chowla-Selberg expansion CITE{ChowlaSelberg1967}
    $Z_Q(2)=\frac{4}{|D|}\Bigl(2\zeta(4)y^2+\frac{\pi\zeta(3)}{y}
    +8\pi^2\sqrt{y}\sum_{n\geq1}n^{3/2}\sigma_{-3}(n)K_{3/2}(2\pi ny)\cos\frac{\pi nb}{a}\Bigr)$
    for $Q=am^2+bmn+cn^2$ and $y=\sqrt{|D|}/(2a)$, where
    $K_{3/2}(z)=\sqrt{\pi/(2z)}\,e^{-z}(1+1/z)$.
  formula-functional-equation: >-
    $\zeta_K(2)=-\frac{8\pi^6}{D^{3/2}}\,\zeta_K(-1)$ for $D>0$ and
    $\zeta_K(2)=\frac{16\pi^5}{|D|^{3/2}}\,\zeta_K'(-1)$ for $D<0$, from
    $\Lambda_K(s)=|D|^{s/2}\Gamma_{\mathbb{R}}(s)^{r_1}\Gamma_{\mathbb{C}}(s)^{r_2}\zeta_K(s)=\Lambda_K(1-s)$
    with $\Gamma_{\mathbb{R}}(s)=\pi^{-s/2}\Gamma(s/2)$,
    $\Gamma_{\mathbb{C}}(s)=2(2\pi)^{-s}\Gamma(s)$ and signature
    $(r_1,r_2)=(3,0)$ for $D>0$, $(1,1)$ for $D<0$. For $D>0$ the value
    $\zeta_K(-1)$ is rational and is held in
    HREF{Values_of_Dedekind_zeta_functions_of_totally_real_cubic_fields_at_negative_odd_integers}[the table of values of Dedekind zeta functions of totally real cubic fields at negative odd integers];
    for $D<0$ it is $0$.
  formula-cyclic: >-
    $\zeta_K(2)=\zeta(2)L(2,\chi)L(2,\bar\chi)=\zeta(2)|L(2,\chi)|^2$ for a
    cyclic cubic field, where $\chi$ is either cubic Dirichlet character of
    conductor $\sqrt{D}$. For $D=49$ and $\chi=\chi_7(2,\cdot)$ in Conrey's
    notation, $L(2,\chi)=0.7992\ldots-0.1018\ldots i$ and
    $\zeta_K(2)=\zeta(2)|L(2,\chi)|^2=1.0677653128\ldots$.
  formula-weeks: >-
    $\mathrm{Vol}(\text{Weeks manifold})=\frac{3\cdot 23^{3/2}}{4\pi^4}\zeta_K(2)
    =0.9427073627769277\ldots$ for the field $K$ of discriminant $-23$
    CITE{CFJR2001}.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      default(realprecision, 60);
      lfun(lfuncreate(x^3 - x^2 + 1), 2)   \\ D = -23: 1.11000100601128264785301716539776257399811264047693467393859
      -8*Pi^6*lfun(lfuncreate(x^3 - x^2 - 2*x + 1), -1)/49^(3/2)   \\ D = 49, from zeta_K(-1) = -1/21
  program-sage:
    language: Sage
    code: |-
      K.<a> = NumberField(x^3 - x^2 + 1)      # D = -23
      K.zeta_function(prec=200)(2)            # 1.1100010060112826478530171653977625739981126404769346739386

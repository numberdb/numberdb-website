Title: Satisfiability thresholds of random $k$-XORSAT
Definition: >-
  For $k\geq3$, random $k$-XORSAT CITE{WikiXORSAT} is a system of
  $m=\lfloor\alpha n\rfloor$ equations over $\mathbb{F}_2$ in $n$ Boolean
  variables, each using $k$ distinct variables and a uniform right-hand side.
  The threshold $\alpha_k$ is its sharp satisfiability transition in the
  density $\alpha$ CITE{PittelSorkin}.
Keywords: XOR-SAT, random linear systems over GF(2), p-spin model, cuckoo hashing
Parameters:
  k:
    type: Z
    title: number of variables in each equation
    display: $k$
    constraints: $k\geq3$
Comments:
  comment-conventions: >-
    The density is $\alpha=m/n$, equations per variable. The average degree of
    the underlying $k$-uniform constraint hypergraph is $k\alpha$, and cuckoo
    hashing with one key per bucket quotes the same number as the load, keys
    per bucket CITE{DGMMPR}. The variables in an equation are chosen without
    replacement; allowing repeated choices gives the same threshold
    CITE{PittelSorkin}.
  comment-k2: >-
    There is no $k=2$ row. In random $2$-XORSAT the limiting probability of
    satisfiability is strictly between $0$ and $1$ below average degree $1$
    and is $0$ above it, so no positive density has the almost-sure
    satisfiability required in this definition CITE{PittelSorkin}.
  comment-core: >-
    Peeling variables that occur in at most one equation leaves the $2$-core
    of the constraint hypergraph, and satisfiability is decided at the density
    where that core has asymptotically equal numbers of equations and
    variables CITE{PittelSorkin}. The
    HREF{k-core_thresholds_of_the_Erdős_Rényi_random_graph}[$k$-core
    thresholds of the Erdős-Rényi random graph] use the same Poisson-tail
    method for graph cores.
Formulas:
  formula-root: >-
    $\xi_k$ is the positive solution of
    $k=\frac{\xi(1-e^{-\xi})}{1-e^{-\xi}-\xi e^{-\xi}}$.
  formula-threshold: >-
    $\alpha_k=\frac{\xi_k}{k(1-e^{-\xi_k})^{k-1}}$ for $k\geq3$
    CITE{PittelSorkin}.
  formula-core: >-
    Equivalently, with $q$ the largest solution of
    $q=1-e^{-k\alpha q^{k-1}}$ and $x=k\alpha q^{k-1}$, the threshold is the
    value of $\alpha$ for which $\alpha q^k=1-e^{-x}-xe^{-x}$
    CITE{PittelSorkin}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      k = 3
      psi = lambda x: x*(1-mp.e**(-x))/(1-mp.e**(-x)-x*mp.e**(-x))
      xi = mp.findroot(lambda x: psi(x) - k, k)
      print(xi/(k*(1-mp.e**(-xi))**(k-1)))

# The table document for T195, Values of the hyperbolic cosine integral $\operatorname{Chi}(x)$. It began as proposal 5 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which put seven
# functions in one table; they are six tables now, one per named
# function, and the relations between them are in `Similar tables`.
Title: Values of the hyperbolic cosine integral $\operatorname{Chi}(x)$
Definition: The hyperbolic cosine integral is $\operatorname{Chi}(x)=\gamma+\log
  x+\int_0^x(\cosh t-1)/t\,\mathrm{d}t$ CITE{DLMFIntegralDefinitions}, where $\gamma$
  is HREF{Stieltjes_constants#0}[the Euler-Mascheroni constant]. This table holds
  it at rational $x>0$.
Keywords:
- hyperbolic cosine integral
- Chi
- Chi(1)
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments: {}
Formulas:
  formula-shi-chi: For $x>0$, $\operatorname{Shi}(x)=\int_0^x\sinh(t)/t\,\mathrm{d}t$
    and $\operatorname{Chi}(x)=\gamma+\log x+\int_0^x(\cosh(t)-1)/t\,\mathrm{d}t$
    CITE{DLMFIntegralDefinitions}.
  formula-ei-shi-chi: For $x>0$, $\operatorname{Ei}(x)=\operatorname{Shi}(x)+\operatorname{Chi}(x)$
    CITE{DLMFIntegralDefinitions}.
  formula-parity: The functions $\operatorname{Si}$ and $\operatorname{Shi}$ are
    odd CITE{DLMFIntegralDefinitions}. With the principal branch of the logarithm,
    for $x>0$, $\operatorname{Ci}(-x)=\operatorname{Ci}(x)+i\pi$ and $\operatorname{Chi}(-x)=\operatorname{Chi}(x)+i\pi$
    CITE{DLMFAnalyticContinuation}.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.rational_field import QQ

      from sage.rings.real_arb import RealBallField


      RBF = RealBallField(numberdb.bits(100, losing=64))

      RBF(QQ(1)).Chi()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.chi(1)'
Similar tables:
- table: HREF{Values_of_the_hyperbolic_sine_integral}[Values of the hyperbolic
    sine integral $\operatorname{Shi}(x)$]
  relation: the companion hyperbolic integral; their sum is $\operatorname{Ei}$
    CITE{formula-ei-shi-chi}
- table: HREF{Values_of_the_exponential_integral}[Values of the exponential integral]
  relation: $\operatorname{Ei}=\operatorname{Shi}+\operatorname{Chi}$
- table: HREF{Values_of_the_cosine_integral}[Values of the cosine integral $\operatorname{Ci}(x)$]
  relation: the same integral with $\cos$ in place of $\cosh$
- table: HREF{Gibbs_constant}[Wilbraham-Gibbs constant]
  relation: stores $\operatorname{Si}(\pi)$ and its normalisations
- table: HREF{Stieltjes_constants}[Stieltjes constants]
  relation: contains $\gamma_0$, the Euler-Mascheroni constant appearing in $\operatorname{Ei}$,
    $\operatorname{Ci}$ and $\operatorname{Chi}$

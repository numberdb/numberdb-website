# Draft document for T233 after splitting the h-star rows to T243.
# Publishing is a person's act.
Title: Ehrhart polynomials of the root polytopes
Definition: For an irreducible crystallographic root system $\Phi$ CITE{WikiRootSystem}, let $P_\Phi=\operatorname{conv}(\Phi)$
  be the full root polytope in the root lattice $\mathbb{Z}\Phi$. This table stores the Ehrhart polynomial
  $L_\Phi(t)=|tP_\Phi\cap\mathbb{Z}\Phi|$.
Keywords:
- root polytope
- Ehrhart polynomial
- root lattice
Tags:
- polynomial
- combinatorics
- discrete geometry
Parameters:
  type:
    type: Symbolic
    title: Dynkin type
    display: type
    constraints: $A_n$ with $n\geq1$, $B_n$ with $n\geq2$, $C_n$ with $n\geq3$, $D_n$ with $n\geq4$, or
      one of $E_6$, $E_7$, $E_8$, $F_4$, $G_2$
Comments:
  conventions: 'Some authors use root polytope for $\operatorname{conv}(\Phi^+\cup\{0\})$; this table
    uses $P_\Phi=\operatorname{conv}(\Phi)$. Counting in $\mathbb{Z}\Phi$ matters: for $C_n$ and $D_n$
    in the usual coordinates, $\mathbb{Z}^n$ also contains $\pm e_i\in P_\Phi$, and counting in $\mathbb{Z}^n$
    gives a different polynomial.'
  small-rank-coincidences: '$n$ follows Bourbaki''s ranges, which list each irreducible root system once:
    $C_2\cong B_2$ and $D_3\cong A_3$. $A_1$ is omitted as a row because its root polytope is a segment,
    with $L_{A_1}(t)=2t+1$ and $h^*_{A_1}(z)=1+z$.'
Formulas:
  formula-series: $\sum_{t\geq0}L_\Phi(t)z^t=h^*_{P_\Phi}(z)/(1-z)^{r+1}$, where $r=\operatorname{rank}(\Phi)$
    CITE{WikiEhrhart}.
  formula-binomial-transform: If $h^*_{P_\Phi}(z)=\sum_i h_i^*z^i$, then $L_\Phi(t)=\sum_i h_i^*\binom{t+r-i}{r}$.
  formula-first-dilate: $L_\Phi(1)=|\Phi|+1$, since the roots and the origin are the lattice points of
    $P_\Phi$.
Programs:
  program-sage:
    language: Sage
    code: "from sage.arith.misc import binomial, factorial\nfrom sage.rings.rational_field import QQ\n\
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing\n\nT = PolynomialRing(QQ,\
      \ \"t\")\nt = T.gen()\n\ndef ehrhart_from_h_star(coefficients):\n    r = len(coefficients) - 1\n\
      \    def choose(poly, m):\n        out = T(1)\n        for j in range(m):\n            out *= poly\
      \ - j\n        return out / factorial(m)\n    return sum(QQ(c)*choose(t + r - i, r) for i, c in\
      \ enumerate(coefficients))\n\nehrhart_from_h_star([1, 16, 36, 16, 1])  # L_{A_4}(t)"
Similar tables:
- table: HREF{T243}[Ehrhart $h^*$-polynomials of the root polytopes]
  relation: gives the numerator $h^*_{P_\Phi}(z)$ of the Ehrhart series; the two tables determine each
    other by CITE{formula-series} and CITE{formula-binomial-transform}
- table: HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[Packing densities and Hermite
    numbers of the classical lattices]
  relation: the lattices $A_n$, $D_n$ and $E_n$, with packing and Hermite data
- table: HREF{Covering_radii_and_covering_densities_of_the_classical_lattices}[Covering radii and covering
    densities of the classical lattices]
  relation: the same classical root lattices, with covering data
- table: HREF{Kissing_numbers}[Kissing numbers $\tau_n$]
  relation: for simply-laced $\Phi$, $L_\Phi(1)-1=|\Phi|$ is the kissing number of $\mathbb{Z}\Phi$; for
    $A_2$, $A_3$, $D_4$ and $E_8$ it is $\tau_n$
- table: HREF{Hermite's_constants}[Hermite's constants $\gamma_n$]
  relation: $\gamma_n$ for $2\leq n\leq8$ is attained by the root lattices $A_2$, $A_3$, $D_4$, $D_5$,
    $E_6$, $E_7$ and $E_8$

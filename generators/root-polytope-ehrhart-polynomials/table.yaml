Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds $L_\Phi(t)$ for $A_n$ and $B_n$ with $2\leq n\leq20$, $C_n$ with $3\leq n\leq20$,
    $D_n$ with $4\leq n\leq20$, and the exceptional types $E_6$, $E_7$, $E_8$, $F_4$ and $G_2$; the range
    stops at $n=20$ because the longest row, $L_{A_{20}}(t)$, is 569 characters, and the $A_1$ case is
    given in the comments
  rigour details: All entries are exact polynomials. The $h^*$-polynomials of CITE{ABHPS}, CITE{BacherHarpeVenkov},
    CITE{BaakeGrimm} and CITE{ConwaySloane} are converted to Ehrhart polynomials by the binomial transform
    in CITE{formula-binomial-transform}. Every stored row was checked against $L_\Phi(1)=|\Phi|+1$. Direct
    lattice-point counts from Sage root-lattice coordinates and PPL facet inequalities matched $A_2$,
    $A_3$, $A_4$, $B_2$, $B_3$, $C_3$, $D_4$, $G_2$ and $F_4$ over the counted dilates.

Title: Minimisers in the core threshold formula of random $k$-uniform hypergraphs
Definition: >-
  For integers $k\geq2$ and $r\geq2$, except $(2,2)$, $\lambda_{k,r}$ is
  the positive $\lambda$ that minimises
  $\lambda/(kQ(\lambda,r-1)^{k-1})$; here
  $Q(\lambda,s)=\mathbb{P}(\mathrm{Po}(\lambda)\geq s)$. The formula is for
  random $k$-uniform hypergraphs CITE{WikiHypergraph}.
Keywords: random hypergraph core, Poisson parameter, core threshold minimiser
Parameters:
  k:
    type: Z
    title: edge size
    display: $k$
    constraints: $k\geq2$
  r:
    type: Z
    title: minimum degree of the core
    display: $r$
    constraints: $r\geq2$
Comments:
  comment-convention: >-
    For $k\geq3$, the notation and indexing match
    HREF{Core_thresholds_of_random_k-uniform_hypergraphs}[the core threshold
    table], whose $c_{k,r}$ is obtained from $\lambda_{k,r}$ by
    CITE{formula-threshold}. The $k=2$ rows use the same minimisation for the
    HREF{k-core_thresholds_of_the_Erdős_Rényi_random_graph}[graph core
    threshold table], which writes thresholds in average-degree normalisation.
Formulas:
  formula-tail: >-
    $Q(\lambda,s)=\mathbb{P}(\mathrm{Po}(\lambda)\geq s)
    =1-e^{-\lambda}\sum_{j=0}^{s-1}\lambda^j/j!$.
  formula-minimiser: >-
    The minimiser $\lambda_{k,r}$ is the unique positive zero of
    $g(\lambda)=Q(\lambda,r-1)
    -(k-1)e^{-\lambda}\lambda^{r-1}/(r-2)!$. The derivative is
    $g'(\lambda)=e^{-\lambda}\lambda^{r-2}((k-1)\lambda-(k-1)(r-1)+1)/(r-2)!$.
  formula-threshold: >-
    $c_{k,r}=\min_{\lambda>0}\lambda/(kQ(\lambda,r-1)^{k-1})
    =\lambda_{k,r}/(kQ(\lambda_{k,r},r-1)^{k-1})$ CITE{Molloy}
    CITE{CainWormald}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      k, r = 3, 2
      Q = lambda x, s: mp.gammainc(s, 0, x, regularized=True)
      g = lambda x: Q(x, r - 1) - (k - 1) * mp.e**(-x) * x**(r - 1) / mp.factorial(r - 2)
      lo = mp.mpf(r - 1) - mp.mpf(1) / (k - 1)
      hi = mp.mpf(4 * (k + r) + 10)
      while g(hi) <= 0:
          hi *= 2
      for _ in range(4 * mp.dps):
          mid = (lo + hi) / 2
          if g(mid) < 0:
              lo = mid
          else:
              hi = mid
      print((lo + hi) / 2)

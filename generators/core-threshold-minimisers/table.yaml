Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{Molloy}
    - CITE{CainWormald}
  complete: 'no'
  complete-note: >-
    it holds $\lambda_{k,r}$ for every $3\leq k\leq8$ and $2\leq r\leq8$,
    and for edge size $k=2$ with $3\leq r\leq12$; $(2,2)$ is omitted because
    the minimum is approached as $\lambda\to0$ and has no positive minimiser
  rigour details: >-
    Each entry is computed in ball arithmetic with 64 guard bits beyond the
    100 digits written. The function
    $\lambda/(kQ(\lambda,r-1)^{k-1})$ has only one minimiser because the sign
    of its derivative is the sign of $g$ in CITE{formula-minimiser}; the
    displayed derivative $g'$ is negative below $(r-1)-1/(k-1)$ and positive
    above it, so $g$ first decreases from $0$ and then increases to $1$,
    crossing zero once on $(0,\infty)$. The computation encloses
    $\lambda_{k,r}$ by bisection on the sign of $g$ between
    $(r-1)-1/(k-1)$ and $4(k+r)+10$, each sign decided in ball arithmetic,
    down to a bracket of half-width $10^{-106}$ whose ends are checked to
    give opposite signs; that bracket is the stored ball. The Poisson tail is
    the finite sum in CITE{formula-tail}. The generator compares every row
    with an mpmath computation at 120 digits that writes $Q$ as the
    regularised incomplete gamma function, compares every derived threshold
    for the $k\geq3$ rows with
    HREF{Core_thresholds_of_random_k-uniform_hypergraphs}[the core threshold
    table], and checks the edge-size-$2$ rows against
    HREF{k-core_thresholds_of_the_Erdős_Rényi_random_graph}[the graph-core
    threshold table].
Display properties:
  number-header: $\lambda_{k,r}$

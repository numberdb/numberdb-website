Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    every dimension $1\leq n\leq 48$ is here, the range in which the
    catalogue's table gives the centre density in closed form; its entries
    for $n=54$, $56$, $64$, $72$, $80$ and $128$ are not listed
  rigour details: >-
    $\delta_n^2$ is a rational number for every $n\leq 48$, transcribed from
    the closed forms of the catalogue's table; $\delta_n$ is written exactly
    where that rational is a square and otherwise as a ball in arb, and
    $\Delta_n$ as the product of $\pi^{\lfloor n/2\rfloor}$, the exact
    rational $V_n/\pi^{\lfloor n/2\rfloor}$ and $\delta_n$, computed with 64
    guard bits beyond the 100 digits written; the widest ball relative to
    its value, $\Delta_{46}$, has radius $6.7\cdot 10^{-119}$. Before any
    entry was written the 48 rationals were compared with the same page
    parsed by a separate program and with the page's own decimals; for
    $n\leq 26$ and $n=30$, $31$, $32$, $36$, $48$ they were recomputed as
    $(\mu/4)^n/\det L$ from a Gram matrix of the record lattice (the Cartan
    matrices, the catalogue's GRAM blocks for $\Lambda_9$ to $\Lambda_{26}$,
    $K_{11}$, $K_{12}$, $K_{13}$, $Q_{30}$, $Q_{31}$, $Q_{32}$, $KP_{36}$
    and $P_{48p}$), with the minimal norm and the number of minimal vectors
    from PARI's qfminim and the determinant exact; $\Delta_2$ to $\Delta_8$,
    $\Delta_{24}$, $\delta_5$ and $\delta_6$ agree with OEIS A093766,
    A093825, A222068 to A222072, A260646, A222066 and A222067 to every digit
    those entries give; the 36 record densities of Table 1 of Cohn's survey
    are $\Delta_n$, or the density of the nonlattice packing the comment
    names, rounded down as that table says; $\Delta_n=V_n\delta_n$ holds in
    balls against the stored digits of the table of unit-ball volumes; the
    entries for $n\leq 24$ agree with the stored digits of the table of the
    classical lattices they link; $\delta_{24-n}=\delta_n$; and the closed
    form and the nonlattice densities in every entry's comment, evaluated
    in balls, enclose the stored values.
Display properties:
  number-header: $\Delta_n$ or $\delta_n$

# The table document for the densities of the densest known lattice sphere
# packings, proposal 2 of agents/table-ideas/BATCH-2026-09-03T1730.md
# (issue #34). Created as a draft through the API (X-Draft: yes) and filled
# by generate.py beside it; publishing is a person's act on the site.
Title: Densities of the densest known lattice sphere packings
Definition: >-
  For each dimension $n\geq 1$, the packing density $\Delta_n=V_n\delta_n$
  and the centre density $\delta_n=\rho^n/\sqrt{\det L}$ of the densest
  lattice sphere packing CITE{Wiki} known in $\mathbb{R}^n$, according to
  the table of densest packings of the Catalogue of Lattices
  CITE{Catalogue-density}, where $L$ is the lattice, $\rho$ its packing
  radius, half the length of a shortest nonzero vector, and $V_n$ the
  volume of the unit ball.
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: $n\geq 1$
  expression:
    type: Symbolic
    title: density or centre density
    values:
      density: $\Delta_n$
      centre: $\delta_n$
    show-in-parameter-list: 'no'
Comments:
  comment-conventions: >-
    $\det L$ is the determinant of a Gram matrix of $L$, the square of the
    volume of a fundamental domain, and $V_n=\pi^{n/2}/\Gamma(n/2+1)$ is the
    HREF{Volume_of_the_unit_ball}[volume of the unit ball]. $\Delta_n$ is
    the fraction of $\mathbb{R}^n$ covered by balls of radius $\rho$ centred
    at the points of $L$, and $\delta_n$ is $\Delta_n$ with the ball's
    volume divided out, the quantity Conway and Sloane CITE{SPLAG} tabulate;
    both are unchanged when $L$ is scaled. $\gamma_n=4\,\delta_n^{2/n}$ is the
    Hermite number of the record lattice, the best lower bound known for
    Hermite's constant in dimension $n$.
  comment-known: >-
    "Known" means listed in the catalogue's table of densest packings
    CITE{Catalogue-density} as revised in February 2012, which gives the
    centre density of the densest lattice known in every dimension
    $n\leq 48$ in closed form; Table 1 of Cohn's survey CITE{Cohn}, taken
    from Conway and Sloane CITE{SPLAG}, lists the same record densities for
    $n\leq 36$. The record is proven for $n\leq 8$ (Lagrange for $n=2$
    CITE{Lagrange}, Gauss for $n=3$ CITE{Gauss}, Korkine and Zolotareff for
    $n=4,5$ CITE{KZ}, Blichfeldt for $n=6,7,8$ CITE{Blichfeldt}), for $n=24$
    CITE{CohnKumar}, and for $n=9$ by the enumeration of the perfect
    lattices in dimension $9$ of Dutour Sikirić and van Woerden CITE{DSvW};
    in every other dimension a denser lattice may exist. The densest
    packing of any kind is known for $n=1$, $2$ CITE{ThueFejesToth}, $3$
    CITE{Hales}, $8$ CITE{Viazovska} and $24$ CITE{CKMRV}, and is the
    lattice packing in each case.
  comment-lattices: >-
    For $n\leq 24$ the record lattice is the laminated lattice $\Lambda_n$
    CITE{Laminated} except in dimensions $11$, $12$ and $13$, where the
    Coxeter–Todd lattice $K_{12}$ CITE{CoxeterTodd} and its laminations
    $K_{11}$ and $K_{13}$ are denser; $\Lambda_n$ for $n\leq 8$ is
    $\mathbb{Z}$, $A_2$, $A_3$, $D_4$, $D_5$, $E_6$, $E_7$, $E_8$,
    $\Lambda_{16}$ is the Barnes–Wall lattice and $\Lambda_{24}$ the Leech
    lattice. The densities of all of these are also in the
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[table of the classical lattices],
    which the entries for $n\leq 24$ link. Beyond $n=24$ the records are
    $\Lambda_{25}$ and $\Lambda_{26}$, Bacher's lattices $B_{27}$, $B_{28}$
    and $B_{29}$ CITE{Bacher}, Quebbemann's lattice $Q_{32}$
    CITE{Quebbemann} and its sections $Q_{30}$ and $Q_{31}$, lattices
    $Q_{33}$ and $Q_{34}$ of Elkies, $B_{35}$, the Kschischang–Pasupathy
    lattice $KP_{36}$ CITE{KP}, lattices the catalogue calls $D_{37}$ and
    $D_{38}$ (not the root lattices), sections of $P_{48p}$ for
    $39\leq n\leq 47$, and in dimension $48$ the even unimodular lattices
    $P_{48n}$, $P_{48p}$ and $P_{48q}$ of minimal norm $6$, all as named on
    the catalogue's page CITE{Catalogue-density}. The entry comment names
    the lattice of each row.
  comment-nonlattice: >-
    In dimensions $10$, $11$, $13$, $18$, $19$, $20$, $21$, $22$, $23$,
    $27$, $28$, $29$, $30$, $44$, $45$, $46$ and $47$ a nonlattice packing
    denser than every lattice packing known exists, and the entry comment
    gives its centre density: the packings $P_{10c}$, $P_{11a}$, $P_{13a}$,
    $B_{18}$ CITE{BierbrauerEdel}, $R_{22}$ CITE{Antipode}, $B_{27}^{*}$,
    $B_{28}^{*}$, $B_{29}^{*}$, $T_{30}$ CITE{VardyDoubling} and $T_{46}$
    CITE{Antipode} of the catalogue's table, and the antipode packings of
    Chen, Hu, Li, Wang and Wu CITE{Antipode2025} in dimensions $19$, $20$,
    $21$, $23$, $44$, $45$ and $47$, which are denser than the packings
    $B_{20}$ CITE{Vardy20}, $T_{44}$, $T_{45}$ and $T_{47}$ CITE{Antipode}
    that the table of 2012 names. Their densities are not entries, since a
    nonlattice packing has no Gram matrix and this table is about lattices.
  comment-entries: >-
    The comment on each entry gives its value in closed form, always
    $\pi^{\lfloor n/2\rfloor}$ times an algebraic number of degree at most
    $2$, and names the lattice; on a centre density for $n\leq 24$ it also
    gives the determinant of the lattice scaled to minimal norm $4$, which
    for $\Lambda_n$ is OEIS A028921 CITE{OEISdet}.
Formulas:
  formula-relation: >-
    $\Delta_n=V_n\,\delta_n$ with $V_n=\pi^{n/2}/\Gamma(n/2+1)$ the
    HREF{Volume_of_the_unit_ball}[volume of the unit ball], and
    $\delta_n=(\gamma_n/4)^{n/2}$ where $\gamma_n=\mu/(\det L)^{1/n}$ is the
    Hermite number of the record lattice $L$ of minimal norm $\mu$.
  formula-laminated: >-
    $\delta_n=1/\sqrt{\det\Lambda_n}$ for $1\leq n\leq 24$, $n\neq 11,12,13$,
    with $\Lambda_n$ scaled to minimal norm $4$, where $\det\Lambda_n$ for
    $n=0,1,\ldots,24$ is $1$, $4$, $12$, $32$, $64$, $128$, $192$, $256$,
    $256$, $512$, $768$, $1024$, $1024$, $1024$, $768$, $512$, $256$, $256$,
    $192$, $128$, $64$, $32$, $12$, $4$, $1$ CITE{OEISdet};
    $\delta_{11}=\delta_{13}=\frac{1}{18\sqrt{3}}$ and $\delta_{12}=\frac{1}{27}$
    from $\det K_{11}=\det K_{13}=972$ and $\det K_{12}=729$. Hence
    $\delta_{24-n}=\delta_n$ for $0\leq n\leq 24$.
  formula-famous: >-
    $\Delta_1=1$, $\Delta_2=\frac{\pi}{2\sqrt{3}}$, $\Delta_3=\frac{\pi}{3\sqrt{2}}$,
    $\Delta_4=\frac{\pi^2}{16}$, $\Delta_8=\frac{\pi^4}{384}$ and
    $\Delta_{24}=\frac{\pi^{12}}{12!}$; $\delta_{48}=\left(\frac{3}{2}\right)^{24}$,
    since an even unimodular lattice of minimal norm $6$ has $\rho^2=\frac{3}{2}$
    and $\det L=1$.
Programs:
  program-sage:
    language: Sage
    code: |-
      n = 24; delta = 1                                     # Leech lattice: rho^2 = 1, det 1
      Delta = pi^(n/2) / gamma(n/2 + 1) * delta             # 1/479001600*pi^12
      n = 9; delta = sqrt(2)/32                             # Lambda_9: 1/sqrt(det) at minimal norm 4, det 512
      Delta = pi^(n/2) / gamma(n/2 + 1) * delta             # 1/945*sqrt(2)*pi^4
      n = 32; delta = 3^16 / 2^24                           # Q_32: rho^2 = 3/2, det 2^16
      Delta = pi^(n/2) / gamma(n/2 + 1) * delta             # 59049/481517373489152000*pi^16

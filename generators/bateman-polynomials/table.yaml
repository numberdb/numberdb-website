Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every index $n$ with $0\leq n\leq30$
  rigour details: >-
    The generator computes $F_n(x)$ by the three-term recurrence
    CITE{formula-recurrence}, with every division made in Sage's rational
    field. Before the draft was created, the entries were checked against
    the terminating hypergeometric formula CITE{formula-hypergeometric},
    against the ordinary generating function CITE{formula-generating-function},
    against the six polynomials printed by CITE{Wiki}, and against the
    special values in CITE{formula-special-values} for every entry. The
    orthogonality formula CITE{formula-orthogonality} was checked in ball
    arithmetic on the pairs $(0,0)$, $(1,1)$, $(2,2)$, $(3,3)$, $(5,5)$,
    $(3,4)$ and $(2,5)$ on the cutoff interval $[-120,120]$, after the
    control integral for $\operatorname{sech}^2(\pi x/2)$ returned the
    known value $4/\pi$ and a wrong target was rejected.

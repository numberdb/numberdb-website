Title: Bateman polynomials $F_n(x)$
Definition: >-
  For an integer $n\geq 0$, the Bateman polynomial $F_n(x)$ is the
  polynomial in $\mathbb{Q}[x]$ defined by the terminating hypergeometric
  series
  $F_n(x)={}_3F_2\left(-n,n+1,\frac{x+1}{2};1,1;1\right)$ CITE{Wiki}.
Parameters:
  n:
    type: Z
    title: index
    display: $n$
    constraints: $n\geq 0$
Comments:
  comment-convention: >-
    This table holds Bateman's $F_n(x)$, not Bateman's polynomials
    $Z_n(x)={}_2F_2(-n,n+1;1,1;x)$. OEIS A073768 CITE{OEISZ} is a table of
    the coefficients of $n!Z_n(-x)$.
  comment-pasternack: >-
    Pasternack's polynomials $F_n^m(x)$ add a second parameter $m$ and
    specialise to this table at $m=0$ CITE{Wiki}.
  comment-orthogonal: >-
    The polynomials $B_n(x)=i^nF_n(ix)$ are real polynomials orthogonal on
    the real line for the weight $\operatorname{sech}^2(\pi x/2)$
    CITE{Koelink}.
  comment-touchard: >-
    Carlitz relates $F_n$ to Touchard's polynomials $Q_n$ in
    CITE{formula-touchard-q}. These $Q_n$ are not the
    HREF{Touchard_polynomials}[Touchard polynomials] $T_n$ whose coefficients
    are Stirling numbers of the second kind.
Formulas:
  formula-hypergeometric: >-
    $F_n(x)=\sum_{j=0}^{n}
    \frac{(-n)_j(n+1)_j\left(\frac{x+1}{2}\right)_j}{(j!)^3}$, where
    $(a)_j$ is the rising factorial.
  formula-recurrence: >-
    $F_0(x)=1$, $F_1(x)=-x$, and
    $(n+1)^2F_{n+1}(x)=-(2n+1)xF_n(x)+n^2F_{n-1}(x)$ for $n\geq1$
    CITE{Wiki}.
  formula-generating-function: >-
    $\sum_{n=0}^{\infty}F_n(x)t^n=(1-t)^x\,
    {}_2F_1\left(\frac{x+1}{2},\frac{x+1}{2};1;t^2\right)$ CITE{Wiki}.
  formula-legendre: >-
    $F_n\!\left(\frac{d}{dy}\right)\operatorname{sech} y
    =\operatorname{sech} y\,P_n(\tanh y)$, where $P_n$ is the
    HREF{Legendre_polynomials}[Legendre polynomial] CITE{Wiki}.
  formula-orthogonality: >-
    If $B_n(x)=i^nF_n(ix)$, then
    $\int_{-\infty}^{\infty}B_m(x)B_n(x)\operatorname{sech}^2(\pi x/2)\,dx
    =\frac{4}{\pi(2n+1)}\delta_{m,n}$ CITE{Koelink}.
  formula-special-values: >-
    $F_n(-1)=1$, $F_n(1)=(-1)^n$, $F_{2k+1}(0)=0$, and
    $F_{2k}(0)=\left(\binom{2k}{k}/4^k\right)^2$.
  formula-touchard-q: >-
    Touchard's polynomials $Q_n$ satisfy
    $Q_n(x)=(-1)^n2^n n!\binom{2n}{n}^{-1}F_n(2x+1)$ CITE{Carlitz}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing
      from sage.rings.rational_field import QQ

      R = PolynomialRing(QQ, 'x')
      x = R.gen()

      def bateman_polynomial(n):
          values = [R.one()]
          if n >= 1:
              values.append(-x)
          for k in range(1, n):
              numerator = -QQ(2*k + 1)*x*values[k] + QQ(k*k)*values[k - 1]
              values.append(numerator / QQ((k + 1)*(k + 1)))
          return values[n]

      bateman_polynomial(31)      # the next one after this table

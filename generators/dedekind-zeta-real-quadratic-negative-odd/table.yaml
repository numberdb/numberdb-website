Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  rigour details: >-
    Each value is $B_{2m}B_{2m,\chi_D}/(2m)^2$ in exact rational arithmetic.
    The generator refuses a value unless it equals Siegel's $\sigma_1$
    formula at $s=-1$ and satisfies the functional equation in ball
    arithmetic at every $s$, with $\zeta_K(2m)$ computed independently from
    the Hurwitz zeta function at 256 bits (worst radius $3\cdot 10^{-74}$).
    All 906 were also compared with PARI's lfun for 121 of the fields, with
    the generalized Bernoulli numbers stored in T49 for $D=5,8$, and with the
    OEIS array A370412/A370411.
Display properties:
  number-header: $\zeta_K(s)$

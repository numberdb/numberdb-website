# The table document for numberdb.org/T449. It was created as a draft through
# the API with X-Draft: yes and is filled by generate.py beside it. Publishing
# is a person's act on the site.
Title: Best known packings of equal circles in an equilateral triangle
Definition: >-
  For each integer $n\geq2$, $d_n$ is the largest possible minimum distance
  among $n$ points in a unit-side equilateral triangle. The table also stores
  $S_n=2\sqrt3+2/d_n$, the side length of the smallest equilateral triangle
  containing $n$ non-overlapping unit circles. Thus each packing value is
  listed in two invertible normalisations.
Keywords:
  - circle packing
  - circles in an equilateral triangle
  - equal circles in a triangle
  - point packing in a triangle
Parameters:
  n:
    type: Z
    title: number of circles
    display: $n$
    constraints: $n\geq2$
  normalisation:
    type: Symbolic
    title: whether the row holds the separation $d_n$ or the container side length $S_n$
    display: normalisation
    constraints: either `separation` or `container`
    values:
      separation: $d_n$
      container: $S_n$
Comments:
  comment-normalisation: >-
    The `separation` rows measure points in a unit-side equilateral triangle.
    The `container` rows use unit small circles and give the side length of the
    enclosing equilateral triangle.
  comment-source: >-
    The source table copied from Wikipedia CITE{WikiTriangle} was read on
    23-Sep-2026. It lists exact side lengths for $1\leq n\leq15$ and states
    that optimality is proven for $n\leq15$.
  comment-proof-status: >-
    Optimality is proven for every stored row, $2\leq n\leq15$ CITE{Melissen}
    CITE{Payan}. The conjectural families beyond this range are not included
    here.
Formulas:
  formula-conversion: >-
    $S_n=2\sqrt3+2/d_n$, equivalently $d_n=2/(S_n-2\sqrt3)$.
  formula-triangular: >-
    If $n=k(k+1)/2$ for one of the stored triangular-number rows, then
    $S_n=2(k-1)+2\sqrt3$ and $d_n=1/(k-1)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.real_arb import RealBallField

      R = RealBallField(numberdb.bits(100, losing=64))
      S8 = R(2) + R(2) * R(3).sqrt() + (R(2) / R(3)) * R(33).sqrt()
      d8 = R(2) / (S8 - R(2) * R(3).sqrt())
      d8, S8

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds both normalisations for every $2\leq n\leq15$ from the source
    table, the range for which it gives exact side-length formulas and proven
    optimality
  rigour details: >-
    Each container row is computed in Sage real ball arithmetic from the exact
    radical formula transcribed from CITE{WikiTriangle}. Each transcribed
    formula was checked against the decimal printed beside it in the source
    table. The separation rows are computed from Formula CITE{formula-conversion},
    and the generator checks that converting them back gives the same $S_n$.

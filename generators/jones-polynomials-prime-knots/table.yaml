Data properties:
  type: Z[]
  rigour: exact
  complete: 'yes'
  rigour details: >-
    Each polynomial is Sage's jones_polynomial() of the closure of KnotInfo's
    braid word for the knot, which evaluates a representation of the braid
    group. Before it is written the generator requires it to agree exactly
    with the Kauffman bracket state sum on the planar diagram of the same
    closure, and up to $t\mapsto t^{-1}$ with the Jones polynomial of Sage's
    Knots().from_table, whose braid word comes from the Knot Atlas; the entry
    of $\bar K$ is computed from the mirror image of the link and must equal
    $V_K(t^{-1})$. The value must satisfy $V(1)=1$, $V(\omega)=1$,
    $|V(-1)|=\det K$, the span and sign conditions for alternating and
    non-alternating knots, $V(t)=V(t^{-1})$ exactly for the 20 amphichiral
    and the six symmetric chiral knots, and the closed form for the six
    torus knots. Outside the generator all 249 polynomials of $K$ were
    compared with the jones_polynomial column of KnotInfo (package
    database_knotinfo 2026.9.1, computed from KnotInfo's own diagrams) and
    agree exactly, so the mirror entries agree with it under
    $t\mapsto t^{-1}$; $|V(-1)|$ was compared with $|\Delta(-1)|$ for
    KnotInfo's Alexander polynomials and $V(i)=(-1)^{\mathrm{Arf}}$ with
    its Arf invariants; and the determinant, signature, amphichirality and
    alternating facts in the comments were compared with KnotInfo's columns.
Display properties:
  number-header: $t^{-m}V_K(t)$

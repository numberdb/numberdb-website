Title: Minimal polynomials of the Pisot numbers less than the golden ratio
Definition: >-
  Let $\varphi=(1+\sqrt5)/2$ be the golden ratio, and let $\theta_r$ be the
  $r$-th smallest Pisot-Vijayaraghavan number CITE{Wiki} in the interval
  $(1,\varphi)$. The table stores the monic minimal polynomial
  $m_r(x)\in\mathbb{Z}[x]$ of $\theta_r$.
Parameters:
  r:
    type: Z
    title: rank
    display: $r$
    constraints: $r\geq1$
Comments:
  comment-classification: >-
    Dufresnoy and Pisot proved that HREF{Golden_ratio#phi}[$\varphi$] is the
    smallest limit point of the set of Pisot numbers and determined all Pisot
    numbers in $(1,\varphi)$ CITE{DP}. The polynomials $m_r(x)$ here are the
    irreducible factors whose roots in $(1,\varphi)$ give that increasing
    sequence, as recorded in CITE{Bertin} and CITE{McKeeSmyth} for the
    classification.
  comment-roots: >-
    Each entry comment links to the matching root $\theta_r$ in
    HREF{Pisot_numbers_less_than_the_golden_ratio}[the Pisot-number table].
Formulas:
  formula-families: >-
    The roots $\theta_r$ in $(1,\varphi)$ come from
    $P_n(x)=x^n(x^2-x-1)+1$ and $Q_n(x)=x^n(x^2-x-1)+x^2-1$ for $n\geq2$,
    together with $E(x)=x^6-2x^5+x^4-x^2+x-1$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<x> = QQ[]
      P = lambda n: x^n*(x^2 - x - 1) + 1
      Q = lambda n: x^n*(x^2 - x - 1) + x^2 - 1
      E = x^6 - 2*x^5 + x^4 - x^2 + x - 1
      RR = RealIntervalField(400)
      phi = (RR(1) + RR(5).sqrt())/2
      def pisot_factor(f):
          out = []
          for g, e in f.factor():
              out += [(root, g) for root, m in g.roots(RR)
                      if root.lower() > 1 and root.upper() < phi.lower()]
          return out[0]
      polys = [P(n) for n in range(2, 30)] + [Q(n) for n in range(2, 30)] + [E]
      [g for root, g in sorted(pisot_factor(f) for f in polys)[:10]]
Similar tables:

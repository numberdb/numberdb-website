Title: Minimal polynomials of the Pisot numbers less than the golden ratio
Definition: Let $\varphi=(1+\sqrt5)/2$ be the golden ratio, and let $\theta_r$ be the $r$-th
  smallest Pisot-Vijayaraghavan number CITE{Wiki} in the interval $(1,\varphi)$. The table
  stores the monic minimal polynomial $m_r(x)\in\mathbb{Z}[x]$ of $\theta_r$.
Parameters:
  r:
    type: Z
    title: rank
    display: $r$
    constraints: $r\geq1$
Comments:
  comment-classification: Dufresnoy and Pisot proved that HREF{Golden_ratio#phi}[$\varphi$]
    is the smallest limit point of the set of Pisot numbers and determined all Pisot numbers
    in $(1,\varphi)$ CITE{DP}. Each $m_r(x)$ is the irreducible factor with a root in $(1,\varphi)$
    of one of the polynomials $P_n$, $Q_n$ or $E$ of Formula CITE{formula-families} CITE{Bertin}
    CITE{McKeeSmyth}.
  comment-mahler: 'The Mahler measure of each polynomial here is $\theta_r$: the polynomial
    is monic, $\theta_r$ is its only root outside the unit circle, and all other roots lie
    inside the unit disc.'
Formulas:
  formula-families: The roots $\theta_r$ in $(1,\varphi)$ come from $P_n(x)=x^n(x^2-x-1)+1$
    and $Q_n(x)=x^n(x^2-x-1)+x^2-1$ for $n\geq2$, together with $E(x)=x^6-2x^5+x^4-x^2+x-1$.
Programs:
  program-sage:
    language: Sage
    code: "R.<x> = QQ[]\nP = lambda n: x^n*(x^2 - x - 1) + 1\nQ = lambda n: x^n*(x^2 - x -\
      \ 1) + x^2 - 1\nE = x^6 - 2*x^5 + x^4 - x^2 + x - 1\nRR = RealIntervalField(400)\nphi\
      \ = (RR(1) + RR(5).sqrt())/2\ndef pisot_factor(f):\n    out = []\n    for g, e in f.factor():\n\
      \        out += [(root, g) for root, m in g.roots(RR)\n                if root.lower()\
      \ > 1 and root.upper() < phi.lower()]\n    return out[0]\npolys = [P(n) for n in range(2,\
      \ 30)] + [Q(n) for n in range(2, 30)] + [E]\n[g for root, g in sorted(pisot_factor(f)\
      \ for f in polys)[:10]]"

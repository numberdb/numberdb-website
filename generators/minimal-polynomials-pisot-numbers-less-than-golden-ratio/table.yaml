Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: it holds the minimal polynomials for $\theta_1$ to $\theta_{79}$, matching
    the range in HREF{Pisot_numbers_less_than_the_golden_ratio}[the root table] exactly
  rigour details: The generator forms the exact integer polynomials given in Formula CITE{formula-families}
    and factors them over $\mathbb Q$. It selects the irreducible factor whose real root lies
    in $(1,\varphi)$ and stores the monic factor exactly. A verification run checks that this
    root is contained in the corresponding stored interval in HREF{Pisot_numbers_less_than_the_golden_ratio}[the
    root table]. The first ten polynomials agree with the source table quoted by Wikipedia's
    small-Pisot-numbers section.
Display properties:

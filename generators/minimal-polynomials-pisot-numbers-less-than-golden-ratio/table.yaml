Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the minimal polynomials for the first $50$ Pisot numbers in
    $(1,\varphi)$, matching the range in
    HREF{Pisot_numbers_less_than_the_golden_ratio}[the root table] exactly
  rigour details: >-
    The generator forms the exact integer polynomials given in Formula
    CITE{formula-families} and factors them over $\mathbb Q$. It selects the
    irreducible factor whose real root lies in $(1,\varphi)$, verifies that
    this root is contained in the corresponding stored interval in
    HREF{Pisot_numbers_less_than_the_golden_ratio}[the root table], and stores
    the monic factor exactly. The first ten polynomials agree with the source
    table quoted by Wikipedia's small-Pisot-numbers section.

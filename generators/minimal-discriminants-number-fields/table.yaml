Data properties:
  type: Z
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every signature of degree $2$ to $9$ whose minimum is a theorem,
    which is all of them but $(7,1)$ and $(5,2)$ in degree $9$, 26 entries in
    all
  rigour details: >-
    Each value is an integer proved to be the minimum in the paper its entry
    cites, and was read from three independent copies: those papers
    (Battistoni's Theorem 1 for the four rows of degrees $8$ and $9$ that it
    settles), OEIS A343290 with the five row and column sequences named in
    the comments, and the LMFDB's list of fields for each signature, which
    states the bound to which it is complete. For every entry the generator
    recomputes, with PARI, the discriminant of the quoted polynomial
    (nfdisc), its number of real roots (polsturm), its reduced form
    (polredabs), the Galois group of its splitting field (polgalois) and its
    class number (bnfinit certified by bnfcertify), and refuses to return a
    value on any disagreement. Where a complete enumeration is within reach
    the minimum is re-derived rather than trusted: for the quadratic rows no
    fundamental discriminant of the right sign is smaller; for the cubic rows
    Hunter's box CITE{Cohen1993} lists every cubic field with smaller $|D|$
    and finds none of the signature; for the totally real rows of degree $4$
    to $8$ Sage's enumerate_totallyreal_fields_all, an implementation of
    Voight's algorithm CITE{Voight2008} sharing no code with the LMFDB,
    returns exactly one field up to the value, isomorphic to the quoted one.
    The mixed signatures from degree $4$ on and all of degree $9$ rest on the
    cited papers and the LMFDB's completeness statement. Outside the
    generator, when this was written, every value was also compared with
    Odlyzko's unconditional lower bound for its signature and with
    Minkowski's bound, and Liang and Zassenhaus's polynomial for the totally
    complex sextic field was shown by nfisisom to define the field quoted.
Display properties:
  number-header: $d_K$

# The table document for the minimal discriminants of number fields by
# degree and signature, proposal 1 of agents/table-ideas/BATCH-2026-09-06T1042.md.
# Created as a draft through the API (X-Draft: yes) and filled by generate.py
# beside it; publishing is a person's act on the site.
Title: Minimal discriminants of number fields by degree and signature
Definition: >-
  Let $K$ be a number field of degree $n$ with $r_1$ real and $r_2$ complex
  places, $r_1+2r_2=n$, and let $d_K$ be its discriminant CITE{Wiki-disc}.
  Listed, for each degree $n\geq 2$ and each $r_2$, is the discriminant
  $d_K$ of the number field $K$ of degree $n$ and signature $(r_1,r_2)$ for
  which $|d_K|$ is least.
Parameters:
  n:
    type: Z
    title: degree of $K$
    display: $n$
    constraints: $n\geq 2$
  r2:
    type: Z
    title: number of complex places of $K$
    display: $r_2$
    constraints: $0\leq r_2\leq n/2$
Comments:
  comment-sign: >-
    The sign of $d_K$ is $(-1)^{r_2}$ CITE{Wiki-Brill}, so the value listed
    is negative exactly when $r_2$ is odd; the minimum is taken over $|d_K|$,
    and the value is stored with its sign. The absolute values are OEIS
    A343290 CITE{OEIS-A343290}, read by rows; their minima over the
    signatures of one degree are A006557 CITE{OEIS-A006557}, split into
    positive and negative discriminants as A343690 CITE{OEIS-A343690} and
    A343772 CITE{OEIS-A343772}; and the columns $r_2=0$ and $r_2=1$ are
    A006554 CITE{OEIS-A006554} and A006555 CITE{OEIS-A006555}.
  comment-entries: >-
    Each minimum is attained by a single field up to isomorphism. The
    comment on each entry gives the reduced defining polynomial $f$ of that
    field, PARI's polredabs and the polynomial the LMFDB displays, so that
    $K=\mathbb{Q}(x)$ with $f(x)=0$; the Galois group of the Galois closure,
    as the transitive group $nTk$ CITE{LMFDB-nf}; the class number $h_K$; the
    LMFDB label; the quadratic subfield if there is one; the paper in which
    the minimum was proved; and the absolute discriminant of the next field
    of the same signature. Uniqueness and the next field are read off the
    LMFDB's list for the signature, which is complete to a bound beyond the
    minimum in every case here CITE{LMFDB-completeness}.
  comment-history: >-
    In degree $2$ the discriminants are the fundamental discriminants, so
    the minima are $5$ and $-3$. The two cubic minima are the first entries
    of HREF{Regulators_of_cubic_fields}[the table of regulators of cubic
    fields], which lists every cubic field with $|D|\leq 3000$. From degree
    $4$ on each row is a theorem of the geometry of numbers: an element of
    small trace and small $T_2$-norm generates the field (Hunter, Pohst,
    Martinet), its minimal polynomial has bounded coefficients, and a finite
    search closes the signature. Odlyzko's lower bounds CITE{Odlyzko1990},
    from the explicit formula of the Dedekind zeta function, are what keep
    the searches finite in degrees $7$ to $9$. Voight CITE{Voight2008}
    enumerated every totally real field of root discriminant at most $14$,
    of which there are $1229$, each of degree at most $9$; the column
    $r_2=0$ of this table is contained in that list.
  comment-open: >-
    In degree $9$ the signatures $(7,1)$ and $(5,2)$ are open and are not
    listed. The smallest fields known, in the LMFDB, have
    $|d_K|=1904081383$ for $(7,1)$ and $|d_K|=453771377$ for $(5,2)$;
    Odlyzko's unconditional bounds CITE{Odlyzko-tables} give
    $|d_K|>1106389454$ and $|d_K|>289155515$ respectively, the best of his
    Table 4 over its parameter $b$. Battistoni's classification
    CITE{Battistoni2020} closed the other three signatures of degree $9$ and
    the last two of degree $8$, and found in signature $(3,3)$ two fields
    sharing the discriminant $-142989047$ and a field of discriminant
    $-129079703$ that was not previously known, neither the minimum. In
    degree $10$ no signature is settled. $\mathbb{Q}$, of degree $1$ and
    discriminant $1$, is left out.
  comment-named: >-
    Several of the fields are familiar under other names: $\mathbb{Q}(\sqrt5)$
    and $\mathbb{Q}(\sqrt{-3})$ in degree $2$; $\mathbb{Q}(\zeta_7)^+$, of
    discriminant $49=7^2$, and the field of the plastic number, the real root
    of $x^3-x-1$, in degree $3$, whose regulators and residues are the first
    entries of HREF{Regulators_of_cubic_fields}[the table of regulators] and
    HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[the table of
    residues of cubic fields]; $\mathbb{Q}(\zeta_{11})^+$, of discriminant
    $14641=11^4$, in degree $5$; and in degree $6$ the cyclic field of
    conductor $35$, the compositum of $\mathbb{Q}(\sqrt5)$ and
    $\mathbb{Q}(\zeta_7)^+$, of discriminant $5^3\cdot7^4$. Every field
    listed has class number $1$. The three quartic minima have Galois group
    the dihedral group of order $8$, and the minimum in every signature of
    degree $7$, and in $(6,1)$, $(1,4)$ and $(3,3)$ of degrees $8$ and $9$,
    is attained by a field whose Galois group is the full symmetric group.
  comment-bounds: >-
    Every value here exceeds Odlyzko's unconditional lower bound for its
    signature CITE{Odlyzko-tables} by a factor between $1.01$ (degree $2$)
    and $3.4$ (signature $(7,0)$), and Minkowski's bound
    CITE{formula-minkowski} by much more; the ratio of the minimum to the
    Odlyzko bound grows with $r_1$, which is why the totally real signatures
    were the last to be settled in each degree.
Formulas:
  formula-sign: >-
    $\operatorname{sign}(d_K)=(-1)^{r_2}$, where $r_2$ is the number of
    complex places of $K$ CITE{Wiki-Brill}.
  formula-minkowski: >-
    $|d_K|\geq\left(\frac{n^n}{n!}\right)^2\left(\frac{\pi}{4}\right)^{2r_2}$
    for every number field $K$ of degree $n$ with $r_2$ complex places,
    Minkowski's bound CITE{Wiki-Minkowski}; in particular $|d_K|>1$ for
    $n\geq 2$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      nfdisc(x^5 - x^3 - x^2 + x + 1)      \\ 1609, the minimum for signature (1,2)
      polsturm(x^5 - x^3 - x^2 + x + 1)    \\ 1 real root, so r_1 = 1 and r_2 = 2
  program-sage:
    language: Sage
    code: |-
      K.<a> = NumberField(x^5 - x^3 - x^2 + x + 1)
      K.discriminant(), K.signature()                  # (1609, (1, 2))
      from sage.rings.number_field.totallyreal_rel import enumerate_totallyreal_fields_all
      enumerate_totallyreal_fields_all(7, 20134393)    # [[20134393, x^7 - x^6 - 6*x^5 + 4*x^4 + 10*x^3 - 4*x^2 - 4*x + 1]]

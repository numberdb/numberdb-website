Title: 'Ramanujan''s class invariants $G_n$, with Weber''s $\mathfrak f(\sqrt{-n})$'
Definition: >-
  For a positive integer $n$, take $\sqrt{-n}=i\sqrt n$, set
  $\tau=i\sqrt n$ and $q=e^{-\pi\sqrt n}=e^{\pi i\tau}$. The rows store
  Ramanujan's class invariant
  $G_n=2^{-1/4}q^{-1/24}\prod_{m\geq1}(1+q^{2m-1})$ and Weber's
  $\mathfrak f(\sqrt{-n})=\mathfrak f(i\sqrt n)$, with
  $G_n=2^{-1/4}\mathfrak f(i\sqrt n)$ CITE{BorweinBorwein}
  CITE{Duke} CITE{BerndtChanZhang}.
Parameters:
  n:
    type: Z
    title: positive integer
    display: $n$
    constraints: positive integer
  normalisation:
    type: Symbolic
    title: convention
    display: convention
    values:
      ramanujan: $G_n$
      weber: $\mathfrak f(i\sqrt n)$
Comments:
  comment-cm-point: >-
    The index $n$ is the $r$ used for the CM point in the other singular-value
    tables. The point is $\tau=i\sqrt n$, and the order is
    $\mathbb{Z}[\sqrt{-n}]$, of discriminant $-4n$.
  comment-conventions: >-
    The `ramanujan` rows store $G_n$. The `weber` rows store
    $\mathfrak f(i\sqrt n)$. These are two invertible normalisations because
    $\mathfrak f(i\sqrt n)=2^{1/4}G_n$.
Formulas:
  formula-weber-eta: >-
    Weber's function is
    $\mathfrak f(\tau)=\eta(\tau)^2/(\eta(\tau/2)\eta(2\tau))$, equivalently
    $\mathfrak f(\tau)=q^{-1/24}\prod_{m\geq1}(1+q^{2m-1})$ for
    $q=e^{\pi i\tau}$ CITE{Duke} CITE{DLMFEta}.
  formula-singular-modulus: >-
    If $m_n=\lambda(i\sqrt n)$, then
    $G_n^{-24}=4m_n(1-m_n)$ CITE{DLMFModularFunctions}.
  formula-reciprocal: >-
    The reciprocal-index identity is $G_{1/n}=G_n$.
  formula-j: >-
    The Weber value satisfies
    $j(i\sqrt n)=(\mathfrak f(i\sqrt n)^{24}-16)^3/
    \mathfrak f(i\sqrt n)^{24}$ CITE{WikipediaWeber}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      n = 2
      CBF = ComplexBallField(numberdb.bits(100, losing=256))
      tau = CBF.gen(0) * CBF(n).sqrt()
      f = tau.modular_eta()**2 / ((tau / 2).modular_eta() * (2 * tau).modular_eta())
      G = f / CBF(2)**(QQ(1) / QQ(4))
      G.real(), f.real()

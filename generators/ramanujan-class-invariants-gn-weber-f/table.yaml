Title: 'Ramanujan''s class invariants $G_n$, with Weber''s $\mathfrak f(\sqrt{-n})$'
Definition: >-
  For $n\in\mathbb Z_{>0}$, let $q=e^{-\pi\sqrt n}$. Ramanujan's
  class invariant is
  $G_n=2^{-1/4}q^{-1/24}\prod_{m\geq1}(1+q^{2m-1})$. Weber's value is
  $\mathfrak f(i\sqrt n)=2^{1/4}G_n$, written
  $\mathfrak f(\sqrt{-n})$ in Weber's notation. Both normalisations are
  stored CITE{BorweinBorwein} CITE{Duke}.
Parameters:
  n:
    type: Z
    title: index, with the CM point $\tau=i\sqrt n$
    display: $n$
    constraints: positive integer
  normalisation:
    type: Symbolic
    title: whether the row holds Ramanujan's $G_n$ or Weber's $\mathfrak f(i\sqrt n)$
    display: convention
    values:
      ramanujan: $G_n$
      weber: $\mathfrak f(i\sqrt n)$
Comments:
  comment-cm-point: >-
    The index $n$ is the $r$ of HREF{T295}[the singular moduli $k_r$ and
    $m_r$] and of HREF{T296}[$K(k_r)$]. The point is $\tau=i\sqrt n$, and
    the order is $\mathbb{Z}[\sqrt{-n}]$, of discriminant $-4n$.
  comment-even-index: >-
    The companion invariant $g_n$ used at even indices is built from Weber's
    $\mathfrak f_1$; it is a different function and is not stored here
    CITE{BerndtChanZhang}.
Formulas:
  formula-weber-eta: >-
    Weber's function is
    $\mathfrak f(\tau)=\eta(\tau)^2/(\eta(\tau/2)\eta(2\tau))$, equivalently
    $\mathfrak f(\tau)=q^{-1/24}\prod_{m\geq1}(1+q^{2m-1})$ for
    $q=e^{\pi i\tau}$ CITE{Duke} CITE{DLMFEta}.
  formula-singular-modulus: >-
    If $m_n=\lambda(i\sqrt n)$, then
    $G_n^{-24}=4m_n(1-m_n)$ CITE{DLMFModularFunctions}.
  formula-reciprocal: >-
    $G_{1/x}=G_x$ for every real $x>0$, where $G_x$ is defined by the same
    product CITE{Duke}.
  formula-j: >-
    The Weber value satisfies
    $j(i\sqrt n)=(\mathfrak f(i\sqrt n)^{24}-16)^3/
    \mathfrak f(i\sqrt n)^{24}$ CITE{WikipediaWeber}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      n = 2
      CBF = ComplexBallField(numberdb.bits(100, losing=256))
      tau = CBF.gen(0) * CBF(n).sqrt()
      f = tau.modular_eta()**2 / ((tau / 2).modular_eta() * (2 * tau).modular_eta())
      G = f / CBF(2)**(QQ(1) / QQ(4))
      G.real(), f.real()
Similar tables:
  - table: HREF{T295}[Singular values $k_r$ of the elliptic modulus]
    relation: holds $m_r=\lambda(i\sqrt r)$, and the entries here satisfy $G_r^{-24}=4m_r(1-m_r)$ by CITE{formula-singular-modulus}
  - table: HREF{Modular_polynomials_for_Weber's_f-function}[Modular polynomials for Weber's $f$-function]
    relation: those polynomials give modular equations for the same Weber function
  - table: HREF{Rational_singular_moduli}[Rational singular moduli]
    relation: Formula CITE{formula-j} gives the rational singular moduli in that table for the orders with $\Delta=-4n$, namely $n=1,2,3,4,7$
  - table: HREF{Hilbert_class_polynomials}[Hilbert class polynomials $H_\Delta$]
    relation: those polynomials record the algebraic $j$-values of imaginary quadratic orders, while this table records Weber and Ramanujan class invariants at $\tau=i\sqrt n$

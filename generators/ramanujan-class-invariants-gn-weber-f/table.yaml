Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds Ramanujan's $G_n$ and Weber's $\mathfrak f(i\sqrt n)$ for every
    integer $1\leq n\leq100$, matching the range of HREF{T295}[the singular
    moduli] and HREF{T296}[$K(k_r)$]
  rigour details: >-
    The generator computes Weber's $\mathfrak f$ in Sage's arb-backed
    `ComplexBallField` from the eta quotient in CITE{formula-weber-eta}; the
    imaginary part is required to contain zero before the real part is stored.
    The $G_n$ entries divide the same real ball by $2^{1/4}$, except that
    $G_1$ is returned exactly as $1$. Before the values are sent, the generator
    checks CITE{formula-weber-eta}, CITE{formula-singular-modulus},
    CITE{formula-reciprocal}, and CITE{formula-j} on the computed range.
Display properties:
  number-header: $G_n$ or $\mathfrak f(i\sqrt n)$
  group parameters:
    - [n]
    - [normalisation]

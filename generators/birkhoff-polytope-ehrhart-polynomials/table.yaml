Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds $H_n(t)$ for every matrix size $n$ with $3\leq n\leq6$; for $n=1,2$
    the values are trivial, and from $n=7$ the polynomials run to thousands of characters
  rigour details: The $h^*$-coefficients used to compute these rows are transcribed from OEIS
    A259473 CITE{OEISHStar}, and the Ehrhart polynomials are obtained from them by the binomial
    transform in CITE{formula-binomial-transform}. The entries were compared with Beck and
    Pixton's published polynomials CITE{BeckPixtonData}; direct dynamic-programming counts
    for $n=3,4,5$ were compared with OEIS A002817 CITE{OEIS3}, A001496 CITE{OEIS4}, and A003438
    CITE{OEIS5}; each stored row satisfied $H_n(1)=n!$.

Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds both forms for every matrix size $n$ with $3\leq n\leq6$
  rigour details: >-
    The $h^*$-polynomials are transcribed from OEIS A259473 CITE{OEISHStar},
    and the Ehrhart polynomials are obtained from them by the binomial
    transform in CITE{formula-binomial-transform}. Before the draft was filled,
    the entries were compared with Beck and Pixton's published polynomials
    CITE{BeckPixtonData}; direct dynamic-programming counts for $n=3,4,5$ were
    compared with OEIS A002817 CITE{OEIS3}, A001496 CITE{OEIS4}, and A003438
    CITE{OEIS5}; each stored row with $3\leq n\leq6$ satisfied $H_n(1)=n!$,
    and $h^*_{B_n}(1)$ agreed with OEIS A037302 CITE{OEISVolume}.

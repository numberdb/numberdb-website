# Draft document for T232 after splitting the h-star rows to T242.
# Publishing is a person's act.
Title: Ehrhart polynomials of the Birkhoff polytopes
Definition: The Birkhoff polytope $B_n\subset\mathbb{R}^{n\times n}$ is the lattice polytope
  of $n\times n$ doubly stochastic matrices CITE{WikiBirkhoff}. The table stores its Ehrhart
  polynomial $H_n(t)=L_{B_n}(t)$, counting $n\times n$ nonnegative integer matrices whose
  rows and columns all sum to $t$.
Keywords:
- Birkhoff polytope
- Ehrhart polynomial
- semi-magic squares
- doubly stochastic matrices
- contingency tables
Parameters:
  n:
    type: Z
    title: matrix size
    display: $n$
    constraints: $n$ is a positive integer
Comments:
  comment-semi-magic: '$H_n(t)$ counts semi-magic squares: $n\times n$ nonnegative integer
    matrices whose rows and columns all sum to $t$, with no condition on the diagonals.'
  comment-small-n: For $n=1$ and $n=2$ the polytope is respectively a point and a line segment,
    so $H_1(t)=1$ and $H_2(t)=t+1$.
  comment-known-range: Beck and Pixton computed $H_n(t)$ for $n\leq9$ CITE{BeckPixton}, and
    the polynomials are listed at CITE{BeckPixtonData}. The rows from $n=7$ on are omitted
    here because the polynomials are long enough to be poor reference entries.
Formulas:
  formula-series: If $d=(n-1)^2$, then $\sum_{t\geq0}H_n(t)z^t=h^*_{B_n}(z)/(1-z)^{d+1}$ CITE{WikiEhrhart}.
  formula-binomial-transform: With $d=(n-1)^2$ and $h^*_{B_n}(z)=\sum_i h_i^*z^i$, $H_n(t)=\sum_{i=0}^{d}h_i^*\binom{t+d-i}{d}$.
  formula-vertices: $H_n(1)=$HREF{Factorial}[$n!$], since the lattice points of $B_n$ are
    the $n\times n$ permutation matrices.
  formula-normalized-volume: $d!\,[t^d]H_n(t)$ is the normalized volume of $B_n$, where $d=(n-1)^2$
    and $[t^d]H_n(t)$ is the leading coefficient CITE{OEISVolume}.
  formula-reciprocity: $H_n(-n-t)=(-1)^{n-1}H_n(t)$ and $H_n(-1)=\cdots=H_n(-n+1)=0$ CITE{BeckPixton}.
Programs:
  program-sage:
    language: Sage
    code: "import numberdb.sage as numberdb\nfrom sage.arith.misc import binomial\nfrom sage.rings.rational_field\
      \ import QQ\nfrom sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing\n\
      \nT = PolynomialRing(QQ, \"t\")\nt = T.gen()\n\ndef ehrhart_from_h_star(coefficients,\
      \ dimension):\n    return sum(QQ(c) * T(binomial(t + dimension - i, dimension))\n  \
      \             for i, c in enumerate(coefficients))\n\nehrhart_from_h_star([1, 14, 87,\
      \ 148, 87, 14, 1], 9)  # H_4(t)"
Similar tables:
- table: HREF{T242}[Ehrhart $h^*$-polynomials of the Birkhoff polytopes]
  relation: gives the numerator $h^*_{B_n}(z)$ of the Ehrhart series; the two tables determine
    each other by CITE{formula-series} and CITE{formula-binomial-transform}
- table: HREF{Factorial}[Factorial of natural numbers]
  relation: gives $H_n(1)=n!$, the number of permutation matrices in $B_n$

Title: Ehrhart and $h^*$-polynomials of the Birkhoff polytopes
Definition: >-
  The Birkhoff polytope $B_n\subset\mathbb{R}^{n\times n}$ is the lattice
  polytope of $n\times n$ doubly stochastic matrices CITE{WikiBirkhoff}. The
  table stores its Ehrhart polynomial $H_n(t)=L_{B_n}(t)$, counting
  nonnegative integer matrices with all row and column sums $t$, and its
  $h^*$-polynomial CITE{WikiEhrhart}.
Keywords:
  - Birkhoff polytope
  - Ehrhart polynomial
  - Ehrhart h-star polynomial
  - Ehrhart h* polynomial
  - semi-magic squares
  - magic squares
  - doubly stochastic matrices
  - contingency tables
Parameters:
  n:
    type: Z
    title: matrix size
    display: $n$
    constraints: $n$ is an integer with $n\geq3$
  form:
    type: Symbolic
    title: form of the polynomial
    display: form
    constraints: either `ehrhart` or `h-star`
    values:
      ehrhart: $H_n(t)$
      h-star: $h^*_{B_n}(z)$
Comments:
  comment-semi-magic: >-
    The count is for semi-magic squares: it fixes all row and column sums and
    imposes no diagonal condition.
  comment-small-n: >-
    The omitted cases are $H_1(t)=1$, $h^*_{B_1}(z)=1$, $H_2(t)=t+1$, and
    $h^*_{B_2}(z)=1$.
  comment-known-range: >-
    Beck and Pixton give the full Ehrhart polynomials $H_n(t)$ for
    $1\leq n\leq9$ CITE{BeckPixtonData}. The full polynomial $H_{10}(t)$ is
    not included in that source.
Formulas:
  formula-series: >-
    If $d=(n-1)^2$, then
    $\sum_{t\geq0}H_n(t)z^t=h^*_{B_n}(z)/(1-z)^{d+1}$.
  formula-binomial-transform: >-
    If $h^*_{B_n}(z)=\sum_{i=0}^{d}h_i^*z^i$ and $d=(n-1)^2$, then
    $H_n(t)=\sum_{i=0}^{d}h_i^*\binom{t+d-i}{d}$.
  formula-vertices: >-
    $H_n(1)=n!$, the number of permutation matrices in $B_n$, so these values
    are given by HREF{Factorial}[the factorial table].
  formula-normalized-volume: >-
    $h^*_{B_n}(1)=d!\,[t^d]H_n(t)$ for $d=(n-1)^2$, the normalized volume of
    $B_n$ CITE{OEISVolume}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.arith.misc import binomial
      from sage.rings.rational_field import QQ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      T = PolynomialRing(QQ, "t")
      t = T.gen()

      def ehrhart_from_h_star(coefficients, dimension):
          return sum(QQ(c) * T(binomial(t + dimension - i, dimension))
                     for i, c in enumerate(coefficients))

      ehrhart_from_h_star([1, 14, 87, 148, 87, 14, 1], 9)  # H_4(t)
Similar tables:
  - table: HREF{Factorial}[Factorial of natural numbers]
    relation: gives $H_n(1)=n!$, the number of permutation matrices in $B_n$

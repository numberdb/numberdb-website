# The table document for the eigenvalues of the Gauss-Kuzmin-Wirsing
# operator, proposal 4 of agents/table-ideas/BATCH-2026-09-09T0015.md.
# Created as draft T174 through the API (X-Draft: yes). It uses the certified
# 2026 spectral data of Nisoli, which was not accounted for by the proposal's
# original rigour note.
Title: Eigenvalues of the Gauss-Kuzmin-Wirsing operator
Definition: >-
  Let $\mathcal L$ be the Gauss-Kuzmin-Wirsing transfer operator for the
  Gauss continued-fraction map, defined by CITE{formula-operator}
  CITE{Alkauskas} CITE{Nisoli}. Its real eigenvalues $\lambda_n$ are ordered
  by decreasing absolute value, with $\lambda_1=1$; this table gives
  $|\lambda_n|$ for $n\geq2$.
Keywords:
  - Gauss-Kuzmin-Wirsing constant
  - Wirsing constant
  - Kuzmin-Wirsing constant
  - GKW operator
  - transfer operator of the Gauss map
  - Gauss-Kuzmin distribution
Parameters:
  n:
    type: Z
    title: eigenvalue number
    display: $n$
    constraints: $n\geq2$
Comments:
  comment-ordering: >-
    For the certified range used here, Nisoli gives real simple eigenvalues with
    $|\lambda_1|>|\lambda_2|>\cdots>|\lambda_{50}|$ CITE{Nisoli}.
  comment-leading: >-
    The leading eigenvalue $\lambda_1=1$ corresponds to the invariant density
    $\frac{1}{(1+x)\log2}$ of the Gauss map.
  comment-sign: >-
    The signs alternate: $(-1)^{n+1}\lambda_n>0$. Thus the signed eigenvalue is
    $(-1)^{n+1}|\lambda_n|$.
Formulas:
  formula-operator: >-
    $(\mathcal L f)(x)=\sum_{m=1}^{\infty}
    \frac{1}{(x+m)^2}f\left(\frac{1}{x+m}\right)$.
  formula-briggs-matrix: >-
    Briggs's Taylor-basis approximation has entries
    $M_{jk}=\frac{(-1)^j}{j!(-2)^k}\sum_{i=0}^k {k\choose i}(-2)^i
    (i+2)_j\left(\zeta(i+j+2)(2^{i+j+2}-1)-2^{i+j+2}\right)$, with
    $0\leq j,k\leq N$ CITE{MathWorldGKW} CITE{Briggs}.
  formula-ratio: >-
    $\lim_{n\to\infty}\lambda_n/\lambda_{n+1}=-\varphi^2$, where
    $\varphi$ is HREF{Golden_ratio#phi}[the golden ratio] CITE{Alkauskas}.
Programs:
  program-sage:
    language: Sage
    code: |-
      R = RealField(400)

      def rising(a, j):
          out = R(1)
          for t in range(j):
              out *= a + t
          return out

      def M_entry(j, k):
          total = R(0)
          for i in range(k + 1):
              total += binomial(k, i) * (-2)**i * rising(i + 2, j) * (
                  zeta(i + j + 2) * (2**(i + j + 2) - 1) - 2**(i + j + 2))
          return (-1)**j * total / (factorial(j) * (-2)**k)

      N = 40
      M = matrix(R, N + 1, N + 1,
                 lambda j, k: M_entry(j, k))
      eigenvalues = sorted(M.eigenvalues(), key=lambda z: -abs(z))
      # Later eigenvalues of this truncation include artifacts.
      [(n, abs(eigenvalues[n - 1])) for n in range(2, 5)]
Similar tables:
  - table: HREF{Khinchin's_means}[Khinchin's means]
    relation: the invariant density for the leading eigenvalue gives the Gauss-Kuzmin distribution whose partial-quotient means are listed there
  - table: HREF{T172}[Lévy's constant]
    relation: Lévy's constant gives the almost-sure denominator growth rate for the same regular continued fraction, while $\mathcal L$ is the transfer operator for the Gauss map
  - table: HREF{Lyapunov_exponents_of_classical_chaotic_systems}[Lyapunov exponents of classical chaotic systems]
    relation: the Gauss-map row there gives the Lyapunov exponent with respect to the same invariant measure
  - table: HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[Values of the Riemann zeta function at rational numbers]
    relation: zeta values occur in Briggs's matrix formula CITE{formula-briggs-matrix}
  - table: HREF{Golden_ratio}[Golden ratio]
    relation: the asymptotic ratio of consecutive eigenvalues is $-\varphi^2$

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $|\lambda_n|$ for $2\leq n\leq50$; the leading eigenvalue
    $\lambda_1=1$ is omitted, and the sequence continues for all $n\geq2$
  rigour details: >-
    The values were read from Nisoli's certified spectral data set
    CITE{NisoliData}, file `gkw_spectral_coefficients_K1024.tsv`. That file
    gives the eigenvalue centers, enclosure radii, and resolvent certification
    data for a $K=1024$ Galerkin approximation computed in 2048-bit ball
    arithmetic. The source
    states that the first 50 nonzero eigenvalues are real and simple and that
    each certified enclosure carries at least 90 decimal digits CITE{Nisoli}.

    The generator returns each stored row as a real ball centered at the
    absolute value of the source eigenvalue and enlarged by the source column
    `eval_encl`. The $K=1024$
    intervals were compared with the independent $K=512$ intervals in the same
    data set, and all stored rows overlap. The row $|\lambda_2|$ was compared
    with OEIS A038517 CITE{OEISA038517}; the rows $2\leq n\leq24$ were
    compared with Alkauskas's 16-digit table CITE{Alkauskas}. The alternating
    sign pattern in CITE{comment-sign} and the approach of
    $\lambda_n/\lambda_{n+1}$ toward $-\varphi^2$ were checked on the
    stored range.
Display properties:
  number-header: $|\lambda_n|$

Data properties:
  type: C
  rigour: proven
  complete: 'no'
  complete-note: every admissible pair for the primes $p\leq 19$ is here, 372 entries
  rigour details: >-
    Each value is a complex ball at 397 bits: the sum of the $p-2$ terms
    $e^{2\pi i r}$, $r$ the exact rational with $\chi(a)\psi(1-a)=e^{2\pi i r}$,
    each term arb's exponential of a ball containing $r$. The characters are
    built from Conrey's definition (discrete logarithms to the least
    primitive root), not from a library, and compared with Sage's on every
    value of every character modulo every prime in range. The generator
    requires every value to overlap an enclosure of Sage's exact Jacobi sum
    of the characters Sage numbers $(p,m)$ and $(p,n)$; that exact value to
    satisfy $J\bar J=p$, to lie in $\mathbb{Z}[\zeta_d]$, to equal
    $\tau(\chi)\tau(\psi)/\tau(\chi\psi)$ in Sage's exact Gauss sums and to
    equal the sum with $\chi$ and $\psi$ exchanged; and the congruences of
    CITE{formula-cubic} and CITE{formula-quartic} and the identity
    CITE{formula-legendre} to hold, before returning it. A hundred digits are
    written; the widest ball, at $p=19$, supports $117$. Outside the
    generator: five Jacobi sums computed by the LMFDB's calculator, four of
    them entries here and one at $p=23$, agree exactly with Sage's; the
    number of solutions of $x^k+y^l=1$ over $\mathbb{F}_p$ for every $k$
    and $l$ dividing $p-1$, found by enumeration, agrees with the sum of
    CITE{formula-fermat} in all $138$ cases and disagrees for every $p$
    when the trivial character is given the value $0$ at $0$; the cubic
    entries $J(\chi,\chi)$ reproduce OEIS A001479 and A001480
    CITE{OEIScubic} and, through $L$, OEIS A394567 CITE{OEISperiods}, and
    the quartic entries reproduce OEIS A002972 and A002973
    CITE{OEISquartic}; the conjugate, Galois, Legendre-row and Gauss-sum
    power identities hold exactly on every entry, and
    $\tau(\chi)\tau(\psi)/\tau(\chi\psi)$ from the stored digits of the
    Gauss-sum table encloses every entry; both programs were run and give
    the values their comments state; and every comment's exact value, read
    back from the stored table, encloses the stored digits. Two controls
    that must fail did: the conjugate of each LMFDB value is refused, and
    the quotient $\tau(\chi_7(2,\cdot))^2/\tau(\chi_7(3,\cdot))$ does not
    enclose $J(\chi_7(2,\cdot),\chi_7(2,\cdot))$.
Display properties:
  number-header: $J(\chi_p(m,\cdot),\chi_p(n,\cdot))$

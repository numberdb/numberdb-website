Data properties:
  type: Z[]
  rigour: exact
  complete: 'yes'
  rigour details: >-
    The values are transcribed from the khovanov_unreduced_integral_vector
    column of KnotInfo, package database_knotinfo 2026.9.1, except for the
    unknot, whose source field is blank and whose standard unreduced value is
    $q^{-1}+q$. The generator parses each vector exactly, shifts each
    Laurent polynomial by the lowest exponents of $q$ and $t$, and generates
    the mirror entries from the mirror formula. It checks the graded Euler
    characteristic of every entry against the stored
    HREF{Jones_polynomials_of_the_prime_knots_with_at_most_ten_crossings}[Jones polynomial]
    table. Sage's `Link.khovanov_polynomial()` was also run from KnotInfo
    braid closures for $0_1$, $3_1$, $4_1$ and $5_2$, including mirror
    images, and agreed with the source vectors and the mirror formula.
Display properties:
  number-header: $q^{-a}t^{-b}Kh_K(q,t,T)$

# the NumberDB draft API with no entries. Publishing remains a separate human
# review act.
Title: Watson integrals of the cubic lattices
Definition: >-
  For a three-dimensional cubic lattice $L$, let $S(L)$ be its set of
  minimal vectors. Listed is the Watson integral
  $W_L=\pi^{-3}\int_0^\pi\int_0^\pi\int_0^\pi
  (1-\phi_L(u,v,w))^{-1}\,du\,dv\,dw$, where $\phi_L$ is the
  nearest-neighbour structure function in CITE{formula-structure}.
Keywords:
  - Watson integral
  - Watson triple integral
  - lattice Green function
  - cubic lattice Green function
  - simple cubic lattice
  - face-centred cubic lattice
  - body-centred cubic lattice
  - fcc lattice
  - bcc lattice
  - Polya random walk constant
Parameters:
  family:
    title: family of the lattice
    type: Symbolic
    values:
      Z: $\mathbb{Z}^n$
      A: $A_n$
      A*: $A_n^{*}$
    display: family
  n:
    title: dimension
    type: Z
    constraints: $n=3$
    display: $n$
Comments:
  comment-index: >-
    The parameter values are those of
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[the
    classical-lattice table]. Thus $\mathbb{Z}^3$ is the simple cubic lattice,
    $A_3$ is the face-centred cubic lattice, and $A_3^{*}$ is the
    body-centred cubic lattice.
  comment-scale: >-
    The Watson integral depends only on the similarity class of $L$:
    rescaling the lattice rescales the wave vector and leaves
    $\phi_L(u,v,w)$ unchanged after the coordinate change. No Gram-matrix
    normalisation is part of this table.
  comment-watson: >-
    Watson's original triple integrals CITE{Watson} are often written as
    $I_1$, $I_2$ and $I_3$ CITE{MathWorld}. With the normalisation in this
    table, $W_{A_3^{*}}=I_1$, $W_{A_3}=3I_2$, and
    $W_{\mathbb{Z}^3}=3I_3$.
Formulas:
  formula-structure: >-
    The three structure functions are
    $\phi_{\mathbb{Z}^3}(u,v,w)=(\cos u+\cos v+\cos w)/3$,
    $\phi_{A_3}(u,v,w)=(\cos u\cos v+\cos v\cos w+\cos w\cos u)/3$,
    and $\phi_{A_3^{*}}(u,v,w)=\cos u\cos v\cos w$.
  formula-gamma: >-
    The closed forms are
    $W_{\mathbb{Z}^3}=\dfrac{\sqrt6}{32\pi^3}
    \Gamma(\frac1{24})\Gamma(\frac5{24})
    \Gamma(\frac7{24})\Gamma(\frac{11}{24})$,
    $W_{A_3}=\dfrac{9\Gamma(\frac13)^6}{2^{14/3}\pi^4}$, and
    $W_{A_3^{*}}=\dfrac{\Gamma(\frac14)^4}{4\pi^3}$
    CITE{Watson} CITE{GlasserZucker}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      R = RealBallField(numberdb.bits(100, losing=128))
      pi = R.pi()
      gamma = lambda a, b: R(QQ(a) / QQ(b)).gamma()
      two_14_3 = (R(QQ(14) / QQ(3)) * R(2).log()).exp()

      W_Z3 = (R(6).sqrt() * gamma(1, 24) * gamma(5, 24) *
              gamma(7, 24) * gamma(11, 24) / (32 * pi^3))
      W_A3 = 9 * gamma(1, 3)^6 / (two_14_3 * pi^4)
      W_A3dual = gamma(1, 4)^4 / (4 * pi^3)

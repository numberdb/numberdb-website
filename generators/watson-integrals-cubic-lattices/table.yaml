Data properties:
  type: R
  rigour: proven
  complete: 'yes'
  rigour details: >-
    Each value is a real ball at `numberdb.bits(digits, losing=128)` bits,
    computed from CITE{formula-gamma} by arb's gamma function. The generator
    writes $100$ digits. Before the draft was filled, each gamma-product value
    was compared with the corresponding complete-elliptic-integral form of
    Watson's triple integrals, using arb ball arithmetic, and the written
    prefixes were checked against the live NumberDB lookup endpoint.

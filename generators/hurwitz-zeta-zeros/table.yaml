# Draft document for T386, zeros of the Hurwitz zeta function. Publishing is
# a person's act; this draft was left offered for review.
Title: Zeros of the Hurwitz zeta function $\zeta(s,a)$
Definition: >-
  For rational $a$ with $0<a\leq1$, this table gives the non-real zeros
  $\rho$ of the Hurwitz zeta function $\zeta(s,a)$ CITE{Wiki}, with
  $\operatorname{Im}\rho>0$. For each fixed $a$, the zeros are ordered by
  increasing imaginary part, with ties broken by increasing real part, and
  counted from $n=1$.
Keywords:
  - Hurwitz zeta zeros
  - zeros of the Hurwitz zeta function
Parameters:
  a:
    type: Q
    title: Hurwitz parameter
    display: $a$
    constraints: $a\in\mathbb{Q}$; $0<a\leq1$
  n:
    type: Z
    title: zero index
    display: $n$
    constraints: $n\geq1$
Comments:
  comment-conjugates: >-
    For real $a$, $\zeta(\overline{s},a)=\overline{\zeta(s,a)}$, so
    non-real zeros occur in conjugate pairs. Only the zeros with positive
    imaginary part are listed.
  comment-real-zeros: >-
    Real zeros are not entries. The case $a=1$ has the trivial zeros at the
    negative even integers, and real zeros for other $a$ are a separate
    one-real-variable question studied in the literature.
  comment-strip: >-
    Spira proved that, for fixed $a$, the complex zeros of $\zeta(s,a)$ lie
    in a vertical strip CITE{Spira}. The table therefore uses a height bound,
    not a real-part bound, for the computed range.
  comment-special-a: >-
    At $a=1$, $\zeta(s,a)$ is the Riemann zeta function. At $a=1/2$,
    $\zeta(s,1/2)=(2^s-1)\zeta(s)$, so the listed zeros come from
    HREF{Zeros_of_the_Riemann_zeta_function}[the Riemann zeta zeros] and the
    zeros $2\pi\mathrm{i}k/\log 2$ of $2^s-1$.
  comment-standard-range: >-
    The table uses the standard Hurwitz range $0<a\leq1$. Arguments larger
    than $1$ are related by $\zeta(s,a+1)=\zeta(s,a)-a^{-s}$ and are not used
    as parameters here.
Formulas:
  formula-half: $\zeta(s,1/2)=(2^s-1)\zeta(s)$.
  formula-shift: $\zeta(s,a+1)=\zeta(s,a)-a^{-s}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      C = ComplexBallField(200)
      s = C(QQ(1)/2) + C.gen() * C(14)
      C(s).zeta(C(QQ(1)/3))

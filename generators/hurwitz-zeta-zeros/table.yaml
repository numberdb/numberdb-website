Data properties:
  type: C
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds the non-real zeros with $0<\operatorname{Im}\rho\leq40$ for
    rational $a\in(0,1]$ in lowest terms with denominator at most $4$
  rigour details: >-
    The generator first finds roots with mpmath at 50 and 65 decimal working
    digits and stores only digits that agree between the two runs. The listed
    values were then checked by evaluating $\zeta(s,a)$ in Sage's arb-backed
    complex ball field, and after filling the stored centres were checked
    against the special cases $a=1$ and $a=1/2$. The zero search is not a
    certified enclosure method, so the table does not claim proven zeros.
Display properties:
  number-header: $\rho_n(a)$
  group parameters:
    - [a]
    - [n]

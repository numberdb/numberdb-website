    title: 'Wikipedia: Hurwitz zeta function'
    url: https://en.wikipedia.org/wiki/Hurwitz_zeta_function
References:
  Spira:
    bib: Robert Spira, Math. Comp. 30 (1976), no. 136, 863-866.
    doi: 10.1090/S0025-5718-1976-0409382-2
Tags:
  - zero
  - L-function

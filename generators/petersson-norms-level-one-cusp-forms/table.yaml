Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every even weight $12\leq k\leq40$ with
    $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$ and every eigenform in the
    increasing-$a_2$ ordering
  rigour details: >-
    The generator evaluates Sage's `petersson_norm` CITE{SageModform} at $80$
    and $120$ decimal working digits, passing explicit bit precisions to Sage's
    symmetric-square $L$-function computation, and stores only $30$ digits. It
    sorts the embeddings of each Hecke orbit by the embedded value of $a_2$. An
    independent check compares every stored value with PARI/GP's `mfsymbol` and
    `mfpetersson` CITE{PARIModular}, after sorting PARI's embeddings by the
    same $a_2$ values. Neither computation gives a certified error bound, so the
    table does not claim proven digits.
Display properties:
  number-header: $\langle f_{k,i},f_{k,i}\rangle$
  group parameters: [['k'], ['i']]

Title: Petersson norms of level one cusp forms
Definition: >-
  For $f_{k,i}(q)=\sum_{n\geq1}a_nq^n$, the $i$th normalised Hecke
  eigenform in $S_k(\mathrm{SL}_2(\mathbb{Z}))$ CITE{WikiCusp} ordered by
  increasing embedded $a_2$, this table gives its Petersson norm
  $\langle f_{k,i},f_{k,i}\rangle$ CITE{WikiPetersson}.
Parameters:
  k:
    type: Z
    title: weight
    display: $k$
    constraints: $k$ is even and $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$
  i:
    type: Z
    title: position by increasing $a_2$
    display: $i$
    constraints: >-
      $1\leq i\leq\dim S_k(\mathrm{SL}_2(\mathbb{Z}))$, with positions counted
      after sorting the eigenforms by increasing embedded $a_2$
Comments:
  comment-normalisation: >-
    The eigenform is normalised so that $a_1=1$. The Petersson inner product is
    $\int_{\mathrm{SL}_2(\mathbb{Z})\backslash\mathbb{H}} f(z)\overline{g(z)}
    y^k\,dx\,dy/y^2$, with no division by the volume of the fundamental domain.
  comment-ordering: >-
    The index $i$ counts the eigenforms of weight $k$ in increasing order of the
    embedded $T_2$-eigenvalue $a_2$; this is not necessarily the order Sage or
    PARI lists them in. Each entry gives its own $a_2$ and links to $\chi_{k,2}$
    in HREF{Hecke_polynomials_of_level_one_cusp_forms}[the Hecke polynomial
    table], whose roots are the $a_2$ values in that weight.
Formulas:
  formula-symmetric-square: >-
    In Sage's arithmetic normalisation CITE{SageModform},
    $\langle f,f\rangle=(k-1)!L(\mathrm{Sym}^2 f,k)/(2^{2k-1}\pi^{k+1})$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage
      import sage.symbolic.expression
      import sage.rings.polynomial.laurent_polynomial_ring
      from sage.modular.modform.constructor import Newforms
      from sage.rings.complex_mpfr import ComplexField
      k = 24; i = 1; bits = 330
      C = ComplexField(bits)
      forms = []
      for f in Newforms(1, k, names='a'):
          a2 = f[2]
          for embedding, phi in enumerate(a2.parent().embeddings(C)):
              forms.append((phi(a2).real(), embedding, f))
      forms.sort(key=lambda row: row[0])
      forms[i - 1][2].petersson_norm(embedding=forms[i - 1][1], prec=bits)
  program-pari:
    language: PARI/GP
    code: |-
      default(realbitprecision, 330);
      k = 24; i = 1;
      mf = mfinit([1,k], 0);
      F = mfeigenbasis(mf)[1];
      a2 = mfcoefs(F, 2)[3];
      nf = nfinit(component(a2, 1));
      A2 = nfeltembed(nf, a2);
      P = mfpetersson(mfsymbol(mf, F));
      vecsort(vector(#A2, j, [real(A2[j]), P[j,j]]), 1)[i][2]

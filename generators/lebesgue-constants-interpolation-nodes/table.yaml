Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds all six listed node families for interpolation degrees
    $1\leq n\leq4$
  rigour details: >-
    The generator builds the node polynomials over $\mathbb{Q}$ and isolates
    their roots in Sage's algebraic real field. It forms the Lagrange basis
    exactly, splits $[-1,1]$ at the nodes, and on each interval uses the
    constant sign pattern of the basis polynomials to replace the Lebesgue
    function by one algebraic polynomial. The maximum is checked at every
    interval endpoint and at every real root of that polynomial's derivative;
    the algebraic maximum is then returned as a real ball with 192 guard bits
    beyond the 100 digits written, except when it is proved rational and is
    returned exactly.

    Before the entries were written, `agents/table-build/dry_run.py` computed
    all 24 entries. The exact values
    $\Lambda_2=5/4$ for equally spaced nodes,
    $\Lambda_1=\sqrt2$ for Chebyshev points of the first kind,
    $\Lambda_1=1$ for endpoint node families, and
    $\Lambda_1=\sqrt3$ for Gauss-Legendre nodes were checked independently.
    The values $\Lambda_4=2.2078243973258429982911088644463\ldots$ for
    equally spaced nodes and
    $\Lambda_4=1.9888543819998317571273389349850\ldots$ for Chebyshev points
    of the first kind were checked against the screening calculation for
    numberdb-data issue 162.
Display properties:
  number-header: $\Lambda_n(T_n)$

Programs:
  program-sage:
    language: Sage
    code: 'Run `generate.py` with SageMath. It forms the even and odd banded
      harmonic-basis Galerkin matrices and bisects their eigenvalues by Sturm
      counts.'
Tags:
- eigenvalue
- physics
Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: it holds $0\leq n\leq9$ for
    $a\in\{1/2,1,3/2,2,5/2,3\}$, the half-step well parameters selected by
    the oscillator family as common benchmark double wells
  rigour details: The generator computes Rayleigh-Ritz eigenvalues in the
    harmonic-oscillator basis for $-d^2/dx^2+\omega^2x^2$, with even and odd
    parity separated. For each $a$ it uses the two truncations $N=320$ and
    $N=460$, and the two basis frequencies $\omega=1$ and $\omega=13/10$.
    Eigenvalues of the finite Galerkin matrices are isolated by Sturm counts
    from a banded $LDL^T$ factorisation and by bisection, rather than by a
    dense high-precision eigensolver. Each entry is the real interval spanning
    those four computations; the widest interval in the dry run had relative
    diameter less than $4\cdot10^{-61}$.

    As controls, the generator checks the $a=0$ pure-quartic limit against
    HREF{T408}[the pure oscillator table]. It also checks the scaled
    non-grid case equivalent to
    $-\tfrac12 d^2/dx^2+x^4-6x^2$ against the eigenvalues tabulated by
    Ronto and Pollak CITE{RontoPollak2020}. Rayleigh-Ritz eigenvalues are upper
    bounds for the true eigenvalues by the variational principle, so the
    agreement between truncations is not a rigorous error bound.
Display properties:
  number-header: $E_n(a)$
  group parameters:
  - - a
  - - n

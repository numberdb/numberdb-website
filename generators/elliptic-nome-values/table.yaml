Tags:
- special values
- special functions
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $q(m)$ for every decimal grid point $m=j/1000$, with
    $j=1,\ldots,999$
  rigour details: >-
    Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=80)` bits, with the imaginary part checked to
    contain zero, and returned as its real part. The run checked
    CITE{formula-half} and CITE{formula-theta-inversion} across the stored
    range.
Display properties:
  number-header: $q(m)$

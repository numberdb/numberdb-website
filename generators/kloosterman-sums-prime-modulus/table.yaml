Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: every prime $5\leq p\leq 71$ with every $a$ is here, 616 entries
  rigour details: >-
    Each value is a real ball at 397 bits: the sum of the $p-1$ terms
    $e^{2\pi ir}$, $r$ the exact rational $(ax+\bar x)/p$ reduced modulo
    $1$, each term arb's exponential of a ball containing $r$; the imaginary
    part of the sum must contain $0$ and the real part is the value. A
    hundred digits are written; the widest ball, at $p=47$, $a=4$, supports
    115. Before any entry of a prime is returned the generator requires
    every value to overlap an enclosure of Sage's exact Kloosterman sum of
    the trivial character, computed in $\mathbb{Q}(\zeta_{2p})$ by a routine
    sharing no code with the sum; the
    exact value to equal its complex conjugate; $K^2<4p$; the $p-1$ balls to be
    pairwise disjoint; the four moment identities to hold exactly; and the
    product of $x-K(a;p)$ over each class to round to an integer polynomial
    that is monic of degree $(p-1)/2$, vanishes exactly at Sage's value of
    every member of its class and at none of the other, and is
    $(x+1)^{(p-1)/2}$ modulo $p$. Outside the generator, the values the
    LMFDB computes for $(7,1)$, $(11,1)$, $(13,5)$, $(23,7)$, $(47,1)$,
    $(53,2)$, $(67,1)$ and $(71,3)$ agree to their ten decimals; the
    transform $\sum_a\chi(a)K(a;p)=\tau(\chi)^2$ was checked in balls
    against Sage's exact Gauss sum for every character of every prime here;
    the Legendre-symbol form for every $a$ and the two-parameter reduction
    were checked by brute force at every prime here, the multiplicativity at $792$
    coprime pairs of moduli up to $15\cdot 23$, and Salié's evaluation at
    $445$ cases with $m\leq 343$. Two controls that must fail did:
    $K(1;7)$ against the LMFDB's $K(1;11)$, and Salié's formula at $m=25$
    with the wrong $\varepsilon_m$.
Display properties:
  number-header: $K(a;p)$

Title: Volumes of the Birkhoff polytopes
Definition: >-
  The Birkhoff polytope $B_n\subset\mathbb{R}^{n\times n}$ is the lattice
  polytope of $n\times n$ doubly stochastic matrices CITE{WikiBirkhoff}. The
  table stores its volume in three normalisations: the relative lattice volume,
  the normalised lattice volume, and the Euclidean volume in the metric
  inherited from $\mathbb{R}^{n\times n}$.
Keywords:
  - Birkhoff polytope
  - volume of the Birkhoff polytope
  - doubly stochastic matrices
  - semi-magic squares
  - magic squares
  - contingency tables
Parameters:
  n:
    type: Z
    title: matrix size
    display: $n$
    constraints: $n$ is an integer with $n\geq1$
  normalisation:
    type: Symbolic
    title: volume normalisation
    display: normalisation
    constraints: one of `relative`, `normalised`, and `euclidean`
    values:
      relative: relative lattice volume
      normalised: normalised lattice volume
      euclidean: Euclidean volume
Comments:
  comment-normalisations: >-
    The relative volume is measured with respect to the lattice
    $\mathbb{Z}^{n\times n}\cap\operatorname{aff}(B_n)$, translated to the
    zero-margin subspace. The normalised volume is $((n-1)^2)!$ times the
    relative volume.
  comment-euclidean: >-
    The Euclidean normalisation uses the ordinary Frobenius norm on matrices.
    It differs from the relative volume by the covolume of the zero-margin
    lattice.
Formulas:
  formula-leading-coefficient: >-
    If $d=(n-1)^2$ and $H_n(t)$ is the Ehrhart polynomial of $B_n$, then the
    relative volume is $[t^d]H_n(t)$.
  formula-normalised: >-
    The normalised volume is $d!\,[t^d]H_n(t)$, where $d=(n-1)^2$.
  formula-h-star: >-
    If $h^*_{B_n}(z)$ is the Ehrhart $h^*$-polynomial, then
    $h^*_{B_n}(1)$ is the normalised volume.
  formula-euclidean: >-
    The Euclidean volume is $n^{n-1}[t^d]H_n(t)$, where $d=(n-1)^2$.
  formula-covolume: >-
    The zero-margin lattice is the integral cycle lattice of $K_{n,n}$. Its
    Euclidean covolume is $\sqrt{\tau(K_{n,n})}=n^{n-1}$ by the matrix-tree
    theorem CITE{WikiMatrixTree}.
Programs:
  program-sage:
    language: Sage
    code: |-
      from math import factorial
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ

      def birkhoff_volumes(n, normalised_volume):
          d = (n - 1)^2
          relative = QQ(normalised_volume) / QQ(factorial(d))
          return {
              "relative": relative,
              "normalised": QQ(normalised_volume),
              "euclidean": QQ(n) ** (n - 1) * relative,
          }

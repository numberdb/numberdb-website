Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds all three normalisations for every matrix size $n$ with
    $1\leq n\leq10$
  rigour details: >-
    The normalised volumes are transcribed from OEIS A037302
    CITE{OEISNormalised}. The relative volumes are obtained by dividing by
    $((n-1)^2)!$, and the Euclidean volumes by multiplying the relative
    volumes by the covolume $n^{n-1}$ in CITE{formula-covolume}. For
    $n\neq9$, the Euclidean values were compared with OEIS A078524
    CITE{OEISEuclideanNumerators} and A078525
    CITE{OEISEuclideanDenominators}. At $n=9$, the A078525 b-file denominator
    gives the relative volume denominator instead; the stored Euclidean value
    is the one given by CITE{formula-euclidean}. The relative volumes for
    $1\leq n\leq9$ were compared with the leading coefficients of Beck and
    Pixton's published Ehrhart polynomials CITE{BeckPixtonData}.

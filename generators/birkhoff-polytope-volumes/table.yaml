Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds all three normalisations for every matrix size $n$ with
    $1\leq n\leq10$; Beck and Pixton computed the Ehrhart polynomial, and
    hence the volume, of $B_9$ CITE{BeckPixton} and later announced the
    volume of $B_{10}$ CITE{BeckPixtonVolumes}
  rigour details: >-
    The normalised volumes are transcribed from OEIS A037302
    CITE{OEISNormalised}. The relative volumes are obtained by dividing by
    $((n-1)^2)!$, and the Euclidean volumes by multiplying the relative
    volumes by the covolume $n^{n-1}$ in CITE{formula-covolume}. All ten
    Euclidean volumes agree with Beck and Pixton's list
    CITE{BeckPixtonVolumes}. OEIS A078524 CITE{OEISEuclideanNumerators}
    agrees with the Euclidean numerators, and OEIS A078525
    CITE{OEISEuclideanDenominators} agrees with the Euclidean denominators
    except at $n=9$. At $n=9$, A078525 keeps the denominator of the unscaled
    value Beck and Pixton first published before correcting the missing factor
    $9^8$. The relative volumes for $1\leq n\leq9$ were compared with the
    leading coefficients of Beck and Pixton's published Ehrhart polynomials
    CITE{BeckPixtonData}.
Display properties:
  number-header: volume

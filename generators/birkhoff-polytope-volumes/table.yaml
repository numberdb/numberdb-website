Title: Volumes of the Birkhoff polytopes
Definition: >-
  The Birkhoff polytope $B_n\subset\mathbb{R}^{n\times n}$ is the lattice
  polytope of $n\times n$ doubly stochastic matrices CITE{WikiBirkhoff}. The
  table stores its volume in three normalisations: the relative lattice volume,
  the normalised lattice volume, and the Euclidean volume in the metric
  inherited from $\mathbb{R}^{n\times n}$.
Keywords:
  - Birkhoff polytope
  - volume of the Birkhoff polytope
  - doubly stochastic matrices
  - semi-magic squares
  - magic squares
  - contingency tables
Parameters:
  n:
    type: Z
    title: matrix size
    display: $n$
    constraints: $n$ is an integer with $n\geq1$
  normalisation:
    type: Symbolic
    title: volume normalisation
    display: normalisation
    constraints: one of `relative`, `normalised`, and `euclidean`
    values:
      relative: relative lattice volume
      normalised: normalised lattice volume
      euclidean: Euclidean volume
Comments:
  comment-normalisations: >-
    Let $d=(n-1)^2$ be the dimension of $B_n$, and let $\Lambda_n$ be the
    lattice of integer $n\times n$ matrices whose rows and columns all sum to
    $0$. The affine hull of $B_n$ is a translate of
    $\Lambda_n\otimes\mathbb{R}$. The relative volume
    $\operatorname{vol}_{\mathrm{rel}}(B_n)$ is the $d$-dimensional volume in
    which a fundamental domain of $\Lambda_n$ has volume $1$. The normalised
    volume is
    $\operatorname{Vol}(B_n)=d!\,\operatorname{vol}_{\mathrm{rel}}(B_n)$. The
    Euclidean volume $\operatorname{vol}_{\mathrm{Euc}}(B_n)$ is the
    $d$-dimensional volume for the Frobenius inner product
    $\langle X,Y\rangle=\sum_{i,j}X_{ij}Y_{ij}$.
Formulas:
  formula-leading-coefficient: >-
    With $d=(n-1)^2$,
    $\operatorname{vol}_{\mathrm{rel}}(B_n)=[t^d]H_n(t)$, the leading
    coefficient of the HREF{T232}[Ehrhart polynomial] $H_n(t)$ of $B_n$.
  formula-normalised: >-
    With $d=(n-1)^2$,
    $\operatorname{Vol}(B_n)=d!\,\operatorname{vol}_{\mathrm{rel}}(B_n)=d!\,[t^d]H_n(t)$.
  formula-h-star: >-
    If $h^*_{B_n}(z)$ is the Ehrhart $h^*$-polynomial, then
    $h^*_{B_n}(1)=\operatorname{Vol}(B_n)$.
  formula-euclidean: >-
    $\operatorname{vol}_{\mathrm{Euc}}(B_n)=n^{n-1}\operatorname{vol}_{\mathrm{rel}}(B_n)$.
  formula-covolume: >-
    The covolume of $\Lambda_n$ in the Frobenius inner product is
    $n^{n-1}$. Identified with the integral cycle lattice of $K_{n,n}$,
    $\Lambda_n$ has squared covolume equal to the number of spanning trees of
    $K_{n,n}$, which is $n^{2n-2}$ by the matrix-tree theorem
    CITE{WikiMatrixTree}.
Programs:
  program-sage:
    language: Sage
    code: |-
      # Sage can compute the Euclidean volume directly for small n.
      from sage.geometry.polyhedron.library import polytopes

      B = polytopes.Birkhoff_polytope(4)
      B.volume(measure="induced", engine="internal")  # 176/2835

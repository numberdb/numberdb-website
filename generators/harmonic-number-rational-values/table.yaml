Title: Values of the harmonic-number function $H_x$ at rational numbers
Definition: Listed are values of the harmonic-number continuation $H_x=\psi(x+1)+\gamma$
  CITE{WikiHarmonic} at rational arguments $x$, where $\psi=\Gamma'/\Gamma$ is the
  digamma function and $\gamma$ is the Euler-Mascheroni constant.
Keywords:
- harmonic number
- harmonic-number function
- harmonic numbers of fractional argument
- generalized harmonic number
- digamma function
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\in\mathbb{Q}$ and $x$ is not a negative integer
Comments:
  comment-convention: $H_x$ is the analytic continuation $H_x=\psi(x+1)+\gamma$, so
    $H_n=\sum_{k=1}^{n}1/k$ for nonnegative integers $n$.
  comment-exact-integers: For a nonnegative integer $n$, the row $H_n$ is the exact
    rational number $\sum_{k=1}^{n}1/k$.
Formulas:
  formula-harmonic: $H_x=\psi(x+1)+\gamma$.
  formula-recurrence: $H_x=H_{x-1}+1/x$ when both sides are finite CITE{DLMFFunctional}.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.rational_field import QQ

      from sage.rings.real_arb import RealBallField


      RBF = RealBallField(numberdb.bits(100, losing=96))

      x = QQ(1) / QQ(3)

      RBF(x + 1).psi() + RBF.euler_constant()  # H_{1/3}'
Similar tables:
- table: HREF{T226}[Values of the digamma function $\psi(x)$ at rational numbers]
  relation: $H_x=\psi(x+1)+\gamma$; that table gives the unshifted digamma values,
    while this table gives the shifted harmonic-number continuation
- table: HREF{Stieltjes_constants}[Stieltjes constants]
  relation: its row HREF{Stieltjes_constants#0}[$\gamma_0$] is the Euler-Mascheroni
    constant $\gamma$ in $H_x=\psi(x+1)+\gamma$
Links:
  DLMFPsi:
    title: 'DLMF 5.2: Gamma and Psi Functions'
    url: https://dlmf.nist.gov/5.2
  DLMFFunctional:
    title: 'DLMF 5.5: Functional Relations'
    url: https://dlmf.nist.gov/5.5
  WikiDigamma:
    title: 'Wikipedia: Digamma function'
    url: https://en.wikipedia.org/wiki/Digamma_function
  WikiHarmonic:
    title: 'Wikipedia: Harmonic number'
    url: https://en.wikipedia.org/wiki/Harmonic_number
Tags:
- special values
- special functions
Data properties:
  type: R
  rigour: proven
  rigour details: Each non-exact value is computed as a Sage real ball with arb at
    `numberdb.bits(digits, losing=96)` bits, using exact rational arguments. The entries
    were checked against the defining relation CITE{formula-harmonic}, the recurrence
    in CITE{formula-recurrence}, and the exact rational values of $H_n$ for nonnegative
    integers $n$.
  complete: 'no'
  complete-note: it holds $H_x$ for every rational argument $x=a/b$ in lowest terms
    with $b\leq12$ and $-4<x\leq4$ at which $H_x$ is finite; arguments outside $0<x\leq1$
    are included because, for positive integers $k$, the differences $H_{x+k}-H_x=\sum_{j=1}^{k}1/(x+j)$
    are rational whenever both sides are finite
Display properties:
  number-header: $H_x$

Data properties:
  type: R
  rigour: measured
  complete: no
  complete-note: it holds $\beta=1,2,4$ for every grid point $s=-10,-9.95,\ldots,5$
  rigour details: >-
    Values were computed from CITE{formula-determinants} by Gauss-Legendre
    Nystrom quadrature for the operator $T_t$ and its derivative with respect
    to $t$. The derivative of the determinant was evaluated by
    $d\det(I\pm T_t)/dt=\det(I\pm T_t)\operatorname{tr}((I\pm T_t)^{-1}
    (\pm dT_t/dt))$. A Painlevé-II integration of $q$, $u$, $I$ and
    $\int_s^\infty (x-s)q(x)^2\,dx$ was used as an independent control where
    the downward integration stays on the Hastings-McLeod branch. In the
    far-left $\beta=4$ tail that integration follows the unstable mode, so
    the written precision there is limited by convergence of the determinant
    quadrature alone. That tail uses mpmath multiprecision central differences
    of the determinant values, because double precision loses relative
    accuracy there.

# The table document for numberdb-data#96, to be created on the site.
Title: Tutte polynomials of connected graphs
Definition: >-
  The Tutte polynomial of a graph $G$ is
  $T(G; x, y) = \sum_{A \subseteq E} (x-1)^{r(E) - r(A)} (y-1)^{|A| - r(A)}$,
  the sum over subsets of the edges, where $r(A)$ is the rank of $A$: the
  number of vertices minus the number of components of the spanning subgraph
  on $A$. It is a polynomial in two variables.
Parameters:
  g:
    type: Symbolic
    constraints: a connected graph on at most $7$ vertices, named by its
      canonical graph6 string
    display: $G$
Data properties:
  type: Z[]
  complete: yes
  rigour: exact
Formulas:
  formula-deletion-contraction: >-
    $T(G) = T(G - e) + T(G / e)$ for an edge $e$ that is neither a bridge nor
    a loop; $T(G) = x\,T(G/e)$ for a bridge and $y\,T(G-e)$ for a loop, with
    $T = 1$ on the graph with no edges.
  formula-chromatic: >-
    $P(G, x) = (-1)^{n-1} x\, T(G; 1-x, 0)$ for a connected graph on $n$
    vertices, where $P$ is the chromatic polynomial
    HREF{Chromatic_polynomials_of_connected_graphs}.
  formula-spanning-trees: >-
    $T(G; 1, 1)$ is the number of spanning trees, $T(G; 2, 1)$ the number of
    spanning forests, $T(G; 1, 2)$ the number of spanning connected
    subgraphs, and $T(G; 2, 2) = 2^{|E|}$.
  formula-reliability: >-
    $T(G; 2, 0)$ counts the acyclic orientations of $G$, up to sign:
    $(-1)^{n} P(G, -1) = T(G; 2, 0)$ times a power of two.
Comments:
  comment-graph6: >-
    Graphs are named by their graph6 string CITE{Graph6}, McKay's compact
    encoding, taken after a canonical relabelling so that the name depends on
    the graph and not on how its vertices happen to be numbered. Recover the
    graph in Sage with $\texttt{Graph(name)}$.
  comment-connected: >-
    Connected graphs only. The Tutte polynomial of a disconnected graph is the
    product of those of its components.
  comment-named: >-
    Thirty-five of the $996$ graphs here have a name in common use; those
    entries carry it.
  comment-universal: >-
    The Tutte polynomial is universal among the graph invariants satisfying a
    deletion-contraction rule: every such invariant is an evaluation of it.
    That is why the chromatic polynomial
    HREF{Chromatic_polynomials_of_connected_graphs} is one of its
    specialisations.
Links:
  Wiki:
    title: 'Wikipedia: Tutte polynomial'
    url: https://en.wikipedia.org/wiki/Tutte_polynomial
  Graph6:
    title: 'The graph6 and sparse6 formats (McKay)'
    url: https://users.cecs.anu.edu.au/~bdm/data/formats.txt
Tags:
  - polynomial
  - combinatorics
Programs:
  program-sage:
    language: Sage
    code: |-
      G = Graph('I@OZCMgs?')           # the Petersen graph, by its name here
      G.tutte_polynomial()

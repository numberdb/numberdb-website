Data properties:
  type: C
  rigour: proven
  complete: 'yes'
  rigour details: >-
    Each value is SnapPy's verified cusp shape of the exterior of the closure
    of KnotInfo's braid word for the knot, computed as a complex interval at
    540 bits. SnapPy certifies the complete hyperbolic structure by interval
    methods in the sense of CITE{HIKMOT}; the digits written are those
    supported by the interval. The generator checks the exact figure-eight
    value $2\sqrt{-3}$, checks the mirror relation on every chiral hyperbolic
    knot, checks that every amphichiral hyperbolic knot has purely imaginary
    cusp shape in this convention, and checks that the hyperbolic knot list has
    243 entries and is the KnotInfo braid table with the torus knots removed.
Display properties:
  number-header: $\tau(S^3\setminus K)$

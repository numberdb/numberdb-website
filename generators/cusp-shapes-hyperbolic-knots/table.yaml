# The table document for numberdb.org/T317. It was created as a draft through
# the API (X-Draft: yes), with Numbers: [] so the first fill can use the
# entries endpoint. Publishing is a person's act on the site.
Title: Cusp shapes of the hyperbolic prime knots with at most ten crossings
Definition: >-
  The cusp shape $\tau(S^3\setminus K)$ is SnapPy's longitude translation
  divided by its meridian translation for the complete hyperbolic metric on a
  one-cusped knot complement CITE{SnapPy}. This table lists it for the
  hyperbolic prime knots $n_k$ with at most ten crossings and their distinct
  mirror images.
Parameters:
  n:
    type: Z
    title: crossing number
    display: $n$
    constraints: $4\leq n\leq 10$, with $n=3$ omitted because the trefoil $3_1$ is a torus knot
  k:
    type: Z
    title: index in the Rolfsen table
    display: $k$
    constraints: >-
      $1\leq k\leq N(n)$, where $N(n)$ is the number of prime knots with $n$
      crossings, $1,2,3,7,21,49,165$ for $n=4,\ldots,10$, and $n_k$ is not
      one of the torus knots $5_1$, $7_1$, $8_{19}$, $9_1$, $10_{124}$
  knot:
    type: Symbolic
    title: the knot $K=n_k$ as KnotInfo draws it, or its mirror image $\bar K$
    display: knot
    values:
      K: $K$
      mirror: $\bar K$
    constraints: >-
      $\bar K$ is listed for the chiral hyperbolic knots only; the 20
      amphichiral hyperbolic knots are their own mirror images
Comments:
  comment-which-knots: >-
    A prime knot is a torus knot, a satellite knot or hyperbolic
    CITE{Thurston}, and no satellite knot has fewer than thirteen crossings
    CITE{KnotInfo}. Of the 249 prime knots with at most ten crossings, 243 are
    therefore hyperbolic and are listed here; the six torus knots
    $3_1=T(2,3)$, $5_1=T(2,5)$, $7_1=T(2,7)$, $9_1=T(2,9)$,
    $8_{19}=T(3,4)$ and $10_{124}=T(3,5)$ have Seifert fibred complements,
    carry no hyperbolic metric, and are left out. The unknot is left out for
    the same reason.
  comment-numbering: >-
    The exterior is built from KnotInfo's braid word CITE{KnotInfo}, using the
    same post-Perko knot numbering as the neighboring knot tables: Rolfsen's
    table CITE{Rolfsen} with Perko's correction CITE{Perko}. SnapPy's built-in
    names Manifold('n_k') CITE{SnapPy} use Rolfsen's pre-Perko ten-crossing
    table in part and interchange the knots named $10_{83}$ and $10_{86}$
    relative to KnotInfo, so they are not used to construct the entries.
  comment-mirror: >-
    Rows marked $K$ use KnotInfo's diagram, and rows marked $\bar K$ use its
    mirror image. These are the two mirror choices for the same Rolfsen knot
    name, not two different quantities.
  comment-convention: >-
    The value is SnapPy's cusp shape, not the reduced modulus of the Euclidean
    cusp torus. Changing the peripheral basis by
    $\begin{pmatrix}a&b\\ c&d\end{pmatrix}\in \mathrm{SL}_2(\mathbb Z)$
    changes the shape by the fractional linear transformation
    $\tau\mapsto(a\tau+b)/(c\tau+d)$, so the meridian-longitude basis is part
    of the definition.
  comment-entries: >-
    An entry comment gives the knot's common name where it has one.
Formulas:
  formula-mirror: >-
    $\tau(S^3\setminus\bar K)=-\overline{\tau(S^3\setminus K)}$ in the
    convention used here, where $\bar K$ is the mirror image.
  formula-figure-eight: >-
    $\tau(S^3\setminus4_1)=2\sqrt{-3}=2i\sqrt3$ for the figure-eight knot
    complement.
Programs:
  program-snappy:
    language: Sage
    code: |-
      from snappy import Link
      Link(braid_closure=[1, -2, 1, -2]).exterior().cusp_info('shape', verified=True, bits_prec=400)[0]
      # Use KnotInfo braid words for n_k; SnapPy's Manifold('n_k') names do not match this table throughout.

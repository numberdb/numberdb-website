Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds the $23$ noncompact Coxeter simplices in $\mathbb{H}^3$ and no
    compact tetrahedra or simplices in dimensions $4$ to $9$
  rigour details: >-
    The generator evaluates the Lobachevsky function as
    $\frac12\operatorname{Im}\operatorname{Li}_2(e^{2i\theta})$ in arb ball
    arithmetic and applies CITE{formula-orthoscheme} and the orthoscheme
    decompositions of CITE{KozmaSzirmai}. It writes $100$ digits. Before the
    draft was filled, all $23$ rows were checked against the source decimals
    in CITE{KozmaSzirmai}, the regular ideal tetrahedron and ideal octahedral
    values were checked against the stored Clausen table, and the $[3,3,6]$
    and $[3,4,4]$ rows were checked as quarters of the $D=-3$ and $D=-4$
    Bianchi covolumes.
Display properties:
  number-header: $\mathrm{Vol}$

Title: Volumes of the hyperbolic Coxeter simplices
Definition: >-
  Let $P$ be a finite-volume hyperbolic Coxeter simplex CITE{WikiCoxeter}
  in $\mathbb{H}^n$, with dihedral angles of the form $\pi/m$. Listed is the
  hyperbolic volume of $P$ for the metric of curvature $-1$.
Keywords:
  - Coxeter simplex
  - hyperbolic Coxeter simplex
  - hyperbolic Coxeter tetrahedron
  - Koszul simplex
  - Lobachevsky function
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: an integer with $3\leq n\leq9$
  diagram:
    type: Symbolic
    title: Coxeter symbol
    display: Coxeter symbol
    constraints: a Coxeter symbol of a finite-volume hyperbolic Coxeter simplex
Comments:
  comment-group: >-
    Each entry is the volume of the simplex itself, equivalently the covolume
    of the full reflection group generated by its facets. The
    orientation-preserving subgroup has index $2$ and covolume twice the
    value listed here.
  comment-range: >-
    This fill holds the $23$ noncompact rank-$4$ Coxeter simplices in
    $\mathbb{H}^3$, also called Koszul-type tetrahedra CITE{KozmaSzirmai}.
    The nine compact Coxeter tetrahedra and the higher-dimensional simplices
    are not listed yet.
  comment-notation: >-
    Coxeter symbols are written as in CITE{KozmaSzirmai}, Table 1. The entry
    comment gives the Witt symbol from that table, and the source decimal
    used as a check.
  comment-regular: >-
    The entry $[3^{[3,3]}]$ is the regular ideal tetrahedron. Its volume is
    $3\Lambda(\pi/3)=\mathrm{Cl}_2(\pi/3)$, the Gieseking constant held in
    HREF{Values_of_the_Clausen_functions_at_rational_multiples_of#2,1/3}[the
    table of Clausen values].
Formulas:
  formula-lobachevsky: >-
    The Lobachevsky function is
    $\Lambda(\theta)=\frac12\operatorname{Im}\operatorname{Li}_2(e^{2i\theta})
    =-\int_0^\theta\log|2\sin t|\,dt$ CITE{KozmaSzirmai}. It is
    $\frac12\mathrm{Cl}_2(2\theta)$, where
    HREF{Values_of_the_Clausen_functions_at_rational_multiples_of}[$\mathrm{Cl}_2$]
    is the Clausen function.
  formula-orthoscheme: >-
    If $[p,q,r]$ is a complete hyperbolic Coxeter orthoscheme and
    $\alpha=\pi/p$, $\beta=\pi/q$, $\gamma=\pi/r$, set
    $\tan\theta=\sqrt{\cos^2\beta-\sin^2\alpha\sin^2\gamma}/(\cos\alpha\cos\gamma)$.
    Then
    $\mathrm{Vol}([p,q,r])=\frac14\{\Lambda(\alpha+\theta)-\Lambda(\alpha-\theta)
    +\Lambda(\gamma+\theta)-\Lambda(\gamma-\theta)
    +\Lambda(\pi/2+\beta-\theta)+\Lambda(\pi/2-\beta-\theta)
    +2\Lambda(\pi/2-\theta)\}$, the Kellerhals formula as used by
    CITE{JKRT}.
  formula-arithmetic: >-
    $\mathrm{Vol}([3,3,6])=\Lambda(\pi/3)/8$ and
    $\mathrm{Vol}([3,4,4])=\Lambda(\pi/4)/6$. These are one quarter of the
    $D=-3$ and $D=-4$ entries of
    HREF{Covolumes_of_the_Bianchi_groups}[the Bianchi covolume table].
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.real_arb import RealBallField
      RB = RealBallField(numberdb.bits(80, losing=80))
      CB = ComplexBallField(numberdb.bits(80, losing=80))
      pi = RB.pi()
      def Lambda(theta):
          z = (CB(0, 2) * CB(theta)).exp()
          return z.polylog(2).imag() / 2
      Lambda(pi / 3) / 8        # Vol([3,3,6])

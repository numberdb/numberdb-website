# Draft document for numberdb.org/T421, constants of the von Kármán
# rotating-disk flow. It was created through the API with X-Draft: yes.
# Publishing is a person's act on the site.
Title: Constants of the von Kármán rotating-disk flow
Definition: >-
  The von Kármán rotating-disk flow is the similarity solution for an infinite
  disk rotating in an otherwise quiescent incompressible Newtonian fluid
  CITE{WikiVonKarman} CITE{VonKarman}. This table gives its three classical
  characteristic constants.
Keywords:
  - von Karman rotating disk
  - von Kármán rotating disk
  - rotating-disk flow
  - Cochran rotating disk constants
  - axial inflow rotating disk
Parameters:
  constant:
    type: Symbolic
    title: component of the similarity solution
    display: component
    constraints: one of `radial-shear`, `azimuthal-shear` and `axial-inflow`
    values:
      radial-shear: $F'(0)$
      azimuthal-shear: $G'(0)$
      axial-inflow: $-H_\infty$
Comments:
  comment-sign: >-
    The axial velocity is negative far from the disk in this convention. The
    `axial-inflow` row stores the positive constant $-H_\infty$, so that the
    dimensional far-field velocity is $-\sqrt{\nu\Omega}\,(-H_\infty)$.
  comment-components: >-
    The three rows are parts of one similarity solution: two wall derivatives
    and one far-field constant. They are kept together because the classical
    numerical tables quote them as one set of characteristic parameters
    CITE{WhiteMohrNewman} CITE{MiklavcicWang}.
Formulas:
  formula-similarity: >-
    With $\eta=z\sqrt{\Omega/\nu}$, the dimensional velocities are
    $u_r=r\Omega F(\eta)$, $u_\theta=r\Omega G(\eta)$ and
    $u_z=\sqrt{\nu\Omega}\,H(\eta)$.
  formula-equations: >-
    The similarity functions satisfy
    $2F+H'=0$, $F^2-G^2+HF'=F''$ and $2FG+HG'=G''$, with
    $F(0)=H(0)=0$, $G(0)=1$ and $F(\infty)=G(\infty)=0$.
  formula-far-field: >-
    $H_\infty=\lim_{\eta\to\infty}H(\eta)$.
Programs:
  program-python:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      # The attached generate.py solves the two shooting equations for F'(0)
      # and G'(0), then reads H at the same finite endpoint.
Links:
  WikiVonKarman:
    title: "Wikipedia: Von Kármán swirling flow"
    url: https://en.wikipedia.org/wiki/Von_K%C3%A1rm%C3%A1n_swirling_flow
References:
  VonKarman:
    bib: >-
      T. von Kármán, Über laminare und turbulente Reibung, Zeitschrift für
      angewandte Mathematik und Mechanik 1 (1921), 233-252.
  Cochran:
    bib: >-
      W. G. Cochran, The flow due to a rotating disc, Mathematical Proceedings
      of the Cambridge Philosophical Society 30 (1934), 365-375.
    doi: 10.1017/S0305004100012561
  WhiteMohrNewman:
    bib: >-
      R. E. White, C. M. Mohr Jr. and J. Newman, The fluid motion due to a
      rotating disk, Journal of the Electrochemical Society 123 (1976),
      383-385.
    doi: 10.1149/1.2132830
  MiklavcicWang:
    bib: >-
      M. Miklavčič and C. Y. Wang, The flow due to a rough rotating disk,
      Zeitschrift für angewandte Mathematik und Physik 55 (2004), 235-246.
    doi: 10.1007/s00033-003-2096-6
Tags:
  - analysis
  - physics
Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: yes
  rigour details: >-
    The values are computed by shooting on $F'(0)$ and $G'(0)$ in the
    finite-interval boundary-value problem. The generator solves the same
    shooting equations at two working precisions, requires the 30 stored digits
    to agree, checks the first derivative of the integrated $H$ against
    $H'=-2F$, and checks the rounded values against the constants printed by
    White, Mohr and Newman CITE{WhiteMohrNewman} and the no-slip case of
    Miklavčič and Wang CITE{MiklavcicWang}.
Display properties:
  number-header: $F'(0)$, $G'(0)$, $-H_\infty$

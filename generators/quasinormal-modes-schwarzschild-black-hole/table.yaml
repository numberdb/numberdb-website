Title: Quasinormal modes of the Schwarzschild black hole
Definition: >-
  For a Schwarzschild black hole of mass $M$, this table gives the
  dimensionless quasinormal-mode frequencies $M\omega_{s\ell n}$: the values
  of $\omega$ for which the spin-$s$ Regge-Wheeler equation has a solution
  that is purely ingoing at the horizon and purely outgoing at infinity
  CITE{Leaver}.
Parameters:
  s:
    type: Z
    title: spin of the perturbing field
    display: $s$
    constraints: $s\in\{0,1,2\}$
  l:
    type: Z
    title: spherical-harmonic degree
    display: $\ell$
    constraints: $\ell\geq s$
  n:
    type: Z
    title: overtone number
    display: $n$
    constraints: $n\geq0$
Comments:
  comment-conventions: >-
    Perturbations use the time dependence $\exp(-i\omega t)$, so a damped
    mode has $\operatorname{Im}(\omega)<0$. The values $s=0,1,2$ correspond
    respectively to scalar, electromagnetic and gravitational perturbations.
    For fixed $s$ and $\ell$, the modes are ordered by increasing
    $|\operatorname{Im}\omega|$; $n=0$ is the least-damped mode.
  comment-units: >-
    The stored value is the dimensionless product $M\omega$ in geometric units
    $G=c=1$. Berti's Schwarzschild tables CITE{BertiTables} give
    $2M\omega_R$ and $2M\omega_I$ with $\omega_I>0$, so a value read from
    there is twice this one and its imaginary part has the opposite sign.
  comment-regge-wheeler-zerilli: >-
    For $s=2$, the polar Zerilli equation is isospectral to the axial
    Regge-Wheeler equation, so the table serves both. The qnm package
    CITE{Stein} indexes these modes by the Teukolsky spin weight $-s$, so the
    gravitational modes of this table are its $s=-2$.
  comment-schwarzschild-degeneracy: >-
    The Schwarzschild spectrum is independent of the azimuthal number $m$, so
    $m$ is not a parameter of this table.
Formulas:
  formula-eikonal: >-
    As $\ell\to\infty$ with $s$ and $n$ fixed,
    $\sqrt{27}\,M\omega_{s\ell n}=\ell+\tfrac12-i(n+\tfrac12)+O(\ell^{-1})$,
    independently of $s$ CITE{BertiCardosoStarinets}.
Programs:
  program-python:
    language: Python
    code: |-
      from qnm.schwarzschild.tabulated import QNMDict
      schwarzschild = QNMDict(init=True)
      schwarzschild(-2, 2, 0)[0]

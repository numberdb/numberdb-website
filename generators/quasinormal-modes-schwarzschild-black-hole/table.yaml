Data properties:
  type: C
  rigour: heuristic (agreement-checked)
  complete: no
  complete-note: >-
    it holds the modes for $s=2$ and $2\leq\ell\leq6$, for $s=0$ and
    $0\leq\ell\leq4$, for $s=1$ and $1\leq\ell\leq5$, and for
    $n=0$
  rigour details: >-
    The generator solves Leaver's continued-fraction equation CITE{Leaver} by
    Newton iteration on the real and imaginary parts. The right infinite tail
    is evaluated by capped modified Lentz iteration as in
    CITE{CookZalutskiy}, and each stored entry is the complex rectangle
    spanned by two computations.
    Most rows use 50 decimal working digits with tail tolerance $10^{-10}$
    and 70 decimal working digits with tail tolerance $10^{-12}$. The scalar
    monopole row uses 60 decimal working digits with tail tolerance
    $10^{-10}$ and 80 decimal working digits with tail tolerance $10^{-12}$
    because its continued-fraction tail converges more slowly.
    The generator uses the Dolan-Ottewill expansion CITE{DolanOttewill} only
    for initial guesses,
    compares every stored row with the Black Hole Perturbation Toolkit qnm
    cache CITE{BHPToolkitQNM} CITE{Stein}, and compares the diagonal
    $s=\ell=2$ and $s=\ell=1$ rows with Berti's tabulation CITE{BertiTables}.
    The continued-fraction residuals are used as numerical diagnostics rather
    than certified error bounds, so the table does not claim proven values.
Display properties:
  number-header: $M\omega_{s\ell n}$
  group parameters:
    - - s
    - - l
    - - n
Numbers: []

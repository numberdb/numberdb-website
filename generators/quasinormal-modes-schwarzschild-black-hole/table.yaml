Title: Quasinormal modes of the Schwarzschild black hole
Definition: >-
  For a Schwarzschild black hole of mass $M$, this table gives the
  dimensionless quasinormal-mode frequencies $M\omega_{s\ell n}$ of the
  spin-$s$ Regge-Wheeler or Zerilli equation CITE{Leaver}. Perturbations use
  the time dependence $\exp(-i\omega t)$, so a damped mode has
  $\operatorname{Im}(\omega)<0$.
Parameters:
  s:
    type: Z
    title: spin weight of the perturbing field
    display: $s$
    constraints: $s\in\{0,1,2\}$
    comments: >-
      The values $s=0,1,2$ correspond respectively to scalar, electromagnetic
      and gravitational perturbations. They are enumerated in the order
      $2,0,1$ so the gravitational modes appear first.
  l:
    type: Z
    title: spherical-harmonic degree
    display: $\ell$
    constraints: $\ell\geq s$
  n:
    type: Z
    title: overtone number
    display: $n$
    constraints: $n\geq0$
    comments: >-
      For fixed $s$ and $\ell$, the modes are ordered by increasing
      $|\operatorname{Im}\omega|$; $n=0$ is the least-damped mode.
Comments:
  comment-units: >-
    The units are geometric units $G=c=1$, with $M=1$ in the stored
    dimensionless value. Berti's Schwarzschild data CITE{BertiTables} is
    tabulated as $2M\omega_R,2M\omega_I$ with $\omega_I>0$, so the generator
    divides those reference values by two and compares them with
    $M\omega_R-iM\omega_I$.
  comment-schwarzschild-degeneracy: >-
    The Schwarzschild spectrum is independent of the azimuthal number $m$, so
    $m$ is not a parameter of this table.
Formulas:
  formula-eikonal: >-
    In the eikonal regime,
    $\sqrt{27}\,M\omega_{s\ell n}\sim \ell+\frac12-i(n+\frac12)$.
Programs:
  program-python:
    language: Python
    code: |-
      from qnm.schwarzschild.tabulated import QNMDict
      schwarzschild = QNMDict(init=True)
      schwarzschild(-2, 2, 0)[0]

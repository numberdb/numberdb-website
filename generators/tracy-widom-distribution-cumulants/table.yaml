Title: Cumulants $\kappa_n$ of the Tracy–Widom distributions
Definition: >-
  For $\beta\in\{1,2,4\}$, let $X_\beta$ have the Tracy–Widom distribution
  CITE{WikiTW} in the soft-edge scaling used by CITE{Bornemann}. This table
  gives the cumulants $\kappa_n(\beta)$ defined by
  $\log\mathbb E(\exp(tX_\beta))=\sum_{n\geq1}\kappa_n(\beta)t^n/n!$.
Keywords:
  - Tracy-Widom cumulants
  - Tracy-Widom mean
  - Tracy-Widom variance
  - GOE Tracy-Widom
  - GUE Tracy-Widom
  - GSE Tracy-Widom
Parameters:
  beta:
    type: Z
    title: Dyson index
    display: $\beta$
    constraints: $\beta\in\{1,2,4\}$
    values:
      '1': Gaussian orthogonal ensemble
      '2': Gaussian unitary ensemble
      '4': Gaussian symplectic ensemble
  n:
    type: Z
    title: cumulant order
    display: $n$
    constraints: $n\geq1$
Comments:
  comment-first-two: >-
    The entries with $n=1$ and $n=2$ are the mean and variance respectively.
  comment-standardised: >-
    Bornemann's table lists mean, variance, skewness and excess kurtosis. The
    entries with $n=3$ and $n=4$ are the corresponding raw cumulants, not the
    standardised skewness and excess kurtosis.
  comment-gse-scaling: >-
    The $\beta=4$ row uses Bornemann's Tracy–Widom scaling
    $F_4(s)=F_4(1;\sqrt2\,s)$. In the convention without the $\sqrt2$ in the
    argument, the $\beta=4$ cumulant $\kappa_n$ is multiplied by $2^{n/2}$.
Formulas:
  formula-standardised: >-
    If $\gamma_1$ is the skewness and $\gamma_2$ is the excess kurtosis, then
    $\kappa_3=\gamma_1\kappa_2^{3/2}$ and
    $\kappa_4=\gamma_2\kappa_2^2$.
Similar tables:
  - table: HREF{Values_of_the_Airy_function_of_the_first_kind}[Values of the Airy function of the first kind $\operatorname{Ai}(x)$]
    relation: the Hastings-McLeod solution in the Painlevé-II representation of $F_\beta$ is asymptotic to $\operatorname{Ai}$
  - table: HREF{Random-matrix_factors_in_the_moments_of_characteristic_polynomials_of_unitary_orthogonal_a}[Random-matrix factors in the moments of characteristic polynomials of unitary, orthogonal and symplectic matrices]
    relation: random-matrix constants from compact groups rather than soft-edge distribution cumulants
Links:
  WikiTW:
    title: "Wikipedia: Tracy-Widom distribution"
    url: https://en.wikipedia.org/wiki/Tracy%E2%80%93Widom_distribution
References:
  Bornemann:
    bib: >-
      Folkmar Bornemann, On the numerical evaluation of distributions in
      random matrix theory: a review, Markov Processes and Related Fields 16
      (2010), 803-866.
    arxiv: '0904.1581'
Programs:
  program-python:
    language: Python
    code: |-
      from decimal import Decimal, getcontext

      getcontext().prec = 50
      variance = Decimal("0.8131947928329")
      skewness = Decimal("0.224084203610")
      kappa_3 = skewness * variance.sqrt() ** 3
Data properties:
  type: R
  rigour: measured
  complete: no
  complete-note: >-
    it holds the first four cumulants, $1\leq n\leq4$, for
    $\beta\in\{1,2,4\}$
  rigour details: >-
    The mean, variance, skewness and excess kurtosis were transcribed from
    CITE{Bornemann}, Example 9.4.1. The generator converts the published
    skewness and excess kurtosis to the raw cumulants using
    CITE{formula-standardised}; the stored digits are no longer than the
    published input digits justify. The $\beta=2$ values were compared with a
    direct Painlevé-II integration from the screening run, and the $\beta=4$
    scaling was checked by recomputing the GSE mean and variance from the same
    Painlevé-II representation.
Display properties:
  number-header: $\kappa_n(\beta)$
Tags:
  - probability theory
  - special functions

Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=64)` bits, with the imaginary part checked
    to contain zero. The entries were checked against mpmath at 150 decimal
    digits, against Kummer's transformation in CITE{formula-reflection}
    wherever the transformed row is also stored, against
    CITE{formula-exponential-integral} for every stored row with $(a,b)=(1,1)$,
    against CITE{formula-erfc} for every stored row with $(a,b)=(1/2,1/2)$,
    and against CITE{formula-bessel-k} wherever $b=2a$ and the corresponding
    Bessel value could be computed. The widest returned ball had radius less
    than $4\cdot10^{-115}$ for 100 requested digits.
  complete: no
  complete-note: >-
    it holds every non-elementary entry with
    $a\in\{-1/2,1/2,1,3/2,2,5/2,3\}$,
    $b\in\{-1/2,0,1/2,1,3/2,2,5/2,3\}$, and
    $z\in\{1/4,1/2,1,2,3,4\}$
Display properties:
  number-header: $U(a,b,z)$

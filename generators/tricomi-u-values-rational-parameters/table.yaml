# The table document for T209, Values of Tricomi's confluent hypergeometric
# function U. It was built from proposal 7 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, after excluding the full
# elementary subfamily b = a + n + 1 identified in DLMF 13.2.8.
Title: Values of Tricomi's confluent hypergeometric function $U(a,b,z)$
Definition: >-
  This table gives the real principal values of Tricomi's confluent
  hypergeometric function $U(a,b,z)$ CITE{Wiki} CITE{DLMFDefinitions}, the
  standard solution of Kummer's equation determined by
  $U(a,b,z)\sim z^{-a}$ as $z\to\infty$, for rational $a$, rational $b$, and
  rational $z>0$.
Keywords:
  - Tricomi function
  - Tricomi U
  - confluent hypergeometric function
  - confluent hypergeometric function of the second kind
  - HypergeometricU
  - parabolic cylinder function
  - Whittaker function
Parameters:
  a:
    type: Q
    title: first parameter
    display: $a$
    constraints: $a\in\mathbb{Q}$
  b:
    type: Q
    title: second parameter
    display: $b$
    constraints: $b\in\mathbb{Q}$
  z:
    type: Q
    title: argument
    display: $z$
    constraints: $z>0$
Comments:
  comment-branch: >-
    The principal branch is the one in CITE{DLMFDefinitions}. Its branch cut is
    $(-\infty,0]$ in the $z$-plane, and the values in this table are real
    because $a$ and $b$ are real and $z>0$.
  comment-elementary-rows: >-
    Elementary rows are not listed separately. When $a$ is a non-positive
    integer, $U(a,b,z)$ is a polynomial in $z$ by CITE{formula-polynomial-a}.
    When $b=a+n+1$ with $n\in\mathbb{Z}_{\geq0}$, it is $z^{-a}$ times a
    polynomial in $1/z$ by CITE{formula-elementary-b}; the case $n=0$ is
    $U(a,a+1,z)=z^{-a}$.
  comment-other-functions: >-
    This is Tricomi's function $U(a,b,z)$, not the parabolic cylinder function
    $U(a,z)$ or the Whittaker function $W_{\kappa,\mu}(z)$.
Formulas:
  formula-differential-equation: >-
    The function $U(a,b,z)$ is a solution of Kummer's equation
    $z w''+(b-z)w'-a w=0$ CITE{DLMFDefinitions}.
  formula-reflection: >-
    Kummer's transformation for Tricomi's function is
    $U(a,b,z)=z^{1-b}U(a-b+1,2-b,z)$ CITE{DLMFConnections}.
  formula-polynomial-a: >-
    For $m\in\mathbb{Z}_{\geq0}$, $U(-m,b,z)$ is a polynomial in $z$ of degree
    $m$ CITE{DLMFDefinitions}.
  formula-elementary-b: >-
    For $n\in\mathbb{Z}_{\geq0}$,
    $U(a,a+n+1,z)=z^{-a}\sum_{s=0}^n {n\choose s}(a)_s z^{-s}$
    CITE{DLMFDefinitions}.
  formula-exponential-integral: >-
    $U(1,1,z)=e^z E_1(z)$, where $E_1$ is
    HREF{Values_of_the_exponential_integral}[the exponential integral]
    CITE{DLMFRelations}.
  formula-erfc: >-
    For $z>0$, $U(1/2,1/2,z)=\sqrt{\pi}e^z\operatorname{erfc}(\sqrt z)$
    CITE{DLMFRelations}.
  formula-bessel-k: >-
    $U(\nu+1/2,2\nu+1,2z)=\pi^{-1/2}e^z(2z)^{-\nu}K_\nu(z)$, where
    $K_\nu$ is HREF{Values_of_modified_Bessel_functions_of_the_second_kind}[the
    modified Bessel function of the second kind] CITE{DLMFRelations}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=64))
      a = CBF(QQ(1))
      b = CBF(QQ(1))
      z = CBF(QQ(1))

      # Sage's arb method is called on the argument.
      z.hypergeometric_U(a, b).real()
  program-python:
    language: Python
    code: |-
      import mpmath

      mpmath.mp.dps = 100
      mpmath.hyperu(1, 1, 1)

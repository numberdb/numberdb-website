Title: Residues of Dedekind zeta functions of quartic fields
Definition: Let $K$ be a quartic field CITE{Wiki-quartic} of discriminant $D$
  and $\zeta_K(s)=\sum_{\mathfrak{a}}N(\mathfrak{a})^{-s}$ its Dedekind zeta
  function CITE{Wiki}, summed over the nonzero ideals of $\mathcal{O}_K$.
  Listed is $\kappa_K=\lim_{s\to 1}(s-1)\zeta_K(s)$, the residue of
  $\zeta_K$ at its pole $s=1$.
Keywords:
- Dedekind zeta residue
- quartic number field
Parameters:
  D:
    type: Z
    title: discriminant of $K$
    display: $D$
    constraints: $D$ the discriminant of a quartic field
  k:
    type: Z
    title: index of $K$ among the quartic fields of discriminant $D$
    display: $k$
    constraints: $k\geq 1$
Comments:
  comment-index: The fields of discriminant $D$ are numbered $k=1,2,\ldots$
    by reducing their defining polynomials with PARI's `polredabs` and sorting
    the reduced polynomials lexicographically by coefficient vector. This is
    the same $D,k$ convention used for HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[the
    table of residues of Dedekind zeta functions of cubic fields].
  comment-signature: The sign of $D$ does not determine the signature of a
    quartic field. A negative discriminant means signature $(2,1)$, while a
    positive discriminant can mean either signature $(4,0)$ or $(0,2)$. The
    signature is therefore stated in each entry comment.
  comment-entries: The comment on each entry gives the reduced defining
    polynomial $f$, so that $K=\mathbb{Q}(a)$ with $f(a)=0$; the signature; the
    Galois group of the Galois closure as a 4T label; the class number $h_K$;
    the number $w_K$ of roots of unity in $K$; and the LMFDB label.
  comment-roots-of-unity: Among these 456 fields, $w_K=2$ for 338 fields,
    $w_K=4$ for 44 fields, $w_K=6$ for 71 fields, and the three remaining
    fields have $w_K=8$, $10$ and $12$. This factor is visible in the class
    number formula CITE{formula-class-number}; the entries with $D=125$ and
    $D=144$ are the cyclotomic fields $\mathbb{Q}(\zeta_5)$ and
    $\mathbb{Q}(\zeta_{12})$.
  comment-not-completed: The residue is that of $\zeta_K$ itself. The completed
    Dedekind zeta function has a different residue at $s=1$.
Formulas:
  formula-class-number: $\kappa_K=\frac{2^{r_1}(2\pi)^{r_2}h_KR_K}{w_K\sqrt{|D|}}$,
    where $(r_1,r_2)$ is the signature, $h_K$ is the class number, $R_K$ is the
    regulator and $w_K$ is the number of roots of unity in $K$ CITE{WikiCNF}
    CITE{LMFDB-CNF}.
Programs:
  program-pari:
    language: PARI/GP
    code: "default(realprecision, 80);\nf = x^4 - x^3 + x^2 - x + 1;       \\\\ D = 125\nK = bnfinit(f, 1); bnfcertify(K);\n2^K.r1 * (2*Pi)^K.r2 * K.no * K.reg / (K.tu[1] * sqrt(abs(K.disc)))\npolcoef(lfunrootres(lfuncreate(f))[1][1][2], -1)"
Similar tables:

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds the same 456 quartic fields with $|D|\leq 5000$ under
    the same $D$ and $k$
  rigour details: Each value is a real ball from the class number formula
    CITE{formula-class-number} at 525 bits, using `numberdb.bits(100,
    losing=192)`. The fields are enumerated by PARI's `nflist("C4", [1, 5000])`,
    `nflist("V4", [1, 5000])`, `nflist("D4", [1, 5000])`, `nflist("A4", [1, 5000])`
    and `nflist("S4", [1, 5000])`, then sorted by $|D|$, positive $D$ before
    negative $D$ at the same absolute value, and then by $k$; the generator
    refuses to run unless it finds 456 fields with signature counts 20 of
    $(4,0)$, 180 of $(2,1)$ and 256 of $(0,2)$.

    The class number, roots of unity and fundamental units are PARI's, from
    `bnfinit(f, 1)`, and `bnfcertify` is required to return 1 for every field.
    The fundamental units are taken exactly as polynomials in $a$; PARI's
    floating regulator is not used for the stored value. The roots of the
    reduced polynomial are isolated as complex balls, the units are evaluated
    at those roots by Horner's rule, and the regulator is the determinant of
    the logarithmic embedding matrix, with weight 1 on real embeddings and
    weight 2 on complex embeddings. The value is then formed with arb's $\pi$
    and square root. The dry run checked that every row carries 100 digits,
    and compared all 456 residues with PARI's `lfunrootres(lfuncreate(f))`, a
    computation from the Dedekind zeta function rather than from `bnfinit`;
    there were no disagreements at the 100 digits stored here.
Display properties:
  number-header: $\kappa_K$

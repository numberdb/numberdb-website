    of Dedekind zeta functions of quadratic fields]
  relation: the same residue for degree two, where $\kappa_K=L(1,\chi_D)$ is
    a single Dirichlet $L$-value
- table: HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[Residues of
    Dedekind zeta functions of cubic fields]
  relation: the same residue for degree three, with the same $D,k$ convention
    for non-isomorphic fields sharing a discriminant
- table: HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[Values of
    Dirichlet $L$-functions at positive integers]
  relation: for abelian quartic fields, the quotient $\zeta_K(s)/\zeta(s)$
    factors into Dirichlet $L$-functions

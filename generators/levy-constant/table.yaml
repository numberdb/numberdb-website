# The table document for Lévy's constant. Split out of T170, which was
# "Constants of the regular continued fraction" and held this constant,
# Lochs's constant and Khinchin's means together: a table answers a search by
# its title, and that title named none of the three.
Title: Lévy's constant
Definition: >-
  Let $p_n/q_n$ be the convergents of the regular continued fraction expansion
  of a real number $x$ CITE{MathWorldRegularCF}. For almost every $x$ the
  denominators grow at a rate that does not depend on $x$:
  $\lim_{n\to\infty}q_n^{1/n}=e^{\beta}$ with
  $\beta=\frac{\pi^2}{12\log 2}$ CITE{MathWorldLevy}. This table holds that
  limit in both of the normalisations in use: $e^\beta$, which is what is
  usually called Lévy's constant, and its logarithm $\beta$, which is called
  the Khinchin-Lévy constant.
Keywords:
  - Levy's constant
  - Levy constant
  - Khinchin-Levy constant
  - Khinchin-Levy
  - regular continued fraction
  - denominators of the convergents
Parameters:
  normalisation:
    type: Symbolic
    title: normalisation
    display: normalisation
    values:
      levy: '$e^\beta$'
      khinchin-levy: '$\beta$'
Comments:
  comment-names: >-
    Both rows are called a constant of Lévy in the literature, which is
    exactly why a database entry has to say which one it holds. The row
    $e^\beta$ is the limit of $q_n^{1/n}$ itself and is the one usually meant
    by "Lévy's constant" CITE{MathWorldLevy} CITE{OEISA086702}. The row
    $\beta$ is its logarithm, the almost-sure limit of $\frac{1}{n}\log q_n$,
    and is usually called the Khinchin-Lévy constant CITE{OEISA100199}. Lévy
    proved the limit in CITE{Levy1929}.
  comment-gauss-map: >-
    For the Gauss map $x\mapsto 1/x-\lfloor 1/x\rfloor$, which is what shifts
    a continued fraction expansion by one term CITE{WikiGaussMap}, the
    Lyapunov exponent with respect to the invariant Gauss measure is
    $2\beta=\frac{\pi^2}{6\log 2}$.
Formulas:
  formula-levy: >-
    $\beta=\frac{\pi^2}{12\log 2}$ and
    $e^\beta=\exp\left(\frac{\pi^2}{12\log 2}\right)$, where $e$ is
    HREF{E}[$e$] and $\pi$ is HREF{Pi}[$\pi$].
Programs:
  program-sage:
    language: Sage
    code: |-
      R = RealBallField(400)
      beta = R.pi()^2 / (12 * R(2).log())
      beta                                          # the Khinchin-Levy constant
      beta.exp()                                    # Levy's constant
Similar tables:
  - table: HREF{Khinchin's_means}[Khinchin's means $K_p$]
    relation: the other almost-sure limit of the regular continued fraction, taken over the partial quotients rather than over the denominators of the convergents
  - table: HREF{Lochs's_constant}[Lochs's constant]
    relation: equals $\frac{\log 10}{2\beta}$, so it is this constant read as a rate of conversion between decimal digits and partial quotients
  - table: HREF{Pi}[$\pi$]
    relation: appears in the closed form CITE{formula-levy}
  - table: HREF{E}[$e$]
    relation: the base of $e^\beta$

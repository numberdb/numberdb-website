References:
  Levy1929:
    bib: >-
      P. Lévy, Sur les lois de probabilité dont dépendent les quotients
      complets et incomplets d'une fraction continue, Bulletin de la Société
      Mathématique de France 57 (1929), 178-194.
    doi: 10.24033/bsmf.1150
Tags:
  - number theory
  - continued fractions
  - dynamical systems
  - special values
Data properties:
  type: R
  rigour: proven
  complete: 'yes'
  complete-note: >-
    it holds the constant in both normalisations in use, $e^\beta$ and $\beta$
  rigour details: >-
    Both rows follow from CITE{formula-levy} and were computed in real ball
    arithmetic, with $\pi$ and $\log 2$ taken as balls rather than as rounded
    constants, so every stored digit is covered by the enclosure. Nothing here
    is a limit that had to be estimated: the closed form is a theorem, and
    what the computation has to be careful about is only the arithmetic.

    The stored values were compared with the decimal expansions in OEIS
    A086702 and A100199 CITE{OEISA086702} CITE{OEISA100199}, and
    $\log(e^\beta)=\beta$ was checked on them.
Display properties:
  number-header: value

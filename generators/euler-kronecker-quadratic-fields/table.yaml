Title: Euler-Kronecker constants of quadratic fields
Definition: >-
  For a quadratic field $K=\mathbb{Q}(\sqrt{D})$ of fundamental discriminant
  $D\ne1$, write the Laurent expansion of its Dedekind zeta function
  CITE{WikiDedekind} at $s=1$ as
  $\zeta_K(s)=c_{-1}(s-1)^{-1}+c_0+O(s-1)$. Listed is Ihara's Euler-Kronecker
  constant $\gamma_K=c_0/c_{-1}$ CITE{Ihara2006}.
Keywords:
  - Euler-Kronecker constant
  - Ihara constant
  - quadratic field
  - Dedekind zeta logarithmic derivative
Parameters:
  D:
    type: Z
    title: fundamental discriminant
    display: $D$
    constraints: $D\ne1$
Comments:
  comment-euler-constant: >-
    $\gamma=\gamma_{\mathbb{Q}}$ is Euler's constant, the Stieltjes constant
    HREF{Stieltjes_constants#0}[$\gamma_0$].
  comment-quadratic-character: >-
    For a quadratic field, the associated quadratic Dirichlet character is
    $\chi_D(n)=\left(\frac{D}{n}\right)$, the Kronecker symbol
    CITE{WikiKronecker}.
Formulas:
  formula-quadratic-l: >-
    $\zeta_K(s)=\zeta(s)L(s,\chi_D)$, and therefore
    $\gamma_K=\gamma+L'(1,\chi_D)/L(1,\chi_D)$.
  formula-laurent: >-
    $\zeta_K'(s)/\zeta_K(s)=-1/(s-1)+\gamma_K+O(s-1)$ at $s=1$.
  formula-imaginary: >-
    For $D<0$:
    $\gamma_K=2\gamma+\log(2\pi)+
    \dfrac{|D|\sum_{a=1}^{|D|-1}\chi_D(a)\log\Gamma(a/|D|)}
    {\sum_{a=1}^{|D|-1}a\chi_D(a)}$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      \p 120
      D = -4;
      L = lfuncreate(D);
      Euler + lfun(L, 1, 1) / lfun(L, 1)
Similar tables:
  - table: HREF{Residues_of_Dedekind_zeta_functions_of_quadratic_fields}[Residues of Dedekind zeta functions of quadratic fields]
    relation: lists $\kappa_D=c_{-1}=L(1,\chi_D)$, the denominator in CITE{formula-quadratic-l}, for the same 607 fields
  - table: HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[Values of Dirichlet L-functions at positive integers]
    relation: holds $L(1,\chi_D)$ for $|D|\leq30$, with $\chi_D$ under its Conrey label $(|D|,n)$ rather than under $D$
  - table: HREF{Stieltjes_constants}[Stieltjes constants]
    relation: holds $\gamma_{\mathbb{Q}}=\gamma_0$ as its row HREF{Stieltjes_constants#0}[$\gamma_0$]
  - table: HREF{Laurent_coefficients_of_logarithmic_derivative_of_Riemann_zeta_function_at_1}[Laurent series coefficients of the logarithmic derivative of the Riemann zeta function at 1]
    relation: its row HREF{Laurent_coefficients_of_logarithmic_derivative_of_Riemann_zeta_function_at_1#eta_n,0}[$\eta_0$] is $-\gamma=-\gamma_{\mathbb{Q}}$ in the analogous logarithmic-derivative expansion for $\mathbb{Q}$
  - table: HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[Residues of Dedekind zeta functions of cubic fields]
    relation: lists the same Laurent coefficient $c_{-1}$ for cubic fields

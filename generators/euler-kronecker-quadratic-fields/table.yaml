Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value is computed in arb ball arithmetic from
    $\gamma+L'(1,\chi_D)/L(1,\chi_D)$, using the exact Kronecker character
    $\chi_D$ and the Hurwitz-zeta expansion of the associated Dirichlet
    $L$-function at $s=1$. The computation was compared with PARI's
    `lfuncreate(D)`, `lfun(L, 1, 1)` and `lfun(L, 1)` at
    $D=-4,-3,5,12,-995,997$; with the closed form in
    CITE{formula-imaginary} for every $D<0$; and with
    $L(1,\chi_D)=\kappa_D$ in
    HREF{Residues_of_Dedekind_zeta_functions_of_quadratic_fields}[Residues of
    Dedekind zeta functions of quadratic fields] for all 607 discriminants.
  complete: 'no'
  complete-note: >-
    it holds the same 607 fields as
    HREF{Residues_of_Dedekind_zeta_functions_of_quadratic_fields}[Residues of
    Dedekind zeta functions of quadratic fields], 305 imaginary and 302 real
Display properties:
  number-header: $\gamma_K$

References:
  Ihara2006:
    bib: >-
      Yasutaka Ihara, On the Euler-Kronecker constants of global fields and
      primes with small norms, in Algebraic Geometry and Number Theory,
      Progress in Mathematics 253, Birkhauser Boston, 2006, 407-451.
    doi: 10.1007/978-0-8176-4532-8_5
Tags:
  - number theory
  - L-function
  - special values
Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value is computed in arb ball arithmetic from
    $\gamma+L'(1,\chi_D)/L(1,\chi_D)$, using the exact Kronecker character
    $\chi_D$ and the Hurwitz-zeta expansion of the associated Dirichlet
    $L$-function at $s=1$. The computation is compared with PARI's
    `lfuncreate(D)`, `lfun(L, 1, 1)` and `lfun(L, 1)` at selected
    discriminants, with the closed form for $D=-4$, and with the relation to
    the stored residues in
    HREF{Residues_of_Dedekind_zeta_functions_of_quadratic_fields}[the
    quadratic Dedekind zeta residue table].
  complete: 'no'
  complete-note: >-
    it holds every fundamental discriminant with $|D|\leq1000$, matching the
    range of the quadratic Dedekind zeta residue table
Display properties:
  number-header: $\gamma_K$

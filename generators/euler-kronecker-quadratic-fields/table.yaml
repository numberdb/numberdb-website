Title: Euler-Kronecker constants of quadratic fields
Definition: >-
  For a quadratic field $K=\mathbb{Q}(\sqrt{D})$ of fundamental discriminant
  $D\ne1$, write the Laurent expansion of its Dedekind zeta function at
  $s=1$ as $\zeta_K(s)=c_{-1}(s-1)^{-1}+c_0+O(s-1)$. Listed is Ihara's
  Euler-Kronecker constant $\gamma_K=c_0/c_{-1}$ CITE{Ihara2006}.
Keywords:
  - Euler-Kronecker constant
  - Ihara constant
  - quadratic field
  - Dedekind zeta logarithmic derivative
Parameters:
  D:
    type: Z
    title: fundamental discriminant
    display: $D$
    constraints: $D$ is a fundamental discriminant and $D\ne1$
Comments:
  comment-log-derivative: >-
    Equivalently, $\gamma_K$ is the constant term in
    $\zeta_K'(s)/\zeta_K(s)+1/(s-1)$ at $s=1$.
  comment-quadratic-character: >-
    For a quadratic field, the associated quadratic Dirichlet character is
    $\chi_D(n)=\left(\frac{D}{n}\right)$, the Kronecker symbol.
Formulas:
  formula-quadratic-l: >-
    $\zeta_{\mathbb{Q}(\sqrt{D})}(s)=\zeta(s)L(s,\chi_D)$, and therefore
    $\gamma_{\mathbb{Q}(\sqrt{D})}=\gamma+
    L'(1,\chi_D)/L(1,\chi_D)$.
  formula-laurent: >-
    $\zeta_K'(s)/\zeta_K(s)=-1/(s-1)+\gamma_K+O(s-1)$ at $s=1$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      \p 120
      D = -4;
      L = lfuncreate(D);
      Euler + lfun(L, 1, 1) / lfun(L, 1)

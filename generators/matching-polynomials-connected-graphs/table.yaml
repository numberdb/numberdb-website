Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds $\mu(G,x)$ for every connected graph $G$ on at most seven vertices
  rigour details: >-
    The generator enumerates connected simple graphs with $1\leq |V(G)|\leq7$
    using Sage, takes each graph's `canonical_label(algorithm='sage')`, and
    stores the canonical graph6 string. It counts matchings by exact
    enumeration of edge subsets and forms $\mu(G,x)$ over $\mathbb{Z}[x]$.


    The 996 graph6 strings are exactly the keys of
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomial
    table] and HREF{Tutte_polynomials_of_connected_graphs}[the Tutte
    polynomial table]. Sage's `matching_polynomial()` agreed on every row.
    The count of equal-polynomial classes in comment
    CITE{comment-shared-values} was computed from the same exact rows. Formula
    CITE{formula-generating-form} agreed against the stored
    matching-generating rows before the split; formula CITE{formula-complete}
    agreed for $K_1,\ldots,K_7$; formula
    CITE{formula-complete-bipartite} agreed for $K_{1,1}$, $K_{2,2}$, and
    $K_{3,3}$; formula CITE{formula-paths-cycles} agreed for every path and
    cycle in range; and, on the connected graphs stored here,
    $\mu(G,x)=\det(xI-A(G))$ agreed exactly for the 25 trees.
Display properties:
  number-header: $\mu(G,x)$

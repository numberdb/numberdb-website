Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the signed and generating forms for every connected graph on at
    most seven vertices
  Size exception: >-
    The table stores both standard one-variable matching-polynomial
    conventions for the same 996 graphs. For a graph with $n$ vertices, the
    two forms determine each other by formula CITE{formula-forms}, but a reader
    holding one form would not naturally search for the other through that
    substitution.
  rigour details: >-
    The generator enumerates connected simple graphs with $1\leq |V(G)|\leq7$
    using Sage, takes each graph's `canonical_label(algorithm='sage')`, and
    stores the canonical graph6 string. It counts matchings by exact
    enumeration of edge subsets and forms both polynomials over
    $\mathbb{Z}[x]$.


    The 996 graph6 strings are exactly the keys of
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomial
    table] and HREF{Tutte_polynomials_of_connected_graphs}[the Tutte
    polynomial table]. Sage's `matching_polynomial()` agreed with the signed
    form on every row. The counts of equal-polynomial classes in comment
    CITE{comment-shared-values} were computed from the same exact rows. Formula
    CITE{formula-forms} agreed on every row;
    formula CITE{formula-complete} agreed for $K_1,\ldots,K_7$; formula
    CITE{formula-complete-bipartite} agreed for $K_{1,1}$, $K_{2,2}$, and
    $K_{3,3}$; formula CITE{formula-paths-cycles} agreed for every path and
    cycle in range; formula CITE{formula-line-graph} agreed on the 109 graphs
    whose line graph is connected and has at most seven vertices; and, on the
    connected graphs stored here, $\mu(G,x)=\det(xI-A(G))$ agreed exactly for
    the 25 trees.
Display properties:
  number-header: polynomial
  group parameters: [['g'], ['form']]

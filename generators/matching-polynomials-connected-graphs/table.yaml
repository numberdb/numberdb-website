# Draft document for signed matching polynomial table T239.
# Publishing is a person's act.
Title: Signed matching polynomials of connected graphs
Definition: >-
  For a connected simple graph $G$ with $n$ vertices, let $m_k(G)$ be the
  number of matchings with $k$ edges and let $m_0(G)=1$. Listed is the signed
  matching polynomial $\mu(G,x)=\sum_{k\geq0}(-1)^k m_k(G)x^{n-2k}$
  CITE{WikiMatching} CITE{MathWorldMatching}.
Keywords:
  - matching polynomial
  - acyclic polynomial
  - reference polynomial
  - matching defect polynomial
  - monomer-dimer
Parameters:
  g:
    type: Symbolic
    title: graph
    constraints: a connected simple graph, named by its canonical graph6 string
    display: $G$
Comments:
  comment-graph6: >-
    Graphs are named by their graph6 string CITE{Graph6}, McKay's compact
    encoding, taken after a canonical relabelling so that the name depends on
    the graph and not on how its vertices happen to be numbered. Recover the
    graph in Sage with `Graph(name)`, and produce the name used here with
    `g.canonical_label(algorithm='sage').graph6_string()`. The same names index
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomials]
    and HREF{Tutte_polynomials_of_connected_graphs}[the Tutte polynomials].
  comment-other-names: >-
    $\mu(G,x)$ is also called the acyclic polynomial, the reference polynomial
    and the matching defect polynomial CITE{MathWorldMatching}.
  comment-forest: >-
    For the connected graphs stored here, the signed matching polynomial
    equals
    HREF{Characteristic_polynomials_of_connected_graphs}[the characteristic
    polynomial] $\det(xI-A(G))$ of the adjacency matrix exactly when $G$ is a
    tree.
  comment-shared-values: >-
    The 996 graphs here have 434 distinct signed matching polynomials. The
    largest class of connected graphs with the same signed matching polynomial
    has 13 graphs.
  comment-roots: >-
    Heilmann and Lieb proved that the zeros of the signed matching polynomial
    are real CITE{HeilmannLieb}.
Formulas:
  formula-generating-form: >-
    If $G$ has $n$ vertices and $M(G,x)$ is the matching-generating polynomial,
    then $\mu(G,x)=x^nM(G,-x^{-2})$.
  formula-complete: >-
    $\mu(K_n,x)=He_n(x)$, where $He_n$ is the
    HREF{Hermite_polynomials_He}[probabilists' Hermite polynomial].
  formula-complete-bipartite: >-
    $\mu(K_{n,n},x)=(-1)^n n! L_n(x^2)$, where $L_n$ is the
    HREF{Laguerre_polynomials}[Laguerre polynomial] normalised by $L_n(0)=1$.
  formula-paths-cycles: >-
    $\mu(P_n,x)=U_n(x/2)$ and $\mu(C_n,x)=2T_n(x/2)$, where
    $U_n$ and $T_n$ are HREF{Chebyshev_polynomials_of_the_second_kind}[the
    Chebyshev polynomials of the second kind] and
    HREF{Chebyshev_polynomials_of_the_first_kind}[the Chebyshev polynomials of
    the first kind].
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.graphs.graph import Graph

      G = Graph('EIe_')             # C_6, by its name here
      G.matching_polynomial()       # x^6 - 6*x^4 + 9*x^2 - 2
Similar tables:
  - table: HREF{T248}[Matching-generating polynomials of connected graphs]
    relation: >-
      uses the same graph names and stores $M(G,x)=\sum_k m_k(G)x^k$; for a
      graph with $n$ vertices, $\mu(G,x)=x^nM(G,-x^{-2})$, so the two tables
      encode the same matching counts in different one-variable polynomials.
      The generating table is the likely target for a reader holding matching
      counts or a Hosoya-index computation; this table is the signed convention
      used for roots and characteristic-polynomial identities.
  - table: HREF{Characteristic_polynomials_of_connected_graphs}[Characteristic polynomials of connected graphs]
    relation: holds $\det(xI-A(G))$ for the same graphs under the same names; on the graphs stored here it equals $\mu(G,x)$ exactly for trees
  - table: HREF{Chromatic_polynomials_of_connected_graphs}[Chromatic polynomials of connected graphs]
    relation: uses the same canonical graph6 index for connected graphs on at most seven vertices
  - table: HREF{Tutte_polynomials_of_connected_graphs}[Tutte polynomials of connected graphs]
    relation: uses the same canonical graph6 index for connected graphs on at most seven vertices, but the matching polynomial is not determined by the Tutte polynomial
  - table: HREF{Entropy_constants_of_lattice_models}[Entropy constants of lattice models]
    relation: the dimer model counts perfect matchings of lattice regions; for a graph $G$ with an even number $n$ of vertices, $|\mu(G,0)|=m_{n/2}(G)$ counts perfect matchings
  - table: HREF{Hermite_polynomials_He}[Hermite polynomials in probabilist's convention]
    relation: gives the complete-graph cases in formula CITE{formula-complete}
  - table: HREF{Laguerre_polynomials}[Laguerre polynomials]
    relation: gives the complete-bipartite cases in formula CITE{formula-complete-bipartite}
  - table: HREF{Chebyshev_polynomials_of_the_second_kind}[Chebyshev polynomials of the second kind]
    relation: gives the path cases in formula CITE{formula-paths-cycles}
  - table: HREF{Chebyshev_polynomials_of_the_first_kind}[Chebyshev polynomials of the first kind]
    relation: gives the cycle cases in formula CITE{formula-paths-cycles}

Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every reduced residue class modulo $q$ with $3\leq q\leq 30$, for
    the three constants $M(q,a)$, $B(q,a)$ and $C(q,a)$
  rigour details: >-
    Values were computed from the accelerated formulas of CITE{LZ2010} and
    CITE{LZ2009}, with cutoff $X=9600$ and both truncation parameters set to
    $26$. The computation used arb ball arithmetic for the Dirichlet
    $L$-values and logarithms, but the truncation bounds from the papers were
    not carried as intervals in the returned values, so the table is not marked
    proven. The table gives $95$ significant digits. Every value agrees to all
    of them with the corresponding entry of Languasco and Zaccagnini's
    published $100$-decimal-place matrices CITE{LZData}, and the identities
    CITE{formula-relation}, CITE{formula-sum-M}, CITE{formula-sum-B},
    CITE{formula-product-C} and CITE{formula-subdivision-M} hold over the whole
    computed range.
Display properties:
  number-header: $X(q,a)$

  - table: HREF{Meissel-Mertens_constant}[Meissel-Mertens constant]
    relation: the reciprocal-prime sum constant $M(q,a)$ is the Meissel-Mertens constant when $q=1$
  - table: HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[Values of Dirichlet L-functions at positive integers]
    relation: the formulas of CITE{LZ2010} and CITE{LZ2009} express $M(q,a)$, $B(q,a)$ and $C(q,a)$ through $L(1,\chi)$ and $L(n,\chi)$ for Dirichlet characters modulo $q$
  - table: HREF{Values_of_the_prime_zeta_function_at_rational_numbers}[Values of the prime zeta function at rational numbers]
    relation: the formulas of CITE{LZ2010} and CITE{LZ2009} express the principal-character terms through prime zeta values
  - table: HREF{Residues_of_Dedekind_zeta_functions_of_quadratic_fields}[Residues of Dedekind zeta functions of quadratic fields]
    relation: for a real quadratic character $\chi_D$, the $L(1,\chi_D)$ factor in the formulas of CITE{LZ2010} and CITE{LZ2009} is the residue at $s=1$ of the Dedekind zeta function of $\mathbb Q(\sqrt D)$
  - table: HREF{Regulators_of_real_quadratic_fields}[Regulators of real quadratic fields]
    relation: for a real quadratic character $\chi_D$, the class-number formula expresses $L(1,\chi_D)$ using the regulator of $\mathbb Q(\sqrt D)$

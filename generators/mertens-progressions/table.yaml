# The table document for Mertens constants of primes in arithmetic
# progressions, proposal 4 of agents/table-ideas/BATCH-2026-09-07T0207.md.
# It was created as draft T164 through the API (X-Draft: yes) and is filled by
# generate.py beside it; publishing is a person's act on the site.
Title: Mertens constants of primes in arithmetic progressions
Definition: >-
  For integers $q\geq 3$ and $a$ with $\gcd(a,q)=1$, this table stores the
  constants $M(q,a)$, $B(q,a)$ and $C(q,a)$ CITE{LZ2010} CITE{LZ2009}
  attached to primes $p\equiv a\pmod q$ by CITE{formula-definitions}.
Parameters:
  q:
    type: Z
    title: modulus
    display: $q$
    constraints: $q\geq 3$
  a:
    type: Z
    title: reduced residue class modulo $q$
    display: $a$
    constraints: $1\leq a\leq q$ and $\gcd(a,q)=1$
  constant:
    type: Symbolic
    title: constant
    display: $X$
    constraints: $X$ is $M$, $B$ or $C$
Comments:
  comment-normalization: >-
    The product constant $C(q,a)$ is normalized by
    $\prod_{p\leq x,\ p\equiv a\pmod q}(1-1/p)\sim
    C(q,a)(\log x)^{-1/\varphi(q)}$. With this convention
    $M(q,a)=B(q,a)-\log C(q,a)$.
  comment-range: >-
    The table holds all three constants for every reduced residue class modulo
    $q$ with $3\leq q\leq 30$. The cases $q=1$ and $q=2$ are omitted: $M(1,1)$
    is HREF{Meissel-Mertens_constant}[the Meissel-Mertens constant], and
    $M(2,1)=M(1,1)-1/2$.
  comment-source: >-
    Languasco and Zaccagnini computed the constants for $3\leq q\leq 100$ to
    at least $100$ decimal digits CITE{LZ2010}; their computation page
    CITE{LZData} gives the matrices used as an external check for these rows.
Formulas:
  formula-definitions: >-
    $\sum_{\substack{p\leq x\\p\equiv a\pmod q}}\frac1p
    =\frac{\log\log x}{\varphi(q)}+M(q,a)+o(1)$,
    $B(q,a)=\sum_{p\equiv a\pmod q}\left(\log(1-\frac1p)+\frac1p\right)$, and
    $\prod_{\substack{p\leq x\\p\equiv a\pmod q}}\left(1-\frac1p\right)\sim
    C(q,a)(\log x)^{-1/\varphi(q)}$.
  formula-relation: >-
    $M(q,a)=B(q,a)-\log C(q,a)$ CITE{LZ2010}.
  formula-sum-M: >-
    $\sum_{\substack{1\leq a\leq q\\\gcd(a,q)=1}}M(q,a)
    =M-\sum_{p\mid q}1/p$, where $M$ is
    HREF{Meissel-Mertens_constant}[the Meissel-Mertens constant] CITE{LZ2010}.
  formula-sum-B: >-
    $\sum_{\substack{1\leq a\leq q\\\gcd(a,q)=1}}B(q,a)
    =M-\gamma-\sum_{p\mid q}\left(\log(1-1/p)+1/p\right)$ CITE{LZ2010}.
  formula-product-C: >-
    $\prod_{\substack{1\leq a\leq q\\\gcd(a,q)=1}}C(q,a)
    =e^{-\gamma}q/\varphi(q)$ CITE{LZ2009}.
  formula-subdivision-M: >-
    If $q_1\mid q_2$, $\gcd(a,q_1)=1$ and $n=q_2/q_1$, then
    $M(q_1,a)=\sum_{\substack{0\leq j<n\\\gcd(a+jq_1,q_2)=1}}
    M(q_2,a+jq_1)+\sum_{\substack{p\mid q_2\\p\equiv a\pmod {q_1}}}1/p$
    CITE{LZ2010}.
Programs:
  program-sage:
    language: Sage
    code: |-
      from generate import MertensProgressionConstants
      g = MertensProgressionConstants()
      g.value({'q': 5, 'a': 1, 'constant': 'C'}, 95)    # 1.2252384385...

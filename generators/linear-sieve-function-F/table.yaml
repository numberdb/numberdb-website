Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds $F(s)$ for every $s$ of two decimal places with $1\leq
    s\leq10$
  rigour details: Each value was computed in Sage real ball arithmetic by solving
    the coupled delay equations for $F$ and $f$ on successive unit intervals. On
    each interval the functions are represented by Taylor series with ball coefficients
    and an explicit geometric tail bound for the truncated product by $1/s$. The
    entries were checked against the closed form in CITE{formula-initial}, the delay
    equations in CITE{formula-delay}, the Buchstab relation in CITE{formula-buchstab},
    and the formula for $f(s)$ on $2\leq s\leq4$ stated with CITE{CambridgeLinearSieve}.
Display properties:

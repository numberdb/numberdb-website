Title: Values of the linear sieve function $F(s)$
Definition: The upper linear sieve function $F$ is the upper function in the dimension-one
  linear sieve normalisation of Halberstam-Richert and Iwaniec CITE{CambridgeLinearSieve}.
  This table gives $F(s)$ at rational sifting ratios $s$.
Keywords:
- upper linear sieve function
- linear sieve F
- Rosser-Iwaniec sieve
- Jurkat-Richert sieve
Parameters:
  s:
    type: Q
    title: sifting ratio
    display: $s$
    constraints: $s>0$
Comments:
  comment-normalisation: The table uses the normalisation for which $F(s)\to1$
    as $s\to\infty$. In the sieve, $s$ is the ratio $\log D/\log z$ between the
    level $D$ and the sifting bound $z$.
  comment-lower-range: The entries start at $s=1.00$. For $0<s<1$ the linear
    sieve gives no sharper upper bound than the endpoint value $F(1)$, and the
    family convention keeps the stored rows to the range used as a sifting ratio.
Formulas:
  formula-initial: $F(s)=2e^\gamma/s$ for $0<s\leq3$ CITE{CambridgeLinearSieve}.
  formula-delay: The coupled delay equations are $(sF(s))'=f(s-1)$ for $s>3$
    and $(sf(s))'=F(s-1)$ for $s>2$ CITE{CambridgeLinearSieve}.
  formula-buchstab: $F(s)+f(s)=2e^\gamma\omega(s)$, where $\omega$ is the Buchstab
    function CITE{TaoLinearSieve}.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.rational_field import QQ


      # The attached generate.py evaluates F(s) by the linear-sieve

      # delay equations and can be run with sage -python generate.py.

      from generate import LinearSieveF


      LinearSieveF().value({"s": str(QQ(4))}, 100)'

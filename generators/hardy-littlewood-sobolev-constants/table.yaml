    doi: 10.2307/1970935
    mr: '0717827'
    zbl: '0527.42011'
  FrankLieb:
    bib: Rupert L. Frank and Elliott H. Lieb, A new, rearrangement-free proof of the sharp Hardy-Littlewood-Sobolev inequality, Spectral Theory, Function Spaces and Inequalities, Oper. Theory Adv. Appl. 219, Birkhauser/Springer Basel AG, Basel, 2012, 55-67.
    arxiv: '1010.5821'
Tags:
  - functional analysis
  - inequality
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every dimension $n\leq20$ and every exponent of denominator at
    most $4$ in the admissible range
  Size exception: >-
    The family uses the complete rectangle $n\leq20$ and denominator at most
    $4$. This gives 1240 short entries, only forty above the soft entry limit;
    the longest written value is 166 characters and the entries block is about
    262 KB, below the soft block limit.
  rigour details: >-
    Each value is computed from CITE{formula-constant} in Sage's real ball
    field, using exact rational parameters and 160 guard bits beyond the 100
    digits written.

    Before the entries were written, `agents/table-build/dry_run.py` computed
    all 1240 entries, checked that every value carried its own enclosure, and
    measured the longest written value as 166 characters. The rows with
    $\lambda=n-2$ were checked against HREF{Best_Sobolev_constant_in_W1pRn}[the
    Sobolev constant table] by the duality relation
    $C_{n,n-2}=1/(A_nS_{n,2}^2)$, where
    $A_n=2^{-2}\pi^{-n/2}\Gamma((n-2)/2)$ is the Green kernel constant for
    $(-\Delta)^{-1}$ in the Fourier convention of CITE{FrankLieb}.
Display properties:
  number-header: $C_{n,\lambda}$

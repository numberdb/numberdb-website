Title: Sharp constants in the Hardy-Littlewood-Sobolev inequality
Definition: >-
  Let $0<\lambda<n$, let $p=2n/(2n-\lambda)$, and let $f,g\in
  L^p(\mathbb{R}^n)$. This table gives the sharp constant
  $C_{n,\lambda}$ in the diagonal Hardy-Littlewood-Sobolev inequality
  CITE{Lieb1983}
  $|\iint_{\mathbb{R}^n\times\mathbb{R}^n}\overline{f(x)}g(y)
  |x-y|^{-\lambda}\,dx\,dy|\leq C_{n,\lambda}\|f\|_p\|g\|_p$.
Keywords:
  - Hardy-Littlewood-Sobolev inequality
  - Hardy–Littlewood–Sobolev inequality
  - HLS inequality
  - sharp HLS constant
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: $n\geq1$
  lambda:
    type: Q
    title: singular exponent
    display: $\lambda$
    constraints: $0<\lambda<n$
Comments:
  comment-diagonal: >-
    This is the diagonal case $p=q=2n/(2n-\lambda)$. The table stores the
    upper-bound constant in the direction displayed in the definition.
Formulas:
  formula-constant: >-
    $C_{n,\lambda}=\pi^{\lambda/2}
    \frac{\Gamma((n-\lambda)/2)}{\Gamma(n-\lambda/2)}
    \left(\frac{\Gamma(n)}{\Gamma(n/2)}\right)^{1-\lambda/n}$ CITE{FrankLieb}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      n = 3
      lam = QQ(3) / QQ(2)
      R = RealBallField(numberdb.bits(100, losing=160))
      C = (R.pi() ** (R(lam) / 2)
           * R((QQ(n) - lam) / 2).gamma()
           / R(QQ(n) - lam / 2).gamma()
           * (R(QQ(n)).gamma() / R(QQ(n) / 2).gamma()) ** (1 - R(lam) / n))
Similar tables:
  - table: HREF{Best_Sobolev_constant_in_W1pRn}[Best Sobolev constant for $W^{1,p}(\mathbb{R}^n)$]
    relation: the $p=2$ Sobolev rows are dual to the $\lambda=n-2$ Hardy-Littlewood-Sobolev rows, with the reciprocal inequality direction

# The table document for T188, Values of the exponential integral. It began as proposal 5 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which put seven
# functions in one table; they are six tables now, one per named
# function, and the relations between them are in `Similar tables`.
Title: Values of the exponential integral
Definition: For $x>0$ the exponential integral is the principal value $\operatorname{Ei}(x)=\operatorname{PV}\!\int_{-\infty}^x
  e^t\,\mathrm{d}t/t$, and $E_1(x)=\int_x^{\infty} e^{-t}\,\mathrm{d}t/t$ CITE{DLMFIntegralDefinitions}.
  The two are one function in two normalisations, $E_1(x)=-\operatorname{Ei}(-x)$,
  and this table holds both at rational $x>0$.
Keywords:
- exponential integral
- Ei
- E1
- Theis well function
- Ei(1)
- generalized exponential integral
Parameters:
  normalisation:
    type: Symbolic
    title: normalisation
    display: normalisation
    values:
      Ei: $\operatorname{Ei}(x)$
      E1: $E_1(x)$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments:
  comment-e1: For positive real $x$, $E_1$ is the case $n=1$ of the generalized
    exponential integral $E_n(x)=\int_1^{\infty} e^{-xt}t^{-n}\,\mathrm{d}t$ CITE{DLMFGeneralizedExponential}.
Formulas:
  formula-ei-definition: For $x>0$, $\operatorname{Ei}(x)=-\operatorname{PV}\!\int_{-x}^{\infty}
    e^{-t}\,\mathrm{d}t/t=\operatorname{PV}\!\int_{-\infty}^x e^t\,\mathrm{d}t/t$
    and $\operatorname{Ei}(-x)=-\int_x^{\infty} e^{-t}\,\mathrm{d}t/t$ CITE{DLMFIntegralDefinitions}.
  formula-ei-series: For $x>0$, $\operatorname{Ei}(x)=\gamma+\log x+\sum_{k=1}^{\infty}x^k/(k\,k!)$,
    where $\gamma$ is HREF{Stieltjes_constants#0}[the Euler-Mascheroni constant]
    CITE{DLMFIntegralDefinitions}.
  formula-e1: For $x>0$, $E_1(x)=\int_x^{\infty} e^{-t}\,\mathrm{d}t/t=-\operatorname{Ei}(-x)$
    CITE{DLMFIntegralDefinitions}.
  formula-ei-shi-chi: For $x>0$, $\operatorname{Ei}(x)=\operatorname{Shi}(x)+\operatorname{Chi}(x)$
    CITE{DLMFIntegralDefinitions}.
Programs:
  program-sage:
    language: Sage
    code: "import numberdb.sage as numberdb\nfrom sage.rings.rational_field import\
      \ QQ\nfrom sage.rings.real_arb import RealBallField\n\nRBF = RealBallField(numberdb.bits(100,\
      \ losing=64))\nx = RBF(QQ(1))\nx.Ei()\n-RBF(-QQ(1)).Ei()\nRBF(QQ(2)).log_integral()\n\
      x.Si()\nx.Ci()\nx.Shi()\nx.Chi()\n      x.Ei()\n      -RBF(-QQ(1)).Ei()"
  program-python:
    language: Python
    code: "import mpmath\n\nmpmath.mp.dps = 100\nmpmath.ei(1)\nmpmath.e1(1)\n\
      mpmath.li(2)\nmpmath.si(1)\nmpmath.ci(1)\nmpmath.shi(1)\nmpmath.chi(1)\n\
      \      mpmath.ei(1)\n      mpmath.e1(1)"
Similar tables:
- table: HREF{Values_of_the_logarithmic_integral}[Values of the logarithmic integral
    $\operatorname{li}(x)$]
  relation: $\operatorname{li}(x)=\operatorname{Ei}(\log x)$, so that table is
    this one after a change of variable
- table: HREF{Values_of_the_hyperbolic_sine_integral}[Values of the hyperbolic
    sine integral $\operatorname{Shi}(x)$]
  relation: $\operatorname{Ei}(x)=\operatorname{Shi}(x)+\operatorname{Chi}(x)$
    CITE{formula-ei-shi-chi}
- table: HREF{Values_of_the_hyperbolic_cosine_integral}[Values of the hyperbolic
    cosine integral $\operatorname{Chi}(x)$]
  relation: the other half of $\operatorname{Ei}=\operatorname{Shi}+\operatorname{Chi}$
- table: HREF{Gibbs_constant}[Wilbraham-Gibbs constant]
  relation: stores $\operatorname{Si}(\pi)$ and its normalisations
- table: HREF{Stieltjes_constants}[Stieltjes constants]
  relation: contains $\gamma_0$, the Euler-Mascheroni constant appearing in $\operatorname{Ei}$,
    $\operatorname{Ci}$ and $\operatorname{Chi}$

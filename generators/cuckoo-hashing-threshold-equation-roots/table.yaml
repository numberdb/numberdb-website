Title: Roots of the cuckoo hashing threshold equation
Definition: >-
  Let $H_{n,\lfloor cn\rfloor,k}$ be the random $k$-uniform hypergraph
  CITE{WikiHypergraph} on $n$ vertices. For $k\geq2$ and $\ell\geq1$, the
  number $\xi_{k,\ell}$ is the nonnegative real auxiliary root used to write
  the $\ell$-orientability threshold for
  HREF{T274}[cuckoo hashing]: it satisfies
  $k\ell=\xi Q(\xi,\ell)/Q(\xi,\ell+1)$, where
  $Q(x,s)=\mathbb{P}(\mathrm{Po}(x)\geq s)$ CITE{FKP} CITE{DGMMPR}.
Keywords: orientability threshold, load threshold, multiple-choice hashing, balanced allocation
Parameters:
  k:
    type: Z
    title: number of choices
    display: $k$
    constraints: $k\geq2$
  ell:
    type: Z
    title: bucket capacity
    display: $\ell$
    constraints: $\ell\geq1$
Comments:
  comment-convention: >-
    The notation and indexing match
    HREF{T274}[the cuckoo hashing threshold table]: $\xi_{k,\ell}$ gives
    $c^*_{k,\ell}=\xi_{k,\ell}/(kQ(\xi_{k,\ell},\ell)^{k-1})$.
    Dietzfelbinger, Goerdt, Mitzenmacher, Montanari, Pagh and Rink tabulate
    the threshold values with an index larger by one: their row labelled
    $\ell+1$ is this table's bucket capacity $\ell$ CITE{DGMMPR}.
  comment-degenerate-row: >-
    The row $k=2$, $\ell=1$ stores $\xi_{2,1}=0$. At $x=0$ the quotient
    $xQ(x,1)/Q(x,2)$ has a removable singularity with limit $2$, and
    $x/(2Q(x,1))$ tends to the exact threshold $c^*_{2,1}=1/2$.
  comment-capacity-one: >-
    For $\ell=1$ and $k\geq3$, the equation is the same one used for the
    roots of the random $k$-XORSAT satisfiability threshold CITE{DGMMPR}.
Formulas:
  formula-tail: >-
    $Q(x,s)=\mathbb{P}(\mathrm{Po}(x)\geq s)
    =1-e^{-x}\sum_{j=0}^{s-1}x^j/j!$.
  formula-root: >-
    For $(k,\ell)\neq(2,1)$, $\xi_{k,\ell}$ is the positive solution of
    $k\ell=\xi_{k,\ell}Q(\xi_{k,\ell},\ell)/Q(\xi_{k,\ell},\ell+1)$; the
    value $\xi_{2,1}=0$ is taken by the removable extension at $x=0$.
  formula-threshold: >-
    $c^*_{k,\ell}=\xi_{k,\ell}/(kQ(\xi_{k,\ell},\ell)^{k-1})$ for
    $(k,\ell)\neq(2,1)$, with limiting value $c^*_{2,1}=1/2$
    CITE{FKP} CITE{DGMMPR}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      k, ell = 3, 1
      Q = lambda x, s: mp.gammainc(s, 0, x, regularized=True)
      if (k, ell) == (2, 1):
          print(mp.mpf(0))
      else:
          g = lambda x: x * Q(x, ell) / Q(x, ell + 1) - k * ell
          lo, hi = mp.mpf("1e-30"), mp.mpf(4 * (k + ell) + 10)
          while g(hi) <= 0:
              hi *= 2
          for _ in range(4 * mp.dps):
              mid = (lo + hi) / 2
              if g(mid) < 0:
                  lo = mid
              else:
                  hi = mid
          print((lo + hi) / 2)

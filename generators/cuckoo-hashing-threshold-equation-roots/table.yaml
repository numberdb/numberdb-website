Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{FKP}
    - CITE{DGMMPR}
    - CITE{CainSandersWormald}
  repeats: HREF{T287}
  complete: 'no'
  complete-note: >-
    it holds $\xi_{k,\ell}$ for every $2\leq k\leq7$ and $1\leq\ell\leq6$,
    matching the companion cuckoo-hashing threshold table
  rigour details: >-
    Each positive root is computed in ball arithmetic with 64 guard bits
    beyond the 100 digits written. The root $\xi_{k,\ell}$ is enclosed by
    bisection on the sign of $\xi Q(\xi,\ell)/Q(\xi,\ell+1)-k\ell$, down to
    a bracket of half-width $10^{-106}$ whose ends are checked to give
    opposite signs; that bracket is the stored ball. The entry
    $\xi_{2,1}=0$ is exact, from the removable limiting equation at $x=0$.
    The generator also compares every positive root with an mpmath computation
    at 120 digits that writes $Q$ as the regularised incomplete gamma function,
    compares the rows with $\ell=1$ and $k\geq3$ with HREF{T287}[the XORSAT
    root table], and compares every derived threshold with
    HREF{T274}[the cuckoo hashing threshold table].

Title: Growth rates of hyperbolic Coxeter triangle groups
Definition: >-
  Let $\Delta(p,q,r)$ be the Coxeter triangle group generated by the
  reflections in the sides of a hyperbolic triangle with angles
  $\pi/p$, $\pi/q$ and $\pi/r$, where
  $p,q,r\in\{2,3,\ldots\}\cup\{\infty\}$ and
  $1/p+1/q+1/r<1$ CITE{WikiTriangle}. Listed is the exponential growth
  rate $\tau$ of the growth series $W(t)=\sum_{n\geq0}a_n t^n$, where
  $a_n$ is the number of elements of reflection length $n$ in the standard
  Coxeter generators CITE{WikiGrowth}.
Keywords:
  - Coxeter triangle group
  - hyperbolic triangle group
  - Coxeter group growth rate
  - Lehmer number
  - Salem number
  - Pisot number
Parameters:
  diagram:
    type: Symbolic
    title: Coxeter diagram
    display: diagram
    constraints: a Coxeter diagram of a finite-area hyperbolic triangle reflection group
Comments:
  comment-addresses: >-
    Entry addresses are ASCII Coxeter bracket symbols. The address
    `[r,q]` denotes $\Delta(2,q,r)$, the address `[(p,q,r)]` denotes
    $\Delta(p,q,r)$ when all of $p,q,r$ are greater than $2$, and `inf`
    denotes $\infty$.
  comment-generators: >-
    The generating set is the three reflections in the sides of the
    triangle. The orientation-preserving von Dyck subgroup has index $2$,
    and its growth rate with respect to its own standard generators is a
    different convention.
Formulas:
  formula-steinberg: >-
    The growth series is computed from Steinberg's formula
    $1/W(t^{-1})=\sum_{T\subseteq S,\ W_T\text{ finite}}(-1)^{|T|}/W_T(t)$
    CITE{Steinberg}.
  formula-rate: >-
    The growth rate $\tau$ is the reciprocal of the radius of convergence
    of $W(t)$, equivalently the largest real pole of the reduced rational
    function $W(t)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<t> = QQ[]
      def qint(m):
          return sum(t^k for k in range(m))
      def growth_series(p, q, r):
          labels = [m for m in (p, q, r) if m is not None]
          f = 1 - 3/(1 + t) + sum(1/((1 + t)*qint(m)) for m in labels)
          return 1/f(t^-1)
      W = growth_series(2, 3, 7)
      W.denominator().reverse().roots(RealIntervalField(200))
Similar tables:
  - table: HREF{Viswanaths_constant}[Viswanath's constant]
    relation: another exponential growth rate, from random Fibonacci recurrences rather than Coxeter groups
Links:
  WikiTriangle:
    title: 'Wikipedia: Triangle group'
    url: https://en.wikipedia.org/wiki/Triangle_group
  WikiGrowth:
    title: 'Wikipedia: Growth rate (group theory)'
    url: https://en.wikipedia.org/wiki/Growth_rate_(group_theory)
References:
  Steinberg:
    bib: >-
      Robert Steinberg, Endomorphisms of linear algebraic groups, Memoirs of
      the American Mathematical Society 80, 1968.
Tags:
  - groups
  - dynamical systems
  - special values
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds the hyperbolic triangle groups with finite labels
    $2\leq p\leq q\leq r\leq12$, and those with $r=\infty$ and
    $2\leq p\leq q\leq12$ or $q=\infty$
  rigour details: >-
    The generator computes the rational growth series exactly from
    CITE{formula-steinberg}, takes the reciprocal of the reduced denominator,
    isolates the largest real root greater than $1$ in interval arithmetic,
    and writes $100$ digits. Before the draft was filled, the known
    polynomials for $\Delta(2,3,7)$, $\Delta(2,3,8)$ and
    $\Delta(2,3,\infty)$ were checked exactly, and the first growth-series
    coefficients of four control groups were compared with breadth-first
    counts in the exact Tits representation over cyclotomic fields.
Display properties:
  number-header: $\tau$

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every canonical tetrahedral class with all $j_i\leq 7/2$ whose
    value is not zero, other than the symbol with every $j_i=0$; this cutoff
    covers the small angular momenta through $7/2$ and gives 485 rows
  rigour details: |-
    The generator evaluates Racah's finite sum CITE{formula-racah} with exact rational arithmetic, using integer-scaled angular momenta so every factorial argument is checked before it is used. The exact result is a sign times the square root of a rational number, converted to an arb ball for the stored real value; rational results are written exactly.

    Before any entry is returned, the generator recomputes every row at all 24 tetrahedral images and requires the results to agree. It checks the zero-entry formula CITE{formula-zero} wherever that formula applies, and it checks every row against the finite sum of Wigner $3j$ symbols in CITE{formula-3j-sum}. All 485 stored rows were also compared with SageMath's exact `wigner_6j` function CITE{Sage}.
Display properties:
  number-header: $\begin{Bmatrix}j_1&j_2&j_3\\j_4&j_5&j_6\end{Bmatrix}$

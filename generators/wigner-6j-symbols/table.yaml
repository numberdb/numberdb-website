Tags:
  - special functions
  - physics
  - algebraic
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every nonzero canonical tetrahedral class with all $j_i\leq 7/2$,
    except the all-zero symbol
  rigour details: >-
    The generator evaluates Racah's finite sum with exact rational arithmetic,
    using integer-scaled angular momenta so every factorial argument is checked
    before it is used. The exact result is a sign times the square root of a
    rational number, converted to an arb ball for the stored real value;
    rational results are written exactly. The values are checked against
    Richard Mathar's exact `6jSymb` table, against the zero-entry formula
    CITE{formula-zero}, and against the finite sum of Wigner $3j$ symbols
    in CITE{formula-3j-sum}.
Display properties:
  number-header: $\begin{Bmatrix}j_1&j_2&j_3\\j_4&j_5&j_6\end{Bmatrix}$
Numbers: []

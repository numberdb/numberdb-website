Title: Momentum thickness $\delta_2$ of the Falkner-Skan wedge flows
Definition: >-
  For the upper-branch solution $f$ of the Falkner-Skan boundary-layer problem
  CITE{FalknerSkan} CITE{Wiki}, with wedge parameter $\beta=2m/(m+1)$, this
  table gives the dimensionless momentum thickness
  $\delta_2=\int_0^\infty f^{\prime}(\eta)(1-f^{\prime}(\eta))\,d\eta$ in two
  normalisations, related by CITE{formula-conversion}.
Keywords: Falkner Skan, boundary layer, momentum thickness, wedge flow
Parameters:
  beta:
    type: Q
    title: wedge parameter
    display: $\beta$
    constraints: $\beta_s<\beta<2$, where $\beta_s=-0.19883\ldots$ is the separation value
  branch:
    type: Symbolic
    title: solution branch
    display: branch
    constraints: one of `upper` and `lower`
    values:
      upper: upper branch
      lower: lower branch
  normalisation:
    type: Symbolic
    title: normalisation
    display: normalisation
    constraints: one of `wedge` and `hartree`
    values:
      wedge: wedge coordinate $\eta$
      hartree: Hartree coordinate $\eta_\beta$
Comments:
  comment-normalisations: >-
    Falkner and Skan's equation is commonly tabulated in Hartree's coordinate
    CITE{Hartree}. The wedge normalisation uses
    $\eta=y\sqrt{u_e/(\nu x)}$, and the Hartree normalisation uses
    $\eta_\beta=\eta/\sqrt{2-\beta}$. These are two conventions for the same
    thickness, and each value determines the other.
  comment-endpoint: >-
    The endpoint $\beta=2$ is not listed. It is a limiting favourable
    Falkner-Skan profile, but $m=\beta/(2-\beta)$ and the coordinate
    conversion between the wedge and Hartree normalisations are singular
    there, so it is outside the range where the two stored normalisations
    determine each other.
  comment-branch: >-
    For $\beta_s<\beta<0$ a second, reversed-flow solution is known. This
    draft lists the upper branch, the branch tabulated in the classical
    boundary-layer tables CITE{SchlichtingGersten}.
  comment-review: >-
    The review CITE{Review} surveys numerical methods for the Falkner-Skan
    boundary-value problem.
Formulas:
  formula-m: >-
    $m=\beta/(2-\beta)$ for $\beta<2$.
  formula-conversion: >-
    If $\delta_{2,\mathrm{w}}$ and $\delta_{2,\mathrm{H}}$ are the wedge and
    Hartree normalisations, then
    $\delta_{2,\mathrm{H}}=\delta_{2,\mathrm{w}}/\sqrt{2-\beta}$.
  formula-momentum: >-
    With $\delta_1$ the displacement thickness in the same normalisation, the
    Hartree form satisfies
    $f^{\prime\prime}(0)=\beta\delta_1+(1+\beta)\delta_2$.
Similar tables:
  - table: HREF{T415}[displacement thickness $\delta_1$ of the Falkner-Skan wedge flows]
    relation: the same upper-branch solutions and normalisations, storing the displacement thickness instead of the momentum thickness

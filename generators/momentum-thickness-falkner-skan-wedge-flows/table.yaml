Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  sources:
    - CITE{Hartree}
    - CITE{SchlichtingGersten}
  complete: 'no'
  complete-note: >-
    it holds both Hartree and wedge normalisations on the upper branch for
    every two-decimal value of $\beta$ from $-0.19$ through $1.33$; the lower
    branch and the profiles with $4/3<\beta<2$ are not included
  rigour details: >-
    Values are computed by shooting on $f''(0)$ in the Hartree equation and
    integrating the momentum-thickness quadrature along the same numerical
    solution. Each stored row is computed at two working precisions, and the
    stored digits are required to agree. The generator checks the Blasius row
    against Toepfer's scaling and checks Formula CITE{formula-momentum-integral}
    on every computed Hartree row.

      # Falkner-Skan boundary-value problem and checking paired DOP853
      # integrations.
Tags:
  - analysis
  - physics
Data properties:
  type: R
  complete: 'no'
  complete-note: >-
    it holds every two-decimal $\beta$ with $-0.19\leq\beta\leq1$ on the upper
    branch, in both the wedge and Hartree normalisations
  rigour: heuristic (agreement-checked)
  rigour details: >-
    The values are computed by shooting for the wall shear in the Hartree
    form and integrating the Falkner-Skan equation to a finite cutoff in the
    similarity variable. The generator compares two adaptive DOP853
    integrations with different tolerances and cutoffs, checks the
    momentum-integral identity on every row, and checks the Blasius row
    against Töpfer's scaling.

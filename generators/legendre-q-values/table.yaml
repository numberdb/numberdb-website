Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $Q_\nu(x)$ at every half-integer degree
    $\nu=0,\tfrac12,1,\ldots,15$, and at $\nu=\tfrac13$ and
    $\nu=\tfrac23$, for every rational $x=a/b>1$ in lowest terms with
    $b\leq4$ and $x\leq5$
  rigour details: >-
    Each value is computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=96)` bits from CITE{formula-hypergeometric}
    and returned as its real part after checking that the imaginary part
    contains zero. The entries were checked against mpmath's type 3 `legenq`
    at 150 decimal digits, against CITE{formula-recurrence}, against
    CITE{formula-initial-values}, and against CITE{formula-integer-degree}
    wherever those formulas apply. The widest returned ball had radius less
    than $3.1\cdot10^{-126}$ for 100 requested digits.
Display properties:
  number-header: $Q_\nu(x)$

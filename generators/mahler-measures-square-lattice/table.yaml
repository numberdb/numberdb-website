# through the API (X-Draft: yes) and is filled by generate.py beside it;
# publishing is a person's act on the site.
Title: Mahler measures of $x+x^{-1}+y+y^{-1}+k$
Definition: >-
  For a nonnegative integer $k$, $m_k$ is the logarithmic Mahler measure
  CITE{Wiki} of the Laurent polynomial $x+x^{-1}+y+y^{-1}+k$:
  $m_k=\int_0^1\int_0^1\log|k+2\cos(2\pi s)+2\cos(2\pi t)|\,ds\,dt$.
Parameters:
  k:
    type: Z
    title: parameter
    display: $k$
    constraints: $k\geq0$
Comments:
  comment-symmetry: >-
    Only nonnegative $k$ are listed. Replacing $x$ and $y$ by $-x$ and
    $-y$ gives $m_{-k}=m_k$.
  comment-family: >-
    Boyd used this family in his study of Mahler measures and special
    values of $L$-functions CITE{Boyd}. The case $k=1$ is the polynomial
    whose elliptic-curve $L$-value identity was proved by Rogers and
    Zudilin CITE{RogersZudilin}.
Formulas:
  formula-jensen: >-
    Jensen's formula in the variable $y$ gives
    $m_k=\frac{1}{2\pi}\int_0^{2\pi}
    \operatorname{arcosh}_+\left(|k+2\cos\theta|/2\right)\,d\theta$,
    where $\operatorname{arcosh}_+(u)=\operatorname{arcosh}(u)$ for
    $u>1$ and is $0$ for $0\leq u\leq1$.
  formula-large-k: >-
    For $k>4$,
    $m_k=\log k-\sum_{n=1}^{\infty}
    \binom{2n}{n}^2/(2n k^{2n})$ CITE{GuttmannRogers}.
  formula-four: >-
    $m_4=4G/\pi$, where $G$ is Catalan's constant CITE{GuttmannRogers};
    this is the
    HREF{Entropy_constants_of_lattice_models#spanning-tree,square,entropy}[square-lattice spanning-tree entropy].
Similar tables:
  - table: HREF{Entropy_constants_of_lattice_models}[Entropy constants of lattice models]
    relation: holds the same number $4G/\pi$ as the row $k=4$, as a square-lattice spanning-tree entropy

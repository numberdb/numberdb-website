Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds every integer $k$ with $0\leq k\leq100$
  rigour details: >-
    The generator computes $m_k$ in ball arithmetic. For $k=1,2,3$ it uses
    the one-dimensional integral from CITE{formula-jensen}, after the
    substitution $\sin(\theta/2)=\sqrt{k}\sin(t)/2$ removes the endpoint
    singularity. For $k=4$ it evaluates $4G/\pi$ using arb's Hurwitz zeta
    function for $G=L(2,\chi_{-4})$. For $k\geq5$ it sums the absolutely
    convergent series in CITE{formula-large-k}, with the remaining tail
    bounded by a geometric majorant.

    Before the draft was filled, every entry was checked against a
    computation not used for that row: a coefficient power series for
    $k=1,2,3$, the transformed Jensen integral for $k=4$, and direct arb
    integration of CITE{formula-jensen} for every $5\leq k\leq100$. The
    range $0\leq k\leq100$ measured 101 entries, a longest written value of
    146 characters at $k=4$, and a 17.9 KB entries block.
Display properties:

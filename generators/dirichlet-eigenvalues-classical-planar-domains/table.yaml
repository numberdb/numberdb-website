Programs:
  sage: >
    In SageMath, use `bessel_J(nu, x)` and root isolation for the Bessel
    zero formulas, and use the formulas above for the separable polygons.
Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: no
  complete-note: >
    it holds the first Dirichlet eigenvalue for each listed domain
  rigour details: >
    Closed-form rows are computed from the displayed formulas at two working
    precisions and compared. The L-shape value is transcribed from Jones's
    hundred-digit computation and checked against the first value reported by
    Trefethen and Betcke. The Gordon-Webb-Wolpert value is transcribed from
    Driscoll's twelve-digit table and stored for both isospectral drums. The
    regular-polygon rows are transcribed from Jones's area-$\pi$ values and
    rescaled to circumradius $1$.
Display properties:
  number-header: $\lambda_n(\Omega)$
  group parameters:
    - - domain
    - - n

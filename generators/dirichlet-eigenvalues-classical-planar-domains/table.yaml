Title: Dirichlet eigenvalues of the classical planar domains
Definition: >
  For a bounded planar domain $\Omega$, this table gives the Dirichlet
  eigenvalues $\lambda_n(\Omega)$ of $-\Delta u=\lambda u$ on $\Omega$
  with $u=0$ on $\partial\Omega$, listed in increasing order. The index
  $n$ starts at $1$ and repeats eigenvalues according to multiplicity.
Parameters:
  domain:
    type: Symbolic
    title: domain
    display: $\Omega$
    constraints: $\Omega$ is one of the listed classical planar domains.
    values:
      unit-square: unit square
      rectangle-1x2: $1\times2$ rectangle
      unit-disk: unit disk
      half-disk: half disk
      quarter-disk: quarter disk
      annulus-1-2: annulus of radii $1$ and $2$
      sector-60: circular sector of angle $\pi/3$
      equilateral-triangle: equilateral triangle
      right-isosceles-triangle: right-isosceles triangle
      hemiequilateral-triangle: hemiequilateral triangle
      l-shape: L-shaped membrane
      gww-drum-1: first Gordon-Webb-Wolpert drum
      gww-drum-2: second Gordon-Webb-Wolpert drum
      regular-pentagon: regular pentagon
      regular-hexagon: regular hexagon
      regular-heptagon: regular heptagon
      regular-octagon: regular octagon
  n:
    type: Z
    title: eigenvalue index
    display: $n$
    constraints: $n\geq1$
Comments:
  sign: >
    The sign convention is $-\Delta u=\lambda u$, so the Dirichlet
    eigenvalues are positive. The value stored is $\lambda_n(\Omega)$,
    not $\sqrt{\lambda_n(\Omega)}$.
  scale: >
    The domains are not rescaled. The unit square is $[0,1]^2$, the
    $1\times2$ rectangle is $[0,1]\times[0,2]$, the unit disk and the
    circular sectors have radius $1$, and the annulus is
    $\{(x,y):1<x^2+y^2<4\}$. The half disk is the sector of angle
    $\pi$, the quarter disk is the sector of angle $\pi/2$, and the
    60-degree sector has angle $\pi/3$.
  triangles: >
    The equilateral triangle has vertices $(0,0)$, $(1,0)$ and
    $(1/2,\sqrt3/2)$. The right-isosceles triangle has vertices
    $(0,0)$, $(1,0)$ and $(0,1)$. The hemiequilateral triangle is the
    half of the unit-side equilateral triangle with vertices $(0,0)$,
    $(1/2,0)$ and $(1/2,\sqrt3/2)$.
  polygons: >
    The regular polygons have circumradius $1$. Each is centered at the
    origin and has a vertex at $(1,0)$.
  l-shape: >
    The L-shape is $[-1,1]^2\setminus((0,1]\times[-1,0])$, the MATLAB
    logo domain CITE{MATLABLShape}, made from three unit squares.
  gww: >
    The Gordon-Webb-Wolpert drums are the two eight-sided polygons
    used in CITE{COMSOLGWW}. The first Gordon-Webb-Wolpert drum has
    vertices $(-3,-3)$, $(-3,-1)$, $(1,3)$, $(1,1)$, $(3,1)$,
    $(1,-1)$, $(-1,-1)$ and $(-1,-3)$. The second
    Gordon-Webb-Wolpert drum has vertices $(-3,1)$, $(1,1)$, $(1,3)$,
    $(3,1)$, $(1,-1)$, $(-1,-1)$, $(-1,-3)$ and $(-3,-1)$.
Formulas:
  square-rectangle: >
    For a rectangle $[0,a]\times[0,b]$, the Dirichlet eigenvalues are
    $\pi^2(j^2/a^2+k^2/b^2)$ with $j,k\geq1$.
  disk-sector: >
    For a disk or circular sector of radius $1$, separation of variables
    gives eigenvalues $j_{\nu,k}^2$, where $j_{\nu,k}$ is
    HREF{Zeros_of_Bessel_J_functions}[the $k$th positive zero of $J_\nu$].
    The unit disk uses $\nu=0,1,2,\ldots$, with multiplicity two for
    $\nu>0$; a sector of angle $\alpha$ uses $\nu=m\pi/\alpha$ for
    $m\geq1$.
  annulus: >
    The annulus entries are the squares of the positive roots of
    $J_m(\kappa)Y_m(2\kappa)-J_m(2\kappa)Y_m(\kappa)=0$, with
    $\kappa>0$, $m=0,1,2,\ldots$ and multiplicity two for $m>0$.
  equilateral: >
    For the unit-side equilateral triangle, the Dirichlet eigenvalues are
    $\frac{16\pi^2}{9}(j^2+jk+k^2)$ with $j,k\geq1$ CITE{IntegrablePolygons}.
  right-isosceles: >
    For the right-isosceles triangle with legs $1$, the Dirichlet
    eigenvalues are $\pi^2(j^2+k^2)$ with $1\leq j<k$.
  hemiequilateral: >
    For the hemiequilateral triangle with hypotenuse $1$, the Dirichlet
    eigenvalues are $\frac{16\pi^2}{9}(j^2+jk+k^2)$ with $j>k\geq1$
    CITE{IntegrablePolygons}.
Similar tables:
  - table: HREF{Zeros_of_Bessel_J_functions}[Zeros of Bessel functions of the first kind $J_\alpha$]
    relation: >
      the disk and sector eigenvalues are squares of Bessel-zero entries
  - table: HREF{Local_extrema_of_Bessel_J_functions}[Local extrema of Bessel functions of the first kind $J_\alpha$]
    relation: >
      the extrema of $J_\alpha$ give Neumann disk eigenvalues, in
      parallel with the Bessel zeros used here for Dirichlet disk and
      sector eigenvalues

Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every entry with $0\leq n\leq5$, $q\in\{1,2,5,10\}$ and
    $z/\pi\in\{0,1/36,2/36,\ldots,1/2\}$
  rigour details: >-
    The generator diagonalises the truncated Fourier matrix for
    $-d^2/dz^2+2q\cos(2z)$ in the orthonormal cosine basis, chooses the sign
    by continuation from the $q=0$ coefficients in CITE{formula-zero-q}, and
    normalises the coefficient vector to CITE{formula-normalisation}. Each
    stored decimal is required to agree between two working precisions and two
    truncation lengths. The run checks the coefficient normalization, the
    Fourier coefficient equations, the exact $q=0$ control values, the exact
    zeros $\mathrm{ce}_{2r+1}(\pi/2,q)=0$, and agreement with SciPy's
    `mathieu_cem` CITE{SciPyCem} after converting radians to degrees.
Display properties:
  number-header: $\mathrm{ce}_n(z,q)$

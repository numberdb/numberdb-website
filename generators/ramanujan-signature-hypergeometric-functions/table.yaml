Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value was computed as a Sage real ball with arb at
    `numberdb.bits(digits, losing=128)` bits. For $x\leq1/2$ the generator
    sums the Gauss series in CITE{formula-series} and adds the tail bound
    $x^N/(1-x)$, using $0<(a)_n(1-a)_n/(n!)^2\leq1$ for $0<a<1$. For
    $x>1/2$ it sums the connection series in CITE{formula-connection} and
    bounds the tail by a geometric series in $1-x$ times the largest digamma
    bracket, which occurs at $n=0$. The measured worst cases used 433 Gauss
    terms and 402 connection-series terms; the widest returned ball had
    radius less than $6\cdot10^{-130}$ for 100 requested digits. The 508
    entries were checked against arb's hypergeometric function on all 448
    rows where that call returned a finite value, against CITE{formula-elliptic}
    for all 127 signature-$2$ rows, against CITE{formula-quartic} for all 127
    signature-$4$ rows, against the cubic AGM in CITE{formula-agm} for all 127
    signature-$3$ rows, against the corresponding signature-$6$ quadratic
    transformation for all 64 rows with $x\leq1/2$, and against the Gamma and
    Beta values in CITE{formula-half} for all four signatures at $x=1/2$.
  complete: no
  complete-note: >-
    it holds every entry with $r\in\{2,3,4,6\}$ and $x=a/b$ in lowest terms
    with $1\leq a<b$ and $b\leq20$
Display properties:
  number-header: $F_r(x)$

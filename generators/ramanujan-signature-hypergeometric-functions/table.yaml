# The table document for draft T178, Ramanujan's signature hypergeometric
# functions. It began as proposal 4 of
# agents/table-ideas/BATCH-2026-09-09T1055.md. Created, filled, and offered
# for review as a draft through the API; publishing is a person's act on the site.
Title: Values of Ramanujan's signature hypergeometric functions $F_r(x)$
Definition: >-
  This table gives the real values
  $F_r(x)={}_2F_1(1/r,1-1/r;1;x)$ of Gauss's hypergeometric function
  CITE{DLMFHypergeometric} for signatures $r\in\{2,3,4,6\}$ and rational
  arguments $0<x<1$. The argument $x$ is Gauss's hypergeometric variable.
Keywords:
  - Ramanujan signature
  - Ramanujan alternative bases
  - hypergeometric function
  - Gauss hypergeometric function
  - ordinary hypergeometric function
  - cubic AGM
  - quartic AGM
  - sextic theory
Parameters:
  r:
    type: Z
    title: signature
    display: $r$
    constraints: $r\in\{2,3,4,6\}$
  x:
    type: Q
    title: hypergeometric argument
    display: $x$
    constraints: $0<x<1$
Comments:
  comment-signatures: >-
    Signature $2$ is the classical elliptic-integral case, related to
    HREF{Complete_elliptic_integral_of_the_first_kind_K}[$K(m)$] by
    CITE{formula-elliptic}. Signatures $3$, $4$ and $6$ are the
    alternative-base theories of Ramanujan developed by Berndt, Bhargava and
    Garvan CITE{BBG1995}; in these four cases the two upper hypergeometric
    parameters are $a$ and $1-a$, with $a=1/r$.
  comment-range: >-
    Negative arguments are not listed. Pfaff's transformation sends a negative
    argument to one in $(0,1)$, multiplied by an elementary factor, so those
    values belong to a later extension with an explicit convention for that
    reduction.
  comment-endpoints: >-
    The endpoint $x=0$ gives $F_r(0)=1$ and is omitted. The endpoint $x=1$ is
    logarithmically divergent, as in CITE{formula-near-one}, and is not an
    entry.
  comment-half: >-
    At $x=1/2$, Gauss's second summation theorem gives the Gamma and Beta
    quotients in CITE{formula-half}. The entries for signatures $2$ and $3$
    agree with CITE{OEISSignatureTwoHalf} and CITE{OEISSignatureThreeHalf}.
Formulas:
  formula-series: >-
    With $(a)_n$ denoting the Pochhammer symbol,
    $F_r(x)=\sum_{n=0}^{\infty}
    ((1/r)_n(1-1/r)_n/(n!)^2)x^n$ for $|x|<1$ CITE{DLMFHypergeometric}.
  formula-connection: >-
    For $y=1-x$ and $0<x<1$,
    $F_r(x)=\frac{\sin(\pi/r)}{\pi}\sum_{n=0}^{\infty}
    \frac{(1/r)_n(1-1/r)_n}{(n!)^2}
    \bigl(2\psi(n+1)-\psi(n+1/r)-\psi(n+1-1/r)-\log y\bigr)y^n$,
    where $\psi$ is the digamma function. This is the $c=a+b$ case of the
    continuation formula CITE{DLMFTransformations}.
  formula-near-one: >-
    As $x\to1^-$,
    $F_r(x)/(-\log(1-x))\to\sin(\pi/r)/\pi$.
  formula-elliptic: >-
    $F_2(x)=2K(x)/\pi$, where $K(m)$ is
    HREF{Complete_elliptic_integral_of_the_first_kind_K}[the complete
    elliptic integral of the first kind].
  formula-agm: >-
    $F_2(1-b^2)=1/\operatorname{AGM}(1,b)$. The cubic analogue is
    $F_3(1-b^3)=1/\operatorname{AGM}_3(1,b)$, where
    $\operatorname{AGM}_3$ is the common limit of
    $a_{n+1}=(a_n+2b_n)/3$ and
    $b_{n+1}=\sqrt[3]{b_n(a_n^2+a_nb_n+b_n^2)/3}$ CITE{Borwein1991}.
  formula-quartic: >-
    $F_4(x)=\sqrt{1+z}\,F_2(z)$ with
    $z=(1-\sqrt{1-x})/(1+\sqrt{1-x})$ CITE{DLMFTransformations}.
  formula-half: >-
    For $r\in\{2,3,4,6\}$,
    $F_r(1/2)=2/B((r+1)/(2r),(2r-1)/(2r))=
    \sqrt{\pi}/(\Gamma((r+1)/(2r))\Gamma((2r-1)/(2r)))$
    CITE{DLMFSpecialCases}, with $B(a,b)$ as in CITE{DLMFBeta}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      r = 3
      x = QQ(1) / QQ(2)
      CBF = ComplexBallField(numberdb.bits(100, losing=128))
      a = CBF(QQ(1) / QQ(r))
      CBF(x).hypergeometric([a, 1 - a], [CBF(1)]).real()

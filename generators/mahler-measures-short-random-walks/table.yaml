Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds the classical short-walk cases $3\leq n\leq6$; the cases
    $n=1$ and $n=2$ are zero and are stated in the comments
  rigour details: >-
    The generator computes $\mu_3$ from the closed form
    $\mathrm{Cl}_2(\pi/3)/\pi$ and $\mu_4$ from $7\zeta(3)/(2\pi^2)$.
    It computes $\mu_5$ and $\mu_6$ from the Rodriguez-Villegas eta-integrals
    CITE{formula-rv5} and CITE{formula-rv6}, using the modular transformation
    of Dedekind's eta function for the small-$t$ part of the integral.

    Before the draft was filled, $\mu_3$ and $\mu_4$ were checked against
    the BSWZ Bessel integral CITE{formula-bessel}; $\mu_5$ and $\mu_6$ were
    checked against the same Bessel integral to the 18 digits printed in
    the screening report. The eta-integral computation was repeated at 50,
    80 and 120 working digits and the 50 digits kept here were unchanged.
    The moment series CITE{BSWZ} was measured and rejected for this first
    draft because after 300 terms it was still about $10^{-3}$ from the
    known $\mu_3$ and $\mu_4$ values.
Display properties:

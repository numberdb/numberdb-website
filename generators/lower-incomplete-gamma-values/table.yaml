Data properties:
  type: R
  rigour: proven
  rigour details: >-
    The entries are checked against the Kummer relation CITE{formula-kummer} on
    every stored entry and against the recurrence CITE{formula-recurrence}
    wherever both rows $a$ and $a+1$ are stored. They are also checked against
    the error-function identity CITE{formula-erf} on the row $a=1/2$ and
    against the elementary integer formula CITE{formula-integers} on the rows
    $a=1$ and $a=2$. Values are computed as real parts of Sage complex balls
    with arb at `numberdb.bits(digits, losing=64)` bits from exact rational
    parameters and arguments, using the complement formula
    CITE{formula-complement}. The imaginary part is required to contain zero.
    The widest returned ball had radius less than $10^{-117}$ for 100
    requested digits.
  complete: 'no'
  complete-note: >-
    it holds $\gamma(a,x)$ at every $a\in\tfrac12\mathbb{Z}$ with
    $-1/2\leq a\leq5/2$ except $a=0$, namely
    $a=-1/2,1/2,1,3/2,2,5/2$, and at every argument $x=k/10$ with
    $1\leq k\leq100$
Display properties:
  number-header: $\gamma(a,x)$

# Draft document for T352, values of the lower incomplete gamma function.
# Created through the API with X-Draft: yes, to be filled by generate.py beside
# it and offered for review. Publishing is a person's act.
Title: Values of the lower incomplete gamma function $\gamma(a,x)$
Definition: >-
  The lower incomplete gamma function is
  $\gamma(a,x)=\int_0^x t^{a-1}e^{-t}\,\mathrm{d}t$ for $a>0$ and $x>0$
  CITE{DLMFDefinition}, and by analytic continuation in $a$ elsewhere in this
  table. This table gives its real values at rational
  $a\notin\mathbb{Z}_{\leq0}$ and rational $x>0$.
Keywords:
  - incomplete gamma function
  - lower incomplete gamma
  - regularized incomplete gamma
  - chi-squared distribution
Parameters:
  a:
    type: Q
    title: parameter
    display: $a$
    constraints: $a\in\mathbb{Q}\setminus\mathbb{Z}_{\leq0}$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\in\mathbb{Q}$ and $x>0$
Comments:
  comment-principal: >-
    For real $a\notin\mathbb{Z}_{\leq0}$ and real $x>0$, the continued value
    is real. The continuation in $a$ is unique, so no branch has to be chosen.
  comment-regularized: >-
    The regularized lower incomplete gamma function is
    $P(a,x)=\gamma(a,x)/\Gamma(a)$ when $\Gamma(a)$ is finite
    CITE{DLMFDefinition}. For positive $a$, $P(a,x)$ is the distribution
    function of a chi-squared random variable with $2a$ degrees of freedom at
    $2x$. The regularized value is not stored here.
  comment-pole: >-
    The value at $a=0$ is not included because $\gamma(a,x)$ has a pole there.
    HREF{Values_of_the_upper_incomplete_gamma_function}[The table of the
    upper incomplete gamma function] stores $\Gamma(0,x)$, which is
    HREF{Values_of_the_exponential_integral}[the exponential integral
    $E_1(x)$] for positive $x$.
Formulas:
  formula-complement: >-
    If $a\ne0,-1,-2,\ldots$, then
    $\gamma(a,x)+\Gamma(a,x)=\Gamma(a)$, where $\Gamma(a,x)$ is
    HREF{Values_of_the_upper_incomplete_gamma_function}[the upper incomplete
    gamma function] CITE{DLMFDefinition}.
  formula-recurrence: >-
    $\gamma(a+1,x)=a\gamma(a,x)-x^ae^{-x}$ CITE{DLMFRecurrence}.
  formula-erf: >-
    $\gamma(1/2,x)=\sqrt{\pi}\operatorname{erf}(\sqrt{x})$
    CITE{DLMFSpecial}.
  formula-integers: >-
    For nonnegative integers $n$,
    $\gamma(n+1,x)=n!\left(1-e^{-x}\sum_{k=0}^n x^k/k!\right)$
    CITE{DLMFSpecial}.
  formula-kummer: >-
    If $a\ne0,-1,-2,\ldots$, then $\gamma(a,x)=x^a M(a;a+1;-x)/a$, where
    $M$ is HREF{Values_of_Kummer's_confluent_hypergeometric_function}[Kummer's
    confluent hypergeometric function] CITE{DLMFKummer}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=64))
      a = CBF(QQ(1) / QQ(2))
      x = CBF(1)
      value = a.gamma() - a.gamma_inc(x)
      print(value.real())
Similar tables:
  - table: HREF{Values_of_the_upper_incomplete_gamma_function}[Values of the upper incomplete gamma function $\Gamma(a,x)$]
    relation: >-
      for $a\ne0,-1,-2,\ldots$, the lower and upper incomplete gamma
      functions sum to $\Gamma(a)$
  - table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the Gamma function at rational numbers]
    relation: contains $\Gamma(a)$, the complete value in the complement formula
  - table: HREF{Values_of_the_error_function}[Values of the error function $\operatorname{erf}(x)$]
    relation: the row $a=1/2$ is $\sqrt{\pi}\operatorname{erf}(\sqrt{x})$
  - table: HREF{Values_of_Kummer's_confluent_hypergeometric_function}[Values of Kummer's confluent hypergeometric function $M(a;b;z)$]
    relation: >-
      $\gamma(a,x)=x^a M(a;a+1;-x)/a$, where the corresponding parameters of
      $M$ are $(a,a+1,-x)$

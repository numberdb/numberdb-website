Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every eigenvalue for the listed symmetric matrix families with
    $2\leq n\leq12$, giving the nontrivial small orders while keeping this
    table to 847 eigenvalues
  rigour details: >-
    The generator builds each matrix over $\mathbb{Q}$, computes its
    characteristic polynomial exactly, isolates its roots in Sage's algebraic
    real field, orders those algebraic roots increasingly, returns roots
    proved rational as exact rationals, and returns the other roots as real
    balls with 96 guard bits beyond the 100 digits written.
    During generation it checks that every listed characteristic polynomial
    has $n$ real roots, that the eigenvalue sum equals the trace, that the
    eigenvalue product equals the determinant, that the Minij and
    second-difference rows agree with the closed forms in CITE{formula-minij}
    and CITE{formula-second-difference}, and that the symmetric Pascal
    eigenvalues occur in reciprocal pairs.
Display properties:
  number-header: $\lambda_k(A_n)$

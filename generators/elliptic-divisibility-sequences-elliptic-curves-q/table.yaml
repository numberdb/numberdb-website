Data properties:
  type: Z
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the first Mordell-Weil generator, with sign chosen so that
    $W_2(P)>0$, for every rank-one curve in Sage's mini Cremona database
    CITE{SageCremona} with conductor $N\leq60$, and every $n$ with
    $1\leq n\leq50$
  sources:
    - CITE{SageCremona}
  rigour details: >-
    The generator reads exact Weierstrass coefficients from Sage's mini
    Cremona database CITE{SageCremona}, uses the integral generator points
    listed in the source file, and evaluates the exact division polynomials by
    the same coordinate-ring recurrences used for
    HREF{Division_polynomials_psi_n_of_elliptic_curves_over_mathbb_Q}[the
    division-polynomial table]. It verifies the elliptic divisibility sequence
    recurrences in Formula CITE{formula-eds-recurrence}, verifies Formula
    CITE{formula-x-coordinate} against exact point multiplication in Sage, and
    checks the first terms for 37a1, 43a1 and 53a1 against OEIS A006769
    CITE{OEIS6769}, A050512 CITE{OEIS50512} and A178627 CITE{OEIS178627}.
Display properties:

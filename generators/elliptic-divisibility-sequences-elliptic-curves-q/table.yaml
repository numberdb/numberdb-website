Title: Elliptic divisibility sequences $W_n$ of points on elliptic curves over $\mathbb{Q}$
Definition: >-
  Let $E/\mathbb{Q}$ be the reduced global minimal Weierstrass model recovered
  from $(c_4,c_6)$ by Formula CITE{formula-model-from-invariants}. For an
  integral nontorsion point $P=(x_P,y_P)$ on $E$, the entry is
  $W_n(P)=\psi_n(P)$, where $\psi_n$ is the $n$-th division polynomial.
Parameters:
  N:
    type: Z
    title: conductor of $E$
    display: $N$
    constraints: $N\geq1$
  c4:
    type: Z
    title: invariant $c_4$ of the reduced global minimal model of $E$
    display: $c_4$
  c6:
    type: Z
    title: invariant $c_6$ of the reduced global minimal model of $E$
    display: $c_6$
  xP:
    type: Z
    title: $x$-coordinate of $P$
    display: $x_P$
  yP:
    type: Z
    title: $y$-coordinate of $P$
    display: $y_P$
  n:
    type: Z
    title: sequence index
    display: $n$
    constraints: $n\geq1$
Comments:
  comment-convention: >-
    This table uses the division-polynomial convention $W_n(P)=\psi_n(P)$ for
    elliptic divisibility sequences CITE{WikiEDS} CITE{Stange}. It does not
    store the denominator sequence obtained from writing $x(nP)=A_n/D_n^2$.
  comment-curve-labels: >-
    The curve is identified by $N$, $c_4$ and $c_6$. Each entry comment gives
    the curve's Cremona label. LMFDB CITE{LMFDB} numbers curves within an
    isogeny class differently from Cremona's tables CITE{SageCremona}, so a
    label here is not an LMFDB label.
  comment-point-choice: >-
    In the computed range, $P$ is the first Mordell-Weil generator returned by
    Sage for a rank-one curve, replaced by $-P$ when necessary so that
    $W_2(P)>0$.
Formulas:
  formula-model-from-invariants: >-
    For the reduced models in this table, $b_2$ is the unique element of
    $\{-4,-3,0,1,4,5\}$ with $b_2\equiv -c_6\pmod{12}$,
    $b_4=(b_2^2-c_4)/24$, and
    $b_6=(-c_6-b_2^3+36b_2b_4)/216$. The model has
    $a_1\equiv b_2\pmod 2$, $a_3\equiv b_6\pmod 2$ with
    $a_1,a_3\in\{0,1\}$ and $a_2\in\{-1,0,1\}$, and
    $a_2=(b_2-a_1^2)/4$, $a_4=(b_4-a_1a_3)/2$ and
    $a_6=(b_6-a_3^2)/4$.
  formula-eds-recurrence: >-
    With $W_0=0$ and $W_1=1$, the terms satisfy
    $W_{2m+1}=W_{m+2}W_m^3-W_{m-1}W_{m+1}^3$ for $m\geq2$, and
    $W_{2m}W_2=W_m(W_{m+2}W_{m-1}^2-W_{m-2}W_{m+1}^2)$ for $m\geq3$.
  formula-x-coordinate: >-
    For $n\geq1$, $x(nP)=x(P)-W_{n-1}(P)W_{n+1}(P)/W_n(P)^2$.
Programs:
  program-sage:
    language: Sage
    code: |-
      E = EllipticCurve([0, 0, 1, -1, 0])
      P = E(0, 0)
      [E.division_polynomial(n, P, two_torsion_multiplicity=1) for n in [1..10]]

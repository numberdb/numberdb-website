# Draft document for T290. Publishing is a person's act.
Title: Bernstein-Sato polynomials of the simple and unimodal singularities
Definition: >-
  $b_f(s)\in\mathbb{Q}[s]$ is the local Bernstein-Sato polynomial
  CITE{WikiBFunction} at the origin of
  $f+x_{c+1}^2+\cdots+x_n^2$. Here $f$ is the normal form in $c$ variables
  $x,y,z$ of a simple singularity, a parabolic unimodal singularity, or an
  exceptional unimodal singularity in Arnold's classification CITE{AGV} with
  the modulus set to $0$ for the unimodal families. The normal forms are
  $A_k:x^{k+1}$; $D_k:x^2y+y^{k-1}$; $E_6:x^3+y^4$; $E_7:x^3+xy^3$;
  $E_8:x^3+y^5$; $P_8:x^3+y^3+z^3$; $X_9:x^4+y^4$; $J_{10}:x^3+y^6$;
  $E_{12}:x^3+y^7$; $E_{13}:x^3+xy^5$; $E_{14}:x^3+y^8$;
  $Z_{11}:x^3y+y^5$; $Z_{12}:x^3y+xy^4$; $Z_{13}:x^3y+y^6$;
  $W_{12}:x^4+y^5$; $W_{13}:x^4+xy^4$; $Q_{10}:x^3+y^4+yz^2$;
  $Q_{11}:x^3+y^2z+xz^3$; $Q_{12}:x^3+y^5+yz^2$;
  $S_{11}:x^4+y^2z+xz^2$; $S_{12}:x^2y+y^2z+xz^3$; and
  $U_{12}:x^3+y^3+z^4$.
Keywords:
  - Bernstein-Sato polynomial
  - Bernstein Sato polynomial
  - b-function
  - simple singularity
  - unimodal singularity
  - Arnold singularity
  - ADE singularity
Parameters:
  singularity:
    type: Symbolic
    title: singularity
    display: singularity
    constraints: >-
      $A_k$ with $k\geq1$, $D_k$ with $k\geq4$, one of
      $E_6,E_7,E_8$, or one of Arnold's parabolic or exceptional unimodal
      labels $P_8,X_9,J_{10},E_{12},E_{13},E_{14},Z_{11},Z_{12},Z_{13},

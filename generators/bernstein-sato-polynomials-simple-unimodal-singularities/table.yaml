Comments:
  full-b-function: >-
    The full Bernstein-Sato polynomial is stored, including the factor
    $s+1$. The reduced Bernstein-Sato polynomial is
    $\tilde b_f(s)=b_f(s)/(s+1)$ and is not stored separately; when $-1$ is a
    root of $\tilde b_f(s)$, the full polynomial has $(s+1)^2$ as a factor.
  notation: >-
    $\mu$ is the Milnor number
    $\dim_{\mathbb{C}}\mathbb{C}[x_1,\ldots,x_n]/(\partial f)$, and
    $\operatorname{lct}(f)$ is the log canonical threshold, which is minus the
    largest root of $b_f(s)$.
  local-and-global: >-
    The polynomial is the local b-function at the origin. For these
    quasi-homogeneous isolated singularities the origin is the only critical
    point on $f=0$, so Singular's global routine `bfct` CITE{SingularBfct}
    computes the same polynomial.
  modulus-zero: >-
    The hyperbolic unimodal families $T_{p,q,r}$ are not included: in the
    hyperbolic case $1/p+1/q+1/r<1$, so the modulus term $xyz$ is not weighted
    homogeneous with $x^p,y^q,z^r$. For the exceptional unimodal families the
    b-function depends on the modulus: $x^3+y^7$ has the root $-32/21$, while
    $x^3+y^7+xy^5$ has $-11/21$.
Formulas:
  weighted-homogeneous-formula: >-
    If $f$ has weighted degree $1$ with weights $w_i$, and $x^a$ runs through
    a monomial basis of the Milnor algebra
    $\mathbb{C}[x_1,\ldots,x_n]/(\partial f)$, then
    $b_f(s)=(s+1)\prod_{\alpha\in A_f}(s+\alpha)$, where
    $A_f$ is the set of distinct values
    $\alpha=\sum_i w_i+\sum_i a_iw_i$.
  suspension: >-
    $\tilde b_{f+u^2}(s)=\tilde b_f(s+\frac{1}{2})$.
Programs:
  program-singular:
    language: Singular
    code: |-
      LIB "bfun.lib";
      ring r = 0,(x,y),dp;
      poly F = x2 + y3;
      bfct(F);        // roots -5/6, -1, -7/6
Similar tables:
  - table: HREF{Poincaré_polynomials_of_the_finite_Coxeter_groups}[Poincaré polynomials of the finite Coxeter groups]
    relation: >-
      for the ADE rows with $n=3$, the monodromy eigenvalues obtained from
      the roots of $b_f$ are the eigenvalues of a Coxeter element of the
      corresponding finite Coxeter group; the degrees read from that Coxeter
      group's Poincaré polynomial are the Coxeter exponents plus one

Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds $A_k$ for $1\leq k\leq12$, $D_k$ for $4\leq k\leq12$, the
    exceptional simple singularities, and the parabolic and exceptional
    unimodal singularities in the definition, with $n\leq3$; the hyperbolic
    unimodal families $T_{p,q,r}$ are not included
  rigour details: >-
    The generator computes the weights and a monomial basis of the Milnor
    algebra over $\mathbb{Q}$, forms the weighted-homogeneous product exactly,
    and expands it in $\mathbb{Q}[s]$. Every row was also computed with
    Singular's `bfct` CITE{SingularBfct} and agreed; the control $x^2+y^3$,
    whose roots are $-5/6,-1,-7/6$, was run first.
Display properties:
  number-header: $b_f(s)$

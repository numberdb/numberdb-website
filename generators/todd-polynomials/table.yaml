Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every entry with $1\leq n\leq 7$, and $\mathrm{Td}_7$ is the
    last entry whose polynomial uses at most six variables
  rigour details: >-
    The generator computes exact rational coefficients in
    $\mathbb Q[c_1,\dots,c_6]$ from Formula CITE{formula-component}. It is
    checked against the displayed terms in CITE{ToddWiki} and CITE{GenusWiki},
    and by substituting the Chern classes of $T\mathbb P^m$ for
    $1\leq m\leq7$, which gives Todd genus $1$ for each complex projective
    space CITE{GenusWiki}.

Title: Values of the hyperfactorial $K$-function $K(x)$ at rational numbers
Definition: >-
  The hyperfactorial $K$-function is
  $K(x)=\exp(\zeta'(-1,x)-\zeta'(-1))$ CITE{WikiKFunction}, where
  $\zeta(s,x)$ is the Hurwitz zeta function, $\zeta'(s,x)$ is its derivative
  in $s$, and $\zeta'(-1)=\zeta'(-1,1)$. Listed are $K(x)$ and $\log K(x)$
  at positive rational $x$.
Keywords:
  - K-function
  - hyperfactorial K-function
  - hyperfactorial
  - Kinkelin function
  - negapolygamma
  - derivative of the Hurwitz zeta function at $s=-1$
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\in\mathbb{Q}$ and $x>0$
  quantity:
    type: Symbolic
    title: $K(x)$ or $\log K(x)$
    display: quantity
    values:
      K: $K(x)$
      logK: $\log K(x)$
Comments:
  comment-domain: >-
    For $x>0$, $K(x)$ is real and positive, so $\log K(x)$ is real. The table
    holds no values at $x\leq0$, where continuing $\Gamma(x)^{x-1}/G(x)$
    encounters poles and branch choices.
  comment-shift: >-
    The hyperfactorial $H(n)=1^1 2^2\cdots n^n$ is $K(n+1)$, so $H(n)$ is the
    row $x=n+1$.
Formulas:
  formula-log: >-
    $\log K(x)=\zeta'(-1,x)-\zeta'(-1)$.
  formula-barnes: >-
    $K(x)=\Gamma(x)^{x-1}/G(x)$, where $G$ is
    HREF{Values_of_the_Barnes_G-function_at_rational_numbers}[the Barnes
    $G$-function] CITE{WikiKFunction}.
  formula-recurrence: >-
    $K(x+1)=x^xK(x)$ for $x>0$.
  formula-integers: >-
    For positive integers $n$, $K(n)=\prod_{m=1}^{n-1}m^m$.
  formula-half: >-
    $K(1/2)=A^{3/2}2^{-1/24}e^{-1/8}$, where $A$ is
    HREF{T227#1,A}[the Glaisher-Kinkelin constant].
  formula-multiplication: >-
    For integers $n\geq2$,
    $\prod_{j=1}^{n-1}K(j/n)=A^{(n^2-1)/n}n^{-1/(12n)}
    e^{(1-n^2)/(12n)}$ CITE{WikiKFunction}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=96))
      x = QQ(1) / QQ(2)
      value = CBF(x).gamma() ** CBF(x - 1) / CBF(x).barnes_g()
      print(value.real())
      print(value.log().real())
Similar tables:
  - table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the Gamma function at rational numbers]
    relation: $K(x)$ is expressed using powers of $\Gamma(x)$
  - table: HREF{Values_of_the_Barnes_G-function_at_rational_numbers}[Values of the Barnes $G$-function at rational numbers]
    relation: $K(x)=\Gamma(x)^{x-1}/G(x)$
  - table: HREF{Values_of_the_Hurwitz_zeta_function_at_pairs_of_rational_numbers}[Values of the Hurwitz zeta function at pairs of rational numbers]
    relation: $\log K(x)$ is a derivative of the Hurwitz zeta function at $s=-1$
  - table: HREF{T227}[Glaisher-Kinkelin constant $A$ and Bendersky constants $A_k$]
    relation: $A=A_1$ appears in special values and multiplication formulas for $K$
  - table: HREF{T228}[Values of the derivative $\zeta'(s)$ of the Riemann zeta function at rational numbers]
    relation: $\log K(x)$ differs from the Hurwitz zeta derivative $\zeta'(-1,x)$ by the Riemann zeta derivative $\zeta'(-1)$
Links:
  WikiKFunction:
    title: 'Wikipedia: K-function'
    url: https://en.wikipedia.org/wiki/K-function
Tags:
  - special values
  - special functions
Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Non-exact entries are computed as Sage balls with arb at
    `numberdb.bits(digits, losing=96)` bits from exact rational arguments.
    The entries are checked by comparing the Barnes $G$-function formula with
    the Hurwitz zeta derivative formula, by the recurrence $K(x+1)=x^xK(x)$,
    by exact integer values of $K(n)$, and by the multiplication formula in
    CITE{formula-multiplication}.
  complete: 'no'
  complete-note: >-
    it holds $K(x)$ and $\log K(x)$ for every rational argument $x=a/b$ in
    lowest terms with $b\leq12$ and $0<x\leq6$, which includes every factor in
    the multiplication formula for $n\leq12$ and the integer values through
    $K(6)=86400000$
Display properties:
  number-header: value

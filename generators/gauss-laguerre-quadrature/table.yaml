Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: every rule with $n\leq 30$ is here, nodes and weights
  rigour details: >-
    $L_n$ is built exactly in $\mathbb{Q}[x]$; its roots are isolated by
    Sage's real root isolation over the interval field, so each node is an
    interval provably containing one root, carried on as an arb ball at 461
    bits; $w_k$ is $x_k/((n+1)^2L_{n+1}(x_k)^2)$ in ball arithmetic, and the
    digits written are those the ball supports (every entry supports more
    than 120; the evaluation of $L_{31}$ near $x=40$ loses about fifteen
    digits to cancellation, which is why the working precision is what it
    is). Before a rule is written it must also satisfy the Christoffel
    formula for the weights, $\sum w_k=1$, exactness on $x^m$ for
    $m\leq 2n-1$ with failure at $m=2n$, and the polynomials named in the
    entry comments. Outside the generator the values were compared with the
    closed forms for $n\leq 2$, with the stored polynomials $L_n$, with
    fourteen OEIS expansions to 100 digits, with the OEIS A387347 weight
    polynomials for $n\leq 6$, with all hundred values of DLMF Tables
    3.5.6–3.5.9 ($n=5,10,15,20$; one printed weight at $n=10$ differs from
    the ball by one unit in its eighteenth digit, the other ninety-nine
    agree to the last digit), with MathWorld's rows for $n\leq 5$, and with
    the folded Gauss–Hermite rules of the stored table, with the controls
    that must fail failing.
Display properties:
  number-header: $x_k$ or $w_k$

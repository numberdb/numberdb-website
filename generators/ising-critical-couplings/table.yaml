# The table document for the Ising critical couplings, proposal 2 of
# agents/table-ideas/BATCH-2026-09-06T0326.md. Created as a draft through the
# API (X-Draft: yes) and filled by generate.py beside it; publishing is a
# person's act on the site.
Title: Critical couplings of the Ising model on lattices
Definition: >-
  For the nearest-neighbour ferromagnetic Ising model CITE{Wiki} on an
  infinite lattice $L$, with energy $E=-J\sum_{\langle ij\rangle}s_is_j$ over
  the edges $\langle ij\rangle$ of $L$ and spins $s_i=\pm1$, the critical
  coupling is $K_c=J/(k_BT_c)$, where $T_c$ is the Curie temperature at which
  the model orders.
Parameters:
  lattice:
    type: Symbolic
    title: lattice, named by its tiling, crystal structure or vertex configuration
    display: lattice
    values:
      square: 'square $(4^4)$'
      triangular: 'triangular $(3^6)$'
      honeycomb: 'honeycomb $(6^3)$'
      kagome: 'kagome $(3,6,3,6)$'
      3-12-12: '$(3,12^2)$'
      4-6-12: '$(4,6,12)$'
      4-8-8: '$(4,8^2)$'
      3-4-6-4: '$(3,4,6,4)$'
      3-3-3-3-6: '$(3^4,6)$'
      3-3-4-3-4: '$(3^2,4,3,4)$'
      3-3-3-4-4: '$(3^3,4^2)$'
      D-3-3-4-3-4: 'Cairo pentagonal $D(3^2,4,3,4)$'
      D-3-3-3-4-4: 'prismatic pentagonal $D(3^3,4^2)$'
      D-3-3-3-3-6: 'floret pentagonal $D(3^4,6)$'
      D-3-6-3-6: 'rhombille $D(3,6,3,6)$'
      D-3-4-6-4: 'deltoidal trihexagonal $D(3,4,6,4)$'
      D-4-8-8: 'tetrakis square $D(4,8^2)$'
      D-4-6-12: 'kisrhombille $D(4,6,12)$'
      D-3-12-12: 'triakis triangular $D(3,12^2)$'
      sc: 'simple cubic'
      bcc: 'body-centred cubic'
      fcc: 'face-centred cubic'
      diamond: 'diamond'
  expression:
    type: Symbolic
    title: the coupling $K_c$ or the temperature $k_BT_c/J=1/K_c$
    display: expression
    values:
      coupling: '$K_c=J/(k_BT_c)$'
      temperature: '$k_BT_c/J$'
Comments:
  comment-conventions: >-
    The energy is $-J\sum s_is_j$ with $s_i=\pm1$ and $J>0$, summed once
    over each edge, so that $K=J/(k_BT)$ is the coupling in units of the
    temperature and $k_BT_c/J$ is the Curie temperature in units of $J/k_B$;
    the values are read as $\beta_cJ$ in a paper that writes $\beta=1/(k_BT)$
    and as $T_c/J$ in one that sets $k_B=1$. With spins $\pm\frac12$ and the
    same energy the transition is at $J/(k_BT_c)=4K_c$; with the energy
    written as $-2J\sum s_is_j$ it is at $K_c/2$ for spins $\pm1$ and at
    $2K_c$ for spins $\pm\frac12$. The lattices are the nearest-neighbour graphs of the
    tilings and crystal structures named, under the names of the
    HREF{Site_and_bond_percolation_thresholds_of_lattices}[table of
    percolation thresholds]: an Archimedean lattice by its vertex
    configuration in the notation of Grünbaum and Shephard, and each Laves
    lattice as $D(\ldots)$ of the Archimedean lattice it is the planar dual
    of; the square lattice is self-dual and the triangular and honeycomb
    lattices are dual to each other. $(3,12^2)$ is also called the truncated
    hexagonal, extended kagome or three-twelve lattice, $(4,8^2)$ the
    truncated square, bathroom-tile or four-eight lattice, $(4,6,12)$ the
    truncated trihexagonal lattice, $(3,4,6,4)$ the rhombitrihexagonal or
    ruby lattice, $(3^4,6)$ the snub hexagonal or maple-leaf lattice,
    $(3^2,4,3,4)$ the snub square or Shastry–Sutherland lattice, $(3^3,4^2)$
    the elongated triangular or trellis lattice, $D(3,6,3,6)$ the dice
    lattice and $D(4,8^2)$ the union-jack lattice.
  comment-exact: >-
    The nineteen planar couplings are known exactly. Kramers and Wannier
    CITE{KW} located the square-lattice transition at $\sinh2K_c=1$ from
    self-duality, and Onsager's solution CITE{Onsager} confirmed it; Wannier
    CITE{Wannier} and Houtappel CITE{Houtappel} solved the triangular and
    honeycomb lattices, Kano and Naya CITE{KanoNaya} the kagome lattice,
    Utiyama CITE{Utiyama} the lattice $(4,8^2)$, Syozi CITE{Syozi} the lattice
    $(3,12^2)$ by decoration, and Thompson and Wardrop CITE{ThompsonWardrop}
    the lattices $(3^3,4^2)$ and $(3^2,4,3,4)$. Codello CITE{Codello} treated
    all eleven Archimedean lattices at once by the Feynman–Vdovichenko
    random-walk method, which gives $\tanh K_c$ as the root in $(0,1)$ of a
    polynomial CITE{formula-polynomials}, and so found the couplings of
    $(4,6,12)$, $(3,4,6,4)$ and $(3^4,6)$, known until then from Monte Carlo
    simulations CITE{Malarz}; the polynomials of the kagome lattice and of
    $(3,4,6,4)$ share the factor that carries the root, so the two lattices
    have the same Curie temperature. Jacobsen's critical polynomials
    CITE{Jacobsen}, computed by transfer matrices, reproduce every one of
    these values at $q=2$ and give the cube-root closed forms
    CITE{formula-closed-forms} of the two couplings that Codello left as
    decimals. The eight Laves lattices follow from their Archimedean duals by
    Kramers–Wannier duality CITE{WikiKW} CITE{formula-duality}. Each exact
    $K_c$ is the logarithm of an algebraic number other than $1$, hence
    transcendental by the Lindemann–Weierstrass theorem, and the square and
    honeycomb couplings are half the regulators of $\mathbb{Q}(\sqrt2)$ and
    $\mathbb{Q}(\sqrt3)$, since $1+\sqrt2$ and $2+\sqrt3$ are the fundamental
    units, both in the HREF{Regulators_of_real_quadratic_fields}[table of
    regulators].
  comment-estimates: >-
    No three-dimensional lattice has been solved, and the four cubic
    couplings are numerical estimates, each written as $K_c\pm\varepsilon$
    with $\varepsilon$ the uncertainty stated in the source named in the
    entry; in the notation $0.221654626(5)$ the digits in parentheses are
    that uncertainty in the last digits written. They are the most precise
    published values as of 6 September 2026: the simple cubic coupling from
    the Monte Carlo study of Ferrenberg, Xu and Landau CITE{FXL}, and the
    three others as quoted by Lundow and Campbell CITE{LundowCampbell}. They
    quote the body-centred cubic coupling from the high-temperature series
    of Butera and Comi CITE{ButeraComi} and the Monte Carlo studies of
    Lundow, Markström and Rosengren CITE{LMR} and of Murase and Ito
    CITE{MuraseIto}, the face-centred cubic coupling from those two Monte
    Carlo studies, and the diamond coupling from the Monte Carlo studies of
    Deng and Blöte CITE{DengBlote} and of Lundow, Markström and Rosengren.
    The reciprocal
    $k_BT_c/J$ of each carries the uncertainty of $K_c$ propagated through
    the reciprocal.
Formulas:
  formula-square: >-
    $K_c(4^4)=\frac12\ln(1+\sqrt2)=\frac12\operatorname{arsinh}1$, equivalently
    $\sinh2K_c=1$ and $\tanh K_c=e^{-2K_c}=\sqrt2-1$ CITE{KW} CITE{Onsager}
    CITE{WikiSquare}, so that $k_BT_c/J=2/\ln(1+\sqrt2)=2.2691853142\ldots$
    CITE{OEISsqT}.
  formula-closed-forms: >-
    $K_c(3^6)=\frac14\ln3$, $K_c(6^3)=\frac12\ln(2+\sqrt3)$ CITE{Houtappel},
    $K_c(3,6,3,6)=K_c(3,4,6,4)=\frac14\ln(3+2\sqrt3)$ CITE{KanoNaya}
    CITE{Codello}, $K_c(3^3,4^2)=\frac12\ln2$ CITE{ThompsonWardrop}, and, with
    $\omega=37+27\sqrt2+3\sqrt{315+222\sqrt2}$ for $(3^2,4,3,4)$ and
    $\omega=37+27\sqrt3+3\sqrt{6(66+37\sqrt3)}$ for $(3^4,6)$,
    $e^{2K_c}=1+\frac13\left(\omega^{1/3}-2\omega^{-1/3}-2\right)$
    CITE{Jacobsen}; for the remaining Archimedean lattices $\tanh K_c$ is
    $-\frac14-\frac{\sqrt3}{4}+\frac12\sqrt{3+\frac{5\sqrt3}{2}}$ on
    $(3,12^2)$, $\sqrt{\frac{5+3\sqrt3-\sqrt{44+26\sqrt3}}{2}}$ on $(4,6,12)$
    and $-1-\frac1{\sqrt2}+\sqrt{\frac{5+4\sqrt2}{2}}$ on $(4,8^2)$
    CITE{Codello}.
  formula-polynomials: >-
    $v_c=\tanh K_c$ is the unique root in $(0,1)$ of $P(v)$ CITE{Codello},
    where $P$ is $1-2v-v^2$ for $(4^4)$, $1-4v+v^2$ for $(3^6)$, $1-3v^2$ for
    $(6^3)$, $1-4v^2-6v^4-4v^6+v^8$ for $(3,6,3,6)$ and for $(3,4,6,4)$,
    $1-2v+3v^2-2v^3-2v^4$ for $(3,12^2)$, $1-2v^2+2v^4-10v^6+v^8$ for
    $(4,6,12)$, $1-4v^3-v^4$ for $(4,8^2)$, $1-4v+7v^2-12v^3+3v^4-3v^6$ for
    $(3^4,6)$, $1-2v-v^2-4v^3-9v^4+6v^5-7v^6$ for $(3^2,4,3,4)$ and $1-3v$
    for $(3^3,4^2)$; each is the factor of $\det(1-v\mathbf{W}_\Lambda(0,0))$,
    $\mathbf{W}_\Lambda$ the Feynman–Vdovichenko random-walk matrix of the
    lattice $\Lambda$, that vanishes in $(0,1)$.
  formula-duality: >-
    $\sinh2K_c\,\sinh2K_c^{*}=1$, that is
    $K_c^{*}=-\frac12\ln\tanh K_c=\frac12\ln\coth K_c$, for a planar lattice
    and its dual CITE{KW} CITE{WikiKW}; in particular for each Archimedean
    lattice and its Laves dual, for the triangular and honeycomb lattices,
    and for the self-dual square lattice, where it gives $\sinh2K_c=1$.
Programs:
  program-sage:
    language: Sage
    code: |-
      N(log(1 + sqrt(2))/2, digits=30)                       # K_c on the square lattice
      v = 1/2 - sqrt(sqrt(3)/2) + sqrt(3)/2                  # tanh K_c on the kagome lattice
      N(atanh(v), digits=30), N(-log(v)/2, digits=30)        # K_c there and on its dual, the rhombille lattice
      R.<v> = QQ[]
      (1 - 4*v + 7*v^2 - 12*v^3 + 3*v^4 - 3*v^6).roots(RealIntervalField(200))   # tanh K_c on (3^4,6) is the root in (0, 1)

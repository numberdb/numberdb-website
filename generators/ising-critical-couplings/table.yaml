Data properties:
  type: R
  rigour: heuristic
  sources:
    - CITE{Codello}
    - CITE{FXL}
    - CITE{LundowCampbell}
  complete: 'no'
  complete-note: >-
    it holds $K_c$ and $k_BT_c/J$ for the eleven Archimedean lattices, the
    eight Laves lattices and the simple cubic, body-centred cubic,
    face-centred cubic and diamond lattices, the cubic values being the most
    precise published estimates as of 6 September 2026
  rigour details: >-
    Mixed, and labelled by its weakest entries. The 38 entries of the
    planar lattices are enclosures computed in ball arithmetic in arb at
    100 digits with 64 guard bits: for each Archimedean lattice
    $v_c=\tanh K_c$ is enclosed in an interval of half-width $10^{-105}$
    around the value of its closed form, proved to contain the root by a
    sign change of Codello's polynomial $P$ across the ends and proved to be
    the only root in $(0,1)$ by $P$ keeping one sign on balls covering the
    rest of the interval; $K_c=\operatorname{artanh}v_c$ and $k_BT_c/J=1/K_c$
    follow in balls, and each Laves lattice takes
    $K_c=-\frac12\ln v_c$ of its Archimedean dual. The 8 entries of the cubic
    lattices were not computed: each $K_c$ is a published estimate, written
    as centre and radius with the paper's stated uncertainty as the radius,
    and each $k_BT_c/J$ is the reciprocal of that interval in exact decimal
    arithmetic, its centre rounded to a tenth of its width and its radius
    rounded up. Before any entry was written, every planar value was
    compared with the four decimals of $k_BT_c/J$ and $k_BT_c^{*}/J$ that
    Codello prints; every Archimedean value with the Ising critical
    polynomial of Jacobsen for that lattice, a transfer-matrix computation
    sharing no method with Codello's, which changes sign across the stored
    enclosure of $e^{2K_c}-1$; the square and honeycomb couplings with OEIS
    A245592, A169800 and A329247 to every digit listed there and with half
    the regulators of $\mathbb{Q}(\sqrt2)$ and $\mathbb{Q}(\sqrt3)$ stored in
    the table of regulators; the three values Codello found first with the
    Monte Carlo estimates of Malarz, Zborek and Wróbel and of Lima,
    Mostowicz and Malarz; the duality $\sinh2K_c\sinh2K_c^{*}=1$ on every
    dual pair; the mean-field bound $K_c>1/z$, $z$ the coordination number,
    on every lattice; and the simple cubic estimate with the text of the
    paper cited. The body-centred cubic, face-centred cubic and diamond
    values were taken from Lundow and Campbell; of the papers they quote,
    Butera and Comi's was read here and prints the body-centred cubic value
    with an uncertainty of $10$ in the last digit where Lundow and Campbell
    quote $5$, and the others have no arXiv version and were not read.
Display properties:
  number-header: $K_c$ or $k_BT_c/J$

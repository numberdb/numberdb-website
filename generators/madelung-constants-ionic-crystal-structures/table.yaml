Data properties:
  type: R
  rigour: proven
  complete: 'yes'
  rigour details: >-
    The generator computes the neutral-cell Ewald sum in arb ball arithmetic
    with $\alpha=4$, including explicit upper bounds for the omitted real-space
    and reciprocal-space tails. It writes $100$ digits. Before the draft was
    filled, the rock-salt row was checked against Benson's rapidly convergent
    $\operatorname{sech}^2$ series, and the rows for rock salt, caesium
    chloride, zincblende, fluorite, cuprite and ideal wurtzite were checked
    against published prefixes.

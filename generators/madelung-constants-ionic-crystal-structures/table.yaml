Comments:
  comment-conventions: >-
    The sign convention puts the minus sign in the energy formula and stores
    $M>0$. The charges in the Ewald sum are the formal ionic charges, so the
    fluorite, antifluorite and cuprite rows include charge products with
    magnitudes larger than one.
  comment-distance: >-
    The normalising distance is the nearest cation-anion distance. In terms of
    a cubic lattice parameter $a$, it is $a/2$ for rock salt,
    $\sqrt3 a/2$ for caesium chloride, and $\sqrt3 a/4$ for zincblende,
    fluorite, antifluorite and cuprite.
  comment-scope: >-
    The wurtzite row is the ideal wurtzite structure with
    $c/a=\sqrt{8/3}$ and internal coordinate $u=3/8$, so
    $r_0=a\sqrt{3/8}$. Rutile, anatase and corundum are not included because
    their Madelung constants depend on structural parameters rather than on the
    structure name alone.
Formulas:
  formula-ewald: >-
    For a neutral unit cell with volume $V$, charges $q_i$ and positions
    $r_i$, the generator evaluates
    $\frac12\sum_{i,j}\sum_n' q_iq_j\,\operatorname{erfc}(\alpha|r_i-r_j+n|)
    /|r_i-r_j+n| + \frac{2\pi}{V}\sum_{k\ne0} |\sum_i q_i e^{ik\cdot r_i}|^2
    e^{-|k|^2/(4\alpha^2)}/|k|^2
    -\alpha\pi^{-1/2}\sum_iq_i^2$, then multiplies the result by
    $-r_0$ and divides by the number of formula units in the cell
    CITE{Ewald}.
  formula-rock-salt: >-
    The rock-salt row also satisfies Benson's identity
    $M=12\pi\sum_{m,n\geq1,\ m,n\ {\rm odd}}
    \operatorname{sech}^2(\frac{\pi}{2}\sqrt{m^2+n^2})$
    CITE{MathWorld}.

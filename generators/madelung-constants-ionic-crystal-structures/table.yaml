Title: Madelung constants of the ionic crystal structures
Definition: >-
  For an ionic crystal structure with formal charges $q_j$ on a periodic
  point-ion arrangement, listed is the positive Madelung constant $M$ in
  $E_{\rm f.u.}=-M e^2/(4\pi\varepsilon_0 r_0)$, where $E_{\rm f.u.}$ is the
  electrostatic energy per formula unit and $r_0$ is the shortest
  cation-anion distance CITE{Wiki}.

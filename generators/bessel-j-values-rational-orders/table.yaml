# The table document for T187, the first kind. It began as proposal 1 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which proposed both kinds in
# one table; the second kind is T190. One function per table, as T20 and T21
# are the zeros of the two kinds and T22 and T23 their extrema.
Title: Values of Bessel functions of the first kind $J_\nu(x)$
Definition: This table gives the real principal values of the Bessel function
  of the first kind $J_\nu(x)$ CITE{Wiki} CITE{DLMFBesselDefinitions}, for rational
  order $\nu\geq0$ and rational argument $x>0$.
Keywords:
- Bessel J
- Bessel function of the first kind
- Bessel J values
- J0(1)
- cylinder functions
Parameters:
  nu:
    type: Q
    title: order
    display: $\nu$
    constraints: $\nu\in\mathbb{Q}$, $\nu\geq0$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments:
  comment-branches: 'The principal branch is that of CITE{DLMFBesselDefinitions}.
    For real $\nu$ and $x>0$, $J_\nu(x)$ is real. Unlike $Y_\nu$, which is singular
    at the origin, $J_\nu$ is regular there: $J_0(0)=1$ and $J_\nu(0)=0$ for $\nu>0$.
    The table begins above $x=0$ all the same, so that it and HREF{Values_of_Bessel_functions_of_the_second_kind}[the
    table of $Y_\nu$] cover the same arguments.'
  comment-negative-orders: Negative integer orders are not listed separately;
    they reduce to positive integer orders by CITE{formula-negative-integer-orders}.
    For nonintegral negative orders, the connection formulas in CITE{DLMFConnections}
    express the values through $J_\nu(x)$ and $Y_\nu(x)$.
  comment-spherical: These are the ordinary cylindrical Bessel functions. The
    spherical Bessel function of the first kind is $\mathrm{j}_n(x)=\sqrt{\pi/(2x)}J_{n+1/2}(x)$
    CITE{DLMFSpherical}.
  comment-half-integers: Half-integer orders are elementary. HREF{Bessel_polynomials}[The
    Bessel polynomials] occur in explicit formulas for the associated spherical
    and modified spherical functions CITE{DLMFSphericalExplicit}.
Formulas:
  formula-recurrence: If $C_\nu$ is either $J_\nu$ or $Y_\nu$, then $C_{\nu-1}(x)+C_{\nu+1}(x)=2\nu
    C_\nu(x)/x$ CITE{DLMFRecurrences}.
  formula-negative-integer-orders: For an integer $n$, $J_{-n}(x)=(-1)^nJ_n(x)$
    CITE{DLMFConnections}.
  formula-half-order: $J_{1/2}(x)=\sqrt{2/(\pi x)}\sin x$.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.complex_arb import ComplexBallField

      from sage.rings.rational_field import QQ


      CBF = ComplexBallField(numberdb.bits(100, losing=64))

      nu = CBF(QQ(0))

      x = CBF(QQ(1))

      # Sage''s arb method is called on the argument and takes the order.

      x.bessel_J(nu).real()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.besselj(0, 1)'

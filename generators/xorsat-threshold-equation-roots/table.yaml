# the API (X-Draft: yes) and is filled by generate.py beside it; publishing is
# a person's act on the site.
Title: Roots of the $k$-XORSAT threshold equation
Definition: >-
  For $k\geq3$, random $k$-XORSAT CITE{WikiXORSAT} is a system of linear
  equations over $\mathbb{F}_2$, each involving $k$ Boolean variables. The
  number $\xi_k$ is the positive real solution of
  $k=\xi(1-e^{-\xi})/(1-e^{-\xi}-\xi e^{-\xi})$, the auxiliary root used to
  write its satisfiability threshold CITE{PittelSorkin}.
Keywords: XOR-SAT, random linear systems over GF(2), satisfiability threshold, p-spin model
Parameters:
  k:
    type: Z
    title: number of variables in each equation
    display: $k$
    constraints: $k\geq3$
Comments:
  comment-convention: >-
    The notation and indexing match
    HREF{Satisfiability_thresholds_of_random_k-XORSAT}[the satisfiability
    threshold table]: $\xi_k$ is the root that gives
    $\alpha_k=\xi_k/(k(1-e^{-\xi_k})^{k-1})$.
Formulas:
  formula-root: >-
    $\psi(\xi_k)=k$, where
    $\psi(x)=\frac{x(1-e^{-x})}{1-e^{-x}-xe^{-x}}$.
  formula-threshold: >-
    $\alpha_k=\frac{\xi_k}{k(1-e^{-\xi_k})^{k-1}}$ for $k\geq3$
    CITE{PittelSorkin}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      k = 3
      psi = lambda x: x*(1-mp.e**(-x))/(1-mp.e**(-x)-x*mp.e**(-x))
      xi = mp.findroot(lambda x: psi(x) - k, k)
      print(xi)
Similar tables:
  - table: HREF{Satisfiability_thresholds_of_random_k-XORSAT}[Satisfiability thresholds of random $k$-XORSAT]
    relation: thresholds obtained from these roots by the formula for $\alpha_k$

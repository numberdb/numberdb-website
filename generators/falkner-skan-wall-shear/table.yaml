# empty draft when this build reached it; this file is the replacement document
# that is sent with the computed entries.
Title: Wall shear $f''(0)$ of the Falkner-Skan wedge flows
Definition: >-
  The Falkner-Skan wedge flow is the upper-branch solution of
  $f'''+ff''+\beta(1-(f')^2)=0$, with $f(0)=f'(0)=0$ and
  $f'(\infty)=1$ in Hartree variables CITE{Hartree} CITE{WikiFalknerSkan}.
  Each pair of rows gives the same wall shear $f''(0)$ in the Hartree and
  wedge coordinate conventions.
Keywords:
  - Falkner Skan wall shear
  - Blasius wall shear
  - Hiemenz flow wall shear
  - Hartree profiles
Parameters:
  beta:
    type: Q
    title: Hartree pressure-gradient parameter
    display: $\beta$
    constraints: $\beta$ is rational and lies on a Falkner-Skan upper branch
  branch:
    type: Symbolic
    title: branch
    display: branch
    constraints: either `upper` or `lower`
    values:
      upper: upper branch
      lower: lower branch
  normalisation:
    type: Symbolic
    title: normalisation
    display: normalisation
    constraints: either `hartree` or `wedge`
    values:
      hartree: Hartree
      wedge: wedge
Comments:
  comment-normalisations: >-
    The `hartree` rows use Hartree's coordinate and equation. The `wedge`
    rows use $\eta_w=y\sqrt{u_e/(\nu x)}$ and
    $f'''+\tfrac{m+1}{2}ff''+m(1-(f')^2)=0$, where
    $m=\beta/(2-\beta)$. Formula CITE{formula-normalisation} gives the
    conversion between the two wall-shear normalisations.
  comment-branch: >-
    The upper branch is the solution with $f''(0)>0$ and $f'(\eta)$ tending
    to $1$ from below. Hartree identifies this branch as the one used for the
    boundary-layer application when negative-$\beta$ solutions are not unique
    CITE{Hartree}.
  comment-range: >-
    The present rows stop at $\beta=1.33$, the largest two-decimal grid point
    not exceeding the Hartree and Schlichting tabulation endpoint
    $\beta=4/3$. The profiles with $4/3<\beta<2$ are not included here
    because sources disagree about whether they belong to the physical
    wedge-flow table.
Formulas:
  formula-m-beta: >-
    The Hartree parameter and the power-law exponent in
    $u_e(x)=U_0(x/L)^m$ are related by $m=\beta/(2-\beta)$.
  formula-normalisation: >-
    The wedge and Hartree wall shears satisfy
    $f''_{\mathrm{wedge}}(0)=f''_{\mathrm{Hartree}}(0)/\sqrt{2-\beta}$.
  formula-momentum-integral: >-
    In Hartree's normalisation, if $\delta_1$ is the
    HREF{T415}[displacement thickness] and $\delta_2$ is the
    HREF{T416}[momentum thickness], then
    $f''(0)=\beta\delta_1+(1+\beta)\delta_2$.
Programs:
  program-sage:
    language: Sage
    code: |-
      # The attached generate.py reproduces the stored grid and its checks.

Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every two-decimal $\beta$ with $-0.19\leq\beta\leq1.99$ on the
    upper branch, in the wedge and Hartree normalisations
  rigour details: >-
    Each Hartree-normalised value is found by shooting on $f''(0)$, integrating
    the initial-value problem with a constant-memory Taylor method and imposing
    $f'(\eta_{\max})=1$ at $\eta_{\max}=18$. The generator computes each value
    twice, with different working precision and Taylor step size, and stores
    the digits that agree. The $\beta=0$ row is also checked by Toepfer's
    scaling of the Blasius equation, and selected rows are checked against the
    values tabulated in CITE{Asaithambi}.
Display properties:
  number-header: $f''(0)$
  group parameters:

Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  sources:
    - CITE{Hartree}
    - CITE{SchlichtingGersten}
    - CITE{Asaithambi}
  complete: no
  complete-note: >-
    it holds both Hartree and wedge normalisations on the upper branch for
    every two-decimal value of $\beta$ from $-0.19$ through $1.33$; the lower
    branch and the profiles with $4/3<\beta<2$ are not included
  rigour details: >-
    Values are computed by solving the Falkner-Skan boundary-value problem on
    $0\leq\eta\leq40$ with SciPy's collocation solver and storing 12
    significant digits. The generator checks selected rows against a
    fixed-step RK4 shooting computation, checks the Blasius row against
    Toepfer's scaling, checks selected rows against rounded values tabulated
    in CITE{Asaithambi}, and checks Formula CITE{formula-momentum-integral}
    on every computed Hartree row.

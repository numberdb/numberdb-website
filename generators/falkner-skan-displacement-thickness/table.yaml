    url: https://farside.ph.utexas.edu/teaching/336L/Fluidhtml/node112.html
  Review:
    title: "On Solving the Nonlinear Falkner-Skan Boundary-Value Problem: A Review"
    url: https://www.mdpi.com/2311-5521/6/4/153
References:
  SchlichtingGersten:
    bib: Schlichting, H. and Gersten, K., Boundary-Layer Theory, 9th ed., Springer, 2017.
  FalknerSkan:
    bib: Falkner, V. M. and Skan, S. W., Some approximate solutions of the boundary layer equations, Philosophical Magazine 12 (1931), 865-896.
    doi: 10.1080/14786443109461870
  Hartree:
    bib: Hartree, D. R., On an equation occurring in Falkner and Skan approximate treatment of the equations of the boundary layer, Proceedings of the Cambridge Philosophical Society 33 (1937), 223-239.
    doi: 10.1017/S0305004100019575
Programs:
  program-sage:
    language: Sage
    code: |-
      # The attached generate.py reproduces the stored grid and its checks.
Data properties:
  type: R
  complete: no
  complete-note: >-
    it holds every $\beta=a/100$ with $-19\leq a\leq199$ on the upper branch,
    in both the wedge and Hartree normalisations
  rigour: heuristic (agreement-checked)
  rigour details: >-
    The values are finite-interval boundary-value solves on $0\leq\eta\leq40$
    using SciPy's collocation solver with tolerance $10^{-10}$, stored to 12
    significant digits. The generator checks selected rows against a
    fixed-step RK4 shooting computation, checks the rounded Hartree-profile
    values tabulated by Schlichting and Gersten, and checks the momentum
    integral identity over the whole stored grid.
Display properties:
  number-header: $\delta_1$

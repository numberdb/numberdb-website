Title: Displacement thickness $\delta_1$ of the Falkner-Skan wedge flows
Definition: >-
  For the Falkner-Skan upper-branch solution $f$ with wedge parameter
  $\beta=2m/(m+1)$, this table gives the dimensionless displacement thickness
  $\delta_1=\int_0^\infty (1-f'(\eta))\,d\eta$. The wedge normalisation uses
  $\eta=y\sqrt{u_e/(\nu x)}$; the Hartree normalisation uses
  $\eta_\beta=\eta\sqrt{(m+1)/2}$.
Keywords:
  - Falkner Skan displacement thickness
  - Blasius displacement thickness
  - Hartree profiles
Parameters:
  beta:
    type: Q
    title: wedge parameter
    display: $\beta$
    constraints: $\beta_s<\beta<2$, where $\beta_s=-0.19883\ldots$ is the separation value
  branch:
    type: Symbolic
    title: solution branch
    display: branch
    constraints: one of `upper` and `lower`
    values:
      upper: upper branch
      lower: lower branch
  normalisation:
    type: Symbolic
    title: normalisation
    display: normalisation
    constraints: one of `wedge` and `hartree`
    values:
      wedge: wedge coordinate $\eta$
      hartree: Hartree coordinate $\eta_\beta$
Comments:
  comment-branches: >-
    For $\beta_s<\beta<0$ there is also a reversed-flow lower branch. This
    table fills the upper branch, the branch tabulated by Hartree profiles
    CITE{SchlichtingGersten}.
  comment-normalisations: >-
    The two normalisations are both common in the literature. At $\beta=0$,
    the wedge form is the Blasius equation
    $2f'''+ff''=0$, while the Hartree form is $f'''+ff''=0$.
Formulas:
  formula-m: $m=\beta/(2-\beta)$.
  formula-conversion: >-
    If $\delta_{1,\mathrm{w}}$ and $\delta_{1,\mathrm{H}}$ are the wedge and
    Hartree normalisations, then
    $\delta_{1,\mathrm{H}}=\sqrt{(m+1)/2}\,\delta_{1,\mathrm{w}}$.
  formula-momentum: >-
    With $\delta_2$ the momentum thickness in the same normalisation, the
    Hartree form satisfies
    $f''(0)=\beta\delta_1+(1+\beta)\delta_2$.
Links:
  Wiki:
    title: "Wikipedia: Falkner-Skan boundary layer"
    url: https://en.wikipedia.org/wiki/Falkner%E2%80%93Skan_boundary_layer
  Fitzpatrick:

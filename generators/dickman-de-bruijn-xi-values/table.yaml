Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{HildebrandTenenbaum}
  complete: 'no'
  complete-note: >-
    it holds $\xi(u)$ at every $u$ of two decimal places with
    $1\leq u\leq12$
  rigour details: >-
    Each entry with $u>1$ is enclosed by bisection in Sage ball arithmetic,
    using `numberdb.bits(digits, losing=64)` bits. The endpoints of the final
    bracket are checked in ball arithmetic to give opposite signs for
    $e^x-1-ux$, and the stored value is the resulting interval. The row
    $u=1$ is exact. The generator checks every stored row against the
    Lambert-$W$ formula in CITE{formula-lambert-w}, and it checks the integer
    arguments $u=2,\ldots,7$ against
    HREF{Minimisers_in_the_core_threshold_formula_of_random_k-uniform_hypergraphs}[the
    core-threshold minimiser table], whose $r=2$ rows satisfy the same
    equation.
Display properties:
  number-header: $\xi(u)$

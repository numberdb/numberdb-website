Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every nonzero canonical symmetry class with
    $\ell_1,\ell_2,\ell_3\leq7$; this cutoff gives 752 rows and a 157 KB
    entries block, close to half the soft block limit
  rigour details: |-
    The generator evaluates the Wigner $3j$ finite sums in CITE{formula-3j} with exact rational arithmetic, using integer-scaled angular momenta so every factorial argument is checked before it is used. The exact result is a rational multiple of $\sqrt{q/\pi}$ with $q\in\mathbb{Q}_{>0}$, converted to an arb ball for the stored real value.

    Before any entry is returned, every row is compared with SageMath's exact `gaunt` function CITE{Sage}. The generator also recomputes every row at all pair permutations and simultaneous sign changes, checks CITE{formula-l-zero} wherever one degree is zero, and checks the $m_i=0$ rows by exact integration of products of HREF{Legendre_polynomials}[Legendre polynomials].

Data properties:
  type: C
  rigour: proven
  rigour details: >-
    The generator locates candidates by Newton iteration applied to
    $f(s)=\zeta'(s)$ and $f'(s)=\zeta''(s)$ in arb complex ball arithmetic.
    It runs two seed grids, one on half-integer heights and one on offset
    quarter-integer heights, and refuses to continue unless both grids find
    the same 58 candidates with $0<\operatorname{Im}\rho\leq200$.

    Each candidate is refined and then certified by a Krawczyk step on a
    complex ball $B$: with $m$ the centre of $B$ and
    $Y=1/\zeta''(m)$, the computed set
    $m-Y\zeta'(m)+(1-Y\zeta''(B))(B-m)$ must lie in the interior of $B$.
    This proves that $B$ contains a unique zero of $\zeta'$.

    The first entry is checked against the OEIS decimal expansions
    CITE{OEISReal} and CITE{OEISImag}.
  complete: 'no'
  complete-note: >-
    it holds the 58 certified non-real zeros found by the generator with
    $0<\operatorname{Im}\rho\leq200$; both seed grids found the same set
Display properties:
  number-header: $\rho_n$

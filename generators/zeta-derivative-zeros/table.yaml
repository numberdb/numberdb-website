Title: Zeros of the derivative $\zeta'(s)$ of the Riemann zeta function
Definition: >-
  $\zeta(s)$ is the Riemann zeta function CITE{DLMFZeta}. The table holds
  the non-real zeros $\rho_n$ of its derivative $\zeta'(s)$ with
  $\operatorname{Im}\rho_n>0$, ordered by increasing imaginary part and
  indexed from $n=1$.
Keywords:
  - zeta derivative zeros
  - Riemann hypothesis
  - Speiser theorem
Parameters:
  n:
    type: Z
    title: index of the zero
    display: $n$
    constraints: $n\geq1$
    comments: >-
      The zeros are ordered by increasing imaginary part; if two zeros had
      the same imaginary part, they would be ordered by increasing real part.
Comments:
  comment-conjugates: >-
    Since $\zeta'(\overline{s})=\overline{\zeta'(s)}$, the conjugate
    $\overline{\rho_n}$ is a zero whenever $\rho_n$ is. Only the zeros with
    positive imaginary part are entries.
  comment-real-zeros: >-
    The real zeros of $\zeta'$ are not entries. There is one such zero in
    each interval $(-2m-2,-2m)$ for $m\geq1$; the first is
    $-2.717262829204574\ldots$ CITE{OEISImag}.
  comment-rh: >-
    Speiser's theorem, in the form used by Levinson and Montgomery
    CITE{LevMon74}, says that the Riemann hypothesis is equivalent to
    $\zeta'$ having no non-real zeros with $0<\operatorname{Re}s<1/2$.
Formulas:
  formula-conjugation: >-
    $\zeta'(\overline{s})=\overline{\zeta'(s)}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage
      from sage.rings.complex_arb import ComplexBallField

      C = ComplexBallField(200)
      z = C("2.4631618694543212858743950533",
            "23.2983204927628579020109616")
      for _ in range(5):
          z = z - z.zetaderiv(1) / z.zetaderiv(2)
      print(z)

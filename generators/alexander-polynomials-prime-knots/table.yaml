Data properties:
  type: Z[]
  rigour: exact
  complete: 'yes'
  rigour details: >-
    Each polynomial is Sage's alexander_polynomial() of Knots().from_table(n, k),
    the determinant $\det(V-tV^{\mathsf T})$ of a Seifert matrix of the braid
    closure, normalised. Before it is written the generator requires it to
    agree with $\det(I-\psi(\beta))(1-t)/(1-t^n)$ computed from the reduced
    Burau matrix of the same braid word, with the matrices, their product and
    a Bareiss determinant written out in the generator rather than taken
    from a library; to satisfy $\Delta(1)=\pm1$, the symmetry
    $\Delta(t)=t^{2g}\Delta(1/t)$ and $|\Delta(-1)|=\det K$; to equal the
    closed form for the six torus knots; and the counts per crossing number
    must be $1,1,2,3,7,21,49,165$. Outside the generator all 250 values were
    compared with the alexander_polynomial column of KnotInfo (package
    database_knotinfo 2026.9.1, computed from KnotInfo's own diagrams), with
    the stored cyclotomic polynomials for the torus knots, and through the
    Conway substitution with Sage's conway_polynomial(); the genus,
    alternating, fibred and torus facts in the comments were compared with
    KnotInfo's columns. All agree, and the controls that must fail fail.
Display properties:
  number-header: $\Delta_{n_k}(t)$

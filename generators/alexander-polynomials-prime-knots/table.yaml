    relation: the Alexander polynomial of a torus knot is a product of cyclotomic polynomials; $\Delta(3_1)$, $\Delta(5_1)$, $\Delta(7_1)$ and $\Delta(10_{124})$ are $\Phi_6$, $\Phi_{10}$, $\Phi_{14}$ and $\Phi_{15}$

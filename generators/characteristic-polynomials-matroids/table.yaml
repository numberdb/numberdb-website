Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every uniform matroid $U_{r,n}$ with $2\leq r\leq n\leq11$ and
    every simple non-graphic Sage catalog matroid with at most $600$ flats,
    apart from catalog aliases for uniform matroids that are listed as
    `U(r,n)`
  rigour details: >-
    Every entry is an exact polynomial with integer coefficients. The generator
    computes Sage's characteristic polynomial for each finite matroid and
    coerces it to $\mathbb{Z}[q]$.

    Before the values were written, the build checked exactness, compared every
    uniform row with formula CITE{formula-uniform}, checked every row against an
    independent computation from the Mobius function of the lattice of flats,
    and checked the graphic matroids $M(K_4)$ and $M(K_5)$ against formula
    CITE{formula-graphic}.
Display properties:
  number-header: $\chi_M(q)$
  group parameters: [['matroid']]

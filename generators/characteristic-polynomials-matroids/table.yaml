Comments:
  comment-index: >-
    Uniform matroids are written `U(r,n)` for $U_{r,n}$. The named matroids use
    the constructors in Sage's matroid catalog CITE{SageCatalog}, which includes
    Oxley's appendix CITE{Oxley}. The catalog's uniform aliases `U24`, `U25`,
    `U35`, and `U36` are represented here by `U(2,4)`, `U(2,5)`, `U(3,5)`, and
    `U(3,6)`.
  comment-simple: >-
    A loop makes $\chi_M(q)=0$. For a loopless matroid, parallel elements do
    not change the lattice of flats, so $\chi_M(q)$ is the characteristic
    polynomial of the simplification. This table stores simple matroids.
  comment-flats: >-
    Equivalently, for a loopless matroid,
    $\chi_M(q)=\sum_{F\in L(M)}\mu(\varnothing,F)q^{r(E)-r(F)}$, where
    $L(M)$ is the lattice of flats and $\mu$ is its Möbius function
    CITE{WikiMatroid}.
  comment-variable: >-
    The variable is $q$. Sage prints the same polynomial in a variable called
    `l` unless another variable is supplied.
  comment-whitney: >-
    The coefficients are the Whitney numbers of the first kind:
    $\chi_M(q)=\sum_{i=0}^{r(E)}w_i(M)q^{r(E)-i}$, where
    $w_i(M)=\sum_{F\in L(M),\,r(F)=i}\mu(\varnothing,F)$.
Formulas:
  formula-tutte: >-
    If $T_M(x,y)$ is the Tutte polynomial of a rank $r(M)$ matroid, then
    $\chi_M(q)=(-1)^{r(M)}T_M(1-q,0)$. For cycle matroids of connected
    graphs, $T_M(x,y)$ is stored in
    HREF{Tutte_polynomials_of_connected_graphs}[Tutte polynomials of connected
    graphs].
  formula-uniform: >-
    For $1\leq r\leq n$,
    $\chi_{U_{r,n}}(q)=\sum_{k=0}^{r-1}(-1)^k\binom{n}{k}q^{r-k}
    +(-1)^r\binom{n-1}{r-1}$.
  formula-graphic: >-
    If $G$ has $c$ connected components and $M(G)$ is its cycle matroid, then
    $P_G(q)=q^c\chi_{M(G)}(q)$, where $P_G(q)$ is
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomial]
    of $G$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.matroids.catalog import Fano
      from sage.matroids.matroids_catalog import Uniform
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, "q")
      q = R.gen()
      R(Fano().characteristic_polynomial(q))
      R(Uniform(3, 12).characteristic_polynomial(q))
Similar tables:
  - table: HREF{Chromatic_polynomials_of_connected_graphs}[Chromatic polynomials of connected graphs]
    relation: holds $P_G(q)$ for connected graphs on at most seven vertices; formula CITE{formula-graphic} gives $\chi_{M(G)}(q)$
  - table: HREF{Tutte_polynomials_of_connected_graphs}[Tutte polynomials of connected graphs]
    relation: holds $T_G(x,y)$ for connected graphs on at most seven vertices; $T_G(x,y)=T_{M(G)}(x,y)$, so formula CITE{formula-tutte} gives $\chi_{M(G)}(q)$
  - table: HREF{Ehrhart_polynomials_of_the_hypersimplices}[Ehrhart polynomials of the hypersimplices]
    relation: holds the Ehrhart polynomial of the hypersimplex $\Delta(k,n)$, the matroid polytope of the uniform matroid $U_{k,n}$ whose characteristic polynomial is stored here
  - table: HREF{Ehrhart_h-star-polynomials_of_the_hypersimplices}[Ehrhart $h^*$-polynomials of the hypersimplices]
    relation: holds the Ehrhart $h^*$-polynomial of the hypersimplex $\Delta(k,n)$, the matroid polytope of the uniform matroid $U_{k,n}$

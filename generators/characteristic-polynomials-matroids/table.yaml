Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every simple uniform matroid $U_{r,n}$ with
    $2\leq r\leq n\leq11$, and every simple non-graphic Sage catalog matroid
    whose lattice-of-flats computation stayed within the build cutoff of
    $600$ flats; graphic catalog matroids are omitted because
    $P_G(q)=q^c\chi_{M(G)}(q)$ puts their values in the graph-indexed
    chromatic-polynomial table, and catalog aliases for uniform matroids are
    listed as `U(r,n)`
  rigour details: >-
    Every entry is an exact polynomial with integer coefficients. The generator
    computes Sage's characteristic polynomial for each finite matroid and
    coerces it to $\mathbb{Z}[q]$.

    Before the values were written, the build checked exactness, compared every
    uniform row with formula CITE{formula-uniform}, checked every row against an
    independent computation from the Möbius function of the lattice of flats,
    and, as a control on matroids this table does not hold, computed
    $\chi_{M(K_4)}$ and $\chi_{M(K_5)}$ and checked them against formula
    CITE{formula-graphic}.
Display properties:
  number-header: $\chi_M(q)$
  group parameters: [['matroid']]

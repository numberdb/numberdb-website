Title: Characteristic polynomials of matroids
Definition: >-
  For a finite matroid $M$ on ground set $E$ with rank function $r$, this
  table stores the characteristic polynomial
  $\chi_M(q)=\sum_{S\subseteq E}(-1)^{|S|}q^{r(E)-r(S)}$
  CITE{SageMatroid}.

Title: Minimal polynomials of the Salem numbers less than 1.3
Definition: >-
  Let $a=(a_0,\ldots,a_{d/2})$ be the first half of the reciprocal minimal
  polynomial of a Salem number $\tau<1.3$ CITE{Wiki}. The table stores the
  monic minimal polynomial $m_a(x)\in\mathbb{Z}[x]$ of $\tau$.
Parameters:
  coefficients:
    type: Symbolic
    title: leading coefficients of the minimal polynomial
    display: coefficients
    constraints: >-
      the coefficients $a_0,\ldots,a_{d/2}$ of $x^d,\ldots,x^{d/2}$ in the
      minimal polynomial of a Salem number of even degree $d$
Comments:
  comment-source: >-
    Mossinghoff's small-Salem-number list CITE{Mossinghoff1998} gives the
    degree, a decimal expansion of the Salem number, and the first half of the
    reciprocal minimal polynomial. The entries here are the reciprocal monic
    polynomials determined by those half-lists.
  comment-roots: >-
    The parameter is the same coefficient half-list used by
    HREF{Salem_numbers_less_than_1_3}[the Salem-number table]. Each entry
    comment links to the matching root there.
Formulas:
  formula-reciprocal: >-
    For coefficients $a_0,a_1,\ldots,a_{d/2}$, the polynomial is
    $m_a(x)=a_0x^d+a_1x^{d-1}+\cdots+a_{d/2}x^{d/2}+\cdots+a_1x+a_0$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<x> = ZZ[]
      half = [1, 1, 0, -1, -1, -1]
      d = 2*(len(half) - 1)
      sum(half[i]*x^(d - i) for i in range(len(half))) + sum(half[i]*x^i for i in range(len(half) - 1))
Similar tables:
  - table: HREF{Salem_numbers_less_than_1_3}[Salem numbers less than $1.3$]
    relation: stores the Salem root $\tau>1$ of each polynomial $m_a(x)$ held here

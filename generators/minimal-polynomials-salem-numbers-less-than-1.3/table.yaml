Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the minimal polynomials of the $47$ known Salem numbers below
    $1.3$ in Mossinghoff's list CITE{Mossinghoff}; the list is proved complete
    through degree $44$ CITE{MRW}, and the one degree-$46$ entry is also
    included
  rigour details: >-
    The generator parses the exact coefficient half-lists in Mossinghoff's
    archived table CITE{Mossinghoff}. It constructs the reciprocal polynomial
    in Formula CITE{formula-reciprocal}, checks irreducibility over
    $\mathbb{Q}$, checks the Salem root pattern, and stores the resulting
    monic integer polynomial exactly. It also verifies that the real root
    greater than $1$ lies in the corresponding interval in
    HREF{Salem_numbers_less_than_1_3}[the Salem-number table].
Display properties:
  number-header: $m_a(x)$

Title: Stirling convolution polynomials $\sigma_n(x)$
Definition: >-
  For an integer $n\geq 1$, the Stirling convolution polynomial
  $\sigma_n(x)$ is the polynomial in $\mathbb{Q}[x]$ determined by
  $[z^n]\left(\frac{ze^z}{e^z-1}\right)^x=x\sigma_n(x)$ CITE{Wiki}
  CITE{Knuth}.
Parameters:
  n:
    type: Z
    title: index
    display: $n$
    constraints: $n\geq 1$
Comments:
  comment-polynomial-range: >-
    The same generating function gives $\sigma_0(x)=1/x$, which is not a
    polynomial. This table starts at $n=1$ and stores the polynomial entries.
  comment-convention: >-
    Knuth CITE{Knuth} calls these convolution polynomials, and Concrete
    Mathematics CITE{Concrete} calls them Stirling polynomials. The same name
    is also used for the Sheffer sequence $S_n(x)$ of
    HREF{Stirling_polynomials}[Stirling polynomials], related by
    CITE{formula-stirling-polynomials}, and for the Gessel-Stanley
    polynomials formed from $\left\{{n+k\atop n}\right\}$ and
    $\left[{n\atop n-k}\right]$ as polynomials in $n$ for fixed $k$.
Formulas:
  formula-generating-function: >-
    $\left(\frac{ze^z}{e^z-1}\right)^x
    =\sum_{n=0}^{\infty}x\sigma_n(x)z^n$, with $\sigma_0(x)=1/x$.
  formula-stirling-polynomials: >-
    $S_n(x)=n!(x+1)\sigma_n(x+1)$, where $S_n(x)$ is the
    HREF{Stirling_polynomials}[Stirling polynomial] in the
    Sheffer-sequence convention.
  formula-recurrence: >-
    $(x+1)\sigma_n(x+1)=(x-n)\sigma_n(x)+x\sigma_{n-1}(x)$ for $n\geq1$,
    with $\sigma_0(x)=1/x$ CITE{Wiki}.
  formula-first-kind: >-
    If $m$ and $n$ are integers with $m>n\geq1$, then
    $m(m-1)\cdots(m-n)\sigma_n(m)=\left[{m\atop m-n}\right]$, where
    $\left[{a\atop b}\right]$ is an unsigned Stirling number of the first
    kind CITE{Wiki} CITE{OEISFirstKind}.
  formula-second-kind: >-
    If $m$ and $n$ are integers with $m>n\geq1$, then
    $m(m-1)\cdots(m-n)(-1)^{n+1}\sigma_n(n-m)=\left\{{m\atop m-n}\right\}$,
    where $\left\{{a\atop b}\right\}$ is a Stirling number of the second
    kind CITE{OEISSecondKind}. These numbers are the coefficients of the
    HREF{Touchard_polynomials}[Touchard polynomials].
  formula-bernoulli-value: >-
    $\sigma_n(0)=-B_n/(n\,n!)$, where $B_n$ is the
    HREF{Bernoulli_numbers}[Bernoulli number] with $B_1=-\tfrac12$.
  formula-noerlund: >-
    If $B_n^{(a)}$ is defined by
    $\left(\frac{t}{e^t-1}\right)^a=\sum_{n=0}^{\infty}B_n^{(a)}t^n/n!$,
    then $B_n^{(x)}=(-1)^n n!x\sigma_n(x)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<x> = QQ[]

      def stirling_convolution_polynomial(n):
          S.<z> = PowerSeriesRing(R, default_prec=n + 2)
          f = (x * (z / (1 - exp(-z))).log()).exp()
          return R(f[n] / x)

      stirling_convolution_polynomial(26)      # the next one after this table

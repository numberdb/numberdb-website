Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every index $n$ with $1\leq n\leq25$
  rigour details: >-
    The generator expands $\left(z/(1-e^{-z})\right)^x$ as
    $(1+b(z))^x$ over Sage's rational polynomial ring and divides the
    coefficient of $z^n$ by $x$. Every division is made in Sage's rational
    field. Before the draft was created, the entries were checked against the
    polynomials $\sigma_1$ through $\sigma_{10}$ printed by CITE{Wiki},
    against CITE{formula-recurrence}, CITE{formula-first-kind},
    CITE{formula-second-kind}, CITE{formula-bernoulli-value}, and
    CITE{formula-stirling-polynomials} on every entry, using the stored
    values of HREF{Stirling_polynomials}[Stirling polynomials] for the last
    comparison. The Noerlund relation in CITE{formula-noerlund} was checked
    against OEIS A100655 CITE{OEISNorlundNumerators} and A001898
    CITE{OEISNorlundDenominators} through $n=8$.
Display properties:

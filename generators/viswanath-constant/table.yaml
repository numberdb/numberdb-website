# The table document for T189, split out of the random Fibonacci row of
# T171. The value is transcribed; see generate.py beside this file.
Title: Viswanath's constant
Definition: Let $t_1=t_2=1$ and $t_n=\pm t_{n-1}\pm t_{n-2}$, each sign independent
  and each of the two values equally likely. Viswanath's constant $V$ is the almost-sure
  limit $V=\lim_{n\to\infty}|t_n|^{1/n}$ CITE{Viswanath} CITE{WikiViswanath}.
  The random Fibonacci sequence grows exponentially, at a rate that does not depend
  on the signs drawn.
Keywords:
- random Fibonacci sequence
- Viswanath constant
- vibonacci
- random Fibonacci growth rate
Parameters: ''
Comments:
  comment-hard: 'The constant is hard to compute: it is the Lyapunov exponent
    of a product of random matrices, and there is no series for it. OEIS marks
    the expansion `hard` CITE{OEISA078416} and holds fourteen significant digits;
    three further digits proposed in 2017 were withdrawn in 2018 as doubtful.
    What is stored here is what is not in doubt.'
  comment-lyapunov: $\log V$ is the Lyapunov exponent of the random Fibonacci
    recurrence, and is listed with the other exponents in HREF{Lyapunov_exponents_of_classical_chaotic_systems}[Lyapunov
    exponents of classical chaotic systems].
  comment-rigorous: Oliveira and de Figueiredo computed $V$ in interval arithmetic
    CITE{OliveiraFigueiredo}, so an enclosure rather than an estimate exists in
    the literature; Bai later extended the expansion by a cycle expansion CITE{Bai}.
Formulas:
  formula-lyapunov: $\log V=\lim_{n\to\infty}\frac{1}{n}\log|t_n|$ almost surely,
    which is the Lyapunov exponent of the product of the random matrices $\begin{pmatrix}\pm1&\pm1\\1&0\end{pmatrix}$.
Similar tables:
- table: HREF{Lyapunov_exponents_of_classical_chaotic_systems}[Lyapunov exponents
    of classical chaotic systems]
  relation: holds $\log V$, the Lyapunov exponent of the same recurrence
- table: HREF{Golden_ratio#phi}[the golden ratio $\varphi$]
  relation: the growth rate of the Fibonacci sequence itself, where every sign
    is $+$; $V<\varphi$

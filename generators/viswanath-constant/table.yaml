    CITE{OliveiraFigueiredo} and this table does not reproduce it, which is why
    the rigour is `heuristic` rather than `proven`. Three digits beyond the fourteen
    were proposed in 2017 and withdrawn in 2018 as doubtful, and are not stored.'

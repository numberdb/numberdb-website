  rigour details: 'Transcribed from OEIS A078416 CITE{OEISA078416}, which holds
    fourteen significant digits and marks the expansion `hard`. It is written
    with the precision it claims under NumberDB''s decimal convention, so the
    last digit is the uncertain one.



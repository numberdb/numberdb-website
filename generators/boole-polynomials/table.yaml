Title: Boole polynomials $r_n(x)$
Definition: >-
  For an integer $n\geq 0$, Jordan's Boole polynomial $r_n(x)$ is the
  polynomial in $\mathbb{Q}[x]$ defined by
  $\sum_{n=0}^{\infty}r_n(x)\frac{t^n}{n!}
  =\frac{2(1+t)^x}{2+t}$ CITE{MathWorld}.
Parameters:
  n:
    type: Z
    title: index
    display: $n$
    constraints: $n\geq 0$
Comments:
  comment-convention: >-
    The name Boole polynomials is also used for the two-variable family
    $s_n(x;\lambda)$, defined by
    $\sum_{n=0}^{\infty}s_n(x;\lambda)t^n/n!
    =(1+t)^x/(1+(1+t)^\lambda)$ CITE{Wiki} CITE{MathWorld}. This table
    stores Jordan's one-variable normalisation, for which
    $r_n(x)=2s_n(x;1)$.
  comment-finite-differences: >-
    The HREF{Euler_polynomials}[Euler polynomials] are the derivative
    analogue of this finite-difference family. Replacing
    $2/(2+t)$ by $t/\log(1+t)$ gives the
    HREF{Bernoulli_polynomials_of_the_second_kind}[Bernoulli polynomials of
    the second kind].
Formulas:
  formula-generating-function: >-
    $\sum_{n=0}^{\infty}r_n(x)\frac{t^n}{n!}=\frac{2(1+t)^x}{2+t}$.
  formula-explicit: >-
    $r_n(x)=n!\sum_{j=0}^{n}\binom{x}{j}\left(-\frac12\right)^{n-j}$,
    where $\binom{x}{j}=x(x-1)\cdots(x-j+1)/j!$.
  formula-finite-difference: >-
    $r_n(x+1)+r_n(x)=2(x)_n$, where
    $(x)_n=x(x-1)\cdots(x-n+1)$ and $(x)_0=1$.
  formula-euler-transform: >-
    $r_n(x)=\sum_{m=0}^{n}s(n,m)E_m(x)$, where $s(n,m)$ is the signed
    Stirling number of the first kind and $E_m(x)$ is the
    HREF{Euler_polynomials}[Euler polynomial].
  formula-special-value: >-
    $r_n(0)=(-1)^n n!/2^n$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.arith.misc import factorial
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing
      from sage.rings.rational_field import QQ

      R = PolynomialRing(QQ, 'x')
      x = R.gen()

      def binomial_x(j):
          value = R.one()
          for m in range(j):
              value *= x - QQ(m)
              value /= QQ(m + 1)
          return value

      def boole_polynomial(n):
          coefficient = R.zero()
          for j in range(n + 1):
              coefficient += binomial_x(j) * QQ((-1)**(n - j)) / QQ(2**(n - j))
          return coefficient * QQ(factorial(n))

      boole_polynomial(31)      # the next one after this table

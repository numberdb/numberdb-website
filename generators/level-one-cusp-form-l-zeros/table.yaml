Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds the first twenty positive zero ordinates for every even weight
    $12\leq k\leq40$ with
    $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$ and every eigenform in the
    increasing-$a_2$ ordering
  rigour details: >-
    The generator uses PARI/GP's `lfunmf` and `lfunzeros` CITE{PARILfun} at
    two bit precisions, sorts the embedded $L$-functions by the real value of
    $a_2$, and stores only digits that agree between the two runs. A separate
    check evaluates the $L$-function near the stored ordinates and checks the
    functional equation with `lfuncheckfeq`. PARI's zero search is not a
    certified enclosure method, so the table does not claim proven zeros.
Display properties:
  number-header: $t_n$
  group parameters: [['k'], ['i'], ['n']]
Numbers: []

Title: Zeros of the $L$-functions of level one cusp forms
Definition: >-
  For the $i$th normalised Hecke eigenform
  $f_{k,i}(q)=\sum_{m\geq1}a_mq^m$ in
  $S_k(\mathrm{SL}_2(\mathbb{Z}))$ CITE{WikiCusp}, ordered by increasing real
  $T_2$-eigenvalue $a_2$, this table gives the positive ordinates $t_n$ of
  zeros $L(f_{k,i},k/2+\mathrm{i}t_n)=0$ of its $L$-function CITE{WikiL} on
  the critical line.
Parameters:
  k:
    type: Z
    title: weight
    display: $k$
    constraints: $k$ is even and $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$
  i:
    type: Z
    title: position by increasing $a_2$
    display: $i$
    constraints: >-
      $1\leq i\leq\dim S_k(\mathrm{SL}_2(\mathbb{Z}))$, with positions counted
      after sorting the eigenforms by increasing $a_2$
  n:
    type: Z
    title: index of the positive zero
    display: $n$
    constraints: $n\geq1$
    comments: >-
      For fixed $k$ and $i$, the positive ordinates are ordered increasingly
      and counted from $n=1$.
Comments:
  comment-normalisation: >-
    The table uses the arithmetic normalisation: $a_1=1$ and
    $L(f,s)$ is the analytic continuation of $\sum a_mm^{-s}$ from its
    half-plane of convergence, so the critical strip is
    $0<\operatorname{Re}s<k$ and the centre is $s=k/2$. The analytic
    normalisation often written with centre $1/2$ is obtained by shifting
    $s$ by $(k-1)/2$.
  comment-ordering: >-
    Library orderings are not used as table orderings. In each weight, the
    generator embeds the Hecke field into the real numbers, computes the
    corresponding value of $a_2$, and then sorts the forms by that real value.
    Each entry comment names the same $a_2$ ordering through the row
    $(k,2)$ of
    HREF{Hecke_polynomials_of_level_one_cusp_forms}[the Hecke polynomial
    table].
  comment-central-zero: >-
    The sign of the functional equation is $(-1)^{k/2}$, so for
    $k\equiv2\pmod4$ the central value $L(f,k/2)$ vanishes and the central
    zero has order $1$. Those forced zeros are omitted from the entries rather
    than making every search for $0$ match this table.
  comment-symmetry: >-
    The forms in this table are self-dual, so the noncentral critical-line
    zeros occur in pairs $k/2\pm\mathrm{i}t$. Only the positive ordinates
    $t>0$ are listed.
Formulas:
  formula-completed: >-
    The completed $L$-function is
    $\Lambda(f,s)=(2\pi)^{-s}\Gamma(s)L(f,s)$, and for level one it satisfies
    $\Lambda(f,s)=(-1)^{k/2}\Lambda(f,k-s)$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      default(realbitprecision, 330);
      k = 24; i = 1; n = 1;
      mf = mfinit([1,k], 0);
      Ls = concat(lfunmf(mf));
      P = vecsort(vector(#Ls, j, [real(lfunan(Ls[j], 2)[2]), Ls[j]]), 1);
      lfunzeros(P[i][2], 50)[n]       \\ 1.88602626271288641226254344200...

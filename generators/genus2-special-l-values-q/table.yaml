Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every LMFDB genus $2$ isogeny class of odd conductor
    $N\leq1000$ whose analytic rank and leading coefficient are recorded in
    the LMFDB genus $2$ curve data
  rigour details: >-
    The generator uses the $41$ odd-conductor LMFDB genus $2$ isogeny classes
    with conductor $N\leq1000$, grouped from $56$ curve rows. For each class
    it builds the PARI L-function CITE{PARILfun} with `lfungenus2([P,Q])`
    from the representative curve $y^2+Q(x)y=P(x)$, computes
    `lfun(L,1,r,bitprec)/r!` at $60$ and $80$ decimal working digits using
    explicit bit precision, and stores the digits that agree. Before the
    draft was created, PARI's `lfunorderzero` agreed with the LMFDB analytic
    rank on all $41$ classes, `lfuncheckfeq(L,None,330)` returned between
    $-339$ and $-331$, and the computed values agreed with the LMFDB
    `leading_coeff` fields, including CITE{LMFDBData169}. The BSD quotient
    from the LMFDB period, regulator, Tamagawa product, analytic order of
    $\Sha$, and torsion order agreed to the precision those source fields
    carry.
Display properties:
  number-header: leading coefficient
  group parameters: [['label'], ['rank']]

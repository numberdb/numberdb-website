Title: Special $L$-values of genus 2 curves over $\mathbb{Q}$
Definition: >-
  Let $C/\mathbb{Q}$ be a genus $2$ curve and let $A=\operatorname{Jac}(C)$.
  This table gives the leading Taylor coefficient
  $L^{(r)}(A,1)/r!$ CITE{LMFDBBSD} of the Hasse-Weil $L$-function
  $L(A,s)$ CITE{WikiHasseWeil} in the arithmetic normalisation, where $r$
  is the analytic rank of $A$.
Parameters:
  label:
    type: Symbolic
    title: LMFDB isogeny class label
    display: label
  rank:
    type: Z
    title: analytic rank
    display: $r$
    constraints: $r\geq 0$
Comments:
  comment-class-labels: >-
    The label is the LMFDB isogeny class label for the Jacobian of $C$
    CITE{LMFDBGenus2}. There is one row for each isogeny class, because
    $L(A,s)$ is an isogeny invariant; each entry comment names one
    representative curve and its model $y^2+h(x)y=f(x)$.
  comment-normalisation: >-
    The arithmetic normalisation has centre $s=1$ and functional equation
    $s\leftrightarrow 2-s$, as in the LMFDB genus $2$ data and PARI's
    `lfungenus2` CITE{PARILfun}.
  comment-rank: >-
    When $r=0$ the stored value is $L(A,1)$, and when $r=1$ it is
    $L'(A,1)$. The factor $1/r!$ is part of the definition for every rank.
  comment-even-conductors: >-
    Only odd conductors are listed. PARI's documentation for `lfungenus2`
    says that when the conductor is even, its valuation at $2$ may be
    incorrect CITE{PARILfun}; those classes need the local Euler factor at
    $2$ supplied separately before their values can be computed by this
    method.
Formulas:
  formula-leading-coefficient: >-
    If $L(A,s)=\sum_{m\geq r} c_m(s-1)^m$ with $c_r\neq 0$, then the table
    stores $c_r=L^{(r)}(A,1)/r!$.
  formula-euler-product: >-
    At a prime $p$ of good reduction, the local factor is
    $P_p(p^{-s})^{-1}$, where
    $P_p(t)=\det(1-t\operatorname{Frob}_p\mid T_\ell A)$.
  formula-bsd: >-
    The Birch and Swinnerton-Dyer conjecture predicts
    $L^{(r)}(A,1)/r! = \Omega_A R_A |\Sha(A)|\prod_p c_p /
    |A(\mathbb{Q})_{\mathrm{tors}}|^2$, with the factors named as in the
    LMFDB BSD invariants CITE{LMFDBBSD}.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      default(realbitprecision, 320);
      P = x^5 + x^4;
      Q = x^3 + x + 1;
      L = lfungenus2([P, Q]);        \\ L-function of 169.a.169.1
      r = lfunorderzero(L, 1);
      lfun(L, 1, r) / r!             \\ 0.090490390832429629113589757258...
      lfuncheckfeq(L)                \\ about -320

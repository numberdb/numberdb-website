Title: Macdonald–Kostka polynomials $\tilde K_{\lambda\mu}(q,t)$
Definition: >-
  The Macdonald-Kostka polynomial $\tilde K_{\lambda\mu}(q,t)$ is the
  coefficient of the Schur polynomial $s_\lambda$ in the expansion
  $\tilde H_\mu(x;q,t)=\sum_\lambda \tilde K_{\lambda\mu}(q,t)s_\lambda$ of
  the modified Macdonald polynomial $\tilde H_\mu$ CITE{HHL}.
Parameters:
  lambda:
    type: Symbolic
    title: shape
    display: $\lambda$
    constraints: a partition of a positive integer, other than a single row or a single column
  mu:
    type: Symbolic
    title: Macdonald shape
    display: $\mu$
    constraints: a partition of $|\lambda|$
Comments:
  convention: >-
    A partition is written as its parts, largest first, separated by commas:
    $3,2,1$ is the partition $(3,2,1)$ of $6$. This table uses the
    Haglund-Haiman-Loehr convention CITE{HHL}, where
    $\tilde H_{(n)}$ has powers of $q$ and $\tilde H_{(1^n)}$ has powers of
    $t$.
  swapped-variables: >-
    Some sources interchange $q$ and $t$. By CITE{formula-duality}, that
    convention sends the row with Macdonald shape $\mu$ to the row with
    Macdonald shape $\mu'$.
  omitted-rows: >-
    The single-row and single-column Schur coefficients are not stored as
    entries. They are the closed forms in CITE{formula-edges}.
Formulas:
  formula-transition: >-
    $\tilde H_\mu(x;q,t)=\sum_\lambda \tilde K_{\lambda\mu}(q,t)s_\lambda$.
  formula-macdonald-kostka: >-
    $\tilde K_{\lambda\mu}(q,t)=t^{n(\mu)}K_{\lambda\mu}(q,t^{-1})$, where
    $n(\mu)=\sum_i(i-1)\mu_i$ and $K_{\lambda\mu}(q,t)$ is Macdonald's
    two-variable Kostka coefficient CITE{SageMacdonald}.
  formula-hall-littlewood: >-
    $\tilde K_{\lambda\mu}(0,t)=t^{n(\mu)}K_{\lambda\mu}(t^{-1})$, where
    $K_{\lambda\mu}(t)$ is the Kostka-Foulkes polynomial HREF{T259}.
  formula-one-one: >-
    $\tilde K_{\lambda\mu}(1,1)=f^\lambda$, the number of standard Young
    tableaux of shape $\lambda$.
  formula-hook: >-
    For a hook shape $\lambda=(n-k,1^k)$,
    $\tilde K_{\lambda\mu}(q,t)=e_k[B_\mu-1]$, with
    $B_\mu=\sum_{(i,j)\in\mu}q^jt^i$ and zero-based row and column indices.
  formula-duality: >-
    $\tilde K_{\lambda\mu'}(q,t)=\tilde K_{\lambda\mu}(t,q)$.
  formula-edges: >-
    $\tilde K_{(n),\mu}(q,t)=1$ and
    $\tilde K_{(1^n),\mu}(q,t)=q^{n(\mu')}t^{n(\mu)}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.combinat.partition import Partition
      from sage.combinat.sf.macdonald import qt_kostka

      K = qt_kostka([3, 2, 1], [3, 2, 1])
      q, t = K.parent().gens()
      K.subs({t: 1/t}) * t^Partition([3, 2, 1]).weighted_size()

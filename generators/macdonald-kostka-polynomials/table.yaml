Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every nontrivial coefficient with
    $2\leq|\lambda|=|\mu|\leq8$; the omitted single-row and single-column
    cases are given by CITE{formula-edges}, and size $9$ would add $840$
    stored rows, past the soft entry limit of $1200$
  rigour details: >-
    Every entry is an exact polynomial with integer coefficients. The
    generator computes $t^{n(\mu)}K_{\lambda\mu}(q,t^{-1})$ using Sage's
    `qt_kostka` CITE{SageMacdonald}, then coerces the result to
    $\mathbb{Z}[q,t]$.

    The rows are compared with the Haglund-Haiman-Loehr filling formula
    CITE{HHL} for every Schur coefficient with $|\mu|\leq6$. They are also
    compared with the specialization at $q=0$ to HREF{T259}[the
    Kostka-Foulkes polynomials], with the hook formula
    CITE{formula-hook}, with the duality CITE{formula-duality}, with the
    edge formulas CITE{formula-edges}, and with the specialization
    $\tilde K_{\lambda\mu}(1,1)=f^\lambda$ from the hook-length formula.
Display properties:
  number-header: $\tilde K_{\lambda\mu}(q,t)$

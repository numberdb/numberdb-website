Title: Known solutions of the Fermat-Catalan equation $x^p+y^q=z^r$
Definition: >-
  Known coprime positive-integer solutions of the Fermat-Catalan equation
  $x^p+y^q=z^r$ CITE{Sikora2024}, with $xyz>1$,
  $\frac1p+\frac1q+\frac1r<1$ and $x^p<y^q$. The stored integers $x$, $y$,
  $z$ and $z^r$ are parts of one solution.
Parameters:
  sum:
    type: Z
    title: sum
    display: $z^r$
    constraints: >-
      a perfect power $z^r$ from a coprime solution of $x^p+y^q=z^r$ with
      $xyz>1$ and $\frac1p+\frac1q+\frac1r<1$
    values:
      81: $2^5+7^2=3^4$
      512: $13^2+7^3=2^9$
      5041: $2^7+17^3=71^2$
      14884: $3^5+11^4=122^2$
      3805914951397: $33^8+1549034^2=15613^3$
      4902227890625: $1414^3+2213459^2=65^7$
      235260548044817: $9262^3+15312283^2=113^7$
      443689062789184: $17^7+76271^3=21063928^2$
      902576261010649: $43^8+96222^3=30042907^2$
  part:
    type: Symbolic
    title: part
    show-in-parameter-list: 'no'
    values:
      x: $x$
      y: $y$
      z: $z$
      sum: $z^r$
Comments:
  comment-order: >-
    The summands are ordered by size, so $x^p<y^q$. Thus the solution with
    $z^r=512$ is written here as $13^2+7^3=2^9$, although some sources list
    the two summands in the other order.
  comment-exponents: >-
    The exponents $p$, $q$ and $r$ are shown in the displayed solution label
    and in each entry comment, rather than stored as rows. They are small
    integers and would not identify this family in a number search.
  comment-catalan-family: >-
    The infinite family $1^p+2^3=3^2$ with $p>6$ gives the OEIS A214618 term
    $9$ CITE{OEIS214618}. It is not stored as entries because $p$ is unbounded
    and the integers $1$, $2$, $3$, $8$ and $9$ do not identify one solution.
Formulas:
  formula-equation: >-
    For every stored solution, $x^p+y^q=z^r$, $\gcd(x,y,z)=1$ and
    $\frac1p+\frac1q+\frac1r<1$.

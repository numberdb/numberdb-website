Data properties:
  type: Z
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the nine known solutions with $xyz>1$ listed in CITE{Sikora2024};
    Sikora's 2024 search found no other coprime solution with
    $\min(p,q,r)\leq113$ and $x^p,y^q,z^r<M_{\min(p,q,r)}$, where
    $M_2=2^{71}$, $M_3=2^{80}$, $M_4=2^{100}$ and $M_d=2^{113}$ for
    $5\leq d\leq113$
  sources:
    - CITE{Sikora2024}
    - CITE{OEIS214618}
    - CITE{WikiFermatCatalan}
    - CITE{MathWorldFermatCatalan}
  rigour details: >-
    Every stored value is an exact integer. The generator checks each identity,
    each coprimality condition and each exponent inequality with integer
    arithmetic. It also checks the stored sums against the OEIS A214618 b-file
    after removing its first term $9$, which comes from the family
    $1^p+2^3=3^2$.
Display properties:
  number-header: $x$, $y$, $z$, or $z^r$

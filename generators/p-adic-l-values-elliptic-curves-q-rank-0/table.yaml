Data properties:
  type: Qp
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every curve in Sage's mini Cremona database CITE{SageCremona} with
    conductor $N\leq30$ and rank $0$, for every ordinary prime $p$ with
    $5\leq p\leq29$ and $p\nmid N$
  sources:
    - CITE{SageCremona}
    - CITE{SagePadicLseries}
  rigour details: >-
    The generator reads exact Weierstrass coefficients and ranks from Sage's
    mini Cremona database CITE{SageCremona}, builds each curve over
    $\mathbb{Q}$, and uses Sage's modular-symbol machinery and the
    interpolation formula documented for the ordinary $p$-adic $L$-series
    CITE{SagePadicLseries}. The unit root $\alpha$ is Hensel-lifted in
    $\mathbb{Q}_p$ to the stored precision, and the rational factor
    $L(E,1)/\Omega_E$ is the exact normalized modular symbol at $0$. The
    generator checks $\alpha^2-a_p\alpha+p=0$ to the stored precision and
    checks the rational factor against PARI's complex $L$-value computation
    for each curve.

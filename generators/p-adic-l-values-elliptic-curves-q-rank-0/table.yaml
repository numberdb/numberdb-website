# The table document for draft T413 on numberdb.org. Publishing is a person's
# act on the site; the generator beside this file fills the entries.
Title: Values $L_p(E,1)$ of the $p$-adic $L$-function of elliptic curves over $\mathbb{Q}$ of rank 0
Definition: >-
  For the rank-zero elliptic curve $E/\mathbb{Q}$ with conductor $N$ and
  invariants $c_4$ and $c_6$, and a prime $p$ of good ordinary reduction, this
  table gives the value at $s=1$ of the cyclotomic $p$-adic $L$-function of
  Mazur, Tate and Teitelbaum CITE{MTT}, as computed by Sage
  CITE{SagePadicLseries}.
Keywords:
  - p-adic L-function
  - p-adic L-series
  - Mazur-Tate-Teitelbaum p-adic L-function
  - ordinary prime
  - central L-value
Parameters:
  N:
    type: Z
    title: conductor of $E$
    display: $N$
    constraints: $N\geq1$
  c4:
    type: Z
    title: invariant $c_4$ of the reduced global minimal model of $E$
    display: $c_4$
  c6:
    type: Z
    title: invariant $c_6$ of the reduced global minimal model of $E$
    display: $c_6$
  p:
    type: Z
    title: ordinary prime
    display: $p$
    constraints: $p$ is a prime of good ordinary reduction for $E$
Comments:
  comment-index: >-
    Each entry comment gives the Cremona label from Sage's mini Cremona
    database CITE{SageCremona} and the corresponding LMFDB CITE{LMFDB} label.
    LMFDB numbers curves within an isogeny class differently from Cremona's
    tables, so the two labels can have different final indices.
  comment-normalization: >-
    Sage writes the cyclotomic variable as $T=\gamma^{s-1}-1$ with
    $\gamma=1+p$. The value stored here is the constant term at $T=0$; no
    derivative and no division by $\log_p(\gamma)$ is applied.
  comment-precision: >-
    The $p$-adic precision is the least $n$ with $p^n\geq10^{50}$, for example
    $O(5^{72})$, $O(7^{60})$, $O(11^{49})$, $O(13^{45})$ and $O(29^{35})$.
  comment-repeated-values: >-
    For a fixed $p$, CITE{formula-interpolation} shows that the value depends
    only on $a_p$ and on $L(E,1)/\Omega_E$. Curves sharing those data at that
    prime have the same entry.
Formulas:
  formula-model-from-invariants: >-
    The reduced global minimal model is
    $y^2+a_1xy+a_3y=x^3+a_2x^2+a_4x+a_6$, with
    $b_2=a_1^2+4a_2$, $b_4=a_1a_3+2a_4$ and $b_6=a_3^2+4a_6$. Given
    $(c_4,c_6)$, $b_2$ is the unique element of $\{-4,-3,0,1,4,5\}$ with
    $b_2\equiv -c_6\pmod{12}$, $b_4=(b_2^2-c_4)/24$, and
    $b_6=(-c_6-b_2^3+36b_2b_4)/216$. The model has
    $a_1\equiv b_2\pmod 2$, $a_3\equiv b_6\pmod 2$ with
    $a_1,a_3\in\{0,1\}$ and $a_2\in\{-1,0,1\}$, and
    $a_2=(b_2-a_1^2)/4$, $a_4=(b_4-a_1a_3)/2$ and
    $a_6=(b_6-a_3^2)/4$.
  formula-interpolation: >-
    If $a_p=p+1-\#E(\mathbb{F}_p)$ and $\alpha$ is the unit root of
    $x^2-a_px+p$, then
    $L_p(E,1)=(1-\alpha^{-1})^2L(E,1)/\Omega_E$, where $\Omega_E$ is the
    real Néron period of $E$.

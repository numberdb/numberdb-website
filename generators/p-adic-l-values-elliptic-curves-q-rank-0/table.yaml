    doi: 10.1007/BF01388731
Programs:
  program-sage:
    language: Sage
    code: |
      E = EllipticCurve('11a1')
      p = 5
      n = 72  # least n with 5^n >= 10^50
      Lp = E.padic_lseries(p)
      alpha = Lp.alpha(n)
      symbol = E.modular_symbol(sign=+1, implementation='eclib')(0)
      ratio = QQ(symbol) / QQ(E.real_components())
      (ratio * (1 - 1 / alpha)**2).add_bigoh(n)

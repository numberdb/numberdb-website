Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every pair $n>m\geq1$ with $n\leq37$, a complete initial triangle
    of degree pairs; the first omitted half-degree row, at $(n,m)=(38,19)$,
    is already 1412 characters when expanded
  rigour details: >-
    The generator computes exact integer coefficients in $\mathbb Z[a,b]$ from
    Swan's formula CITE{Swan1962}, and all arithmetic is exact. It checks the
    resultant identity in Formula CITE{formula-resultant} for all pairs with
    $n\leq12$, compares the quadratic and cubic rows from Formula
    CITE{formula-quadratic} and Formula CITE{formula-cubic} against the stored
    values, and compares integer specializations of every stored pair with
    Sage's exact univariate discriminant over $\mathbb Z[x]$.

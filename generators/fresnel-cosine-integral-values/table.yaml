  relation: another member of the error-function family
- table: HREF{Values_of_the_imaginary_error_function}[Values of the imaginary
    error function $\operatorname{erfi}(x)$]
  relation: another member of the error-function family
- table: HREF{Values_of_Dawson's_integral}[Values of Dawson's integral $F(x)$]
  relation: another member of the error-function family
- table: HREF{Values_of_the_Fresnel_sine_integral}[Values of the Fresnel sine
    integral $S(x)$]
  relation: the companion Fresnel integral; together they trace the Cornu spiral
- table: HREF{Values_of_the_exponential_integral}[Values of the exponential integral]
  relation: stores $\operatorname{Ei}(x)$ and $E_1(x)$, with exponential kernels
    $e^t/t$ and $e^{-t}/t$ rather than the Gaussian kernel $e^{-t^2}$
- table: HREF{Values_of_the_sine_integral}[Values of the sine integral $\operatorname{Si}(x)$]
  relation: stores $\operatorname{Si}(x)=\int_0^x\sin(t)/t\,\mathrm{d}t$, with
    linear phase in place of the Fresnel quadratic phase
- table: HREF{Values_of_the_cosine_integral}[Values of the cosine integral $\operatorname{Ci}(x)$]
  relation: stores $\operatorname{Ci}(x)=\gamma+\log x+\int_0^x(\cos(t)-1)/t\,\mathrm{d}t$,
    with linear phase in place of the Fresnel quadratic phase
- table: HREF{Values_of_the_hyperbolic_sine_integral}[Values of the hyperbolic
    sine integral $\operatorname{Shi}(x)$]
  relation: stores $\operatorname{Shi}(x)=\int_0^x\sinh(t)/t\,\mathrm{d}t$ at
    rational arguments
- table: HREF{Values_of_the_hyperbolic_cosine_integral}[Values of the hyperbolic
    cosine integral $\operatorname{Chi}(x)$]
  relation: stores $\operatorname{Chi}(x)=\gamma+\log x+\int_0^x(\cosh(t)-1)/t\,\mathrm{d}t$
    at rational arguments
- table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the
    Gamma function at rational numbers]
  relation: contains HREF{Values_of_the_Gamma_function_at_rational_numbers#1/2}[$\Gamma(1/2)=\sqrt{\pi}$],
    the normalising constant in $\operatorname{erf}$ and $\operatorname{erfc}$

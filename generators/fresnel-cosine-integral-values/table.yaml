# The table document for T208, Values of the Fresnel cosine integral $C(x)$. It began as proposal 5 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which put six
# functions in one table; they are six tables now, one per
# function, on a grid that reaches to 10 and includes 0.
Title: Values of the Fresnel cosine integral $C(x)$
Definition: The Fresnel cosine integral is $C(x)=\int_0^x\cos(\pi t^2/2)\,\mathrm{d}t$
  CITE{DLMFDefinitions}, in the DLMF normalisation. This table gives its values
  at rational $x$ with $0\leq x\leq10$.
Keywords:
- Fresnel cosine integral
- Fresnel C
- Fresnel integral
- Cornu spiral
- clothoid
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\geq0$
Comments:
  comment-fresnel-normalisation: The Fresnel normalisation is the DLMF form in
    CITE{formula-fresnel-definitions}, with $\pi t^2/2$ in the trigonometric functions.
    The alternative integrals with $\sin(t^2)$ and $\cos(t^2)$ are not stored
    at rational arguments here. Formula CITE{formula-fresnel-conversion} gives
    their conversion.
  comment-negative-arguments: Negative arguments are not listed separately. Values
    at negative arguments follow from CITE{formula-parity}.
  comment-at-zero: At $x=0$ the value is exact, $C(0)=0$, and is stored as the
    integer rather than as a hundred places of one.
Formulas:
  formula-fresnel-definitions: The Fresnel integrals in this table are $S(x)=\int_0^x\sin(\pi
    t^2/2)\,\mathrm{d}t$ and $C(x)=\int_0^x\cos(\pi t^2/2)\,\mathrm{d}t$ CITE{DLMFDefinitions}.
  formula-fresnel-erf: With $S$ and $C$ as in CITE{formula-fresnel-definitions},
    $C(x)+iS(x)=\frac{1+i}{2}\operatorname{erf}((\sqrt{\pi}/2)(1-i)x)$ CITE{WikiFresnel}.
  formula-fresnel-conversion: If $S_2(x)=\int_0^x\sin(t^2)\,\mathrm{d}t$ and $C_2(x)=\int_0^x\cos(t^2)\,\mathrm{d}t$,
    then $S_2(x)=\sqrt{\pi/2}\,S(\sqrt{2/\pi}\,x)$ and $C_2(x)=\sqrt{\pi/2}\,C(\sqrt{2/\pi}\,x)$.
  formula-parity: The functions $\operatorname{erf}$, $\operatorname{erfi}$, $F$,
    $S$ and $C$ are odd, and $\operatorname{erfc}(-x)=2-\operatorname{erfc}(x)$.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.rational_field import QQ

      from sage.rings.real_arb import RealBallField


      field = RealBallField(numberdb.bits(100, losing=64))

      x = field(QQ(1))

      # see generate.py: computed from the complex error function'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.fresnelc(1)'

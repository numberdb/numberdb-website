Data properties:
  type: R
  rigour: measured
  complete: no
  complete-note: it holds $\beta=1,2,4$ for every grid point $s=-10,-9.95,\ldots,5$
  rigour details: >
    Values were computed from CITE{formula-determinants} by Gauss-Legendre
    Nystrom quadrature for the operator $T_t$ on $[0,\infty)$. The production
    run used a second quadrature setting as a control, and each entry's written
    precision is limited by their agreement. The far-left $\beta=4$ tail uses
    mpmath multiprecision determinant arithmetic, because double precision
    loses relative accuracy there. Before the draft was offered, the entries
    were compared across the whole grid with an independent collocation solve
    of the Hastings-McLeod Painleve-II boundary value problem using
    CITE{formula-painleve} and CITE{formula-f1-f4-painleve}; the worst
    relative difference was about $4.1\%$ in a far-left $\beta=4$ row stored as
    $1.0\cdot10^{-25}$, and no row disagreed beyond the tolerance justified by
    its written precision. The controls $F_1(0)=0.83190806620295\ldots$ and
    $F_2(0)=0.96937282835526\ldots$ were checked against the values printed by
    CITE{Bornemann}.

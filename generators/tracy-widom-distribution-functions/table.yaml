Data properties:
  type: R
  rigour: measured
  complete: no
  complete-note: it holds $\beta=1,2,4$ for every grid point $s=-10,-9.95,\ldots,5$
  rigour details: >
    Values were computed from CITE{formula-determinants} by Gauss-Legendre
    Nystrom quadrature for the operator $T_t$ on $[0,\infty)$. The production
    run used a second quadrature setting as a control, and each entry's written
    precision is limited by their agreement. The far-left $\beta=4$ tail uses
    mpmath multiprecision determinant arithmetic, because double precision
    loses relative accuracy there. The $\beta=2$ values were also compared
    against the direct Airy-kernel determinant CITE{formula-f2} at sample
    points, and the $\beta=4$ scaling was checked against the published
    Tracy-Widom location for $\beta=4$ CITE{WikiTW}.

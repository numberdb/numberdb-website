Title: Values of the Tracy-Widom distribution functions $F_\beta(s)$
Definition: >
  For $\beta\in\{1,2,4\}$, let $F_\beta$ be the Tracy-Widom distribution
  function CITE{WikiTW} in the soft-edge scaling used by CITE{Bornemann}.
  This table gives values of $F_\beta(s)$ at rational $s$.
Keywords:
- Tracy-Widom distribution
- Tracy Widom distribution
- Tracy-Widom distribution function
- random matrix theory
- Painleve II
- Painlevé II
- Hastings-McLeod solution
- largest eigenvalue distribution
Parameters:
  beta:
    type: Z
    title: Dyson index
    display: $\beta$
    values:
      "1": GOE
      "2": GUE
      "4": GSE
  s:
    type: Q
    title: argument
    display: $s$
    constraints: $s\in\mathbb{Q}$
Comments:
  comment-normalisation: >
    For $\beta=4$ the table uses Bornemann's soft-edge Tracy-Widom scaling,
    the same convention used by
    HREF{Cumulants_of_the_Tracy_Widom_distributions}[the table of
    Tracy-Widom cumulants]. If $G_4(u)$ denotes the convention without the
    $\sqrt2$ in the GSE argument, then $F_4(s)=G_4(\sqrt2s)$ and
    $G_4(u)=F_4(u/\sqrt2)$.
  comment-range: >
    The argument grid follows the soft-edge family convention in
    numberdb-data#196. It covers the transition region where the three
    distribution functions are neither zero nor one to the stored precision,
    and uses a $0.05$ step because numerical Tracy-Widom evaluations are
    commonly requested at decimal arguments.
  comment-airy: >
    The Airy function $\operatorname{Ai}$ appears both in the Fredholm
    determinant kernel and in the boundary condition for the Hastings-McLeod
    solution. It is tabulated in
    HREF{Values_of_the_Airy_function_of_the_first_kind}[the table of Airy
    function values].
Formulas:
  formula-airy-kernel: >
    The Airy kernel is
    $K_{\operatorname{Ai}}(x,y)=\frac{\operatorname{Ai}(x)\operatorname{Ai}'(y)-\operatorname{Ai}'(x)\operatorname{Ai}(y)}{x-y}$.
  formula-f2: >
    $F_2(s)=\det(I-K_{\operatorname{Ai}}\!\upharpoonright_{L^2(s,\infty)})$
    CITE{Bornemann}.
  formula-t-kernel: >
    Let $T_t$ be the operator on $L^2(0,\infty)$ with kernel
    $T_t(x,y)=\operatorname{Ai}(x+y+t)$.
  formula-determinants: >
    $F_1(s)=\det(I-T_s)$, $F_2(s)=\det(I-T_s)\det(I+T_s)$, and
    $F_4(s)=\frac12(\det(I-T_{\sqrt2s})+\det(I+T_{\sqrt2s}))$
    CITE{Bornemann}.
  formula-painleve: >
    Equivalently, if $q$ is the Hastings-McLeod solution of
    $q''(s)=sq(s)+2q(s)^3$ with $q(s)\sim\operatorname{Ai}(s)$ as
    $s\to+\infty$, then
    $F_2(s)=\exp\left(-\int_s^\infty (x-s)q(x)^2\,dx\right)$ CITE{Bornemann}.
  formula-f1-f4-painleve: >
    With the same $q$,
    $F_1(s)=F_2(s)^{1/2}\exp(-\frac12\int_s^\infty q(x)\,dx)$ and
    $F_4(s)=F_2(\sqrt2s)^{1/2}\cosh(\frac12\int_{\sqrt2s}^\infty q(x)\,dx)$
    CITE{Bornemann}.
Programs:
  program-python:
    language: Python
    code: |
      import numpy as np
      from scipy.linalg import det
      from scipy.special import airy

      nodes, weights = np.polynomial.legendre.leggauss(100)
      x = 24.0 * (nodes + 1.0) / 2.0
      rootw = np.sqrt(24.0 * weights / 2.0)
      kernel = airy(x[:, None] + x[None, :])[0]
      matrix = rootw[:, None] * kernel * rootw[None, :]
      F1_at_0 = det(np.eye(100) - matrix)

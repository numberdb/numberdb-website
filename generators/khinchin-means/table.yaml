# The table document for Khinchin's means, T170. It began as proposal 3 of
# agents/table-ideas/BATCH-2026-09-09T0015.md, "Constants of the regular
# continued fraction", which held Levy's constant and Lochs's constant as
# well; those are now Levys_constant and Lochss_constant, because a table
# answers a search by its title and this one's title named neither of them.
Title: Khinchin's means $K_p$
Definition: >-
  Let $x=[a_0;a_1,a_2,\ldots]$ be the regular continued fraction expansion of
  a real number CITE{MathWorldRegularCF}. For $p<1$ the power mean of order
  $p$ of the partial quotients has, for almost every $x$, a limit that does
  not depend on $x$:
  $K_p=\lim_{n\to\infty}M_p(a_1,\ldots,a_n)$, where $M_p$ is the power mean
  and $M_0$ the geometric mean CITE{WikiKhinchin}. This table gives $K_p$ for
  the orders $p$ listed. The order $p=0$ gives Khinchin's constant.
Keywords:
  - Khinchin's constant
  - Khinchin constant
  - Khinchin harmonic mean
  - power mean of the partial quotients
  - regular continued fraction
  - Gauss-Kuzmin distribution
Parameters:
  constant:
    type: Symbolic
    title: order of the mean
    display: constant
    values:
      K0: '$K_0$'
      K-1: '$K_{-1}$'
      K-2: '$K_{-2}$'
      K-3: '$K_{-3}$'
      K-4: '$K_{-4}$'
      K-5: '$K_{-5}$'
      K-6: '$K_{-6}$'
      K-7: '$K_{-7}$'
      K-8: '$K_{-8}$'
      K-9: '$K_{-9}$'
      K-10: '$K_{-10}$'
      K1/2: '$K_{1/2}$'
      K-1/2: '$K_{-1/2}$'
Comments:
  comment-distribution: >-
    Under the Gauss measure, whose density is
    $\frac{1}{(1+x)\log 2}$ and which is invariant under the Gauss map
    $x\mapsto 1/x-\lfloor 1/x\rfloor$ CITE{WikiGaussMap}, the probability
    that a partial quotient is $k$ is CITE{formula-probability}. The
    constants $K_p$ are the power means of this distribution.
  comment-conventions: >-
    The row $K_0$ is Khinchin's constant CITE{WikiKhinchin}
    CITE{MathWorldKhinchin}, and $K_{-1}$ is the Khinchin harmonic mean
    CITE{MathWorldHarmonic}. The arithmetic mean $K_1$ is infinite, and $K_p$
    is finite exactly for $p<1$, so the table stops there rather than by
    choice.
  comment-monotonic: >-
    The power mean increases with its order, so
    $K_{-10}<K_{-9}<\cdots<K_{-1}<K_{-1/2}<K_0<K_{1/2}$.
Formulas:
  formula-probability: >-
    $\Pr(a_i=k)=\log_2\left(1+\frac{1}{k(k+2)}\right)$ for $k\geq1$.
  formula-kp: >-
    $K_p=\left(\sum_{k=1}^{\infty}
    k^p\log_2\left(1+\frac{1}{k(k+2)}\right)\right)^{1/p}$ for
    $p<1$, $p\ne0$, and
    $K_0=\exp\left(\sum_{k=1}^{\infty}
    \log k\,\log_2\left(1+\frac{1}{k(k+2)}\right)\right)$.
  formula-k0-zeta: >-
    $\log K_0=\frac{1}{\log 2}\sum_{n=1}^{\infty}
    \frac{\zeta(2n)-1}{n}\sum_{j=1}^{2n-1}\frac{(-1)^{j+1}}{j}$
    CITE{BBC}.
  formula-kp-zeta: >-
    For $p<1$, $p\ne0$,
    $K_p^p=\frac{1}{\log 2}\sum_{n=2}^{\infty}
    c_n(p)\left(\zeta(n-p)-1\right)$, where
    $c_n(p)=\sum_{j=1}^{\lfloor n/2\rfloor}
    \frac{(-1)^{n-2j}}{j}{p\choose n-2j}$.
Programs:
  program-python:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 80
      prob = lambda k: mp.log(1 + 1/(k*(k + 2))) / mp.log(2)
      mp.exp(mp.nsum(lambda n: (mp.zeta(2*n) - 1)/n
                     * mp.fsum((-1)**(j+1)/mp.mpf(j)
                               for j in range(1, 2*int(n))),
                     [1, mp.inf]) / mp.log(2))                     # K_0
      mp.nsum(lambda k: prob(k)/k, [1, mp.inf]) ** -1              # K_{-1}

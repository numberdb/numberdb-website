- table: HREF{Values_of_the_derivative_of_the_Airy_function_of_the_second_kind}[Values
    of the derivative of the Airy function of the second kind $\operatorname{Bi}'(x)$]
  relation: the other solution of the same equation; their Wronskian is CITE{formula-wronskian}
- table: HREF{Zeros_of_the_Airy_function_Ai}[Zeros of the Airy function of the
    first kind Ai]
  relation: stores the zeros of $\operatorname{Ai}$
- table: HREF{Zeros_of_the_Airy_function_Bi}[Zeros of the Airy function of the
    second kind Bi]
  relation: stores the zeros of $\operatorname{Bi}$
- table: HREF{Local_extrema_of_the_Airy_function_Ai}[Local extrema of the Airy
    function of the first kind Ai]
  relation: stores the zeros of $\operatorname{Ai}'$, where $\operatorname{Ai}$
    has local extrema
- table: HREF{Local_extrema_of_the_Airy_function_Bi}[Local extrema of the Airy
    function of the second kind Bi]
  relation: stores the zeros of $\operatorname{Bi}'$, where $\operatorname{Bi}$
    has local extrema
- table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the
    Gamma function at rational numbers]
  relation: contains the Gamma values in the initial values at $x=0$
- table: HREF{Values_of_Bessel_functions_of_the_first_kind}[Values of Bessel functions
    of the first kind $J_\nu(x)$]
  relation: Airy functions at negative arguments are related to Bessel functions
    of orders $1/3$ and $2/3$
- table: HREF{Values_of_Bessel_functions_of_the_second_kind}[Values of Bessel
    functions of the second kind $Y_\nu(x)$]
  relation: gives the companion Bessel solution appearing in the connection formulas
    for negative Airy arguments

# The table document for T201, Values of the derivative of the Airy function of the first kind $\operatorname{Ai}'(x)$. It began as proposal 3 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which put four
# functions in one table; they are four tables now, one per
# function, and the relations are in `Similar tables`.
Title: Values of the derivative of the Airy function of the first kind $\operatorname{Ai}'(x)$
Definition: The derivative $\operatorname{Ai}'$ of the Airy function of the first
  kind CITE{DLMFAiryEquation}. This table gives its values at rational $x$.
Keywords:
- Airy Ai prime
- derivative of the Airy function
- Ai'(0)
- AiryAiPrime
- Airy function values
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\in\mathbb{Q}$
Comments:
  comment-standard-solutions: 'The normalisation is the standard pair of solutions
    of Airy\''s differential equation CITE{DLMFAiryEquation}. Values on both sides
    of the origin are listed: $\operatorname{Ai}$ decays and $\operatorname{Bi}$
    grows for positive $x$, while both oscillate for negative $x$.'
  comment-initial-value: At $x=0$ the value is a Gamma-function value, $\operatorname{Ai}'(0)=-1/(3^{1/3}\Gamma(1/3))$
    CITE{DLMFInitialValues}, and $\Gamma(1/3)$ and $\Gamma(2/3)$ are in HREF{Values_of_the_Gamma_function_at_rational_numbers}[the
    table of Gamma values].
Formulas:
  formula-initial-value: $\operatorname{Ai}'(0)=-1/(3^{1/3}\Gamma(1/3))$ CITE{DLMFInitialValues}.
  formula-wronskian: For real $x$, $\operatorname{Ai}(x)\operatorname{Bi}'(x)-\operatorname{Ai}'(x)\operatorname{Bi}(x)=1/\pi$
    CITE{DLMFWronskian}.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.complex_arb import ComplexBallField

      from sage.rings.rational_field import QQ


      CBF = ComplexBallField(numberdb.bits(100, losing=64))

      x = CBF(QQ(1))

      x.airy_ai_prime().real()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      x = mpmath.mpf(1)

      mpmath.airyai(x, derivative=1)'
Similar tables:
- table: HREF{Values_of_the_Airy_function_of_the_first_kind}[Values of the Airy
    function of the first kind $\operatorname{Ai}(x)$]
  relation: the function whose derivative this is

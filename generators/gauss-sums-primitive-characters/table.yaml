Data properties:
  type: C
  rigour: proven
  complete: 'no'
  complete-note: every primitive character of conductor $q\leq 50$ is here, 471 entries
  rigour details: >-
    Each value is a complex ball at 397 bits: the sum of the $q$ terms
    $e^{2\pi i r}$, $r$ the exact rational with $\chi(a)e^{2\pi i a/q}=e^{2\pi i r}$,
    each term arb's exponential of a ball containing $r$. The character is
    built from Conrey's definition (discrete logarithms modulo the prime
    powers dividing $q$), not from a library; the generator requires every
    value to overlap an enclosure of Sage's exact `gauss_sum()` of the
    character Sage numbers $(q,n)$, and $\tau(\chi)\overline{\tau(\chi)}$
    to contain $q$, before returning it, and decides primitivity by hand and
    by Sage's `is_primitive()`, which must agree. The digits written are
    those the ball supports (the widest ball, at $q=47$, supports 116). The
    degree in each comment is the number of distinct Galois conjugates of
    $\tau(\chi)$, enclosed in balls and compared exactly where two overlap;
    a minimal polynomial is the product over them, rounded to integers and
    required to vanish at the exact value; a root of unity in a comment was
    read off the ball and confirmed exactly in the cyclotomic field, and
    its absence proven by a ball for $(\tau^2/q)^z$ excluding $1$, $z$ the
    number of roots of unity in that field. Outside the generator, the
    hand-built characters were compared with Sage's on every value of every
    character of modulus at most 60; every value was compared with PARI's
    `znchargauss` at its Conrey index; the values the LMFDB computes for
    $(7,2)$, $(16,3)$, $(45,2)$ and the imprimitive $(50,3)$, and the
    hundred-digit expansions OEIS A396258 to A396261 for the characters
    modulo $7$, agree; and the formulas listed were checked on every entry.
    The controls that must fail fail.
Display properties:
  number-header: $\tau(\chi_q(n,\cdot))$

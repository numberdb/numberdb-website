Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: every rule with $n\leq 15$ (3 to 31 points) and the three larger rules of QUADPACK, $n=20,25,30$ (41, 51 and 61 points), nodes and weights, both halves
  rigour details: >-
    $P_n$ is built exactly in $\mathbb{Q}[x]$ and $E_{n+1}$ by solving its
    defining linear system exactly over $\mathbb{Q}$; the roots of each are
    isolated by Sage's real root isolation over the interval field, so each
    node is an interval provably containing one root, carried on as an arb
    ball at 493 bits; $w_k$ is $q_{\omega_n}(x_k)/\omega_n'(x_k)$ in ball
    arithmetic, and the digits written are those the ball supports (the
    widest, a weight of the 61-point rule, supports 124; the working
    precision is what it is because $q_{\omega_n}$ and $\omega_n'$ for a
    polynomial of degree 61 cancel about twenty digits near the ends of the
    interval). Before a rule is written it must also satisfy the second
    weight formula through $c_n$, $P_n$ and $E_{n+1}$, the interlacing, the
    symmetry, $\sum w_k=2$, and exactness on $x^m$ for $m\leq 3n+1$ with
    failure at the first even $m$ beyond. Outside the generator the values
    were compared with the 33-digit constants of QUADPACK's six routines
    (281 values; the central weight of the 51-point rule is printed there
    one unit too large in its 33rd digit, the rational value being
    $0.0615808180678329350787598242400645531\ldots$), with Wikipedia's
    fifteen-point row, with closed forms for $n\leq 3$ computed in
    $\mathbb{Q}$ and $\mathbb{Q}(\sqrt{330})$, with the Stieltjes polynomials
    from a second linear system in the Legendre basis, with the weights as
    integrals of the Lagrange basis polynomials, and with the stored
    Gauss–Legendre nodes and weights, with the controls that must fail
    failing.
Display properties:
  number-header: $x_k$ or $w_k$

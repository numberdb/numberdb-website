Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every degree $2\leq n\leq6$; the degree $7$ entry has six
    coefficient variables but is about 8099 characters, beyond the readable
    range chosen here
  rigour details: >-
    The generator computes exact integer coefficients in
    $\mathbb Z[a_0,\dots,a_{n-2}]$ from the resultant identity in Formula
    CITE{formula-resultant}, and all arithmetic is exact. It checks Formula
    CITE{formula-roots} by substituting the elementary symmetric polynomials
    of the roots after imposing $a_{n-1}=0$, compares the quadratic and cubic
    rows from Formula CITE{formula-quadratic} and Formula CITE{formula-cubic}
    against the stored values, compares degrees $2$ through $5$ with the
    specialization of HREF{T381}[the general-polynomial discriminant], and
    compares integer specializations with Sage's exact univariate discriminant
    over $\mathbb Z[x]$.
Display properties:
  number-header: $\operatorname{disc}(f_n)$

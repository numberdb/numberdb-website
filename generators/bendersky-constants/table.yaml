Title: Bendersky constants $A_k$
Definition: 'The Bendersky constants, also called generalized Glaisher constants, are the
  numbers $A_k$ CITE{WikiGlaisher}, $k\geq0$, whose logarithms satisfy $\log A_k=\frac{B_{k+1}}{k+1}H_k-\zeta''(-k)$,
  where $H_k=\sum_{j=1}^k1/j$ and $H_0=0$. Each row gives the same constant in two conventions:
  first $A_k$, then $\log A_k$.'
Keywords:
- Bendersky constants
- Bendersky-Adamchik constants
- generalized Glaisher constants
- higher Kinkelin constants
- Stirling constant
Parameters:
  k:
    type: Z
    title: index
    display: $k$
    constraints: $k\geq0$
Comments:
  comment-notation: In the defining formula, the HREF{Bernoulli_numbers}[Bernoulli numbers]
    are written as $B_n$.
  comment-convention: For each listed index $k$, the two stored values are $A_k$ and $\log
    A_k$, in that order. They are one constant written in two conventions.
  comment-product: 'The asymptotic formula CITE{WikiGlaisher} for $\prod_{m=1}^n m^{m^k}$
    has $A_k$ as its constant factor: $A_0$ is the constant in Stirling''s formula for $n!$,
    and higher $A_k$ normalise the corresponding higher products. Dowker CITE{Dowker} uses
    the name Glaisher-Kinkelin-Bendersky constants.'
Formulas:
  formula-log: $\log A_k=\frac{B_{k+1}}{k+1}H_k-\zeta'(-k)$.
  formula-even: For $m\geq1$, $\log A_{2m}=(-1)^{m+1}\frac{(2m)!}{2(2\pi)^{2m}}\zeta(2m+1)$.
  formula-first: $\log A_0=\frac12\log(2\pi)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.arith.misc import bernoulli
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.integer_ring import ZZ
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=96))
      k = ZZ(2)
      H = sum(QQ(1) / QQ(j) for j in range(1, int(k) + 1))
      log_A = CBF(QQ(bernoulli(k + 1)) * H / QQ(k + 1)) - CBF(-k).zetaderiv(1)
      log_A.exp(), log_A
Similar tables:
- table: HREF{Glaisher-Kinkelin_constant}[Glaisher-Kinkelin constant $A$]
  relation: the classical Glaisher-Kinkelin constant is the $k=1$ member $A_1$ of this family
    and is held separately under its own name, together with its logarithmic convention; a
    reader with the name $A$ or a value of $A_1$ usually wants that table
- table: HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[Values of the Riemann
    zeta function at rational numbers]
  relation: the even-index constants are given by zeta values at positive odd integers
- table: HREF{Bernoulli_numbers}[Bernoulli numbers]
  relation: the defining formula uses the Bernoulli numbers $B_{k+1}$
- table: HREF{Factorial}[Factorial of natural numbers]
  relation: $A_0=\sqrt{2\pi}$ is the constant in Stirling's formula $n!\sim\sqrt{2\pi n}\,(n/e)^n$

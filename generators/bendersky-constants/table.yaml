Tags:
- special values
- special functions
Data properties:
  type: R
  rigour: proven
  rigour details: Each value is computed as a Sage complex ball with arb at `numberdb.bits(digits,
    losing=96)` bits. The imaginary part is required to contain zero before the real part
    is returned. The entries are checked against CITE{formula-even}, Wikipedia's tabulated
    decimal values for $0\leq k\leq10$, and the Barnes $G$-function identity in the companion
    table of HREF{Glaisher-Kinkelin_constant}[the Glaisher-Kinkelin constant].
  complete: 'no'
  complete-note: it holds $A_k$ and $\log A_k$ for $k=0$ and every integer $2\leq k\leq20$;
    the classical member $A_1$ is in HREF{Glaisher-Kinkelin_constant}[the table of the Glaisher-Kinkelin
    constant $A$]
Display properties:
  number-header: $A_k$, $\log A_k$

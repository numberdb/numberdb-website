Tags:
  - polynomial
  - combinatorics
Programs:
  program-sage:
    language: Sage
    code: |-
      G = Graph('I@OZCMgs?')           # the Petersen graph, by its name here
      G.chromatic_polynomial()

      # and the name of a graph you have:
      G.canonical_label().graph6_string()

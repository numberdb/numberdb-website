Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds $\operatorname{Shi}(x)$ at every rational $x=a/b$ in
    lowest terms with $b\leq6$ and $0<x\leq5$
  rigour details: Each value was computed as a Sage real ball with arb at `numberdb.bits(digits,
    losing=64)` bits, and checked against mpmath at 150 decimal digits and against
    the OEIS value for $\operatorname{Shi}(1)$ CITE{OEISShiOne}. The widest returned
    ball had radius less than $10^{-117}$ for 100 requested digits.
Display properties:
  number-header: $\operatorname{Shi}(x)$

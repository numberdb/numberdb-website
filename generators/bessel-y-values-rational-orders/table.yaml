# The table document for T190, the second kind, split out of T187. One
# function per table, as T20 and T21 are the zeros of the two kinds and T22
# and T23 their extrema. That the two are the standard solutions of one
# equation is said in `Similar tables`, which is where a relation can be
# written down.
Title: Values of Bessel functions of the second kind $Y_\nu(x)$
Definition: This table gives the real principal values of the Bessel function
  of the second kind $Y_\nu(x)$, Weber\'s function, CITE{Wiki} CITE{DLMFBesselDefinitions},
  for rational order $\nu\geq0$ and rational argument $x>0$.
Keywords:
- Bessel Y
- Bessel function of the second kind
- Weber function
- Neumann function
- Bessel Y values
- Y0(1)
- cylinder functions
Parameters:
  nu:
    type: Q
    title: order
    display: $\nu$
    constraints: $\nu\in\mathbb{Q}$, $\nu\geq0$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments:
  comment-branches: The principal branch is that of CITE{DLMFBesselDefinitions}.
    For real $\nu$ and $x>0$, $Y_\nu(x)$ is real. The point $x=0$ is excluded
    because $Y_\nu$ is singular there, which is what distinguishes it from HREF{Values_of_Bessel_functions_of_the_first_kind}[the
    table of $J_\nu$].
  comment-negative-orders: Negative integer orders are not listed separately;
    they reduce to positive integer orders by CITE{formula-negative-integer-orders}.
    For nonintegral negative orders, the connection formulas in CITE{DLMFConnections}
    express the values through $J_\nu(x)$ and $Y_\nu(x)$.
  comment-spherical: These are the ordinary cylindrical Bessel functions. The
    spherical Bessel function of the second kind is $\mathrm{y}_n(x)=\sqrt{\pi/(2x)}Y_{n+1/2}(x)$
    CITE{DLMFSpherical}.
  comment-half-integers: Half-integer orders are elementary. HREF{Bessel_polynomials}[The
    Bessel polynomials] occur in explicit formulas for the associated spherical
    and modified spherical functions CITE{DLMFSphericalExplicit}.
Formulas:
  formula-recurrence: If $C_\nu$ is either $J_\nu$ or $Y_\nu$, then $C_{\nu-1}(x)+C_{\nu+1}(x)=2\nu
    C_\nu(x)/x$ CITE{DLMFRecurrences}.
  formula-negative-integer-orders: For an integer $n$, $Y_{-n}(x)=(-1)^nY_n(x)$
    CITE{DLMFConnections}.
  formula-half-order: $Y_{1/2}(x)=-\sqrt{2/(\pi x)}\cos x$.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.complex_arb import ComplexBallField

      from sage.rings.rational_field import QQ


      CBF = ComplexBallField(numberdb.bits(100, losing=64))

      nu = CBF(QQ(0))

      x = CBF(QQ(1))

      # Sage''s arb method is called on the argument and takes the order.

      x.bessel_Y(nu).real()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.bessely(0, 1)'

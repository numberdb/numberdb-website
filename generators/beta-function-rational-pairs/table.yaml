Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value with neither parameter a positive integer was computed as a Sage
    real ball with arb at `numberdb.bits(digits, losing=96)` bits by evaluating
    the complete Beta function at the exact rational parameters. Values with a
    positive-integer parameter were returned as exact rationals using the shift
    recurrence in CITE{formula-shift}. All entries were checked against the
    Gamma quotient in CITE{formula-gamma}, the reflection values in
    CITE{formula-reflection}, the three-term recurrence in CITE{formula-shift}
    wherever all three rows are listed, and the decimal prefixes in
    CITE{OEISDixonianPeriod}, CITE{OEISBetaQuarterQuarter},
    CITE{OEISLemniscate} and CITE{OEISSeries}.
  complete: no
  complete-note: >-
    it holds every entry with $a,b\in(0,2]$, $a\leq b$, and both parameters in
    lowest terms with denominator at most $6$

# The table document for T177, the values of the Beta function at pairs of
# rational numbers. It began as proposal 3 of
# agents/table-ideas/BATCH-2026-09-09T1055.md. Created as a draft through the
# API (X-Draft: yes), filled by generate.py beside it, and offered for review;
# publishing is a person's act.
Title: Values of the Beta function $B(a,b)$ at pairs of rational numbers
Definition: >-
  This table gives Euler's Beta function
  $B(a,b)=\Gamma(a)\Gamma(b)/\Gamma(a+b)$ CITE{DLMFBeta}, with positive
  rational parameters $a$ and $b$ satisfying $a\leq b$. The ordering $a\leq b$
  chooses one representative of the symmetry $B(a,b)=B(b,a)$.
Keywords:
  - Euler beta function
  - Euler's beta integral
  - Euler integral of the first kind
  - Beta integral
  - Beta distribution
Parameters:
  a:
    type: Q
    title: first parameter
    display: $a$
    constraints: $a>0$
  b:
    type: Q
    title: second parameter
    display: $b$
    constraints: $b\geq a$
Comments:
  comment-symmetry: >-
    The Beta function is symmetric in its two parameters. The table lists only
    rows with $a\leq b$; a value with $a>b$ is read by interchanging the two
    parameters.
  comment-positive-range: >-
    Only positive parameters are listed. The meromorphic continuation has
    poles when $a$, $b$ or $a+b$ is a non-positive integer, so negative
    rational parameters belong to a separate table with explicit pole and sign
    conventions.
  comment-reduction: >-
    The recurrence in CITE{formula-shift} reduces positive rational parameters
    greater than $2$ to values with a smaller parameter, multiplied by rational
    factors.
  comment-periods: >-
    When $a$ and $b$ are rational, the integral in CITE{formula-integral} is a
    period. The value $B(1/3,1/3)$ is the real period of the Dixonian elliptic
    functions, and $B(1/4,1/2)$ is a common normalisation of the lemniscate
    constant.
Formulas:
  formula-gamma: >-
    $B(a,b)=\Gamma(a)\Gamma(b)/\Gamma(a+b)$.
  formula-integral: >-
    For $a>0$ and $b>0$,
    $B(a,b)=\int_0^1 t^{a-1}(1-t)^{b-1}\,\mathrm{d}t$.
  formula-trigonometric: >-
    For $a>0$ and $b>0$,
    $\int_0^{\pi/2}\sin^{2a-1}(\theta)\cos^{2b-1}(\theta)\,\mathrm{d}\theta
    =B(a,b)/2$.
  formula-reflection: >-
    For $0<a<1$, $B(a,1-a)=\pi/\sin(\pi a)$.
  formula-shift: >-
    $B(a+1,b)=aB(a,b)/(a+b)$, and equivalently
    $B(a,b)=B(a,b+1)+B(a+1,b)$.
  formula-integers: >-
    For positive integers $m$ and $n$,
    $B(m,n)=(m-1)!(n-1)!/(m+n-1)!=1/(n\binom{m+n-1}{n})$.
  formula-elliptic: >-
    $B(1/4,1/2)=2\sqrt{2}\,K(1/2)$, where $K(m)$ is
    HREF{Complete_elliptic_integral_of_the_first_kind_K}[the complete
    elliptic integral of the first kind].
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      a = QQ(1) / QQ(3)
      b = QQ(1) / QQ(3)
      RBF = RealBallField(numberdb.bits(100, losing=96))
      RBF(a).beta(RBF(b))       # B(1/3, 1/3)
Similar tables:
  - table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the Gamma function at rational numbers]
    relation: the Beta function is a quotient of three Gamma values by CITE{formula-gamma}
  - table: HREF{Arithmetic-geometric_mean}[Values of the arithmetic-geometric mean]
    relation: the lemniscate value $B(1/4,1/2)$ is $2\pi/\mathrm{AGM}(1,\sqrt{2})$
  - table: HREF{Complete_elliptic_integral_of_the_first_kind_K}[Complete elliptic integral of the first kind $K(m)$]
    relation: the lemniscate value $B(1/4,1/2)$ is related to $K(1/2)$ by CITE{formula-elliptic}
  - table: HREF{Rational_multiples_of_pi}[Rational multiples of pi]
    relation: reflection values such as $B(1/2,1/2)$ and $B(1/2,3/2)$ are rational multiples of $\pi$
  - table: HREF{Pi}[Pi]
    relation: the reflection formula in CITE{formula-reflection} includes $\pi$

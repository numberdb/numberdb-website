Title: Stirling polynomials $S_k(x)$
Definition: >-
  For an integer $k\geq 0$, the Stirling polynomial $S_k(x)$ is the
  coefficient polynomial in $\mathbb{Q}[x]$ defined by
  $\left(\frac{t}{1-e^{-t}}\right)^{x+1}
  =\sum_{k=0}^{\infty}S_k(x)\frac{t^k}{k!}$ CITE{Wiki} CITE{MathWorld}.
Parameters:
  k:
    type: Z
    title: index
    display: $k$
    constraints: $k\geq 0$
Comments:
  comment-convention: >-
    This table uses the Sheffer-sequence convention for Stirling
    polynomials. Knuth's Stirling convolution polynomials $\sigma_n(x)$ and
    the Gessel-Stanley polynomials $S(n+k,n)$ and $c(n,n-k)$ are different
    families.
  comment-bernoulli-convention: >-
    The HREF{Bernoulli_numbers}[Bernoulli numbers] in
    CITE{formula-special-values} use the convention $B_1=-\tfrac12$.
Formulas:
  formula-generating-function: >-
    $\left(\frac{t}{1-e^{-t}}\right)^{x+1}
    =\sum_{k=0}^{\infty}S_k(x)\frac{t^k}{k!}$.
  formula-norlund: >-
    $S_k(x)=B_k^{(x+1)}(x+1)$, where the generalized Bernoulli polynomials
    are defined by
    $\left(\frac{t}{e^t-1}\right)^a e^{zt}
    =\sum_{k=0}^{\infty}B_k^{(a)}(z)\frac{t^k}{k!}$ CITE{Wiki}.
  formula-special-values: >-
    $S_k(-1)=\delta_{k,0}$, $S_k(0)=(-1)^kB_k$, and $S_k(k)=k!$.
  formula-first-kind: >-
    If $m$ and $k$ are integers with $m\geq k\geq0$, then
    $S_k(m)=\frac{(-1)^k}{\binom{m}{k}}s(m+1,m+1-k)$, where $s(a,b)$ is the
    signed Stirling number of the first kind CITE{MathWorld}.
  formula-second-kind: >-
    If $m\geq1$, then
    $S_k(-m)=\frac{(-1)^k}{\binom{k+m-1}{k}}
    \left\{ {k+m-1 \atop m-1} \right\}$, where
    $\left\{ {a \atop b} \right\}$ is the Stirling number of the second kind.
    These numbers are the coefficients of the
    HREF{Touchard_polynomials}[Touchard polynomials].
  formula-binomial-type: >-
    The shifted sequence is of binomial type:
    $S_k(x+y-1)=\sum_{j=0}^{k}\binom{k}{j}S_j(x-1)S_{k-j}(y-1)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.arith.misc import factorial
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing
      from sage.rings.rational_field import QQ

      R = PolynomialRing(QQ, 'x')
      x = R.gen()

      def mul(a, b, order):
          out = [R.zero() for _ in range(order + 1)]
          for i, ai in enumerate(a):
              for j, bj in enumerate(b[:order + 1 - i]):
                  out[i + j] += ai * bj
          return out

      def base_series(order):
          a = [QQ(0) for _ in range(order + 1)]
          a[0] = QQ(1)
          for r in range(2, order + 2):
              total = QQ(0)
              for m in range(2, r + 1):
                  total += a[r - m] * QQ((-1)**(m + 1)) / QQ(factorial(m))
              a[r - 1] = -total
          return a

      def binomial_x_plus_1(m):
          value = R.one()
          for j in range(m):
              value *= x + QQ(1 - j)
              value /= QQ(j + 1)
          return value

      def stirling_polynomial(k):
          base = [R(c) for c in base_series(k)]
          base[0] = R.zero()
          series = [R.zero() for _ in range(k + 1)]
          series[0] = R.one()
          power = [R.zero() for _ in range(k + 1)]
          power[0] = R.one()
          for m in range(1, k + 1):
              power = mul(power, base, k)
              factor = binomial_x_plus_1(m)
              for j in range(k + 1):
                  series[j] += factor * power[j]
          return series[k] * QQ(factorial(k))

      stirling_polynomial(31)      # the next one after this table

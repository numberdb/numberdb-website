Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every index $k$ with $0\leq k\leq30$
  rigour details: >-
    The generator computes the ordinary power-series coefficients of
    $t/(1-e^{-t})$ from the identity
    $\frac{t}{1-e^{-t}}(1-e^{-t})=t$, then raises that series to the
    polynomial exponent $x+1$ over Sage's rational polynomial ring. Every
    division is made in Sage's rational field. Before the draft was created,
    the entries were checked against interpolation from signed Stirling
    numbers of the first kind using CITE{formula-first-kind}, against
    CITE{formula-special-values} and CITE{formula-second-kind}, against
    CITE{formula-binomial-type}, against the polynomials printed by
    CITE{Wiki} and CITE{MathWorld}, and against OEIS A100655
    CITE{OEISNorlundNumerators} with denominators from A001898
    CITE{OEISNorlundDenominators}.

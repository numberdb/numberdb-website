Data properties:
  type: R
  rigour: proven
  complete: 'no'
  rigour details: >-
    $\varepsilon_K=(a+b\sqrt{d})/2$ is taken exactly, as integers $a,b$,
    from Sage's unit group with proof=True, and $R_K$ is arb's logarithm of
    the real ball $(a+b\sqrt{d})/2$ at 397 bits; the digits written are those
    the ball supports (the worst entry, $D=889$, supports 117).
    $K.\mathrm{regulator}()$, a 53-bit float, is not used. Before its
    logarithm is taken every unit is required to be the smallest unit of
    $\mathbb{Z}[\sqrt{d}]$ from the continued fraction of $\sqrt{d}$, or its
    cube root, a computation sharing no code with the unit group. All 302
    units were also compared with OEIS A014000/A014046/A014077, eight
    regulators with their LMFDB pages, and all 302 with the residue table
    through the class number formula, with the controls that must fail
    failing.
Display properties:
  number-header: $R_K$

# The table document for Hardy-Littlewood singular series of prime tuples,
# proposal 1 of agents/table-ideas/BATCH-2026-09-07T0207.md. Created as a
# draft through the API (X-Draft: yes) and filled by generate.py beside it;
# publishing is a person's act on the site.
Title: Hardy-Littlewood singular series of prime tuples
Definition: >-
  For an admissible prime $k$-tuple with offsets
  $H=(0,h_2,\ldots,h_k)$ CITE{WikiTuple}, ordered by
  $0<h_2<\cdots<h_k$, this table stores the Hardy-Littlewood singular series
  $\mathfrak S(H)$ CITE{WikiHL} CITE{MathWorldHL} in the full Euler-product
  normalization of CITE{formula-product}.
Parameters:
  H:
    type: Symbolic
    title: offset set of the prime tuple
    display: $H$
    constraints: >-
      $H=(0,h_2,\ldots,h_k)$ with $0<h_2<\cdots<h_k$, all $h_i$ integers, and
      $H$ admissible
Comments:
  comment-normalization: >-
    The normalization is the one in CITE{formula-product}. Thus
    $\mathfrak S((0,2))=2C_2$, twice
    HREF{Twin_prime_constant}[the twin prime constant $C_2$]. Some OEIS
    entries for longer tuples store only a generic Euler-product tail; the
    entries here include every finite local factor in front of the named
    tail.
  comment-range: >-
    The table holds every pair $H=(0,D)$ with $D$ even and $2\leq D\leq 100$,
    and it also holds the named prime constellations through $k=12$ listed
    by CITE{WikiTuple} and CITE{OEISConstellations}. It is intentionally a
    rectangular pair range plus a named-constellation supplement, rather than
    all admissible offset sets of bounded diameter.
  comment-conjectural: >-
    The product defining $\mathfrak S(H)$ converges for every admissible
    offset set $H$, and the Hardy-Littlewood asymptotic that gives it as a
    leading constant remains conjectural. The table records constants of
    the conjecture, not counts of proved infinite families of primes.
  comment-oeis-tail: >-
    The OEIS entries A065418, A065419 and A269843 record generic tails for
    the triplet, quadruplet and quintuplet products CITE{OEISTripletTail}
    CITE{OEISQuadrupletTail} CITE{OEISQuintupletTail}. For the quintuplet
    rows of this table the missing finite factor is $50625/2048$, so their
    full singular series is not ten times A269843.
  comment-requested: >-
    Asked for in CITE{issue131}, as Hardy-Littlewood singular series for
    small $D$.
Formulas:
  formula-product: >-
    $\mathfrak S(H)=\prod_p\frac{1-w_H(p)/p}{(1-1/p)^k}$, where
    $w_H(p)=|\{h\bmod p:h\in H\}|$. The tuple is admissible exactly when
    $w_H(p)<p$ for every prime $p$.
  formula-asymptotic: >-
    The first Hardy-Littlewood conjecture predicts
    $\#\{n\leq x:n+h\text{ is prime for all }h\in H\}\sim
    \mathfrak S(H)\int_2^x\frac{dt}{(\log t)^k}$ CITE{HL} CITE{WikiHL}.
  formula-tail: >-
    If $d=\max H$, then
    $\mathfrak S(H)=\left(\prod_{p\leq d}\frac{1-w_H(p)/p}{(1-1/p)^k}\right)
    \prod_{p>d}\frac{p^{k-1}(p-k)}{(p-1)^k}$, because for $p>d$ all offsets
    in $H$ are distinct modulo $p$.
  formula-pairs: >-
    For even $D$,
    $\mathfrak S((0,D))=2C_2\prod_{\substack{p\mid D\\p>2}}\frac{p-1}{p-2}$,
    where $C_2$ is HREF{Twin_prime_constant}[the twin prime constant].
  formula-examples: >-
    $\mathfrak S((0,2,6))=\mathfrak S((0,4,6))=\frac92
    \prod_{p\geq5}\frac{p^2(p-3)}{(p-1)^3}$ CITE{OEISTriplet}, and
    $\mathfrak S((0,2,6,8))=\frac{27}{2}
    \prod_{p\geq5}\frac{p^3(p-4)}{(p-1)^4}$ CITE{OEISQuadruplet}.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.libs.pari import pari
      H = [0, 2, 6, 8, 12]
      k = len(H)
      start = max(H) + 1
      def local(p):
          w = len({h % p for h in H})
          return (1 - QQ(w)/p) / (1 - QQ(1)/p)^k
      small = prod(local(p) for p in prime_range(2, start))
      tail = pari('prodeulerrat(p^%d*(p-%d)/(p-1)^%d, 1, %d)' % (k-1, k, k, start))
      pari(str(small)) * tail       # 10.1317949499960798439884271848...
  program-pari:
    language: PARI/GP
    code: |-
      default(realprecision, 120)
      2 * prodeulerrat(1 - 1/(p-1)^2, 1, 3)                 \\ H = (0,2)
      (9/2) * prodeulerrat(p^2*(p-3)/(p-1)^3, 1, 5)          \\ H = (0,2,6)
      (27/2) * prodeulerrat(p^3*(p-4)/(p-1)^4, 1, 5)         \\ H = (0,2,6,8)
Similar tables:
  - table: HREF{Twin_prime_constant}[Twin prime constant]
    relation: $C_2$ is half the entry $\mathfrak S((0,2))$ in this normalization
  - table: HREF{Values_of_the_prime_zeta_function_at_rational_numbers}[Values of the prime zeta function at rational numbers]
    relation: the same prime-indexed Euler products can be expanded as convergent combinations of prime zeta values

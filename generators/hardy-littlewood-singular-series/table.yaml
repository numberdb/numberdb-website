Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    every pair $H=(0,D)$ with $D$ even and $2\leq D\leq 100$ is here, together
    with the named prime constellations listed in the comments
  rigour details: >-
    The finite part of CITE{formula-tail} is computed exactly in
    $\mathbb{Q}$ from the residue classes of $H$ modulo each prime $p\leq
    \max H$. The generic tail is computed with PARI's prodeulerrat
    CITE{PARI} at $140$ decimal digits, and $100$ digits are written. Before
    the draft was filled, the pair formula CITE{formula-pairs} was tested on
    every pair in the table; the triplet, quadruplet and quintuplet
    normalizations were compared with the corresponding OEIS entries and
    tail entries; the full Euler product truncated at a large prime was used
    as an independent convergence control; and the program snippets were run
    on the displayed entries.
Display properties:
  number-header: $\mathfrak S(H)$

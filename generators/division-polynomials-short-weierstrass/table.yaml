Data properties:
  type: Z[]
  rigour: exact
  complete: no
  complete-note: it holds every $n$ with $1\leq n\leq7$
  rigour details: The generator computes in the coordinate ring of $y^2=x^3+Ax+B$, representing every polynomial as $u(x,A,B)+y\,v(x,A,B)$ and reducing products by the exact relation $y^2=x^3+Ax+B$. It verifies the degree and leading coefficient of every stored $\psi_n$ and checks specialisations at five nonsingular integer pairs $(A,B)$ against PARI/GP's exact `elldivpol` CITE{PARIelldivpol}; for even $n$, the comparison uses the convention in Formula CITE{formula-pari-convention}.

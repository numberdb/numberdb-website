  rigour details: Both values are computed as Sage complex balls with arb at `numberdb.bits(digits,
    losing=96)` bits. The imaginary part is required to contain zero before the real part
    is returned, and $A$ is checked against CITE{formula-barnes-g}.
  complete: 'yes'

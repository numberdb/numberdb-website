Keywords: Daubechies wavelet, Daubechies filters, Haar wavelet, Haar filter, signal processing, dbN, D2, D4, D6, D8, D10, D12, D14, D16, D18, D20, D22, D24, D26, D28, D30, D32, D34, D36, D38, D40, D42, D44, D46, D48, D50
Tags:
  - analysis
  - algebraic
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds every extremal-phase Daubechies low-pass filter with $1\leq N\leq 25$, a 650-entry reference range chosen to stay comfortably below the recommended thousand-entry size
  rigour details: >-
    The generator builds $P_N$ over $\mathbb{Q}$, computes its roots in
    Sage's exact algebraic closure, chooses the root outside the unit circle
    from each reciprocal pair using ball comparisons, and then converts the
    exact algebraic coefficients to real balls before writing 100 digits. For
    every $1\leq N\leq 25$ it checks the normalisation, the first $N$
    vanishing moments, and the even-shift orthogonality relations. The build
    run also compared every stored coefficient against the independent
    MusicDSP `daub.h` coefficient file, to the 61 significant digits carried
    by that file CITE{MusicDSP}.
Display properties:
  number-header: $h^{(N)}_k$

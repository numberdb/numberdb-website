  - analysis
  - algebraic
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds every extremal-phase Daubechies low-pass filter with $1\leq N\leq 25$
  rigour details: >-
    The generator builds $P_N$ over $\mathbb{Q}$, computes its roots in
    Sage's exact algebraic closure, chooses the root outside the unit circle
    from each reciprocal pair using ball comparisons, and then converts the
    exact algebraic coefficients to real balls before writing 100 digits. For
    every $1\leq N\leq 25$ it checks the normalisation, the first $N$
    vanishing moments, and the even-shift orthogonality relations. The build
    run also compared every stored coefficient against the independent
    MusicDSP `daub.h` coefficient file CITE{MusicDSP}.
Display properties:
  number-header: $h^{(N)}_k$

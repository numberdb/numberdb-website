# Table document for numberdb.org/T391. It was claimed first as an empty
# draft through the API, then filled by generate.py beside it. Publishing is a
# person's review act on the site.
Title: Daubechies extremal-phase scaling filters $h^{(N)}_k$
Definition: >-
  For $N\geq 1$, the Daubechies extremal-phase scaling filter $h^{(N)}$ is
  the low-pass reconstruction filter with $\sum_k h^{(N)}_k=\sqrt2$, whose
  spectral factor chooses the root outside the unit circle from each
  reciprocal pair. PyWavelets returns it as `dbN`.rec_lo CITE{PyWavelets}.
Parameters:
  N:
    type: Z
    title: number of vanishing moments
    display: $N$
    constraints: $N\geq 1$
  k:
    type: Z
    title: tap index
    display: $k$
    constraints: $0\leq k\leq 2N-1$
Comments:
  comment-orientation: >-
    The orientation is PyWavelets' `rec_lo` order: $h^{(2)}_0=0.48296\ldots$
    and the energy is concentrated near the $k=0$ end. PyWavelets' `dec_lo`
    filter is the reverse order CITE{PyWavelets}; reversing the order gives
    the other extremal phase convention. The filter $h^{(N)}$ is also written
    $D_{2N}$, after its number of taps CITE{Wiki}, so $D_4$ is $N=2$ and
    PyWavelets `db4` is $N=4$. The case $N=1$ is the Haar filter, with both
    taps equal to $1/\sqrt2$.
  comment-normalisation: >-
    Some tables of Daubechies coefficients, including the table in the
    Wikipedia article CITE{Wiki}, are normalised to sum to $2$. Those
    coefficients are $\sqrt2$ times the values stored here.
  comment-high-pass: >-
    This table stores only the low-pass scaling filter.
  comment-construction: >-
    The construction uses the Daubechies spectral factorisation
    CITE{DaubechiesBook}. From each reciprocal pair of nonzero roots it
    chooses the root outside the unit circle for the polynomial
    $H_N(z)=\sum_k h^{(N)}_k z^k$, which is the minimum-phase orientation for
    the filter in powers of $z^{-1}$.
Formulas:
  formula-daubechies-polynomial: >-
    $P_N(y)=\sum_{j=0}^{N-1}\binom{N-1+j}{j}y^j$.
  formula-spectral-factor: >-
    $H_N(z)H_N(z^{-1})=
    2\left(\frac{2+z+z^{-1}}{4}\right)^N
    P_N\left(\frac{2-z-z^{-1}}{4}\right)$, where
    $H_N(z)=\sum_{k=0}^{2N-1}h^{(N)}_kz^k$.
  formula-orthogonality: >-
    $\sum_k h^{(N)}_k h^{(N)}_{k-2m}=\delta_{m,0}$ for every integer $m$.
  formula-moments: >-
    $\sum_{k=0}^{2N-1}(-1)^k k^r h^{(N)}_k=0$ for $0\leq r<N$.
  formula-high-pass: >-
    $g^{(N)}_k=(-1)^k h^{(N)}_{2N-1-k}$ gives the corresponding high-pass
    filter.
  formula-db2: >-
    For $N=2$,
    $h^{(2)}_0=(1+\sqrt3)/(4\sqrt2)$,
    $h^{(2)}_1=(3+\sqrt3)/(4\sqrt2)$,
    $h^{(2)}_2=(3-\sqrt3)/(4\sqrt2)$ and
    $h^{(2)}_3=(1-\sqrt3)/(4\sqrt2)$.
Programs:
  program-pywavelets:
    language: Python
    code: |-
      import pywt

      N = 4
      k = 0
      pywt.Wavelet("db%d" % N).rec_lo[k]

Data properties:
  type: R
  rigour: assumed-bound
  complete: 'yes'
  rigour details: >-
    The stored value is the 72-digit decimal recorded in CITE{OEISConstant}.
    OEIS says those digits were computed using Markoff numbers up to
    $10^{40}$; this table takes that bound on trust rather than deriving an
    independent tail estimate. The generator transcribes the digit string and
    checks its leading digits against Zagier's rapidly convergent sum over
    normalized Markoff triples through $r\leq10^7$, with triple counts checked
    against the controls in numberdb-data#193.

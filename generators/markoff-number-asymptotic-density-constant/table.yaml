Title: The Markoff number asymptotic density constant
Definition: >-
  Let $M(x)$ be the number of Markoff numbers CITE{WikiMarkovNumber}
  less than $x$. The Markoff number asymptotic density constant $C$
  is the constant in Zagier's asymptotic
  $M(x)=C(\log(3x))^2+O(\log x(\log\log x)^2)$ CITE{Zagier1982}.
Comments:
  comment-printed-decimal: >-
    The decimal $0.18071704711507\ldots$ printed in CITE{Zagier1982}
    has a missing digit and rounding errors; OEIS A261613 records the
    corrected digits CITE{OEISConstant}.
Formulas:
  formula-zagier-sum: >-
    $C=\frac{3}{\pi^2}\sum c(p,q,r)
    \frac{f(p)+f(q)-f(r)}{f(p)f(q)f(r)}$, where the sum is over
    normalized Markoff triples $(p,q,r)$ with $p\leq q\leq r$,
    $c(p,q,r)=1$ except that $c(1,1,1)=c(1,1,2)=1/2$, and
    $f(t)=\log((3t+\sqrt{9t^2-4})/2)=\operatorname{arcosh}(3t/2)$
    CITE{OEISConstant}.

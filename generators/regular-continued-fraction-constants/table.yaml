# The table document for constants of the regular continued fraction, proposal
# 3 of agents/table-ideas/BATCH-2026-09-09T0015.md. Created as draft T170
# through the API (X-Draft: yes); publishing is a person's act on the site.
Title: Constants of the regular continued fraction
Definition: >-
  For the regular continued fraction
  $x=[a_0;a_1,a_2,\ldots]$ CITE{MathWorldRegularCF}, the table gives
  Khinchin's power means $K_p$ of the partial quotients $a_i$ CITE{WikiKhinchin}
  CITE{MathWorldKhinchin}, Levy's constant $e^\beta$, the Khinchin-Levy
  constant $\beta$, and Lochs's constant $L$. For $p<1$, $K_p$ is the
  almost-sure limit of
  $\left(\frac1n\sum_{i=1}^n a_i^p\right)^{1/p}$ for $p\ne0$, with $K_0$
  the limiting geometric mean; $e^\beta$ is the almost-sure limit of
  $q_n^{1/n}$ for the denominators of the convergents, and $L$ is the
  almost-sure number of continued-fraction terms determined per decimal digit.
Parameters:
  constant:
    type: Symbolic
    title: constant
    display: constant
    values:
      K0: '$K_0$'
      K-1: '$K_{-1}$'
      K-2: '$K_{-2}$'
      K-3: '$K_{-3}$'
      K-4: '$K_{-4}$'
      K-5: '$K_{-5}$'
      K-6: '$K_{-6}$'
      K-7: '$K_{-7}$'
      K-8: '$K_{-8}$'
      K-9: '$K_{-9}$'
      K-10: '$K_{-10}$'
      K1/2: '$K_{1/2}$'
      K-1/2: '$K_{-1/2}$'
      levy: '$e^\beta$'
      khinchin-levy: '$\beta$'
      lochs: '$L$'
Comments:
  comment-distribution: >-
    Under the Gauss measure, whose density is
    $\frac{1}{(1+x)\log 2}$ and which is invariant under the Gauss map
    $x\mapsto 1/x-\lfloor 1/x\rfloor$ CITE{WikiGaussMap}, the probability
    that a partial quotient is $k$ is CITE{formula-probability}. The
    constants $K_p$ are the power means of this distribution.
  comment-conventions: >-
    The row $K_0$ is Khinchin's constant, and $K_{-1}$ is the Khinchin
    harmonic mean. The arithmetic mean $K_1$ is infinite, so it is not a
    finite entry. The row $e^\beta$ stores the exponential form usually
    called Levy's constant; the row $\beta$ stores its logarithm, which is
    also called the Khinchin-Levy constant CITE{MathWorldLevy}.
  comment-lochs: >-
    Lochs's constant is the limit in Lochs's theorem CITE{Lochs}
    CITE{MathWorldLochs}. This table uses
    $L=\frac{6\log 2\log 10}{\pi^2}$, so that
    $L=\frac{\log 10}{2\beta}$; MathWorld notes a different, nonstandard use
    of the name for a constant related to Porter's constant CITE{MathWorldLochs}.
  comment-gauss-map: >-
    For the Gauss map $x\mapsto 1/x-\lfloor 1/x\rfloor$, the Lyapunov exponent
    with respect to the Gauss measure is $2\beta=\frac{\pi^2}{6\log 2}$.
Formulas:
  formula-probability: >-
    $\Pr(a_i=k)=\log_2\left(1+\frac{1}{k(k+2)}\right)$ for $k\geq1$.
  formula-kp: >-
    $K_p=\left(\sum_{k=1}^{\infty}
    k^p\log_2\left(1+\frac{1}{k(k+2)}\right)\right)^{1/p}$ for
    $p<1$, $p\ne0$, and
    $K_0=\exp\left(\sum_{k=1}^{\infty}
    \log k\,\log_2\left(1+\frac{1}{k(k+2)}\right)\right)$.
  formula-k0-zeta: >-
    $\log K_0=\frac{1}{\log 2}\sum_{n=1}^{\infty}
    \frac{\zeta(2n)-1}{n}\sum_{j=1}^{2n-1}\frac{(-1)^{j+1}}{j}$
    CITE{BBC}.
  formula-kp-zeta: >-
    For $p<1$, $p\ne0$,
    $K_p^p=\frac{1}{\log 2}\sum_{n=2}^{\infty}
    c_n(p)\left(\zeta(n-p)-1\right)$, where
    $c_n(p)=\sum_{j=1}^{\lfloor n/2\rfloor}
    \frac{(-1)^{n-2j}}{j}{p\choose n-2j}$.
  formula-levy-lochs: >-
    $\beta=\frac{\pi^2}{12\log 2}$,
    $e^\beta=HREF{E}[$e$]^{\beta}$, and
    $L=\frac{6\log 2\log 10}{\pi^2}=\frac{\log 10}{2\beta}$, with
    $\pi=HREF{Pi}[$\pi$]$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R = RealBallField(400)
      beta = R.pi()^2 / (12 * R(2).log())
      beta.exp()                                    # Levy's constant
      6 * R(2).log() * R(10).log() / R.pi()^2       # Lochs's constant
  program-python:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 80
      prob = lambda k: mp.log(1 + 1/(k*(k + 2))) / mp.log(2)
      mp.e ** mp.nsum(lambda k: mp.log(k) * prob(k), [1, mp.inf])   # K_0
      mp.nsum(lambda k: prob(k)/k, [1, mp.inf]) ** -1               # K_{-1}

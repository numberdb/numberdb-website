Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value is computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=96)` bits. The imaginary part is required
    to contain zero before the real part is returned. The entries are checked
    against the even-index formula in CITE{formula-even}, Wikipedia's
    tabulated decimal values for $0\leq k\leq10$, and the special value of
    the Barnes $G$-function in CITE{formula-barnes-g}.
  complete: 'no'
  complete-note: >-
    it holds $A_k$ and $\log A_k$ for every integer $0\leq k\leq20$

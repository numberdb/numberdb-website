Title: Glaisher-Kinkelin constant $A$ and Bendersky constants $A_k$
Definition: >-
  Listed are the generalized Glaisher constants, also called Bendersky
  constants, $A_k$ CITE{WikiGlaisher} for integers $k\geq0$, together with
  their logarithms. They are defined here by
  $\log A_k=\frac{B_{k+1}}{k+1}H_k-\zeta'(-k)$, where $H_0=0$,
  $H_k=\sum_{j=1}^k1/j$ for $k\geq1$, and $B_n$ are the Bernoulli numbers.
Keywords:
  - Glaisher constant
  - Glaisher-Kinkelin constant
  - generalized Glaisher constants
  - Bendersky constants
  - Bendersky-Adamchik constants
  - hyperfactorial
  - Stirling constant
Parameters:
  k:
    type: Z
    title: index
    display: $k$
    constraints: $k\geq0$
  quantity:
    type: Symbolic
    title: $A_k$ or $\log A_k$
    display: quantity
    values:
      A: $A_k$
      logA: $\log A_k$
Comments:
  comment-classical: >-
    The row $A_0$ is $\sqrt{2\pi}$, and $A_1$ is the classical
    Glaisher-Kinkelin constant $A$ CITE{MathWorldGlaisher}.
  comment-product: >-
    The same constants occur as the normalising constants in the asymptotic
    expansion of $\prod_{m=1}^n m^{m^k}$. With the Bernoulli convention
    $B_1=0$ in that normalising polynomial, the limit definition gives the
    same values as the zeta-derivative formula in the definition.
Formulas:
  formula-log: >-
    $\log A_k=\frac{B_{k+1}}{k+1}H_k-\zeta'(-k)$.
  formula-even: >-
    For $m\geq1$,
    $\log A_{2m}=(-1)^{m+1}\frac{(2m)!}{2(2\pi)^{2m}}\zeta(2m+1)$.
  formula-first: >-
    $\log A_0=\frac12\log(2\pi)$, and $\log A_1=\frac1{12}-\zeta'(-1)$.
  formula-barnes-g: >-
    HREF{Values_of_the_Barnes_G-function_at_rational_numbers}[The Barnes
    $G$-function] satisfies
    $G(1/2)=2^{1/24}e^{1/8}A^{-3/2}\pi^{-1/4}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.integer_ring import ZZ
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=96))
      k = ZZ(1)
      H = sum(QQ(1) / QQ(j) for j in range(1, int(k) + 1))
      log_A = CBF.bernoulli(k + 1) * CBF(H) / CBF(k + 1) - CBF(-k).zetaderiv(1)
      log_A.exp()
Similar tables:
  - table: HREF{Values_of_the_Barnes_G-function_at_rational_numbers}[Values of the Barnes $G$-function at rational numbers]
    relation: the classical constant $A=A_1$ appears in closed forms for special values of $G$
  - table: HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[Values of the Riemann zeta function at rational numbers]
    relation: the even-index constants are given by zeta values at positive odd integers
  - table: HREF{Factorial}[Factorial of natural numbers]
    relation: $A_0$ is the Stirling constant, while higher $A_k$ normalise products $\prod_{m=1}^n m^{m^k}$

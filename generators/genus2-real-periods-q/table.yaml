Title: Real periods of genus 2 curves over $\mathbb{Q}$
Definition: >-
  Let $C/\mathbb{Q}$ be a genus $2$ curve and let $A=\operatorname{Jac}(C)$.
  If $\Lambda\subset\mathbb{C}^2$ is the period lattice of a Neron basis of
  differentials on a regular model of $C$, then this table gives the real
  period $\Omega_A$ CITE{LMFDBPeriod}: the covolume of
  $\Lambda\cap\mathbb{R}^2$ in $\mathbb{R}^2$, multiplied by the number of
  connected components of $A(\mathbb{R})$.
Parameters:
  label:
    type: Symbolic
    title: LMFDB curve label
    display: label
Comments:
  comment-labels: >-
    The label is the LMFDB label for the genus $2$ curve CITE{LMFDBGenus2}.
    Each entry comment gives the isogeny class of the Jacobian and the model
    $y^2+h(x)y=f(x)$.
  comment-components: >-
    The connected-component factor is part of $\Omega_A$ in this table. Some
    authors omit this factor from a period covolume, so the convention should
    be checked when comparing with another source.
  comment-source-precision: >-
    The LMFDB records these real periods as $97$-bit real literals. The
    generator stores the first $28$ significant digits of each decimal string,
    without rounding, so the last written digit is uncertain in NumberDB's
    decimal convention.
  comment-isogeny: >-
    The real period is attached to the curve's Jacobian, not only to its
    isogeny class. The curves 249.a.249.1 and 249.a.6723.1 have the same
    period in the source data, while 277.a.277.1 and 277.a.277.2 are in one
    isogeny class and have different periods.
Formulas:
  formula-bsd: >-
    The Birch and Swinnerton-Dyer conjecture predicts
    $L^{(r)}(A,1)/r! = \Omega_A R_A |\operatorname{Sha}(A)|
    \prod_p c_p / |A(\mathbb{Q})_{\mathrm{tors}}|^2$, where $r$ is the
    analytic rank, $R_A$ is the regulator, $c_p$ is the Tamagawa number at
    $p$, and $A(\mathbb{Q})_{\mathrm{tors}}$ is the torsion subgroup
    CITE{LMFDBBSD}.

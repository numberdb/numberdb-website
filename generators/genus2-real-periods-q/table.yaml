Title: Real periods of genus 2 curves over $\mathbb{Q}$
Definition: >-
  Let $C/\mathbb{Q}$ be a genus $2$ curve with Jacobian
  $A=\operatorname{Jac}(C)$ and period lattice $\Lambda$. This table gives
  $\Omega_A=\#\pi_0(A(\mathbb{R}))\operatorname{covol}(\Lambda\cap\mathbb{R}^2)$,
  with covolume in $\mathbb{R}^2$ CITE{LMFDBPeriod}.
Parameters:
  label:
    type: Symbolic
    title: LMFDB curve label
    display: label
Comments:
  comment-labels: >-
    The label is the LMFDB label for the genus $2$ curve CITE{LMFDBGenus2}.
    Each entry comment gives the isogeny class of the Jacobian and the model
    $y^2+h(x)y=f(x)$.
  comment-lattice: >-
    If $\omega_1,\omega_2$ is the basis of the global sections of the canonical
    sheaf on a regular model of $C$ over $\mathbb{Z}$, then $\Lambda$ is
    generated by the vectors $(\int_\gamma\omega_1,\int_\gamma\omega_2)$ for
    $\gamma\in H_1(C(\mathbb{C}),\mathbb{Z})$.
  comment-components: >-
    The connected-component factor is part of $\Omega_A$ in this table. Some
    authors omit this factor from a period covolume, so the convention should
    be checked when comparing with another source.
  comment-isogeny: >-
    The real period is an invariant of the Jacobian and not of its isogeny
    class: HREF{#277.a.277.1}[277.a.277.1] and
    HREF{#277.a.277.2}[277.a.277.2] lie in one class and have different
    periods, while HREF{#249.a.249.1}[249.a.249.1] and
    HREF{#249.a.6723.1}[249.a.6723.1] have the same period.
Formulas:
  formula-bsd: >-
    The Birch and Swinnerton-Dyer conjecture predicts
    $L^{(r)}(A,1)/r! = \Omega_A R_A |\operatorname{Sha}(A)|
    \prod_p c_p / |A(\mathbb{Q})_{\mathrm{tors}}|^2$, where $r$ is the
    analytic rank, $R_A$ is the regulator, $c_p$ is the Tamagawa number at
    $p$, and $A(\mathbb{Q})_{\mathrm{tors}}$ is the torsion subgroup
    CITE{LMFDBBSD}.

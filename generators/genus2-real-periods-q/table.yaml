Data properties:
  type: R
  rigour: heuristic
  complete: 'no'
  complete-note: >-
    it holds every LMFDB genus $2$ curve with conductor $N\leq1000$ whose real
    period is recorded in the LMFDB genus $2$ curve data
  rigour details: >-
    The generator uses the $159$ LMFDB genus $2$ curve rows with conductor
    $N\leq1000$, fetched from `g2c_curves` and frozen in `curve_data.py`.
    It transcribes the `real_period` decimal string from each row and stores
    the first $28$ significant digits, one digit fewer than the source's
    $97$-bit precision supports. Before the draft was created, PARI's
    `lfungenus2` computation matched the LMFDB `leading_coeff` values on the
    $41$ odd-conductor isogeny classes in the range, and the BSD quotient in
    CITE{formula-bsd} reproduced the $56$ odd-conductor real periods to the
    precision supported by the source fields. The even-conductor rows are not
    certified here by an independent period computation; the table records
    the LMFDB values and is therefore marked `heuristic`.

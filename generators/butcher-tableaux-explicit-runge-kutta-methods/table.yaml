Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: it holds the nonzero rational coefficients of the 18 rational explicit tableaux listed in the source revision, excluding one-parameter families, implicit methods and irrational tableaux
  rigour details: >-
    The generator transcribes the rational coefficients from the cited
    source revisions and stores them as reduced fractions. Each completed
    tableau is checked against the row sums, the order moment conditions,
    the rooted-tree order conditions through its stated order, and an
    independent transcription for the Bogacki-Shampine and Dormand-Prince
    arrays in SciPy.

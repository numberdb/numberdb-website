Title: Butcher tableaux of explicit Runge–Kutta methods
Definition: >-
  An explicit Runge-Kutta method with rational coefficients is determined by
  its Butcher tableau CITE{WikiList}. The table gives the nonzero nodes
  $c_i$, matrix entries $a_{ij}$ with $j<i$, and weights $b^{(q)}_i$ of each
  listed method or embedded pair.
Parameters:
  method:
    type: Symbolic
    title: method
    display: method
    constraints: one of the listed rational explicit methods
    values:
      forward-euler: forward Euler
      midpoint: explicit midpoint method
      heun-2: Heun's second-order method
      ralston-2: Ralston's second-order method
      kutta-3: Kutta's third-order method
      heun-3: Heun's third-order method
      ralston-3: Ralston's third-order method
      van-der-houwen-wray: Van der Houwen-Wray third-order method
      ssprk3: third-order strong stability preserving Runge-Kutta method
      rk4: classic fourth-order Runge-Kutta method
      three-eighths: 3/8-rule fourth-order method
      nystrom-5: Nystrom's fifth-order method
      heun-euler: Heun-Euler embedded pair
      fehlberg-12: Fehlberg RK1(2) embedded pair
      bogacki-shampine: Bogacki-Shampine embedded pair
      fehlberg-45: Runge-Kutta-Fehlberg RKF45 embedded pair
      cash-karp: Cash-Karp embedded pair
      dormand-prince: Dormand-Prince embedded pair
  coefficient:
    type: Symbolic
    title: tableau coefficient
    display: coefficient
    constraints: a key `c_i`, `a_i_j` with $j<i$, or `bq_i` for the order-$q$ weight of stage $i$
Comments:
  comment-indexing: >-
    Stages are numbered from $1$, as in Butcher notation. The first node
    $c_1=0$, zero entries in the strictly lower triangular matrix, and zero
    weights are omitted; an absent coefficient is $0$.
  comment-embedded: >-
    Embedded methods have one weight row for each order. The coefficient
    $b^{(q)}_i$ is the weight of stage $i$ in the order-$q$ formula. Which
    order is used to advance the step is a property of the method, not a
    separate normalisation.
  comment-range: >-
    The listed methods are the rational explicit tableaux in Wikipedia's
    list of Runge-Kutta methods at revision 1346207143. The table excludes
    one-parameter generic families, implicit methods, and Ralston's
    fourth-order method, whose coefficients lie in $\mathbb{Q}(\sqrt5)$.
Formulas:
  formula-step: >-
    The step has the form $y_{n+1}=y_n+h\sum_i b_i k_i$, where
    $k_i=f(t_n+c_i h, y_n+h\sum_{j<i} a_{ij}k_j)$.
  formula-row-sums: >-
    For every stage, $c_i=\sum_{j<i}a_{ij}$.
  formula-moments: >-
    For each order-$q$ weight row and $1\leq m\leq q$,
    $\sum_i b^{(q)}_i c_i^{m-1}=1/m$.
  formula-error: >-
    If an embedded pair has weight rows $b^{(p)}$ and $b^{(q)}$, the
    difference of the two one-step formulas is
    $h\sum_i (b^{(p)}_i-b^{(q)}_i)k_i$.
Programs:
  program-python:
    language: Python
    code: |-
      from fractions import Fraction

      def row_sums(c, a):
          return [sum(row) == node for node, row in zip(c, a)]

      def moment_conditions(c, b, order):
          return [sum(weight * node ** (m - 1) for node, weight in zip(c, b))
                  == Fraction(1, m) for m in range(1, order + 1)]

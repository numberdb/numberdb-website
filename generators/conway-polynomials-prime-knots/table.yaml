Data properties:
  type: Z[]
  rigour: exact
  complete: 'yes'
  rigour details: >-
    Each polynomial is Sage's conway_polynomial() of Knots().from_table(n, k),
    which substitutes into the determinant $\det(V-tV^{\mathsf T})$ of a
    Seifert matrix of the braid closure. Before it is written the generator
    requires it to agree with the polynomial obtained from
    $\det(I-\psi(\beta))(1-t)/(1-t^r)$, computed from the reduced Burau
    matrix $\psi(\beta)$ of the same braid word on $r$ strands, with the
    matrices, their product and a Bareiss determinant written out in the
    generator rather than taken from a library, and converted to $\nabla$
    by writing the symmetric Laurent polynomial $\epsilon t^{-d}\Delta(t)$
    as a polynomial in $t+t^{-1}=z^2+2$; to have only even powers and
    constant term $1$; to satisfy $|\nabla(2i)|=\det K$; to have $a_2$
    modulo $2$ equal to the Arf invariant both as Robertello's sum of
    Alexander coefficients and by Murasugi's criterion; to equal $F_q$ for
    the torus knots $T(2,q)$ and $10_{132}$, and $\Phi_4$, $\Phi_{12}$,
    $\Phi_8$ for $3_1$, $7_7$, $9_{44}$; and the counts per crossing number
    must be $1,1,2,3,7,21,49,165$. Outside the generator all 250 values were
    compared with the conway_polynomial column of KnotInfo (package
    database_knotinfo 2026.9.1, computed from KnotInfo's own diagrams) and
    the Arf invariants with its arf_invariant column; the stored Alexander
    polynomials satisfy $\Delta(s^2)=\epsilon s^{2d}\nabla(s-s^{-1})$ and
    the stored Jones polynomials $V''(1)=-6a_2$, $V(i)=(-1)^{\mathrm{Arf}}$
    and $|V(-1)|=|\nabla(2i)|$ on every knot; the linked Fibonacci and
    cyclotomic entries hold the same polynomials, and no other entry of
    those two tables coincides with a value here. All agree, and the
    controls that must fail fail.
Display properties:
  number-header: $\nabla_{n_k}(z)$

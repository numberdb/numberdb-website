Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every negative discriminant $D\equiv1\pmod8$ with $3\nmid D$
    and $|D|<1200$
  rigour details: >-
    For each $D$, the generator computes the exact Hilbert class polynomial
    $H_{4D}$ and the exact resultant of $H_{4D}(j)$ with
    $(256x^{24}-1)^3-jx^{24}$. It factors this resultant over $\mathbb Z$,
    computes $\omega_D$ from the eta quotient in Sage's arb-backed
    `ComplexBallField`, and selects the unique factor whose interval
    evaluation at $\omega_D$ contains zero. The selected factor is monic over
    $\mathbb Z$. Each polynomial is then compared with PARI's
    `polclass(D,1)` CITE{PARIpolclass} after the reciprocal transform and the
    sign change in $x$ when PARI's chosen Weber class invariant has the
    opposite sign.
Display properties:
  number-header: $W_D(x)$

Title: Weber class polynomials $W_D$
Definition: >-
  For $D<0$, $D\equiv1\pmod 8$ and $3\nmid D$, put $m=-D$. Let
  $\omega_D=\mathfrak f(i\sqrt m)/\sqrt2$, with $\mathfrak f$ Weber's
  function CITE{Schertz2002}. Listed is the monic minimal polynomial
  $W_D(x)\in\mathbb Z[x]$ of $\omega_D$.
Parameters:
  D:
    type: Z
    title: discriminant
    display: $D$
    constraints: $D<0$, $D\equiv1\pmod 8$, and $3\nmid D$
Comments:
  comment-discriminant: >-
    The point $i\sqrt m$ has discriminant $4D$, while the polynomial is
    indexed by the discriminant $D$ of the order whose ring class field is
    generated by the Weber class invariant. This is why the parameter is
    $D$, not $4D$.
  comment-entries: >-
    Each entry's comment gives the class number $h(D)$, which is the degree
    of $W_D$, and says whether $D$ is fundamental.
  comment-height: >-
    These are smaller class polynomials than
    HREF{Hilbert_class_polynomials}[the Hilbert class polynomials] for the
    same discriminants. They are used in the CM method because Weber class
    invariants have much smaller height than the corresponding singular
    moduli.
Formulas:
  formula-eta: >-
    $\mathfrak f(\tau)=\eta(\tau)^2/(\eta(\tau/2)\eta(2\tau))$, where
    $\eta$ is Dedekind's eta function CITE{DLMFEta}.
  formula-j: >-
    For $m=-D$, $j(i\sqrt m)=((256\omega_D^{24}-1)^3)/\omega_D^{24}$
    CITE{WikipediaWeber}.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      P = polclass(-23, 1)      \\ PARI's Weber class-invariant polynomial
      Pol(Vec(P))               \\ x^3 - x^2 + 1; W_{-23}(x)=x^3-x-1 after the reciprocal/sign transform
  program-sage:
    language: Sage
    code: |-
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing
      from sage.schemes.elliptic_curves.cm import hilbert_class_polynomial

      D = -23
      R = PolynomialRing(ZZ, ('x', 'j'))
      x, j = R.gens()
      H = hilbert_class_polynomial(4*D).change_ring(ZZ)
      relation = (256*x^24 - 1)^3 - j*x^24
      factor(H(j).resultant(relation, j))

# The table document for T176, the values of the polylogarithm at rational
# arguments. It began as proposal 2 of
# agents/table-ideas/BATCH-2026-09-09T1055.md. Created as a draft through the
# API (X-Draft: yes), filled by generate.py beside it, and offered for review;
# publishing is a person's act.
Title: Values of the polylogarithm $\mathrm{Li}_s$ at rational arguments
Definition: >-
  This table gives the polylogarithm
  $\mathrm{Li}_s(x)=\sum_{n=1}^{\infty}x^n/n^s$ CITE{DLMFPolylog}, for an
  integer $s\geq2$ and a rational argument $x$ with $-1\leq x\leq1$ and
  $x\neq0$. The rows use the real value given by the convergent defining
  series; no analytic continuation is needed for the listed arguments.
Keywords:
  - dilogarithm
  - trilogarithm
  - quadrilogarithm
  - Spence's function
  - Spence function
  - Jonquiere function
Parameters:
  s:
    type: Z
    title: order of the polylogarithm
    display: $s$
    constraints: $s\geq 2$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $-1\leq x\leq 1$ and $x\neq 0$
Comments:
  comment-names: >-
    The case $s=2$ is the dilogarithm, also called Spence's function, and
    $s=3$ is the trilogarithm. The name Jonquiere's function is also used for
    the polylogarithm CITE{DLMFPolylog}.
  comment-range: >-
    Arguments $x>1$ are complex on the principal branch. Arguments $x<-1$ are
    real for these integer orders, but the dilogarithm inversion formula in
    CITE{formula-inversion} illustrates why that region belongs to a later
    table extension rather than to this real-segment table.
  comment-endpoints: >-
    The endpoint $x=1$ gives
    HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[the Riemann
    zeta values] by CITE{formula-endpoints}. The endpoint $x=-1$ gives the
    corresponding alternating zeta values. The argument $x=0$ is omitted
    because $\mathrm{Li}_s(0)=0$.
Formulas:
  formula-series: >-
    $\mathrm{Li}_s(x)=\sum_{n=1}^{\infty}x^n/n^s$ for $|x|<1$, and the series
    also converges at $x=\pm1$ when $s>1$.
  formula-endpoints: >-
    $\mathrm{Li}_s(1)=\zeta(s)$ and
    $\mathrm{Li}_s(-1)=-(1-2^{1-s})\zeta(s)$.
  formula-reflection: >-
    For $0<x<1$,
    $\mathrm{Li}_2(x)+\mathrm{Li}_2(1-x)=\pi^2/6-\log(x)\log(1-x)$.
  formula-inversion: >-
    For $x>0$,
    $\mathrm{Li}_2(-x)+\mathrm{Li}_2(-1/x)=-\pi^2/6-\log^2(x)/2$.
  formula-half: >-
    $\mathrm{Li}_2(1/2)=\pi^2/12-\log^2(2)/2$, and
    $\mathrm{Li}_3(1/2)=7\zeta(3)/8-\pi^2\log(2)/12+\log^3(2)/6$.
  formula-landen: >-
    $\mathrm{Li}_2(1/3)-\mathrm{Li}_2(1/9)/6=\pi^2/18-\log^2(3)/6$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      s = 2
      x = QQ(1) / QQ(2)
      CBF = ComplexBallField(numberdb.bits(100, losing=96))
      CBF(x).polylog(s).real()       # Li_2(1/2)

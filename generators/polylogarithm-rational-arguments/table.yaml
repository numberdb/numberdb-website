Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=96)` bits by evaluating
    $\mathrm{Li}_s(x)$ at the exact rational argument $x$ and taking the real
    part. The values with $-1<x<1$ were checked against a separately summed
    defining series with an explicit tail bound, while the endpoints were
    checked against the zeta identities in CITE{formula-endpoints}. The
    dilogarithm identities in CITE{formula-reflection}, CITE{formula-inversion}
    and CITE{formula-landen}, the half-argument formulas in
    CITE{formula-half}, and the decimal prefixes for
    $\mathrm{Li}_2(1/2)$, $\mathrm{Li}_3(1/2)$, $\mathrm{Li}_4(1/2)$ and
    $\mathrm{Li}_2(-1/2)$ were checked against CITE{OEISLi2Half},
    CITE{OEISLi3Half}, CITE{OEISLi4Half} and CITE{OEISNegLi2MinusHalf}.
  complete: no
  complete-note: >-
    it holds every entry with $s\in\{2,3,4\}$ and $x=a/b$ in lowest terms with
    $1\leq b\leq 20$, $-1\leq x\leq1$ and $x\neq0$

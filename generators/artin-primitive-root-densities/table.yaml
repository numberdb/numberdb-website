Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every integer base $a$ with $-50\leq a\leq 50$ satisfying the
    parameter constraint
  rigour details: >-
    Artin's constant $A$ was computed with PARI's prodeulerrat at $140$
    decimal digits, and $100$ digits are written. Each value is then an exact
    rational multiple of $A$, with the multiplier computed in $\mathbb Q$ from
    the maximal exponent $h$ and the discriminant $d$ in
    CITE{formula-density}. The value of $A$ agrees with OEIS A005596
    CITE{OEISArtin} when rounded to $100$ decimal places, and recomputing it
    at $160$ decimal digits gives the same $100$ digits. The multipliers for
    all $92$ entries were checked against a second implementation of Hooley's
    formula. Among primes $p\leq 3\cdot10^6$, the observed fractions for
    $a=2,5,8,-3,21$, divided by $\pi(3\cdot10^6)$, differ from $\delta(a)$
    by at most $0.135\%$.
Display properties:
  number-header: $\delta(a)$

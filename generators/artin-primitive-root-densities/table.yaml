# The table document for densities of primes with a given primitive root,
# proposal 3 of agents/table-ideas/BATCH-2026-09-07T0207.md. It was created
# as unpublished draft T165 through the API (X-Draft: yes) and is filled by
# generate.py beside it; publishing is a person's act on the site.
Title: Densities of primes with a given primitive root
Definition: >-
  For $a\in\mathbb Z$ with $a\neq -1$ and $a$ not a perfect square, the Artin
  density is $\delta(a)=\sum_{k\geq1}\mu(k)/[\mathbb Q(\zeta_k,a^{1/k}):\mathbb Q]$
  CITE{WikiArtin} CITE{Hooley} CITE{Moree}.
Parameters:
  a:
    type: Z
    title: integer base
    display: $a$
    constraints: $a\neq -1$ and $a$ is not a perfect square
Comments:
  comment-range: >-
    Perfect squares and $-1$ are omitted because their densities are $0$;
    perfect powers such as $8$ are included because their maximal exponent
    changes the rational factor in CITE{formula-density}.
  comment-conditional: >-
    Unconditionally, Artin's primitive-root conjecture remains open for each
    fixed base $a$ in this table.
  comment-multiples: >-
    Every entry is an exact rational multiple of Artin's constant
    $A=A(1)=\delta(2)$ CITE{OEISArtin} CITE{MathWorldArtin}. The entry comment gives that
    multiple and the discriminant $d$ used in CITE{formula-density}.
Formulas:
  formula-density: >-
    Let $h$ be the largest positive integer for which $a=a_0^h$ with
    $a_0\in\mathbb Z$, and let $d$ be the discriminant of
    $\mathbb Q(\sqrt a)$. With products over primes $q$,
    $A(h)=\prod_{q\nmid h}(1-\frac{1}{q(q-1)})
    \prod_{q\mid h}(1-\frac{1}{q-1})$, and
    $\delta(a)=A(h)$ if $d\not\equiv1\pmod4$, while
    $\delta(a)=A(h)\left(1-\mu(|d|)
    \prod_{\substack{q\mid d\\q\mid h}}\frac{1}{q-2}
    \prod_{\substack{q\mid d\\q\nmid h}}\frac{1}{q^2-q-1}\right)$ if
    $d\equiv1\pmod4$ CITE{Moree} CITE{Stevenhagen}.
  formula-artin: >-
    Artin's constant is
    $A=A(1)=\delta(2)=\prod_q\left(1-\frac{1}{q(q-1)}\right)$, where $q$ runs
    over the primes CITE{OEISArtin} CITE{MathWorldArtin}.
  formula-asymptotic: >-
    Under the generalized Riemann hypothesis for the fields
    $\mathbb Q(\zeta_k,a^{1/k})$ with $k$ squarefree,
    $\#\{p\leq x:a\text{ is a primitive root modulo }p\}\sim
    \delta(a)x/\log x$ CITE{Hooley} CITE{Moree}.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.libs.pari import pari
      pari('default(realprecision, 140)')
      A = pari('prodeulerrat(1 - 1/(p*(p - 1)))')
      pari('20/19') * A           # a = 5
  program-pari:
    language: PARI/GP
    code: |-
      default(realprecision, 140)
      A = prodeulerrat(1 - 1/(p*(p - 1)))
      A                              \\ a = 2
      (20/19) * A                    \\ a = 5
      (3/5) * A                      \\ a = 8

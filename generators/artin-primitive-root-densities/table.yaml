Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every integer base $a$ with $-50\leq a\leq 50$ satisfying the
    parameter constraint
  rigour details: >-
    Artin's constant $A$ was computed with PARI's prodeulerrat at $140$
    decimal digits, and $100$ digits are written. Each value is then an exact
    rational multiple of $A$, with the multiplier computed in $\mathbb Q$ from
    the maximal exponent $h$ and the discriminant $d$ in
    CITE{formula-density}. Before the draft was filled, the value of $A$
    agreed with OEIS A005596 CITE{OEISArtin} through the digits written here;
    the same generator run at $160$ decimal digits gave identical stored
    decimals; the multipliers for every row were checked by a second
    implementation of Hooley's formula; and direct counts of primes up to
    $3\cdot10^6$ gave the expected ratios for $a=2,5,8,-3,21$ to the accuracy
    expected at that range.
Display properties:
  number-header: $\delta(a)$

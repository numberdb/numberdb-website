Title: Secondary polynomials of the Hermite polynomials in physicist's convention $q_n$
Definition: >-
  For $n\geq0$, let $H_n$ be the Hermite polynomial in physicist's convention.
  The secondary polynomial $q_n$ is
  $q_n(x)=\int_{-\infty}^{\infty}(H_n(t)-H_n(x))/(t-x)\,\rho(t)\,dt$
  CITE{Wiki}, where $\rho(t)=e^{-t^2}/\sqrt{\pi}$ is the probability
  density proportional to the Hermite weight.
Parameters:
  n:
    type: Z
    title: degree
    display: $n$
    constraints: $n\geq0$
Comments:
  comment-normalisation: >-
    The weight is normalised to a probability density, so $m_0=1$. With the
    unnormalised weight $e^{-t^2}$ the same integral is $\sqrt{\pi}$ times
    this table's polynomial, which is not a polynomial over $\mathbb{Z}$ or
    $\mathbb{Q}$.
  comment-recurrence: >-
    Equivalently, $q_n$ is the numerator polynomial for the recurrence of
    HREF{Hermite_polynomials_H}[$H_n$]. Since $H_0=1$, $H_1=2x$ and
    $H_{n+1}=2xH_n-2nH_{n-1}$, the corresponding numerator sequence has
    $q_0=0$, $q_1=2$ and the same recurrence. This is the zeroth
    corecursive polynomial, or the order-one associated monic polynomial
    after undoing the monic rescaling, in the terminology of CITE{DLMF}.
  comment-weights: >-
    At the roots $x_1<\cdots<x_n$ of $H_n$,
    $q_n(x_k)/H_n'(x_k)$ is $w_k/\sqrt{\pi}$, where $w_k$ is the weight of
    the $n$-point HREF{Nodes_and_weights_of_Gauss_Hermite_quadrature}[Gauss-Hermite
    quadrature] rule for the unnormalised weight $e^{-x^2}$.
  comment-small: >-
    The first values are $q_0=0$, $q_1=2$, $q_2=4x$,
    $q_3=8x^2-8$ and $q_4=16x^3-40x$.
Formulas:
  formula-recurrence: >-
    $q_0=0$, $q_1=2$, and
    $q_{n+1}(x)=2xq_n(x)-2nq_{n-1}(x)$ for $n\geq1$.
  formula-moments: >-
    If $H_n(x)=\sum_{j=0}^{n}c_jx^j$, then
    $q_n(x)=\sum_{j=1}^{n}c_j\sum_{i=0}^{j-1}m_i x^{j-1-i}$, where
    $m_i=\int_{-\infty}^{\infty}t^i\rho(t)\,dt$ is $0$ for odd $i$ and
    $(i-1)!!/2^{i/2}$ for even $i$.
  formula-pade: >-
    Let $F(z)=\int_{-\infty}^{\infty}\rho(t)/(z-t)\,dt$. Then
    $q_n(z)/H_n(z)$ is the $n$-th convergent of the Stieltjes continued
    fraction for $F(z)$.
  formula-weights: >-
    At a root $x_k$ of $H_n$,
    $q_n(x_k)/H_n'(x_k)=w_k/\sqrt{\pi}$, the normalised Gauss-Hermite
    quadrature weight at $x_k$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, "x")
      x = R.gen()
      q_prev = R.zero()
      q = R(2)
      for n in range(1, 10):
          q_prev, q = q, 2*x*q - 2*n*q_prev
      q

Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every $n\leq50$, matching the range of
    HREF{Hermite_polynomials_H}[the physicists' Hermite polynomial table]
  rigour details: >-
    Every value is exact, a polynomial with integer coefficients, so there is
    no precision to choose. The generator builds $q_n$ from the exact
    recurrence CITE{formula-recurrence}. Before the values were written, the
    recurrence values were checked against the defining integral evaluated
    exactly from the moments in CITE{formula-moments}, against a direct
    polynomial long-division computation of that integral, against the
    degree and parity forced by the definition, and against the normalised
    Gauss-Hermite weight identity CITE{formula-weights} through the stored
    range.
Display properties:
  number-header: $q_n(x)$

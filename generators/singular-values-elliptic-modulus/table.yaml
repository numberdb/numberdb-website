Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds the modulus $k_r$ and the parameter $m_r=k_r^2$ for every integer
    $1\leq r\leq100$
  rigour details: >-
    Each value is computed in Sage's arb-backed `ComplexBallField` at
    `numberdb.bits(digits, losing=256)` bits. The generator evaluates
    $\lambda(i\sqrt r)$ as a complex ball, checks that the imaginary part
    contains zero, and stores its real part for the `parameter` row. The
    `modulus` row is the positive square root of that real ball. At this
    precision the widest value ball before writing has radius below
    $2\cdot10^{-176}$, at the row $r=1$, `modulus`. Before the values were
    sent, the generator checked CITE{formula-theta},
    CITE{formula-elliptic-integral}, CITE{formula-complement}, and
    CITE{formula-j} on every computed row.
Display properties:
  number-header: $k_r$ or $m_r$
  group parameters:
    - [r]
    - [normalisation]
Numbers: []

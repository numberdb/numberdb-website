# The table document for Lyapunov exponents of classical chaotic systems,
# proposal 5 of agents/table-ideas/BATCH-2026-09-09T0015.md. Created as draft
# T171 through the API (X-Draft: yes), filled by generate.py beside it, and
# offered for review; publishing is a person's act on the site.
Title: Lyapunov exponents of classical chaotic systems
Definition: >-
  For each listed chaotic map, flow or random recurrence, this table gives the
  Lyapunov exponent $\lambda_i$ CITE{WikiLyapunov}, ordered
  $\lambda_1\geq\lambda_2\geq\cdots$, in natural-log units per iteration for
  maps, per recurrence step for the random recurrence, and per unit time for
  flows.
Parameters:
  system:
    type: Symbolic
    title: system
    display: system
    constraints: >-
      the map, flow or random recurrence is one of the systems listed here,
      with the displayed parameter values
    values:
      logistic-4: 'logistic map $x_{n+1}=4x_n(1-x_n)$'
      tent-2: 'tent map $x_{n+1}=2\min(x_n,1-x_n)$'
      doubling-2: 'doubling map $x_{n+1}=2x_n\bmod 1$'
      gauss: 'continued-fraction Gauss map $x_{n+1}=1/x_n-\lfloor1/x_n\rfloor$'
      cat: 'Arnold''s cat map, matrix $\begin{pmatrix}2&1\\1&1\end{pmatrix}$'
      baker: 'baker''s map with stretch factor $2$, folded or unfolded'
      henon-1.4-0.3: 'Henon map $x_{n+1}=1+y_n-1.4x_n^2$, $y_{n+1}=0.3x_n$'
      chirikov-1: 'Chirikov standard map $y_{n+1}=y_n+\sin x_n\bmod 2\pi$, $x_{n+1}=x_n+y_{n+1}\bmod 2\pi$'
      lorenz-10-28-8/3: 'Lorenz system $\dot x=10(y-x)$, $\dot y=-xz+28x-y$, $\dot z=xy-\frac83z$'
      rossler-0.2-0.2-5.7: 'Rossler system $\dot x=-y-z$, $\dot y=x+0.2y$, $\dot z=0.2+z(x-5.7)$'
      ueda-7.5-0.05: 'Ueda oscillator $\dot x=y$, $\dot y=-x^3-0.05y+7.5\sin z$, $\dot z=1$'
      sprott-quadratic-2.017: 'Sprott''s simplest quadratic flow $\dot x=y$, $\dot y=z$, $\dot z=-2.017z+y^2-x$'
      sprott-piecewise-0.6: 'Sprott''s simplest piecewise-linear flow $\dot x=y$, $\dot y=z$, $\dot z=-0.6z-y-|x|+1$'
      random-fibonacci: 'random Fibonacci recurrence $f_n=f_{n-1}\pm f_{n-2}$'
  i:
    type: Z
    title: Lyapunov exponent number
    display: $i$
    constraints: >-
      $1\leq i\leq d$, where $d$ is the dimension of the listed map or flow;
      the random Fibonacci recurrence has only $i=1$
Comments:
  comment-units: >-
    The logarithm is the natural logarithm. For maps, one time unit is one
    iterate of the map. For flows, one time unit is the time variable in the
    displayed differential equations. The rows for autonomous flows include
    the zero exponent in the flow direction.
  comment-sources: >-
    The nonzero Henon, Chirikov, Lorenz, Rossler, Ueda and Sprott-flow rows are
    the estimates printed by Sprott CITE{SprottCommon}; Sprott states that the
    least significant digit is only a best estimate. The exact map rows use
    the closed forms in CITE{formula-exact}.
  comment-entropy: >-
    For the measure-preserving examples with the standard invariant measure,
    the Kolmogorov-Sinai entropy is the sum of the positive Lyapunov
    exponents. Thus the logistic, tent, doubling and baker maps have entropy
    $\log2$, Arnold's cat map has entropy
    $\log\frac{3+\sqrt5}{2}$, and the continued-fraction Gauss map has entropy
    $\pi^2/(6\log2)$.
  comment-random-fibonacci: >-
    The random Fibonacci row is the Lyapunov exponent of the random matrix
    product for $f_n=f_{n-1}\pm f_{n-2}$ with independent fair signs
    CITE{WikiRandomFibonacci}. Its exponential is Viswanath's constant
    CITE{OEISA078416}.
Formulas:
  formula-one-dimensional: >-
    For a one-dimensional map $x_{n+1}=f(x_n)$,
    $\lambda(x_0)=\lim_{n\to\infty}\frac1n
    \sum_{j=0}^{n-1}\log|f'(x_j)|$ when the limit exists
    CITE{WikiLyapunov}.
  formula-exact: >-
    For the logistic, tent and doubling maps, $\lambda_1=\log2$. For the
    continued-fraction Gauss map, $\lambda_1=\frac{\pi^2}{6\log2}$, where
    $\pi$ is HREF{Pi}[$\pi$]. For Arnold's cat map,
    $\lambda_1=-\lambda_2=\log\frac{3+\sqrt5}{2}$. For the baker's map,
    $\lambda_1=-\lambda_2=\log2$.
  formula-sums: >-
    For a map or flow with constant Jacobian determinant, the sum of the
    Lyapunov exponents is the logarithm of the absolute value of that
    determinant per iterate or unit time. Hence the Henon sum is $\log0.3$,
    the Chirikov, Arnold-cat and baker sums are $0$, the Lorenz sum is
    $-(\sigma+1+\beta)$, the Ueda sum is $-k$, and the two Sprott-flow sums
    are $-A$.
  formula-random-fibonacci: >-
    For the random Fibonacci recurrence,
    $\lambda_1=\log V$, where $V$ is Viswanath's constant CITE{Viswanath}.
Programs:
  program-sage:
    language: Sage
    code: |-
      R = RealBallField(400)
      log2 = R(2).log()
      log2                                      # logistic, tent, doubling
      R.pi()^2 / (6 * log2)                    # continued-fraction Gauss map
      ((R(3) + R(5).sqrt()) / 2).log()         # Arnold's cat map
      -log2                                    # second baker exponent

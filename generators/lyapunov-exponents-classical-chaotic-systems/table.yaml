  - table: HREF{Feigenbaum_constants}[Feigenbaum constants]
    relation: the logistic map at $r=4$ is the endpoint of the period-doubling route governed by the Feigenbaum constants
  - table: HREF{Hausdorff_dimension_of_fractals}[Hausdorff dimension of some fractals]
    relation: Sprott's source gives Kaplan-Yorke dimensions for the same attractors whose Lyapunov exponents are listed here
  - table: HREF{Entropy_constants_of_lattice_models}[Entropy constants of lattice models]
    relation: both tables store entropy constants, for dynamical systems here and for lattice models there
  - table: HREF{T170}[Constants of the regular continued fraction]
    relation: the continued-fraction Gauss map has Lyapunov exponent $2\beta$, where $\beta$ is the Khinchin-Levy constant
  - table: HREF{Golden_ratio}[Golden ratio]
    relation: Arnold's cat-map exponent is $\log\varphi^2$

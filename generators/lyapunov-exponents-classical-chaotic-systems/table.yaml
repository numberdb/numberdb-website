Data properties:
  type: R
  rigour: heuristic
  complete: 'no'
  complete-note: >-
    it holds the exact spectra of six standard maps, Sprott's printed spectra
    for seven classical numerical examples, and the random Fibonacci exponent
    derived from Viswanath's constant
  rigour details: >-
    The logistic, tent, doubling, continued-fraction Gauss, Arnold-cat and
    baker-map rows were computed from CITE{formula-exact} in real ball
    arithmetic with $64$ guard bits beyond the $100$ written digits.

    The Henon, Chirikov, Lorenz, Rossler, Ueda and Sprott-flow rows were
    transcribed from Sprott's table CITE{SprottCommon}. Each printed decimal
    is stored with the precision it claims under NumberDB's decimal
    convention, so $0.41922$ denotes the interval with the last digit
    uncertain. The zero flow-direction rows are exact zeros. The random
    Fibonacci row was computed as $\log V$ from
    $V=1.1319882487943\ldots$ CITE{OEISA078416} and stored with radius
    $10^{-12}$, wider than the uncertainty from the last published digit of
    $V$.

    The exact closed forms were compared with direct derivative and matrix
    calculations. The transcribed rows were compared with Sprott's printed
    values, and the sums in CITE{formula-sums} were checked on the stored
    intervals for the Henon, Chirikov, Lorenz, Ueda and Sprott-flow rows.
Display properties:
  number-header: $\lambda_i$

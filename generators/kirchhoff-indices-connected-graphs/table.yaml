Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every connected graph on at most $7$ vertices, all $996$ of them
  rigour details: >-
    The generator enumerates connected simple graphs with $1\leq |V(G)|\leq7$
    using Sage, takes each graph's `canonical_label(algorithm='sage')`, and
    stores the canonical graph6 string. It computes $L(G)=D(G)-A(G)$ exactly
    over $\mathbb{Z}$, computes $\lambda(G,x)=\det(xI-L(G))$ exactly, and
    returns $-n c_2/c_1$ as a rational number.

    The build checked that the 996 graph6 strings are exactly the keys of
    HREF{Characteristic_polynomials_of_connected_graphs}[the characteristic
    polynomial table]. The coefficient formula agreed with an exact
    resistance-distance computation from the inverse of $L+J/n$ on every row.
    Formula CITE{formula-laplacian-polynomial} agreed with the stored
    HREF{Laplacian_polynomials_of_connected_graphs}[the Laplacian polynomial]
    on every row. Formulas CITE{formula-complete}, CITE{formula-path-cycle},
    and CITE{formula-star} agreed for every complete graph, path, cycle, and
    star in the table.
Display properties:
  number-header: $\mathrm{Kf}(G)$
  group parameters: [['g']]

Title: Frobenius angles of abelian varieties over prime fields
Definition: >-
  The Frobenius angles of an isogeny class of abelian varieties over
  $\mathbb{F}_q$ are the angles $\theta\in[0,1]$ attached to the roots of
  its L-polynomial by CITE{formula-roots} CITE{LMFDBAngles}. This table
  gives those angles for classes over prime fields.
Parameters:
  g:
    type: Z
    title: dimension
    display: $g$
    constraints: $g\geq1$
  q:
    type: Z
    title: base-field cardinality
    display: $q$
    constraints: $q$ is prime
  label:
    type: Symbolic
    title: LMFDB isogeny-class label
    display: label
  i:
    type: Z
    title: position in the sorted angle list
    display: $i$
    constraints: $i\geq1$
Comments:
  comment-convention: >-
    The list follows the LMFDB convention CITE{LMFDBAnglesInventory}. It
    usually has $g$ entries, but if $0$ or $1$ occurs then the boundary
    angle is listed with its multiplicity, so a genus $2$ class may have
    more than two rows.
  comment-polynomial: >-
    HREF{Weil_polynomials_of_abelian_varieties_over_prime_fields}[The Weil
    polynomial table] stores the characteristic polynomial $P_A(t)$ for the
    same isogeny classes. Its roots have absolute value $\sqrt q$, and the
    L-polynomial used here is $L_A(x)=x^{2g}P_A(1/x)$.
  comment-exact-rows: >-
    An angle is written as an exact rational when the corresponding
    normalized Frobenius eigenvalue is a root of unity. Otherwise it is
    written as a real ball.
Formulas:
  formula-roots: >-
    If $\alpha$ is a root of $P_A(t)$ and
    $\alpha=\sqrt q\,e^{\pi i\theta}$ with $0\leq\theta\leq1$, then
    $\theta$ is one of the angles stored here.
  formula-trace: >-
    For $g=1$, $P_A(t)=t^2-a_qt+q$ and
    $a_q=2\sqrt q\cos(\pi\theta)$.
  formula-root-unity-test: >-
    If $\theta$ is rational with denominator $m$, then
    $\alpha^2/q$ is a root of the cyclotomic polynomial $\Phi_m$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<t> = ZZ[]
      P = t^4 - t^3 - 2*t + 4       # LMFDB 2.2.ab_a
      CBF = ComplexBallField(400)
      roots = P.change_ring(CBF).roots(multiplicities=False)
      sorted((z.arg() / CBF.pi()).real() for z in roots if z.imag() > 0)
Similar tables:
  - table: HREF{Weil_polynomials_of_abelian_varieties_over_prime_fields}[Weil polynomials of abelian varieties over prime fields]
    relation: stores the Weil polynomials whose roots determine these angles
  - table: HREF{Roots_of_unity}[Roots of unity]
    relation: contains the normalized Frobenius eigenvalues when the angle is rational
  - table: HREF{Cos_pi_times_x_at_rational_numbers}[$\cos(\pi x)$ for rational $x$]
    relation: gives the trigonometric values in CITE{formula-trace} for rational angles
  - table: HREF{Gauss_sums_of_primitive_Dirichlet_characters}[Gauss sums of primitive Dirichlet characters]
    relation: stores finite-field character sums whose values are Frobenius eigenvalue sums in related point-counting problems
  - table: HREF{Jacobi_sums_of_pairs_of_Dirichlet_characters_modulo_a_prime}[Jacobi sums of pairs of Dirichlet characters modulo a prime]
    relation: stores finite-field character sums that can determine Frobenius polynomials of diagonal varieties
  - table: HREF{Kloosterman_sums_modulo_a_prime}[Kloosterman sums modulo a prime]
    relation: stores another family of Frobenius trace sums over finite fields

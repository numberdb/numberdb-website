# The table document for numberdb.org/T385. It was created as a draft through
# the API with X-Draft: yes and filled by generate.py beside it. Publishing is
# a person's act.
Title: Zeros of the Dedekind zeta functions of cubic fields
Definition: >-
  Let $K$ be a cubic field CITE{WikiCubic} of discriminant $D$, and let
  $\zeta_K(s)=\sum_{\mathfrak a}N(\mathfrak a)^{-s}$ be its Dedekind zeta
  function CITE{Wiki}, summed over the nonzero ideals of $\mathcal O_K$.
  Listed are the positive ordinates $t_n$ of zeros
  $\zeta_K(1/2+\mathrm{i}t_n)=0$ on the critical line, ordered increasingly
  from $n=1$ for each field.
Keywords:
  - Dedekind zeta zeros
  - cubic field zeta zeros
  - number field zeta zeros
  - cubic field L-function zeros
Parameters:
  D:
    type: Z
    title: discriminant of $K$
    display: $D$
    constraints: $D$ the discriminant of a cubic field
  k:
    type: Z
    title: index of $K$ among the cubic fields of discriminant $D$
    display: $k$
    constraints: $k\geq1$
  n:
    type: Z
    title: index of the positive zero
    display: $n$
    constraints: $n\geq1$
    comments: >-
      For fixed $D$ and $k$, the positive ordinates are ordered increasingly
      and counted from $n=1$.
Comments:
  comment-index: >-
    The fields of discriminant $D$ are numbered $k=1,2,\ldots$ by reducing
    their defining polynomials with PARI's `polredabs` and sorting the
    reduced polynomials lexicographically by coefficient vector. This is the
    same $D,k$ convention used for
    HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[the table of
    residues of Dedekind zeta functions of cubic fields].
  comment-field-comments: >-
    Each entry comment gives the reduced defining polynomial $f$, so that
    $K=\mathbb Q(a)$ with $f(a)=0$; the signature; the Galois group of the
    Galois closure as $C3$ or $S3$; and the LMFDB number-field label.
  comment-symmetry: >-
    The Dirichlet coefficients of $\zeta_K(s)$ are real, so non-real zeros
    occur in conjugate pairs. Only the positive ordinates $t_n>0$ are listed.
  comment-real-zeros: >-
    The trivial real zeros are not entries. For a cubic field with signature
    $(r_1,r_2)$, $\zeta_K(s)$ has trivial zeros at the negative even integers,
    and it also has trivial zeros at the negative odd integers when $r_2=1$.
    The table records the critical-line zeros returned by PARI's `lfunzeros`;
    it does not assert that these are all nontrivial zeros.
  comment-cyclic-fields: >-
    When the Galois closure is $C3$, the quotient
    $\zeta_K(s)/\zeta(s)$ factors into two primitive cubic Dirichlet
    $L$-functions. The entry comments for the conductor-$7$ field identify
    the corresponding rows of
    HREF{Zeros_of_Dirichlet_L_functions}[the Dirichlet zero table].
Formulas:
  formula-completed: >-
    The completed Dedekind zeta function is
    $\Lambda_K(s)=|D|^{s/2}\pi^{-r_1s/2}(2\pi)^{-r_2s}
    \Gamma(s/2)^{r_1}\Gamma(s)^{r_2}\zeta_K(s)$, and it satisfies
    $\Lambda_K(s)=\Lambda_K(1-s)$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      default(realprecision, 80);
      f = x^3 - x^2 + 1;       \\ D = -23
      lfunzeros(lfuncreate(bnfinit(f, 1)), 60, 16)[1]

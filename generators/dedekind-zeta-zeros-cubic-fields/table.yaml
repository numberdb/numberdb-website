Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds the first ten positive zero ordinates for every cubic field with
    $|D|\leq500$, the 58 complex and 12 totally real fields in that range
  rigour details: >-
    The generator enumerates the fields with PARI's `nflist("C3", [1, 500])`
    and `nflist("S3", [1, 500])` CITE{PARInflist}, reduces their defining
    polynomials with `polredabs`, sorts them by increasing $|D|$ and then by
    $k$, and refuses to run unless it finds 70 fields, 58 with negative
    discriminant and 12 with positive discriminant. This agrees with the same
    enumeration at $|D|\leq3000$ used by the cubic Dedekind residue and value
    tables.

    For each field it forms `lfuncreate(bnfinit(f, 1))` and uses PARI/GP's
    `lfunzeros` CITE{PARILfun} at 80 and 120 decimal working digits, with
    search height 60 and zero mesh 16. It stores only digits that agree
    between those two computations. PARI's zero search is not a certified
    enclosure method and may miss zeros, so the table does not claim proven
    zeros. Before the draft was filled, a dry run measured the chosen range:
    every field with $|D|\leq500$ had at least ten positive ordinates below
    height 60, and the largest tenth ordinate was
    $17.1012633035818315519487234446\ldots$ for $D=-23$.
Display properties:
  number-header: $t_n$
  group parameters: [['D'], ['k'], ['n']]

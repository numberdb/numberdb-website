Data properties:
  type: Z[]
  rigour: exact
  complete: 'yes'
  Size exception: >-
    The complete Rolfsen range through ten crossings has 479 entries when both
    mirror images are listed; the dry run measured a 213.7 KB entries block and
    a longest entry of 500 characters, under the 320 KB soft limit and matching
    the range of the Alexander, Jones, Conway and HOMFLY-PT knot tables.
  rigour details: >-
    The values are transcribed from the kauffman_polynomial column of KnotInfo,
    package database_knotinfo 2026.9.1. The generator parses the Laurent
    polynomials exactly, shifts each one by the lowest exponent of $a$, and
    generates the mirror entries by $F_{\bar K}(a,z)=F_K(a^{-1},z)$. It checks
    the Jones specialisation against the stored
    HREF{Jones_polynomials_of_the_prime_knots_with_at_most_ten_crossings}[Jones polynomial]
    table and checks $F_K(1,z)$ against KnotInfo's $Q$-polynomial column.
Display properties:
  number-header: $a^{-m}F_K(a,z)$

    relation: the same knot names, with mirror images not distinguished by the Alexander polynomial
  - table: HREF{Conway_polynomials_of_the_prime_knots_with_at_most_ten_crossings}[Conway polynomials of the prime knots with at most ten crossings]
    relation: the same knot names, with mirror images not distinguished by the Conway polynomial

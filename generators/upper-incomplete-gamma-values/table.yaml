Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Values are computed as real parts of Sage complex balls with arb at
    `numberdb.bits(digits, losing=64)` bits from exact rational parameters and
    arguments. The imaginary part is required to contain zero. The entries are
    checked against CITE{formula-recurrence}, against
    HREF{Values_of_the_exponential_integral}[the exponential integral table]
    on the $a=0$ row, against the erfc identity in CITE{formula-erfc}, and
    against the elementary integer formula CITE{formula-integers}.
  complete: 'no'
  complete-note: >-
    it holds every half-integer parameter $a$ with $-1/2\leq a\leq5/2$ and
    every argument $x=k/10$ with $1\leq k\leq100$
Display properties:
  number-header: $\Gamma(a,x)$

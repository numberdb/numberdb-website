Tags:
  - special values
  - special functions
Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Values are computed as real parts of Sage complex balls with arb at
    `numberdb.bits(digits, losing=64)` bits from exact rational parameters and
    arguments. The imaginary part is required to contain zero. The widest
    returned ball had radius less than $2\cdot10^{-115}$ for 100 requested
    digits. The entries are checked against the recurrence
    CITE{formula-recurrence}, against
    HREF{Values_of_the_exponential_integral}[the exponential integral table]
    on the $a=0$ row, against the erfc identity CITE{formula-erfc}, and
    against the elementary integer formula CITE{formula-integers}.
  repeats: HREF{Values_of_the_exponential_integral}
  complete: 'no'
  complete-note: >-
    it holds $\Gamma(a,x)$ at every $a\in\tfrac12\mathbb{Z}$ with
    $-1/2\leq a\leq5/2$, namely $a=-1/2,0,1/2,1,3/2,2,5/2$, and at every
    argument $x=k/10$ with $1\leq k\leq100$; the positive rows
    $a=1/2,1,3/2,2,5/2$ correspond after regularization to chi-squared
    survival functions with one to five degrees of freedom, while $a=0$ gives
    the exponential integral and $a=-1/2$ carries the recurrence to the
    nearest negative half-integer
Display properties:
  number-header: $\Gamma(a,x)$

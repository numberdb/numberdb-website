Title: k-core thresholds of the Erdős–Rényi random graph
Definition: >-
  The $k$-core of a graph CITE{WikiCore} is its largest subgraph of minimum
  degree at least $k$. For $k\geq3$, the $k$-core threshold $c_k$ is the
  number such that the Erdős–Rényi random graph CITE{WikiER} $G(n,p)$ with
  $p=c/n$ has, with probability tending to $1$ as $n\to\infty$, an empty
  $k$-core when $c<c_k$ and a $k$-core of order $n$ when $c>c_k$; it equals
  $\min_{\lambda>0}\lambda/\mathbb{P}(\mathrm{Po}(\lambda)\geq k-1)$, with
  $\mathrm{Po}(\lambda)$ a Poisson variable of mean $\lambda$ CITE{PSW}.
Parameters:
  k:
    type: Z
    title: minimum degree of the core
    display: $k$
    constraints: $k\geq3$
Comments:
  comment-models: >-
    In $G(n,p)$ with $p=c/n$ and in $G(n,m)$ with $m=cn/2$ the average degree
    is about $c$, and the threshold is the same in both models CITE{PSW}
    CITE{JansonLuczak}. The $2$-core is different: a giant $2$-core grows
    together with the giant component from $c=1$ on, and the quotient
    $\lambda/\mathbb{P}(\mathrm{Po}(\lambda)\geq1)=\lambda/(1-e^{-\lambda})$
    increases from $1$ at $\lambda\to0$, so $c_2=1$ is an infimum that is
    not attained CITE{CainWormald} CITE{JansonLuczak}. For $k\geq3$ the
    minimum is attained at a unique $\lambda_k$ CITE{formula-minimiser}, and
    the $k$-core appears suddenly: at $c=c_k$ it already has about
    $\mathbb{P}(\mathrm{Po}(\lambda_k)\geq k)\,n$ vertices, $0.2676\,n$ for
    $k=3$ CITE{PSW}, and for $c>c_k$ its order is given by
    CITE{formula-size}. The comment on each entry gives $\lambda_k$ and the
    fraction $\mathbb{P}(\mathrm{Po}(\lambda_k)\geq k)$ of the vertices in
    the newborn core.
  comment-history: >-
    Łuczak showed that for $k\geq3$ the $k$-core of $G(n,m)$ is either empty
    or of order $n$ CITE{Luczak}; Pittel, Spencer and Wormald located the
    threshold and proved the formula for $c_k$ CITE{PSW}, and shorter proofs
    were given by Cain and Wormald CITE{CainWormald} and by Janson and
    Łuczak CITE{JansonLuczak}. The same recipe gives the thresholds of
    $k$-cores in random $d$-uniform hypergraphs: with $m\sim cn/d$ edges the
    $k$-core appears at
    $c_{d,k}=\min_{\lambda>0}\lambda/\mathbb{P}(\mathrm{Po}(\lambda)\geq k-1)^{d-1}$
    CITE{Molloy} CITE{CainWormald}, a minimum that is attained for every
    $k\geq2$ when $d\geq3$; for $d=3$ and $k=2$ it is
    $c_{3,2}=2.4554074822\ldots$, so the $2$-core of the random $3$-uniform
    hypergraph appears at $m/n=0.8184691607\ldots$.
Formulas:
  formula-min: >-
    $c_k=\min_{\lambda>0}\frac{\lambda}{\mathbb{P}(\mathrm{Po}(\lambda)\geq k-1)}
    =\min_{\lambda>0}\frac{\lambda}{1-e^{-\lambda}\sum_{j=0}^{k-2}\lambda^j/j!}$
    for $k\geq3$ CITE{PSW}.
  formula-minimiser: >-
    The minimiser $\lambda_k$ is the unique positive zero of
    $g(\lambda)=\mathbb{P}(\mathrm{Po}(\lambda)\geq k-1)-\frac{e^{-\lambda}\lambda^{k-1}}{(k-2)!}$,
    the numerator of the derivative of $\lambda/\mathbb{P}(\mathrm{Po}(\lambda)\geq k-1)$,
    and $\lambda_k>k-2$: $g(0)=0$, $g(\lambda)\to1$ as $\lambda\to\infty$,
    and $g'(\lambda)=\frac{e^{-\lambda}\lambda^{k-2}(\lambda-k+2)}{(k-2)!}$,
    so $g$ decreases on $(0,k-2)$ and increases on $(k-2,\infty)$.
  formula-size: >-
    For $c>c_k$ the equation $\mu/\mathbb{P}(\mathrm{Po}(\mu)\geq k-1)=c$
    has two positive roots, and with $\mu$ the larger one the $k$-core of
    $G(n,m)$, $m\sim cn/2$, has $\mathbb{P}(\mathrm{Po}(\mu)\geq k)\,n\,(1+o(1))$
    vertices and $\frac{\mu}{2}\mathbb{P}(\mathrm{Po}(\mu)\geq k-1)\,n\,(1+o(1))$
    edges with probability tending to $1$ CITE{PSW} CITE{CainWormald}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp, gammainc, findroot, exp, factorial
      mp.dps = 30; k = 3
      T = lambda x: gammainc(k - 1, 0, x, regularized=True)   # P(Po(x) >= k-1)
      x = findroot(lambda x: T(x) - exp(-x)*x**(k-1)/factorial(k-2), k)
      print(x / T(x))                                          # c_k

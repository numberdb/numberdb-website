Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{PSW}
  complete: 'no'
  complete-note: >-
    it holds $c_k$ for every $k$ with $3\leq k\leq12$
  rigour details: >-
    Each entry is the value at the minimiser $\lambda_k$ of
    $f(\lambda)=\lambda/\mathbb{P}(\mathrm{Po}(\lambda)\geq k-1)$, computed
    in ball arithmetic with 64 guard bits beyond the 100 digits written. That
    $\lambda_k$ is the unique minimiser and the minimum is global follows
    from the sign of $f'$, which is the sign of $g$ in
    CITE{formula-minimiser}: $g$ is negative on $(0,\lambda_k)$ and positive
    on $(\lambda_k,\infty)$, so $f$ decreases and then increases. The
    computation encloses $\lambda_k$ by bisection on the sign of $g$ between
    $k-2$ and $4k+10$, each sign decided in ball arithmetic, down to a
    bracket of half-width $10^{-106}$ whose ends are then checked to give
    $g$ opposite signs, and evaluates $f$ on that bracket as a ball; the
    Poisson tail is the finite sum $1-e^{-\lambda}\sum_{j<k-1}\lambda^j/j!$.
    Every ball has radius about $6\cdot10^{-106}$. Before any entry was
    written, all ten values were compared with a computation in mpmath at
    120 digits that writes the tail as the regularised incomplete gamma
    function $\gamma(k-1,\lambda)/\Gamma(k-1)$ and finds the minimiser as a
    root of the numerical derivative of $f$, which agreed to the last
    written digit in every row; $c_3\approx3.35$ and the size $0.27\,n$ of
    the newborn $3$-core were compared with the values Pittel, Spencer and
    Wormald state.
Display properties:

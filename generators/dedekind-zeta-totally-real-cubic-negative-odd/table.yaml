# The table document for proposal 4 of
# agents/table-ideas/BATCH-2026-09-06T1042.md. It is meant to be created as a
# draft through the API (X-Draft: yes) and filled by generate.py beside it;
# publishing is a person's act on the site.
Title: Values of Dedekind zeta functions of totally real cubic fields at negative odd integers
Definition: >-
  Let $K$ be a totally real CITE{Wiki-totally-real} cubic field
  CITE{Wiki-cubic} of discriminant $D$ and
  $\zeta_K(s)=\sum_{\mathfrak{a}}N(\mathfrak{a})^{-s}$ its Dedekind zeta
  function CITE{Wiki-zeta}, summed over the nonzero ideals of
  $\mathcal{O}_K$. Listed is $\zeta_K(s)$ at negative odd integers $s$.
Parameters:
  D:
    type: Z
    title: discriminant of $K$
    display: $D$
    constraints: $D$ the positive discriminant of a totally real cubic field
  k:
    type: Z
    title: index of $K$ among the totally real cubic fields of discriminant $D$
    display: $k$
    constraints: $k\geq 1$
  s:
    type: Z
    title: argument
    display: $s$
    constraints: $s$ a negative odd integer
Comments:
  comment-index: >-
    Non-isomorphic cubic fields can share a discriminant, so the discriminant
    $D$ is not always enough to identify $K$. The fields of discriminant $D$
    are numbered $k=1,2,\ldots$ in lexicographic order of the coefficient
    vectors $(a_2,a_1,a_0)$ of their reduced defining polynomials
    $x^3+a_2x^2+a_1x+a_0$, the polynomial PARI's polredabs returns for the
    field and the LMFDB displays as its defining polynomial. This is the
    index used by HREF{Regulators_of_cubic_fields}[the table of regulators of cubic fields]
    and HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[the table of residues of Dedekind zeta functions of cubic fields].
    In the range computed here, $D=3969$ is the only discriminant carrying
    two fields; every other $D$ has $k=1$.
  comment-rational: >-
    The Siegel-Klingen theorem CITE{Klingen} CITE{Siegel} says that
    $\zeta_K(1-2m)$ is rational for every totally real field $K$ and every
    $m\geq 1$. For a totally real cubic field, the values at negative even
    integers vanish, while $\zeta_K(1-2m)$ has sign $(-1)^m$ by the functional
    equation CITE{formula-functional-equation}; so the entries at $s=-1$ and
    $s=-5$ are negative, and the entries at $s=-3$ are positive.
  comment-entries: >-
    The comment on each entry gives the reduced polynomial $f$, so that
    $K=\mathbb{Q}(x)/(f)$; the Galois group of the Galois closure, $C_3$ or
    $S_3$; and the class number $h_K$. The regulator $R_K$ and the residue at
    $s=1$ of $\zeta_K$ are held in
    HREF{Regulators_of_cubic_fields}[the cubic regulator table] and
    HREF{Residues_of_Dedekind_zeta_functions_of_cubic_fields}[the cubic residue table]
    for the fields with $D\leq 3000$, under the same $D$ and $k$ convention.
  comment-cyclic: >-
    A totally real cubic field is cyclic exactly when $D$ is a square. Then
    $\sqrt{D}$ is the conductor, and
    $\zeta_K(s)=\zeta(s)L(s,\chi)L(s,\bar\chi)$ for either primitive cubic
    Dirichlet character $\chi$ belonging to the field. In this range the
    square discriminants are $49,81,169,361,961,1369,1849,3721,3969$ and
    $4489$; $D=3969$ has two cyclic cubic fields.
  comment-denominators: >-
    The formula CITE{formula-siegel} gives fixed denominator bounds for this
    rectangle: the denominator divides $63$ at $s=-1$, $24570$ at $s=-3$, and
    $10773$ at $s=-5$. These bounds are consequences of the coefficients
    $b_\ell(6m)$ and are much smaller than the $10^{20}$ denominator bound
    used only for the PARI lfun agreement check.
  comment-degree-two: >-
    The real quadratic case is
    HREF{Values_of_Dedekind_zeta_functions_of_real_quadratic_fields_at_negative_odd_integers}[the degree-two table].
    There the values are a product $\zeta(1-2m)L(1-2m,\chi_D)$ for a
    quadratic Dirichlet character. The cyclic rows of this table have an
    analogous factorisation with two conjugate cubic characters; the
    non-cyclic rows are values of a two-dimensional Artin $L$-function.
Formulas:
  formula-siegel: >-
    For $m=1,2,3$,
    $\zeta_K(1-2m)=8\sum_{\ell=1}^{r_m}b_\ell(6m)S_\ell^K(2m)$
    CITE{Louboutin2004}, where $r_1=1$ and $r_2=r_3=2$. Here
    $S_\ell^K(2m)=\sum_\nu\sum_{\mathfrak{b}\mid(\nu)\mathfrak{D}_{K/\mathbb{Q}}}
    N(\mathfrak{b})^{2m-1}$, with $\nu$ ranging over the totally positive
    elements of the codifferent $\mathfrak{D}_{K/\mathbb{Q}}^{-1}$ whose
    trace is $\ell$, and $\mathfrak{b}$ ranging over the integral ideals
    dividing $(\nu)\mathfrak{D}_{K/\mathbb{Q}}$. The coefficients used here
    are $b_1(6)=-1/504$,
    $(b_1(12),b_2(12))=(1/8190,1/196560)$, and
    $(b_1(18),b_2(18))=(-22/3591,-1/86184)$.
  formula-functional-equation: >-
    $\zeta_K(2m)=
    \frac{(-1)^m2^{6m}m^3\pi^{6m}}{((2m)!)^3D^{2m-1/2}}\,
    \zeta_K(1-2m)$ for $m\geq 1$, from
    $\Lambda_K(s)=D^{s/2}(\pi^{-s/2}\Gamma(s/2))^3\zeta_K(s)=
    \Lambda_K(1-s)$. In particular
    $\zeta_K(2)=-8\pi^6\zeta_K(-1)/D^{3/2}$.
  formula-cyclic: >-
    If $K$ is cyclic and $\chi$ is either primitive cubic Dirichlet character
    belonging to $K$, then
    $\zeta_K(1-2m)=\zeta(1-2m)L(1-2m,\chi)L(1-2m,\bar\chi)
    =-B_{2m}B_{2m,\chi}B_{2m,\bar\chi}/(2m)^3$. The factor $B_{2m}$ is in
    HREF{Bernoulli_numbers}[the table of Bernoulli numbers], and the
    generalized Bernoulli numbers $B_{2m,\chi}$ are the quantities indexed
    in HREF{Generalized_Bernoulli_numbers}[the table of generalized Bernoulli numbers].
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      default(realprecision, 80);
      bestappr(lfun(lfuncreate(x^3 - x^2 - 2*x + 1), -1), 10^6)    \\ -1/21, for D = 49

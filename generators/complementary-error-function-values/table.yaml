Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $\operatorname{erfc}(x)$ at every $x$ of two decimal places with
    $0\leq x\leq10$
  rigour details: Each value was computed as a ball with arb at `numberdb.bits(digits,
    losing=64)` bits, and checked against mpmath at 150 decimal digits, against
    the identities in CITE{formula-parity}. The value at $x=0$ is exact and is
    checked to lie in the computed ball rather than taken from it.

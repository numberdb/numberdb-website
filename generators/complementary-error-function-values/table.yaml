# The table document for T204, Values of the complementary error function $\operatorname{erfc}(x)$. It began as proposal 5 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which put six
# functions in one table; they are six tables now, one per
# function, on a grid that reaches to 10 and includes 0.
Title: Values of the complementary error function $\operatorname{erfc}(x)$
Definition: The complementary error function is $\operatorname{erfc}(x)=1-\operatorname{erf}(x)$
  CITE{DLMFDefinitions}, the tail of the Gaussian. This table gives its values
  at rational $x$ with $0\leq x\leq10$.
Keywords:
- complementary error function
- erfc
- Gaussian tail
- normal tail
- Q function
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\geq0$
Comments:
  comment-erfc: For large positive $x$, $\operatorname{erfc}(x)$ is the small
    tail $1-\operatorname{erf}(x)$.
  comment-keyword-context: The probability integral $\alpha(x)$ is $\operatorname{erf}(x/\sqrt{2})$
    CITE{MathWorldProbabilityIntegral}. The standard-normal tail $Q(x)$ is $\tfrac12\operatorname{erfc}(x/\sqrt2)$
    CITE{WikiError}. The curve $t\mapsto(C(t),S(t))$ is Cornu's spiral, also called
    the Euler spiral or clothoid, for this Fresnel normalisation CITE{DLMFGraphics}
    CITE{WikiFresnel}.
  comment-negative-arguments: Negative arguments are not listed separately. Values
    at negative arguments follow from CITE{formula-parity}.
  comment-at-zero: At $x=0$ the value is exact, $\operatorname{erfc}(0)=1$, and
    is stored as the integer rather than as a hundred places of one.
Formulas:
  formula-error-definitions: For real $x$, $\operatorname{erf}(x)=\frac{2}{\sqrt{\pi}}\int_0^x
    e^{-t^2}\,\mathrm{d}t$, $\operatorname{erfc}(x)=1-\operatorname{erf}(x)$,
    and $\operatorname{erfi}(x)=-i\operatorname{erf}(ix)$ CITE{DLMFDefinitions}.
  formula-parity: The functions $\operatorname{erf}$, $\operatorname{erfi}$, $F$,
    $S$ and $C$ are odd, and $\operatorname{erfc}(-x)=2-\operatorname{erfc}(x)$.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.rational_field import QQ

      from sage.rings.real_arb import RealBallField


      field = RealBallField(numberdb.bits(100, losing=64))

      x = field(QQ(1))

      field(1) - x.erf()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.erfc(1)'

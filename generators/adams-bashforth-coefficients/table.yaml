Title: Adams–Bashforth coefficients
Definition: >-
  For $s\geq1$, the Adams–Bashforth coefficients $\beta_{s,j}$ are the
  rational coefficients in
  $y_{n+s}=y_{n+s-1}+h\sum_{j=0}^{s-1}\beta_{s,j}f_{n+j}$, where
  $f_{n+j}=f(t_{n+j},y_{n+j})$ and $t_{n+j}=t_0+(n+j)h$. They are chosen so
  the formula is exact when $f(t,y(t))$ is a polynomial in $t$ of degree at
  most $s-1$ CITE{Wiki}; an absent row has coefficient $0$.
Parameters:
  s:
    type: Z
    title: number of steps
    display: $s$
    constraints: $s\geq1$
  j:
    type: Z
    title: history index, counted from the oldest value
    display: $j$
    constraints: $0\leq j<s$
Comments:
  comment-step: >-
    The step size appears as the single factor $h$ before the sum. Each stored
    number is the coefficient multiplying one $f_{n+j}$ when $h=1$.
  comment-ordering: >-
    Entries are listed from the oldest value to the newest value. Wikipedia
    CITE{Wiki} writes the displayed formulas from newest to oldest; for
    example its three-step row is $(23,-16,5)/12$, while this table stores
    $j=0,1,2$ as $5/12,-4/3,23/12$.
Formulas:
  formula-integral: >-
    If $\ell_{s,j}$ is the Lagrange basis polynomial for the nodes
    $0,1,\ldots,s-1$, with $\ell_{s,j}(i)=1$ for $i=j$ and $0$ otherwise,
    then $\beta_{s,j}=\int_{s-1}^{s}\ell_{s,j}(x)\,\mathrm{d}x$.
  formula-moments: >-
    $\sum_{j=0}^{s-1}\beta_{s,j}j^m=(s^{m+1}-(s-1)^{m+1})/(m+1)$ for
    $0\leq m\leq s-1$.
Similar tables:
  - table: HREF{Lagrange_basis_polynomials_for_equally_spaced_nodes}[Lagrange basis polynomials for equally spaced nodes]
    relation: the coefficients are integrals of these basis polynomials over the next unit interval
  - table: HREF{Newton_Cotes_weights}[Newton–Cotes weights]
    relation: integrals of the same basis over the interval spanned by the interpolation nodes rather than over the next step

Keywords: linear multistep method, explicit multistep method, Adams method, Adams predictor, Euler method
Tags:
  - analysis
Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: it holds every nonzero coefficient with $1\leq s\leq12$
  rigour details: >-
    The generator builds the moment equations over $\mathbb{Q}$ for the nodes
    $0,1,\ldots,s-1$ and solves them exactly. Each completed method is checked
    against the defining moments, the integral formula for the Lagrange basis
    polynomials, and the displayed Adams–Bashforth formulas through $s=5$ in
    CITE{Wiki}.
Display properties:
  number-header: $\beta_{s,j}$
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.matrix.constructor import matrix
      from sage.modules.free_module_element import vector
      from sage.rings.rational_field import QQ

      def adams_bashforth_coefficients(s):
          nodes = list(range(s))
          rows = [[QQ(j) ** m for j in nodes] for m in range(s)]
          rhs = [(QQ(s) ** (m + 1) - QQ(s - 1) ** (m + 1)) / QQ(m + 1)
                 for m in range(s)]
          return dict(zip(nodes, matrix(QQ, rows).solve_right(vector(QQ, rhs))))

      adams_bashforth_coefficients(3)

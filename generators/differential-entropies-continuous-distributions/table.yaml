# The table document for T241, differential entropies of continuous probability
# distributions. It began as proposal 1 of
# agents/table-ideas/BATCH-2026-09-14T0107.md. Created as a draft through the
# API (X-Draft: yes), filled by generate.py beside it, and offered for review;
# publishing is a person's act.
Title: Differential entropies of continuous probability distributions
Definition: >-
  For an absolutely continuous real random variable $X$ with density $f$, the
  differential entropy CITE{WikiDifferentialEntropy} is
  $h(X)=-\int f(x)\log f(x)\,\mathrm{d}x$. This table gives $h(X)$ for named
  one-dimensional continuous probability distributions in their standard
  forms, in nats and in bits.
Tags:
  - probability theory
  - special values
  - special functions
Keywords:
  - continuous entropy
  - differential entropy
  - distribution entropy
  - Student t entropy
  - chi-squared entropy
  - Gamma distribution entropy
  - Beta distribution entropy
  - Gumbel entropy
  - Rayleigh entropy
  - von Mises entropy
  - Weibull entropy
  - Pareto entropy
  - F distribution entropy
  - information theory
Parameters:
  distribution:
    type: Symbolic
    title: distribution family, in standard form
    display: distribution
    values:
      normal: normal $N(0,1)$
      cauchy: Cauchy, location $0$ and scale $1$
      laplace: Laplace, location $0$ and scale $1$
      gumbel: Gumbel, location $0$ and scale $1$
      rayleigh: Rayleigh, scale $1$
      maxwell: Maxwell-Boltzmann, scale $1$
      half-normal: half-normal, scale $1$
      arcsine: arcsine on $[0,1]$
      semicircle: Wigner semicircle, radius $1$
      levy: Levy, location $0$ and scale $1$
      triangular: symmetric triangular on $[0,1]$
      hypsecant-scipy: hyperbolic secant with density $\pi^{-1}\operatorname{sech}x$
      hypsecant-unit-variance: unit-variance hyperbolic secant
      student-t: Student's $t_\nu$
      chi: $\chi_k$
      chi-square: $\chi^2_k$
      gamma: Gamma with shape $a$ and scale $1$
      weibull: Weibull with shape $k$ and scale $1$
      pareto: Pareto with shape $\alpha$ and minimum $1$
      von-mises: von Mises with concentration $\kappa$
      beta: Beta$(a,b)$
      f: $F(n_1,n_2)$
  shape:
    type: Symbolic
    title: shape parameter or tuple of shape parameters
    display: shape
    constraints: >-
      the value is `-` for a distribution with no shape parameter; otherwise
      it is the displayed integer, half-integer or comma-separated tuple named
      by the distribution
  unit:
    type: Symbolic
    title: logarithmic unit
    display: unit
    values:
      nats: nats
      bits: bits
Comments:
  standard-forms: >-
    The standard forms are location $0$ and scale $1$; SciPy continuous
    distributions CITE{SciPyStats} use the same convention. The hyperbolic
    secant distribution has two common standardizations, so the distribution
    parameter distinguishes the SciPy density
    $\pi^{-1}\operatorname{sech}x$ from the unit-variance density
    $\frac12\operatorname{sech}(\pi x/2)$.
  range: >-
    The parameterized rows use $1\leq\nu\leq30$ for Student's $t_\nu$,
    $1\leq k\leq30$ for $\chi_k$ and $\chi^2_k$,
    $a\in\{1/2,1,3/2,\ldots,15\}$ for Gamma$(a,1)$,
    $k\in\{1/2,3/2,2,3,4,5\}$ for Weibull$(k,1)$,
    $2\leq\alpha\leq10$ for Pareto$(\alpha,1)$, $1\leq\kappa\leq10$ for the
    von Mises distribution, $a\leq b$ in
    $\{1/2,1,3/2,\ldots,5\}$ for Beta$(a,b)$, and
    $1\leq n_1,n_2\leq10$ for the $F(n_1,n_2)$ distribution.
  omitted-integers: >-
    The named exponential, logistic and uniform rows are not listed
    separately: their standard entropies are exactly $1$, $2$ and $0$ nats.
    Pareto$(1,1)$ is likewise omitted as a named Pareto row because its
    entropy is exactly $2$ nats.
  lognormal: >-
    If $Z$ is standard normal, then $\exp Z$ has the same differential
    entropy as $Z$, since the change of variables adds $E[Z]=0$.
Formulas:
  formula-scale: >-
    For $\sigma>0$, $h(\mu+\sigma X)=h(X)+\log\sigma$
    CITE{WikiDifferentialEntropy} where $\mu$ is real.
  formula-units: >-
    $h_{\mathrm{bits}}(X)=h_{\mathrm{nats}}(X)/\log 2$.
  formula-normal-bound: >-
    Among real random variables with variance $v$, the normal distribution has
    maximal entropy $\frac12\log(2\pi e v)$
    CITE{WikiDifferentialEntropy} with equality only for the normal law.

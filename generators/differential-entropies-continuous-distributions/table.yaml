Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      R = RealBallField(numberdb.bits(100, losing=96))
      nu = R(QQ(3))
      half = R(QQ(1) / QQ(2))
      # Entropy in nats of Student's t distribution with nu = 3.
      (half * nu.log() + (nu / 2).beta(half).log()
       + (nu + 1) / 2 * (((nu + 1) / 2).psi() - (nu / 2).psi()))
Data properties:
  type: R
  rigour: proven
  complete: no
  complete-note: >-
    it holds the standard-form named distributions and shape ranges stated in
    the comments, in both nats and bits
  rigour details: >-
    Each entry was computed from closed forms in Sage real and complex ball
    arithmetic at `numberdb.bits(digits, losing=128)`. All 626 entries were
    compared with SciPy 1.17.1 `stats` entropy methods; the largest difference
    was $1.7\cdot10^{-10}$ bits, on the Levy row, where SciPy evaluates
    numerically. Direct quadrature of $-f\log f$ checked the normal, Laplace,
    Gumbel, Student $t_\nu$ for $\nu=1,2,3,4,30$, Wigner semicircle and
    unit-variance hyperbolic secant rows. Every finite-variance nats row was
    checked against the normal maximum-entropy bound.
Display properties:
  number-header: $h(X)$

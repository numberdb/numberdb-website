# The table document for T241, differential entropies of continuous probability
# distributions. It began as proposal 1 of
# agents/table-ideas/BATCH-2026-09-14T0107.md. Created as a draft through the
# API (X-Draft: yes), filled by generate.py beside it, and offered for review;
# publishing is a person's act.
Title: Differential entropies of continuous probability distributions
Definition: >-
  For an absolutely continuous real random variable $X$ with density $f$, the
  differential entropy CITE{WikiDifferentialEntropy} is
  $h(X)=-\int f(x)\log f(x)\,\mathrm{d}x$. This table gives $h(X)$ for named
  one-dimensional continuous probability distributions in their standard
  forms, in nats and in bits.
Tags:
  - probability theory
  - special values
  - special functions
Keywords:
  - continuous entropy
  - differential entropy
  - distribution entropy
  - Student t entropy
  - chi-squared entropy
  - Gamma distribution entropy
  - Beta distribution entropy
  - Gumbel entropy
  - Rayleigh entropy
  - Levy entropy
  - von Mises entropy
  - Weibull entropy
  - Pareto entropy
  - F distribution entropy
  - lognormal entropy
  - information theory
Parameters:
  distribution:
    type: Symbolic
    title: distribution family, in standard form
    display: distribution
    values:
      normal: normal $N(0,1)$
      cauchy: Cauchy, location $0$ and scale $1$
      laplace: Laplace, location $0$ and scale $1$
      gumbel: Gumbel, location $0$ and scale $1$
      rayleigh: Rayleigh, scale $1$
      maxwell: Maxwell-Boltzmann, scale $1$
      half-normal: half-normal, scale $1$
      arcsine: arcsine on $[0,1]$
      semicircle: Wigner semicircle, radius $1$
      levy: Lévy, location $0$ and scale $1$
      triangular: symmetric triangular on $[0,1]$
      hypsecant: hyperbolic secant with density $\pi^{-1}\operatorname{sech}x$
      hypsecant-unit-variance: hyperbolic secant with density $\frac12\operatorname{sech}(\pi x/2)$
      student-t: Student's $t_\nu$
      chi: $\chi_k$
      chi-square: $\chi^2_k$
      gamma: Gamma with shape $a$ and scale $1$
      weibull: Weibull with shape $k$ and scale $1$
      pareto: Pareto with shape $\alpha$ and minimum $1$
      von-mises: von Mises with concentration $\kappa$
      beta: Beta$(a,b)$
      f: $F(n_1,n_2)$
  shape:
    type: Symbolic
    title: shape parameter or tuple of shape parameters
    display: shape
    constraints: >-
      the value is `-` for a distribution with no shape parameter; otherwise
      it is the displayed integer, half-integer or comma-separated tuple named
      by the distribution
  unit:
    type: Symbolic
    title: logarithmic unit
    display: unit
    values:
      nats: nats
      bits: bits
Comments:
  standard-forms: >-
    Each distribution is in the form its label states, which is SciPy's
    default CITE{SciPyStats} except for the hyperbolic secant density
    $\frac12\operatorname{sech}(\pi x/2)$.
  omitted-integers: >-
    The standard logistic distribution and Pareto$(1,1)$ both have entropy
    $2$ nats. The standard exponential and uniform distributions are the rows
    Gamma$(1,1)$ and Beta$(1,1)$, and Weibull$(1,1)$ is the exponential
    distribution again.
  lognormal: >-
    If $Z$ is standard normal, then $h(e^Z)=h(Z)+E[Z]$, so the standard
    lognormal distribution has the entropy of the normal row,
    $\frac12\log(2\pi e)$.
Formulas:
  formula-scale: >-
    For real $\mu$ and $\sigma>0$, $h(\mu+\sigma X)=h(X)+\log\sigma$
    CITE{WikiDifferentialEntropy}.
  formula-units: >-
    $h_{\mathrm{bits}}(X)=h_{\mathrm{nats}}(X)/\log 2$.
  formula-normal-bound: >-
    If $X$ has variance $v$, then $h(X)\leq\frac12\log(2\pi e v)$, with
    equality only when $X$ is normal CITE{WikiDifferentialEntropy}.
  formula-student: >-
    $h(t_\nu)=\frac12\log\nu+\log B(\nu/2,1/2)
    +\frac{\nu+1}{2}\left(\psi((\nu+1)/2)-\psi(\nu/2)\right)$ nats.
  formula-chi: >-
    $h(\chi_k)=\log\Gamma(k/2)+k/2-\frac12\log2-\frac{k-1}{2}\psi(k/2)$
    nats.
  formula-chi-square: >-
    $h(\chi^2_k)=k/2+\log2+\log\Gamma(k/2)+(1-k/2)\psi(k/2)$ nats.
  formula-gamma: >-
    $h(\mathrm{Gamma}(a,1))=a+\log\Gamma(a)+(1-a)\psi(a)$ nats.
  formula-weibull: >-
    $h(\mathrm{Weibull}(k,1))=1+\gamma(1-1/k)-\log k$ nats.
  formula-pareto: >-
    $h(\mathrm{Pareto}(\alpha,1))=1+1/\alpha-\log\alpha$ nats.
  formula-von-mises: >-
    $h(\mathrm{von\ Mises}_\kappa)=\log(2\pi I_0(\kappa))
    -\kappa I_1(\kappa)/I_0(\kappa)$ nats.
  formula-beta: >-
    $h(\mathrm{Beta}(a,b))=\log B(a,b)-(a-1)\psi(a)-(b-1)\psi(b)
    +(a+b-2)\psi(a+b)$ nats, and
    $h(\mathrm{Beta}(a,b))=h(\mathrm{Beta}(b,a))$.
  formula-f: >-
    $h(F(n_1,n_2))=\log(n_2/n_1)+\log B(n_1/2,n_2/2)
    -(n_1/2-1)\psi(n_1/2)-(n_2/2+1)\psi(n_2/2)
    +\frac{n_1+n_2}{2}\psi((n_1+n_2)/2)$ nats.
  formula-f-two: >-
    $h(F(2,m))=1+2/m$ nats.
Similar tables:
  - table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the Gamma function at rational numbers]
    relation: the Gamma, Beta and $F$ entropy formulas contain logarithms of Gamma values at rational parameters
  - table: HREF{Values_of_the_Beta_function_at_pairs_of_rational_numbers}[Values of the Beta function at pairs of rational numbers]
    relation: the Student, Beta and $F$ entropy formulas contain Beta functions at rational parameter pairs
  - table: HREF{Values_of_modified_Bessel_functions_of_the_first_kind}[Values of modified Bessel functions of the first kind $I_\nu(x)$]
    relation: the von Mises entropy uses $I_0(\kappa)$ and $I_1(\kappa)$

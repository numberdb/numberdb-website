Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the listed nontrivial determinant families for $2\leq n\leq30$,
    with only even orders of the Clement matrix because the odd orders are
    singular, making 363 entries
  rigour details: >-
    The generator builds each matrix over $\mathbb{Q}$ and computes its
    determinant exactly by fraction-free Bareiss elimination. Before the
    entries were written, `agents/table-build/dry_run.py` computed all 363
    entries, checked exactness, and measured the longest written value as 968
    characters at the Parter matrix with $n=30$, with an entries block of 58.8
    KB. The determinants were checked against the closed forms and recurrences
    in the formulas, and every listed family with $n\leq6$ was also checked by
    a direct Leibniz determinant over permutations. The omitted small families
    were checked against CITE{formula-small}. The relation to
    HREF{T330}[the characteristic polynomial table] was checked against the
    stored T330 draft values on 138 overlapping rows.
Display properties:
  number-header: $\det(A_n)$

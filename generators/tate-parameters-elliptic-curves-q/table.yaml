# the API with X-Draft: yes and is filled by generate.py beside it. Publishing
# is a person's act on the site.
Title: Tate parameters $q_E$ of elliptic curves over $\mathbb{Q}$
Definition: >-
  For an elliptic curve $E/\mathbb{Q}$ with split multiplicative reduction at
  the prime $p$, the entry is the Tate parameter $q_E\in p\mathbb{Z}_p$ of the
  Tate curve over $\mathbb{Q}_p$ isomorphic to $E$ CITE{WikiTate}
  CITE{SageTate}.
Parameters:
  N:
    type: Z
    title: conductor of $E$
    display: $N$
    constraints: $N\geq1$
  c4:
    type: Z
    title: invariant $c_4$ of the reduced global minimal model of $E$
    display: $c_4$
  c6:
    type: Z
    title: invariant $c_6$ of the reduced global minimal model of $E$
    display: $c_6$
  p:
    type: Z
    title: prime of split multiplicative reduction
    display: $p$
    constraints: $p$ is prime and $E$ has split multiplicative reduction at $p$
Comments:
  comment-curve-labels: >-
    The curve is identified by $N$, $c_4$ and $c_6$. Each entry comment gives
    the curve's Cremona label. LMFDB CITE{LMFDB} numbers curves within an
    isogeny class differently from Cremona's tables CITE{SageCremona}, so the
    LMFDB label is also given when it differs.
  comment-precision: >-
    The $p$-adic precision is absolute: the stored value has $O(p^n)$ with the
    least $n$ satisfying $p^n\geq10^{50}$. For example, this gives
    $O(3^{105})$, $O(5^{72})$, $O(7^{60})$ and $O(11^{49})$.
Formulas:
  formula-model-from-invariants: >-
    For the reduced models in this table, $b_2$ is the unique element of
    $\{-4,-3,0,1,4,5\}$ with $b_2\equiv -c_6\pmod{12}$,
    $b_4=(b_2^2-c_4)/24$, and
    $b_6=(-c_6-b_2^3+36b_2b_4)/216$. The model has
    $a_1\equiv b_2\pmod 2$, $a_3\equiv b_6\pmod 2$ with
    $a_1,a_3\in\{0,1\}$ and $a_2\in\{-1,0,1\}$, and
    $a_2=(b_2-a_1^2)/4$, $a_4=(b_4-a_1a_3)/2$ and
    $a_6=(b_6-a_3^2)/4$.
  formula-j-invariant: >-
    For the Tate parameter $q_E$, the $j$-invariant satisfies
    $j(E)=j(q_E)=q_E^{-1}+744+196884q_E+21493760q_E^2+\cdots$.
Programs:
  program-sage:
    language: Sage
    code: |-
      E = EllipticCurve('11a1')
      E.tate_curve(ZZ(11)).parameter(44)

Data properties:
  type: Qp
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every curve in Sage's mini Cremona database CITE{SageCremona}
    with conductor $N\leq100$, and every prime $p$ at which that curve has
    split multiplicative reduction
  sources:
    - CITE{SageCremona}
  rigour details: >-
    The generator reads Weierstrass coefficients from Sage's mini Cremona
    database CITE{SageCremona}, constructs the corresponding reduced minimal
    curves in Sage, filters to split multiplicative primes, and asks Sage's
    `TateCurve.parameter` CITE{SageTate} for $q_E$ with enough relative
    precision to reach the absolute $O(p^n)$ convention stated above. It
    verifies every stored value against Formula CITE{formula-j-invariant}; if
    $v=v_p(q_E)$, the comparison is required to agree to at least $n-2v$ after
    the loss from forming $q_E^{-1}$.
Display properties:
  number-header: $q_E$
  group parameters:
    - [N]
    - [c4, c6]
    - [p]

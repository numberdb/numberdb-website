Data properties:
  type: R
  rigour: proven
  complete: 'yes'
  rigour details: >-
    Each volume is a ball computed in arb at 397 bits from an ideal
    triangulation of the knot exterior that SnapPy CITE{SnapPy} builds from
    the braid word of Sage's knot table, the closure of which is the knot
    $n_k$. SnapPy supplies the gluing equations of the triangulation, which
    are integers, and a floating-point solution; the generator then proves,
    in ball arithmetic and without SnapPy's verify module, that a box of
    complex balls contains a solution of a square subset of the rectangular
    gluing equations (a Krawczyk test on $m-1$ edge equations and the
    meridian, the last edge equation being implied because the edge
    equations multiply to the identity), that every shape ball has positive
    imaginary part, and that every logarithmic gluing equation evaluated on
    the balls is within $0.1$ of $2\pi i$ (edges) or $0$ (meridian and
    longitude), which pins each to its exact value. That is the criterion of
    CITE{HIKMOT}: the triangulation is then a geometric triangulation of the
    complete hyperbolic structure, unique by Mostow–Prasad rigidity, and the
    volume is the sum of the Bloch–Wigner dilogarithms of the shape balls,
    arb's polylog; the digits written are those the ball supports (the widest
    ball, $10_{122}$, supports 113). Outside the generator all 243 balls were compared with
    SnapPy's quad-double volumes, which agree to 62 digits, and with
    KnotInfo's ten decimals, $\mathrm{Vol}(4_1)$ with $2\,\mathrm{Cl}_2(\pi/3)$ in arb and
    with OEIS A091518, and the exterior of each braid closure was checked to
    be isometric to the exterior of KnotInfo's diagram of the same knot. All
    agree, and the controls that must fail fail. The identification of the
    manifold with the complement of the knot named $n_k$ rests on those
    tables, not on a proof.
Display properties:
  number-header: $\mathrm{Vol}(S^3\setminus n_k)$

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds all six listed functions at every rational $x=a/b$
    in lowest terms with $b\leq6$ and $0<x\leq5$
  rigour details: Each value was computed as a Sage real or complex ball with
    arb at `numberdb.bits(digits, losing=64)` bits. The entries were checked
    against mpmath at 150 decimal digits, against the identities in CITE{formula-error-definitions},
    CITE{formula-dawson-erfi}, CITE{formula-fresnel-erf} and CITE{formula-parity},
    and against the OEIS values at $x=1$ CITE{OEISErfOne} CITE{OEISErfiOne}
    CITE{OEISDawsonOne} CITE{OEISFresnelSOne} CITE{OEISFresnelCOne}. The widest
    returned ball had radius less than $10^{-108}$ for 100 requested digits.

Title: Growth rates of the power-free languages
Definition: >-
  Let $L_{k,\beta}$ be the language of finite words over a $k$-letter
  alphabet whose factors have no exponent at least $\beta$; let
  $L_{k,\beta^+}$ use the strict cutoff, forbidding factors whose exponent is
  greater than $\beta$ CITE{ShurTables} CITE{WikiCriticalExponent}. The table
  stores the exponential growth rate
  $\gamma=\alpha(k,\beta)=\lim_{n\to\infty} c_n^{1/n}$, where $c_n$ counts
  words of length $n$ in the indicated language.
Keywords:
  - power-free languages
  - power-free words
  - beta-free words
  - repetition-free words
  - square-free words
  - cube-free words
  - growth rate
  - combinatorics on words

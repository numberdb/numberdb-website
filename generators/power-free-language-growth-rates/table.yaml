Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds the rounded two-sided entries with $\beta\geq2$ in Tables 1 and
    2 of CITE{ShurTables}: the listed binary exponents where the jump is at
    least $0.001$, and the exponents $2$, $2^+$, $3$, $3^+$, $4$, and $4^+$
    for $3\leq k\leq15$
  rigour details: >-
    The entries are transcribed from Shur's rounded Tables 1 and 2
    CITE{ShurTables}. For $\beta\geq2$, the upper bounds in those tables are
    converted to two-sided bounds by the method of CITE{ShurDLT}. The
    generator stores a Sage real interval for each row, widening each printed
    endpoint by one half of the last printed decimal place to account for the
    source rounding.

Comments:
  exponent-convention: >-
    The exponent of a nonempty word is its length divided by its least period.
    Thus a plain $\beta$ row forbids factors with exponent at least $\beta$,
    while a $\beta^+$ row permits exponent exactly $\beta$ and forbids larger
    exponents.
  source-rounding: >-
    Shur's tables print all bounds rounded to seven decimal places. The
    generator widens each printed endpoint by one half of the last printed
    decimal place before storing it.
  omitted-upper-bound-tables: >-
    Shur's later tables for $\beta<2$ give one-sided upper bounds and
    extrapolated estimates. They are not stored here because they would not be
    two-sided growth-rate intervals.
Formulas:
  formula-growth-rate: >-
    $\alpha(k,\beta)=\lim_{n\to\infty} c_n^{1/n}$, where $c_n$ is the number
    of $k$-ary words of length $n$ in the indicated power-free language
    CITE{ShurTables}.
  formula-radius: >-
    If $C(x)=\sum_{n\geq0} c_n x^n$ is the ordinary counting generating
    function and $\rho$ is its radius of convergence, then
    $\gamma=\alpha(k,\beta)=1/\rho$.

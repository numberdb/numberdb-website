Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds $h^*_{B_n}(z)$ for every matrix size $n$ with $3\leq n\leq6$, matching
    the companion Ehrhart polynomial table
  rigour details: The $h^*$-polynomials are transcribed from OEIS A259473 CITE{OEISHStar}.
    Through CITE{formula-binomial-transform}, they give the Ehrhart polynomials compared with
    Beck and Pixton's published rows CITE{BeckPixtonData}; their values at $z=1$ agree with
    OEIS A037302 CITE{OEISVolume}.

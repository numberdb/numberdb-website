Title: Ehrhart $h^*$-polynomials of the Birkhoff polytopes
Definition: The Birkhoff polytope $B_n\subset\mathbb{R}^{n\times n}$ is the lattice polytope
  of $n\times n$ doubly stochastic matrices CITE{WikiBirkhoff}. The table stores its Ehrhart
  $h^*$-polynomial $h^*_{B_n}(z)$, the numerator of the Ehrhart series of $B_n$ CITE{WikiEhrhart}.
Keywords:
- Birkhoff polytope
- Ehrhart polynomial
- Ehrhart h-star polynomial
- Ehrhart h* polynomial
- h-star polynomial
- h* polynomial
- semi-magic squares
- doubly stochastic matrices
- contingency tables
Parameters:
  n:
    type: Z
    title: matrix size
    display: $n$
    constraints: $n$ is a positive integer
Comments:
  comment-series: If $d=(n-1)^2$, then $\sum_{t\geq0}H_n(t)z^t=h^*_{B_n}(z)/(1-z)^{d+1}$.
  comment-small-n: For $n=1$ and $n=2$ the polytope is respectively a point and a line segment,
    and $h^*_{B_1}(z)=h^*_{B_2}(z)=1$.
  comment-known-range: The rows here match the range of the companion Ehrhart polynomial table.
    Beck and Pixton list the Ehrhart polynomials through $n=9$ CITE{BeckPixtonData}.
Formulas:
  formula-series: If $d=(n-1)^2$, then $\sum_{t\geq0}H_n(t)z^t=h^*_{B_n}(z)/(1-z)^{d+1}$.
  formula-binomial-transform: With $h^*_{B_n}(z)=\sum_i h_i^*z^i$ and $d=(n-1)^2$, $H_n(t)=\sum_{i=0}^{d}h_i^*\binom{t+d-i}{d}$.
  formula-normalized-volume: $h^*_{B_n}(1)$ is the normalized volume of $B_n$ CITE{OEISVolume}.
  formula-palindromic: $h^*_{B_n}(z)$ has degree $(n-1)(n-2)$ and palindromic coefficients
    CITE{BeckPixton}.
Programs:
  program-sage:
    language: Sage
    code: 'from sage.rings.rational_field import QQ

      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing


      Z = PolynomialRing(QQ, "z")

      z = Z.gen()

      coefficients = [1, 14, 87, 148, 87, 14, 1]

      sum(QQ(c) * z**i for i, c in enumerate(coefficients))  # h^*_{B_4}(z)'

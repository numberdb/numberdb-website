Title: Genus-zero Gromov-Witten invariants $N_d$ of the projective plane
Definition: >-
  For $d\geq 1$,
  $N_d=\langle [\mathrm{pt}],\ldots,[\mathrm{pt}]\rangle_{0,d}^{\mathbb P^2}$
  is the genus-zero Gromov-Witten invariant with $3d-1$ point insertions
  CITE{GWWiki}.
Parameters:
  d:
    type: Z
    title: degree
    display: $d$
    constraints: $d\geq 1$
Comments:
  point-conditions: >-
    Since $\mathbb P^2$ is homogeneous, $N_d$ is the enumerative count
    CITE{EnumWiki} of degree-$d$ rational curves in $\mathbb P^2$ through
    $3d-1$ points in general position CITE{KM1994}. The condition count
    $3d-1$ is the dimension of that family.
  convention: >-
    The table uses the usual complex enumerative convention. It does not store
    Welschinger's signed real counts, which are different invariants.
Formulas:
  kontsevich-recursion: >-
    $N_1=1$, and for $d\geq 2$,
    $N_d=\sum_{a+b=d,\;a,b\geq 1}N_aN_ba^2b\left(b\binom{3d-4}{3a-2}
    -a\binom{3d-4}{3a-1}\right)$ CITE{KM1994}.
Programs:
  program-python:
    language: Python
    code: |-
      from math import comb

      def plane_gromov_witten(limit):
          values = {1: 1}
          for d in range(2, limit + 1):
              total = 0
              for a in range(1, d):
                  b = d - a
                  total += (values[a] * values[b] * a * a * b
                            * (b * comb(3 * d - 4, 3 * a - 2)
                               - a * comb(3 * d - 4, 3 * a - 1)))
              values[d] = total
          return values

      plane_gromov_witten(15)[15]

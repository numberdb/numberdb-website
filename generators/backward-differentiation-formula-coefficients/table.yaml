Title: Backward differentiation formula coefficients
Definition: >-
  For $1\leq s\leq6$, the backward differentiation formula coefficients
  $\alpha_{s,j}$ and $\beta_s$ are the rational coefficients in the
  $s$-step implicit linear multistep method
  $\sum_{j=0}^{s}\alpha_{s,j}y_{n+j}=h\beta_s f(t_{n+s},y_{n+s})$ of order
  $s$ CITE{Wiki}. The table gives the same method in two invertible
  normalisations: $\alpha_{s,s}=1$ and $\beta_s=1$.
Parameters:
  s:
    type: Z
    title: number of steps
    display: $s$
    constraints: $1\leq s\leq6$
  normalisation:
    type: Symbolic
    title: normalisation
    display: normalisation
    constraints: either `alpha-s-one` or `nabla`
    values:
      alpha-s-one: $\alpha_{s,s}=1$
      nabla: $\beta_s=1$
  coefficient:
    type: Symbolic
    title: method coefficient
    display: coefficient
    constraints: either `beta` or `alpha_j` with $0\leq j\leq s$
    values:
      beta: $\beta_s$
      alpha_0: $\alpha_{s,0}$
      alpha_1: $\alpha_{s,1}$
      alpha_2: $\alpha_{s,2}$
      alpha_3: $\alpha_{s,3}$
      alpha_4: $\alpha_{s,4}$
      alpha_5: $\alpha_{s,5}$
      alpha_6: $\alpha_{s,6}$
Comments:
  comment-notation: >-
    Here $t_{n+j}=t_0+(n+j)h$. The `alpha-s-one` rows use the convention of
    CITE{Wiki}; the `nabla` rows are the backward-difference form
    $\sum_{k=1}^{s}\nabla^k y_{n+s}/k=h f(t_{n+s},y_{n+s})$.
  comment-normalising: >-
    Rows fixed to $1$ by the normalisation are omitted: $\alpha_{s,s}$ in
    the `alpha-s-one` normalisation and $\beta_s$ in the `nabla`
    normalisation. Other coefficients belonging to the method are stored,
    including coefficients whose value is $1$ only in a special case.
  comment-ordering: >-
    The history index $j$ is counted from the oldest value to the newest
    value, so entries follow the order $y_n,y_{n+1},\ldots,y_{n+s}$.
    Wikipedia CITE{Wiki} writes the displayed formulas from newest to oldest;
    for example BDF3 has $\alpha_{3,0},\alpha_{3,1},\alpha_{3,2}$ equal to
    $-2/11,9/11,-18/11$ in the `alpha-s-one` normalisation.
  comment-range: >-
    The BDF methods are zero-stable only for $s\leq6$ CITE{Wiki}; the table
    therefore stops at the six methods that are used as BDF methods.
Formulas:
  formula-moments: >-
    The order-$s$ conditions are
    $\sum_{j=0}^{s}\alpha_{s,j}j^q=q\beta_s s^{q-1}$ for $1\leq q\leq s$,
    together with $\sum_{j=0}^{s}\alpha_{s,j}=0$.
  formula-lagrange: >-
    In the `nabla` normalisation,
    $\alpha_{s,j}=\ell'_{s,j}(s)$, where $\ell_{s,j}$ is the Lagrange basis
    polynomial for the nodes $0,1,\ldots,s$ with $\ell_{s,j}(i)=1$ if
    $i=j$ and $0$ otherwise.
  formula-nabla: >-
    In the `nabla` normalisation,
    $\alpha_{s,j}=(-1)^{s-j}\binom{s}{j}/(s-j)$ for $0\leq j<s$,
    $\alpha_{s,s}=H_s$ and $\beta_s=1$.
  formula-normalisations: >-
    If $H_s=\sum_{k=1}^{s}1/k$, then the `alpha-s-one` coefficients are
    $\alpha_{s,j}^{(1)}=\alpha_{s,j}^{\nabla}/H_s$ and
    $\beta_s^{(1)}=1/H_s$.

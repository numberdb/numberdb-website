# The table document for the two-dimensional critical exponents, proposal 5
# of agents/table-ideas/BATCH-2026-09-06T0326.md. Created as a draft through
# the API (X-Draft: yes) and filled by generate.py beside it; publishing is a
# person's act on the site.
Title: Critical exponents of the two-dimensional universality classes
Definition: >-
  For a universality class of continuous phase transitions in two dimensions
  CITE{WikiUniv}, with $t=(T-T_c)/T_c$ the reduced temperature and $h$ the
  field conjugate to the order parameter $M$, the critical exponents are the
  powers in the asymptotic laws $C\sim|t|^{-\alpha}$ for the specific heat,
  $M\sim(-t)^{\beta}$, $\chi=\partial M/\partial h\sim|t|^{-\gamma}$,
  $M\sim h^{1/\delta}$ at $t=0$, $\xi\sim|t|^{-\nu}$ for the correlation
  length and $\langle\psi(0)\psi(r)\rangle\sim r^{-\eta}$ at $t=0$ for the
  correlation function of the order parameter. For percolation, with the
  occupation probability $p$ in place of the temperature, $n_s\sim s^{-\tau}$
  is the number of clusters of size $s$ per site at $p_c$,
  $s_{\max}\sim|p-p_c|^{-1/\sigma}$ the cutoff of the cluster sizes and
  $M(L)\sim L^{d_f}$ the mass of the critical cluster within distance $L$ of
  a site; for the self-avoiding walk, with the step fugacity $x$ in place of
  the temperature, $d_f=1/\nu$ is the fractal dimension of the walk.
Parameters:
  class:
    type: Symbolic
    title: universality class
    display: class
    values:
      ising: 'Ising'
      potts3: '3-state Potts'
      potts4: '4-state Potts'
      percolation: 'percolation'
      saw: 'self-avoiding walk'
  exponent:
    type: Symbolic
    title: critical exponent
    display: exponent
    values:
      alpha: '$\alpha$, specific heat'
      beta: '$\beta$, order parameter'
      gamma: '$\gamma$, susceptibility'
      delta: '$\delta$, critical isotherm'
      nu: '$\nu$, correlation length'
      eta: '$\eta$, anomalous dimension'
      sigma: '$\sigma$, cluster cutoff'
      tau: '$\tau$, cluster-size distribution'
      df: '$d_f$, fractal dimension'
Comments:
  comment-conventions: >-
    The exponents are those of the standard definitions CITE{WikiCrit}:
    $\alpha$ is negative where the specific heat stays finite at $T_c$ and
    only a derivative diverges, as for percolation, and $\alpha=0$ for the
    Ising model stands for a logarithmic divergence, $C\propto-\ln|t|$;
    $\delta$ is defined on the critical isotherm by $h\propto M^{\delta}$;
    $\eta$ by the decay $r^{-(d-2+\eta)}$ of the order-parameter correlation
    function at $T_c$, which in $d=2$ is $r^{-\eta}$. For every class here
    the exponents are the same on both sides of the transition, and
    hyperscaling holds, so that only two of the six are independent
    CITE{formula-scaling}: the six exponents of a class are determined by the
    scaling dimensions $x_T$ of its thermal and $x_H$ of its magnetic operator
    CITE{formula-exponents}, and the class is characterised by its
    Coulomb-gas coupling $g$ CITE{Nienhuis1987} CITE{formula-coulomb-potts}
    CITE{formula-coulomb-on}, or equivalently by the parameter $\kappa=4/g$ of
    the Schramm–Loewner evolution that describes its interfaces CITE{Cardy}
    CITE{formula-sle}.
  comment-classes: >-
    The Ising class is that of the Ising model CITE{WikiIsing}, whose critical
    couplings on lattices are in the
    HREF{Critical_couplings_of_the_Ising_model_on_lattices}[table of Ising
    critical couplings]; it is the $q=2$ Potts model and the $n=1$ member of the
    $O(n)$ family, and its exponents are those of the minimal model $M(4,3)$
    of conformal field theory CITE{BPZ} CITE{FQS}, with $x_T=2h_{2,1}=1$ and
    $x_H=2h_{1,2}=\frac18$. The $q$-state Potts model CITE{WikiPotts} has a
    continuous transition for $q\le4$ CITE{Baxter} CITE{Wu}, the 3-state
    class being the minimal model $M(6,5)$ CITE{Dotsenko} with
    $x_T=2h_{2,1}=\frac45$ and $x_H=2h_{3,3}=\frac{2}{15}$, and the 4-state
    class the endpoint $q=4$, where every power law carries a multiplicative
    logarithmic correction CITE{SalasSokal}; the 4-state Potts point is also
    a point of the Ashkin–Teller line. Percolation is the $q\to1$ limit of the
    Potts model in its Fortuin–Kasteleyn cluster form CITE{WikiPercExp}, with
    $p$ in place of the temperature; its thresholds on lattices are in the
    HREF{Site_and_bond_percolation_thresholds_of_lattices}[table of
    percolation thresholds]. The self-avoiding walk CITE{WikiSAW} is the
    $n\to0$ limit of the $O(n)$ model, with the step fugacity $x$ in place of
    the temperature and the critical point at $x_c=1/\mu$, $\mu$ the
    connective constant of the lattice. The interfaces of the five classes
    are described by $\mathrm{SLE}_\kappa$ with $\kappa=3$ for the Ising spin
    clusters and $\frac{16}{3}$ for its Fortuin–Kasteleyn clusters,
    $\frac{24}{5}$ for the 3-state Potts clusters, $4$ for the 4-state Potts
    clusters, $6$ for percolation and $\frac83$ for the self-avoiding walk
    CITE{Cardy}.
  comment-percolation: >-
    For percolation CITE{WikiPercExp} the order parameter is the strength
    $P_\infty\sim(p-p_c)^{\beta}$ of the infinite cluster, the susceptibility
    is the mean cluster size $S\sim|p-p_c|^{-\gamma}$, $\alpha$ is defined by
    the singular part $|p-p_c|^{2-\alpha}$ of the number of clusters per site,
    $\delta$ by the response $P_\infty\sim h^{1/\delta}$ to a ghost field $h$
    at $p_c$, $\nu$ by the correlation length and $\eta$ by the probability
    $r^{-\eta}$ that two sites at distance $r$ are connected at $p_c$. The
    number of clusters of size $s$ per site at $p_c$ is $n_s\sim s^{-\tau}$,
    the cutoff of the cluster sizes away from $p_c$ is
    $s_{\max}\sim|p-p_c|^{-1/\sigma}$, and the mass of the incipient infinite
    cluster within a distance $L$ of a site is $M(L)\sim L^{d_f}$, so that
    $d_f=2-\frac{5}{48}$ with $\frac{5}{48}$ the exponent of the probability
    that a site is connected to distance $L$, the one-arm exponent CITE{LSW}.
    The related dimensions of the cluster's hull, $\frac74$, of its external
    perimeter, $\frac43$, and of its backbone are not here.
  comment-saw: >-
    For the self-avoiding walk CITE{WikiSAW} the exponents describe the
    number $c_n\sim A\mu^nn^{\gamma-1}$ of $n$-step walks from a site and their
    mean squared end-to-end distance $\langle R_n^2\rangle\sim Dn^{2\nu}$, and
    $d_f=1/\nu$ is the fractal dimension of the walk, equal to the Hausdorff
    dimension $\frac43$ of the trace of $\mathrm{SLE}_{8/3}$ CITE{Beffara}.
    $\alpha$, $\delta$ and $\eta$ are the exponents of the $O(n)$ model at
    $n\to0$; $\alpha$ also counts the $n$-step self-avoiding polygons,
    $p_n\sim B\mu^nn^{\alpha-3}$, and $\eta=2x_H$ where $x_H=\frac{5}{48}$ is
    the dimension of the one-leg operator, the same value as the one-arm
    exponent of percolation.
  comment-status: >-
    The Ising exponents are theorems: $\alpha=0$ and $\nu=1$ from Onsager's
    free energy CITE{Onsager}, $\beta=\frac18$ from Yang's spontaneous
    magnetisation CITE{Yang}, $\eta=\frac14$ and $\gamma=\frac74$ from the
    correlation functions CITE{WMTB}, and $\delta=15$ from the two-sided
    bound $\langle\sigma_0\rangle_{\beta_c,h}\asymp h^{1/15}$ of Camia,
    Garban and Newman on the magnetisation in a field CITE{CGN}, proved from
    the Griffiths–Hurst–Sherman inequality and the Russo–Seymour–Welsh
    theorem of the random-cluster model together with Wu's asymptotics of the
    two-point function. For
    percolation, $\beta$, $\gamma$, $\nu$ and $\eta$ are theorems for site
    percolation on the triangular lattice CITE{SmirnovWerner}, combining
    Kesten's scaling relations CITE{Kesten}, the one-arm and four-arm
    exponents of the Schramm–Loewner evolution CITE{LSW} and Smirnov's proof of
    Cardy's formula; the existence of $\alpha$ is open, and $\delta$,
    $\sigma$, $\tau$ and $d_f$ follow from the four by the scaling relations.
    The Potts exponents were conjectured from the Coulomb gas, the thermal
    ones by den Nijs CITE{denNijs} and the magnetic ones by Nienhuis, Riedel
    and Schick CITE{NRS} and by Pearson CITE{Pearson}, derived by Nienhuis
    CITE{Nienhuis1984} and confirmed by conformal field theory
    CITE{Dotsenko}; they are accepted as exact and are not theorems. The
    self-avoiding-walk exponents are Nienhuis's conjecture CITE{Nienhuis1982}
    and would follow from the scaling limit of the walk being
    $\mathrm{SLE}_{8/3}$ CITE{LSW2004}; none of the walk's exponents is a
    theorem, and the one exact critical quantity proved on this branch is the
    connective constant $\mu=\sqrt{2+\sqrt2}$ of the honeycomb lattice
    CITE{DuminilCopinSmirnov}.
Formulas:
  formula-coulomb-potts: >-
    For the $q$-state Potts class, percolation being $q=1$,
    $\sqrt q=-2\cos(\pi g)$ with $\frac12\le g\le1$, and
    $x_T=\frac{3}{2g}-1$, $x_H=\frac{(2g-1)(3-2g)}{8g}$ CITE{denNijs}
    CITE{NRS} CITE{Pearson} CITE{Nienhuis1984} CITE{Nienhuis1987}; $g$ is
    $\frac23$, $\frac34$, $\frac56$ and $1$ for $q=1,2,3,4$.
  formula-coulomb-on: >-
    For the dilute $O(n)$ class, the self-avoiding walk being $n=0$,
    $n=-2\cos(\pi g)$ with $1\le g\le2$, and $x_T=\frac4g-2$,
    $x_H=\frac{(3g-2)(2-g)}{8g}$ CITE{Nienhuis1982} CITE{Nienhuis1987}; $g$ is
    $\frac32$ for the walk and $\frac43$ for $n=1$, where the two families
    of formulas give the same Ising exponents.
  formula-exponents: >-
    $\nu=\frac{1}{2-x_T}$, $\alpha=2-2\nu$, $\beta=\nu x_H$,
    $\gamma=\nu(2-2x_H)$, $\delta=\frac{2-x_H}{x_H}$ and $\eta=2x_H$, the
    exponents in $d=2$ of a class whose thermal and magnetic operators have
    scaling dimensions $x_T$ and $x_H$ CITE{Cardy}.
  formula-scaling: >-
    $\alpha+2\beta+\gamma=2$, $\gamma=\beta(\delta-1)$, $\gamma=\nu(2-\eta)$
    and $2\nu=2-\alpha$: the scaling relations of Rushbrooke, Widom and Fisher
    and the hyperscaling relation $d\nu=2-\alpha$ at $d=2$ CITE{WikiCrit}.
  formula-percolation: >-
    $d_f=2-\frac{\beta}{\nu}$, $\tau=1+\frac{2}{d_f}=2+\frac{\beta}{\beta+\gamma}$
    and $\sigma=\frac{1}{\nu d_f}=\frac{1}{\beta+\gamma}$ for percolation
    CITE{WikiPercExp}, and $d_f=\frac1\nu$ for the self-avoiding walk.
  formula-sle: >-
    $\kappa=\frac4g$, and the curves of $\mathrm{SLE}_\kappa$ have Hausdorff
    dimension $1+\frac{\kappa}{8}$ CITE{Beffara}: $\frac43$ for the
    self-avoiding walk, which is its $d_f$, and $\frac74$ for the hull of a
    percolation cluster.
Programs:
  program-sage:
    language: Sage
    code: |-
      g = 2/3                                                   # percolation: sqrt(q) = -2 cos(pi g) at q = 1
      xT, xH = 3/(2*g) - 1, (2*g - 1)*(3 - 2*g)/(8*g)
      nu = 1/(2 - xT)
      [2 - 2*nu, nu*xH, nu*(2 - 2*xH), (2 - xH)/xH, nu, 2*xH]   # alpha, beta, gamma, delta, nu, eta
      [1/(nu*(2 - xH)), 1 + 2/(2 - xH), 2 - xH]                 # sigma, tau, d_f

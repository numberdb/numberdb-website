Data properties:
  type: R
  rigour: measured
  sources:
    - CITE{Wiki}
  complete: 'no'
  complete-note: >-
    it holds the honeycomb, square, triangular, kagome, $(3,12^2)$ and
    $(4,8^2)$ lattices, the Manhattan and L lattices, the simple cubic,
    body-centred cubic and face-centred cubic lattices and the hypercubic
    lattices $\mathbb{Z}^d$ for $4\leq d\leq 8$, the most precise published
    value of each as of 6 September 2026
  rigour details: >-
    Mixed, and labelled by its weakest entries. Two entries are exact and
    are computed in ball arithmetic in arb at 100 digits, with 64 guard
    bits: the honeycomb constant from $\sqrt{2+\sqrt2}$, and the $(3,12^2)$
    constant as the one real root of $x^3-\mu(6^3)x-\mu(6^3)$, whose
    discriminant $\mu(6^3)^2(4\mu(6^3)-27)$ is negative, bracketed by
    bisection on the sign of the cubic with every sign decided in ball
    arithmetic, a sign change checked across the written enclosure, and
    the polynomial of degree $12$ checked to vanish on it. The other 14
    entries were not computed: each is a published estimate, written as
    centre and radius with the paper's stated uncertainty as the radius.
    The L-lattice value is taken from the table in the Wikipedia article,
    which names no source for it, since no paper stating it could be read
    for this table; the Manhattan entry carries the uncertainty
    $2\cdot 10^{-6}$ printed in the paper rather than the $3$ in the last
    digit listed in that table; the $(4,8^2)$ value of Jensen and Guttmann
    was read as quoted by Jensen 2004 and Alm 2005, since the 1998 paper
    itself could not be read. Before any entry was written, the two closed
    forms were compared with OEIS A179260 and A249776 to every digit those
    entries give and with $x^4-4x^2+2$ and the polynomial of degree $12$ by
    a sign change across each written enclosure, and the polynomial of
    degree $12$ with the cubic relation by exact polynomial arithmetic;
    every estimate was compared with the text of the paper cited, read from
    its arXiv version or, for Clisby 2022, from its abstract, and with the
    Wikipedia table on 6 September 2026; the inequality $c_n\geq\mu^n$ was
    checked against the published counts $c_n$ of eleven of the lattices
    for every $n$ available, at most $51$; each estimate was checked to
    lie inside the rigorous bounds of Jensen 2004, Alm 2005 and Owczarek
    and Prellberg 2001; and the $1/(2d-1)$ series against the hypercubic
    entries.

Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds both forms for every $n$ with $3\leq n\leq20$
  rigour details: >-
    The generator computes the forest numbers $f_{n,k}$ by an exact recurrence
    on the tree component containing a distinguished vertex, using Cayley's
    formula for the number of labelled trees on each component. It then forms
    $L_{\Pi_n}(t)=\sum_k f_{n,k}t^k$ and converts this polynomial to
    $h^*_{\Pi_n}(z)$ by the exact Ehrhart-series transform that
    CITE{formula-series} states. Direct lattice-point counts in $t\Pi_n$
    agreed with $L_{\Pi_n}(t)$ for $3\leq n\leq5$ and $0\leq t\leq n$. The
    specialization in CITE{formula-tutte} agreed with
    HREF{Tutte_polynomials_of_connected_graphs}[the stored Tutte polynomials]
    of $K_1,\ldots,K_7$. For every stored $n$, the leading coefficient was
    $n^{n-2}$ and $h^*_{\Pi_n}(1)$ equalled $(n-1)!n^{n-2}$.
Display properties:
  number-header: polynomial

Title: Ehrhart and $h^*$-polynomials of the permutohedra
Definition: >-
  For a positive integer $n$, let $\Pi_n$ be the permutohedron
  $\operatorname{conv}\{(\sigma(1),\ldots,\sigma(n)):\sigma\in S_n\}$ in
  $\mathbb{R}^n$, with respect to the lattice $\mathbb{Z}^n$. This table
  stores its Ehrhart polynomial $L_{\Pi_n}(t)$ and the numerator
  $h^*_{\Pi_n}(z)$ using the Ehrhart-series convention that
  CITE{WikiEhrhart} describes.
Keywords:
  - permutohedron
  - permutohedra
  - Ehrhart polynomial
  - Ehrhart h-star polynomial
  - Ehrhart h* polynomial
  - labelled forests
  - labeled forests
  - graphical zonotope
Parameters:
  n:
    type: Z
    title: rank
    display: $n$
    constraints: $n$ is a positive integer
  form:
    type: Symbolic
    title: form of the polynomial
    display: form
    constraints: either `ehrhart` or `h-star`
    values:
      ehrhart: $L_{\Pi_n}(t)$
      h-star: $h^*_{\Pi_n}(z)$
Comments:
  comment-translation: >-
    CITE{WikiPermutohedron} describes the permutohedron. Translating the
    vertices, for example to $(0,1,\ldots,n-1)$, does not change the Ehrhart
    polynomial.
  comment-small-n: >-
    The omitted case $\Pi_2$ is a segment, with Ehrhart polynomial $t+1$ and
    $h^*$-polynomial $1$.
  comment-zonotope: >-
    The permutohedron is the graphical zonotope of the complete graph $K_n$.
    Stanley's graphical-zonotope formula CITE{StanleyZonotope} gives the
    forest identity. Formula CITE{formula-forests} identifies
    $L_{\Pi_n}(t)$ with the forest polynomial of $K_n$.
  comment-oeis: >-
    OEIS A105599 CITE{OEISEhrhart} lists the Ehrhart-polynomial coefficient
    rows, and OEIS A001858 CITE{OEISForests} lists the totals
    $L_{\Pi_n}(1)$.
Formulas:
  formula-series: >-
    $\sum_{t\geq0}L_{\Pi_n}(t)z^t=h^*_{\Pi_n}(z)/(1-z)^n$.
  formula-forests: >-
    $L_{\Pi_n}(t)=\sum_{k=0}^{n-1}f_{n,k}t^k$, where $f_{n,k}$ is the number
    of forests on $n$ labelled vertices with $k$ edges.
  formula-tutte: >-
    $L_{\Pi_n}(t)=t^{n-1}T_{K_n}(1+1/t,1)$, where $T_{K_n}$ is the Tutte
    polynomial of the complete graph.
  formula-leading: >-
    The leading coefficient of $L_{\Pi_n}(t)$ is $n^{n-2}$, the number of
    labelled trees on $n$ vertices that CITE{OEISTrees} lists.
  formula-one: >-
    $L_{\Pi_n}(1)$ is the number of forests on $n$ labelled vertices.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      T = PolynomialRing(QQ, "t")
      t = T.gen()

      def tree_count(vertices):
          return 1 if vertices == 1 else vertices ** (vertices - 2)

      def forest_counts(n):
          from math import comb
          by_components = [[0 for _ in range(n + 1)] for _ in range(n + 1)]
          by_components[0][0] = 1
          for vertices in range(1, n + 1):
              for components in range(1, vertices + 1):
                  by_components[vertices][components] = sum(
                      comb(vertices - 1, size - 1)
                      * tree_count(size)
                      * by_components[vertices - size][components - 1]
                      for size in range(1, vertices + 1))
          return [by_components[n][n - edges] for edges in range(n)]

      sum(QQ(c) * t ** i for i, c in enumerate(forest_counts(5)))

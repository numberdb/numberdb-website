Keywords: finite difference method, numerical differentiation, central difference, five-point stencil, seven-point stencil, nine-point stencil, eleven-point stencil
Tags:
  - analysis
Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: it holds every nonzero coefficient with $1\leq m\leq6$ and $\lceil m/2\rceil\leq r\leq5$
  rigour details: >-
    The generator builds the moment equations over $\mathbb{Q}$ on the offsets
    $-r,-r+1,\ldots,r$ and solves them exactly. Each completed stencil is
    checked against the defining moments, the parity symmetry, the first
    nonzero error term and the quoted central-difference rows on Wikipedia.
Display properties:
  number-header: $a_{m,r,j}$

Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every pair $m,n\geq1$ with $m+n\leq6$; the next antidiagonal
    would use seven coefficient variables, more than polynomial search accepts
  rigour details: >-
    The generator computes exact integer coefficients in polynomial rings over
    $\mathbb Z$ from the resultant, and all arithmetic is exact. It checks
    Formula CITE{formula-roots} by substituting elementary symmetric functions
    of independent roots, compares the small rows from Formula
    CITE{formula-linear}, Formula CITE{formula-linear-quadratic}, and Formula
    CITE{formula-quadratic-linear} against the stored values, compares every
    stored row with an independently assembled Sylvester determinant, and
    compares integer specializations with Sage's exact univariate resultant
    over $\mathbb Z[x]$.
Display properties:
  number-header: $\operatorname{Res}(f_m,g_n)$

Title: Resultants of two monic polynomials
Definition: >-
  For integers $m,n\geq1$, let
  $f_m(x)=x^m+\sum_{i=0}^{m-1}a_i x^i$ and
  $g_n(x)=x^n+\sum_{j=0}^{n-1}b_j x^j$ be monic polynomials with formal
  coefficients. The entry is the resultant
  $\operatorname{Res}(f_m,g_n)$ CITE{ResultantWiki}, normalized by Formula
  CITE{formula-roots}.
Parameters:
  m:
    type: Z
    title: degree of $f_m$
    display: $m$
    constraints: $m\geq1$
  n:
    type: Z
    title: degree of $g_n$
    display: $n$
    constraints: $n\geq1$
Comments:
  comment-coefficients: >-
    The coefficient $a_i$ multiplies $x^i$ in $f_m$, and $b_j$ multiplies
    $x^j$ in $g_n$. The entry for $(m,n)$ is written in the variables
    $a_0,\dots,a_{m-1},b_0,\dots,b_{n-1}$.
  comment-order: >-
    The resultant is ordered: $\operatorname{Res}(g_n,f_m)=(-1)^{mn}
    \operatorname{Res}(f_m,g_n)$ after the two polynomials are interchanged.
Formulas:
  formula-roots: >-
    If $\alpha_1,\dots,\alpha_m$ are the roots of $f_m$, counted with
    multiplicity, then
    $\operatorname{Res}(f_m,g_n)=\prod_{r=1}^m g_n(\alpha_r)$.
  formula-sylvester: >-
    $\operatorname{Res}(f_m,g_n)$ is the determinant of the Sylvester matrix
    of $f_m$ and $g_n$.
  formula-linear: $\operatorname{Res}(x+a_0,x+b_0)=b_0-a_0$.
  formula-linear-quadratic: >-
    $\operatorname{Res}(x+a_0,x^2+b_1x+b_0)=a_0^2-a_0b_1+b_0$.
  formula-quadratic-linear: >-
    $\operatorname{Res}(x^2+a_1x+a_0,x+b_0)=b_0^2-a_1b_0+a_0$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      m = 2
      n = 3
      R = PolynomialRing(ZZ, ["a%s" % i for i in range(m)] + ["b%s" % j for j in range(n)])
      gens = R.gens()
      a = gens[:m]
      b = gens[m:]
      S = PolynomialRing(R, "x")
      x = S.gen()
      f = x**m + sum(a[i] * x**i for i in range(m))
      g = x**n + sum(b[j] * x**j for j in range(n))
      f.resultant(g)

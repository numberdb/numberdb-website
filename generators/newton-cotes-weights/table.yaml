Title: Newton–Cotes weights
Definition: >-
  For $n\geq 1$, the closed Newton–Cotes weights $w_{n,j}$ are the rational
  coefficients in $\int_0^n f(x)\,\mathrm{d}x\approx
  \sum_{j=0}^n w_{n,j}f(j)$, exact for every polynomial $f$ of degree at
  most $n$ CITE{Wiki}. Each weight is listed in two invertible
  normalisations: the step weight $w_{n,j}$ and the Cotes number
  $C_{n,j}=w_{n,j}/n$ for the unit interval.
Parameters:
  n:
    type: Z
    title: number of subintervals
    display: $n$
    constraints: $n\geq 1$
  j:
    type: Z
    title: node index, counted from the left endpoint
    display: $j$
    constraints: $0\leq j\leq n$
  normalisation:
    type: Symbolic
    title: normalisation
    display: normalisation
    constraints: either `step` or `unit-interval`
    values:
      step: $w_{n,j}$
      unit-interval: $C_{n,j}$
Comments:
  comment-step: >-
    The `step` rows use spacing $h=1$. On an interval with nodes
    $a,a+h,\ldots,a+nh$, the quadrature rule is
    $\int_a^{a+nh}f(x)\,\mathrm{d}x\approx h\sum_{j=0}^n w_{n,j}f(a+jh)$.
    The `unit-interval` rows divide the same weights by $n$, giving
    $\int_0^1 f(x)\,\mathrm{d}x\approx\sum_{j=0}^n C_{n,j}f(j/n)$.
  comment-ordering: >-
    The node index $j$ is counted from the left endpoint, so the entries are
    in the same order as $f(0),f(1),\ldots,f(n)$ in the step form. Every
    symmetric duplicate is stored: $w_{n,j}=w_{n,n-j}$, and a reader may hold
    either end of the rule.
  comment-reduced: >-
    The entries are reduced fractions. The common-denominator form printed in
    tables of quadrature rules, such as
    $\tfrac{2}{45}(7,32,12,32,7)$ for Boole's rule, is given as an entry
    comment on the first row of each rule.
  comment-negative: >-
    The closed equally spaced rules stop being positive: the first negative
    weights in this range occur for $n=8$, where
    $w_{8,2}=w_{8,6}=-3712/14175$. The rules with $n=10,11,12$ also have
    negative weights.
  comment-neighbours: >-
    The weights are the integrals of
    HREF{Lagrange_basis_polynomials_for_equally_spaced_nodes}[the Lagrange
    basis polynomials for equally spaced nodes]. HREF{Nodes_and_weights_of_Gauss_Legendre_quadrature}[Gauss–Legendre],
    HREF{Nodes_and_weights_of_Gauss_Lobatto_quadrature}[Gauss–Lobatto] and
    HREF{Nodes_and_weights_of_Gauss_Kronrod_quadrature}[Gauss–Kronrod]
    quadrature choose different, non-equally spaced nodes for the same
    integration problem.
Formulas:
  formula-lagrange: >-
    $w_{n,j}=\int_0^n \ell_{n,j}(x)\,\mathrm{d}x$, where
    $\ell_{n,j}(x)=\prod_{0\leq k\leq n,\ k\neq j}\frac{x-k}{j-k}$.
  formula-cotes: >-
    $C_{n,j}=w_{n,j}/n$, so the two normalisations determine one another.
  formula-exactness: >-
    $\sum_{j=0}^n w_{n,j}j^m=\int_0^n x^m\,\mathrm{d}x=\frac{n^{m+1}}{m+1}$
    for $0\leq m\leq n$; when $n$ is even, the same identity also holds for
    $m=n+1$.
  formula-symmetry: >-
    $w_{n,j}=w_{n,n-j}$, $C_{n,j}=C_{n,n-j}$,
    $\sum_{j=0}^n w_{n,j}=n$ and $\sum_{j=0}^n C_{n,j}=1$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(QQ, 'x')
      x = R.gen()
      def newton_cotes_weights(n):
          weights = []
          for j in range(n + 1):
              ell = R(1)
              for k in range(n + 1):
                  if k != j:
                      ell *= (x - k) * (QQ(1) / QQ(j - k))
              anti = ell.integral()
              weights.append(anti(n) - anti(0))
          return weights

      newton_cotes_weights(4)     # [14/45, 64/45, 8/15, 64/45, 14/45]

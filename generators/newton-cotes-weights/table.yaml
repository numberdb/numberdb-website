Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: it holds every closed rule with $1\leq n\leq 12$, in both the step and unit-interval normalisations
  rigour details: >-
    The generator builds the Lagrange moment equations over $\mathbb{Q}$ and
    solves them exactly. Each completed rule is checked against the moments
    through degree $n$, and through degree $n+1$ when $n$ is even, against
    the symmetry and the two normalisations, against the quoted rows on
    Wikipedia and MathWorld for the named small rules, and against OEIS
    A093735 and A093736 where those b-files give the same rows.
Display properties:
  number-header: $w_{n,j}$ or $C_{n,j}$

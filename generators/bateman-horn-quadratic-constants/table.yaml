# The table document for Bateman-Horn constants of monic quadratic
# polynomials, proposal 2 of agents/table-ideas/BATCH-2026-09-07T0207.md.
# It was created as draft T166 through the API (X-Draft: yes) and is filled by
# generate.py beside it; publishing is a person's act on the site.
Title: Bateman-Horn constants of monic quadratic polynomials
Definition: >-
  For a monic irreducible quadratic polynomial $f\in\mathbb Z[x]$ with no
  fixed prime divisor, this table stores the Bateman-Horn constant $C(f)$
  CITE{WikiBH} CITE{BH1962} in the normalization of CITE{formula-product}.
Parameters:
  f:
    type: Symbolic
    title: polynomial
    display: $f$
    constraints: >-
      $f=x^2+bx+c$ with $b,c\in\mathbb Z$, $f$ irreducible over
      $\mathbb Q$, and no prime divides every value $f(n)$
Comments:
  comment-normalization: >-
    The table stores $C(f)$ itself. Since every polynomial here has degree
    $2$, the Bateman-Horn asymptotic in CITE{formula-asymptotic} has the
    leading constant $C(f)/2$.
  comment-range: >-
    The table holds every polynomial $x^2+a$ with $-30\leq a\leq30$ and
    $-a$ not a square, and every polynomial $x^2+x+a$ with $1\leq a\leq41$
    and $a$ odd. The even values of $a$ in $x^2+x+a$ are omitted because
    all values of the polynomial are then even.
  comment-conjectural: >-
    The Euler product defining $C(f)$ converges for every polynomial in the
    parameter domain. The asymptotic interpretation as a density of prime
    values remains conjectural.
  comment-examples: >-
    For $f=x^2+1$, OEIS A199401 gives $C(f)$ CITE{OEISx2plus1}, while OEIS
    A331941 gives $C(f)/2$ CITE{OEISx2plus1Half}. For
    $f=x^2+x+41$, OEIS A221712 gives $C(f)/2$ CITE{OEISEuler41}.
Formulas:
  formula-product: >-
    $C(f)=\prod_p\dfrac{1-N_f(p)/p}{1-1/p}$, where $N_f(p)$ is the number
    of roots of $f$ modulo $p$.
  formula-quadratic: >-
    If $\Delta=b^2-4c$ for $f=x^2+bx+c$, then
    $N_f(p)=1+\left(\frac{\Delta}{p}\right)$ and therefore
    $C(f)=\prod_p\left(1-\dfrac{1}{p-1}\left(\frac{\Delta}{p}\right)\right)$,
    with the Kronecker symbol $\left(\frac{\Delta}{p}\right)$.
  formula-asymptotic: >-
    The Bateman-Horn conjecture predicts
    $\#\{n\leq x:f(n)\text{ is prime}\}\sim
    \dfrac{C(f)}{2}\int_2^x\dfrac{dt}{\log t}$ for the quadratic
    polynomials in this table CITE{WikiBH} CITE{BH1962}.
Programs:
  program-sage:
    language: Sage
    code: |-
      from generate import BatemanHornQuadraticConstants
      g = BatemanHornQuadraticConstants()
      g.value({'f': 'x^2+1'}, 100)         # 1.3728134628182460091...
      g.value({'f': 'x^2+x+41'}, 100)      # 6.6395463549428433306...
  program-pari:
    language: PARI/GP
    code: |-
      \\ Load HardyLittlewood2 from the Belabas-Cohen script CITE{BelabasCohenGP}.
      default(realprecision, 140)
      HardyLittlewood2(x^2+1)              \\ 1.3728134628182460091...
      HardyLittlewood2(x^2+x+41)           \\ 6.6395463549428433306...

    relation: Cohen's acceleration rewrites the prime-indexed products through prime sums computed from zeta values
  - table: HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[Values of Dirichlet L-functions at positive integers]
    relation: CITE{formula-quadratic} is evaluated through Dirichlet $L$-values of quadratic characters
  - table: HREF{Residues_of_Dedekind_zeta_functions_of_quadratic_fields}[Residues of Dedekind zeta functions of quadratic fields]
    relation: for a fundamental discriminant $D$, $L(1,\left(\frac{D}{\cdot}\right))$ is the residue at $s=1$ of the Dedekind zeta function of $\mathbb Q(\sqrt D)$

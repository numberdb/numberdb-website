Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every polynomial $x^2+a$ with $-30\leq a\leq30$ satisfying the
    parameter constraint, and every polynomial $x^2+x+a$ with
    $1\leq a\leq41$ satisfying the parameter constraint
  rigour details: >-
    Values were computed with the Belabas-Cohen PARI/GP algorithm
    CITE{BelabasCohenGP}, which implements Cohen's accelerated computation
    of Hardy-Littlewood constants CITE{Cohen1998}. PARI was run at $140$
    decimal digits, and $100$ digits are written. Before the draft was
    filled, the root-count identity in CITE{formula-quadratic} was checked
    directly modulo every prime $p\leq97$ for every row; $C(x^2+1)$ and
    $C(x^2+x+41)$ were compared with OEIS A199401 CITE{OEISx2plus1} and
    twice OEIS A221712 CITE{OEISEuler41}; the same two values were recomputed
    with an independent Sage character-split zeta expansion; and the
    generator was rerun at $160$ decimal digits on the displayed examples.
Display properties:
  number-header: $C(f)$

Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{KRU}
    - CITE{MMU}
  complete: 'no'
  complete-note: >-
    it holds $\epsilon^{\mathrm{MAP}}_{l,r}$ for every pair with
    $3\leq l<r\leq12$
  rigour details: >-
    Each entry is computed in ball arithmetic with 64 guard bits beyond the
    100 digits written. The root $x^{\mathrm{MAP}}_{l,r}$ is enclosed by
    bisection on the sign of $p^{\mathrm{MAP}}_{l,r}(x)$ in the interval
    $(0,1)$, down to a bracket of half-width $10^{-106}$ whose ends are
    checked to give opposite signs; the value of
    $x/(1-(1-x)^{r-1})^{l-1}$ on that bracket is the stored ball. The
    generator also checks every row against the equivalent trial-entropy
    equation in CITE{formula-trial-entropy}, compares every row with an
    mpmath bisection, compares the $(3,6)$ row with the printed value
    $0.488151$ in CITE{KRU}, and checks
    $\epsilon^{\mathrm{BP}}_{l,r}<\epsilon^{\mathrm{MAP}}_{l,r}<l/r$
    against HREF{T275}.

Title: MAP thresholds of regular LDPC codes on the binary erasure channel
Definition: >-
  For $3\leq l<r$, $\epsilon^{\mathrm{MAP}}_{l,r}$ is the binary erasure
  channel CITE{WikiBEC} threshold of maximum a posteriori decoding for the
  regular $(l,r)$ low-density parity-check ensemble CITE{WikiLDPC} CITE{KRU}.
Keywords: Gallager codes, density evolution, optimal decoding, coding theory, threshold saturation
Parameters:
  l:
    type: Z
    title: variable degree
    display: $l$
    constraints: $l\geq3$
  r:
    type: Z
    title: check degree
    display: $r$
    constraints: $r>l$
Comments:
  comment-conventions: >-
    The value stored here is the channel erasure probability $\epsilon$, not
    the constraint density. Here $l$ is the variable degree and $r$ is the
    check degree. The parity-check density of the ensemble is $m/n=l/r$, and
    its design rate is $1-l/r$ when the checks are independent.
  comment-l2: >-
    There are no $l=2$ rows. The table follows the non-cycle regular
    ensembles with $l\geq3$ used in the analytic threshold characterization of
    CITE{KRU}.
  comment-root: >-
    At the MAP threshold, density evolution has a nonzero fixed point
    $x^{\mathrm{MAP}}_{l,r}$ in $(0,1)$; each entry comment gives this root.
  comment-maxwell: >-
    The root condition is the Maxwell construction for the extended
    belief-propagation EXIT curve CITE{MMU}. Kudekar, Richardson and Urbanke
    give the regular-ensemble analytic characterization used here as
    Lemma 4 CITE{KRU}.
Formulas:
  formula-density-evolution: >-
    The density-evolution fixed point equation on the binary erasure channel
    is $x=\epsilon(1-(1-x)^{r-1})^{l-1}$ CITE{KRU}.
  formula-threshold-curve: >-
    For $0<x\leq1$, write
    $\epsilon(x)=x/(1-(1-x)^{r-1})^{l-1}$.
  formula-root: >-
    The root $x^{\mathrm{MAP}}_{l,r}$ is the solution in $0<x<1$ of
    $p^{\mathrm{MAP}}_{l,r}(x)=0$, where
    $p^{\mathrm{MAP}}_{l,r}(x)=x+\frac1r(1-x)^{r-1}
    (l+l(r-1)x-rx)-\frac lr$ CITE{KRU}.
  formula-trial-entropy: >-
    Equivalently,
    $\epsilon(x)(1-(1-x)^{r-1})^l+lx(1-x)^{r-1}
    -\frac lr(1-(1-x)^r)=0$ at $x=x^{\mathrm{MAP}}_{l,r}$.
  formula-threshold: >-
    The threshold is
    $\epsilon^{\mathrm{MAP}}_{l,r}=\epsilon(x^{\mathrm{MAP}}_{l,r})$
    CITE{KRU}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      l, r = 3, 6
      def p(x):
          y = 1 - x
          return x + y**(r - 1) * (l + l * (r - 1) * x - r * x) / r - mp.mpf(l) / r
      lo, hi = mp.mpf("1e-30"), mp.mpf(1)
      for _ in range(200):
          mid = (lo + hi) / 2
          if p(mid) < 0:
              lo = mid
          else:
              hi = mid
      x = (lo + hi) / 2
      print(x / (1 - (1 - x)**(r - 1))**(l - 1))

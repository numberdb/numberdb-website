Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every lattice of
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[the
    classical-lattice packing table], with every integer or half-integer
    $s$ satisfying $n/2<s\leq n/2+3$, together with the rows $s=3$ for
    $n\leq5$ and $s=6$ for $n\leq11$
  rigour details: >-
    Each entry is computed in arb ball arithmetic from the Epstein-Terras
    incomplete-gamma expansion CITE{Terras}, with `pari(G).qfrep(B, 0)` used
    to count one vector from each pair $\pm x$ of vectors of norm
    $x^{\mathsf{T}}Gx=m$ and a factor of $2$ applied to the contribution. The
    same expansion is evaluated for the dual Gram matrix, and the truncation
    bounds use the explicit positive tails of the upper incomplete-gamma
    series. The generator checks the $\mathbb{Z}^2$, $A_2$ and $E_8$ closed
    forms above wherever their parameters appear, and checks the
    Lennard-Jones values for $\mathbb{Z}^3$, $A_3$ and $A_3^{*}$ at $s=3$ and
    $s=6$ against a direct summation over lattice vectors at lower precision.
Display properties:
  number-header: $Z_L(s)$

# Draft document for T402, Epstein zeta values of the classical lattices.
# It began as proposal 1 of numberdb-data#180. It was created as a draft
# through the API, filled by generate.py beside it, and offered for review.
# Publishing is a person's act.
Title: Values of the Epstein zeta function of the classical lattices
Definition: >-
  For a lattice $L\subset\mathbb{R}^n$ with Gram matrix $G$ in the
  normalisation of
  HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[the
  classical-lattice packing table], the Epstein zeta function CITE{WikiEpstein}
  is
  $Z_L(s)=\sum_{0\ne x\in\mathbb{Z}^n}(x^{\mathsf{T}}Gx)^{-s}$, for rational
  $s>n/2$. Listed are values for $\mathbb{Z}^n$, the root lattices, their
  duals, the laminated lattices $\Lambda_n$ and the Coxeter-Todd lattice
  $K_{12}$, using the Gram matrices of the Catalogue of Lattices
  CITE{Catalogue}.
Keywords:
  - Epstein zeta function
  - Epstein zeta
  - lattice sum
  - Lennard-Jones lattice constants
  - Lennard-Jones A6
  - Lennard-Jones A12
  - face-centred cubic
  - body-centred cubic
Tags:
  - lattice sums
  - special values
  - discrete geometry
  - number theory
  - statistical mechanics
Parameters:
  family:
    type: Symbolic
    title: family of the lattice
    values:
      Z: $\mathbb{Z}^n$
      A: $A_n$
      A*: $A_n^{*}$
      D: $D_n$
      D*: $D_n^{*}$
      E: $E_n$
      E*: $E_n^{*}$
      Lambda: $\Lambda_n$
      K: $K_n$
    display: family
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: >-
      $n\geq1$ for $\mathbb{Z}^n$ and $A_n$; $n\geq4$ for $D_n$;
      $n\in\{6,7,8\}$ for $E_n$; $n\geq3$ for $A_n^{*}$; $n\geq5$ for
      $D_n^{*}$; $n\in\{6,7\}$ for $E_n^{*}$; $n\geq9$ for $\Lambda_n$;
      $n=12$ for $K_n$
  s:
    type: Q
    title: exponent
    display: $s$
    constraints: $s\in\frac12\mathbb{Z}$ and $s>n/2$
Comments:
  comment-normalisation: >-
    The root lattices use minimal norm $2$, while $\mathbb{Z}^n$ uses minimal
    norm $1$. The value is scale-dependent: if $cL$ means all lengths are
    multiplied by $c$, then $Z_{cL}(s)=c^{-2s}Z_L(s)$.
  comment-cubic-names: >-
    In dimension $3$, $A_3$ is the face-centred cubic lattice and $A_3^{*}$ is
    the body-centred cubic lattice in the physics convention. These names
    refer to the same rows indexed here by `family` and $n$.
  comment-convergent-range: >-
    This table contains values in the absolutely convergent range $s>n/2$.
    The meromorphic continuation, including the pole at $s=n/2$ and the value
    at $s=0$, is not listed here.
  comment-lennard-jones: >-
    If $\mu$ is the minimal norm of the Gram matrix used here, the
    Lennard-Jones lattice constant in nearest-neighbour scale is
    $A_{2s}(L)=\mu^s Z_L(s)$ CITE{LatticeSums}. Thus $A_6$ and $A_{12}$ are
    obtained from the rows with $s=3$ and $s=6$ wherever those rows converge.
Formulas:
  formula-length-exponent: >-
    If $\widetilde Z_L(t)=\sum_{0\ne x\in L}|x|^{-t}$ is the convention using
    the length exponent, then $\widetilde Z_L(t)=Z_L(t/2)$.
  formula-square-lattice: >-
    For $s>1$, $Z_{\mathbb{Z}^2}(s)=4\zeta(s)\beta(s)$, where $\beta(s)$ is
    the Dirichlet beta function.
  formula-hexagonal-lattice: >-
    For $s>1$, $Z_{A_2}(s)=2^{-s}\,6\zeta(s)L(s,\chi_{-3})$.
  formula-e8: >-
    For $s>4$, $Z_{E_8}(s)=240\,2^{-s}\zeta(s)\zeta(s-3)$, because the theta
    series of $E_8$ is the Eisenstein series $E_4$.

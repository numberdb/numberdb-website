Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds $0\leq n\leq10$ for $\lambda=10^k$ with $-3\leq k\leq3$, the
    powers of ten commonly used as benchmark couplings
  rigour details: >-
    The generator computes Rayleigh-Ritz eigenvalues in a harmonic-oscillator
    basis, with even and odd parity separated. For each coupling it uses the
    two truncations $N=180$ and $N=260$, and the two basis frequencies
    $\omega_1=\max(1.3,(1+3\lambda)^{1/3})$ and
    $\omega_2=1.18\omega_1$. Eigenvalues of the finite Galerkin matrices are
    isolated by Sturm counts from an $LDL^T$ factorisation, rather than by a
    dense eigensolver. Each stored interval is the union of the four computed
    values and must retain the 50 digits written. Rayleigh-Ritz eigenvalues
    are upper bounds for the true eigenvalues by the variational principle
    CITE{FernandezGarcia2022}, so the agreement between truncations is not a
    rigorous error bound. Before entries are written, the generator checks the
    $\lambda=0$ harmonic-oscillator control for both parities, checks the even
    levels against the values tabulated by Taseli and Demiralp
    CITE{TaseliDemiralp1988}, and checks that all stored rows retain at least
    50 digits across the four runs.
Display properties:
  number-header: $E_n(\lambda)$

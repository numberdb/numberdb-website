# Draft document for T404, the quartic anharmonic oscillator eigenvalues. Created
# through the API with X-Draft: yes and filled by generate.py beside it;
# publishing is a person's act on the site.
Title: Eigenvalues of the quartic anharmonic oscillator $-y''+(x^2+\lambda x^4)y$
Definition: >-
  For $\lambda>0$, this table gives the eigenvalue $E_n(\lambda)$ of the
  Schrodinger operator
  $-y''(x)+(x^2+\lambda x^4)y(x)=E y(x)$ on $L^2(\mathbb{R})$
  CITE{BenderWu1969}. The operator has no factor of $1/2$ multiplying
  $-y''$, and the level index $n$ starts at $0$ for the ground state.
Keywords:
  - anharmonic oscillator
  - quartic oscillator
  - quartic anharmonic oscillator
  - Schrodinger equation
  - energy levels
  - Bender-Wu
  - coupling constant
Parameters:
  lambda:
    type: Q
    title: quartic coupling
    display: $\lambda$
    constraints: $\lambda>0$
  n:
    type: Z
    title: energy level
    display: $n$
    constraints: integer with $n\geq0$
Comments:
  comment-index: >-
    The index $n$ is the number of nodes of the square-integrable
    eigenfunction. The rows with even $n$ have even parity, and the rows with
    odd $n$ have odd parity.
  comment-zero-coupling: >-
    The harmonic limit $\lambda=0$ is not included. In this convention it has
    the exact eigenvalues $E_n(0)=2n+1$.
  comment-benchmarks: >-
    The powers of ten in $\lambda$ are the benchmark couplings tabulated by
    Taseli and Demiralp for the even levels CITE{TaseliDemiralp1988}.
Formulas:
  formula-scaling: >-
    If $E_n(\alpha,\beta)$ denotes the $n$th eigenvalue of
    $-y''+(\alpha x^2+\beta x^4)y=E y$, then
    $E_n(\alpha,\beta)=\alpha^{1/2}E_n(\beta\alpha^{-3/2})$
    for $\alpha>0$ and $\beta>0$.
  formula-bender-wu: >-
    If $e_n(g)$ is the $n$th eigenvalue of the Bender-Wu Hamiltonian
    $\frac12p^2+\frac12x^2+g x^4$, then
    $e_n(g)=\frac12 E_n(2g)$ CITE{BenderWu1969}.
  formula-older-convention: >-
    If $f_n(g)$ is the $n$th eigenvalue of
    $p^2+\frac14x^2+g x^4$, then $f_n(g)=\frac12 E_n(8g)$.

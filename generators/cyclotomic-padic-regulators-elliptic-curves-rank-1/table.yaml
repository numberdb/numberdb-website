Data properties:
  type: Qp
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every rank-one curve in Sage's mini Cremona database
    CITE{SageCremona} with conductor $N\leq175$, and every good ordinary
    prime $p\in\{5,7,11,13\}$ for that curve
  sources:
    - CITE{SageCremona}
    - CITE{SagePadic}
  rigour details: >-
    The generator reads exact Weierstrass coefficients from Sage's mini
    Cremona database CITE{SageCremona}, constructs the reduced global minimal
    curve over $\mathbb{Q}$, and filters to rank-one curves and good ordinary
    primes. It computes Sage's cyclotomic `padic_regulator` CITE{SagePadic} at
    the stored precision and at a higher working precision, truncates both to
    the precision in CITE{comment-precision}, and checks that they agree. It
    also computes Sage's cyclotomic height of the Mordell-Weil generator and
    checks Formula CITE{formula-rank-one-regulator} and Formula
    CITE{formula-quadratic-height} on every row. The table is declared
    heuristic (agreement-checked), not proven, because Sage returns
    fixed-precision $p$-adic values rather than certified enclosures.
Display properties:
  number-header: $\operatorname{Reg}_p(E/\mathbb{Q})$
  group parameters:

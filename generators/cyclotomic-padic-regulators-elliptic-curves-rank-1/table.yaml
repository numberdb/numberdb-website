Title: Cyclotomic $p$-adic regulators of elliptic curves over $\mathbb{Q}$ of rank $1$
Definition: >-
  Let $E/\mathbb{Q}$ be the curve identified by $(N,c_4,c_6)$ in Formula
  CITE{formula-model-from-invariants}, and let $p$ be a good ordinary prime.
  The entry is its cyclotomic $p$-adic regulator
  $\operatorname{Reg}_p(E/\mathbb{Q})$ in the normalisation of
  CITE{comment-normalisation}.
Parameters:
  N:
    type: Z
    title: conductor of $E$
    display: $N$
    constraints: $N\geq1$
  c4:
    type: Z
    title: invariant $c_4$ of the reduced global minimal model of $E$
    display: $c_4$
  c6:
    type: Z
    title: invariant $c_6$ of the reduced global minimal model of $E$
    display: $c_6$
  p:
    type: Z
    title: good ordinary prime
    display: $p$
    constraints: $p\geq5$ is prime and $E$ has good ordinary reduction at $p$
Comments:
  comment-curve-labels: >-
    The curve is identified by $N$, $c_4$ and $c_6$. Each entry comment gives
    the curve's Cremona label from Sage's mini Cremona database
    CITE{SageCremona}; it also gives the LMFDB CITE{LMFDB} label when the two
    labels differ.
  comment-normalisation: >-
    This table uses Sage's cyclotomic normalisation CITE{SagePadic}, the
    Mazur-Tate-Teitelbaum normalisation in which the $p$-adic regulator
    appears in the $p$-adic Birch and Swinnerton-Dyer formula CITE{MTT}. The
    values are not divided by $\log_p(1+p)$, and they use the sign convention
    implemented by Sage.
  comment-primes: >-
    The table includes only primes of good ordinary reduction. At supersingular
    primes the corresponding height takes values outside $\mathbb{Q}_p$, and
    Sage's cyclotomic `padic_regulator` method is implemented only for
    $p\geq5$.
  comment-anomalous: >-
    A negative valuation can occur at anomalous primes. For example, the row
    for 43a1 at $p=5$ has valuation $-1$.
  comment-precision: >-
    The stored $p$-adic precision is the least $n$ with $p^n\geq10^{50}$, for
    example $O(5^{72})$, $O(7^{60})$, $O(11^{49})$ and $O(13^{45})$.
Formulas:
  formula-model-from-invariants: >-
    For the reduced models in this table, $b_2$ is the unique element of
    $\{-4,-3,0,1,4,5\}$ with $b_2\equiv -c_6\pmod{12}$,
    $b_4=(b_2^2-c_4)/24$, and
    $b_6=(-c_6-b_2^3+36b_2b_4)/216$. The model has
    $a_1\equiv b_2\pmod 2$, $a_3\equiv b_6\pmod 2$ with
    $a_1,a_3\in\{0,1\}$ and $a_2\in\{-1,0,1\}$, and
    $a_2=(b_2-a_1^2)/4$, $a_4=(b_4-a_1a_3)/2$ and
    $a_6=(b_6-a_3^2)/4$.
  formula-rank-one-regulator: >-
    If $P$ generates the free part of $E(\mathbb{Q})$, then
    $\operatorname{Reg}_p(E/\mathbb{Q})=h_p(P)$, where $h_p$ is the
    cyclotomic $p$-adic height pairing in the normalisation of
    CITE{comment-normalisation}.
  formula-quadratic-height: >-
    The cyclotomic $p$-adic height is quadratic:
    $h_p(mP)=m^2h_p(P)$ for $m\in\mathbb{Z}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      E = EllipticCurve('37a1')
      p = 5
      precision = 72
      E.padic_regulator(p, precision)

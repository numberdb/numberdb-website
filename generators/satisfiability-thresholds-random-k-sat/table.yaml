Title: Satisfiability thresholds of random $k$-SAT
Definition: >-
  For $k\geq3$, random $k$-SAT CITE{WikiSAT} is the random $k$-CNF model at
  clause density $\alpha=m/n$. The number $\alpha_s(k)$ is the one-step
  replica-symmetry-breaking cavity-method prediction for its satisfiability
  threshold CITE{MMZ}.
Keywords: random SAT, random Boolean formulas, cavity method, survey propagation, phase transition
Parameters:
  k:
    type: Z
    title: clause length
    display: $k$
    constraints: $k\geq3$
Comments:
  comment-conventions: >-
    The density is $\alpha=m/n$, clauses per variable. The average literal
    degree is $k\alpha$. Clauses are sampled with distinct variables, and each
    occurrence is independently negated with probability $\frac12$.
  comment-source-notation: >-
    Mertens, Mezard and Zecchina CITE{MMZ} write the satisfiability threshold
    as $\alpha_c$; their $\alpha_s$ is the stability limit of the 1RSB
    solution. This table follows the notation of Krzakala, Montanari,
    Ricci-Tersenghi, Semerjian and Zdeborova CITE{KMRTSZ}, where
    $\alpha_s(k)$ is the SAT-UNSAT threshold.
  comment-heuristic: >-
    The listed values for $3\leq k\leq7$ are predictions of the
    cavity-method population-dynamics computation in CITE{MMZ}. Ding, Sly and
    Sun prove that the one-step replica-symmetry-breaking prediction gives the
    satisfiability threshold for all sufficiently large $k$ CITE{DSS}, but
    their theorem does not give an explicit $k_0$ and does not certify any row
    listed here.
  comment-k2: >-
    There is no $k=2$ row. The random $2$-SAT threshold is exactly
    $\alpha_s(2)=1$, and the cavity-method table in CITE{MMZ} starts at
    $k=3$.
Formulas:
  formula-asymptotic: >-
    The cavity-method prediction satisfies
    $\alpha_s(k)=2^k\log 2-\frac12(1+\log 2)+O(2^{-k})$ as $k\to\infty$
    CITE{MMZ} CITE{KMRTSZ}.
Similar tables:
  - table: HREF{T272}[satisfiability thresholds of random $k$-XORSAT]
    relation: the XOR analogue, where the threshold is proven and computed from a scalar root equation
  - table: HREF{T273}[core thresholds of random $k$-uniform hypergraphs]
    relation: the $2$-core thresholds give the pure-literal obstruction thresholds for random $k$-SAT after the density convention is adjusted

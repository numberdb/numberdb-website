Data properties:
  type: R
  rigour: heuristic
  sources:
    - CITE{MMZ}
    - CITE{KMRTSZ}
    - CITE{DSS}
  complete: 'no'
  complete-note: >-
    it holds the cavity-method values printed by Mertens, Mezard and Zecchina
    for every $k$ with $3\leq k\leq7$
  rigour details: >-
    The values are transcribed from Table 1 and Eq. (43) of CITE{MMZ}. The
    $k=3$ entry stores the centre $4.26675$ with the published $2\sigma$
    radius $0.00015$. For $4\leq k\leq7$, CITE{MMZ} prints the decimal values
    without separate error bars, so each entry is stored as the printed
    decimal and carries the database interval implied by its last digit.
    Before any entry was written, the rows $k=4,5,6$ were compared with the
    rounded values $9.93$, $21.12$ and $43.4$ in Table 1 of CITE{KMRTSZ}, and
    all rows were compared with the large-$k$ asymptotic in
    CITE{formula-asymptotic}. That comparison checks the convention and scale;
    it is not an error bound. No rigorous proof is known for the listed small
    values.

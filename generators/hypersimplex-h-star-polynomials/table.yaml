Title: Ehrhart $h^*$-polynomials of the hypersimplices
Definition: The hypersimplex $\Delta(k,n)=\{x\in[0,1]^n:x_1+\cdots+x_n=k\}$
  is a lattice polytope CITE{WikiHypersimplex}. The table stores its Ehrhart $h^*$-polynomial
  $h^*_{\Delta(k,n)}(z)$, the numerator of its Ehrhart series CITE{WikiEhrhart}.
Keywords:
- hypersimplex
- Ehrhart h-star polynomial
- Ehrhart h* polynomial
- h-star polynomial
- h* polynomial
- delta polynomial
- uniform matroid
- Veronese type
- Grassmannian
- dice sums
Parameters:
  n:
    type: Z
    title: ambient dimension
    display: $n$
    constraints: $n$ is an integer with $n\geq4$
  k:
    type: Z
    title: coordinate sum
    display: $k$
    constraints: $k$ is an integer with $2\leq k\leq\lfloor n/2\rfloor$
Comments:
  comment-series: The polynomial $h^*_{\Delta(k,n)}(z)$ is also called the Ehrhart
    $\delta$-polynomial. Formula CITE{formula-series} relates it to the Ehrhart polynomial
    $L_{\Delta(k,n)}(t)$.
  comment-connections: The hypersimplex $\Delta(k,n)$ is the matroid polytope of the
    uniform matroid $U_{k,n}$ CITE{WikiHypersimplex} and the moment polytope for the
    torus action on the Grassmannian $\mathrm{Gr}(k,n)$ CITE{Postnikov2018}.
  comment-lattice: Lattice points are counted in $\mathbb{Z}^n$. Since $t\Delta(k,n)$
    lies in the hyperplane $x_1+\cdots+x_n=kt$, the normalized volume in CITE{formula-volume}
    is taken with respect to the lattice $\{x\in\mathbb{Z}^n:x_1+\cdots+x_n=0\}$.
  comment-symmetry: The map $x\mapsto\mathbf{1}-x$ identifies $\Delta(k,n)$ with $\Delta(n-k,n)$,
    so $\Delta(n-k,n)$ has the same two polynomials; for $k>n/2$, look up $\Delta(n-k,n)$.
  comment-standard-simplex: The omitted case $k=1$ is the standard simplex, with $h^*(z)=1$.
Formulas:
  formula-series: $\sum_{t\geq0}L_{\Delta(k,n)}(t)z^t= h^*_{\Delta(k,n)}(z)/(1-z)^n$.
  formula-coefficient: $L_{\Delta(k,n)}(t)$ is the coefficient of $q^{kt}$ in $(1+q+\cdots+q^t)^n$.
  formula-volume: $h^*_{\Delta(k,n)}(1)$ is the Eulerian number $A(n-1,k-1)$, the
    number of permutations of $n-1$ letters with $k-1$ descents, and it is the normalized
    volume of $\Delta(k,n)$.
Programs:
  program-sage:
    language: Sage
    code: "n, k = 6, 2\nT = PolynomialRing(QQ, \"t\"); t = T.gen()\nZ = PolynomialRing(QQ,\
      \ \"z\"); z = Z.gen()\n\nL = sum((-1)**i * binomial(n, i) * binomial((k - i)*t\
      \ - i + n - 1, n - 1)\n        for i in range(k))\nh = (sum(L(j)*z**j for j\
      \ in range(n)) * (1 - z)**n).truncate(n)\nh"

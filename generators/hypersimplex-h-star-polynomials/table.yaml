Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds $h^*_{\Delta(k,n)}(z)$ for every pair with $4\leq n\leq20$
    and $2\leq k\leq\lfloor n/2\rfloor$, matching the companion Ehrhart polynomial
    table
  rigour details: The $h^*$-polynomials are obtained exactly from the generating-function
    relation CITE{formula-series}. The rows were checked by direct coefficient counts
    from CITE{formula-coefficient}; their normalized volumes were checked against
    Eulerian numbers through CITE{formula-volume}; the symmetry $\Delta(k,n)\cong\Delta(n-k,n)$
    was checked on the computed polynomials; and the rows with $k=2$ were compared
    with OEIS A275514 CITE{OEISHStar2}, whose title calls them Ehrhart coefficients
    but whose rows are the $h^*$-vectors.
Display properties:
  number-header: $h^*_{\Delta(k,n)}(z)$

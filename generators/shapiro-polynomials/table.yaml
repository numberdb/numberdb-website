Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every construction index $n$ with $0\leq n\leq7$
  rigour details: >-
    The generator computes $P_n$ and $Q_n$ by the exact recurrence in
    $\mathbb Z[x]$. Before the draft was filled, every entry was checked
    against the direct Golay-Rudin-Shapiro coefficient construction in
    CITE{formula-rudin-shapiro-coefficients}, against the complementary
    identity in CITE{formula-complementary}, against the recurrence in
    CITE{formula-one-polynomial-recurrence}, against the first three
    polynomials printed by CITE{Wiki}, and against the specialisations in
    CITE{formula-specialisations}.
Display properties:
  number-header: $P_n(x)$

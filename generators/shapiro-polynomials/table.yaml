Title: Shapiro polynomials $P_n$
Definition: >-
  The Shapiro polynomials CITE{Wiki} are the polynomials $P_n(x)\in\mathbb Z[x]$
  defined with $Q_n(x)$ by $P_0=Q_0=1$,
  $P_{n+1}=P_n+x^{2^n}Q_n$, and $Q_{n+1}=P_n-x^{2^n}Q_n$.
Parameters:
  n:
    type: Z
    title: construction index
    display: $n$
    constraints: $n$ is a nonnegative integer
Comments:
  comment-index: >-
    The table is indexed by the construction parameter $n$, not by the degree:
    $P_n$ has degree $2^n-1$.
  comment-variable: >-
    This table writes the polynomial variable as $x$. The natural domain for
    the complementary identity in CITE{formula-complementary} is the unit
    circle.
Formulas:
  formula-rudin-shapiro-coefficients: >-
    Equivalently, $P_n(x)=\sum_{j=0}^{2^n-1}a_jx^j$, where $a_j=1$ if the
    binary expansion of $j$ has an even number of adjacent $11$ pairs and
    $a_j=-1$ otherwise.
  formula-one-polynomial-recurrence: >-
    The polynomials also satisfy
    $P_{n+1}(x)=P_n(x^2)+xP_n(-x^2)$.
  formula-complementary: >-
    If $d=2^n-1$, then
    $P_n(x)x^dP_n(1/x)+Q_n(x)x^dQ_n(1/x)=2^{n+1}x^d$. On the unit circle this
    is $|P_n(z)|^2+|Q_n(z)|^2=2^{n+1}$.
  formula-specialisations: >-
    $P_n(1)=2^{\lfloor(n+1)/2\rfloor}$, and $P_n(-1)=0$ for odd $n$, while
    $P_0(-1)=1$ and $P_n(-1)=2^{n/2}$ for positive even $n$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, "x")
      x = R.gen()

      def shapiro_pair(n):
          P = R.one()
          Q = R.one()
          for k in range(n):
              P, Q = P + x^(2^k)*Q, P - x^(2^k)*Q
          return P, Q

      shapiro_pair(8)[0]      # the next polynomial after this table

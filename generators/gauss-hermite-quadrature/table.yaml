Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: every rule with $n\leq 30$ is here, nodes and weights, both halves
  rigour details: >-
    $H_n$ is built exactly in $\mathbb{Z}[x]$; its roots are isolated by
    Sage's real root isolation over the interval field, so each node is an
    interval provably containing one root, carried on as an arb ball at 397
    bits; $w_k$ is $2^{n-1}n!\sqrt{\pi}/(n^2H_{n-1}(x_k)^2)$ in ball
    arithmetic, $\sqrt{\pi}$ included, and the digits written are those the
    ball supports (every entry supports more than 110). Before a rule is
    written it must also satisfy the Christoffel formula for the weights, the
    symmetry, $\sum w_k=\sqrt{\pi}$, the central-weight formula, and
    exactness on $x^m$ for $m\leq 2n-1$ with failure at $m=2n$. Outside the
    generator the values were compared with the closed forms for $n\leq 5$,
    with the stored polynomials $H_n$ and $He_n$, with twenty-five OEIS
    expansions to 100 digits, with the OEIS A393904 weight polynomials for
    $n\leq 7$, and with DLMF Tables 3.5.10–3.5.13 ($n=5,10,15,20$), with the
    controls that must fail failing.
Display properties:
  number-header: $x_k$ or $w_k$

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    every family to $n=24$ is here: $\mathbb{Z}^n$ and $A_n$ for $1\leq n\leq 24$,
    $D_n$ for $4\leq n\leq 24$, $E_6$, $E_7$, $E_8$, $A_n^{*}$ for
    $3\leq n\leq 24$, $D_n^{*}$ for $5\leq n\leq 24$, $E_6^{*}$, $E_7^{*}$,
    $\Lambda_n$ for $9\leq n\leq 24$ and $K_{12}$, 133 lattices and 399
    entries
  rigour details: >-
    For each lattice the determinant of its integral Gram matrix is an exact
    integer and the minimal norm and the number of shortest vectors come from
    PARI's qfminim, so $\delta^2=(\mu/4)^n/\det L$ and $\gamma^n=\mu^n/\det L$
    are exact rationals; a value that is rational is written exactly, and
    the rest are balls in arb, a square root, an $n$-th root, and for
    $\Delta$ the product with $\pi^{\lfloor n/2\rfloor}$ and the exact
    rational $V_n/\pi^{\lfloor n/2\rfloor}$, computed with 64 guard bits
    beyond the 100 digits written; the widest ball relative to its value,
    $\Delta(\Lambda_{22})$, has radius $4.5\cdot 10^{-119}$. Before a lattice
    is accepted its kissing number and determinant must equal the known
    values ($2n$, $n(n+1)$, $2n(n-1)$, $72$, $126$, $240$ for
    $\mathbb{Z}^n$, $A_n$, $D_n$, $E_6$, $E_7$, $E_8$; $2(n+1)$, $2n$, $54$,
    $56$ for the duals; the catalogue's lines for $\Lambda_n$ and $K_{12}$),
    and $\delta^2=(\gamma/4)^n$ must hold exactly. Outside the generator, the
    Gram matrices transcribed from the catalogue were compared entry by
    entry with the catalogue pages fetched again, and their determinants,
    minimal norms and kissing numbers with the pages' DET, MINIMAL_NORM and
    KISSING_NUMBER lines; $\Lambda_{16}$ built from the Reed–Muller code
    $RM(1,4)$ was found isometric to the catalogue's Gram matrix by PARI's
    qfisom, and the catalogue's Gram matrix of $\Lambda_{24}$, like the
    lattice built from the extended Golay code, is even, unimodular and
    without vectors of norm $2$, hence the Leech lattice by Conway's
    uniqueness theorem; the Cartan matrices were compared with Sage's; $\Delta(A_2)$, $\Delta(A_3)$,
    $\Delta(D_4)$, $\Delta(D_5)$, $\Delta(E_6)$, $\Delta(E_7)$, $\Delta(E_8)$,
    $\Delta(\Lambda_{24})$, $\delta(D_5)$, $\delta(E_6)$, $\gamma(E_6)$ and
    $\gamma(E_7)$ agree with OEIS A093766, A093825, A222068, A222069, A222070,
    A222071, A222072, A260646, A222066, A222067, A246184 and A246722 to every
    digit those entries give; eleven of the fourteen HERMITE_NUMBER lines
    and both DENSITY lines of the catalogue pages agree to their twelve
    digits, and the lines of $\Lambda_{13}$, $\Lambda_{20}$ and
    $\Lambda_{22}$ to eight, those three being off in their ninth or tenth
    digit; the
    determinants of $\Lambda_n$ at minimal norm $4$ are OEIS A028921 and the
    kissing numbers OEIS A002336 for $1\leq n\leq 24$; the largest
    $\gamma^n$ in each dimension $n\leq 8$ is OEIS A007361/A007362 and the
    largest $\delta$ in each dimension $n\leq 24$ is the catalogue's table of
    densest packings; $\Delta=V_n\delta$ holds in balls against the stored
    digits of the table of unit-ball volumes and against $V_n$ from arb's
    Gamma function; the closed forms of CITE{formula-root-lattices},
    CITE{formula-duals} and CITE{formula-laminated} hold in balls; the entries
    linked to other tables agree with the stored digits there; and the
    closed form in every entry's comment, evaluated in balls, encloses the
    entry. Controls that must fail did: the Gram matrix of $\Lambda_{12}$
    offered as $K_{12}$ is refused, and $\Delta(D_4)$ moved by $10^{-50}$ no
    longer matches A222068.
Display properties:
  number-header: $\Delta(L)$, $\delta(L)$ or $\gamma(L)$

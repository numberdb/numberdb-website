Comments:
  notation: >-
    $\mu$ is the Milnor number
    $\dim_{\mathbb{C}}\mathbb{C}[x_1,\ldots,x_n]/(\partial f)$. The degree of
    $\Delta_f(t)$ is $\mu$.
  suspension: >-
    Increasing $n$ by one adds a square variable and suspends the singularity;
    every monodromy eigenvalue is multiplied by $-1$.
Formulas:
  weighted-homogeneous-eigenvalues: >-
    If $f$ has weighted degree $1$ with weights $w_i$, and $x^a$ runs through
    a monomial basis of the Milnor algebra
    $\mathbb{C}[x_1,\ldots,x_c]/(\partial f)$, then the eigenvalues are
    $\exp\left(-2\pi i\left(\sum_iw_i+\sum_ia_iw_i+\frac{n-c}{2}\right)\right)$,
    each with multiplicity. The product of $t$ minus these eigenvalues is
    $\Delta_f(t)$.
  suspension: >-
    If $\mu$ is the Milnor number, then
    $\Delta_{f+u^2}(t)=(-1)^\mu\Delta_f(-t)$.
Similar tables:
  - table: HREF{T290}[Bernstein-Sato polynomials of the simple and unimodal singularities]
    relation: >-
      Malgrange-Kashiwara theory gives the set of monodromy eigenvalues from
      the roots of the Bernstein-Sato polynomial, without their multiplicities
  - table: HREF{Poincaré_polynomials_of_the_finite_Coxeter_groups}[Poincaré polynomials of the finite Coxeter groups]
    relation: >-
      for the ADE rows with $n=3$, the monodromy eigenvalues are the
      eigenvalues of a Coxeter element of the corresponding finite Coxeter
      group

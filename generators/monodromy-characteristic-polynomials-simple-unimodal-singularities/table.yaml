Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds $A_k$ for $1\leq k\leq12$, $D_k$ for $4\leq k\leq12$, the
    exceptional simple singularities, and the parabolic and exceptional
    unimodal singularities in the definition, with $n\leq3$; the hyperbolic
    unimodal families $T_{p,q,r}$ are not included
  rigour details: >-
    The generator computes the rational monodromy exponents from the weights
    and a monomial basis of the Milnor algebra, forms the product over the
    corresponding roots of unity exactly in cyclotomic factors, checks that
    each root order occurs in complete Galois orbits, and returns the
    expanded polynomial in $\mathbb{Z}[t]$. Checks compare every row with
    Singular's `spectrum` from `gmssing.lib` after the control $x^2+y^3$,
    whose monodromy polynomial is $t^2-t+1$; they also verify the suspension
    identity on stored rows and compare the ADE rows with $n=3$ against the
    Coxeter exponents.

# values, and is filled by generate.py beside it. Publishing is a person's act.
Title: Centers of the hyperbolic components of the Mandelbrot set
Definition: >-
  Let $f_c(z)=z^2+c$ and let $F_0(c)=0$,
  $F_{m+1}(c)=F_m(c)^2+c=f_c^{m+1}(0)$. For each period $n$, the entries are
  the roots of the Gleason polynomial $G_n(c)$ CITE{BuffFloydKochParry2022},
  so they are the parameters $c$ for which the critical point $0$ of the
  Mandelbrot-set family CITE{WikiMandelbrot} has exact period $n$.
Parameters:
  n:
    type: Z
    title: period
    display: $n$
    constraints: $n\geq1$
  i:
    type: Z
    title: position in the sorted root list
    display: $i$
    constraints: $1\leq i\leq\deg G_n$
Comments:
  comment-gleason: >-
    The polynomial $G_n$ is the exact-period factor of $F_n$: $G_1=c$, and
    for $n>1$, $G_n=F_n/\prod_{d\mid n,\;d<n}G_d$.
  comment-order: >-
    Within a fixed period $n$, roots are sorted by increasing real part, with
    ties sorted by increasing imaginary part. Thus the negative-imaginary
    member of a conjugate pair is listed immediately before the positive one.
  comment-logistic: >-
    This table uses the $c$-parameter for $z\mapsto z^2+c$. The real logistic
    parameter $r$ used in the similar tables is related by $c=-r(r-2)/4$.
Formulas:
  formula-iterate: >-
    $F_0(c)=0$ and $F_{m+1}(c)=F_m(c)^2+c$.
  formula-gleason: >-
    $G_n(c)=\prod_{d\mid n}F_d(c)^{\mu(n/d)}$.
  formula-degree: >-
    For $n\geq1$, $\deg G_n=\sum_{d\mid n}\mu(n/d)2^{d-1}$.

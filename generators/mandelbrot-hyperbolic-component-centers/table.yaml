Data properties:
  type: C
  rigour: proven
  complete: 'no'
  complete-note: it holds every center with exact period $n\leq9$
  rigour details: >-
    The generator constructs each $F_n$ and $G_n$ exactly in $\mathbb Z[c]$.
    It checks $G_1=c$, $G_2=c+1$,
    $G_3=c^3+2c^2+c+1$, and
    $G_4=c^6+3c^5+3c^4+3c^3+2c^2+1$, checks the degrees
    against Formula CITE{formula-degree}, and counts the real roots by
    Sturm's method. The
    roots are isolated with Sage's `complex_roots` at `min_prec=400`, which
    returns certified complex intervals; the worst absolute diameter measured
    over the stored range is recorded by the generator. Sorting is guarded by
    comparing the roots in `QQbar`; through $n=9$, no two non-conjugate roots
    have the same real part. Real roots have imaginary part exactly $0$.

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: every rule with $n\leq 30$ is here, nodes and weights, both halves
  rigour details: >-
    $P_n$ is built exactly in $\mathbb{Q}[x]$; its roots are isolated by
    Sage's real root isolation over the interval field, so each node is an
    interval provably containing one root, carried on as an arb ball at 397
    bits; $w_k$ is $2/((1-x_k^2)P_n'(x_k)^2)$ in ball arithmetic, and the
    digits written are those the ball supports (the widest, a weight at
    $n=30$, supports 110). Before a rule is written it must also satisfy the
    second weight formula, the symmetry, $\sum w_k=2$, and exactness on
    $x^m$ for $m\leq 2n-1$ with failure at $m=2n$. Outside the generator the
    values were compared with the closed forms for $n\leq 5$, twenty OEIS
    expansions to 100 digits, the OEIS A112734 weight polynomials for
    $n\leq 8$, and Wikipedia's seven-point row, with the controls that must
    fail failing.
Display properties:
  number-header: $x_k$ or $w_k$

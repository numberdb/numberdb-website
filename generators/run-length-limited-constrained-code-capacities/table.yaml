Title: Capacity of the $(d,k)$ run-length-limited constrained codes
Definition: >-
  For integers $d,k$ with $0\leq d<k\leq\infty$, a binary $(d,k)$
  run-length-limited constrained sequence has at least $d$ and at most $k$
  zeros between consecutive $1$s CITE{Kovacevic} CITE{WikiRLL}. The capacity
  $C(d,k)$ is $\lim_{n\to\infty}n^{-1}\log N_{d,k}(n)$, where
  $N_{d,k}(n)$ counts the length-$n$ sequences satisfying the constraint, in
  the logarithmic unit named by `unit`.
Parameters:
  d:
    type: Z
    title: minimum zero run length
    display: $d$
    constraints: $d\geq0$ and $d<k$
  k:
    type: Symbolic
    title: maximum zero run length
    display: $k$
    constraints: $k$ is an integer with $d<k$, or $k=\infty$
  unit:
    type: Symbolic
    title: logarithmic unit
    display: unit
    constraints: "`nats` or `bits`"
Comments:
  comment-addresses: >-
    Entry addresses use `inf` for $k=\infty$.
  comment-boundary: >-
    The first and last zero runs are treated differently in different
    presentations of run-length-limited constraints; changing those boundary
    conventions changes $N_{d,k}(n)$ by only a bounded factor and does not
    change $C(d,k)$ CITE{Kovacevic}.
  comment-units: >-
    The `nats` rows use the natural logarithm, and the `bits` rows use the
    base-two logarithm.
Formulas:
  formula-root: >-
    Let $\rho$ be the unique real number in $(0,1)$ satisfying
    $\sum_{i=d+1}^{k+1}\rho^i=1$, where for $k=\infty$ the sum is infinite.
    Then $C(d,k)=-\log\rho$ in nats. Equivalently, for finite $k$,
    $\lambda=1/\rho$ is the largest positive root of
    $\lambda^{k+1}=\lambda^{k-d}+\lambda^{k-d-1}+\cdots+1$ CITE{TangBahl}.
  formula-infinite: >-
    For $k=\infty$, the root equation in Formula CITE{formula-root} is
    $\rho^{d+1}+\rho=1$.
  formula-units: >-
    $C_{\mathrm{bits}}(d,k)=C_{\mathrm{nats}}(d,k)/\log 2$.
  formula-counts: >-
    With boundary conventions that do not affect the limit,
    $S_{d,k}(n)=\sum_{i=d+1}^{k+1}S_{d,k}(n-i)$ counts $(d,k)$-constrained
    words assembled from blocks $0^d1,\ldots,0^k1$ CITE{Kovacevic}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_mpfi import RealIntervalField

      RIF = RealIntervalField(numberdb.bits(100, losing=96))
      def capacity(d, k, unit='bits'):
          def f(x):
              if k is None:
                  return x**(d + 1) + x - 1
              return sum(x**i for i in range(d + 1, k + 2)) - 1
          lo, hi = QQ(0), QQ(1)
          for _ in range(420):
              mid = (lo + hi)/2
              if f(mid) < 0:
                  lo = mid
              else:
                  hi = mid
          c = -RIF(lo, hi).log()
          return c if unit == 'nats' else c/RIF(2).log()
      capacity(1, None, 'bits')

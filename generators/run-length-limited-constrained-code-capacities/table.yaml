Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every finite pair $0\leq d<k\leq28$, and every pair with
    $k=\infty$ and $0\leq d\leq28$; the bits row for $(0,\infty)$ is omitted
    because it is exactly $1$
  rigour details: >-
    Each row is computed by exact rational bisection of the unique root
    $\rho$ in Formula CITE{formula-root}; the final rational interval is
    converted to a Sage real interval, and the logarithm is taken in interval
    arithmetic. The generator checks the root equation on every row and
    compares the resulting growth rates with an independent Perron eigenvalue
    computation for the finite-state graph of the constraint.
Display properties:
  number-header: $C(d,k)$

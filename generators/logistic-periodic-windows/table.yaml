# The table document for the periodic windows of the logistic map, proposal 2
# of agents/table-ideas/BATCH-2026-09-09T0015.md. Created as draft T169 through
# the API (X-Draft: yes), filled by generate.py beside it, and then offered for
# review; publishing is a person's act on the site.
Title: Periodic windows of the logistic map by kneading word
Definition: >-
  For the logistic map $f_r(x)=rx(1-x)$ on $[0,1]$ CITE{WikiLogistic}
  CITE{MathWorldLogistic}, the table gives the periodic-window quantity named
  by the parameter `expression` for the listed superstable kneading word $W$
  CITE{WikiKneading}.
Parameters:
  W:
    type: Symbolic
    title: kneading word
    display: $W$
    values:
      RLC: '$\mathtt{RLC}$'
      RLLC: '$\mathtt{RLLC}$'
      RLRRC: '$\mathtt{RLRRC}$'
      RLLRC: '$\mathtt{RLLRC}$'
      RLLLC: '$\mathtt{RLLLC}$'
      RLRRRC: '$\mathtt{RLRRRC}$'
      RLLRLC: '$\mathtt{RLLRLC}$'
      RLLRRC: '$\mathtt{RLLRRC}$'
      RLLLRC: '$\mathtt{RLLLRC}$'
      RLLLLC: '$\mathtt{RLLLLC}$'
      RLRRRRC: '$\mathtt{RLRRRRC}$'
      RLRRLRC: '$\mathtt{RLRRLRC}$'
      RLLRLRC: '$\mathtt{RLLRLRC}$'
      RLLRRRC: '$\mathtt{RLLRRRC}$'
      RLLRRLC: '$\mathtt{RLLRRLC}$'
      RLLLRLC: '$\mathtt{RLLLRLC}$'
      RLLLRRC: '$\mathtt{RLLLRRC}$'
      RLLLLRC: '$\mathtt{RLLLLRC}$'
      RLLLLLC: '$\mathtt{RLLLLLC}$'
      RLRRRRRC: '$\mathtt{RLRRRRRC}$'
      RLRRLRRC: '$\mathtt{RLRRLRRC}$'
      RLLRLRRC: '$\mathtt{RLLRLRRC}$'
      RLLRLRLC: '$\mathtt{RLLRLRLC}$'
      RLLRRRLC: '$\mathtt{RLLRRRLC}$'
      RLLRRRRC: '$\mathtt{RLLRRRRC}$'
      RLLRRLRC: '$\mathtt{RLLRRLRC}$'
      RLLLRLLC: '$\mathtt{RLLLRLLC}$'
      RLLLRLRC: '$\mathtt{RLLLRLRC}$'
      RLLLRRRC: '$\mathtt{RLLLRRRC}$'
      RLLLRRLC: '$\mathtt{RLLLRRLC}$'
      RLLLLRLC: '$\mathtt{RLLLLRLC}$'
      RLLLLRRC: '$\mathtt{RLLLLRRC}$'
      RLLLLLRC: '$\mathtt{RLLLLLRC}$'
      RLLLLLLC: '$\mathtt{RLLLLLLC}$'
  expression:
    type: Symbolic
    title: quantity
    display: expression
    values:
      onset: '$r_{\mathrm{on}}$'
      superstable: '$r_W$'
      doubling: '$r_{\mathrm{pd}}$'
      entropy: '$h_{\mathrm{top}}$'
Comments:
  comment-kneading-word: >-
    The kneading word records the itinerary of the critical point $1/2$: for a
    period-$p$ superstable orbit, the letters are $R$ or $L$ according as
    $f_r^j(1/2)$ is to the right or left of $1/2$ for $1\leq j<p$, followed
    by $C$ for $f_r^p(1/2)=1/2$. The words are ordered by increasing
    superstable parameter $r_W$, within each period.
  comment-expressions: >-
    The four quantities are the onset $r_{\mathrm{on}}$, the superstable
    parameter $r_W$, the first period-doubling parameter $r_{\mathrm{pd}}$,
    and the topological entropy $h_{\mathrm{top}}$
    CITE{WikiTopologicalEntropy} of the periodic window.
  comment-range: >-
    The main period-doubling cascade words are not listed. They have entropy
    $0$ and are the cascade whose gap ratios tend to
    HREF{Feigenbaum_constants}[the Feigenbaum constant] $\delta$.
  comment-harmonics: >-
    If $W$ is the doubled harmonic of a shorter word $V$, its onset is the
    first period-doubling point of $V$. Thus $\mathtt{RLLRLC}$ begins at the
    first period-doubling point of $\mathtt{RLC}$, and $\mathtt{RLLLRLLC}$
    begins at the first period-doubling point of $\mathtt{RLLC}$. These
    harmonic windows have the same topological entropy as their parents.
  comment-renormalisation: >-
    The window $\mathtt{RLRRRC}$ is the period-$3$ window of the second
    iterate $f_r^2$; its topological entropy is half that of $\mathtt{RLC}$.
  comment-normalisation: >-
    The values of $r$ use the logistic-map normalisation. The corresponding
    real quadratic-polynomial parameter $c$ for $z\mapsto z^2+c$ is
    $c=-r(r-2)/4$ by CITE{formula-conversion}; each endpoint entry gives this
    $c$-value in its comment.
  comment-sources: >-
    OEIS gives the period-$3$ onset CITE{OEISA086178}, the first
    period-doubling point of that window CITE{OEISA086179}, and the first
    onsets of periods $5$, $6$ and $7$ CITE{OEISA118452} CITE{OEISA118453}
    CITE{OEISA118746}. The count of primitive kneading words by period is the
    sequence A000048 CITE{OEISA000048}, in the Metropolis-Stein-Stein order
    CITE{MSS}.
Formulas:
  formula-conversion: >-
    $c=-\frac{r(r-2)}{4}$, so $r=4$ corresponds to $c=-2$ and $r=2$
    corresponds to $c=0$.
  formula-superstable: >-
    $r_W$ satisfies $f_r^p(\frac12)=\frac12$, where $p$ is the period of the
    kneading word $W$.
  formula-endpoints: >-
    The endpoints of a period-$p$ window satisfy $f_r^p(x)=x$ and
    $\prod_{j=0}^{p-1}r(1-2f_r^j(x))=\mu$, with $\mu=1$ for
    $r_{\mathrm{on}}$ and $\mu=-1$ for $r_{\mathrm{pd}}$.
  formula-entropy: >-
    $h_{\mathrm{top}}=\log\rho(A_W)$, where $A_W$ is the Markov transition
    matrix of the partition by the critical orbit of the superstable map and
    $\rho(A_W)$ is its Perron root CITE{MilnorThurston}.
  formula-rlc: >-
    For $W=\mathtt{RLC}$, $r_{\mathrm{on}}=1+2\sqrt2$ and
    $h_{\mathrm{top}}=\log\varphi$, where $\varphi$ is
    HREF{Golden_ratio}[the golden ratio].
Programs:
  program-sage:
    language: Sage
    code: |-
      def f(r, x):
          return r*x*(1 - x)
      def iterate(r, x, k):
          for _ in range(k):
              x = f(r, x)
          return x

      find_root(lambda r: iterate(r, 1/2, 3) - 1/2,
                3.83, 3.84)                         # superstable RLC
      find_root(lambda r: r^6 - 6*r^5 + 4*r^4 + 24*r^3
                - 14*r^2 - 36*r - 81, 3.84, 3.85)   # first doubling of RLC
      log((1 + sqrt(5))/2)                           # entropy of RLC
Similar tables:
  - table: HREF{Feigenbaum_constants}[Feigenbaum constants]
    relation: the first period-doubling endpoint of each window begins a local period-doubling cascade with the same Feigenbaum ratio $\delta$
  - table: HREF{Golden_ratio}[Golden ratio]
    relation: the entropy of the $\mathtt{RLC}$ window is $\log\varphi$
  - table: HREF{Entropy_constants_of_lattice_models}[Entropy constants of lattice models]

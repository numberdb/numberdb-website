Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every primitive superstable kneading word with period at most
    $8$, except the main period-doubling cascade words, with four quantities
    for each word
  rigour details: >-
    The superstable rows were computed by Newton iteration on
    CITE{formula-superstable}. The onset and first period-doubling rows were
    computed by Newton continuation in the multiplier $\mu$ in
    CITE{formula-endpoints}; for the two harmonic windows
    $\mathtt{RLLRLC}$ and $\mathtt{RLLLRLLC}$, the onset is the parent's first
    period-doubling point because the multiplier-$1$ continuation is singular
    there. The entropy rows were computed as $\log\rho(A_W)$ from the integer
    Markov transition matrix in CITE{formula-entropy}.

    Every row was recomputed with $760$ and $980$ guard bits beyond the $100$
    written digits, and the written digits agreed. An independent check built
    the superstable polynomials $f_r^p(1/2)-1/2$ exactly, found the real roots
    of exact period $p$ for $3\leq p\leq8$, recovered the same $34$ retained
    kneading words, and checked the counts $1,2,3,5,9,16$ against OEIS
    A000048 CITE{OEISA000048}. The period-$3$ onset was checked against
    $1+2\sqrt2$ CITE{OEISA086178}; the period-$3$ first period-doubling point
    was checked against its sextic equation CITE{OEISA086179}; the first
    period-$5$, $6$ and $7$ onsets were checked against the OEIS digits named
    in the links; and the entropy controls
    $h_{\mathrm{top}}(\mathtt{RLC})=\log\varphi$,
    $h_{\mathrm{top}}(\mathtt{RLRRRC})=\frac12\log\varphi$, and the two
    harmonic entropy equalities were checked.

Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the Hamming and simplex rows with $q=2$ and $2\leq m\leq6$,
    $q=3$ and $2\leq m\leq4$, and $q=4$ and $2\leq m\leq3$; every binary
    Reed-Muller row $RM(r,m)$ with $2\leq m\leq5$; the binary and ternary
    Golay codes, ordinary and extended; the quadratic-residue rows
    $(q,n)=(2,7),(3,11),(3,13),(2,17),(2,23),(2,31)$; and the binary
    primitive narrow-sense BCH rows $(n,\delta)=(15,3),(15,5),(15,7),(31,7)$
    and $(31,11)$
  sources:
    - CITE{WikiWeightEnumerator}
    - CITE{WikiLinearCode}
  rigour details: >-
    The entries are exact integer polynomials. Before the draft was filled,
    `agents/table-build/dry_run.py` computed all 53 entries, checked
    exactness, and measured the longest written value as 1183 characters at
    the binary Hamming row `hamming,2,6`, with an entries block of 12.6 KB.
    The generator checks $W_C(1)=|C|$, the stated minimum distance, and the
    degree bound on every row. It checks Hamming rows from the simplex rows by
    the MacWilliams identity, Reed-Muller rows against their dual
    Reed-Muller rows, the perfect binary and ternary Golay rows against the
    corresponding quadratic-residue constructions, and every BCH and
    quadratic-residue cyclic generator polynomial against its defining roots.
Display properties:
  number-header: $W_C(x)$

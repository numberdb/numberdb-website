Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the finite set of small named classical codes enumerated by the
    generator
  sources:
    - CITE{WikiWeightEnumerator}
    - CITE{WikiLinearCode}
  rigour details: >-
    The entries are exact integer polynomials. The generator constructs each
    listed code over its finite field and counts the Hamming weights of its
    codewords exactly, then checks the result against independent formulas
    and dual-code identities before filling the draft.

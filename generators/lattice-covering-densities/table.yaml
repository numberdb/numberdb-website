Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    every family to $n=24$ is here: $\mathbb{Z}^n$ and $A_n$ for $1\leq n\leq 24$,
    $D_n$ for $4\leq n\leq 24$, $E_6$, $E_7$, $E_8$, $A_n^{*}$ for
    $3\leq n\leq 24$, $D_n^{*}$ for $5\leq n\leq 24$, $E_6^{*}$, $E_7^{*}$
    and $\Lambda_{24}$, 117 lattices and 234 entries
  rigour details: >-
    For each lattice the determinant of its integral Gram matrix is an exact
    integer, the minimal norm and the number of shortest vectors come from
    PARI's qfminim and must equal the known values, and $R^2$ is the exact
    rational of CITE{formula-covering-radii}, so that $(R/\rho)^2=4R^2/\mu$
    and $\Theta^2/\pi^{2\lfloor n/2\rfloor}$ are exact rationals; a value
    that is rational is written exactly, and the rest are balls in arb, a
    square root and for $\Theta$ the product with $\pi^{\lfloor n/2\rfloor}$,
    computed with 64 guard bits beyond the 100 digits written; the widest
    ball relative to its value, $\Theta(A_{24})$, has radius
    $4.5\cdot 10^{-119}$. For every lattice of dimension $n\leq 6$ the
    generator recomputes $R^2$ before use as the largest vertex norm of the
    Voronoi cell, built as a rational polytope from all lattice vectors of
    norm at most $B$ with $B$ raised until $4R^2\leq B$, which proves that
    every Voronoi-relevant vector was used; a disagreement with the formula
    is an error rather than an entry. Outside the generator, before any
    entry was written, the same computation was made for every lattice of
    dimension $7$ and $8$ except $A_7^{*}$ and $A_8^{*}$, and from the
    catalogue's own Gram matrices CITE{Catalogue} of $A_3^{*}$, $D_5^{*}$, $D_7^{*}$,
    $E_6^{*}$ and $E_7^{*}$ (two versions), giving the same $R/\rho$; the
    closed form of $\Theta(A_n^{*})$ holds in balls for $2\leq n\leq 24$;
    $\Theta(A_n^{*})$ for $n=2,3,4,5,10,12$ and $16\leq n\leq 21$ and
    $\Theta(\Lambda_{24})$ agree with the six decimals of Tables 1 and 2 of
    Schürmann and Vallentin CITE{SV}, whose thinner coverings in dimensions
    $6$ to $9$, $11$ and $13$ to $15$ are below the $\Theta(A_n^{*})$ here;
    $\Theta(A_2)$ and $\Theta(E_8)$ agree with OEIS A248897 and A164108 to
    every digit those entries give; $\Theta=(R/\rho)^n\Delta$ holds in balls
    for all 117 lattices against the stored densities of the table of the
    classical lattices, $\Theta(\mathbb{Z}^n)=V_n(n/4)^{n/2}$,
    $\Theta(E_8)=V_8$ and $\Theta(\Lambda_{24})=2^{12}V_{24}$ against the
    stored digits of the table of unit-ball volumes, and the entries linked
    to other tables agree with the stored digits there. Controls that must
    fail did: $E_7^{*}$ offered with $R^2=3/4$ and $D_7^{*}$ with the
    even-dimensional formula are refused by the Voronoi cell, and
    $\Theta(A_3^{*})$ moved by $2\cdot 10^{-6}$ no longer matches the table
    of Schürmann and Vallentin.
Display properties:
  number-header: $R/\rho$ or $\Theta(L)$

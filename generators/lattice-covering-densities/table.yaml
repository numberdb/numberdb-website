# The table document for the covering radii and covering densities of the
# classical lattices, proposal 4 of agents/table-ideas/BATCH-2026-09-03T1730.md.
# Created as a draft through the API (X-Draft: yes) and filled by generate.py
# beside it; publishing is a person's act on the site.
Title: Covering radii and covering densities of the classical lattices
Definition: >-
  For a lattice $L\subset\mathbb{R}^n$ with covering radius $R$, the largest
  distance from a point of $\mathbb{R}^n$ to $L$, packing radius $\rho$,
  half the length of a shortest nonzero vector, and determinant $\det L$:
  the normalised covering radius $R/\rho$ and the covering density
  $\Theta(L)=V_nR^n/\sqrt{\det L}$ CITE{SPLAG} of the covering of
  $\mathbb{R}^n$ by the balls of radius $R$ centred at the points of $L$,
  $V_n$ the volume of the unit ball, for $\mathbb{Z}^n$, the root lattices,
  their duals and the Leech lattice.
Parameters:
  family:
    type: Symbolic
    title: family of the lattice
    values:
      Z: $\mathbb{Z}^n$
      A: $A_n$
      D: $D_n$
      E: $E_n$
      A*: $A_n^{*}$
      D*: $D_n^{*}$
      E*: $E_n^{*}$
      Lambda: $\Lambda_n$
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: >-
      $n\geq 1$ for $\mathbb{Z}^n$ and $A_n$; $n\geq 4$ for $D_n$; $n\in\{6,7,8\}$
      for $E_n$; $n\geq 3$ for $A_n^{*}$; $n\geq 5$ for $D_n^{*}$; $n\in\{6,7\}$
      for $E_n^{*}$; $n=24$ for $\Lambda_n$
  expression:
    type: Symbolic
    title: normalised covering radius or covering density
    values:
      radius: $R/\rho$
      density: $\Theta(L)$
    show-in-parameter-list: 'no'
Comments:
  comment-conventions: >-
    The covering radius $R=\max_{x\in\mathbb{R}^n}\min_{v\in L}|x-v|$ is the
    circumradius of the Voronoi cell of $L$, the points of $\mathbb{R}^n$ at
    distance $R$ from $L$ are its deep holes, and the packing radius
    $\rho=\sqrt{\mu}/2$, with $\mu=\min\{v\cdot v : v\in L,\ v\neq 0\}$ the
    minimal norm, is the inradius of the cell; $\det L$ is the determinant
    of a Gram matrix of $L$, the square of the volume of a fundamental
    domain, and $V_n=\pi^{n/2}/\Gamma(n/2+1)$ is the
    HREF{Volume_of_the_unit_ball}[volume of the unit ball]. $\Theta(L)$ is
    the number of balls of radius $R$ covering a point of $\mathbb{R}^n$ on
    average, at least $1$, and is what Conway and Sloane CITE{SPLAG},
    chapter 2, call the covering density or thickness of the lattice
    covering; $R/\rho\geq 1$, and $(R/\rho)^2=4R^2/\mu$ is a rational number
    for every lattice listed. Both quantities are unchanged when $L$ is
    scaled, so no scaling of a named lattice has to be chosen. The packing
    density $\Delta(L)$, centre density and Hermite number of the same
    lattices are in the
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[table of the classical lattices],
    whose families and notation this table follows; $\Theta(L)=(R/\rho)^n\,\Delta(L)$.
  comment-which-lattices: >-
    $\mathbb{Z}^n$ is the cubic lattice; $A_n$, $D_n$ and $E_n$ are the root
    lattices CITE{SPLAG}, chapter 4, with $A_2$ the hexagonal lattice,
    $A_3=D_3$ the face-centred cubic lattice and $A_3^{*}$ the body-centred
    cubic lattice; $\Lambda_{24}$ is the Leech lattice CITE{Leech}. A lattice
    with two names is listed once: $D_3$ under $A_3$, and $A_1^{*}$,
    $A_2^{*}$ and $D_4^{*}$ not at all, being similar to $A_1$, $A_2$ and
    $D_4$; $E_8^{*}=E_8$. The laminated lattices $\Lambda_9$ to
    $\Lambda_{23}$ and the Coxeter–Todd lattice $K_{12}$ of the table of the
    classical lattices are not listed. Every family stops at $n=24$.
  comment-covering-radii: >-
    The covering radii of $\mathbb{Z}^n$, $A_n$, $D_n$, $E_6$, $E_7$, $E_8$
    and $A_n^{*}$ are those of Conway and Sloane CITE{SPLAG}, chapter 4, and
    that of the Leech lattice is the theorem of Conway, Parker and Sloane
    CITE{CPS} CITE{WikiLeech}, $R=\sqrt{2}$ at minimal norm $4$, so that
    $R/\rho=\sqrt{2}$ as for $E_8$, whose deep holes at minimal norm $2$ are
    the halves of its vectors of norm $4$, at distance $1$ from the lattice
    CITE{WikiE8}. For $D_n^{*}=\mathbb{Z}^n\cup(\mathbb{Z}^n+(\tfrac12)^n)$
    at minimal norm $1$ the distance of $x\in[0,\tfrac12]^n$ to the lattice
    satisfies $d(x,D_n^{*})^2=\min\bigl(\sum_i x_i^2,\ \sum_i(\tfrac12-x_i)^2\bigr)$,
    and the maximum of this convex function over the polytope
    $\sum_i x_i\leq n/4$ is attained at the deep hole
    $(\tfrac12,\ldots,\tfrac12,0,\ldots,0)$ with $n/2$ halves for even $n$
    and $(\tfrac12,\ldots,\tfrac12,\tfrac14,0,\ldots,0)$ with $(n-1)/2$
    halves for odd $n$, which gives $R^2=n/8$ and $R^2=(2n-1)/16$. The
    covering radii of $E_6^{*}$ and $E_7^{*}$, $R^2=2/3$ at minimal norm
    $4/3$ and $R^2=7/8$ at minimal norm $3/2$, were computed exactly from
    their Voronoi cells, as were those of every lattice listed of dimension
    $n\leq 8$.
  comment-thinnest: >-
    $A_n^{*}$ is the thinnest lattice covering of $\mathbb{R}^n$ for
    $n\leq 5$: the hexagonal lattice $A_2=A_2^{*}$ is the thinnest covering
    of the plane by equal discs of any kind CITE{Kershner}, and the lattice
    covering problem was solved by Bambah for $n=3$ CITE{Bambah}, by Delone
    and Ryshkov for $n=4$ CITE{DeloneRyshkov} and by Ryshkov and Baranovskii
    for $n=5$ CITE{RyshkovBaranovskii}. In dimensions $6$, $7$ and $8$
    lattice coverings thinner than $A_n^{*}$ were found by Schürmann and
    Vallentin CITE{SV}, and in dimensions $9$ CITE{Baranovskii}, $11$ and
    $14$ CITE{Anzin}, $13$ and $15$ CITE{Anzin2006} the lattices $A_9^{5}$,
    $A_{11}^{4}$, $A_{14}^{5}$, $A_{13}^{7}$ and $A_{15}^{8}$, sublattices of
    $A_n^{*}$ containing $A_n$, are thinner than $A_n^{*}$. The Leech lattice
    is a locally thinnest lattice covering and $E_8$ is not CITE{SVLeech}.
  comment-entries: >-
    The comment on each entry gives its value in closed form, $R/\rho$ as
    the square root of a rational number and $\Theta(L)$ as
    $\pi^{\lfloor n/2\rfloor}$ times the square root of a rational number;
    on $R/\rho$ also $R^2$ and the minimal norm $\mu$ in the scaling of
    Conway and Sloane CITE{SPLAG}, chapter 4, which is $\mu=2$ for the root
    lattices, $\mu=1$ for $\mathbb{Z}^n$ and $D_n^{*}$, $\mu=n/(n+1)$ for
    $A_n^{*}$, $\mu=4/3$ and $3/2$ for $E_6^{*}$ and $E_7^{*}$ and $\mu=4$
    for $\Lambda_{24}$; and on $\Theta(L)$, where it is known, whether the
    lattice is the thinnest lattice covering of its dimension or a thinner
    one is known.
Formulas:
  formula-relations: >-
    $R/\rho=2R/\sqrt{\mu}$ and $\Theta(L)=V_n\,R^n/\sqrt{\det L}=(R/\rho)^n\,\Delta(L)$,
    where $\Delta(L)=V_n\rho^n/\sqrt{\det L}$ is the packing density of $L$,
    in the
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[table of the classical lattices],
    and $V_n=\pi^{n/2}/\Gamma(n/2+1)$ is the
    HREF{Volume_of_the_unit_ball}[volume of the unit ball].
  formula-covering-radii: >-
    $R^2=n/4$ for $\mathbb{Z}^n$ at $\mu=1$; $R^2=a(n+1-a)/(n+1)$ with
    $a=\lfloor (n+1)/2\rfloor$ for $A_n$, $R^2=n/4$ for $D_n$ ($n\geq 4$) and
    $R^2=4/3$, $3/2$, $1$ for $E_6$, $E_7$, $E_8$, all at $\mu=2$;
    $R^2=n(n+2)/(12(n+1))$ for $A_n^{*}$ at $\mu=n/(n+1)$ CITE{Gameckii}
    CITE{Bleicher}; $R^2=n/8$ for even $n$ and $R^2=(2n-1)/16$ for odd $n$
    for $D_n^{*}$ at $\mu=1$ ($n\geq 4$); $R^2=2/3$ for $E_6^{*}$ at
    $\mu=4/3$ and $R^2=7/8$ for $E_7^{*}$ at $\mu=3/2$; $R^2=2$ for
    $\Lambda_{24}$ at $\mu=4$ CITE{CPS}.
  formula-ratios: >-
    $(R/\rho)^2=n$ for $\mathbb{Z}^n$; $2a(n+1-a)/(n+1)$ for $A_n$; $n/2$
    for $D_n$; $8/3$, $3$, $2$ for $E_6$, $E_7$, $E_8$; $(n+2)/3$ for
    $A_n^{*}$; $n/2$ for even $n$ and $(2n-1)/4$ for odd $n$ for $D_n^{*}$;
    $2$ and $7/3$ for $E_6^{*}$ and $E_7^{*}$; $2$ for $\Lambda_{24}$.
  formula-densities: >-
    $\Theta(\mathbb{Z}^n)=V_n\,(n/4)^{n/2}$,
    $\Theta(A_n)=V_n\,\bigl(a(n+1-a)/(n+1)\bigr)^{n/2}/\sqrt{n+1}$ with
    $a=\lfloor (n+1)/2\rfloor$, $\Theta(D_n)=V_n\,(n/4)^{n/2}/2$,
    $\Theta(A_n^{*})=V_n\sqrt{\bigl(n(n+2)/(12(n+1))\bigr)^n\,(n+1)}$
    CITE{Gameckii} CITE{Bleicher}, $\Theta(E_8)=V_8=\pi^4/24$ CITE{OEISE8} and
    $\Theta(\Lambda_{24})=2^{12}\,V_{24}=4\pi^{12}/467775$ CITE{SVLeech}; in
    particular $\Theta(A_2)=2\pi/(3\sqrt{3})$ CITE{OEISA2} and
    $\Theta(A_3^{*})=5\sqrt{5}\,\pi/24$.
Programs:
  program-sage:
    language: Sage
    code: |-
      G = CartanMatrix(['D', 4]); n = G.nrows(); mu = 2
      vecs = pari(G).qfminim(4, None, 0)[2].sage().columns()             # lattice vectors of norm <= 4, one of each pair +-v
      V = Polyhedron(ieqs=[[v*G*v/2] + list(s*G*v) for v in vecs for s in (1, -1)])   # the Voronoi cell
      R2 = max(x.vector()*G*x.vector() for x in V.vertices())           # 1, the squared covering radius
      sqrt(4*R2/mu)                                                     # sqrt(2) = R/rho
      pi^(n/2)/gamma(n/2 + 1) * sqrt(R2^n/G.det())                      # pi^2/4 = Theta(D_4)

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every cubic field with $|D|\leq 3000$, the 419 complex and the
    96 totally real ones
  rigour details: >-
    Each value is a real ball from the class number formula
    $\kappa_K=2^{r_1}(2\pi)^{r_2}h_KR_K/(2\sqrt{|D|})$ at 461 bits, with
    $\pi$ and the square root arb's. The class number and the fundamental
    units are PARI's, from bnfinit and certified by bnfcertify on every
    field, which removes the generalised Riemann hypothesis that bnfinit
    assumes; the regulator is computed as
    HREF{Regulators_of_cubic_fields}[the table of regulators] computes it,
    each unit taken exactly as a polynomial in $a$, checked to be an
    algebraic integer of norm $\pm1$, and evaluated by Horner's rule in
    balls at the real roots of the reduced polynomial isolated in interval
    arithmetic, the logarithms and the determinant being arb's. Each value
    is written to 100 significant digits, fewer than any ball supports (the
    worst, $D=1772$, supports 133). The generator refuses a value unless it agrees to 50 digits with
    the residue that PARI's lfunrootres computes from the Dirichlet
    coefficients and functional equation of $\zeta_K$, a computation sharing
    nothing with bnfinit; all 515 do. The enumeration rests on Hunter's
    theorem CITE{Cohen1993}: every cubic field with $|D|\leq 3000$ is
    generated by an algebraic integer of trace $0$ or $1$ whose minimal
    polynomial $x^3+a_2x^2+a_1x+a_0$ has $|a_1|\leq 18$ and $|a_0|\leq 43$,
    and the fields found in that box, 419 complex and 96 totally real, are
    exactly the terms of OEIS A023679 CITE{OEIS-neg} and A006832
    CITE{OEIS-pos} up to 3000 counted with multiplicity. Outside the
    generator, when this was written, every value was compared with the
    class number formula evaluated from the regulator stored in the table of
    regulators; with lfunrootres at 70 digits; with the eleven digits of the
    analytic class number formula on 21 LMFDB field pages CITE{LMFDB-complex}
    CITE{LMFDB-real}; for the seven cyclic fields with $|L(1,\chi)|^2$ from
    a digamma sum in ball arithmetic, and for the four of conductor at most
    $29$ with the $L(1,\chi)$ stored in the table of Dirichlet $L$-values for
    both cubic characters; and for $D=-23$ with $2\pi\log\rho/\sqrt{23}$.
    The controls that must fail failed.
Display properties:
  number-header: $\kappa_K$

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every listed function at every rational $x=a/b$ in lowest terms
    with $b\leq6$ and $0<x\leq5$, except for the singular value
    $\operatorname{li}(1)$
  rigour details: >-
    Each value was computed as a Sage real ball with arb at
    `numberdb.bits(digits, losing=64)` bits. Before the draft was created, the
    entries were checked against mpmath at 150 decimal digits, against the
    identities in CITE{formula-e1}, CITE{formula-li} and
    CITE{formula-ei-shi-chi} wherever the relevant values are stored, against
    HREF{Gibbs_constant}[the Wilbraham-Gibbs constant] by evaluating
    $\operatorname{Si}(\pi)$ with the same ball method, and against the OEIS
    values for $\operatorname{Ei}(1)$ CITE{OEISEiOne}, $E_1(1)$
    CITE{OEISEOne}, $\operatorname{li}(2)$ CITE{OEISLiTwo},
    $\operatorname{Si}(1)$ CITE{OEISSiOne}, $\operatorname{Ci}(1)$
    CITE{OEISCiOne}, $\operatorname{Shi}(1)$ CITE{OEISShiOne} and
    $\operatorname{Chi}(1)$ CITE{OEISChiOne}. The widest returned ball had
    radius less than $10^{-117}$ for 100 requested digits.
Display properties:
  number-header: value

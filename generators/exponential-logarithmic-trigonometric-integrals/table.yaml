Title: Values of exponential, logarithmic, sine and cosine integrals
Definition: >-
  This table gives values of $\operatorname{Ei}(x)$, $E_1(x)$,
  $\operatorname{li}(x)$, $\operatorname{Si}(x)$, $\operatorname{Ci}(x)$,
  $\operatorname{Shi}(x)$ and $\operatorname{Chi}(x)$ at positive rational
  arguments $x$, with $\operatorname{li}(1)$ omitted.
Keywords:
  - exponential integral
  - logarithmic integral
  - trigonometric integral
  - sine integral
  - cosine integral
  - hyperbolic sine integral
  - hyperbolic cosine integral
  - Theis well function
  - offset logarithmic integral
  - Ei(1)
  - li(2)
  - Si(1)
  - Ci(1)
Parameters:
  function:
    type: Symbolic
    title: integral function
    display: function
    constraints: $\operatorname{Ei}$, $E_1$, $\operatorname{li}$, $\operatorname{Si}$, $\operatorname{Ci}$, $\operatorname{Shi}$ or $\operatorname{Chi}$
    values:
      Ei: $\operatorname{Ei}(x)$
      E1: $E_1(x)$
      li: $\operatorname{li}(x)$
      Si: $\operatorname{Si}(x)$
      Ci: $\operatorname{Ci}(x)$
      Shi: $\operatorname{Shi}(x)$
      Chi: $\operatorname{Chi}(x)$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$, with $x\ne1$ for $\operatorname{li}$
Comments:
  comment-e1: >-
    For positive real $x$, $E_1$ is the case $n=1$ of the generalized
    exponential integral $E_n(x)=\int_1^{\infty} e^{-xt}t^{-n}\,\mathrm{d}t$
    CITE{DLMFGeneralizedExponential}.
  comment-offset-li: >-
    Riemann's offset logarithmic integral satisfies
    $\operatorname{Li}(x)=\operatorname{li}(x)-\operatorname{li}(2)$ for
    $x>1$ CITE{WikiLogarithmic}.
  comment-gibbs: >-
    $\operatorname{Si}(\pi)=1.8519\ldots$ is
    HREF{Gibbs_constant#WG}[the Wilbraham-Gibbs constant].
Formulas:
  formula-ei-definition: >-
    For $x>0$,
    $\operatorname{Ei}(x)=-\operatorname{PV}\!\int_{-x}^{\infty}
    e^{-t}\,\mathrm{d}t/t=\operatorname{PV}\!\int_{-\infty}^x
    e^t\,\mathrm{d}t/t$ and
    $\operatorname{Ei}(-x)=-\int_x^{\infty} e^{-t}\,\mathrm{d}t/t$
    CITE{DLMFIntegralDefinitions}.
  formula-ei-series: >-
    For $x>0$,
    $\operatorname{Ei}(x)=\gamma+\log x+\sum_{k=1}^{\infty}x^k/(k\,k!)$,
    where $\gamma$ is
    HREF{Stieltjes_constants#0}[the Euler-Mascheroni constant]
    CITE{DLMFIntegralDefinitions}.
  formula-e1: >-
    For $x>0$, $E_1(x)=\int_x^{\infty} e^{-t}\,\mathrm{d}t/t=-\operatorname{Ei}(-x)$
    CITE{DLMFIntegralDefinitions}.
  formula-li: >-
    For $x>0$ and $x\ne1$,
    $\operatorname{li}(x)=\operatorname{PV}\!\int_0^x \mathrm{d}t/\log t=\operatorname{Ei}(\log x)$
    CITE{DLMFIntegralDefinitions}.
  formula-si-ci: >-
    For $x>0$, $\operatorname{Si}(x)=\int_0^x\sin(t)/t\,dt$ and
    $\operatorname{Ci}(x)=\gamma+\log x+\int_0^x(\cos(t)-1)/t\,dt$
    CITE{DLMFIntegralDefinitions}.
  formula-shi-chi: >-
    For $x>0$, $\operatorname{Shi}(x)=\int_0^x\sinh(t)/t\,dt$ and
    $\operatorname{Chi}(x)=\gamma+\log x+\int_0^x(\cosh(t)-1)/t\,dt$
    CITE{DLMFIntegralDefinitions}.
  formula-ei-shi-chi: >-
    For $x>0$, $\operatorname{Ei}(x)=\operatorname{Shi}(x)+\operatorname{Chi}(x)$
    CITE{DLMFIntegralDefinitions}.
  formula-parity: >-
    The functions $\operatorname{Si}$ and $\operatorname{Shi}$ are odd
    CITE{DLMFIntegralDefinitions}. With the principal branch of the logarithm,
    for $x>0$,
    $\operatorname{Ci}(-x)=\operatorname{Ci}(x)+i\pi$ and
    $\operatorname{Chi}(-x)=\operatorname{Chi}(x)+i\pi$
    CITE{DLMFAnalyticContinuation}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      RBF = RealBallField(numberdb.bits(100, losing=64))
      x = RBF(QQ(1))
      x.Ei()
      -RBF(-QQ(1)).Ei()
      RBF(QQ(2)).log_integral()
      x.Si()
      x.Ci()
      x.Shi()
      x.Chi()
  program-python:
    language: Python
    code: |-
      import mpmath

      mpmath.mp.dps = 100
      mpmath.ei(1)
      mpmath.e1(1)
      mpmath.li(2)
      mpmath.si(1)
      mpmath.ci(1)
      mpmath.shi(1)
      mpmath.chi(1)

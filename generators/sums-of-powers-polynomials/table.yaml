Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every exponent $p$ with $0\leq p\leq 50$
  rigour details: >-
    The generator uses the Bernoulli-number formula in
    CITE{formula-coefficients}, with every division made in Sage's rational
    field. Before the draft was created, the entries were checked against
    brute-force sums for $1\leq N\leq 12$, interpolated independently from
    $p+2$ integer values for each $p$, and compared coefficient by
    coefficient with OEIS A162298 CITE{OEISnumerators} and A162299
    CITE{OEISdenominators} through $p=50$. The finite-difference identity
    CITE{formula-finite-difference} and the divisibility statements in
    CITE{formula-divisibility} were checked on every entry.

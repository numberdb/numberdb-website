# Draft document for T417, Wall heat transfer of the thermal Falkner-Skan
# boundary layer. It was created through the API with X-Draft: yes and
# Numbers: [] so generate.py can fill it once. Publishing is a person's act.
Title: Wall heat transfer $-\theta'(0)$ of the thermal Falkner–Skan boundary layer
Definition: >-
  For a Falkner-Skan similarity solution $f$ of the wedge boundary layer
  CITE{FSWiki}, this table gives the wall heat-transfer coefficient
  $-\theta'(0)$ for the constant-property thermal boundary layer with uniform
  wall temperature and no viscous dissipation CITE{RosalesValencia}. In the
  wedge normalisation, with $m=\beta/(2-\beta)$, the temperature satisfies
  $\theta''+\frac{m+1}{2}\mathrm{Pr}\,f\theta'=0$,
  $\theta(0)=1$ and $\theta(\infty)=0$.
Keywords:
  - Nusselt
  - Pohlhausen
  - laminar
  - flat plate
  - Prandtl
  - Blasius
  - Falkner-Skan
  - wedge flow
Parameters:
  beta:
    type: Q
    title: Falkner-Skan pressure-gradient parameter
    display: $\beta$
    constraints: $\beta_s<\beta<2$, where $\beta_s$ is the separation value
  branch:
    type: Symbolic
    title: solution branch
    display: branch
    values:
      upper: upper
      lower: lower
  prandtl:
    type: Q
    title: Prandtl number
    display: $\mathrm{Pr}$
    constraints: $\mathrm{Pr}>0$
  normalisation:
    type: Symbolic
    title: normalisation of the wall-normal coordinate
    display: normalisation
    values:
      wedge: wedge
      hartree: Hartree
Comments:
  comment-normalisations: >-
    The wedge normalisation uses $\eta=y\sqrt{u_e/(\nu x)}$ and
    $\psi=\sqrt{\nu x u_e}\,f(\eta)$, so that
    $f'''+\frac{m+1}{2}ff''+m(1-f'^2)=0$. The Hartree normalisation uses
    $\eta_H=\eta\sqrt{(m+1)/2}$ and $f_H=\sqrt{(m+1)/2}\,f$, giving
    $f_H'''+f_Hf_H''+\beta(1-f_H'^2)=0$. The two entries with the same
    $\beta$, branch and $\mathrm{Pr}$ are the same physical heat transfer
    coefficient in the two standard similarity coordinates.
  comment-range: >-
    The beta grid is the thermal table's coarse wedge-flow grid: $\beta=-0.19$
    and then $-0.1,0,0.1,\ldots,1.0$. It is coarser than the two-decimal
    velocity-table grid because $\mathrm{Pr}$ is the second physical argument
    varied in heat-transfer tables. The grid stops at the Hiemenz stagnation
    flow $\beta=1$; more favorable values can be added after the upper range
    convention is settled. The Prandtl grid contains liquid-metal values, air
    at $0.7$ and $0.72$, water near room temperature at $7$, round decades and
    the large-$\mathrm{Pr}$ oil values.
  comment-correlation: >-
    The textbook flat-plate correlation
    $\mathrm{Nu}_x=0.332\,\mathrm{Re}_x^{1/2}\mathrm{Pr}^{1/3}$
    CITE{NusseltWiki} uses the Blasius $\mathrm{Pr}=1$ value as a practical
    coefficient. The exact ratio $-\theta'(0)/\mathrm{Pr}^{1/3}$ is not
    constant as $\mathrm{Pr}$ varies.
Formulas:
  formula-quadrature: >-
    In Hartree variables, $-\theta_H'(0)=\left(\int_0^\infty
    \exp\left(-\mathrm{Pr}\int_0^\eta f_H(s)\,ds\right)\,d\eta\right)^{-1}$.
  formula-conversion: >-
    With $m=\beta/(2-\beta)$, $-\theta'_{\mathrm{wedge}}(0)=
    \sqrt{(m+1)/2}\,[-\theta'_{\mathrm{Hartree}}(0)]$.
  formula-reynolds: >-
    At $\beta=0$ and $\mathrm{Pr}=1$, Reynolds's analogy gives
    $-\theta'_{\mathrm{wedge}}(0)=f''_{\mathrm{wedge}}(0)$ and
    $-\theta'_{\mathrm{Hartree}}(0)=f''_{\mathrm{Hartree}}(0)$.
  formula-beta-m: >-
    The pressure-gradient exponent and the Falkner-Skan parameter are related
    by $m=\beta/(2-\beta)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      # The attached generate.py computes the table. To reproduce one row:
      #   sage -python generate.py --only beta=0,branch=upper,prandtl=0.7,normalisation=wedge

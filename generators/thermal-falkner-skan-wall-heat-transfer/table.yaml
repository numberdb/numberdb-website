Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  rigour details: >-
    Values are computed in Hartree variables by a shooting method for the
    Falkner-Skan initial slope, using fixed-step fourth-order Runge-Kutta for
    the velocity profile and Simpson quadrature for the thermal integral. Each
    value is computed twice, with the step sizes and working precisions stated
    in `generate.py`, and the values are stored to 10 significant digits. The
    row $\beta=0$, $\mathrm{Pr}=1$ is also checked against Reynolds's analogy
    in CITE{formula-reynolds}.
  complete: 'no'
  complete-note: >-
    it holds the upper branch for $\beta=-0.19$ and for every tenth from
    $\beta=-0.1$ through $\beta=1.0$, with $\mathrm{Pr}=0.001,0.003,0.01,
    0.03,0.1,0.3,0.6,0.7,0.72,1,2,3,5,7,10,30,100,300,1000$, in both the
    wedge and Hartree normalisations
Display properties:
  number-header: $-\theta'(0)$

Title: Covolumes of the Bianchi groups
Definition: >-
  Let $K=\mathbb{Q}(\sqrt{D})$ be an imaginary quadratic field of fundamental
  discriminant $D<0$, with ring of integers $\mathcal{O}_K$. Listed is the
  hyperbolic volume of the Bianchi orbifold
  $\mathrm{PSL}_2(\mathcal{O}_K)\backslash\mathbb{H}^3$ for the metric of
  curvature $-1$ CITE{WikiBianchi}.
Keywords:
  - Bianchi orbifold
  - Bianchi group
  - Humbert volume formula
  - PSL2 of imaginary quadratic integers
  - imaginary quadratic field
Parameters:
  D:
    type: Z
    title: fundamental discriminant of $K$
    display: $D$
    constraints: $D<0$ a fundamental discriminant
Comments:
  comment-convention: >-
    The group is $\mathrm{PSL}_2(\mathcal{O}_K)$, acting by
    orientation-preserving isometries on $\mathbb{H}^3$. The quotient by
    $\mathrm{SL}_2(\mathcal{O}_K)$ is the same orbifold, since $\{\pm I\}$
    acts trivially.
  comment-cusps: >-
    The number of cusps is the class number of $K$ CITE{WikiBianchi}; each
    entry comment gives the class number and the squarefree integer $d$ for
    which $K=\mathbb{Q}(\sqrt{-d})$.
  comment-special: >-
    Twelve times the $D=-3$ entry is the
    HREF{Hyperbolic_volumes_of_the_prime_knots_with_at_most_ten_crossings#4,1}[figure-eight knot complement volume].
    The $D=-4$ entry is
    HREF{Values_of_the_Clausen_functions_at_rational_multiples_of#2,1/2}[Catalan's constant]
    divided by $3$.
Formulas:
  formula-humbert: >-
    $\mathrm{Vol}\bigl(\mathrm{PSL}_2(\mathcal{O}_K)\backslash\mathbb{H}^3\bigr)
    = |D|^{3/2}\zeta_K(2)/(4\pi^2)$ CITE{WikiBianchi}.
  formula-dirichlet: >-
    Since $\zeta_K(s)=\zeta(s)L(s,\chi_D)$, the same volume is
    $|D|^{3/2}L(2,\chi_D)/24$, where $\chi_D(n)=(D/n)$ is the Kronecker
    character.
  formula-clausen: >-
    $\mathrm{Vol}\bigl(\mathrm{PSL}_2(\mathcal{O}_K)\backslash\mathbb{H}^3\bigr)
    = |D|\sum_{a=1}^{|D|-1}\chi_D(a)\mathrm{Cl}_2(2\pi a/|D|)/24$, where
    HREF{Values_of_the_Clausen_functions_at_rational_multiples_of}[$\mathrm{Cl}_2$]
    is the Clausen function.

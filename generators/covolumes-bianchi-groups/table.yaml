Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every negative fundamental discriminant with $|D|\leq 1000$
  rigour details: >-
    Each value is a real ball at `numberdb.bits(digits, losing=96)` bits,
    computed from CITE{formula-dirichlet} by arb's Hurwitz zeta function. The
    generator writes $100$ digits. Before the draft was filled, all $305$
    rows were compared with CITE{formula-clausen}, computed independently
    with arb's complex polylogarithm, and the class numbers in the comments
    were compared with PARI's `qfbclassno`. The special relations to the
    figure-eight knot complement volume and Catalan's constant were checked
    against the stored entries in the linked tables.
Display properties:
  number-header: $\mathrm{Vol}$

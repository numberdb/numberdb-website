Programs:
  program-sage:
    language: Sage
    code: |
      E = EllipticCurve('11a1')
      for phi in E.isogenies_prime_degree(5):
          print(phi.codomain().cremona_label(), phi.kernel_polynomial())
Tags:
  - number theory
  - elliptic curves
  - polynomial
Data properties:
  type: Q[]
  rigour: exact
  complete: no
  complete-note: it holds every rational isogeny of prime degree $\ell\geq5$ whose source curve lies in Sage's mini Cremona database CITE{SageCremona} with conductor $N\leq300$
  sources:
    - CITE{SageCremona}
    - CITE{SageIsogenies}
  rigour details: The generator reads exact Weierstrass coefficients from Sage's mini Cremona database CITE{SageCremona}, enumerates Sage's exact rational isogenies of prime degree $\ell\geq5$ CITE{SageIsogenies}, and stores each monic kernel polynomial in $\mathbb{Q}[x]$. It verifies every row has degree $(\ell-1)/2$, divides the exact division polynomial $\psi_\ell$ of the source curve, and has a target curve whose $(c_4,c_6)$ invariants are the target parameters. On the rows where HREF{Division_polynomials_psi_n_of_elliptic_curves_over_mathbb_Q}[the division-polynomial table] contains the same source curve and $\ell=5$, it verifies divisibility against that stored row too.
Display properties:
  number-header: $K_\varphi(x)$
  group parameters:
    - [N]
    - [c4, c6]
    - [ell]
    - [target_c4, target_c6]
Numbers: []

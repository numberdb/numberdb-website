Title: Kernel polynomials of rational isogenies of elliptic curves over $\mathbb{Q}$
Definition: Let $E/\mathbb{Q}$ be the elliptic curve with reduced global minimal Weierstrass model recovered from $(c_4,c_6)$ by Formula CITE{formula-model-from-invariants}. For a rational isogeny $\varphi:E\to E'$ of prime degree $\ell\geq5$, the entry is the monic kernel polynomial $K_\varphi(x)\in\mathbb{Q}[x]$ CITE{LMFDBIsogeny}, whose roots are the $x$-coordinates of the nonzero points of $\ker\varphi$.
Keywords:
  - elliptic curve isogeny kernel polynomial
  - kernel polynomial
  - Velu isogeny
Parameters:
  N:
    type: Z
    title: conductor of the source curve $E$
    display: $N$
    constraints: $N\geq1$
  c4:
    type: Z
    title: invariant $c_4$ of the reduced global minimal model of $E$
    display: $c_4$
  c6:
    type: Z
    title: invariant $c_6$ of the reduced global minimal model of $E$
    display: $c_6$
  ell:
    type: Z
    title: isogeny degree
    display: $\ell$
    constraints: $\ell$ is prime and $\ell\geq5$
  target_c4:
    type: Z
    title: invariant $c_4$ of the target curve $E'$
    display: $c'_4$
  target_c6:
    type: Z
    title: invariant $c_6$ of the target curve $E'$
    display: $c'_6$
Comments:
  comment-curve-labels: The source curve is identified by $N$, $c_4$ and $c_6$. The target invariants $c'_4$ and $c'_6$ distinguish rational isogenies of the same degree from the same source curve. Each entry comment gives the source and target Cremona labels. LMFDB CITE{LMFDB} numbers curves within an isogeny class differently from Cremona's tables CITE{SageCremona}, so those labels are not LMFDB labels.
  comment-low-degree: Degree $2$ and degree $3$ rational isogenies are not listed. Their kernel polynomials are linear, so their roots are already $x$-coordinates of torsion points rather than genuinely new polynomials.
Formulas:
  formula-model-from-invariants: For the reduced models in this table, $b_2$ is the unique element of $\{-4,-3,0,1,4,5\}$ with $b_2\equiv -c_6\pmod{12}$, $b_4=(b_2^2-c_4)/24$, and $b_6=(-c_6-b_2^3+36b_2b_4)/216$. The model has $a_1\equiv b_2\pmod 2$, $a_3\equiv b_6\pmod 2$ with $a_1,a_3\in\{0,1\}$ and $a_2\in\{-1,0,1\}$, and $a_2=(b_2-a_1^2)/4$, $a_4=(b_4-a_1a_3)/2$ and $a_6=(b_6-a_3^2)/4$.
  formula-divides: For prime $\ell\geq5$, $K_\varphi(x)$ has degree $(\ell-1)/2$ and divides the division polynomial $\psi_\ell(x)$ in $\mathbb{Q}[x]$.
Similar tables:
  - table: HREF{Division_polynomials_psi_n_of_elliptic_curves_over_mathbb_Q}[Division polynomials $\psi_n$ of elliptic curves over $\mathbb{Q}$]
    relation: stores the division polynomial that each listed kernel polynomial divides
  - table: HREF{Modular_polynomials_for_j-invariant}[Modular polynomials for the $j$-invariant]
    relation: stores modular equations whose roots determine which curves are $\ell$-isogenous
  - table: HREF{Canonical_modular_polynomials}[Canonical modular polynomials $\Phi^c_\ell$]
    relation: stores smaller modular equations for the same prime-degree isogeny relation
  - table: HREF{Weil_polynomials_of_abelian_varieties_over_prime_fields}[Weil polynomials of abelian varieties over prime fields]
    relation: indexes isogeny classes of abelian varieties over finite fields rather than explicit kernels of isogenies over $\mathbb{Q}$

Tags:
  - special values
  - special functions
Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each non-exact value is computed as a Sage real ball with arb at
    `numberdb.bits(digits, losing=96)` bits, using exact rational arguments.
    The entries were checked against Gauss's digamma theorem
    CITE{formula-gauss}, the recurrence in CITE{formula-recurrence}, the
    reflection formula in CITE{formula-reflection}, the defining relation for
    $H_x$ in CITE{formula-harmonic}, the exact rational values of $H_n$ for
    nonnegative integers $n$, and the Dirichlet $L$-value relation in
    CITE{formula-dirichlet-l}.
  complete: 'no'
  complete-note: >-
    it holds both quantities for every rational argument $x=a/b$ in lowest
    terms with $b\leq12$ and $-4<x\leq4$ at which the quantity is finite;
    arguments outside $0<x\leq1$ are included because, for positive integers
    $k$, the differences $\psi(x+k)-\psi(x)=\sum_{j=0}^{k-1}1/(x+j)$ and
    $H_{x+k}-H_x=\sum_{j=1}^{k}1/(x+j)$ are rational whenever both sides are
    finite
Display properties:
  number-header: value

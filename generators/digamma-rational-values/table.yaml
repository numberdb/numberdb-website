Title: Values of the digamma function $\psi(x)$ at rational numbers
Definition: >-
  Listed are the digamma function $\psi(x)=\Gamma'(x)/\Gamma(x)$
  CITE{DLMFPsi} and the harmonic-number continuation
  $H_x=\psi(x+1)+\gamma$ CITE{WikiHarmonic} at rational arguments $x$, where
  $\gamma$ is the Euler-Mascheroni constant.
Keywords:
  - digamma function
  - psi function
  - harmonic numbers of fractional argument
  - harmonic number
  - Gauss digamma theorem
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: >-
      $x\in\mathbb{Q}$; for $\psi(x)$, $x$ is not a non-positive integer; for
      $H_x$, $x$ is not a negative integer
  quantity:
    type: Symbolic
    title: $\psi(x)$ or $H_x$
    display: quantity
    values:
      psi: $\psi(x)$
      H: $H_x$
Comments:
  comment-convention: >-
    The symbol $\psi$ means $\Gamma'/\Gamma$, not the shifted function
    sometimes written $\Psi(x)=\psi(x+1)$. Here $\gamma$ is
    HREF{Stieltjes_constants#0}[the Euler-Mascheroni constant $\gamma_0$], and
    $H_x=\psi(x+1)+\gamma$, so $H_n$ is the usual $n$th harmonic number for
    nonnegative integers $n$.
  comment-exact-harmonic: >-
    For a nonnegative integer $n$, the row $H_n$ is the exact rational number
    $\sum_{k=1}^{n}1/k$. For positive integers $n$, the rows
    $\psi(n)=H_{n-1}-\gamma$ are stored as real values.
Formulas:
  formula-harmonic: >-
    $H_x=\psi(x+1)+\gamma$.
  formula-recurrence: >-
    $\psi(x+1)=\psi(x)+1/x$, and $H_x=H_{x-1}+1/x$ when both sides are finite
    CITE{DLMFFunctional}.
  formula-reflection: >-
    $\psi(1-x)-\psi(x)=\pi\cot(\pi x)$ for nonintegral $x$
    CITE{DLMFFunctional}.
  formula-gauss: >-
    For integers $1\leq p<q$,
    $\psi(p/q)=-\gamma-\log(2q)-\frac{\pi}{2}\cot(\pi p/q)
    +2\sum_{n=1}^{\lfloor(q-1)/2\rfloor}
    \cos(2\pi pn/q)\log\sin(\pi n/q)$ CITE{WikiDigamma}.
  formula-dirichlet-l: >-
    For a nontrivial Dirichlet character $\chi$ modulo $q$,
    $L(1,\chi)=-q^{-1}\sum_{a=1}^{q}\chi(a)\psi(a/q)$, as in
    HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[the table of
    Dirichlet $L$-values].
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      RBF = RealBallField(numberdb.bits(100, losing=96))
      x = QQ(1) / QQ(3)
      RBF(x).psi()                         # psi(1/3)
      RBF(x + 1).psi() + RBF.euler_constant()  # H_{1/3}
Similar tables:
  - table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the Gamma function at rational numbers]
    relation: $\psi$ is the logarithmic derivative of $\Gamma$
  - table: HREF{Zeros_of_the_polygamma_functions}[Zeros of the polygamma functions $\psi^{(n)}$]
    relation: stores the real zeros of the same function and its higher derivatives
  - table: HREF{Values_of_the_Hurwitz_zeta_function_at_pairs_of_rational_numbers}[Values of the Hurwitz zeta function at pairs of rational numbers]
    relation: the Laurent expansion of $\zeta(s,x)$ at $s=1$ has constant term $-\psi(x)$
  - table: HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[Values of Dirichlet L-functions at positive integers]
    relation: uses digamma values in the formula for $L(1,\chi)$
  - table: HREF{Stieltjes_constants}[Stieltjes constants]
    relation: its row HREF{Stieltjes_constants#0}[$\gamma_0$] is the Euler-Mascheroni constant $\gamma$ in $H_x=\psi(x+1)+\gamma$

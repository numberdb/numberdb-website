# Draft document for T226 after splitting the harmonic-number rows to T247.
# Publishing is a person's act.
Title: Values of the digamma function $\psi(x)$ at rational numbers
Definition: Listed are values of the digamma function $\psi(x)=\Gamma'(x)/\Gamma(x)$
  CITE{DLMFPsi} at rational arguments $x$.
Keywords:
- digamma function
- psi function
- Gauss digamma theorem
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\in\mathbb{Q}$ and $x$ is not a non-positive integer
Comments:
  comment-convention: The symbol $\psi$ means $\Gamma'/\Gamma$, not the shifted function
    sometimes written $\Psi(x)=\psi(x+1)$.
  comment-integers: For positive integers $n$, $\psi(n)=H_{n-1}-\gamma$, so these
    rows are real values rather than rational harmonic numbers.
Formulas:
  formula-recurrence: $\psi(x+1)=\psi(x)+1/x$ when both sides are finite CITE{DLMFFunctional}.
  formula-reflection: $\psi(1-x)-\psi(x)=\pi\cot(\pi x)$ for nonintegral $x$ CITE{DLMFFunctional}.
  formula-gauss: For integers $1\leq p<q$, $\psi(p/q)=-\gamma-\log(2q)-\frac{\pi}{2}\cot(\pi
    p/q) +2\sum_{n=1}^{\lfloor(q-1)/2\rfloor} \cos(2\pi pn/q)\log\sin(\pi n/q)$ CITE{WikiDigamma}.
  formula-dirichlet-l: For a nontrivial Dirichlet character $\chi$ modulo $q$, $L(1,\chi)=-q^{-1}\sum_{a=1}^{q}\chi(a)\psi(a/q)$,
    as in HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[the table of
    Dirichlet $L$-values].
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.rational_field import QQ

      from sage.rings.real_arb import RealBallField


      RBF = RealBallField(numberdb.bits(100, losing=96))

      x = QQ(1) / QQ(3)

      RBF(x).psi()  # psi(1/3)'
Similar tables:
- table: HREF{T247}[Values of the harmonic-number function $H_x$ at rational
    numbers]
  relation: $H_x=\psi(x+1)+\gamma$ is the shifted digamma function plus the Euler-Mascheroni
    constant; a reader holding a harmonic-number value is likely to want that table,
    while this table gives the unshifted $\psi(x)$ values
- table: HREF{Values_of_the_Gamma_function_at_rational_numbers}[Values of the Gamma
    function at rational numbers]
  relation: $\psi$ is the logarithmic derivative of $\Gamma$
- table: HREF{Zeros_of_the_polygamma_functions}[Zeros of the polygamma functions $\psi^{(n)}$]
  relation: stores the real zeros of the same function and its higher derivatives
- table: HREF{Values_of_the_Hurwitz_zeta_function_at_pairs_of_rational_numbers}[Values
    of the Hurwitz zeta function at pairs of rational numbers]
  relation: the Laurent expansion of $\zeta(s,x)$ at $s=1$ has constant term $-\psi(x)$
- table: HREF{Values_of_Dirichlet_L-functions_at_positive_integers}[Values of Dirichlet
    L-functions at positive integers]
  relation: uses digamma values in the formula for $L(1,\chi)$
- table: HREF{Stieltjes_constants}[Stieltjes constants]
  relation: its row HREF{Stieltjes_constants#0}[$\gamma_0$] is the Euler-Mascheroni
    constant $\gamma$ that relates $\psi$ to $H_x$
Links:
  DLMFPsi:
    title: 'DLMF 5.2: Gamma and Psi Functions'
    url: https://dlmf.nist.gov/5.2
  DLMFFunctional:
    title: 'DLMF 5.5: Functional Relations'
    url: https://dlmf.nist.gov/5.5
  WikiDigamma:
    title: 'Wikipedia: Digamma function'
    url: https://en.wikipedia.org/wiki/Digamma_function
  WikiHarmonic:
    title: 'Wikipedia: Harmonic number'
    url: https://en.wikipedia.org/wiki/Harmonic_number
Tags:
- special values
- special functions
Data properties:
  type: R
  rigour: proven
  rigour details: Each value is computed as a Sage real ball with arb at `numberdb.bits(digits,
    losing=96)` bits, using exact rational arguments. The entries were checked against
    Gauss's digamma theorem CITE{formula-gauss}, the recurrence in CITE{formula-recurrence},
    the reflection formula in CITE{formula-reflection}, and the Dirichlet $L$-value
    relation in CITE{formula-dirichlet-l}.
  complete: 'no'
  complete-note: it holds $\psi(x)$ for every rational argument $x=a/b$ in lowest
    terms with $b\leq12$ and $-4<x\leq4$ at which $\psi(x)$ is finite; arguments outside
    $0<x\leq1$ are included because, for positive integers $k$, the differences $\psi(x+k)-\psi(x)=\sum_{j=0}^{k-1}1/(x+j)$
    are rational whenever both sides are finite
Display properties:
  number-header: $\psi(x)$

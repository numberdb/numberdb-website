Data properties:
  type: R
  digits: '100'
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every connected graph on at most $7$ vertices, all $996$ of them
  rigour details: >-
    The generator enumerates connected simple graphs with $1\leq |V(G)|\leq7$
    using Sage, takes each graph's `canonical_label(algorithm='sage')`, and
    stores the canonical graph6 string. It computes $\det(xI-A(G))$ exactly
    over $\mathbb{Z}$, isolates the roots in `AA`, selects the largest root
    exactly, and converts that root to a `RealIntervalField` at
    `numberdb.bits(100, losing=64)`, except when the largest root is rational
    and is returned exactly.

    The build checked that the 996 graph6 strings are exactly the keys of
    HREF{Characteristic_polynomials_of_connected_graphs}[the characteristic
    polynomial table]. The largest root agreed with the largest root computed
    from the stored characteristic polynomial on every row. Sage's adjacency
    matrix `eigenvalues()` agreed on every row. Formula CITE{formula-complete} agreed for
    $K_1,\ldots,K_7$; formula CITE{formula-complete-bipartite} agreed for
    $K_{1,1}$, $K_{1,2}$, $K_{1,3}$, $K_{1,4}$, $K_{1,5}$, $K_{1,6}$,
    $K_{2,2}$, $K_{2,3}$, $K_{2,4}$, $K_{2,5}$, $K_{3,3}$, and $K_{3,4}$;
    and formula CITE{formula-paths-cycles} agreed for every path and cycle in
    the table.
Display properties:
  number-header: $\lambda_1(G)$
  group parameters: [['g']]

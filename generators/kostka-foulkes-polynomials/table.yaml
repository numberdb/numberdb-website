Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every nonzero $K_{\lambda\mu}(t)$ with $|\lambda|=|\mu|\leq9$
  rigour details: >-
    Every entry is an exact polynomial with integer coefficients. The generator
    computes the coefficients with Sage's `KostkaFoulkesPolynomial`, whose
    documentation defines them by CITE{formula-charge}. Before the values were
    written, they were checked against Sage's Schur-to-Hall-Littlewood
    transition dictionary, against an independent enumeration of semistandard
    tableaux using the charge statistic, against the dominance zero condition,
    and against the specialization $K_{\lambda\mu}(1)$ to the ordinary Kostka
    number.
Display properties:
  number-header: $K_{\lambda\mu}(t)$

Title: Kostka–Foulkes polynomials $K_{\lambda\mu}(t)$
Definition: >-
  The Kostka-Foulkes polynomial $K_{\lambda\mu}(t)$ CITE{WikiKostka} is the
  coefficient of $P_\mu(x;t)$ in the Hall-Littlewood expansion
  CITE{WikiHallLittlewood} of the Schur polynomial $s_\lambda$.
Parameters:
  lambda:
    type: Symbolic
    title: shape
    display: $\lambda$
    constraints: a partition of a positive integer
  mu:
    type: Symbolic
    title: weight
    display: $\mu$
    constraints: a partition of $|\lambda|$ dominated by $\lambda$
Comments: >-
  The partition is written as its parts, largest first, separated by commas:
  $2,1,1$ is the partition $(2,1,1)$ of $4$. The reading word of a tableau is
  obtained by reading each row left to right, from the bottom row upwards. The
  charge of a word is computed by decomposing it into charge subwords, as in
  CITE{LS}; CITE{Sage} gives Sage's algorithm. Pairs where $\lambda$ does not
  dominate $\mu$ have $K_{\lambda\mu}(t)=0$ and are not entries here.
Formulas:
  formula-transition: >-
    $s_\lambda = \sum_\mu K_{\lambda\mu}(t)P_\mu(x;t)$, with
    $P_\mu(x;t)$ in Macdonald's Hall-Littlewood $P$ normalisation CITE{Macdonald}.
  formula-charge: >-
    $K_{\lambda\mu}(t)=\sum_T t^{\operatorname{charge}(T)}$, summed over
    semistandard Young tableaux $T$ of shape $\lambda$ and weight $\mu$, where
    $\operatorname{charge}(T)$ is the charge of the reading word of $T$
    CITE{LS}.
  formula-kostka: >-
    $K_{\lambda\mu}(1)$ is the Kostka number, the coefficient of $m_\mu$ in
    the expansion of $s_\lambda$ in HREF{Monomial_symmetric_polynomials}[the
    monomial symmetric polynomials].
  formula-edges: >-
    $K_{\lambda\lambda}(t)=1$, and $K_{\lambda\mu}(t)=0$ unless $\lambda$
    dominates $\mu$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.combinat.sf.kfpoly import KostkaFoulkesPolynomial

      KostkaFoulkesPolynomial([5, 3, 2], [2, 2, 2, 2, 2])    # a partition of 10, past this table
Similar tables:
  - table: HREF{Schur_polynomials}[Schur polynomials]
    relation: are expanded in the Hall-Littlewood $P$ basis with these coefficients
  - table: HREF{Monomial_symmetric_polynomials}[monomial symmetric polynomials]
    relation: use $K_{\lambda\mu}(1)$ as the coefficient of $m_\mu$ in $s_\lambda$

# The table document for T196, the modified Bessel function of the first
# kind. It is the first table built from proposal 2 of
# agents/table-ideas/BATCH-2026-09-09T1936.md. The same proposal also names
# the modified Bessel function of the second kind K_nu, which belongs in a
# companion table rather than in this one.
Title: Values of modified Bessel functions of the first kind $I_\nu(x)$
Definition: This table gives the real principal values of the modified Bessel
  function of the first kind $I_\nu(x)$ CITE{Wiki} CITE{DLMFModifiedDefinitions},
  for rational order $\nu\geq0$ and rational argument $x>0$.
Keywords:
- Bessel I
- modified Bessel I
- modified Bessel function of the first kind
- I0(1)
- cylinder functions
- von Mises distribution
Parameters:
  nu:
    type: Q
    title: order
    display: $\nu$
    constraints: $\nu\in\mathbb{Q}$, $\nu\geq0$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments:
  comment-branches: The principal branch is that of CITE{DLMFModifiedDefinitions}.
    For real $\nu$ and $x>0$, $I_\nu(x)$ is real. At the origin, $I_0(0)=1$
    and $I_\nu(0)=0$ for $\nu>0$; the table begins above $x=0$ so that it
    uses the same argument range as HREF{Values_of_Bessel_functions_of_the_first_kind}[the
    table of $J_\nu$] and HREF{Values_of_Bessel_functions_of_the_second_kind}[the
    table of $Y_\nu$].
  comment-negative-orders: Negative integer orders are not listed separately;
    they reduce to positive integer orders by CITE{formula-negative-integer-orders}.
    For nonintegral negative orders, the connection formulas in CITE{DLMFModifiedConnections}
    express the values through $I_\nu(x)$ and $K_\nu(x)$.
  comment-spherical: These are the ordinary cylindrical modified Bessel functions.
    The modified spherical Bessel function of the first kind is $\mathrm{i}_n(x)=\sqrt{\pi/(2x)}I_{n+1/2}(x)$
    CITE{DLMFSpherical}.
  comment-half-integers: Half-integer orders are elementary. HREF{Bessel_polynomials}[The
    Bessel polynomials] occur in explicit formulas for the associated spherical
    and modified spherical functions CITE{DLMFSphericalExplicit}.
  comment-von-mises: The von Mises distribution on a circle has density $\exp(\kappa\cos(\theta-\mu))/(2\pi
    I_0(\kappa))$ CITE{WikiVonMises}.
Formulas:
  formula-recurrence: $I_{\nu-1}(x)-I_{\nu+1}(x)=2\nu I_\nu(x)/x$ CITE{DLMFModifiedRecurrences}.
  formula-negative-integer-orders: For an integer $n$, $I_{-n}(x)=I_n(x)$ CITE{DLMFModifiedConnections}.
  formula-half-order: $I_{1/2}(x)=\sqrt{2/(\pi x)}\sinh x$ CITE{DLMFModifiedElementary}.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.complex_arb import ComplexBallField

      from sage.rings.rational_field import QQ


      CBF = ComplexBallField(numberdb.bits(100, losing=64))

      nu = CBF(QQ(0))

      x = CBF(QQ(1))

      # Sage''s arb method is called on the argument and takes the order.

      x.bessel_I(nu).real()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.besseli(0, 1)'

# The table document for the entropy constants of lattice models, proposal 4
# of agents/table-ideas/BATCH-2026-09-06T0326.md. Created as a draft through
# the API (X-Draft: yes) and filled by generate.py beside it; publishing is a
# person's act on the site.
Title: Entropy constants of lattice models
Definition: >-
  For a lattice model on an infinite lattice $L$ whose configurations on a
  finite region $\Lambda$ of $L$ with $|\Lambda|$ vertices are counted by
  $Z_\Lambda$, the entropy constant is
  $\kappa=\lim_{\Lambda\to L}Z_\Lambda^{1/|\Lambda|}$, the number of
  configurations per site, and the entropy per site is $h=\ln\kappa$
  CITE{Finch}.
Parameters:
  model:
    type: Symbolic
    title: lattice model, by what $Z_\Lambda$ counts
    display: model
    values:
      hard-core: 'hard-core gas (independent sets)'
      ice: 'ice model (Eulerian orientations)'
      dimer: 'dimer model (perfect matchings)'
      spanning-tree: 'spanning trees'
  lattice:
    type: Symbolic
    title: lattice, named by its tiling, crystal structure or vertex configuration
    display: lattice
    values:
      line: 'line $\mathbb{Z}$'
      square: 'square $(4^4)$'
      triangular: 'triangular $(3^6)$'
      honeycomb: 'honeycomb $(6^3)$'
      kagome: 'kagome $(3,6,3,6)$'
      3-12-12: '$(3,12^2)$'
      4-8-8: '$(4,8^2)$'
      D-3-6-3-6: 'diced $D(3,6,3,6)$'
      D-4-8-8: 'union jack $D(4,8^2)$'
      sc: 'simple cubic'
  expression:
    type: Symbolic
    title: the constant $\kappa$ or the entropy $h=\ln\kappa$
    display: expression
    values:
      kappa: '$\kappa$'
      entropy: '$h=\ln\kappa$'
Comments:
  comment-models: >-
    The hard-core lattice gas at activity $1$ counts the independent sets of
    $\Lambda$, the sets of vertices no two of which are adjacent; on the
    square lattice it is the hard-square model CITE{OEIShs}, on the
    triangular lattice the hard-hexagon model CITE{Wiki}, and on the line it
    is the golden-mean shift, the sequences of $0$ and $1$ with no two
    adjacent $1$. The ice model counts the Eulerian orientations of the
    square lattice, the orientations of its edges with two edges into and two
    out of every vertex, which are the states of the six-vertex model with
    all weights $1$ CITE{WikiLieb}; the same count is, up to a bounded
    factor, the number of proper $3$-colourings of the square lattice. The
    dimer model counts the perfect matchings, the domino tilings of the
    square lattice CITE{WikiDomino} and the lozenge tilings of the honeycomb
    lattice. The spanning-tree constant $z_L=\lim|\Lambda|^{-1}\ln
    N_{\mathrm{ST}}(\Lambda)$ of Shrock and Wu CITE{ShrockWu} is the entropy
    $h$ of the spanning-tree model, $N_{\mathrm{ST}}(\Lambda)$ being the
    number of spanning trees of $\Lambda$, and their notation $z_{\mathrm{sq}}$,
    $z_{\mathrm{tri}}$, $z_{\mathrm{hc}}$, $z_{\mathrm{kag}}$ is used in the
    entry comments.
  comment-conventions: >-
    Every constant is per site, that is per vertex of the lattice, and $h$
    is the natural logarithm of $\kappa$. Finch's dimer constant
    CITE{Finch} and OEIS A130834 CITE{OEISdimer2} are per dimer, which is
    $\kappa^2$ here, and
    the square-ice constant is sometimes given per vertex of the dual
    lattice, which is the same number on the square lattice; the entry
    comments say where a source normalises differently. The limit is taken
    along tori, or along rectangles with free boundaries, which give the same
    constant; for the dimer model $|\Lambda|$ is even. The lattices are named
    as in the HREF{Site_and_bond_percolation_thresholds_of_lattices}[table of
    percolation thresholds]: an Archimedean lattice by its vertex
    configuration, and the diced lattice $D(3,6,3,6)$ and the union-jack
    lattice $D(4,8^2)$ as the planar duals of the kagome lattice and of
    $(4,8^2)$.
  comment-status: >-
    Ten of the seventeen constants are known in closed form: the
    HREF{Golden_ratio}[golden ratio] for the line, Lieb's
    $\left(\frac43\right)^{3/2}$ for square ice
    CITE{Lieb}, $e^{G/\pi}$ for dimers on the square lattice with $G$
    Catalan's constant CITE{Kasteleyn}, the honeycomb dimer constant and the
    spanning-tree constants of the square, triangular, honeycomb, kagome,
    diced and $(3,12^2)$ lattices, which are exponentials of rational
    multiples of $G/\pi$ and of $\sqrt3L(2,\chi_{-3})/\pi$, times $6^{1/3}$
    for the kagome and diced lattices and $15^{1/6}$ for $(3,12^2)$ CITE{Wu77}
    CITE{ShrockWu}. The hard-hexagon constant is algebraic of degree $24$
    CITE{Joyce}, from Baxter's exact solution CITE{Baxter80}. The dimer
    constant of the triangular lattice and the spanning-tree constants of
    $(4,8^2)$, the union-jack lattice and the simple cubic lattice are
    integrals with no known closed form. The hard-square and honeycomb
    hard-core constants are not known exactly; the entries are Baxter's
    corner-transfer-matrix values CITE{Baxter99}, and for hard squares the
    first $25$ decimals are proved by the bounds of Liang CITE{Liang}. The
    hard-core models have a phase transition at activity
    $z_c=\frac{11+5\sqrt5}{2}=\varphi^5$ on the triangular lattice
    CITE{Baxter80}, at $z_c\approx 3.7962$ on the square lattice and at
    $z_c\approx 7.92$ on the honeycomb lattice CITE{Baxter99}, all far
    larger than the activity $1$ of these entries.
Formulas:
  formula-hard-core-line: >-
    $\kappa(\text{hard-core},\mathbb{Z})=\varphi=\frac{1+\sqrt5}{2}$, since
    the path on $n$ vertices has $F_{n+2}$ independent sets, $F_n$ the
    Fibonacci numbers.
  formula-ice: >-
    $\kappa(\text{ice},4^4)=\left(\frac43\right)^{3/2}=\frac{8\sqrt3}{9}$
    CITE{Lieb}.
  formula-dimer-square: >-
    $h(\text{dimer},4^4)=\frac{G}{\pi}=\frac1\pi\sum_{k\geq0}\frac{(-1)^k}{(2k+1)^2}=\frac{L(2,\chi_{-4})}{\pi}$
    CITE{Kasteleyn} CITE{TemperleyFisher}, the number of domino tilings of
    an $m\times n$ rectangle being
    $\prod_{j=1}^{\lceil m/2\rceil}\prod_{k=1}^{\lceil n/2\rceil}\left(4\cos^2\frac{\pi j}{m+1}+4\cos^2\frac{\pi k}{n+1}\right)$.
  formula-dimer-honeycomb: >-
    $h(\text{dimer},6^3)=\frac{1}{16\pi^2}\int_{-\pi}^{\pi}\!\int_{-\pi}^{\pi}\ln\left(3+2\cos u+2\cos v+2\cos(u+v)\right)du\,dv=\frac{3\sqrt3}{8\pi}L(2,\chi_{-3})$
    CITE{Kasteleyn63}, half the Mahler measure of $1+x+y$ CITE{Smyth}, and
    $h(\text{dimer},6^3)=\frac1{10}z_{\mathrm{tri}}$.
  formula-dimer-triangular: >-
    $h(\text{dimer},3^6)=\frac{1}{16\pi^2}\int_{-\pi}^{\pi}\!\int_{-\pi}^{\pi}\ln\left(6+2\cos u+2\cos v+2\cos(u+v)\right)du\,dv=\frac{1}{8\pi}\int_{-\pi}^{\pi}\ln\frac{A+\sqrt{A^2-B^2}}{2}\,du$
    with $A=6+2\cos u$ and $B=4\cos\frac u2$ CITE{FMS}.
  formula-spanning-planar: >-
    $z_{\mathrm{sq}}=\frac{4G}{\pi}$,
    $z_{\mathrm{tri}}=\frac{3\sqrt3}{\pi}\left(1-\frac1{5^2}+\frac1{7^2}-\frac1{11^2}+\frac1{13^2}-\cdots\right)=\frac{15\sqrt3}{4\pi}L(2,\chi_{-3})$,
    $z_{\mathrm{hc}}=\frac12z_{\mathrm{tri}}$ CITE{Wu77},
    $z_{\mathrm{kag}}=z_{\mathrm{diced}}=\frac13\left(z_{\mathrm{tri}}+\ln6\right)$
    and $z_{(3,12^2)}=\frac16\left(z_{\mathrm{tri}}+\ln15\right)$
    CITE{ShrockWu}, where $z_L=h(\text{spanning trees},L)$ and the sum runs
    over the $n$ coprime to $6$ with the sign $\chi_{-3}(n)$.
  formula-spanning-4-8-8: >-
    $z_{(4,8^2)}=\frac14\ln2+\frac1{4\pi}\int_0^{\pi}\ln\left(7-3\cos\theta+4\sin\frac\theta2\sqrt{5-\cos\theta}\right)d\theta$
    and $z_{\mathrm{UJ}}=2z_{(4,8^2)}$ for the union-jack lattice
    CITE{ShrockWu}.
  formula-spanning-cubic: >-
    $z_{\mathrm{sc}}=\ln6+\frac{1}{(2\pi)^3}\int_{[-\pi,\pi]^3}\ln\left(1-\frac{\cos\theta_1+\cos\theta_2+\cos\theta_3}{3}\right)d^3\theta=\frac1{\pi^2}\int_0^{\pi}\!\int_0^{\pi}\operatorname{arccosh}\left(3-\cos\theta_1-\cos\theta_2\right)d\theta_1\,d\theta_2=\ln6-\sum_{m\geq1}\frac{W_{2m}}{2m\cdot36^m}$
    CITE{ShrockWu}, with $W_{2m}=\binom{2m}{m}\sum_{k=0}^{m}\binom mk^2\binom{2k}{k}$
    the number of closed walks of length $2m$ on $\mathbb{Z}^3$ CITE{OEISwalks}.
  formula-duality: >-
    $z_{L^{*}}=z_L/\nu_L$ for a planar lattice $L$ and its dual $L^{*}$,
    where $\nu_L$ is the number of vertices of $L^{*}$ per vertex of $L$
    CITE{ShrockWu}: $\nu=\frac12$ for the honeycomb lattice and for
    $(4,8^2)$, and $\nu=1$ for the kagome lattice.
  formula-hard-hexagon: >-
    $\kappa(\text{hard-core},3^6)$ is a root of
    $11^{10}z^{24}+2013290651222784z^{22}+2505062311720673792z^{20}+797726698866658379776z^{18}+7449488310131083100160z^{16}+2958015038376958230528z^{14}-72405670285649161617408z^{12}+107155448150443388043264z^{10}-71220809441400405884928z^{8}-73347491183630103871488z^{6}+97143135277377575190528z^{4}-32751691810479015985152$
    CITE{Joyce} CITE{MathWorld}, its only positive real root; in Baxter's
    parametrisation CITE{Baxter80} it is the value at the $x\in(-1,0)$ with
    $-xH(x)^5/G(x)^5=1$ of
    $\kappa=\frac{H(x)^3Q(x^5)^2}{G(x)^2}\prod_{n\geq1}\frac{(1-x^{6n-4})(1-x^{6n-3})^2(1-x^{6n-2})}{(1-x^{6n-5})(1-x^{6n-1})(1-x^{6n})^2}$,
    with $G(x)=\prod_{n\geq1}\frac{1}{(1-x^{5n-4})(1-x^{5n-1})}$ and
    $H(x)=\prod_{n\geq1}\frac{1}{(1-x^{5n-3})(1-x^{5n-2})}$ the
    Rogers–Ramanujan products and $Q(x)=\prod_{n\geq1}(1-x^n)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      N(exp(catalan/pi), digits=30)                        # dimers on the square lattice, per site
      N((4/3)^(3/2), digits=30)                            # Lieb's square ice constant
      L3 = (hurwitz_zeta(2, 1/3) - hurwitz_zeta(2, 2/3))/9  # L(2, chi_{-3})
      N(15*sqrt(3)/(4*pi)*L3, digits=30)                   # spanning trees on the triangular lattice, z_tri

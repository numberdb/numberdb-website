Data properties:
  type: R
  rigour: heuristic
  sources:
    - CITE{Baxter99}
    - CITE{ShrockWu}
  complete: 'no'
  complete-note: >-
    it holds $\kappa$ and $h$ for the hard-core gas on the line and on the
    square, triangular and honeycomb lattices, the ice model on the square
    lattice, the dimer model on the square, triangular and honeycomb
    lattices, and spanning trees on the square, triangular, honeycomb,
    kagome, diced, $(3,12^2)$, $(4,8^2)$, union-jack and simple cubic
    lattices
  rigour details: >-
    Mixed, and labelled by its weakest entries. Twenty-eight entries are
    enclosures computed in ball arithmetic in arb at 100 digits with 64
    guard bits: the closed forms, with Catalan's constant and
    $L(2,\chi_{-3})$ taken from arb's Hurwitz zeta function; the two
    one-variable integrals for the triangular dimer constant and for
    $z_{(4,8^2)}$, integrated with arb's rigorous integrator after the
    other angle was integrated in closed form; and the hard-hexagon
    constant, computed from Baxter's exact solution with 220 guard bits,
    the root $x$ of $-xH(x)^5/G(x)^5=1$ enclosed by bisection to a width
    of $10^{-120}$ and every infinite product truncated with an explicit
    bound on its tail. Two entries, $z_{\mathrm{sc}}$ and its exponential,
    are heuristic: the double integral was evaluated by nested tanh-sinh
    quadrature in mpmath at 40 and 55 decimal digits, and the digits the two
    agree on are written. Four entries are transcribed from Baxter
    CITE{Baxter99}: the hard-square constant with the 43 decimals he states
    are correct, of which Liang's bounds CITE{Liang} prove 25, and the
    honeycomb constant with 35 of his 38 decimals, since he says the last
    two or three should be treated with caution; their logarithms are
    computed from those intervals and carry the same precision. Before any
    entry was written, every closed form was compared with the OEIS entry
    that holds it to every digit listed there; the hard-hexagon enclosure
    with Baxter's 55 decimals and his density $\rho(1)$, and with Joyce's
    polynomial as given by MathWorld, which vanishes on it; the triangular
    dimer integral with OEIS A247548 to 103 digits; the $(4,8^2)$ integral
    with Shrock and Wu's $0.786684(1)$, the same reduction giving
    $\frac{4G}{\pi}$ on the square lattice; and $z_{\mathrm{sc}}$ with the
    closed-walk series summed to $1.6\cdot 10^6$ terms and extrapolated,
    which agrees with the quadrature to 22 digits, so that the value
    $1.6741481(1)$ printed by Shrock and Wu is wrong in the fourth decimal.
Display properties:
  number-header: $\kappa$ or $h$

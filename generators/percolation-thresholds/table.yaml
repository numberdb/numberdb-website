Data properties:
  type: R
  rigour: measured
  sources:
    - CITE{Wiki}
  complete: 'no'
  complete-note: >-
    it holds site and bond percolation on the eleven Archimedean lattices,
    the eight Laves lattices, the simple cubic, body-centred cubic,
    face-centred cubic and diamond lattices and the hypercubic lattices
    $\mathbb{Z}^d$ for $4\leq d\leq 13$, the most precise published value of
    each as of 6 September 2026
  rigour details: >-
    Mixed, and labelled by its weakest entries. Nine entries are exact and
    are computed in ball arithmetic in arb at 100 digits from their closed
    forms, with 64 guard bits: $\frac12$, written as the rational, for the
    site thresholds of the triangular lattice and of $D(4,8^2)$, $D(4,6,12)$
    and $D(3,12^2)$ and the bond threshold of the square lattice;
    $2\sin\frac{\pi}{18}$ for the bond threshold of the triangular lattice;
    $1-2\sin\frac{\pi}{18}$ for the bond threshold of the honeycomb lattice
    and the site threshold of the kagome lattice; and
    $\sqrt{1-2\sin\frac{\pi}{18}}$ for the site threshold of $(3,12^2)$. The
    other 57 entries were not computed: each is a published estimate,
    written as centre and radius with the paper's stated uncertainty as the
    radius, and the eight Laves bond thresholds are $1$ minus the value of
    the Archimedean dual, in exact decimal arithmetic with the same radius.
    The three site thresholds taken from Suding and Ziff carry the
    uncertainty $3\cdot 10^{-6}$ listed for them in the Wikipedia table
    rather than the $2\cdot 10^{-6}$ printed in the paper, because the
    values that paper gives for the lattices since measured more precisely
    lie two to three of its standard errors from the later values.
    Before any entry was written, the three closed forms were compared with
    OEIS A130880, A178959 and A174849 to every digit those entries give and
    with their minimal polynomials by a sign change across each written
    enclosure; every estimate was compared with the table of the paper
    cited, read from its arXiv version, and with the Wikipedia table on 6
    September 2026; the inequalities
    $\frac{1}{z-1}\leq p_c^{\mathrm{bond}}\leq p_c^{\mathrm{site}}\leq 1-(1-p_c^{\mathrm{bond}})^z$
    were checked on every lattice with $z$ its largest vertex degree, and
    the $1/(2d-1)$ series against the hypercubic entries. The square-lattice
    site threshold is the one entry whose interval was chosen here, to
    contain four published determinations that disagree beyond their stated
    errors; the values from the 2024 comment and reply were taken from the
    Wikipedia table and not read from those papers.
Display properties:
  number-header: $p_c$

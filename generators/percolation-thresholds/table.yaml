# The table document for the percolation thresholds, proposal 1 of
# agents/table-ideas/BATCH-2026-09-06T0326.md. Created as a draft through the
# API (X-Draft: yes) and filled by generate.py beside it; publishing is a
# person's act on the site.
Title: Site and bond percolation thresholds of lattices
Definition: >-
  For an infinite lattice graph $L$, site percolation with parameter $p$ keeps
  each vertex of $L$ independently with probability $p$ and bond percolation
  keeps each edge; the percolation threshold $p_c$ CITE{Wiki} is the value of
  $p$ above which an infinite connected component of kept vertices, or of kept
  edges, exists almost surely and below which it does not.
Parameters:
  lattice:
    type: Symbolic
    title: lattice, named by its tiling, crystal structure or vertex configuration
    display: lattice
    values:
      square: 'square $(4^4)$'
      triangular: 'triangular $(3^6)$'
      honeycomb: 'honeycomb $(6^3)$'
      kagome: 'kagome $(3,6,3,6)$'
      3-12-12: '$(3,12^2)$'
      4-6-12: '$(4,6,12)$'
      4-8-8: '$(4,8^2)$'
      3-4-6-4: '$(3,4,6,4)$'
      3-3-3-3-6: '$(3^4,6)$'
      3-3-4-3-4: '$(3^2,4,3,4)$'
      3-3-3-4-4: '$(3^3,4^2)$'
      D-3-3-4-3-4: 'Cairo pentagonal $D(3^2,4,3,4)$'
      D-3-3-3-4-4: 'prismatic pentagonal $D(3^3,4^2)$'
      D-3-3-3-3-6: 'floret pentagonal $D(3^4,6)$'
      D-3-6-3-6: 'rhombille $D(3,6,3,6)$'
      D-3-4-6-4: 'deltoidal trihexagonal $D(3,4,6,4)$'
      D-4-8-8: 'tetrakis square $D(4,8^2)$'
      D-4-6-12: 'kisrhombille $D(4,6,12)$'
      D-3-12-12: 'triakis triangular $D(3,12^2)$'
      sc: 'simple cubic'
      bcc: 'body-centred cubic'
      fcc: 'face-centred cubic'
      diamond: 'diamond'
      hypercubic: 'hypercubic $\mathbb{Z}^d$'
  d:
    type: Z
    title: dimension
    display: $d$
    constraints: >-
      $d=2$ for the Archimedean and Laves lattices, $d=3$ for the cubic
      lattices, $d\geq 4$ for the hypercubic lattice $\mathbb{Z}^d$
  percolation:
    type: Symbolic
    title: site or bond percolation
    display: percolation
    values:
      site: site
      bond: bond
Comments:
  comment-conventions: >-
    The lattices are the nearest-neighbour graphs of the tilings and crystal
    structures named. An Archimedean lattice is named by its vertex
    configuration in the notation of Grünbaum and Shephard, the cycle of
    polygons around a vertex, so that $(3,12^2)$ has a triangle and two
    dodecagons at every vertex; the eight Laves lattices are the planar duals
    of the Archimedean lattices other than the square lattice, which is
    self-dual, and the triangular and honeycomb lattices, which are dual to
    each other, and $D(3^2,4,3,4)$ denotes the dual of $(3^2,4,3,4)$. The
    hypercubic lattices $\mathbb{Z}^2$ and $\mathbb{Z}^3$ are the square and
    simple cubic rows. Some lattices have several names: $(3,12^2)$ is the
    three-twelve or truncated hexagonal lattice, $(4,6,12)$ the cross or
    truncated trihexagonal lattice, $(4,8^2)$ the four-eight, bathroom-tile or
    truncated square lattice, $(3,4,6,4)$ the ruby or rhombitrihexagonal
    lattice, $(3^4,6)$ the snub hexagonal or maple-leaf lattice,
    $(3^2,4,3,4)$ the snub square, puzzle or Shastry–Sutherland lattice and
    $(3^3,4^2)$ the frieze, trellis or elongated triangular lattice; among the
    Laves lattices, $D(3,6,3,6)$ is the rhombille or dice lattice,
    $D(4,8^2)$ the tetrakis square or union-jack lattice, $D(4,6,12)$ the
    kisrhombille or bisected-hexagon lattice and $D(3,12^2)$ the triakis
    triangular or asanoha lattice.
  comment-exact: >-
    Nine of the thresholds are known exactly. Sykes and Essam
    CITE{SykesEssam} found the bond thresholds $\frac12$ of the square
    lattice, $2\sin\frac{\pi}{18}$ of the triangular lattice and
    $1-2\sin\frac{\pi}{18}$ of the honeycomb lattice, proved by Kesten
    CITE{Kesten} for the square lattice and by Wierman CITE{Wierman} for the
    triangular and honeycomb lattices, and the site thresholds $\frac12$ of
    the triangular lattice and $1-2\sin\frac{\pi}{18}$ of the kagome lattice,
    the kagome value because the kagome lattice is the line graph of the
    honeycomb lattice. The site threshold $\sqrt{1-2\sin\frac{\pi}{18}}$ of
    $(3,12^2)$ follows from the kagome value by contracting the edges that
    lie in no triangle CITE{SudingZiff}, and the site threshold $\frac12$ of
    the three Laves lattices $D(4,8^2)$, $D(4,6,12)$ and $D(3,12^2)$ holds
    because every face of each is a triangle, so the lattice is self-matching
    CITE{SykesEssam}. The bond threshold of each Laves lattice is $1$ minus the
    bond threshold of its Archimedean dual, by the duality theorem of
    Bollobás and Riordan CITE{BollobasRiordan}; where the dual's threshold is
    an estimate the Laves value inherits its uncertainty.
  comment-estimates: >-
    The other thresholds are numerical estimates, each written as
    $p_c\pm\varepsilon$ with $\varepsilon$ the uncertainty stated in the
    paper cited in the entry, usually one standard deviation, and in the
    notation $0.7478008(2)$ the digits in parentheses are that uncertainty in
    the last digits written. They are the most precise published values as of
    6 September 2026, as listed in the table in CITE{Wiki}: for the planar
    lattices the critical-polynomial values of Scullard and Jacobsen
    CITE{ScullardJacobsen} and Jacobsen CITE{Jacobsen14}, the hull-walk
    values of Suding and Ziff CITE{SudingZiff} and Parviainen's simulations
    CITE{Parviainen}; for the cubic lattices the Monte Carlo analysis of Xu,
    Wang, Lv and Deng CITE{XuWangLvDeng}; for the hypercubic lattices the
    invasion-percolation values of Mertens and Moore CITE{MertensMoore}. The
    site threshold of the square lattice is the one row whose published
    determinations disagree beyond their stated errors, in the twelfth
    decimal, and its entry is an interval holding all of them; the first ten
    decimals, $0.5927460507$, are OEIS A377420 CITE{OEISsquare}. The bond
    threshold of the kagome lattice is not known exactly: Wu CITE{Wu}
    conjectured it to be the root in $(0,1)$ of
    $3p^2+6p^3-12p^4+6p^5-p^6=1$, which is $0.52442971\ldots$, and the
    estimate, like the earlier $0.5244053(3)$ of Ziff and Suding
    CITE{ZiffSuding}, differs from it in the fifth decimal.
Formulas:
  formula-exact: >-
    $p_c^{\mathrm{bond}}(4^4)=\frac12$, $p_c^{\mathrm{bond}}(3^6)=2\sin\frac{\pi}{18}$,
    $p_c^{\mathrm{bond}}(6^3)=p_c^{\mathrm{site}}(3,6,3,6)=1-2\sin\frac{\pi}{18}$,
    $p_c^{\mathrm{site}}(3^6)=\frac12$ CITE{SykesEssam} and
    $p_c^{\mathrm{site}}(3,12^2)=\sqrt{1-2\sin\frac{\pi}{18}}$ CITE{SudingZiff},
    where $2\sin\frac{\pi}{18}=2\cos\frac{4\pi}{9}=0.3472963553\ldots$ is the
    root in $(0,1)$ of $x^3-3x+1$ CITE{OEIStri}, $1-2\sin\frac{\pi}{18}$ the root
    in $(0,1)$ of $x^3-3x^2+1$ CITE{OEISkagome} and $\sqrt{1-2\sin\frac{\pi}{18}}$
    the root in $(0,1)$ of $x^6-3x^4+1$ CITE{OEIStt}.
  formula-duality: >-
    $p_c^{\mathrm{bond}}(L)+p_c^{\mathrm{bond}}(L^{*})=1$ for a planar lattice
    $L$ with a $2$-fold or $3$-fold rotational symmetry and its dual $L^{*}$
    CITE{BollobasRiordan}; in
    particular for each Archimedean lattice and its Laves dual, and for the
    self-dual square lattice, where it gives $p_c^{\mathrm{bond}}(4^4)=\frac12$.
  formula-line-graph: >-
    $p_c^{\mathrm{site}}(\mathcal{L}(G))=p_c^{\mathrm{bond}}(G)$ for the line
    graph $\mathcal{L}(G)$ of a graph $G$, since a set of edges of $G$ is a
    set of vertices of $\mathcal{L}(G)$ with the same connectivity; the kagome
    lattice is the line graph of the honeycomb lattice.
  formula-inequalities: >-
    $\frac{1}{z-1}\leq p_c^{\mathrm{bond}}(L)\leq p_c^{\mathrm{site}}(L)\leq
    1-\left(1-p_c^{\mathrm{bond}}(L)\right)^{z}$ for a lattice $L$ whose vertices
    have degree at most $z$ CITE{Grimmett}.
  formula-series: >-
    $p_c^{\mathrm{site}}(\mathbb{Z}^d)=\sigma^{-1}+\frac32\sigma^{-2}+\frac{15}{4}\sigma^{-3}+\frac{83}{4}\sigma^{-4}+\frac{6577}{48}\sigma^{-5}+\frac{119077}{96}\sigma^{-6}+O(\sigma^{-7})$
    and
    $p_c^{\mathrm{bond}}(\mathbb{Z}^d)=\sigma^{-1}+\frac52\sigma^{-3}+\frac{15}{2}\sigma^{-4}+57\sigma^{-5}+\frac{4855}{12}\sigma^{-6}+O(\sigma^{-7})$
    with $\sigma=2d-1$, as $d\to\infty$ CITE{MertensMooreSeries}; the bond
    series through $\sigma^{-6}$ is within $10^{-6}$ of the entry for $d=13$.
Programs:
  program-sage:
    language: Sage
    code: |-
      p = 2*sin(pi/18)                                   # bond threshold of the triangular lattice
      N(p, digits=30), N(1 - p, digits=30), N(sqrt(1 - p), digits=30)   # and of the honeycomb lattice, and the site threshold of (3,12^2)
      R.<x> = QQ[]
      (x^3 - 3*x + 1).roots(RealIntervalField(200))     # 2 sin(pi/18) is the root in (0, 1)

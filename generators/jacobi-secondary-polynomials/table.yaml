Title: Secondary polynomials of the Jacobi polynomials $q_n^{(\alpha,\beta)}$
Definition: >-
  For $n\geq0$ and $\alpha,\beta>-1$, $q_n^{(\alpha,\beta)}$ is the secondary
  polynomial of the Jacobi polynomial $P_n^{(\alpha,\beta)}$, taken with
  respect to the probability-normalised Jacobi weight on $[-1,1]$ CITE{Wiki}.
  The table uses $q_0^{(\alpha,\beta)}=0$.
Parameters:
  alpha:
    type: R
    display: $\alpha$
    constraints: $\alpha>-1$
  beta:
    type: R
    display: $\beta$
    constraints: $\beta>-1$
  n:
    type: Z
    display: $n$
    constraints: $n\geq0$
Comments:
  comment-jacobi: >-
    $P_n^{(\alpha,\beta)}$ is the
    HREF{Jacobi_polynomials}[Jacobi polynomial] normalised by
    $P_n^{(\alpha,\beta)}(1)=\binom{n+\alpha}{n}$, as in the Jacobi-polynomial
    table. It is orthogonal for the weight
    $(1-t)^\alpha(1+t)^\beta$ on $[-1,1]$.
  comment-normalisation: >-
    The normalising constant of the Jacobi weight is
    $2^{\alpha+\beta+1}B(\alpha+1,\beta+1)$. Dividing by it makes
    $q_1^{(\alpha,\beta)}=(\alpha+\beta+2)/2$ and keeps every stored entry in
    $\mathbb{Q}[x]$. The unnormalised weight would multiply each entry by the
    normalising constant, which is not rational for most rational
    $\alpha,\beta$.
  comment-grid: >-
    The stored grid follows the rational entries of the Jacobi-polynomial
    table: $\alpha,\beta\in\{-\frac12,0,\frac12,1,\frac32,2\}$ with
    $\alpha<\beta$, and $0\leq n\leq10$. The symbolic $a,b$ rows of that table
    are not repeated, because after probability normalisation the coefficients
    of $q_n^{(a,b)}$ are rational functions of $a$ and $b$, not polynomials
    over $\mathbb{Q}$.
  comment-legendre: >-
    The Legendre case $\alpha=\beta=0$ is not stored here. The
    HREF{Secondary_polynomials_of_the_Legendre_polynomials}[Legendre
    secondary-polynomial table] uses the density $1$ on $[-1,1]$, whose total
    mass is $2$, so it holds twice the probability-normalised values.
  comment-quadrature: >-
    At the roots $x_1<\cdots<x_n$ of $P_n^{(\alpha,\beta)}$,
    $q_n^{(\alpha,\beta)}(x_k)/(P_n^{(\alpha,\beta)})'(x_k)$ is the weight of
    the probability-normalised $n$-point Gauss-Jacobi quadrature rule. A
    general Gauss-Jacobi quadrature table is not in this corpus.
  comment-names: >-
    These are also the numerator polynomials, or associated polynomials of
    order one, of the Jacobi family. They are not the associated Jacobi
    polynomials obtained by changing $\alpha$ and $\beta$.
Formulas:
  formula-definition: >-
    $q_n^{(\alpha,\beta)}(x)=\int_{-1}^{1}\dfrac{P_n^{(\alpha,\beta)}(t)-P_n^{(\alpha,\beta)}(x)}{t-x}\rho_{\alpha,\beta}(t)\,\mathrm{d}t$,
    where $\rho_{\alpha,\beta}(t)=\dfrac{(1-t)^\alpha(1+t)^\beta}{2^{\alpha+\beta+1}B(\alpha+1,\beta+1)}$.
  formula-moments: >-
    If $P_n^{(\alpha,\beta)}(x)=\sum_{j=0}^n c_jx^j$, then
    $q_n^{(\alpha,\beta)}(x)=\sum_{j=1}^n c_j\sum_{i=0}^{j-1}m_i x^{j-1-i}$,
    where
    $m_i=\sum_{k=0}^{i}\binom{i}{k}2^k(-1)^{i-k}\dfrac{(\beta+1)_k}{(\alpha+\beta+2)_k}$
    is the $i$-th moment of the probability density $\rho_{\alpha,\beta}$.
  formula-recurrence: >-
    $q_0^{(\alpha,\beta)}=0$, $q_1^{(\alpha,\beta)}=(\alpha+\beta+2)/2$, and
    for $n\geq2$ the $q_n^{(\alpha,\beta)}$ satisfy the same three-term
    recurrence as the Jacobi polynomials:
    $2n(n+\alpha+\beta)(2n+\alpha+\beta-2)q_n=(2n+\alpha+\beta-1)((2n+\alpha+\beta)(2n+\alpha+\beta-2)x+\alpha^2-\beta^2)q_{n-1}-2(n+\alpha-1)(n+\beta-1)(2n+\alpha+\beta)q_{n-2}$.
  formula-quadrature: >-
    If $x_k$ is a root of $P_n^{(\alpha,\beta)}$, then
    $w_k=\dfrac{q_n^{(\alpha,\beta)}(x_k)}{(P_n^{(\alpha,\beta)})'(x_k)}$ and
    $\sum_{k=1}^n w_k=1$ for the probability-normalised Gauss-Jacobi rule.
  formula-pade: >-
    $q_n^{(\alpha,\beta)}(z)/P_n^{(\alpha,\beta)}(z)$ is the $[n-1/n]$ Pade
    approximant at $z=\infty$ to
    $\int_{-1}^{1}(z-t)^{-1}\rho_{\alpha,\beta}(t)\,\mathrm{d}t$, the
    Stieltjes transform of the probability density CITE{DLMF}.

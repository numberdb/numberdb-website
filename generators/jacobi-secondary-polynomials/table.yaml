Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds the rational Jacobi-polynomial grid of T106 with
    $\alpha<\beta$, $\alpha,\beta\in\{-\frac12,0,\frac12,1,\frac32,2\}$ and
    $n\leq10$
  rigour details: >-
    Every value is exact, a polynomial with rational coefficients, so there is
    no precision to choose. The generator computes $P_n^{(\alpha,\beta)}$ from
    its binomial formula and evaluates the defining integral from the exact
    moments of the probability density. Before the entries are written, they
    are checked against the same three-term recurrence as the Jacobi
    polynomials, against an independent plain Python fractions computation,
    against direct rational quadrature for a control case, and against the
    probability-normalised Legendre relation to T133.
Display properties:
  number-header: $q_n^{(\alpha,\beta)}(x)$

# The table document for T327, Condition numbers of the classical test
# matrices. Created as a draft through the API (X-Draft: yes) and filled by
# generate.py beside it; publishing is a person's act on the site.
Title: Condition numbers of the classical test matrices
Definition: >-
  For a named classical test matrix $A_n$, this table gives the finite
  2-norm condition number $\kappa_2(A_n)=\sigma_{\max}(A_n)/\sigma_{\min}(A_n)$
  CITE{WikiCondition}, where the singular values are taken in the Euclidean
  norm and $n$ is the order of the matrix.
Keywords:
  - condition number
  - matrix condition number
  - test matrix
  - classical test matrix
  - MATLAB gallery
  - Hilbert matrix
  - Lehmer matrix
  - Pascal matrix

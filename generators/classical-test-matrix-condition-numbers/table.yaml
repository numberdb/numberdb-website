Parameters:
  family:
    type: Symbolic
    title: matrix family
    display: $A_n$
    constraints: one of the named matrix families listed in the comments
    values:
      hilbert: Hilbert matrix
      lehmer: Lehmer matrix
      pascal: symmetric Pascal matrix
      redheffer: Redheffer matrix
      vandermonde: Vandermonde matrix
      cauchy: Cauchy matrix
      fiedler: Fiedler matrix
      kms: Kac-Murdock-Szego matrix
      minij: Minij matrix
      grcar: Grcar matrix
      frank: Frank matrix
      wilkinson: Wilkinson matrix
      clement: Clement matrix
      moler: Moler matrix
      parter: Parter matrix
      ris: Ris matrix
      lotkin: Lotkin matrix
      riemann: Riemann matrix
      second-difference: second-difference matrix
  n:
    type: Z
    title: order
    display: $n$
    constraints: $n\geq 1$
Comments:
  comment-families: >-
    Indices are $1$-based. The matrices are $A_{ij}=1/(i+j-1)$ for the
    Hilbert matrix CITE{WikiHilbert}; $A_{ij}=\min(i,j)/\max(i,j)$ for the
    Lehmer matrix CITE{WikiLehmer}; $A_{ij}=\binom{i+j-2}{i-1}$ for the
    symmetric Pascal matrix CITE{WikiPascal}; $A_{ij}=1$ if $i\mid j$ or
    $j=1$, and $0$ otherwise, for the Redheffer matrix CITE{WikiRedheffer};
    and $A_{ij}=i^{j-1}$ for the Vandermonde matrix CITE{WikiVandermonde}.
    The Cauchy matrix is $A_{ij}=1/(i+j)$, the default scalar case of
    `gallery("cauchy",n)` CITE{MathWorksGallery}. The Fiedler matrix is
    $A_{ij}=|i-j|$. The Kac-Murdock-Szego matrix is $A_{ij}=2^{-|i-j|}$.
    The Minij matrix is $A_{ij}=\min(i,j)$. The Grcar matrix has $-1$ on
    the subdiagonal and $1$ on the diagonal and on the first three
    superdiagonals CITE{MathWorksGallery} CITE{TMTGallery}.
  comment-toolbox-families: >-
    The Frank, Clement, Moler, Parter, Ris, Lotkin and Riemann matrices use
    the definitions in the Test Matrix Toolbox source CITE{TMTGallery}. The
    Frank matrix is the unreflected upper Hessenberg form
    $A_{ij}=n-\max(i,j)+1$ for $j\geq i-1$, and $0$ otherwise. The Wilkinson
    matrix is symmetric tridiagonal with off-diagonal entries $1$ and
    diagonal entries $|(n-1)/2-(i-1)|$. The Clement matrix is the default
    nonsymmetric tridiagonal matrix, with zero diagonal,
    $A_{i,i-1}=n-i+1$ and $A_{i,i+1}=i$. The Moler matrix has $A_{ii}=i$
    and $A_{ij}=\min(i,j)-2$ for $i\neq j$. The Parter matrix is
    $A_{ij}=1/(i-j+1/2)$. The Ris matrix, also called the Dingdong matrix, is
    $A_{ij}=(1/2)/(n-i-j+3/2)$. The Lotkin matrix is the Hilbert matrix with
    first row replaced by ones. The Riemann matrix is $B(2:n+1,2:n+1)$ with
    $B_{ij}=i-1$ if $i\mid j$ and $-1$ otherwise.
  comment-finite: >-
    Only finite condition numbers are entries. If a default matrix is
    singular, $\sigma_{\min}(A_n)=0$ and $\kappa_2(A_n)$ is not a real number
    stored by this table. This excludes the singular default Chow matrices
    for $n>1$ and singular orders of any other family.
  comment-source: >-
    The MathWorks `gallery` documentation CITE{MathWorksGallery} states the
    default parameter choices used here for the gallery families. The Test
    Matrix Toolbox source CITE{TMTGallery} is used where the entry-wise
    formula is not stated in the MathWorks page.
Formulas:
  formula-second-difference: >-
    For the second-difference matrix, whose eigenvalues are
    $2-2\cos(k\pi/(n+1))$, $k=1,\ldots,n$, the condition number is
    $\kappa_2=\dfrac{2+2\cos(\pi/(n+1))}{2-2\cos(\pi/(n+1))}$. The cosine
    values in this expression are in
    HREF{Cos_pi_times_x_at_rational_numbers}[$\cos(\pi x)$ for rational $x$].
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.matrix.constructor import matrix
      from sage.rings.rational_field import QQ

      A = matrix(QQ, 3, 3, lambda i, j: QQ(1) / QQ(i + j + 1))
      B = A.transpose() * A
      B.eigenvalues()
Similar tables:
  - table: HREF{Cos_pi_times_x_at_rational_numbers}[$\cos(\pi x)$ for rational $x$]
    relation: the second-difference condition numbers are rational functions of the cosine values at $x=1/(n+1)$

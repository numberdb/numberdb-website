Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds finite condition numbers for the listed default matrix families
    with $2\leq n\leq20$; the default Chow matrix is omitted because it is
    singular for $n>1$, and singular Clement and Redheffer orders are omitted
  rigour details: >-
    The generator builds each matrix over $\mathbb{Q}$, computes the
    eigenvalues of $A_n^{\mathsf T}A_n$ in Sage's algebraic real field, and
    returns the square root of the ratio of the largest positive eigenvalue
    to the smallest positive eigenvalue as a real ball with 96 guard bits
    beyond the 100 digits written. When the algebraic value is proved to be
    a rational integer after a cheap numerical filter, that exact integer is
    returned instead. Singular matrices are detected by exact determinant
    computation and omitted, because their 2-norm condition numbers are
    infinite rather than finite real numbers. Before the entries were written,
    `agents/table-build/dry_run.py` computed all 351 entries; the Frank
    determinants were checked to be $1$; the Redheffer determinants were
    checked against the Mertens function; the Clement characteristic
    polynomials were checked against the eigenvalues
    $\pm(n-1),\pm(n-3),\ldots$; the second-difference values were checked
    against CITE{formula-second-difference}; and every nonsingular entry with
    $n\leq6$ was compared with NumPy's independent singular-value
    decomposition.
Display properties:
  number-header: $\kappa_2(A_n)$

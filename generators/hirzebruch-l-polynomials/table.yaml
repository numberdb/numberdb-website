# the API with X-Draft: yes and is filled by generate.py beside it. Publishing
# is a person's act on the site.
Title: Hirzebruch $L$-polynomials $L_n(p_1,\dots,p_n)$
Definition: >-
  The entry is the homogeneous component $L_n(p_1,\dots,p_n)$ of the
  Hirzebruch $L$-class of an oriented real vector bundle, written as a
  polynomial in the Pontryagin classes $p_i$ CITE{LGenusWiki}. It is defined
  by the characteristic power series $Q(x)=\sqrt{x}/\tanh\sqrt{x}$ through
  Formula CITE{formula-component}.
Parameters:
  n:
    type: Z
    title: degree
    display: $n$
    constraints: $n\geq 1$
Comments:
  comment-component: >-
    The table stores one homogeneous component per row, not the total
    $L$-class $1+L_1+L_2+\cdots$ truncated at degree $n$.
  comment-zero: >-
    The constant component is $L_0=1$ and is stated in Formula
    CITE{formula-zero}, rather than stored as a row.
  comment-variables: >-
    The variables are Pontryagin classes. The convention here is
    $p_i=(-1)^i c_{2i}(E\otimes\mathbb C)$ CITE{PontryaginWiki}.
  comment-range: >-
    The component $L_n$ uses exactly the variables $p_1,\dots,p_n$; the first
    omitted component, $L_7$, has a nonzero $p_7$ coefficient.
Formulas:
  formula-component: >-
    $1+\sum_{n\geq1}L_n(p_1,p_2,\dots)=\prod_i Q(x_i)$, where the $x_i$ are
    the Pontryagin roots and $p_j=e_j(x_1,x_2,\dots)$.
  formula-series: >-
    $Q(x)=\frac{\sqrt{x}}{\tanh\sqrt{x}}=1+\frac{x}{3}-\frac{x^2}{45}
    +\frac{2x^3}{945}-\frac{x^4}{4725}+\cdots$ CITE{GenusWiki}.
    Equivalently $Q(x)=\sum_{k\geq0}2^{2k}B_{2k}x^k/(2k)!$, using
    HREF{Bernoulli_numbers}[the Bernoulli numbers].
  formula-zero: >-
    $L_0=1$.
  formula-first: >-
    $L_1=p_1/3$, $L_2=(7p_2-p_1^2)/45$, and
    $L_3=(62p_3-13p_1p_2+2p_1^3)/945$.

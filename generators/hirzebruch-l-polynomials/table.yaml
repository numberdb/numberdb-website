Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every component with $1\leq n\leq 6$; $L_7$ is the first
    component needing more than six variables, which is the most a stored
    polynomial may have
  rigour details: >-
    The generator computes exact rational coefficients in
    $\mathbb Q[p_1,\dots,p_6]$ from Formula CITE{formula-component}. It is
    checked against Formula CITE{formula-first}, against the Pontryagin-root
    definition in Formula CITE{formula-component}, and by substituting the
    Pontryagin classes of $T\mathbb P^{2m}_{\mathbb C}$ for $1\leq m\leq6$,
    which gives signature $1$ for each even-dimensional complex projective
    space CITE{LGenusWiki}.

Data properties:
  type: Z
  rigour: exact
  sources:
    - CITE{CohnTable}
    - CITE{Wiki}
  complete: 'no'
  complete-note: >-
    every dimension $n\leq 24$ is here, the exact value in the six dimensions
    where $\tau_n$ is known and otherwise the interval between the largest
    arrangement known and the smallest upper bound proven, as of 6 September
    2026
  rigour details: >-
    Every entry is a fact from the literature, cited in its comment: a
    theorem for the six exact values, and for each interval a construction
    for the lower endpoint and a proof for the upper. The endpoints were
    taken from Henry Cohn's table of kissing number bounds and from the
    table in the Wikipedia article, which agreed in every dimension listed
    on 6 September 2026, and were compared with the abstracts of the papers
    cited. Before an entry is returned, the generator recomputes the exact
    value or the lower endpoint for $n\leq 8$ as the number of minimal
    vectors of the lattice attaining it, from the identity matrix or the
    Cartan matrix with PARI's qfminim, and a disagreement is an error rather
    than an entry; outside the generator the same was done for
    $\Lambda_{16}$, $\Lambda_{22}$, $\Lambda_{23}$ and the Leech lattice
    from the Gram matrices of the table of the classical lattices, and the
    kissing numbers of the laminated lattices quoted in the comments were
    compared with OEIS A002336. No upper bound was recomputed: each is the
    optimal value of a semidefinite program reported in the paper cited. An
    interval remains true when either bound is improved.
Display properties:
  number-header: $\tau_n$

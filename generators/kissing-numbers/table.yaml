# The table document for the kissing numbers, proposal 5 of
# agents/table-ideas/BATCH-2026-09-03T1730.md. Created as a draft through the
# API (X-Draft: yes) and filled by generate.py beside it; publishing is a
# person's act on the site.
Title: Kissing numbers $\tau_n$
Definition: >-
  The kissing number $\tau_n$ CITE{Wiki} is the largest number of
  non-overlapping unit balls in $\mathbb{R}^n$ that can touch one unit ball;
  equivalently, the largest number of points on the unit sphere $S^{n-1}$
  any two of which are at angular distance at least $60^{\circ}$.
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: $n\geq 1$
Comments:
  comment-conventions: >-
    $\tau_n$ is also called the Newton number or the contact number of
    $\mathbb{R}^n$ CITE{MathWorld}, after the question Newton and Gregory
    disputed in 1694, whether thirteen spheres can touch one. The maximum is
    over all arrangements; the lattice kissing number, the largest number of
    minimal vectors of a lattice in $\mathbb{R}^n$, is OEIS A001116
    CITE{OEISlattice} and is known for $n\leq 9$ and $n=24$. Dimension $9$
    is the smallest in which $\tau_n$ is known to exceed the lattice kissing
    number: there the lattice kissing number is $272$, that of $\Lambda_9$,
    and the largest arrangement known has $306$ spheres. In dimensions $16$,
    $22$, $23$ and $24$, as in dimensions $5$, $6$ and $7$, the largest
    arrangement known consists of the minimal vectors of a lattice; in
    dimensions $10$ to $15$ and $17$ to $21$ it is not a lattice arrangement,
    and has more spheres than any lattice known there has minimal vectors. The
    kissing number of each classical lattice is in the entry comments of
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[the
    table of packing densities and Hermite numbers of the classical lattices],
    and those of the laminated lattices $\Lambda_n$ are OEIS A002336
    CITE{OEISlaminated}.
  comment-known: >-
    $\tau_n$ is OEIS A257479 CITE{OEIS}; it is known for $n=1$, $2$, $3$,
    $4$, $8$ and $24$, and in no other dimension CITE{CohnTable}. The values for $n=1$ and $2$ are elementary;
    $\tau_3=12$ is the theorem of Schütte and van der Waerden CITE{SvdW};
    $\tau_4=24$ is Musin's CITE{Musin}; $\tau_8=240$ and $\tau_{24}=196560$
    were proved independently by Odlyzko and Sloane CITE{OS} and by
    Levenshtein CITE{Levenshtein} with Delsarte's linear programming bound,
    which gives exactly $240$ and $196560$ in those two dimensions. The arrangements
    attaining $\tau_4$, $\tau_8$ and $\tau_{24}$ are unique up to isometry,
    the minimal vectors of $D_4$ CITE{dLLdMK}, of $E_8$ and of the Leech
    lattice CITE{BannaiSloane}; the twelve spheres in dimension $3$ can be
    arranged in infinitely many ways.
  comment-intervals: >-
    Where $\tau_n$ is not known the entry is the interval $[a,b]$ in which it
    lies: $a$ is the number of spheres in the largest arrangement known and
    $b$ the smallest upper bound proven, as of 6 September 2026, both taken
    from Henry Cohn's table of kissing number bounds CITE{CohnTable}, which
    also lists dimensions $25$ to $48$ and $72$, and from the table in the
    Wikipedia article CITE{Wiki}; the two agreed in every dimension on that
    date. In dimensions $5$, $6$, $7$, $16$, $22$ and
    $23$ the lower endpoint is the kissing number of a lattice, $D_5$, $E_6$,
    $E_7$, $\Lambda_{16}$, $\Lambda_{22}$ and $\Lambda_{23}$; in every other
    dimension the largest arrangement known has more spheres than any
    lattice known there has minimal vectors. Every upper bound with
    $n\geq 5$ is a semidefinite programming bound in the line of Bachoc and
    Vallentin CITE{BV}, computed by Mittelmann and Vallentin CITE{MV},
    Machado and de Oliveira Filho CITE{MO}, de Laat and Leijenhorst CITE{dLL}
    and de Laat, Leijenhorst and de Muinck Keizer CITE{dLLdMK}.
Formulas:
  formula-lattice: >-
    $\tau_n\geq\tau(L)$ for every lattice $L\subset\mathbb{R}^n$, where
    $\tau(L)$ is the number of minimal vectors of $L$, with equality for
    $L=\mathbb{Z}$, $A_2$, $A_3$, $D_4$, $E_8$ and the Leech lattice
    $\Lambda_{24}$ in dimensions $1$, $2$, $3$, $4$, $8$ and $24$.
  formula-asymptotic: >-
    $2^{0.2075\,n\,(1+o(1))}\leq\tau_n\leq 2^{0.401\,n\,(1+o(1))}$, the lower
    bound by Chabauty, Shannon and Wyner and the upper by Kabatiansky and
    Levenshtein CITE{SPLAG}; more precisely
    $\tau_n\geq c\,n^{3/2}\,(2/\sqrt{3})^{n}$ for a constant $c>0$
    CITE{JJP}, and $\log_2(2/\sqrt{3})=0.2075\ldots$.
Programs:
  program-sage:
    language: Sage
    code: |-
      G = CartanMatrix(['E', 8])
      pari(G).qfminim()[0]      # 240, the number of minimal vectors of E_8, which is tau_8
Similar tables:
  - table: HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[Packing densities and Hermite numbers of the classical lattices]
    relation: the kissing number of each lattice, a lower bound for $\tau_n$, is in its entry comments
  - table: HREF{Hermite's_constants}[Hermite's constants $\gamma_n$]
    relation: known in dimensions $1$ to $8$ and $24$; in the six dimensions where $\tau_n$ is known, the same lattice attains both
  - table: HREF{Q-expansion_of_the_Eisenstein_series_E4}[$q$-expansion of the Eisenstein series $E_4$]
    relation: $E_4$ is the theta series of $E_8$, so its coefficient of $q$ is $\tau_8=240$
  - table: HREF{Diagonal_Ramsey_numbers}[Diagonal Ramsey numbers]
    relation: the same convention, an interval of integers where the value is not known

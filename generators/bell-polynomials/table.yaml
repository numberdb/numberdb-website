# The table document for numberdb-data#114, to be created on the site.
#
# The multivariate family. The Bell polynomials in one variable are the
# Touchard polynomials, which are their own table.
Title: Partial Bell polynomials $B_{n,k}$
Definition: >-
  For integers $1 \leq k \leq n$ the partial (or incomplete) Bell polynomial
  $B_{n,k}(x_1, \dots, x_{n-k+1})$ is the polynomial whose coefficient of
  $x_1^{j_1} x_2^{j_2}\cdots$ is the number of ways to partition a set of $n$
  labelled elements into $k$ blocks, exactly $j_i$ of them of size $i$.
Parameters:
  n:
    type: Z
    constraints: $1 \leq n \leq 7$
    display: $n$
  k:
    type: Z
    constraints: $1 \leq k \leq n$
    display: $k$
Data properties:
  type: Z[]
  complete: no
  rigour: exact
Formulas:
  formula-sum: >-
    $B_{n,k}(x_1, \dots, x_{n-k+1}) = \sum \frac{n!}{j_1!\,j_2!\cdots}
    \left(\frac{x_1}{1!}\right)^{j_1}
    \left(\frac{x_2}{2!}\right)^{j_2}\cdots$, the sum taken over all
    sequences $j_1, j_2, \dots$ of non-negative integers with
    $j_1 + j_2 + \cdots = k$ and $j_1 + 2j_2 + 3j_3 + \cdots = n$.
  formula-stirling: >-
    Setting every $x_i = 1$ gives the Stirling number of the second kind:
    $B_{n,k}(1, 1, \dots) = S(n,k)$, and summing over $k$ gives the Bell
    number $B_n$.
  formula-lah: >-
    Setting $x_i = i!$ gives the Lah number CITE{WikiLah}:
    $B_{n,k}(1!, 2!, \dots) = \binom{n-1}{k-1}\frac{n!}{k!}$.
  formula-edges: >-
    $B_{n,1}(x_1, \dots, x_n) = x_n$ and $B_{n,n}(x_1) = x_1^{n}$.
  formula-weights: >-
    $B_{n,k}$ is homogeneous of degree $k$ in the variables, and every term has
    weight $n$ when $x_i$ is counted with weight $i$.
  formula-faa-di-bruno: >-
    $\frac{d^n}{dx^n} f(g(x)) = \sum_{k=1}^{n} f^{(k)}(g(x))\,
    B_{n,k}\!\left(g'(x), g''(x), \dots, g^{(n-k+1)}(x)\right)$, which is Faa
    di Bruno's formula CITE{WikiFaaDiBruno} and the reason these polynomials
    are usually met.
  formula-complete: >-
    The complete Bell polynomial is $B_n = \sum_{k=1}^{n} B_{n,k}$.
Comments:
  comment-one-variable: >-
    The Bell polynomials in a single variable are a different family: they are
    the Touchard polynomials HREF{Touchard_polynomials}, and $T_n(x) =
    \sum_{k} S(n,k) x^k$ rather than a polynomial in $x_1, x_2, \dots$.
  comment-range: >-
    The table stops at $n = 7$ because of the variables rather than the size.
    Search matches polynomials that differ only in the names of their
    variables, which needs a key invariant under renaming, and that key is
    found by trying permutations; polynomials in more than six variables are
    refused rather than searched factorially. $B_{n,k}$ involves $x_1$ up to
    $x_{n-k+1}$, so the first entry over the limit is $B_{8,2}$ with seven.
    Stopping here keeps every entry of every row.
  comment-variables: >-
    The variables are written $x_1, x_2, \dots$, indexed from one as the
    notation has them, rather than from zero as some computer algebra does.
    An entry in $B_{n,k}$ involves $x_1$ up to $x_{n-k+1}$, so the number of
    variables grows as $k$ falls; $B_{n,1}$ is the single term $x_n$ and
    $B_{n,n}$ is $x_1^n$.

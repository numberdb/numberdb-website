Title: Values of the elliptic alpha function $\alpha(r)$
Definition: >-
  For a positive integer $r$, set $\tau=i\sqrt r$, $q=e^{-\pi\sqrt r}$, and
  $m_r=\lambda(\tau)$, where $\lambda$ is the elliptic modular function. The
  entry is Ramanujan's elliptic alpha function
  $\alpha(r)=\pi/(4K(m_r)^2)+\sqrt r-\sqrt r\,E(m_r)/K(m_r)$, where $K(m)$
  and $E(m)$ are the complete elliptic integrals in the parameter convention
  $m=k^2$ CITE{MathWorldAlpha} CITE{DLMFEllipticIntegrals}.
Parameters:
  r:
    type: Z
    title: index, with $\tau=i\sqrt r$
    display: $r$
    constraints: positive integer
Comments:
  comment-convention: >-
    MathWorld writes the same value as
    $\pi/(4K(k_r)^2)+\sqrt r-\sqrt r\,E(k_r)/K(k_r)$, with
    $k_r^2=m_r$. The table uses $K(m)$ and $E(m)$ because arb's
    `elliptic_k` and `elliptic_e` take the parameter $m$.
  comment-cm-point: >-
    The lattice $\mathbb Z+\mathbb Z\,i\sqrt r$ has complex multiplication by
    the order $\mathbb Z[\sqrt{-r}]$, of discriminant $-4r$.
Formulas:
  formula-theta: >-
    $\alpha(r)=\bigl(\pi^{-1}-4\sqrt r\,q\,\theta_4'(q)/\theta_4(q)\bigr)/
    \theta_3(q)^4$, where $q=e^{-\pi\sqrt r}$ and the derivative is with
    respect to $q$ CITE{MathWorldAlpha}.
  formula-order-two: >-
    $\alpha(4r)=(1+k_{4r})^2\alpha(r)-2\sqrt r\,k_{4r}$, where
    $k_s=\sqrt{\lambda(i\sqrt s)}$ CITE{MathWorldAlpha}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField

      r = 2
      CBF = ComplexBallField(numberdb.bits(100, losing=256))
      tau = CBF.gen(0) * CBF(r).sqrt()
      m = tau.modular_lambda().real()
      K = CBF(m).elliptic_k().real()
      E = CBF(m).elliptic_e().real()
      CBF.pi().real() / (4 * K * K) + CBF(r).sqrt().real() * (1 - E / K)

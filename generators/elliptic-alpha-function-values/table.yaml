Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $\alpha(r)$ for every integer $1\leq r\leq100$, matching the
    range of HREF{T295}[the singular moduli $k_r$] and HREF{T296}[$K(k_r)$];
    over this range the order $\mathbb Z[\sqrt{-r}]$ has class number at most
    $12$
  rigour details: >-
    Each value is computed in Sage's arb-backed `ComplexBallField` at
    `numberdb.bits(digits, losing=256)` bits. The generator evaluates
    $m_r=\lambda(i\sqrt r)$ as a complex ball, checks that the imaginary part
    contains zero, and evaluates arb's `elliptic_k` and `elliptic_e` at
    $m_r$. The row $r=1$ is returned exactly as $1/2$. The run checks
    CITE{formula-theta} on every computed row, CITE{formula-order-two} for
    every row where $4r\leq100$, and the closed forms from
    CITE{MathWorldAlpha} for $1\leq r\leq10$.
Display properties:
  number-header: $\alpha(r)$

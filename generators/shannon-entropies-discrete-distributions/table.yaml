Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      R = RealBallField(numberdb.bits(100, losing=96))
      p = R(QQ(1) / QQ(3))
      # Entropy in nats of Bernoulli(1/3).
      -p * p.log() - (1 - p) * (1 - p).log()
Data properties:
  type: R
  rigour: proven
  complete: no
  complete-note: >-
    it holds Bernoulli$(p)$ for reduced $p\leq1/2$ with denominator at most
    $12$, together with $p=0.01,\ldots,0.11$; binomial
    $\operatorname{Binom}(n,p)$ for $2\leq n\leq20$ and
    $p\in\{1/2,1/3,1/4,1/10\}$; geometric and logarithmic series rows for
    $p\in\{1/2,1/3,1/4,1/5,1/10,11/100\}$; negative binomial rows for
    $2\leq r\leq10$ and $p\in\{1/2,1/3,1/4,1/10\}$; Poisson$(\lambda)$ for
    $\lambda=1/2,1,3/2,\ldots,10,11,\ldots,20$; uniform rows for
    $2\leq n\leq30$; hypergeometric rows with $(N,K,n)$ in
    $\{10\}\times\{2,5\}\times\{2,5,8\}$ and
    $\{20\}\times\{2,5,10\}\times\{2,5,10\}$; Zipfian rows with
    $s\in\{1,2,3\}$ and
    $N\in\{10,100\}$; and Benford's leading-digit law, each in nats and in
    bits except where the bit value is an exact rational number
  rigour details: >-
    Each entry was computed in Sage real ball arithmetic at
    `numberdb.bits(digits, losing=128)`. Finite distributions used exact
    probabilities. The geometric and uniform rows used the closed forms in
    Formulas. Infinite logarithmic series, negative binomial and Poisson rows
    were summed with explicit positive tail bounds and the bound was added to
    the returned ball. All 469 entries were compared with SciPy 1.17.1
    `stats` entropy methods before the draft was filled; the largest
    difference was $3.32\cdot10^{-10}$ bits, on the negative binomial row
    with $r=9$ and $p=1/10$.
Display properties:
  number-header: $H(X)$

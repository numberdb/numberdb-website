# The table document for Shannon entropies of discrete probability
# distributions. It began as proposal 1 of
# agents/table-ideas/BATCH-2026-09-18T2152.md, answering numberdb-data#55.
# Created as draft T339 through the API, filled by generate.py beside it, and
# offered for review. Publishing is a person's act.
Title: Shannon entropies of discrete probability distributions
Definition: >-
  For a discrete random variable $X$ with probability mass function $p$, the
  Shannon entropy CITE{WikiShannonEntropy} is
  $H(X)=-\sum_x p(x)\log p(x)$. This table gives $H(X)$ for named discrete
  distributions in SciPy standard forms; nats use natural logarithms, and bits
  divide by $\log 2$.
Tags:
  - probability theory
  - special values
Keywords:
  - information theory
  - Shannon entropy
  - discrete entropy
  - distribution entropy
  - binary entropy function
  - Bernoulli entropy
  - binomial entropy
  - geometric entropy
  - negative binomial entropy
  - Poisson entropy
  - hypergeometric entropy
  - logarithmic series entropy
  - Zipf entropy
  - Benford entropy
Parameters:
  distribution:
    type: Symbolic
    title: distribution family, in standard form
    display: distribution
    values:
      bernoulli: Bernoulli$(p)$ on $\{0,1\}$
      binomial: binomial $\operatorname{Binom}(n,p)$
      geometric: geometric with success probability $p$ on $\{1,2,\ldots\}$
      negative-binomial: negative binomial counting failures before $r$ successes
      poisson: Poisson$(\lambda)$
      discrete-uniform: uniform on $\{1,\ldots,n\}$
      hypergeometric: hypergeometric with population $N$, successes $K$, and draws $n$
      logarithmic: logarithmic series with parameter $p$ on $\{1,2,\ldots\}$
      zipf: Zipfian on $\{1,\ldots,N\}$ with exponent $s$
      benford: Benford leading-digit distribution on $\{1,\ldots,9\}$
  shape:
    type: Symbolic
    title: shape parameter or tuple of shape parameters
    display: shape
    constraints: >-
      the value is `-` for a distribution with no shape parameter; otherwise
      it is the displayed integer, rational, half-integer or comma-separated
      tuple named by the distribution
  unit:
    type: Symbolic
    title: logarithmic unit
    display: unit
    values:
      nats: nats
      bits: bits
Comments:
  standard-forms: >-
    The support and parameter order are those used by SciPy CITE{SciPyStats}.
    In particular, the geometric and logarithmic series distributions are
    supported on positive integers, and the negative binomial row counts
    failures before the $r$th success.
  omitted-rational-bits: >-
    Rows whose bit value is an exact rational number are omitted: the
    Bernoulli$(1/2)$ row in bits, the geometric$(1/2)$ row in bits, and the
    bits rows for $\operatorname{Binom}(2,1/2)$ and for uniform distributions
    on $2^m$ points.
  bernoulli: >-
    The Bernoulli rows are the binary entropy function $H_2(p)$.
Formulas:
  formula-units: >-
    $H_{\mathrm{bits}}(X)=H_{\mathrm{nats}}(X)/\log 2$.
  formula-bernoulli-symmetry: >-
    $H(\operatorname{Bernoulli}(p))=H(\operatorname{Bernoulli}(1-p))$.
  formula-binomial-symmetry: >-
    $H(\operatorname{Binom}(n,p))=H(\operatorname{Binom}(n,1-p))$.
  formula-uniform: >-
    The uniform distribution on $n$ points has entropy $\log n$ nats.
  formula-geometric: >-
    For the geometric distribution on positive integers,
    $H=-\log p-\frac{1-p}{p}\log(1-p)$ nats.
  formula-benford: >-
    Benford's law has probabilities
    $p_d=\log_{10}(1+1/d)$ for $1\leq d\leq9$.
Similar tables:
  - table: HREF{Differential_entropies_of_continuous_probability_distributions}[Differential entropies of continuous probability distributions]
    relation: the same entropy functional for absolutely continuous distributions
  - table: HREF{Entropy_constants_of_lattice_models}[Entropy constants of lattice models]
    relation: entropy per site in lattice models is a limiting entropy rather than the entropy of one named distribution

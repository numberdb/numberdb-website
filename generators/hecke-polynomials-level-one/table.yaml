Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every even weight $12\leq k\leq94$ with
    $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$, for $p=2,3,5,7$
  rigour details: >-
    The generator computes $E_4$ and $E_6$ from their divisor-sum
    $q$-expansions, forms $\Delta=(E_4^3-E_6^2)/1728$, builds the basis
    $\Delta E_4^aE_6^b$ in CITE{formula-level-one-basis}, and applies
    CITE{formula-q-action} coefficient by coefficient. It expresses the
    result in that exact basis over $\mathbb{Q}$ and takes
    $\det(xI-T_p)$ by a permutation expansion, requiring every coefficient
    to be an integer before it returns the polynomial. Every row is required
    to equal PARI/GP's `charpoly(mfheckemat(mfinit([1,k],0),p))`
    CITE{PARIHecke}. The weight $12$ rows were compared with the stored
    Ramanujan tau values in the table of the modular discriminant. Before the
    draft was created, the range
    $k\leq94$, $p\in\{2,3,5,7\}$ measured 164 entries, longest 1151
    characters at $(94,7)$ and a 60.8 KB entries block; adding weight $96$
    raised the longest entry to 1503 characters.
Display properties:
  number-header: $\chi_{k,p}(x)$
  group parameters: [['k'], ['p']]

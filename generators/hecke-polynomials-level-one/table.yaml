Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every even weight $12\leq k\leq94$ with
    $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$, for $p=2,3,5,7$
  rigour details: >-
    The generator computes
    HREF{Q-expansion_of_the_Eisenstein_series_E4}[$E_4$] and
    HREF{Q-expansion_of_the_Eisenstein_series_E6}[$E_6$] from their
    divisor-sum $q$-expansions, forms
    HREF{Q-expansion_of_the_modular_discriminant}[$\Delta$] as
    $(E_4^3-E_6^2)/1728$, builds the basis $\Delta E_4^aE_6^b$ described in
    CITE{formula-level-one-basis} and applies the Hecke action from
    CITE{formula-q-action} coefficient by coefficient. It expresses the result
    in that exact basis over $\mathbb{Q}$ and takes
    $\det(xI-T_p)$ by a permutation expansion, requiring every coefficient
    to be an integer before it returns the polynomial. Every row is required
    to equal PARI/GP's `charpoly(mfheckemat(mfinit([1,k],0),p))`
    documented by CITE{PARIHecke} in the PARI/GP manual. The weight $12$ rows
    were compared with the stored Ramanujan tau values in the table of the
    modular discriminant.
Display properties:
  number-header: $\chi_{k,p}(x)$
  group parameters: [['k'], ['p']]

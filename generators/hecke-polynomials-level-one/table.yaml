Title: Hecke polynomials of level one cusp forms
Definition: >-
  For an even integer $k$ and a prime $p$, this table gives the characteristic
  polynomial $\chi_{k,p}(x)=\det(xI-T_p\mid S_k(\mathrm{SL}_2(\mathbb{Z})))$
  of the Hecke operator $T_p$ CITE{WikiHecke} acting on the space of cusp
  forms of weight $k$ and level one.
Parameters:
  k:
    type: Z
    title: weight
    display: $k$
    constraints: $k$ is even and $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$
  p:
    type: Z
    title: prime
    display: $p$
    constraints: $p$ is prime
Comments:
  comment-normalisation: >-
    The eigenvalues are the usual Fourier coefficients $a_p$ in the
    $q$-expansion of a normalised eigenform, not the analytically normalised
    values $a_p/p^{(k-1)/2}$. With this convention, the weight $12$ rows are
    $x-\tau(p)$ for Ramanujan's tau function.
  comment-maeda: >-
    The version of Maeda's conjecture stated in CITE{HidaMaeda} and
    summarized in CITE{GhitzaMcAndrew} says that for each $m>1$ the characteristic
    polynomial of $T_m$ on $S_k$ is irreducible over $\mathbb{Q}$ and has
    Galois group $\mathfrak{S}_{\dim S_k}$. For the rows in this table, every
    polynomial is irreducible over $\mathbb{Q}$; the Galois groups were not
    checked.
  comment-zero-space: >-
    Formula CITE{formula-degree} shows that there are no cusp forms of level
    one below weight $12$, and none in weight $14$.
Formulas:
  formula-q-action: >-
    If $f(q)=\sum_{n\geq1}a_nq^n$, then
    $(T_pf)(q)=\sum_{n\geq1}(a_{pn}+p^{k-1}a_{n/p})q^n$, where
    $a_{n/p}=0$ when $p\nmid n$.
  formula-level-one-basis: >-
    Let HREF{Q-expansion_of_the_modular_discriminant}[$\Delta$] be the
    modular discriminant, and let $M_j$ be the space of modular forms of
    weight $j$ for $\mathrm{SL}_2(\mathbb{Z})$. Then
    $S_k(\mathrm{SL}_2(\mathbb{Z}))=\Delta\,M_{k-12}$. The graded ring
    $M_*=\bigoplus_j M_j$ is $\mathbb{C}[E_4,E_6]$, generated by
    HREF{Q-expansion_of_the_Eisenstein_series_E4}[$E_4$] and
    HREF{Q-expansion_of_the_Eisenstein_series_E6}[$E_6$] together. Thus the
    products $\Delta E_4^aE_6^b$ with $4a+6b=k-12$ form a basis of $S_k$.
  formula-tau: >-
    For $k=12$, $\chi_{12,p}(x)=x-\tau(p)$, where $\tau(n)$ is the
    coefficient of $q^n$ in the modular discriminant $\Delta$.
  formula-degree: >-
    $\deg\chi_{k,p}=\dim S_k(\mathrm{SL}_2(\mathbb{Z}))$, and for even
    $k\geq4$ this dimension is $\lfloor k/12\rfloor-1$ if
    $k\equiv2\pmod{12}$ and $\lfloor k/12\rfloor$ otherwise.
Programs:
  program-sage:
    language: Sage
    code: |-
      S = CuspForms(1, 24)
      S.hecke_matrix(2).charpoly('x')       # x^2 - 1080*x - 20468736
  program-pari:
    language: PARI/GP
    code: |-
      mf = mfinit([1, 24], 0);
      charpoly(mfheckemat(mf, 2))           \\ x^2 - 1080*x - 20468736
Similar tables:
  - table: HREF{Q-expansion_of_the_modular_discriminant}[$q$-expansion of the modular discriminant $\Delta$]
    relation: its Ramanujan tau coefficients give the weight $12$ rows by CITE{formula-tau}
  - table: HREF{Q-expansion_of_the_Eisenstein_series_E4}[$q$-expansion of the Eisenstein series $E_4$]
    relation: $E_4$ generates the ring of level-one modular forms with $E_6$, as in CITE{formula-level-one-basis}
  - table: HREF{Q-expansion_of_the_Eisenstein_series_E6}[$q$-expansion of the Eisenstein series $E_6$]
    relation: $E_6$ generates the ring of level-one modular forms with $E_4$, as in CITE{formula-level-one-basis}
  - table: HREF{Spectral_parameters_of_Maass_forms_of_level_1}[Spectral parameter of Maass forms of level 1]
    relation: stores spectral data for non-holomorphic automorphic eigenforms for $\mathrm{SL}_2(\mathbb{Z})$

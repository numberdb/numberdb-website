Programs:
  program-python:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      # The attached generate.py solves for beta_s and converts it to m_s.
Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: yes
  rigour details: >-
    The attached generator computes $\beta_s$ by imposing $f''(0)=0$ and
    solving for the value of $\beta$ for which the finite-interval solution has
    $f'(\eta_{\max})=1$. It requires agreement between independent working
    precisions and truncation lengths, converts $m_s$ from the same computed
    $\beta_s$, and checks the result against a collocation boundary-value solve
    and the printed value $\beta_s=-0.198837735$ in CITE{BeldenEtAl}.
Display properties:
  number-header: separation parameter

# The table document for T330, Characteristic polynomials of the classical
# test matrices. Created as a draft through the API (X-Draft: yes) and filled
# by generate.py beside it; publishing is a person's act on the site.
Title: Characteristic polynomials of the classical test matrices
Definition: >-
  For a named classical test matrix $A_n$, this table gives the characteristic
  polynomial $\chi_{A_n}(x)=\det(xI_n-A_n)$ CITE{WikiCharacteristic}, where
  $n$ is the order of the matrix.

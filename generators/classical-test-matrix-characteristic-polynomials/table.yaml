Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every listed default matrix family with $2\leq n\leq12$, a
    complete rectangle of the nontrivial small orders; extending to $n=13$
    would make the Ris entry 1458 characters
  rigour details: >-
    The generator builds each matrix over $\mathbb{Q}$ and computes
    $\det(xI_n-A_n)$ exactly in $\mathbb{Q}[x]$. During generation it checks
    that every polynomial is monic of degree $n$, that its $x^{n-1}$
    coefficient is $-\operatorname{tr}(A_n)$, and that its constant
    coefficient is $(-1)^n\det(A_n)$. For every listed family with
    $n\leq5$, it also recomputes $\det(xI_n-A_n)$ by the Leibniz formula over
    permutations. It checks the Hilbert and Vandermonde determinants against
    their closed forms, the Redheffer determinant against the Mertens
    function, the Frank determinant against $1$, the Clement polynomial
    against CITE{formula-clement}, and the second-difference polynomial
    against CITE{formula-second-difference}.
Display properties:
  number-header: $\chi_{A_n}(x)$

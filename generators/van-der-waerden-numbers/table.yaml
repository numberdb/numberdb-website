Title: Van der Waerden numbers $w(r; k_1,\dots,k_r)$
Definition: >-
  The Van der Waerden number $w(r; k_1,\dots,k_r)$ is the least positive
  integer $N$ such that every coloring of $\{1,\dots,N\}$ with $r$ colors has,
  for some color $i$, a monochromatic arithmetic progression of length $k_i$
  in color $i$ CITE{Wiki}.
Parameters:
  r:
    type: Z
    title: number of colors
    display: $r$
    constraints: $r \geq 1$
  k:
    type: Symbolic
    title: progression-length tuple
    display: $k_1,\dots,k_r$
    constraints: >-
      a weakly increasing comma-separated tuple of $r$ positive integers.
Comments:
  comment-order: >-
    The tuple is stored weakly increasing. Permuting the colors permutes the
    entries $k_i$ and does not change the value.
  comment-diagonal: >-
    The diagonal notation $W(r,k)$ means $w(r; k,\dots,k)$.
  comment-bounds: >-
    The cited source table also lists one-sided lower bounds for some
    diagonal values. Those rows are omitted here because they do not give an
    integer interval with both endpoints.
Formulas:
  formula-one-color: >-
    $w(1;k)=k$.
  formula-length-two: >-
    $w(r;2,\dots,2)=r+1$.
  formula-symmetry: >-
    For any permutation $\sigma$ of $\{1,\dots,r\}$,
    $w(r;k_{\sigma(1)},\dots,k_{\sigma(r)})=w(r;k_1,\dots,k_r)$.

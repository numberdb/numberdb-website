Title: Laplacian polynomials of connected graphs
Definition: >-
  The Laplacian polynomial $\lambda(G,x)$ of a connected simple graph $G$ is
  $\det(xI-L(G))$, where $L(G)=D(G)-A(G)$ is the combinatorial Laplacian,
  $D(G)$ is the diagonal degree matrix, and $A(G)$ is the adjacency matrix
  CITE{WikiLaplacian} CITE{MathWorldLaplacianPolynomial}.
Parameters:
  g:
    type: Symbolic
    title: graph
    constraints: >-
      a connected simple graph, named by its canonical graph6 string
    display: $G$
Comments:
  comment-graph6: >-
    Graphs are named by their graph6 string CITE{Graph6}, McKay's compact
    encoding, taken after a canonical relabelling so that the name depends on
    the graph and not on how its vertices happen to be numbered. Recover the
    graph in Sage with `Graph(name)`, and produce the name used here with
    `g.canonical_label(algorithm='sage').graph6_string()`. The same names index
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomials]
    and HREF{Tutte_polynomials_of_connected_graphs}[the Tutte polynomials].
  comment-convention: >-
    The table uses the combinatorial Laplacian $D-A$, not the normalised
    Laplacian and not the signless Laplacian $D+A$. The polynomial stored is
    the monic characteristic polynomial $\det(xI-L(G))$ in the variable $x$.
  comment-zero-root: >-
    The constant vector lies in the kernel of every Laplacian, so $x$ divides
    $\lambda(G,x)$. It divides it exactly once because $G$ is connected. The
    next smallest root is the algebraic connectivity of $G$
    CITE{MathWorldLaplacianPolynomial}.
  comment-cospectral: >-
    The 996 graphs here have 934 distinct Laplacian polynomials. 119 of them
    share their polynomial with one or two other graphs, and the entry for each
    of those names the others.
Formulas:
  formula-matrix-tree: >-
    If $\lambda(G,x)=x^n+c_{n-1}x^{n-1}+\cdots+c_1x$ for a connected graph on
    $n$ vertices, then $\tau(G)=(-1)^{n-1}c_1/n=T_G(1,1)$, where $\tau(G)$ is
    the number of spanning trees and $T_G$ is the Tutte polynomial.
  formula-trace: >-
    The coefficient of $x^{n-1}$ in $\lambda(G,x)$ is $-\operatorname{tr}L(G)
    =-2|E(G)|$.
  formula-complete: >-
    $\lambda(K_n,x)=x(x-n)^{n-1}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      G = Graph('D~{')  # K_5, by its name here
      G.laplacian_matrix().charpoly()
      G.canonical_label(algorithm='sage').graph6_string()
Similar tables:
  - table: HREF{Characteristic_polynomials_of_connected_graphs}[Characteristic polynomials of connected graphs]
    relation: holds the characteristic polynomials $\det(xI-A(G))$ of the same graphs under the same names; for a $k$-regular graph on $n$ vertices, $\lambda(G,x)=(-1)^n\det((k-x)I-A(G))$
  - table: HREF{Chromatic_polynomials_of_connected_graphs}[Chromatic polynomials of connected graphs]
    relation: uses the same canonical graph6 index for connected graphs on at most seven vertices
  - table: HREF{Tutte_polynomials_of_connected_graphs}[Tutte polynomials of connected graphs]
    relation: contains $T_G(x,y)$, whose value $T_G(1,1)$ is the number of spanning trees in formula CITE{formula-matrix-tree}
  - table: HREF{Entropy_constants_of_lattice_models}[Entropy constants of lattice models]
    relation: contains spanning-tree entropy constants for infinite lattices, the limiting analogue of the finite spanning-tree counts determined by formula CITE{formula-matrix-tree}

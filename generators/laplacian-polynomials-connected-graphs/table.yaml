Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every connected graph on at most seven vertices
  rigour details: >-
    The generator enumerates connected simple graphs with $1\leq |V(G)|\leq7$
    using Sage, canonically labels each graph, and stores the canonical graph6
    string. It computes $L(G)=D(G)-A(G)$ exactly over $\mathbb{Z}$ and expands
    $\det(xI-L(G))$ over permutations in $\mathbb{Z}[x]$, avoiding Sage's
    polynomial-matrix determinant machinery.

    The build checked that the 996 graph6 strings are exactly the keys of
    HREF{Chromatic_polynomials_of_connected_graphs}[the chromatic polynomial
    table] and HREF{Tutte_polynomials_of_connected_graphs}[the Tutte
    polynomial table]. The exactness check found no inexact coefficients, and
    Sage's characteristic polynomial of the integer Laplacian matrix agreed on
    every row. The coefficient in formula CITE{formula-matrix-tree} agreed
    with $T_G(1,1)$ from the stored Tutte polynomial on every row. Formula
    CITE{formula-trace} agreed with the number of edges on every row, and
    formula CITE{formula-complete} agreed for $K_1,\ldots,K_7$.
Display properties:
  number-header: $\lambda(G,x)$
  group parameters: [['g']]

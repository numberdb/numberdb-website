# The table document for numberdb.org/T358, the sharp Del Pino-Dolbeault
# Gagliardo-Nirenberg constants. It began as proposal 5 of the sharp
# inequalities family in numberdb-data#167. Created as a draft through the API
# with X-Draft: yes, filled by generate.py, and offered for review. Publishing
# is a person's act.
Title: Sharp Gagliardo-Nirenberg constants of Del Pino and Dolbeault
Definition: >-
  Let $n\geq3$, let $1<a\leq n/(n-2)$, and put
  $\theta=n(a-1)/(a(n+2-(n-2)a))$. The number $A_{n,a}$ is the least constant
  in the Del Pino-Dolbeault Gagliardo-Nirenberg inequality CITE{WikiGN} CITE{DelPinoDolbeault2002},
  $\|u\|_{L^{2a}(\mathbb{R}^n)}\leq A_{n,a}\|\nabla u\|_{L^2}^{\theta}
  \|u\|_{L^{a+1}}^{1-\theta}$.
Tags:
  - functional analysis
  - inequality
Keywords:
  - Gagliardo-Nirenberg inequality
  - Gagliardo–Nirenberg inequality
  - Del Pino-Dolbeault constant
  - Del Pino-Dolbeault inequality
  - sharp interpolation constant
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: $n\geq 3$
  a:
    type: Q
    title: interpolation exponent
    display: $a$
    constraints: $1<a\leq n/(n-2)$
Comments:
  family: >-
    The table holds the $a>1$ Del Pino-Dolbeault family. The companion family
    with $a<1$ has a different closed form and is not held here.
  endpoint: >-
    At $a=n/(n-2)$, the inequality becomes the Sobolev inequality and
    $A_{n,a}=1/S_{n,2}$, where $S_{n,2}$ is the constant in
    HREF{T92}[the Sobolev constant table].
  notation: >-
    Some sources write this exponent as $p$ or write the left exponent as
    $2\sigma+2$. Here $a$ is the parameter in the displayed inequality.
Formulas:
  formula-constant: >-
    With $y=(a+1)/(a-1)$,
    $A_{n,a}=\left(\frac{y(a-1)^2}{2\pi n}\right)^{\theta/2}
    \left(\frac{2y-n}{2y}\right)^{1/(2a)}
    \left(\frac{\Gamma(y)}{\Gamma(y-n/2)}\right)^{\theta/n}$.
  formula-endpoint: >-
    At the Sobolev endpoint, $A_{n,n/(n-2)}=1/S_{n,2}$, where
    $S_{n,2}$ is the constant in HREF{T92}[the Sobolev constant table].
  formula-extremal: >-
    Equality is attained, up to the usual translations and dilations, by
    $u(x)=(1+|x|^2)^{-1/(a-1)}$.

Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      R = RealBallField(numberdb.bits(100, losing=160))
      n = QQ(3)
      a = QQ(2)
      theta = n * (a - 1) / (a * (n + 2 - (n - 2) * a))
      y = (a + 1) / (a - 1)
      A = (R(y * (a - 1)**2) / (2 * R.pi() * R(n)))**(R(theta) / 2)
      A *= ((2 * R(y) - R(n)) / (2 * R(y)))**(R(QQ(1) / (2 * a)))
      A *= (R(y).gamma() / R(y - n / 2).gamma())**(R(theta / n))
      A
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every dimension $3\leq n\leq20$, every rational exponent $a$ in
    the open admissible range whose reduced denominator is at most $8$, and
    the Sobolev endpoint $a=n/(n-2)$ in each dimension
  rigour details: >-
    Each value is computed from CITE{formula-constant} in Sage's real ball
    field, using exact rational values of $a$ and 160 guard bits beyond the
    100 digits written. The endpoint rows are checked against the reciprocal
    of the $s=1$ rows of HREF{T354}[the fractional Sobolev constant table],
    and also against the $p=2$ rows of HREF{T92}[the Sobolev constant table]
    where that table carries them. The formula is checked independently by
    evaluating the three displayed norms on CITE{formula-extremal}.
Display properties:
  number-header: $A_{n,a}$

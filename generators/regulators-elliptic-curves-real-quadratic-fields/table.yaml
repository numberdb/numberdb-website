Data properties:
  type: R
  rigour: heuristic
  sources:
    - CITE{ecnf-data}
  complete: 'no'
  complete-note: >-
    it holds every curve in ecnf-data with $D\in\{5,8,12,13,17\}$ and
    conductor norm at most $60$
  rigour details: >-
    Entries are transcribed from the ecnf-data `reg` field at commit
    `10b28418e80392032b106ea00e6c5aa109d28e7b`. In this range every curve has
    rank $0$ or $1$: rank-zero regulators are stored as the exact value $1$,
    and each rank-one regulator is compared with the source height of the
    recorded generator. The generator also checks that the Birch and
    Swinnerton-Dyer quotient in CITE{formula-BSD} gives the square integer
    recorded by ecnf-data for each source row.

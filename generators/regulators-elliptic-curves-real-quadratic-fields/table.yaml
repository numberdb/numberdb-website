# The table document for numberdb.org/T293. Publishing is a person's act on
# the site; the generator beside this file fills and extends the entries.
Title: Regulators of elliptic curves over real quadratic fields
Definition: >-
  Let $K=\mathbb{Q}(\sqrt{D})$ and let $E/K$ be an LMFDB-labelled elliptic
  curve of positive Mordell-Weil rank $r$. This table gives the regulator
  $R_{E/K}$, the determinant of the absolute Néron-Tate height pairing on
  $E(K)$ modulo torsion.
Keywords: Birch and Swinnerton-Dyer, BSD, elliptic regulator, Neron-Tate height, real quadratic field, Q(sqrt 5), Q(sqrt 2), Q(sqrt 3), Q(sqrt 13), Q(sqrt 17), Q(sqrt 21)
Parameters:
  D:
    type: Z
    title: field discriminant
    display: $D$
    constraints: positive fundamental discriminant
  label:
    type: Symbolic
    title: LMFDB curve label, without the field prefix
    display: label
    constraints: 'the LMFDB curve label with the field label $2.2.D.1$ removed: `31.1-a1` for the curve `2.2.5.1-31.1-a1`'
Comments:
  comment-index: >-
    The label of a row is the LMFDB CITE{LMFDB} curve label with the field
    label removed: the row with $D=12$ and label `47.1-b1` is the curve
    `2.2.12.1-47.1-b1`, where `47.1` labels the conductor ideal, of norm $47$,
    `b` is the isogeny class and `1` the curve in it. There is one row per
    curve rather than one row per isogeny class, since the regulator is
    attached to the Mordell-Weil lattice of the curve. A curve and its Galois
    conjugate have the same regulator, so over $D=13$ the rows whose conductor
    ideals are labelled `51.2` and `51.3` repeat one another with the curve
    numbers exchanged. Curves in one isogeny class have regulators in a
    rational ratio; in the class `17.1-a` over $D=17$ the ratios are powers of
    $2$.
  comment-field-generator: >-
    The generator $w$ of $K$ follows the LMFDB CITE{LMFDB} convention used in
    ecnf-data CITE{ecnf-data}: it satisfies $w^2-w-1=0$ for $D=5$, $w^2-2=0$
    for $D=8$, $w^2-3=0$ for $D=12$, $w^2-w-3=0$ for $D=13$, $w^2-w-4=0$
    for $D=17$, and $w^2-w-5=0$ for $D=21$.
  comment-rank-zero: >-
    Rank $0$ curves are not listed; their regulator is the determinant of the
    empty height-pairing matrix, so it is $1$.
  comment-convention: >-
    The height pairing is absolute. In PARI, `ellheightmatrix` over a
    quadratic field gives twice this height; the ecnf-data `reg` field and
    this table use the absolute convention that appears in CITE{formula-BSD}.
  comment-basis: >-
    If $P_1,\dots,P_r$ is a basis of $E(K)$ modulo torsion, then
    $R_{E/K}=\det(\langle P_i,P_j\rangle)_{1\leq i,j\leq r}$; changing the
    basis does not change this determinant.
  comment-small-fields: >-
    In the pinned ecnf-data source, the smallest conductor norm among
    positive-rank curves is $199$ over $D=5$ and $103$ over $D=8$, so the
    bound of $250$ leaves $17$ rows over $D=5$ and $348$ over $D=21$.
Formulas:
  formula-BSD: >-
    The Birch and Swinnerton-Dyer formula CITE{WikiBSD}, with the $L$-function
    normalised as in the Definition, is
    $L^*(E/K,1)=2^r\Omega_{E/K}R_{E/K}|\operatorname{Sha}(E/K)|
    \prod_{\mathfrak p}c_{\mathfrak p}/(|E(K)_{\mathrm{tors}}|^2\sqrt{D})$.
    Here $L^*(E/K,1)=L^{(r)}(E/K,1)/r!$ and the order of vanishing is $r$, as
    the conjecture predicts; $\Omega_{E/K}$ is the product, over the two real
    embeddings of $K$, of the real period of $E$ times the number of connected
    components of $E(\mathbb{R})$ at that embedding; $R_{E/K}$ is the regulator
    for the absolute Néron-Tate height; $\operatorname{Sha}(E/K)$ is the
    Tate-Shafarevich group; and $c_{\mathfrak p}$ is the Tamagawa number at
    $\mathfrak p$.

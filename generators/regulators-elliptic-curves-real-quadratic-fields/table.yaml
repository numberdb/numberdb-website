Data properties:
  type: R
  rigour: heuristic
  sources:
    - CITE{ecnf-data}
  complete: 'no'
  complete-note: >-
    it holds every positive-rank curve in ecnf-data over the six real
    quadratic fields of smallest discriminant, $D\in\{5,8,12,13,17,21\}$, with
    conductor norm at most $250$; the cutoff has to be at least $199$ for
    $\mathbb{Q}(\sqrt5)$ to be represented, since that is the smallest
    conductor norm at which ecnf-data has a positive-rank curve over $D=5$;
    this reaches the first curves of rank $2$ among those fields, at conductor
    norm $235$ over $D=21$, and the same source gives $1213$ entries at
    conductor norm $N\leq255$, exceeding the $1200$-entry soft limit
  rigour details: >-
    Entries are transcribed from the ecnf-data `reg` field at commit
    `10b28418e80392032b106ea00e6c5aa109d28e7b` and kept to $35$ significant
    digits, because equality checks among Galois-conjugate curves and
    same-regulator curves in this table show that the final source digits are
    not stable. The rows over $D\in\{5,8,12,13,17\}$ all have rank $1$; over
    $D=21$ the table includes rank $1$ and rank $2$ curves. For rank $1$ rows,
    the regulator is checked against the source height of the recorded
    generator. For the rank $2$ rows over $D=21$, the determinant of the
    height-pairing matrix was recomputed in Sage from the recorded generators
    and equations and compared with the source regulator at Sage's ordinary
    height-computation precision. The generator also checks that the Birch and
    Swinnerton-Dyer quotient in CITE{formula-BSD} gives
    $|\operatorname{Sha}(E/K)|$, the analytic order of the Tate-Shafarevich
    group recorded by ecnf-data for each source row.

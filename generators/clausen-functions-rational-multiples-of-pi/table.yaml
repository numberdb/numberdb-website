# The table document for T175, the values of the Clausen functions at rational
# multiples of pi. It began as proposal 1 of
# agents/table-ideas/BATCH-2026-09-09T1055.md. Created as a draft through the
# API (X-Draft: yes) and filled by generate.py beside it; publishing is a
# person's act on the site.
Title: Values of the Clausen functions $\mathrm{Cl}_s$ at rational multiples of $\pi$
Definition: >-
  This table gives the standard Clausen function $\mathrm{Cl}_s(\pi t)$:
  $\operatorname{Im}\mathrm{Li}_s(e^{i\pi t})$ for even $s$ and
  $\operatorname{Re}\mathrm{Li}_s(e^{i\pi t})$ for odd $s$
  CITE{MathWorldClausen}. Here $s\geq2$ is an integer and $t$ is rational, with
  $0<t<1$ for even $s$ and $0<t\leq1$ for odd $s$.
Keywords:
  - Catalan's constant
  - Catalan constant
  - Gieseking's constant
  - Gieseking constant
  - Lobachevsky function
  - Clausen integral
  - log sine integral
  - polylogarithm at roots of unity
  - dilogarithm
Parameters:
  s:
    type: Z
    title: order of the Clausen function
    display: $s$
    constraints: $s\geq 2$
  t:
    type: Q
    title: angle divided by $\pi$
    display: $t$
    constraints: >-
      $0<t<1$ when $s$ is even, and $0<t\leq 1$ when $s$ is odd
Comments:
  comment-index: >-
    The index is $t=\theta/\pi$, the same rational parameter used by
    HREF{Cos_pi_times_x_at_rational_numbers}[$\cos(\pi t)$]. If the unit
    circle is parameterised by $u=\theta/(2\pi)$, then $u=t/2$.
  comment-endpoints: >-
    For even $s$, $t=0$ and $t=1$ give $0$ and are omitted. For odd $s$,
    $t=0$ gives $\zeta(s)$, which belongs to
    HREF{Values_of_the_Riemann_zeta_function_at_rational_numbers}[the Riemann
    zeta table], and $t=1$ gives the alternating value
    $-(1-2^{1-s})\zeta(s)$.
  comment-branch: >-
    The arguments lie on the unit circle and $s>1$, so the series in
    CITE{formula-polylog} converges at every listed row. No analytic
    continuation or branch choice is used for these values.
  comment-hyperbolic: >-
    The entry $\mathrm{Cl}_2(\pi/3)$ is Gieseking's constant
    CITE{MathWorldGieseking}; twice it is the volume of the figure-eight knot
    complement, the entry
    HREF{Hyperbolic_volumes_of_the_prime_knots_with_at_most_ten_crossings#4,1}[$4_1$]
    in the hyperbolic knot volume table.
  comment-lobachevsky: >-
    The Lobachevsky function is
    $\Lambda(\theta)=\frac12\mathrm{Cl}_2(2\theta)$. To read
    $\Lambda(\pi t)$ from this table, reduce $2t$ modulo $2$ to
    $u\in[-1,1]$; the value is $\frac12\mathrm{Cl}_2(\pi u)$, using the sign
    symmetry in CITE{formula-symmetry} when $u<0$ and the omitted zero endpoint
    when $u=0$ or $|u|=1$.
Formulas:
  formula-polylog: >-
    $\mathrm{Li}_s(z)=\sum_{k=1}^{\infty}z^k/k^s$ is the polylogarithm
    CITE{DLMFPolylog}.
  formula-series: >-
    For $m\geq 1$,
    $\mathrm{Cl}_{2m}(\theta)=\sum_{k=1}^{\infty}\sin(k\theta)/k^{2m}$ and
    $\mathrm{Cl}_{2m+1}(\theta)=\sum_{k=1}^{\infty}\cos(k\theta)/k^{2m+1}$.
  formula-symmetry: >-
    $\mathrm{Cl}_s(\theta+2\pi)=\mathrm{Cl}_s(\theta)$. Under reflection,
    $\mathrm{Cl}_s(-\theta)=-\mathrm{Cl}_s(\theta)$ for even $s$, and
    $\mathrm{Cl}_s(-\theta)=\mathrm{Cl}_s(\theta)$ for odd $s$. These
    identities reduce every rational multiple of $\pi$ to a value with
    $0\leq t\leq 1$, with a sign change only in even order.
  formula-hurwitz: >-
    If $\alpha=p/q$ is in lowest terms, with $\alpha=t/2$ for the rows in this
    table, then
    $\mathrm{Li}_s(e^{2\pi i\alpha})=
    q^{-s}\sum_{r=1}^{q}e^{2\pi i p r/q}\zeta(s,r/q)$, where $\zeta(s,x)$ is
    HREF{Values_of_the_Hurwitz_zeta_function_at_pairs_of_rational_numbers}[the
    Hurwitz zeta function].
  formula-special-values: >-
    For $m\geq 1$, $\mathrm{Cl}_{2m}(\pi/2)=L(2m,\chi_4(3,\cdot))$ and
    $\mathrm{Cl}_{2m}(2\pi/3)=(\sqrt3/2)L(2m,\chi_3(2,\cdot))$. In the rows
    listed here,
    HREF{Values_of_Dirichlet_L-functions_at_positive_integers#4,3,2}[$G$] is
    Catalan's constant with $\mathrm{Cl}_2(\pi/2)=G$;
    $\mathrm{Cl}_2(2\pi/3)=2\mathrm{Cl}_2(\pi/3)/3$;
    $\mathrm{Cl}_3(\pi/3)=\zeta(3)/3$; $\mathrm{Cl}_3(\pi/2)=
    -3\zeta(3)/32$; $\mathrm{Cl}_3(2\pi/3)=-4\zeta(3)/9$; and
    $\mathrm{Cl}_3(\pi)=-3\zeta(3)/4$.
  formula-derivative: >-
    On $0<\theta<2\pi$,
    $\frac{d}{d\theta}\mathrm{Cl}_2(\theta)=-\log|2\sin(\theta/2)|$; hence
    $\mathrm{Cl}_2$ has its maximum on $[0,\pi]$ at $\theta=\pi/3$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      s = 2
      t = QQ(1) / QQ(3)
      CBF = ComplexBallField(numberdb.bits(100, losing=96))
      z = (CBF.gen(0) * CBF.pi() * CBF(t)).exp()
      z.polylog(s).imag()       # Cl_2(pi/3), Gieseking's constant

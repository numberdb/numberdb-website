Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=96)` bits by evaluating
    $\mathrm{Li}_s(e^{i\pi t})$ and taking the real or imaginary part specified
    in the definition. The 538 entries were checked against the Hurwitz-zeta
    decomposition CITE{formula-hurwitz}; the special values in
    CITE{formula-special-values} were checked against independent zeta,
    Hurwitz-zeta and Dirichlet $L$-value computations, and the decimal prefixes
    for Catalan's constant, Gieseking's constant and $\mathrm{Cl}_2(2\pi/3)$
    agreed with CITE{OEISCatalan}, CITE{OEISGieseking} and
    CITE{OEISClausenTwoThirds}.
  complete: no
  complete-note: >-
    it holds every entry with $s\in\{2,3,4\}$ and $t=a/b$ in lowest terms with
    $b\leq 24$ that satisfies the stated parameter constraints

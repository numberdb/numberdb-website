Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every component with $1\leq n\leq 6$; $s_7$ is the first
    component needing more than six variables, which is the most a stored
    polynomial may have
  rigour details: >-
    The generator computes exact integer coefficients in
    $\mathbb Z[c_1,\dots,c_6]$ from Formula CITE{formula-inverse}. Every
    stored component is checked against the Chern-root identity in Formula
    CITE{formula-roots} and by substituting the Chern classes of
    $T\mathbb P^m$ for $1\leq n\leq m\leq 6$, which gives
    $s_n(T\mathbb P^m)=(-1)^n\binom{m+n}{n}h^n$.

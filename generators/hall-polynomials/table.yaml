Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every nonzero non-edge $g^\lambda_{\mu\nu}(q)$ with
    $|\lambda|\leq8$ and $|\mu|,|\nu|>0$; the omitted edge cases are given by
    CITE{formula-edges}, and size $9$ would make $2527$ stored non-edge
    entries, past the soft entry limit of $1200$
  rigour details: >-
    Every entry is an exact polynomial with integer coefficients. The generator
    computes the Hall-Littlewood $P$-basis structure constants in Sage
    CITE{SageHallLittlewood} and converts them by CITE{formula-hall-littlewood}.

    Before the values were written, the rows with $|\lambda|\leq4$ were
    compared with direct counts of subgroups of finite abelian $p$-groups for
    $p=2$ and $p=3$. The full stored range was also checked against the
    symmetry CITE{formula-symmetry} and the edge identities
    CITE{formula-edges}.
Display properties:
  number-header: $g^\lambda_{\mu\nu}(q)$

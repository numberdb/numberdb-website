Keywords: Symlet, Symlets, least asymmetric Daubechies, Daubechies least-asymmetric wavelet, signal processing, symN, sym2, sym3, sym4, sym5, sym6, sym7, sym8, sym9, sym10, sym11, sym12, sym13, sym14, sym15, sym16, sym17, sym18, sym19, sym20
Tags:
  - analysis
  - algebraic
Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds the PyWavelets built-in Symlet reference range, $2\leq N\leq 20$
  rigour details: >-
    The generator builds $P_N$ over $\mathbb{Q}$ and computes its roots in
    Sage's exact algebraic closure. For each $2\leq N\leq 20$, its root-choice
    string is the one obtained by enumerating the conjugate-pair choices in
    the spectral factor and selecting the exact factor nearest to PyWavelets'
    source coefficient row CITE{PyWaveletsSource}. It then converts the exact
    algebraic coefficients to real balls before writing 100 digits. For every
    stored filter it checks the normalisation, the first $N$ vanishing
    moments, the even-shift orthogonality relations, and agreement with the
    PyWavelets source coefficient row.
Display properties:
  number-header: $h^{(N)}_k$

  - table: HREF{Stieltjes_constants}[Stieltjes constants]
    relation: its row HREF{Stieltjes_constants#0}[$\gamma_0$] is $\gamma(0,1)$
  - table: HREF{Mertens_constants_of_primes_in_arithmetic_progressions}[Mertens constants of primes in arithmetic progressions]
    relation: both tables store constants left by harmonic sums over arithmetic progressions, here over integers and there over primes

Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value is computed as a Sage real ball with arb at
    `numberdb.bits(digits, losing=96)` bits from CITE{formula-digamma}, using
    exact integer parameters. The entries were checked against
    CITE{formula-sum}, CITE{formula-gcd}, the special cases
    $\gamma(0,1)=\gamma$, $\gamma(1,2)=(\gamma+\log2)/2$ and
    $\gamma(1,4)=(\gamma+\pi/2+\log2)/4$, and an independent root-of-unity
    logarithm formula from CITE{WikiEuler}.
  complete: 'no'
  complete-note: >-
    it holds every residue class $0\leq a<q$ for $q\leq30$

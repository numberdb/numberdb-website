Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every $P_\lambda$ with $1\leq n\leq4$,
    $1\leq|\lambda|\leq4$, and $\ell(\lambda)\leq n$; extending the same
    rectangle to $n=5$ would make $P_{(4)}$ 2493 characters long, while
    extending to $|\lambda|=5$ at $n=4$ would make $P_{(5)}$ 2114 characters
    long
  rigour details: >-
    Every entry is an exact polynomial with integer coefficients. The generator
    computes Macdonald's symmetrization formula in the fraction field of
    $\mathbb{Z}[x_1,\dots,x_n,t]$ and refuses an entry unless the denominator
    cancels.

    Before the values were written, every entry was compared with Sage's
    Hall-Littlewood $P$ basis CITE{SageHallLittlewood}. The same values were
    checked at $t=0$ against HREF{Schur_polynomials}[the Schur polynomials],
    at $t=1$ against HREF{Monomial_symmetric_polynomials}[the monomial
    symmetric polynomials], and in the transition identity with HREF{T259}[the
    Kostka-Foulkes polynomials].
Display properties:
  number-header: $P_\lambda(x_1,\dots,x_n;t)$

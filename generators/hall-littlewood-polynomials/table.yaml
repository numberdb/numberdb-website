Title: Hall–Littlewood polynomials $P_\lambda(x_1,\dots,x_n;t)$
Definition: >-
  The Hall–Littlewood polynomial $P_\lambda(x_1,\dots,x_n;t)$ CITE{Wiki}
  is Macdonald's $P$-normalised Hall–Littlewood symmetric polynomial
  CITE{Macdonald}, given by CITE{formula-symmetrization} for a partition
  $\lambda$ with at most $n$ parts.
Keywords:
  - Hall-Littlewood symmetric functions
  - Hall Littlewood polynomials
  - Macdonald Hall-Littlewood polynomials
Tags:
  - polynomial
  - combinatorics
  - algebra
Parameters:
  n:
    type: Z
    title: number of variables
    display: $n$
    constraints: a positive integer
  lambda:
    type: Symbolic
    title: shape
    display: $\lambda$
    constraints: a partition with at most $n$ parts
Comments:
  notation: >-
    The partition is written as its parts, largest first, separated by commas:
    $2,1,1$ is the partition $(2,1,1)$ of $4$.
  convention: >-
    $t$ is an indeterminate, and $\lambda$ is padded with zeros to length $n$
    in CITE{formula-symmetrization}. In this $P$ normalisation, the
    coefficient of HREF{Monomial_symmetric_polynomials}[the monomial symmetric
    polynomial] $m_\lambda$ is $1$, and the other monomial terms are indexed
    by partitions $\mu$ lower than $\lambda$ in dominance order. The
    $Q_\lambda$ normalisation multiplies $P_\lambda$ by a factor depending on
    $\lambda$ and $t$. The transformed Hall–Littlewood polynomial
    $Q'_\lambda(x;t)=Q_\lambda[x/(1-t);t]$ is not a scalar multiple of
    $P_\lambda$ in general.
Formulas:
  formula-symmetrization: >-
    $P_\lambda(x_1,\dots,x_n;t)=v_\lambda(t)^{-1}\sum_{w\in S_n}
    w\left(x_1^{\lambda_1}\cdots x_n^{\lambda_n}
    \prod_{1\leq i<j\leq n}\frac{x_i-tx_j}{x_i-x_j}\right)$, where
    $v_\lambda(t)=\prod_{r\geq0}\prod_{j=1}^{m_r(\lambda)}(1-t^j)/(1-t)$,
    $m_r(\lambda)$ is the number of parts of $\lambda$ equal to $r$,
    $\ell(\lambda)$ is the number of nonzero parts, and
    $m_0(\lambda)=n-\ell(\lambda)$ counts the zeros added by padding.
  formula-schur: >-
    $P_\lambda(x;0)=s_\lambda(x)$,
    HREF{Schur_polynomials}[the Schur polynomial].
  formula-monomial: >-
    $P_\lambda(x;1)=m_\lambda(x)$,
    HREF{Monomial_symmetric_polynomials}[the monomial symmetric polynomial].
  formula-transition: >-
    $s_\lambda(x)=\sum_\mu K_{\lambda\mu}(t)P_\mu(x;t)$, where the sum is over
    partitions $\mu$ of $|\lambda|$ with at most $n$ parts and
    $K_{\lambda\mu}(t)$ is HREF{T259}[the Kostka-Foulkes polynomial].
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.all import QQ, PolynomialRing, SymmetricFunctions

      T = PolynomialRing(QQ, 't')
      P = SymmetricFunctions(T.fraction_field()).hall_littlewood().P()
      grouped = P([3, 2]).expand(4, alphabet=['x1', 'x2', 'x3', 'x4'])

      # Sage groups coefficients in t; this writes the same polynomial
      # expanded over QQ[x1, x2, x3, x4, t], as the table does.
      R = PolynomialRing(QQ, ['x1', 'x2', 'x3', 'x4', 't'])
      print(R(str(grouped)))

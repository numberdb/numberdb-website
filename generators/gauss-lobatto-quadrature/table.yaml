# The table document for the Gauss-Lobatto nodes and weights, proposal 5 of
# agents/table-ideas/BATCH-2026-09-02.md. Created as a draft through the API
# (X-Draft: yes) and filled by generate.py beside it; publishing is a person's
# act on the site.
Title: Nodes and weights of Gauss–Lobatto quadrature
Definition: >-
  For $n\geq 2$ the Gauss–Lobatto quadrature rule with $n$ points is the
  unique rule $\int_{-1}^{1} f(x)\,dx \approx \sum_{k=1}^{n} w_k f(x_k)$ with
  $x_1=-1$ and $x_n=1$ that is exact for every polynomial $f$ of degree at
  most $2n-3$ CITE{Wiki}. Listed are its nodes $x_1<\cdots<x_n$ and its
  weights $w_k$.
Parameters:
  n:
    type: Z
    title: number of nodes, the two endpoints included
    display: $n$
    constraints: $n\geq 2$
  k:
    type: Z
    title: index of the node, in increasing order
    display: $k$
    constraints: $1\leq k\leq n$
  expression:
    type: Symbolic
    title: node or weight
    values:
      x: $x_k$
      w: $w_k$
    show-in-parameter-list: 'no'
Comments:
  comment-nodes: >-
    The interior nodes $x_2<\cdots<x_{n-1}$ are the roots of $P_{n-1}'$, the
    derivative of the HREF{Legendre_polynomials}[Legendre polynomial] of
    degree $n-1$: the points at which $P_{n-1}$ has its local extrema in
    $(-1,1)$. They are real, simple, symmetric about $0$, and interlace with
    the roots of $P_{n-1}$. Since $P_{n-1}'=\tfrac{n}{2}P^{(1,1)}_{n-2}$,
    they are also the roots of a HREF{Jacobi_polynomials}[Jacobi polynomial],
    one of the families asked for in CITE{issue11}.
  comment-degree: >-
    Fixing both endpoints costs two degrees of freedom: a rule with $n$
    points reaches degree $2n-3$ here against $2n-1$ for the
    HREF{Nodes_and_weights_of_Gauss_Legendre_quadrature}[Gauss–Legendre rule]
    with $n$ free points. The rule is used where the values of $f$ at the
    endpoints are wanted anyway: the nodes are the Legendre–Gauss–Lobatto
    collocation points of spectral and spectral-element methods CITE{CHQZ},
    and an adaptive rule built on the four-point Lobatto rule
    CITE{GanderGautschi} is the routine quadl of MATLAB and Octave.
  comment-both-halves: >-
    Every rule is symmetric, $x_{n+1-k}=-x_k$ and $w_{n+1-k}=w_k$, and both
    halves are listed rather than the nonnegative one: a reader holding
    $-0.7650553239\ldots$ finds it with its sign.
  comment-exact-entries: >-
    Every value here is an algebraic number, and the ones that are rational
    are written exactly rather than to a hundred digits: the endpoints
    $x_1=-1$ and $x_n=1$, their weights $w_1=w_n=2/(n(n-1))$, the node $x=0$
    of every rule of odd order with its weight $2/(n(n-1)P_{n-1}(0)^2)$, and
    all weights of the rules with $n\leq 5$. The rules with $n\leq 7$ have
    closed forms in square roots, given in the comments on their entries;
    the nodes $\pm 1/\sqrt{5}$ of $n=4$ are also in
    HREF{Algebraic_numbers_of_degree_2}[the table of quadratic algebraic numbers].
  comment-small-rules: >-
    The rule with $n=2$ is the trapezoidal rule and the rule with $n=3$ is
    Simpson's rule, which are also the closed Newton–Cotes rules with two and
    three points. From $n=4$ on the interior nodes are not equally spaced
    ($\pm 1/\sqrt{5}$ here, $\pm 1/3$ for Simpson's $3/8$ rule) and the two
    families part; the Newton–Cotes weights are the integrals of the
    HREF{Lagrange_basis_polynomials_for_equally_spaced_nodes}[Lagrange basis polynomials for equally spaced nodes].
  comment-unit-interval: >-
    The same rule on $[0,1]$ has nodes $c_k=(1+x_k)/2$ and weights
    $b_k=w_k/2$, which is how it appears in the Butcher tableaux of the
    Lobatto IIIA, IIIB and IIIC Runge–Kutta methods CITE{HairerWanner}:
    $c=0,\tfrac12,1$ with $b=\tfrac16,\tfrac23,\tfrac16$ for three stages, and
    $c=0,(5-\sqrt5)/10,(5+\sqrt5)/10,1$ with
    $b=\tfrac1{12},\tfrac5{12},\tfrac5{12},\tfrac1{12}$ for four. Those
    values are an affine image of the entries here rather than a multiple of
    them, and they are not listed separately.
  comment-other-rules: >-
    The Gauss–Radau rule fixes one endpoint only and reaches degree $2n-2$;
    the Gauss–Kronrod rule extends the Gauss–Legendre rule by $n+1$ points.
    Neither is listed here, nor are the Lobatto rules for other weight
    functions.
Formulas:
  formula-weights: >-
    $w_k=\dfrac{2}{n(n-1)\,P_{n-1}(x_k)^2}$ for $1\leq k\leq n$ CITE{AS}; at
    the endpoints $P_{n-1}(\pm1)^2=1$, so $w_1=w_n=\dfrac{2}{n(n-1)}$.
  formula-secondary: >-
    $w_k=\dfrac{q(x_k)}{\omega_n'(x_k)}$, where
    $\omega_n=(x^2-1)P_{n-1}'=\dfrac{n(n-1)}{2n-1}\,(P_n-P_{n-2})$ is the
    polynomial whose roots are the nodes and
    $q(x)=\int_{-1}^{1}\dfrac{\omega_n(t)-\omega_n(x)}{t-x}\,dt
    =\dfrac{n(n-1)}{2n-1}\,(q_n-q_{n-2})$ with $q_n$ the
    HREF{Secondary_polynomials_of_the_Legendre_polynomials}[secondary polynomial of $P_n$].
  formula-exactness: >-
    $\sum_{k=1}^{n} w_k x_k^m=\int_{-1}^{1}x^m\,dx=\dfrac{1+(-1)^m}{m+1}$ for
    $0\leq m\leq 2n-3$, and not for $m=2n-2$.
  formula-remainder: >-
    $\int_{-1}^{1}f(x)\,dx-\sum_{k=1}^{n}w_kf(x_k)
    =-\dfrac{n(n-1)^3\,2^{2n-1}\,((n-2)!)^4}{(2n-1)\,((2n-2)!)^3}\,f^{(2n-2)}(\xi)$
    for some $\xi\in(-1,1)$ CITE{AS}.
  formula-symmetry: >-
    $x_{n+1-k}=-x_k$, $w_{n+1-k}=w_k$, $w_k>0$ and $\sum_{k=1}^{n}w_k=2$.
  formula-central-weight: >-
    For odd $n$, $x_{(n+1)/2}=0$ and
    $w_{(n+1)/2}=\dfrac{2}{n(n-1)P_{n-1}(0)^2}=\dfrac{2\,((n-1)!!)^2}{n(n-1)\,((n-2)!!)^2}$:
    $\tfrac43$, $\tfrac{32}{45}$, $\tfrac{256}{525}$, $\tfrac{36864}{99225}$
    for $n=3,5,7,9$.
  formula-jacobi: >-
    $P_{n-1}'(x)=\dfrac{n}{2}\,P^{(1,1)}_{n-2}(x)$, so the interior nodes are
    the roots of the Jacobi polynomial $P^{(1,1)}_{n-2}$, orthogonal on
    $[-1,1]$ for the weight $1-x^2$.
  formula-lagrange: >-
    $w_k=\int_{-1}^{1}\ell_k(x)\,dx$ with $\ell_k(x)=\prod_{j\neq k}\frac{x-x_j}{x_k-x_j}$
    the Lagrange basis polynomial of the nodes, as for every interpolatory
    rule.
  formula-interval: >-
    On $[a,b]$ the rule is $\int_a^b f \approx \frac{b-a}{2}\sum_k w_k\,
    f\bigl(\frac{b-a}{2}x_k+\frac{a+b}{2}\bigr)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<x> = QQ[]
      n = 8
      P = R(legendre_P(n - 1, x))
      nodes = [-1] + P.derivative().roots(RealIntervalField(400), multiplicities=False) + [1]   # x_2 = -0.87174014850960661534...
      weights = [2/(n*(n - 1)*P(r)^2) for r in nodes]                                          # w_1 = 1/28, w_2 = 0.21070422714350603938...
  program-sympy:
    language: Python
    code: |-
      from sympy.integrals.quadrature import gauss_lobatto
      nodes, weights = gauss_lobatto(8, 20)      # nodes[1] = -0.87174014850960661534, weights[1] = 0.21070422714350603938

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: every rule with $2\leq n\leq 30$ is here, nodes and weights, both halves
  rigour details: >-
    $P_{n-1}$ is built exactly in $\mathbb{Q}[x]$; the roots of $P_{n-1}'$
    are isolated by Sage's real root isolation over the interval field, so
    each interior node is an interval provably containing one root, carried
    on as an arb ball at 397 bits; $w_k$ is $2/(n(n-1)P_{n-1}(x_k)^2)$ in
    ball arithmetic, and the digits written are those the ball supports (the
    widest, the weight $w_2$ at $n=30$, supports 107). The endpoints, their
    weights, the central node and weight of every odd rule and all weights of
    $n\leq 5$ are exact. Before a rule is written it must also satisfy the
    secondary-polynomial weight formula (exactly in $\mathbb{Q}$ at the
    exact nodes), the interlacing with the roots of $P_{n-1}$, the symmetry,
    $\sum w_k=2$, exactness on $x^m$ for $m\leq 2n-3$ with failure at
    $m=2n-2$, and the closed forms of the entry comments. Outside the
    generator the values were compared with the rows for $n\leq 6$ on
    MathWorld and $n\leq 7$ on Wikipedia (the closed forms verified exactly
    in $\mathbb{Q}(\sqrt7)$ and $\mathbb{Q}(\sqrt{15})$), with the weights as
    integrals of the Lagrange basis polynomials, with the stored Legendre,
    secondary and Gauss–Legendre tables, with the explicit sum for
    $P^{(1,1)}_{n-2}$, with the Lobatto IIIA tableaux, and with sympy's
    gauss_lobatto on another machine to 50 digits, with the controls that
    must fail failing.
Display properties:
  number-header: $x_k$ or $w_k$

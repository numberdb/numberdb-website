Tags:
  - polynomial
  - special functions
  - recurrence
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<x> = ZZ[]
      def bessel_polynomial(n):
          a, b = R(1), x + 1
          if n == 0: return R(1)
          for i in range(2, n + 1):
              a, b = b, (2*i - 1)*x*b + a
          return b

      bessel_polynomial(31)            # the next one after this table

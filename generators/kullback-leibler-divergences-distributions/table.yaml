Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ
      from sage.rings.real_arb import RealBallField

      R = RealBallField(numberdb.bits(100, losing=96))
      p = R(QQ(1) / QQ(2))
      q = R(QQ(1) / QQ(3))
      # KL divergence in nats from Bernoulli(1/2) to Bernoulli(1/3).
      p * (p / q).log() + (1 - p) * ((1 - p) / (1 - q)).log()
Data properties:
  type: R
  rigour: proven
  complete: no
  complete-note: >-
    it holds ordered distinct Bernoulli and geometric pairs with
    $p,q\in\{1/2,1/3,1/4,1/5,1/10,11/100\}$; binomial
    $\operatorname{Binom}(n,p)$ pairs for $2\leq n\leq20$ and ordered
    distinct $p,q\in\{1/2,1/3,1/4,1/10\}$; negative binomial pairs for
    $2\leq r\leq10$ and the same ordered distinct $p,q$; Poisson pairs with
    $\lambda,\mu\in\{1/2,1,3/2,2,5,10\}$ and $\lambda\neq\mu$; normal pairs
    $N(0,\sigma_1^2)$ and $N(0,\sigma_2^2)$ with ordered distinct
    $\sigma_1,\sigma_2\in\{1/2,1,2,3\}$; and exponential pairs with ordered
    distinct scale parameters
    $\theta_1,\theta_2\in\{1/2,1,2,3,10\}$, each in nats and bits
  rigour details: >-
    Each entry is computed from the closed forms in Formulas in Sage real
    ball arithmetic at `numberdb.bits(digits, losing=128)`. The generator's
    integrity check compares finite discrete rows with SciPy 1.17.1
    `stats.entropy`, compares the infinite discrete rows with independent
    SciPy probability mass sums, and compares the normal and exponential rows
    with SciPy numerical expectations under the first distribution.
Display properties:
  number-header: $D(P\|Q)$

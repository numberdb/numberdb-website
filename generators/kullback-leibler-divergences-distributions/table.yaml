    relation: stores Shannon entropy of one discrete distribution; when $Q$ is uniform on $n$ points, $D(P\|Q)=\log n-H(P)$
  - table: HREF{Differential_entropies_of_continuous_probability_distributions}[Differential entropies of continuous probability distributions]
    relation: stores entropy of one absolutely continuous distribution, using the same nats and bits units
  - table: HREF{Capacity_of_the_run-length-limited_constrained_codes}[Capacity of the $(d,k)$ run-length-limited constrained codes]
    relation: belongs to the same information-theory family and uses the same nats and bits units for logarithmic quantities

Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every row with $0\leq\ell\leq25$ and $|m|\leq\ell$
  repeats: HREF{Legendre_polynomials}
  rigour details: >-
    Every entry is exact, a polynomial over $\mathbb{Q}$ in $x$ and $y$ with
    $y=(1-x^2)^{1/2}$. The generator computes the ordinary Legendre
    polynomials by Bonnet's recurrence, applies CITE{formula-definition} for
    nonnegative order, and applies CITE{formula-negative-order} for negative
    order. Before entries are written, it checks the initial rows through
    $\ell=3$, the negative-order relation, the recurrence
    CITE{formula-recurrence}, the exact orthogonality relation
    CITE{formula-orthogonality}, and the $m=0$ rows against the generated
    Legendre polynomials. The build also read
    HREF{Legendre_polynomials}[the published Legendre polynomial table] and
    checked that every stored row with $m=0$ agrees with it through
    $\ell=25$.

Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every normalized Markov triple with $m_3\leq10^{12}$
  rigour details: >-
    The generator enumerates triples from $(1,1,1)$ by the Vieta involutions
    of Formula CITE{formula-markov-equation}, sorts each triple into
    normalized order, and keeps exactly the triples with $m_3\leq10^{12}$.
    It computes $k$ by modular inversion in the congruence from the
    definition, using exact integer arithmetic throughout. For every stored
    row, the generator verifies the Markov equation, the divisibility of
    $k^2+1$ by $m_3$, Formula CITE{formula-discriminant}, and
    Formula CITE{formula-content}. The first triples were compared with
    CITE{OEISTriples}, and the first forty $k$ values were compared with
    CITE{OEISK}.
Display properties:
  number-header: $f_{m_1,m_2,m_3}(x,y)$

Title: Markov forms
Definition: >-
  For a normalized Markov triple $(m_1,m_2,m)$, where
  $m_1\leq m_2\leq m$ and $m_1^2+m_2^2+m^2=3m_1m_2m$
  CITE{WikiMarkovNumber}, this table stores Markov's binary quadratic form
  $f(x,y)=m x^2+(3m-2k)xy+(l-3k)y^2$ CITE{Cassels}. Here
  $0\leq k\leq m/2$ is the unique integer satisfying
  $k m_2\equiv\pm m_1\pmod m$, and $l=(k^2+1)/m$.
Parameters:
  m1:
    type: Z
    title: smallest member
    display: $m_1$
    constraints: >-
      $(m_1,m_2,m_3)$ is a Markov triple with
      $m_1\leq m_2\leq m_3$
  m2:
    type: Z
    title: middle member
    display: $m_2$
    constraints: >-
      $(m_1,m_2,m_3)$ is a Markov triple with
      $m_1\leq m_2\leq m_3$
  m3:
    type: Z
    title: largest member
    display: $m_3$
    constraints: >-
      $(m_1,m_2,m_3)$ is a Markov triple with
      $m_1\leq m_2\leq m_3$
Comments:
  comment-index: >-
    The triples are normalized by sorting them as
    $m_1\leq m_2\leq m_3$ and are listed by increasing $m_3$, then by
    increasing $m_2$, then by increasing $m_1$. The table is keyed by the
    full triple rather than by $m_3$ alone, so it does not use the Markov
    unicity conjecture CITE{Aigner}.
  comment-convention: >-
    This table stores Markov's form itself, with leading coefficient $m_3$,
    not its primitive part. Its content is $2$ when $m_3$ is even, and is
    $1$ when $m_3$ is odd.
  comment-k: >-
    The two congruence signs give the residues $k$ and $m_3-k$ modulo
    $m_3$; the closed range $0\leq k\leq m_3/2$ selects the stored form.
    This gives $k=0$ for $(1,1,1)$ and $k=1$ for $(1,1,2)$.
  comment-spectrum: >-
    The associated value in the Markov and Lagrange spectra
    CITE{WikiMarkovSpectrum} is
    $\sqrt{9m_3^2-4}/m_3=3-2/(3m_3^2)+O(m_3^{-4})$, so these values
    accumulate at $3$ from smaller values.
Formulas:
  formula-markov-equation: >-
    The indexing triples satisfy
    $m_1^2+m_2^2+m_3^2=3m_1m_2m_3$.
  formula-discriminant: >-
    If $f(x,y)=Ax^2+Bxy+Cy^2$ is the stored form, then
    $B^2-4AC=9m_3^2-4$.
  formula-markov-value: >-
    The Markov value of the stored form is
    $\sqrt{9m_3^2-4}/m_3$.
  formula-content: >-
    $\gcd(A,B,C)=2$ when $m_3$ is even, and $\gcd(A,B,C)=1$ when
    $m_3$ is odd.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, ("x", "y"))
      x, y = R.gens()
      m1, m2, m3 = ZZ(2), ZZ(5), ZZ(29)
      if m3 == 1:
          k = ZZ(0)
      else:
          r = (m1 * ZZ(pow(int(m2), -1, int(m3)))) % m3
          k = min(r, (-r) % m3)
      l = (k**2 + 1) // m3
      m3*x**2 + (3*m3 - 2*k)*x*y + (l - 3*k)*y**2

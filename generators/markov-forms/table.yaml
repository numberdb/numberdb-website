Title: Markov forms
Definition: >-
  For a normalized Markov triple $(m_1,m_2,m_3)$ CITE{WikiMarkovNumber}, this
  table stores Markov's binary quadratic form $f_{m_1,m_2,m_3}(x,y)$ defined
  by Formula CITE{formula-form} CITE{Cassels}.
Parameters:
  m1:
    type: Z
    title: smallest member of the triple
    display: $m_1$
    constraints: >-
      $(m_1,m_2,m_3)$ is a Markov triple with
      $m_1\leq m_2\leq m_3$
  m2:
    type: Z
    title: middle member of the triple
    display: $m_2$
  m3:
    type: Z
    title: largest member of the triple
    display: $m_3$
Comments:
  comment-index: >-
    The triples are normalized by sorting them as
    $m_1\leq m_2\leq m_3$. Rows are grouped by increasing $m_1$ and, within
    each $m_1$ group, are listed by increasing $m_3$, then by increasing
    $m_2$. The table is keyed by the full triple rather than by $m_3$ alone,
    so it does not use the Markov unicity conjecture CITE{Aigner}.
  comment-convention: >-
    This table stores Markov's form itself, with leading coefficient $m_3$,
    rather than its primitive part.
  comment-k: >-
    In Formula CITE{formula-form}, the sign in
    $k m_2\equiv\pm m_1\pmod {m_3}$ gives the residues $k$ and $m_3-k$
    modulo $m_3$. Markov's theorem CITE{WikiMarkovNumber} states this range
    strictly, $0<k<m_3/2$; this table takes the range closed so that the
    degenerate triples $(1,1,1)$ and $(1,1,2)$ have a $k$, giving $k=0$
    and $k=1$.
  comment-spectrum: >-
    Writing $f(x,y)=Ax^2+Bxy+Cy^2$, the root
    $(-B+\sqrt{B^2-4AC})/(2A)$ of $f(x,1)$ has an eventually periodic
    continued fraction; for every row here, a period uses only the partial
    quotients $1$ and $2$. The associated value in the Markov and Lagrange
    spectra CITE{WikiMarkovSpectrum} is
    $\sqrt{9m_3^2-4}/m_3=3-2/(3m_3^2)+O(m_3^{-4})$, so these values
    accumulate at $3$ from smaller values.
Formulas:
  formula-form: >-
    Put $m=m_3$. Let $0\leq k\leq m/2$ be the unique integer satisfying
    $k m_2\equiv\pm m_1\pmod m$, and let $l=(k^2+1)/m$. Then
    $f_{m_1,m_2,m_3}(x,y)=m x^2+(3m-2k)xy+(l-3k)y^2$.
  formula-markov-equation: >-
    The indexing triples satisfy
    $m_1^2+m_2^2+m_3^2=3m_1m_2m_3$.
  formula-discriminant: >-
    If $f(x,y)=Ax^2+Bxy+Cy^2$ is the stored form, then
    $B^2-4AC=9m_3^2-4$.
  formula-markov-value: >-
    For the stored form $f(x,y)=Ax^2+Bxy+Cy^2$, put
    $\mu(f)=\min\{0<|f(x,y)|:(x,y)\in\mathbb Z^2\}$. The Markov value is
    $\sqrt{B^2-4AC}/\mu(f)=\sqrt{9m_3^2-4}/m_3$.
  formula-content: >-
    $\gcd(A,B,C)=2$ when $m_3$ is even, and $\gcd(A,B,C)=1$ when
    $m_3$ is odd.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, ("x", "y"))
      x, y = R.gens()
      m1, m2, m3 = ZZ(2), ZZ(5), ZZ(29)
      if m3 == 1:
          k = ZZ(0)
      else:
          r = (m1 * ZZ(pow(int(m2), -1, int(m3)))) % m3
          k = min(r, (-r) % m3)
      l = (k**2 + 1) // m3
      m3*x**2 + (3*m3 - 2*k)*x*y + (l - 3*k)*y**2

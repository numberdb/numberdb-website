# The table document for T199, a draft built from proposal 2 of
# agents/table-ideas/BATCH-2026-09-09T1936.md. The same proposal named both
# modified Bessel functions; T196 holds the first kind I_nu, and this draft
# holds the second kind K_nu as its companion.
Title: Values of modified Bessel functions of the second kind $K_\nu(x)$
Definition: This table gives the real principal values of the modified Bessel
  function of the second kind $K_\nu(x)$, Macdonald's function, CITE{Wiki}
  CITE{DLMFModifiedDefinitions} CITE{MathWorldModifiedK}, for rational order
  $\nu\geq0$ and rational argument $x>0$.
Keywords:
- Bessel K
- modified Bessel K
- modified Bessel function of the second kind
- Macdonald function
- Basset function
- K0(1)
- cylinder functions
Parameters:
  nu:
    type: Q
    title: order
    display: $\nu$
    constraints: $\nu\in\mathbb{Q}$, $\nu\geq0$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments:
  comment-branches: The principal branch is that of CITE{DLMFModifiedDefinitions}.
    For real $\nu$ and $x>0$, $K_\nu(x)$ is real. The point $x=0$ is excluded
    because $K_\nu(x)\to+\infty$ as $x\to0^+$ for every rational $\nu\geq0$
    CITE{DLMFModifiedLimits}.
  comment-negative-orders: Negative orders are not listed separately because
    $K_{-\nu}(x)=K_\nu(x)$ for every order $\nu$.
  comment-spherical: These are the ordinary cylindrical modified Bessel functions.
    The modified spherical Bessel function of the second kind is
    $\mathrm{k}_n(x)=\sqrt{\pi/(2x)}K_{n+1/2}(x)$ CITE{DLMFSpherical}.
  comment-half-integers: The half-integer orders are elementary, as CITE{formula-half-integer-orders}
    shows.
Formulas:
  formula-recurrence: $K_{\nu+1}(x)-K_{\nu-1}(x)=2\nu K_\nu(x)/x$
    CITE{DLMFModifiedRecurrences}.
  formula-negative-order: $K_{-\nu}(x)=K_\nu(x)$ CITE{DLMFModifiedConnections}.
  formula-half-integer-orders: For every integer $n\geq0$, $K_{n+1/2}(x)=\sqrt{\pi/(2x)}e^{-x}y_n(1/x)$,
    where $y_n$ is the HREF{Bessel_polynomials}[Bessel polynomial] CITE{DLMFSphericalExplicit}.
  formula-tricomi: $K_\nu(x)=\sqrt{\pi}(2x)^\nu e^{-x}U(\nu+1/2,2\nu+1,2x)$
    CITE{DLMFModifiedElementary}, where $U$ is Tricomi's confluent hypergeometric
    function.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.complex_arb import ComplexBallField

      from sage.rings.rational_field import QQ


      CBF = ComplexBallField(numberdb.bits(100, losing=80))

      nu = CBF(QQ(0))

      x = CBF(QQ(1))

      # Sage''s arb method is called on the argument and takes the order.

      x.bessel_K(nu).real()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.besselk(0, 1)'

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds $K_\nu(x)$ for $\nu\in\{0,1/3,1/2,2/3,1,3/2,2,5/2,3\}$
    and for every positive rational $x=a/b$ in lowest terms with $b\leq4$ and
    $x\leq5$
  rigour details: Each value was computed as a Sage real ball with arb at
    `numberdb.bits(digits, losing=80)` bits. The entries were checked against
    mpmath at 150 decimal digits, against the recurrence in CITE{formula-recurrence}
    wherever all three orders are stored, against the negative-order formula
    in CITE{formula-negative-order}, against the elementary half-integer formula
    in CITE{formula-half-integer-orders}, and against the Tricomi-function identity in
    CITE{formula-tricomi}. The widest returned ball had radius less than
    $10^{-119}$ for 100 requested digits.

  rigour: exact
  complete: 'no'
  complete-note: it holds every index $n$ with $0\leq n\leq45$
  rigour details: >-
    The generator computes the derivative recurrence in
    CITE{formula-derivative-recurrence} over Sage's rational polynomial ring,
    with every division made in Sage's rational field. Before the draft was
    created, the entries were checked against
    CITE{formula-generating-function}, against the partial Bell formula
    CITE{formula-partial-bell}, against the hypergeometric formula
    CITE{formula-hypergeometric}, against the polynomials $s_0$ through
    $s_6$ printed by CITE{Wiki}, against the polynomials $s_0$ through
    $s_5$ printed by CITE{MathWorld} after applying the sign map in
    comment-convention, against OEIS A137378 CITE{OEISscaled} through
    $n=10$ after applying the same sign map, and against
    CITE{formula-leading-coefficients} on every entry.

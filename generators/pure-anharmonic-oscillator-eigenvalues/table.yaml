Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: no
  complete-note: it holds the first three levels $0\leq n\leq2$ for $m=2,3,4,5$, the pure quartic, sextic, octic and decic oscillators
  rigour details: The generator forms the Galerkin matrix of $-y''+x^{2m}$ in the harmonic-oscillator basis and finds finite-matrix eigenvalues by bisection using an $LDL^T$ Sturm count, without a dense high-precision eigensolver. For $m=2,3$ it compares truncations $N=700,900$ at basis frequencies $\omega=2,5/2$; for $m=4$ it compares $N=800,1000$ at $\omega=3,7/2$; for $m=5$ it compares $N=1600,2000$ at $\omega=4,5$. The stored rows are the digits common to all four computations for that $m$, and the worst stored row retained 51 matching significant digits.

    As controls, the same code with $m=1$ gives the harmonic-oscillator eigenvalues $2n+1$, and the three quartic rows agree with the 30-decimal values in CITE{Mushtaq2020}. The high-precision spectral study CITE{Macfarlane1999} gives an outside reference for the $x^{2m}$ oscillator family and its scaling conventions.

Title: Eigenvalues of the pure quartic, sextic, octic and decic oscillators $-y''+x^{2m}y$
Definition: For $m\geq2$, let $E^{(m)}_n$ be the $n$th eigenvalue of $-y''+x^{2m}y=Ey$ on $L^2(\mathbb R)$, with no factor of $\tfrac12$ on the kinetic term. The index $n$ starts at $0$ for the ground state and equals the number of nodes of the eigenfunction.
Parameters:
  m:
    type: Z
    title: exponent half-degree
    display: $m$
    constraints: $m\geq2$
  n:
    type: Z
    title: energy level
    display: $n$
    constraints: $n\geq0$
Comments:
  comment-names: The rows $m=2,3,4,5$ are the pure quartic, sextic, octic and decic anharmonic oscillators, respectively CITE{WikiAnharmonic}.
  comment-normalisation: With the same kinetic-term normalisation, the harmonic oscillator $-y''+x^2y=Ey$ has eigenvalues $2n+1$.
  comment-parity: The potential is even, so the eigenfunctions alternate parity. Even $n$ gives an even eigenfunction and odd $n$ gives an odd eigenfunction.
Formulas:
  formula-homogeneous-scaling: If $E^{(m)}_n(\beta)$ is the eigenvalue of $-y''+\beta x^{2m}$ with $\beta>0$, then $E^{(m)}_n(\beta)=\beta^{1/(m+1)}E^{(m)}_n$.
  formula-half-kinetic: The operator $-\tfrac12 y''+\lambda x^{2m}$ has eigenvalues $2^{-m/(m+1)}\lambda^{1/(m+1)}E^{(m)}_n$ in this table's normalisation.
  formula-quartic-scaling: For quartic potentials $V=\alpha x^2+\beta x^4$ with $\beta>0$, $E_n(\alpha,\beta)=\beta^{1/3}E_n(\alpha\beta^{-2/3},1)$.

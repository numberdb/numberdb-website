Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds $0\leq n\leq19$ for $m=2,3,4,5$, the pure quartic through
    decic wells used as numerical oscillator benchmarks
  rigour details: >-
    The generator computes Rayleigh-Ritz eigenvalues in a harmonic-oscillator
    basis, with even and odd parity separated. Each entry is computed from
    four Galerkin matrices, using two truncations and two basis frequencies;
    the stored interval is the union of those four values and must retain at
    least the 50 digits written.
Display properties:
  number-header: $E^{(m)}_n$

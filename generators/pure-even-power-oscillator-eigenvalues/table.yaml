Title: Eigenvalues of the pure quartic, sextic and octic oscillators $-y''+x^{2m}y$
Definition: >-
  For an integer $m\geq2$, this table gives the eigenvalue $E^{(m)}_n$
  of the Schrodinger operator
  $-y''(x)+x^{2m}y(x)=E y(x)$ on $L^2(\mathbb{R})$ CITE{Biswas1973}.
  The operator has no factor of $1/2$ multiplying $-y''$, and the level
  index $n$ starts at $0$ for the ground state.
Keywords:
  - anharmonic oscillator
  - pure quartic oscillator
  - quartic oscillator
  - sextic oscillator
  - octic oscillator
  - decic oscillator
  - monomial potential
  - power-law potential
  - Schrodinger equation
  - energy levels
  - Bender-Wu
Parameters:
  m:
    type: Z
    title: power parameter
    display: $m$
    constraints: integer with $m\geq2$
  n:
    type: Z
    title: energy level
    display: $n$
    constraints: integer with $n\geq0$
Comments:
  comment-powers: >-
    The entries with $m=2,3,4,5$ are the pure quartic, sextic, octic and
    decic oscillators. The harmonic case $m=1$ is not included, because this
    convention gives the exact eigenvalues $2n+1$.
  comment-literature: >-
    The pure quartic ground state is a standard benchmark for numerical
    eigenvalue methods CITE{Blinder2019}. Sextic and octic anharmonicities
    occur in the same oscillator literature CITE{IshkhanyanLevai2020},
    CITE{PathakMandal2002}.
Formulas:
  formula-scaling: >-
    If $a>0$ and $b>0$, the eigenvalues of
    $-a y''+b x^{2m}y=E y$ are
    $a^{m/(m+1)} b^{1/(m+1)} E^{(m)}_n$.
  formula-wkb: >-
    As $n\to\infty$,
    $E^{(m)}_n\sim\left[
    \frac{\sqrt{\pi}\,\Gamma(3/2+1/(2m))}
    {\Gamma(1+1/(2m))}\left(n+\frac12\right)
    \right]^{2m/(m+1)}$.

Title: Core thresholds of random $k$-uniform hypergraphs
Definition: >-
  For integers $k\geq3$ and $r\geq2$, the $r$-core of a $k$-uniform
  hypergraph CITE{WikiHypergraph} is its largest subhypergraph in which every
  vertex lies in at least $r$ edges. The threshold $c_{k,r}$ is the edge
  density such that the random $k$-uniform hypergraph with $n$ vertices and
  $m=\lfloor cn\rfloor$ edges has, with probability tending to $1$ as
  $n\to\infty$, an empty $r$-core when $c<c_{k,r}$ and a nonempty $r$-core
  when $c>c_{k,r}$; it equals
  $\min_{\lambda>0}\lambda/(kQ(\lambda,r-1)^{k-1})$, where
  $Q(\lambda,s)=\mathbb{P}(\mathrm{Po}(\lambda)\geq s)$ CITE{Molloy}
  CITE{CainWormald}.
Keywords: peeling threshold, pure literal rule, invertible Bloom lookup table, 2-core
Parameters:
  k:
    type: Z
    title: edge size
    display: $k$
    constraints: $k\geq3$
  r:
    type: Z
    title: minimum degree of the core
    display: $r$
    constraints: $r\geq2$
Comments:
  comment-conventions: >-
    The density is $c=m/n$, edges per vertex. The average degree is $kc$;
    HREF{k-core_thresholds_of_the_Erdős_Rényi_random_graph}[$k$-core thresholds
    of the Erdos-Renyi random graph] use the graph average degree in the case
    $k=2$, and Dembo and Montanari use the inverse convention, vertices per
    edge, for $2$-cores of uniform hypergraphs CITE{DemboMontanari}.
  comment-graph-case: >-
    The rows with $k=2$ are not repeated here. For $r\geq3$, the same
    minimisation gives half of the graph $r$-core threshold in
    HREF{k-core_thresholds_of_the_Erdős_Rényi_random_graph}[the Erdos-Renyi
    table], because that table writes average degree while this table writes
    edges per vertex. For $r=2$, the graph $2$-core grows continuously from
    edge density $1/2$, while for every $k\geq3$ the hypergraph $2$-core
    appears discontinuously.
  comment-peeling: >-
    The $r=2$ rows are the obstruction thresholds for peeling processes on
    random uniform hypergraphs. In particular $c_{3,2}=0.8184691607\ldots$ is
    the $2$-core threshold of the random $3$-uniform hypergraph, and it is also
    the clustering threshold of random $3$-XORSAT CITE{DemboMontanari}
    CITE{Dietzfelbinger}.
Formulas:
  formula-tail: >-
    $Q(\lambda,s)=\mathbb{P}(\mathrm{Po}(\lambda)\geq s)
    =1-e^{-\lambda}\sum_{j=0}^{s-1}\lambda^j/j!$.
  formula-threshold: >-
    $c_{k,r}=\min_{\lambda>0}\frac{\lambda}{kQ(\lambda,r-1)^{k-1}}$ for
    $k\geq3$ and $r\geq2$ CITE{Molloy} CITE{CainWormald}.
  formula-minimiser: >-
    The minimiser $\lambda_{k,r}$ is the unique positive zero of
    $g(\lambda)=Q(\lambda,r-1)
    -(k-1)e^{-\lambda}\lambda^{r-1}/(r-2)!$. The sign of $g$ is the sign of
    the derivative of
    $\lambda/Q(\lambda,r-1)^{k-1}$, and
    $g'(\lambda)=e^{-\lambda}\lambda^{r-2}((k-1)\lambda-(k-1)(r-1)+1)/(r-2)!$,
    so $g$ decreases and then increases, with one positive zero.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      k, r = 3, 2
      Q = lambda x, s: mp.gammainc(s, 0, x, regularized=True)
      g = lambda x: Q(x, r - 1) - (k - 1) * mp.e**(-x) * x**(r - 1) / mp.factorial(r - 2)
      lam = mp.findroot(g, r)
      print(lam / (k * Q(lam, r - 1)**(k - 1)))

Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{Molloy}
    - CITE{CainWormald}
  complete: 'no'
  complete-note: >-
    it holds $c_{k,r}$ for every $3\leq k\leq8$ and $2\leq r\leq8$
  rigour details: >-
    Each entry is the value at the minimiser $\lambda_{k,r}$ of
    $f(\lambda)=\lambda/(kQ(\lambda,r-1)^{k-1})$, computed in ball arithmetic
    with 64 guard bits beyond the 100 digits written. That $\lambda_{k,r}$ is
    the unique minimiser and the minimum is global follows from the sign of
    $f'$, which is the sign of $g$ in CITE{formula-minimiser}: $g$ is negative
    before $\lambda_{k,r}$ and positive after it, so $f$ decreases and then
    increases. The computation encloses $\lambda_{k,r}$ by bisection on the
    sign of $g$ between $(r-1)-1/(k-1)$ and $4(k+r)+10$, each sign decided in
    ball arithmetic, down to a bracket of half-width $10^{-106}$ whose ends
    are then checked to give $g$ opposite signs, and evaluates $f$ on that
    bracket as a ball; the Poisson tail is the finite sum in
    CITE{formula-tail}. Before any entry was written, all values were compared
    with an mpmath computation at 120 digits that writes the tail as the
    regularised incomplete gamma function and finds the minimiser as a root of
    the numerical derivative; the extension of the generator to $k=2$ was also
    compared with the graph-core table, where it gives exactly half of each
    stored value for $3\leq r\leq8$.

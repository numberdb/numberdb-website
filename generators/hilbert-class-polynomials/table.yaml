Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  rigour details: >-
    Each polynomial is Sage's hilbert_class_polynomial (FLINT, complex
    interval arithmetic), required by the generator to agree with PARI's
    polclass, a different algorithm; to have degree equal to the number of
    reduced primitive forms counted by brute force; and to be enclosed,
    coefficient by coefficient, in balls of radius below $1/2$ by the product
    $\prod(x-j(\tau))$ over those forms computed in ComplexBallField at 1500
    bits, which determines an integer coefficient. All 150 were also compared
    with the 250 rows of the OEIS b-file of A305474.

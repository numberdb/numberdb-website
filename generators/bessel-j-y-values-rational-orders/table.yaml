Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds both $J_\nu(x)$ and $Y_\nu(x)$ for
    $\nu\in\{0,1/3,1/2,2/3,1,3/2,2,5/2,3\}$ and for every positive rational
    $x=a/b$ in lowest terms with $b\leq4$ and $x\leq5$
  rigour details: >-
    Each value was computed as a Sage real ball with arb at
    `numberdb.bits(digits, losing=64)` bits. Before the draft was created, the
    entries were checked against mpmath at 150 decimal digits, against the
    recurrence in CITE{formula-recurrence} wherever all three orders are
    stored, against CITE{formula-negative-integer-orders} for the nonnegative
    integer orders stored here, against the elementary half-order formulas in
    CITE{formula-half-order}, and against the OEIS values for $J_0(1)$
    CITE{OEISJZeroOne} and $Y_0(1)$ CITE{OEISYZeroOne}. The widest returned
    ball had radius less than $10^{-115}$ for 100 requested digits.
Display properties:

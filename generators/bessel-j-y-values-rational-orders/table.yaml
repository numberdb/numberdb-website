Title: Values of Bessel functions $J_\nu(x)$ and $Y_\nu(x)$
Definition: >-
  This table gives the real principal values of the Bessel functions
  $J_\nu(x)$ and $Y_\nu(x)$ CITE{Wiki} CITE{DLMFBesselDefinitions}, where
  $\nu\in\mathbb{Q}$ and $x\in\mathbb{Q}$ with $x>0$.
Keywords:
  - Bessel values
  - Bessel function values
  - Bessel function of the first kind
  - Bessel function of the second kind
  - Bessel J
  - Bessel Y
  - cylinder functions
  - J0(1)
  - Y0(1)
Parameters:
  function:
    type: Symbolic
    title: Bessel function
    display: function
    constraints: $J$ or $Y$
    values:
      J: $J_\nu(x)$
      Y: $Y_\nu(x)$
  nu:
    type: Q
    title: order
    display: $\nu$
    constraints: $\nu\in\mathbb{Q}$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$
Comments:
  comment-branches: >-
    The principal branches are those of CITE{DLMFBesselDefinitions}. For real
    $\nu$ and $x>0$, both $J_\nu(x)$ and $Y_\nu(x)$ are real. The point
    $x=0$ is excluded because $Y_\nu$ is singular there.
  comment-negative-orders: >-
    Negative integer orders are not listed separately; they reduce to positive
    integer orders by CITE{formula-negative-integer-orders}. For nonintegral
    negative orders, the connection formulas in CITE{DLMFConnections} express
    the values through $J_\nu(x)$ and $Y_\nu(x)$.
  comment-spherical: >-
    These are the ordinary cylindrical Bessel functions. The spherical Bessel
    functions are related by
    $\mathrm{j}_n(x)=\sqrt{\pi/(2x)}J_{n+1/2}(x)$ and
    $\mathrm{y}_n(x)=\sqrt{\pi/(2x)}Y_{n+1/2}(x)$ CITE{DLMFSpherical}.
  comment-half-integers: >-
    Half-integer orders are elementary combinations of $\sin x$ and $\cos x$.
    HREF{Bessel_polynomials}[The Bessel polynomials] occur in explicit
    formulas for the associated spherical and modified spherical functions
    CITE{DLMFSphericalExplicit}.
Formulas:
  formula-recurrence: >-
    If $C_\nu$ is either $J_\nu$ or $Y_\nu$, then
    $C_{\nu-1}(x)+C_{\nu+1}(x)=2\nu C_\nu(x)/x$ CITE{DLMFRecurrences}.
  formula-negative-integer-orders: >-
    For an integer $n$, $J_{-n}(x)=(-1)^nJ_n(x)$ and
    $Y_{-n}(x)=(-1)^nY_n(x)$ CITE{DLMFConnections}.
  formula-half-order: >-
    $J_{1/2}(x)=\sqrt{2/(\pi x)}\sin x$ and
    $Y_{1/2}(x)=-\sqrt{2/(\pi x)}\cos x$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=64))
      nu = CBF(QQ(0))
      x = CBF(QQ(1))
      # Sage's arb method is called on the argument and takes the order.
      x.bessel_J(nu).real()
      x.bessel_Y(nu).real()
  program-python:
    language: Python
    code: |-
      import mpmath

      mpmath.mp.dps = 100
      mpmath.besselj(0, 1)
      mpmath.bessely(0, 1)

Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every curve in Sage's mini Cremona database CITE{SageCremona}
    with conductor $N\leq60$, and every $n$ with $1\leq n\leq5$
  sources:
    - CITE{SageCremona}
  rigour details: >-
    The generator reads exact Weierstrass coefficients from Sage's mini
    Cremona database CITE{SageCremona} and computes the division polynomials
    by the exact recurrences in Formula CITE{formula-recurrence}, reducing
    products in the coordinate ring of $E$. It verifies every row against
    PARI/GP's exact `elldivpol` CITE{PARIelldivpol}: odd $n$ rows agree
    directly, and even $n$ rows agree after multiplying the stored $\psi_n$ by
    $2y+a_1x+a_3$, as in Formula CITE{formula-pari-convention}. It also
    verifies the expected degree and leading coefficient for every row and the
    example $\psi_3=3x^4-6x^2+3x-1$ for the curve 37a1.
Display properties:
  number-header: $\psi_n(x,y)$
  group parameters:
    - [N]
    - [c4, c6]
    - [n]
Numbers: []

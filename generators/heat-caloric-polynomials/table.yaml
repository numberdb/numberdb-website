Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every degree $m$ with $0\leq m\leq50$, and stops there because
    the entries grow: $P_{50}$ is 1016 characters, and $P_{60}$ would be 1425
  rigour details: >-
    The generator computes CITE{formula-recurrence} over Sage's integer
    polynomial ring. The values were checked against CITE{formula-explicit},
    against the heat equation, against the normalization $P_m(x,0)=x^m$,
    against the parabolic homogeneity identity CITE{formula-homogeneous}, and
    against the specialization to
    HREF{Hermite_polynomials_He}[probabilists' Hermite polynomials] in
    CITE{formula-hermite}.
Display properties:
  number-header: $P_m(x,t)$

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds $W_0(x)$ for every positive rational $x=a/b$ in lowest
    terms with $b\leq6$ and $x\leq10$, and it holds both $W_0(x)$ and
    $W_{-1}(x)$ for every negative rational $x=a/b$ in lowest terms with
    $b\leq10$ and $-e^{-1}<x<0$; the exact value $W_0(0)=0$ is omitted
  rigour details: Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=64)` bits, then returned as a real ball after
    checking that its imaginary part contained zero. The entries were checked
    against mpmath at 150 decimal digits, against the defining equation in
    CITE{formula-defining-equation}, against the branch inequalities in the
    branch comment, and against the OEIS value for $\Omega=W_0(1)$
    CITE{OEISOmega}. The widest returned ball had radius less than $10^{-118}$
    for 100 requested digits.
Display properties:
  number-header: value

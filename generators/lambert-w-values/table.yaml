Title: Values of the Lambert $W$ function
Definition: The Lambert $W$ function is the multivalued inverse of
  $w\mapsto we^w$ CITE{WikiLambert} CITE{DLMFLambert}. This table gives real
  values of the principal branch $W_0(x)$ and the lower real branch
  $W_{-1}(x)$ at rational arguments where those branches are real.
Keywords:
- Lambert W
- Lambert W function
- omega constant
- product logarithm
- ProductLog
- W(1)
Parameters:
  branch:
    type: Symbolic
    title: branch
    display: branch
    values:
      0: $W_0(x)$
      -1: $W_{-1}(x)$
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x\in\mathbb{Q}$; for branch $0$, $x>-e^{-1}$; for branch
      $-1$, $-e^{-1}<x<0$
Comments:
  comment-branches: The branch convention is that of CITE{DLMFLambert}. On
    $x\geq0$ the principal branch is the nonnegative real solution. On
    $-e^{-1}<x<0$, the principal branch satisfies $-1<W_0(x)<0$, while the
    lower real branch satisfies $W_{-1}(x)<-1$. The other branches are complex
    and are not stored here.
  comment-productlog: Wolfram Language calls the same function ProductLog
    CITE{MathWorldLambert}.
  comment-exact-values: The exact value $W_0(0)=0$ is not listed. The branch
    point $x=-e^{-1}$ has value $-1$, and $W_0(e)=1$, but neither argument is
    rational.
Formulas:
  formula-defining-equation: $W_k(x)e^{W_k(x)}=x$ CITE{DLMFLambert}.
  formula-branch-inverse: If $y\geq-1$, then $W_0(ye^y)=y$. If $y\leq-1$,
    then $W_{-1}(ye^y)=y$ CITE{DLMFLambert}.
  formula-omega: The omega constant is $\Omega=W_0(1)$ and satisfies
    $e^{-\Omega}=\Omega$ CITE{WikiOmega} CITE{OEISOmega}.
Programs:
  program-sage:
    language: Sage
    code: 'import numberdb.sage as numberdb

      from sage.rings.complex_arb import ComplexBallField

      from sage.rings.rational_field import QQ


      CBF = ComplexBallField(numberdb.bits(100, losing=64))

      x = CBF(QQ(1))


      x.lambert_w(0).real()'
  program-python:
    language: Python
    code: 'import mpmath


      mpmath.mp.dps = 100

      mpmath.lambertw(1, 0)'
Similar tables:
- table: HREF{E}[Euler's constant $e$]
  relation: the Lambert $W$ function is the inverse of $w\mapsto we^w$, and
    $W_0(1)$ is the fixed point of $x\mapsto e^{-x}$
- table: HREF{Golden_ratio}[Golden ratio]
  relation: the omega constant is the fixed point for exponentiation that is
    often compared with the golden ratio's algebraic fixed-point equation

# Draft document for T361, the real regular solid harmonics proposed in
# numberdb-data#168. Publishing is a person's act.
Title: Real regular solid harmonics $R_{\ell m}(x,y,z)$
Definition: >-
  The real regular solid harmonics $R_{\ell m}(x,y,z)$ are homogeneous
  harmonic polynomials in $x,y,z$ obtained from the regular solid harmonics
  by taking real sine and cosine angular parts CITE{Wiki}.
Parameters:
  l:
    type: Z
    title: degree
    display: $\ell$
    constraints: $\ell\geq0$
  m:
    type: Z
    title: signed order
    display: $m$
    constraints: $|m|\leq\ell$
Comments:
  comment-convention: >-
    This table uses the unnormalised real convention with
    $R_{1,1}=x$, $R_{1,-1}=y$ and $R_{1,0}=z$. Nonnegative $m$ gives
    the cosine mode and negative $m$ gives the sine mode. The angle
    $\varphi$ is measured anticlockwise from the positive $x$-axis, as in
    HREF{T251}[the Zernike polynomial table].
  comment-phase: >-
    The table drops the Condon-Shortley phase carried by
    HREF{T360}[the associated Legendre polynomials]. Equivalently, it
    multiplies the associated Legendre function $P_\ell^{|m|}$ from
    that table by $(-1)^{|m|}$ in CITE{formula-associated-legendre}.
  comment-dlmf: >-
    DLMF writes the Ferrers function $\mathsf{P}_\ell^m$ without the
    Condon-Shortley phase, so values read from DLMF 14.7 have the sign
    convention used here rather than the sign convention of
    HREF{T360}[the associated Legendre table] CITE{DLMF}.
Formulas:
  formula-associated-legendre: >-
    With $r^2=x^2+y^2+z^2$, $x=r\sin\theta\cos\varphi$,
    $y=r\sin\theta\sin\varphi$ and $z=r\cos\theta$,
    $R_{\ell 0}=r^\ell P_\ell(z/r)$, while for $m>0$,
    $R_{\ell m}=(-1)^m r^\ell P_\ell^m(z/r)\cos(m\varphi)$ and
    $R_{\ell,-m}=(-1)^m r^\ell P_\ell^m(z/r)\sin(m\varphi)$.
  formula-harmonic: >-
    Each $R_{\ell m}$ is homogeneous of degree $\ell$ and satisfies
    $\left(\partial_x^2+\partial_y^2+\partial_z^2\right)R_{\ell m}=0$.
  formula-orthogonality: >-
    On the unit sphere, distinct entries are orthogonal. The squared norm is
    $\int_{S^2}R_{\ell 0}^2\,d\Omega=4\pi/(2\ell+1)$ for $m=0$, and
    $\int_{S^2}R_{\ell m}^2\,d\Omega
    =2\pi(\ell+|m|)!/((2\ell+1)(\ell-|m|)!)$ for $m\ne0$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing
      from sage.rings.rational_field import QQ

      U = PolynomialRing(QQ, 'u')
      u = U.gen()
      P = [U.one(), u]
      for l in range(1, 17):
          P.append(((2*l + 1)*u*P[l] - l*P[l - 1]) * (QQ(1)/QQ(l + 1)))
      P[17]                         # the last Legendre polynomial used here
Links:
  Wiki:
    title: 'Wikipedia: Solid harmonics'
    url: https://en.wikipedia.org/wiki/Solid_harmonics
  DLMF:
    title: 'DLMF 14.30: Spherical and spheroidal harmonics'
    url: https://dlmf.nist.gov/14.30
Similar tables:
  - table: HREF{T360}[Associated Legendre polynomials $P_\ell^m$]
    relation: the defining relation CITE{formula-associated-legendre} uses the associated Legendre polynomials, with the Condon-Shortley phase cancelled
  - table: HREF{T251}[Zernike polynomials $Z_n^l$]
    relation: both tables use the same real sine and cosine convention for signed angular modes
  - table: HREF{Legendre_polynomials}[Legendre polynomials]
    relation: the $m=0$ rows are homogenisations $r^\ell P_\ell(z/r)$ of the Legendre polynomials
Keywords:
  - real solid harmonics
  - regular solid harmonics
  - spherical harmonics
  - tesseral harmonics
  - harmonic homogeneous polynomials
Tags:
  - special functions
  - polynomial
  - orthogonal polynomials
Data properties:
  type: Q[]
  rigour: exact
  complete: no
  complete-note: >-
    it holds every row with $0\leq\ell\leq17$ and $|m|\leq\ell$; the
    cutoff keeps the longest entry at 1130 characters, while degree $18$
    would make a 1378-character row
  rigour details: >-
    Every entry is exact, a polynomial over $\mathbb{Q}$ in $x,y,z$. The
    generator computes the Legendre polynomials by Bonnet's recurrence over
    $\mathbb{Q}$, differentiates them, and applies
    CITE{formula-associated-legendre}.

    Before entries are written, the generator checks the degree-one and
    degree-two rows, CITE{formula-harmonic}, the value on the $z$-axis, and
    the exact unit-sphere orthogonality and norms in
    CITE{formula-orthogonality} for every stored row. It also reads
    HREF{T360}[the associated Legendre table] and checks
    CITE{formula-associated-legendre} against every stored row with
    $\ell\leq17$.
Display properties:
  number-header: $R_{\ell m}(x,y,z)$

Data properties:
  type: Q
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds $G=U,O,USp$ for every positive integer $1\leq k\leq12$
  rigour details: >-
    The generator evaluates the factorial products in CITE{formula-unitary},
    CITE{formula-symplectic}, and CITE{formula-orthogonal} over $\mathbb Q$.
    Before the draft was filled, the unitary rows were checked against the
    printed values $1,2,42,24024,701149020$, and the symplectic and orthogonal
    rows were checked by extracting the leading terms from the corresponding
    CFKRS random-matrix moment formulas after the conductor normalisation.

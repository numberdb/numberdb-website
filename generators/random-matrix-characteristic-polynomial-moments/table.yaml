# Draft document for T379, Moments of the characteristic polynomials of
# unitary, orthogonal and symplectic matrices. It was created through the API
# with X-Draft: yes and Numbers: [] so generate.py can fill it once.
# Publishing is a person's act.
Title: Moments of the characteristic polynomials of unitary, orthogonal and symplectic matrices
Definition: >-
  For positive integer $k$ and compact symmetry type $G\in\{U,O,USp\}$,
  $g_G(k)=e_G(k)! f_G(k)$ is the exact rational CFKRS random-matrix factor
  for characteristic-polynomial moments CITE{CFKRS}. The parameter $G$
  chooses which symmetry type the same factor is attached to.
Keywords:
  - random matrix factor
  - characteristic polynomial moment
  - unitary group
  - orthogonal group
  - symplectic group
  - Keating-Snaith
  - CFKRS
Parameters:
  group:
    type: Symbolic
    title: matrix group
    display: $G$
    values:
      U: $U$
      O: $O$
      USp: $USp$
  k:
    type: Z
    title: moment parameter
    display: $k$
    constraints: $k\geq1$
Comments:
  comment-indexing: >-
    The parameter is $k$, not the full unitary exponent $2k$: $k=1$ is the
    second moment in the unitary zeta-family normalisation and $k=2$ is the
    fourth moment.
  comment-integer-k: >-
    The product formulas CITE{formula-unitary} through CITE{formula-orthogonal}
    are the exact CFKRS factors for positive integer $k$. The half-integer rows
    used by the Euler-product tables in this family are not included here.
Formulas:
  formula-factor: >-
    $f_G(k)=g_G(k)/e_G(k)!$ is the random-matrix factor in the leading term,
    with $e_U(k)=k^2$, $e_O(k)=k(k-1)/2$, and $e_{USp}(k)=k(k+1)/2$.
  formula-unitary: >-
    $g_U(k)=k^2!\prod_{j=0}^{k-1}\frac{j!}{(k+j)!}$. Thus
    $g_U(1),g_U(2),g_U(3),g_U(4),g_U(5)=1,2,42,24024,701149020$
    CITE{CFKRS}.
  formula-symplectic: >-
    $g_{USp}(k)=\left(k(k+1)/2\right)!\prod_{j=1}^{k}\frac{j!}{(2j)!}$
    CITE{CFKRS}.
  formula-orthogonal: >-
    $g_O(k)=2^{k-1}\left(k(k-1)/2\right)!\prod_{j=1}^{k-1}\frac{j!}{(2j)!}$
    CITE{CFKRS}.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.arith.misc import factorial
      from sage.rings.rational_field import QQ

      k = 5
      QQ(factorial(k*k)) * prod(
          QQ(factorial(j)) / QQ(factorial(k+j))
          for j in range(k))
Similar tables:

Title: Independence polynomials of trees
Definition: >-
  The independence polynomial $I(T,x)$ of a tree $T$ is
  $I(T,x)=\sum_{k=0}^{\alpha(T)} s_k x^k$, where $s_k$ is the number of
  independent vertex sets of $T$ with $k$ vertices and $\alpha(T)$ is the
  independence number CITE{MathWorld}. The table stores this polynomial in
  $\mathbb{Z}[x]$.
Keywords:
  - independent set polynomial
  - stable set polynomial
  - hard-core
  - Merrifield-Simmons index
Parameters:
  g:
    type: Symbolic
    title: tree
    constraints: a tree, named by its canonical graph6 string
    display: $T$
Comments:
  comment-graph6: >-
    Trees are named by their graph6 string CITE{Graph6}, McKay's compact
    encoding, taken after a canonical relabelling so that the name depends on
    the tree and not on how its vertices happen to be numbered. Recover the
    tree in Sage with $\texttt{Graph(name)}$.
  comment-range: >-
    The table stores trees rather than arbitrary connected graphs. The
    independence polynomial of a forest is the product of the independence
    polynomials of its connected components.
  comment-index: >-
    The value at $x=1$ is the number of independent vertex sets of $T$, also
    called the Merrifield-Simmons index.
  comment-shared-values: >-
    Some nonisomorphic trees have the same independence polynomial; entry
    comments name the other trees in this table when they do.
Formulas:
  formula-delete-neighbourhood: >-
    $I(G,x)=I(G-v,x)+xI(G-N[v],x)$ for a vertex $v$, where $N[v]$ is the
    closed neighbourhood of $v$.
  formula-disjoint-union: >-
    $I(G\sqcup H,x)=I(G,x)I(H,x)$.
  formula-line-graph: >-
    The matching-generating polynomial $M(G,x)$ of a graph $G$ equals
    $I(L(G),x)$, where $L(G)$ is the line graph and $M(G,x)$ is the generating
    form in HREF{Matching_polynomials_of_connected_graphs}[the matching
    polynomial table].
  formula-paths: >-
    For the path graph $P_n$,
    $I(P_n,x)=x^{(n+1)/2}F_{n+2}(x^{-1/2})$, where $F_n$ is the
    HREF{Fibonacci_polynomials}[Fibonacci polynomial] with $F_0=0$ and
    $F_1=1$.
  formula-stars: >-
    For the star $K_{1,n-1}$, $I(K_{1,n-1},x)=x+(1+x)^{n-1}$.
Programs:
  program-sage:
    language: Sage
    code: |-
      G = Graph('F@HSO')        # the path P_7, by its name here
      R.<x> = ZZ[]
      sum(x**len(S) for S in Subsets(G.vertices())
          if G.subgraph(S).num_edges() == 0)
Similar tables:
  - table: HREF{Matching_polynomials_of_connected_graphs}[Matching polynomials of connected graphs]
    relation: the matching-generating polynomial $M(G,x)$ is the independence polynomial of the line graph $L(G)$
  - table: HREF{Entropy_constants_of_lattice_models#hard-core}[the hard-core entry of the lattice entropy table]
    relation: the finite hard-core partition function of a graph is its independence polynomial evaluated at the fugacity
  - table: HREF{Fibonacci_polynomials}[Fibonacci polynomials]
    relation: gives the path cases by formula CITE{formula-paths}
  - table: HREF{Chromatic_polynomials_of_connected_graphs}[Chromatic polynomials of connected graphs]
    relation: uses the same canonical graph6 naming convention for connected graphs
  - table: HREF{Tutte_polynomials_of_connected_graphs}[Tutte polynomials of connected graphs]
    relation: uses the same canonical graph6 naming convention for connected graphs

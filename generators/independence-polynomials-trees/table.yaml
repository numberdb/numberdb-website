Tags:
  - polynomial
  - combinatorics
  - statistical mechanics
Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every tree on at most twelve vertices, 987 of them; adding the 1301 trees on thirteen vertices would exceed the soft entry limit
  rigour details: >-
    An exact value, namely a polynomial with integer coefficients, so there is
    no precision to choose. The generator enumerates trees with
    $1\leq |V(T)|\leq12$ using Sage, takes each tree's canonical graph6
    string, counts independent vertex sets exactly, and forms the polynomial
    over $\mathbb{Z}[x]$. The build checks the enumeration counts, the
    deletion-neighbourhood recurrence, agreement with the clique polynomial of
    the complement, the path and star formulas, and the line-graph relation to
    matching polynomials where the line graph is in range.
Display properties:
  number-header: $I(T,x)$

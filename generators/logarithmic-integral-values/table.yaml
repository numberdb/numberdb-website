# The table document for T191, Values of the logarithmic integral $\operatorname{li}(x)$. It began as proposal 5 of
# agents/table-ideas/BATCH-2026-09-09T1936.md, which put seven
# functions in one table; they are six tables now, one per named
# function, and the relations between them are in `Similar tables`.
Title: Values of the logarithmic integral $\operatorname{li}(x)$
Definition: For $x>0$ with $x\neq1$ the logarithmic integral is the principal
  value $\operatorname{li}(x)=\operatorname{PV}\!\int_0^x \mathrm{d}t/\log t$
  CITE{DLMFIntegralDefinitions}. This table holds it at rational $x$.
Keywords:
- logarithmic integral
- li
- offset logarithmic integral
- Li
- li(2)
- Ramanujan-Soldner constant
Parameters:
  x:
    type: Q
    title: argument
    display: $x$
    constraints: $x>0$, $x\ne1$
Comments:
  comment-offset-li: Riemann's offset logarithmic integral satisfies $\operatorname{Li}(x)=\operatorname{li}(x)-\operatorname{li}(2)$
    for $x>1$ CITE{WikiLogarithmic}.
Formulas:
  formula-li: For $x>0$ and $x\ne1$, $\operatorname{li}(x)=\operatorname{PV}\!\int_0^x
    \mathrm{d}t/\log t=\operatorname{Ei}(\log x)$ CITE{DLMFIntegralDefinitions}.
Programs:
  program-sage:
    language: Sage
    code: "import numberdb.sage as numberdb\nfrom sage.rings.rational_field import\
      \ QQ\nfrom sage.rings.real_arb import RealBallField\n\nRBF = RealBallField(numberdb.bits(100,\
      \ losing=64))\nx = RBF(QQ(1))\nx.Ei()\n-RBF(-QQ(1)).Ei()\nRBF(QQ(2)).log_integral()\n\
      x.Si()\nx.Ci()\nx.Shi()\nx.Chi()\n      RBF(QQ(2)).log_integral()"
  program-python:
    language: Python
    code: "import mpmath\n\nmpmath.mp.dps = 100\nmpmath.ei(1)\nmpmath.e1(1)\n\
      mpmath.li(2)\nmpmath.si(1)\nmpmath.ci(1)\nmpmath.shi(1)\nmpmath.chi(1)\n\
      \      mpmath.li(2)"
Similar tables:
- table: HREF{Values_of_the_exponential_integral}[Values of the exponential integral]
  relation: $\operatorname{li}(x)=\operatorname{Ei}(\log x)$ CITE{formula-li}
- table: HREF{Gibbs_constant}[Wilbraham-Gibbs constant]
  relation: stores $\operatorname{Si}(\pi)$ and its normalisations
- table: HREF{Stieltjes_constants}[Stieltjes constants]
  relation: contains $\gamma_0$, the Euler-Mascheroni constant appearing in $\operatorname{Ei}$,
    $\operatorname{Ci}$ and $\operatorname{Chi}$

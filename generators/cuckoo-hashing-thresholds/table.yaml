Title: Cuckoo hashing thresholds of random $k$-uniform hypergraphs
Definition: >-
  Let $H_{n,\lfloor cn\rfloor,k}$ be the random $k$-uniform hypergraph
  CITE{WikiHypergraph} on $n$ vertices. The number $c^*_{k,\ell}$ is the
  threshold density for $\ell$-orientability of
  $H_{n,\lfloor cn\rfloor,k}$, equivalently the load threshold for offline
  cuckoo hashing CITE{WikiCuckoo} with $k$ choices and bucket capacity $\ell$
  CITE{FKP} CITE{DGMMPR}.
Keywords: orientability threshold, load threshold, multiple-choice hashing, balanced allocation
Parameters:
  k:
    type: Z
    title: number of choices
    display: $k$
    constraints: $k\geq2$
  ell:
    type: Z
    title: bucket capacity
    display: $\ell$
    constraints: $\ell\geq1$
Comments:
  comment-orientation: >-
    An $\ell$-orientation assigns each edge to one of its vertices so that no
    vertex receives more than $\ell$ edges. In hashing language, edges are
    keys and vertices are buckets.
  comment-conventions: >-
    The density is $c=m/n$, keys per bucket. The average hypergraph degree is
    $kc$, and the fraction of bucket capacity used is $c/\ell$. Dietzfelbinger,
    Goerdt, Mitzenmacher, Montanari, Pagh and Rink tabulate the same values
    with an index larger by one: their row labelled $\ell+1$ is this table's
    bucket capacity $\ell$ CITE{DGMMPR}.
  comment-capacity-one: >-
    For $\ell=1$ and $k\geq3$, the thresholds are equal to the satisfiability
    thresholds of random $k$-XORSAT CITE{DGMMPR}. The row $k=2$, $\ell=1$ is
    the ordinary two-choice cuckoo hashing threshold $1/2$, where the cuckoo
    graph is a pseudoforest CITE{WikiCuckoo}.
  comment-core: >-
    The obstruction is the $(\ell+1)$-core: at the threshold its asymptotic
    edge density is $\ell$ CITE{FKP}.
Formulas:
  formula-tail: >-
    $Q(x,s)=\mathbb{P}(\mathrm{Po}(x)\geq s)
    =1-e^{-x}\sum_{j=0}^{s-1}x^j/j!$.
  formula-root: >-
    Except for $c^*_{2,1}=1/2$, the value $\xi_{k,\ell}$ is the positive
    solution of
    $k\ell=\xi_{k,\ell}Q(\xi_{k,\ell},\ell)/Q(\xi_{k,\ell},\ell+1)$.
  formula-threshold: >-
    $c^*_{k,\ell}=\xi_{k,\ell}/(kQ(\xi_{k,\ell},\ell)^{k-1})$ for
    $(k,\ell)\neq(2,1)$, and $c^*_{2,1}=1/2$ CITE{FKP} CITE{DGMMPR}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      k, ell = 3, 1
      Q = lambda x, s: mp.gammainc(s, 0, x, regularized=True)
      if (k, ell) == (2, 1):
          print(mp.mpf(1) / 2)
      else:
          g = lambda x: x * Q(x, ell) / Q(x, ell + 1) - k * ell
          xi = mp.findroot(g, k * ell)
          print(xi / (k * Q(xi, ell)**(k - 1)))

Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{FKP}
    - CITE{DGMMPR}
    - CITE{CainSandersWormald}
  complete: 'no'
  complete-note: >-
    it holds $c^*_{k,\ell}$ for every $2\leq k\leq7$ and
    $1\leq\ell\leq6$
  rigour details: >-
    Each inexact entry is computed in ball arithmetic with 64 guard bits beyond
    the 100 digits written. The root $\xi_{k,\ell}$ is enclosed by bisection on
    the sign of
    $\xi Q(\xi,\ell)/Q(\xi,\ell+1)-k\ell$, down to a bracket of half-width
    $10^{-106}$ whose ends are checked to give opposite signs; the value of
    $\xi/(kQ(\xi,\ell)^{k-1})$ on that bracket is the stored ball. The entry
    $c^*_{2,1}=1/2$ is exact. The generator also compares every inexact row
    with an mpmath computation at 120 digits that writes $Q$ as the
    regularised incomplete gamma function, and compares all rows in the
    printed range with the ten-decimal table in CITE{DGMMPR}, using the
    source's index shift described in the comments.
Display properties:

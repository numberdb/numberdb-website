Title: Canonical modular polynomials $\Phi^c_\ell$
Definition: >-
  Let $\mathfrak m_\ell$ be the eta quotient in
  Formula CITE{formula-eta-quotient}. Listed is the primitive polynomial
  $\Phi^c_\ell(x,y)\in\mathbb Z[x,y]$ satisfying
  $\Phi^c_\ell(\mathfrak m_\ell(\tau),j(\tau))=0$, normalised so that the
  coefficient of $x^{\ell+1}$ is $1$.
Parameters:
  ell:
    type: Z
    title: prime level
    display: $\ell$
    constraints: $\ell$ is prime
Comments:
  comment-convention: >-
    The eta quotient includes the factor $\ell^s$. With this convention the
    Fricke involution sends $\mathfrak m_\ell$ to $\ell^s/\mathfrak m_\ell$,
    and the polynomial is PARI/GP's canonical modular equation when
    `ellmodulareqn` returns type $0$ CITE{PARIellmodulareqn}.
  comment-reciprocal: >-
    The quotient $(\eta(\tau)/\eta(\ell\tau))^{2s}$ gives the reciprocal
    convention in $x$, not another entry of this table.
  comment-degree: >-
    For $v=s(\ell-1)/12$, the degree in $x$ is $\ell+1$ and the degree in
    $y$ is $v$. Each entry's comment gives $v$.
Formulas:
  formula-eta-quotient: >-
    For a prime $\ell$, put $s=12/\gcd(12,\ell-1)$ and
    $\mathfrak m_\ell(\tau)=\ell^s(\eta(\ell\tau)/\eta(\tau))^{2s}$,
    where $\eta$ is Dedekind's eta function CITE{DLMFEta}.
  formula-degree: >-
    If $v=s(\ell-1)/12$, then
    $\deg_x\Phi^c_\ell=\ell+1$ and $\deg_y\Phi^c_\ell=v$.
  formula-fricke: >-
    The Fricke involution gives
    $\mathfrak m_\ell(-1/(\ell\tau))=\ell^s/\mathfrak m_\ell(\tau)$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      E = ellmodulareqn(13);
      E[2] == 0        \\ true for a canonical equation
      E[1]

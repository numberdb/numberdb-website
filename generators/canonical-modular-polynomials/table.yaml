Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: it holds every prime $\ell\leq43$
  rigour details: >-
    The generator computes exact $q$-expansions of $\mathfrak m_\ell$ and
    $j$ and finds the one-dimensional rational kernel among the monomials
    $x^a y^b$ with $0\leq a\leq\ell+1$ and $0\leq b\leq v$, where
    $v=s(\ell-1)/12$. It truncates beyond the total pole order
    $v(2\ell+2)$ of such a relation on $X_0(\ell)$, so a relation whose
    $q$-expansion vanishes that far is identically zero. Each resulting
    primitive polynomial is required to have integer coefficients and leading
    coefficient $1$ in $x^{\ell+1}$. The rows in the stored range for
    $\ell=2,3,5,7,13,37$ were compared with PARI/GP's canonical
    `ellmodulareqn` data where that data has type $0$. For
    $\ell=2,3,5,7,11$, eliminating the eta quotient was checked against
    HREF{Modular_polynomials_for_j-invariant}[the stored classical modular
    polynomial].
Display properties:
  number-header: $\Phi^c_\ell(x,y)$

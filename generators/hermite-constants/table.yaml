Title: Hermite's constants $\gamma_n$
Definition: >-
  Hermite's constant $\gamma_n$ CITE{WikiHermite} is the supremum of the
  HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[Hermite number]
  $\gamma(L)=\mu(L)/(\det L)^{1/n}$ over all lattices
  $L\subset\mathbb{R}^n$, where $\mu(L)$ is the squared length of a shortest
  nonzero vector of $L$ and $\det L$ is the determinant of a Gram matrix of
  $L$.
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: $n\geq 1$
Comments:
  comment-conventions: >-
    $\det L$ is the square of the covolume of $L$, so $\sqrt{\gamma_n}$ is
    the greatest length a shortest nonzero vector of a lattice of covolume
    $1$ in $\mathbb{R}^n$ can have; in the language of quadratic forms,
    $\gamma_n$ is the least constant such that every positive definite
    quadratic form in $n$ variables with discriminant $d$ takes a value at
    most $\gamma_n d^{1/n}$ at some nonzero integer point CITE{Cassels}. The
    supremum is attained CITE{Cassels}. Some authors call $\sqrt{\gamma_n}$
    Hermite's constant, the ratio of lengths rather than of norms
    CITE{WikiHermite}, and $\gamma(L)$ is also called the Hermite invariant
    of $L$; the Hermite numbers of $\mathbb{Z}^n$, the root lattices, their
    duals, the laminated lattices and the Coxeter–Todd lattice are in the
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[table of the classical lattices],
    whose notation this table follows.
  comment-known: >-
    $\gamma_n$ is known for $n\leq 8$ and $n=24$ and in no other dimension
    CITE{WikiHermite}: by Lagrange for $n=2$ CITE{Lagrange}, Gauss for
    $n=3$ CITE{Gauss}, Korkine and Zolotareff for $n=4,5$ CITE{KZ},
    Blichfeldt for $n=6,7,8$ CITE{Blichfeldt} and Cohn and Kumar for $n=24$
    CITE{CohnKumar}, attained by $\mathbb{Z}$, $A_2$, $A_3$, $D_4$, $D_5$,
    $E_6$, $E_7$, $E_8$ and the Leech lattice $\Lambda_{24}$. In every other
    dimension the best lower bound known is the Hermite number
    $4\,\delta_n^{2/n}$ of the densest lattice known, whose centre density
    $\delta_n$ is in the
    HREF{Densities_of_the_densest_known_lattice_sphere_packings}[table of the densest known lattice packings]
    for $n\leq 48$, and upper bounds come from the linear programming bound
    of Cohn and Elkies CITE{CohnElkies}. $\gamma_n$ grows linearly in $n$:
    $\frac{1}{2\pi e}\leq\frac{\gamma_n}{n}\leq\frac{1.744\ldots}{2\pi e}$
    for all sufficiently large $n$ CITE{MathWorld}, the lower bound from
    Minkowski and Hlawka and the upper bound from Kabatiansky and
    Levenshtein CITE{KL}.
  comment-entries: >-
    The comment on each entry gives $\gamma_n$ in closed form, the rational
    number $\gamma_n^{\,n}$ and the lattice attaining $\gamma_n$, and every
    entry links the row of the
    HREF{Packing_densities_and_Hermite_numbers_of_the_classical_lattices}[table of the classical lattices]
    holding the Hermite number of that lattice.
Formulas:
  formula-values: >-
    $\gamma_n^{\,n}=1,\ \frac{4}{3},\ 2,\ 4,\ 8,\ \frac{64}{3},\ 64,\ 256$ for
    $n=1,\ldots,8$ CITE{OEISnum} CITE{OEISden} and $\gamma_{24}^{\,24}=4^{24}$,
    so $\gamma_n=1,\ \frac{2}{\sqrt{3}},\ 2^{1/3},\ \sqrt{2},\ 2^{3/5},\ \frac{2}{3^{1/6}},\ 2^{6/7},\ 2$
    for $n=1,\ldots,8$ and $\gamma_{24}=4$.
  formula-lattices: >-
    $\gamma_n=\max_L\gamma(L)$ with $\gamma(L)=\mu(L)/(\det L)^{1/n}$, so
    $\gamma_n^{\,n}=\mu(L)^n/\det L$ for a lattice $L$ attaining it:
    $\gamma_n^{\,n}=2^n/\det L$ for the root lattices $A_2$, $A_3$, $D_4$,
    $D_5$, $E_6$, $E_7$, $E_8$ of minimal norm $2$ and determinant $3$, $4$,
    $4$, $4$, $3$, $2$, $1$, and $\gamma_{24}^{\,24}=4^{24}$ for the Leech
    lattice, of minimal norm $4$ and determinant $1$.
  formula-density: >-
    $\gamma_n=4\,\delta_n^{2/n}=4\,(\Delta_n/V_n)^{2/n}$, where $\Delta_n$
    and $\delta_n$ are the density and the centre density of the densest
    lattice sphere packing in $\mathbb{R}^n$, in the
    HREF{Densities_of_the_densest_known_lattice_sphere_packings}[table of the densest known lattice packings],
    and $V_n=\pi^{n/2}/\Gamma(n/2+1)$ is the
    HREF{Volume_of_the_unit_ball}[volume of the unit ball].
  formula-bounds: >-
    Hermite's inequality $\gamma_n\leq\left(\frac{4}{3}\right)^{(n-1)/2}$
    CITE{Hermite}, an equality for $n=1,2$; Minkowski's bound
    $\gamma_n\leq 4\,V_n^{-2/n}$, since $\Delta_n\leq 1$, an equality for
    $n=1$; Blichfeldt's bound
    $\gamma_n\leq\frac{2}{\pi}\,\Gamma\!\left(2+\frac{n}{2}\right)^{2/n}$
    CITE{Blichfeldt1929}; and Mordell's inequality
    $\gamma_n^{\,n-2}\leq\gamma_{n-1}^{\,n-1}$ for $n\geq 3$ CITE{Mordell},
    an equality for $n=4$ and $n=8$.
Programs:
  program-sage:
    language: Sage
    code: |-
      hermite = {1: 1, 2: 4/3, 3: 2, 4: 4, 5: 8, 6: 64/3, 7: 64, 8: 256, 24: 4^24}   # gamma_n^n
      {n: N(g^(1/n), digits=30) for n, g in hermite.items()}                        # gamma_n
      G = CartanMatrix(['E', 6]); n = 6
      IntegralLattice(G).minimum() / G.det()^(1/n)                                  # 2/3^(1/6) = gamma_6

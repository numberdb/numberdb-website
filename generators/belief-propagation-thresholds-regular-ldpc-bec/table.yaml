Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{KRU}
    - CITE{RichardsonUrbanke}
  complete: 'no'
  complete-note: >-
    it holds $\epsilon^{\mathrm{BP}}_{l,r}$ for every pair with
    $3\leq l<r\leq12$
  rigour details: >-
    Each entry is computed in ball arithmetic with 64 guard bits beyond the
    100 digits written. The root $x^{\mathrm{BP}}_{l,r}$ is enclosed by
    bisection on the sign of $p^{\mathrm{BP}}_{l,r}(x)$ between $0$ and $1$,
    down to a bracket of half-width $10^{-106}$ whose ends are checked to give
    opposite signs; the value of
    $x/(1-(1-x)^{r-1})^{l-1}$ on that bracket is the stored ball. The
    generator also compares every row with an mpmath minimisation of
    $\epsilon(x)$ on $(0,1]$, and compares the $(3,6)$ row with the printed
    value $0.42944$ in CITE{KRU}.
Display properties:
  number-header: $\epsilon^{\mathrm{BP}}_{l,r}$

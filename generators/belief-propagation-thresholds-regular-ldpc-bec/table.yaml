Title: Belief-propagation thresholds of regular LDPC codes on the binary erasure channel
Definition: >-
  For integers $3\leq l<r$, the regular $(l,r)$ low-density parity-check
  ensemble CITE{WikiLDPC} has variable degree $l$ and check degree $r$.
  The number $\epsilon^{\mathrm{BP}}_{l,r}$ is the binary erasure channel
  CITE{WikiBEC} erasure probability at the belief-propagation decoding
  threshold of this ensemble CITE{KRU}.
Keywords: Gallager codes, density evolution, iterative decoding, coding theory
Parameters:
  l:
    type: Z
    title: variable degree
    display: $l$
    constraints: $l\geq3$
  r:
    type: Z
    title: check degree
    display: $r$
    constraints: $r>l$
Comments:
  comment-conventions: >-
    The value stored here is the channel erasure probability $\epsilon$, not
    the constraint density. The parity-check density of the ensemble is
    $m/n=l/r$, and its design rate is $1-l/r$ when the checks are independent.
  comment-l2: >-
    There are no $l=2$ rows. In that degree-two variable-node case the
    density-evolution threshold is the stability value $1/(r-1)$, so these
    exact values are left to the comment rather than repeated as entries.
  comment-threshold: >-
    At the threshold with $l\geq3$, density evolution has a nonzero double
    fixed point $x^{\mathrm{BP}}_{l,r}$; each entry comment gives this root.
Formulas:
  formula-density-evolution: >-
    The density-evolution fixed point equation on the binary erasure channel
    is
    $x=\epsilon(1-(1-x)^{r-1})^{l-1}$ CITE{KRU}.
  formula-threshold-curve: >-
    For $0<x\leq1$, write
    $\epsilon(x)=x/(1-(1-x)^{r-1})^{l-1}$.
  formula-root: >-
    The root $x^{\mathrm{BP}}_{l,r}$ is the positive solution of
    $p^{\mathrm{BP}}_{l,r}(x)=0$, where
    $p^{\mathrm{BP}}_{l,r}(x)=((l-1)(r-1)-1)(1-x)^{r-2}
    -\sum_{i=0}^{r-3}(1-x)^i$ CITE{KRU}.
  formula-threshold: >-
    The threshold is
    $\epsilon^{\mathrm{BP}}_{l,r}=\epsilon(x^{\mathrm{BP}}_{l,r})$
    CITE{KRU}.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp
      mp.dps = 50
      l, r = 3, 6
      def p(x):
          y = 1 - x
          return ((l - 1) * (r - 1) - 1) * y**(r - 2) - mp.fsum(y**i for i in range(r - 2))
      lo, hi = mp.mpf("0"), mp.mpf("1")
      for _ in range(200):
          mid = (lo + hi) / 2
          if p(mid) > 0:
              lo = mid
          else:
              hi = mid
      x = (lo + hi) / 2
      print(x / (1 - (1 - x)**(r - 1))**(l - 1))

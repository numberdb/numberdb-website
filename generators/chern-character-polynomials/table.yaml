Data properties:
  type: Q[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every component with $1\leq n\leq 6$; $\mathrm{ch}_7$ is the first
    component needing more than six variables, which is the most a stored
    polynomial may have
  rigour details: >-
    The generator computes exact rational coefficients from Formula
    CITE{formula-power-sum} and Formula CITE{formula-newton}. Every stored
    component was checked against the Chern-root definition in Formula
    CITE{formula-component} and against
    $\mathrm{ch}_n(T\mathbb{P}^m)=(m+1)h^n/n!$ for
    $1\leq n\leq m\leq 6$.
Display properties:
  number-header: $\mathrm{ch}_n$

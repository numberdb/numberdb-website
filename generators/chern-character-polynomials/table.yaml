Title: Chern character polynomials $\mathrm{ch}_n(c_1,\dots,c_n)$
Definition: >-
  The entry is the homogeneous component $\mathrm{ch}_n(c_1,\dots,c_n)$
  of the Chern character of a complex vector bundle, written as a polynomial
  in the Chern classes $c_i$ CITE{ChernWiki}. It is defined by the Chern-root
  formula in Formula CITE{formula-component}.
Parameters:
  n:
    type: Z
    title: degree
    display: $n$
    constraints: $n\geq 1$
Comments:
  comment-component: >-
    The table stores one homogeneous component per row, not the total Chern
    character $\operatorname{rank}+\mathrm{ch}_1+\mathrm{ch}_2+\cdots$
    truncated at degree $n$.
  comment-zero: >-
    The degree-zero component is the rank of the vector bundle, not a universal
    polynomial in the positive-degree Chern classes, so the table begins at
    $n=1$.
  comment-variables: >-
    The polynomial $\mathrm{ch}_n$ is written in $c_1,\dots,c_n$, where $c_j$
    is the $j$-th HREF{Elementary_symmetric_polynomials}[elementary symmetric
    polynomial] in the Chern roots.
  comment-range: >-
    The component $\mathrm{ch}_n$ uses exactly the variables $c_1,\dots,c_n$:
    the coefficient of $c_n$ is $(-1)^{n-1}/(n-1)!$, which is never zero.
Formulas:
  formula-component: >-
    $\operatorname{ch}(E)=\operatorname{rank}(E)+\sum_{n\geq1}
    \mathrm{ch}_n(c_1,c_2,\dots)=\sum_i e^{x_i}$, where the $x_i$ are the
    Chern roots and $c_j=e_j(x_1,x_2,\dots)$.
  formula-power-sum: >-
    $\mathrm{ch}_n=p_n/n!$, where $p_n=\sum_i x_i^n$ is the $n$-th
    HREF{Power_sum_symmetric_polynomials}[power sum symmetric polynomial] in
    the Chern roots.
  formula-newton: >-
    The power sums are written in the Chern classes by Newton's identities:
    $p_n-c_1p_{n-1}+c_2p_{n-2}-\cdots+(-1)^n n c_n=0$.
Programs:
  program-sage:
    language: Sage
    code: |-
      from sage.all import PolynomialRing, QQ, factorial

      def chern_character_component(n):
          R = PolynomialRing(QQ, ["c%s" % i for i in range(1, n + 1)])
          c = R.gens()
          power_sums = {}
          for m in range(1, n + 1):
              total = R(0)
              for j in range(1, m):
                  total += (1 if j % 2 else -1) * c[j - 1] * power_sums[m - j]
              total += (1 if (m + 1) % 2 == 0 else -1) * QQ(m) * c[m - 1]
              power_sums[m] = total
          return power_sums[n] / factorial(n)

      print(chern_character_component(6))

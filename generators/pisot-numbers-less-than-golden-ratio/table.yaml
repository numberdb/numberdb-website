Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds the root of $E$ and the roots of $P_n$ and $Q_n$ for $2\leq n\leq40$,
    which are $\theta_1$ to $\theta_{79}$; at $n=40$ the largest root is still more than $1.9\cdot10^{-9}$
    below $\varphi$, while by $n=72$ the roots are within $10^{-15}$ of $\varphi$
  rigour details: 'The generator uses the Dufresnoy-Pisot classification as recorded in CITE{Bertin}
    and CITE{McKeeSmyth}. It forms the exact integer polynomials in CITE{formula-families},
    factors them over $\mathbb Q$, selects the unique irreducible factor with a real root
    in $(1,\varphi)$, and isolates that root in interval arithmetic before writing $100$ digits.
    It verifies that the first ten minimal polynomials agree with the source table quoted
    by Wikipedia''s small-Pisot-numbers section, including the plastic and supergolden ratios.


    The roots from $P_n$ and $Q_n$ used here increase with $n$: at a root of $P_n$, $P_{n+1}(x)=1-x<0$,
    and at a root of $Q_n$, $Q_{n+1}(x)=-(x-1)^2(x+1)<0$, while both next polynomials are
    positive at $\varphi$. The computed ordering has $P_{41}$ and $Q_{41}$ larger than $\theta_{79}$,
    so the first $79$ ranks are accounted for.'
Display properties:

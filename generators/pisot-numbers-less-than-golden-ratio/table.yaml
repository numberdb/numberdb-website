Title: Pisot numbers less than the golden ratio
Definition: Let $\varphi=(1+\sqrt5)/2$ be the golden ratio. For an integer $r\geq1$, $\theta_r$
  is the $r$-th smallest Pisot-Vijayaraghavan number CITE{Wiki} in the interval $(1,\varphi)$.
Parameters:
  r:
    type: Z
    title: rank
    display: $r$
    constraints: $r\geq1$
Comments:
  comment-classification: >-
    Dufresnoy and Pisot proved that HREF{Golden_ratio#phi}[$\varphi$] is the
    smallest limit point of the set of Pisot numbers and determined all Pisot
    numbers in $(1,\varphi)$ CITE{DP}. The Pisot numbers in $(1,\varphi)$
    therefore have a well-defined increasing order and converge to $\varphi$.
    They are the roots in $(1,\varphi)$ of the polynomials in
    CITE{formula-families} CITE{Bertin} CITE{McKeeSmyth}.
  comment-mahler: >-
    Each number is an algebraic unit. Its conjugates other than itself lie
    inside the unit disc, so it is the Mahler measure of its minimal
    polynomial.
Formulas:
  formula-families: >-
    The set $\{\theta_r:r\geq1\}$ consists of the roots in $(1,\varphi)$ of
    $P_n(x)=x^n(x^2-x-1)+1$ and $Q_n(x)=x^n(x^2-x-1)+x^2-1$ for $n\geq2$,
    together with the root in $(1,\varphi)$ of
    $E(x)=x^6-2x^5+x^4-x^2+x-1$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<x> = QQ[]
      P = lambda n: x^n*(x^2 - x - 1) + 1
      Q = lambda n: x^n*(x^2 - x - 1) + x^2 - 1
      E = x^6 - 2*x^5 + x^4 - x^2 + x - 1
      IR = RealIntervalField(400)
      phi = (IR(1) + IR(5).sqrt())/2
      def pisot_root(f):
          out = []
          for g, e in f.factor():
              out += [(g, root) for root, m in g.roots(IR)
                      if root.lower() > 1 and root.upper() < phi.lower()]
          return out[0]
      polys = [P(n) for n in range(2, 30)] + [Q(n) for n in range(2, 30)] + [E]
      sorted((pisot_root(f) for f in polys), key=lambda t: t[1].lower())[:10]

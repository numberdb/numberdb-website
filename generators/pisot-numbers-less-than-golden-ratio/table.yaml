Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds $\theta_1$ to $\theta_{50}$, the root of $E$, the roots of $P_n$
    for $2\leq n\leq25$, and the roots of $Q_n$ for $2\leq n\leq26$; after
    that the two infinite families are already within $3\cdot10^{-6}$ of
    $\varphi$, so the table stops at a readable initial segment
  rigour details: >-
    The generator uses the Dufresnoy-Pisot classification as recorded in
    CITE{Bertin} and CITE{McKeeSmyth}. It forms the exact integer polynomials
    in CITE{formula-families}, factors them over $\mathbb Q$, selects the
    unique irreducible factor with a real root in $(1,\varphi)$, and isolates
    that root in interval arithmetic before writing $100$ digits. It verifies
    that the first ten minimal polynomials agree with the source table quoted
    by Wikipedia's small-Pisot-numbers section, including the plastic and
    supergolden ratios.

    The roots from $P_n$ and $Q_n$ used here increase with $n$: at a root of
    $P_n$, $P_{n+1}(x)=1-x<0$, and at a root of $Q_n$,
    $Q_{n+1}(x)=-(x-1)^2(x+1)<0$, while both next polynomials are positive at
    $\varphi$. The computed ordering has $P_{26}$ and $Q_{27}$ larger than
    $\theta_{50}$, so the first $50$ ranks are accounted for.
Display properties:
  number-header: $\theta_r$

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: it holds the first $50$ ranks in increasing order
  rigour details: >-
    The generator uses the Dufresnoy-Pisot classification as recorded in
    CITE{Bertin} and CITE{McKeeSmyth}. It forms the exact integer polynomials
    in CITE{formula-families}, factors them over $\mathbb Q$, selects the
    unique irreducible factor with a real root in $(1,\varphi)$, and isolates
    that root in interval arithmetic before writing $100$ digits. It verifies
    that the first ten minimal polynomials agree with the source table quoted
    by Wikipedia's small-Pisot-numbers section, including the plastic and
    supergolden ratios. Before the draft was filled, the range measured $50$
    entries, a longest written value of $258$ characters at $r=1$, and a
    $19.9$ KB entries block.
Display properties:
  number-header: $\theta_r$

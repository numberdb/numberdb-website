Title: Pisot numbers less than the golden ratio
Definition: >-
  Let $\varphi=(1+\sqrt5)/2$ be the golden ratio. For an integer $r\geq1$,
  $\theta_r$ is the $r$-th smallest Pisot-Vijayaraghavan number CITE{Wiki}
  in the interval $(1,\varphi)$.
Parameters:
  r:
    type: Z
    title: rank
    display: $r$
    constraints: $r\geq1$
Comments:
  comment-classification: >-
    Dufresnoy and Pisot determined all Pisot numbers in $(1,\varphi)$
    CITE{DP}. In the form used here, they are the Pisot roots of
    $P_n(x)=x^n(x^2-x-1)+1$, of
    $Q_n(x)=x^n(x^2-x-1)+x^2-1$, and of the exceptional polynomial
    $x^6-2x^5+x^4-x^2+x-1$ CITE{Bertin} CITE{McKeeSmyth}.
  comment-mahler: >-
    Each number is an algebraic unit, so it is also the Mahler measure of its
    minimal polynomial.
Formulas:
  formula-families: >-
    The generator forms $P_n(x)=x^n(x^2-x-1)+1$ for $n\geq2$,
    $Q_n(x)=x^n(x^2-x-1)+x^2-1$ for $n\geq2$, and
    $E(x)=x^6-2x^5+x^4-x^2+x-1$, removes repeated minimal polynomials, and
    orders their Pisot roots increasingly.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<x> = QQ[]
      P = lambda n: x^n*(x^2 - x - 1) + 1
      Q = lambda n: x^n*(x^2 - x - 1) + x^2 - 1
      E = x^6 - 2*x^5 + x^4 - x^2 + x - 1
      RR = RealIntervalField(400)
      phi = (RR(1) + RR(5).sqrt())/2
      def pisot_root(f):
          out = []
          for g, e in f.factor():
              out += [(g, root) for root, m in g.roots(RR)
                      if root.lower() > 1 and root.upper() < phi.lower()]
          return out[0]
      sorted(pisot_root(f) for f in [P(n) for n in range(2, 30)]
             + [Q(n) for n in range(2, 30)] + [E])[:10]

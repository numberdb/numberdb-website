Title: Special $L$-values of elliptic curves over real quadratic fields
Definition: >-
  Let $K=\mathbb{Q}(\sqrt{D})$ be a real quadratic field and let $E/K$ be an
  elliptic curve. This table gives the leading Taylor coefficient
  $L^*(E/K,1)=L^{(r)}(E/K,1)/r!$, where $r=\operatorname{rank}E(K)$, for the
  Hasse-Weil $L$-function in the arithmetic normalisation CITE{ecnf-data}.
Keywords: Birch and Swinnerton-Dyer, BSD, Hilbert modular form, base change, real quadratic field, Q(sqrt 5)
Parameters:
  D:
    type: Z
    title: field discriminant
    display: $D$
    constraints: positive fundamental discriminant
  conductor:
    type: Symbolic
    title: LMFDB conductor label
  class:
    type: Symbolic
    title: isogeny class label
Comments:
  comment-index: >-
    The row with $D=5$, conductor label $31.1$, and isogeny class $a$ is the
    LMFDB class $2.2.5.1-31.1-a$. There is one row per $K$-isogeny class,
    since the $L$-function is an isogeny invariant. The representative curve
    named in each entry comment is the first curve in the class.
  comment-field-generator: >-
    The generator $w$ of $K$ is the one used by LMFDB CITE{ecnf-data}: it
    satisfies $w^2-w-1=0$ for $D=5$, $w^2-2=0$ for $D=8$, $w^2-3=0$ for
    $D=12$, $w^2-w-3=0$ for $D=13$, and $w^2-w-4=0$ for $D=17$.
  comment-convention: >-
    The stored value is the leading coefficient divided by $r!$. Thus it is
    the number that appears on the left of the Birch and Swinnerton-Dyer
    formula CITE{WikiBSD} in CITE{formula-BSD}.
Formulas:
  formula-BSD: >-
    The Birch and Swinnerton-Dyer formula in these normalisations is
    $L^*(E/K,1)=2^r\Omega_{E/K}R_{E/K}|\operatorname{Sha}(E/K)|
    \prod_{\mathfrak p}c_{\mathfrak p}/(|E(K)_{\mathrm{tors}}|^2\sqrt{D})$.
    Here $\Omega_{E/K}$ is the product over both real embeddings with real
    components counted, and $R_{E/K}$ is the regulator for the absolute
    Neron-Tate height.
  formula-base-change: >-
    If $E/K$ is the base change of an elliptic curve $E_0/\mathbb{Q}$, then
    $L^*(E/K,1)=L^*(E_0,1)L^*(E_0^{(D)},1)$, where $E_0^{(D)}$ is the
    quadratic twist of $E_0$ by $D$.

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds every dimension $n\leq20$, matching the range in which
    HREF{Zeros_of_Bessel_J_functions}[the Bessel-zero table] has the
    needed first-zero rows $j_{n/2,1}$
  rigour details: >-
    The generator isolates $j_{n/2,1}$ by sign changes using Sage's
    arb-backed `RealBallField`. For integer orders it evaluates the Bessel
    function by a rigorously tailed alternating power series and recurrence;
    for half-integer orders it uses the spherical-Bessel recurrence from
    sine and cosine. The one-dimensional value is checked against
    $27/(16\pi^2)$.
Display properties:
  number-header: $C_n$
  group parameters:
    - [n]

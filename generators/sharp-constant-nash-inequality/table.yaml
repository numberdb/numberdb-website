# The table document for numberdb.org/T359. It was created as a draft through
# the API with X-Draft: yes and is filled by generate.py beside it. Publishing
# is a person's act on the site.
Title: Sharp constant in Nash's inequality
Definition: >-
  Let $n$ be a positive integer. This table stores the least constant $C_n$
  such that Nash's inequality
  $\|u\|_2^{2+4/n}\leq C_n\|\nabla u\|_2^2\|u\|_1^{4/n}$
  holds for every $u\in L^1(\mathbb{R}^n)\cap W^{1,2}(\mathbb{R}^n)$
  CITE{CarlenLoss1993}.
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: positive integer
Formulas:
  formula-constant: >-
    $C_n=\frac{2(1+n/2)^{1+2/n}}{n\lambda_n\kappa_n^{2/n}}$,
    where $\kappa_n=\pi^{n/2}/\Gamma(1+n/2)$ is the volume of the unit
    ball in $\mathbb{R}^n$ and $\lambda_n=j_{n/2,1}^2$ is the first
    positive radial Neumann eigenvalue of $-\Delta$ on the unit ball.
    CITE{CarlenLoss1993}
  formula-one-dimensional: >-
    In dimension $1$, the first zero is $j_{1/2,1}=\pi$, so
    $C_1=27/(16\pi^2)$.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.integer_ring import ZZ
      from sage.rings.real_arb import RealBallField

      n = ZZ(1)
      R = RealBallField(numberdb.bits(100, losing=256))
      C1 = ZZ(27) / (ZZ(16) * R.pi() ** 2)
      C1

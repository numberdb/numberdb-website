# The table document for numberdb.org/T359. It was created as a draft through
# the API with X-Draft: yes and is filled by generate.py beside it. Publishing
# is a person's act on the site.
Title: Sharp constant in Nash's inequality
Definition: >-
  Let $n$ be a positive integer. This table stores the least constant $C_n$
  such that Nash's inequality CITE{NashWiki}
  $\|u\|_2^{2+4/n}\leq C_n\|\nabla u\|_2^2\|u\|_1^{4/n}$
  holds for every $u\in L^1(\mathbb{R}^n)\cap W^{1,2}(\mathbb{R}^n)$
  CITE{CarlenLoss1993}.
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: positive integer
Formulas:
  formula-constant: >-
    $C_n=\frac{2(1+n/2)^{1+2/n}}{n\lambda_n\kappa_n^{2/n}}$,
    where $\kappa_n=\pi^{n/2}/\Gamma(1+n/2)$ is
    HREF{Volume_of_the_unit_ball}[the volume of the unit ball] in
    $\mathbb{R}^n$, $j_{\nu,1}$ is
    HREF{Zeros_of_Bessel_J_functions}[the first positive zero of the
    Bessel function $J_\nu$], and $\lambda_n=j_{n/2,1}^2$ is the first
    positive radial Neumann eigenvalue of $-\Delta$ on the unit ball.
    CITE{CarlenLoss1993}, CITE{HaberlSchuster2009}
  formula-one-dimensional: >-
    In dimension $1$, $j_{1/2,1}=\pi$, so $C_1=27/(16\pi^2)$.
Programs:
  program-mpmath:
    language: Python
    code: |-
      from mpmath import mp, besseljzero, gamma, pi, mpf

      mp.dps = 120
      n = mpf(21)
      lam = besseljzero(n / 2, 1) ** 2
      kappa = pi ** (n / 2) / gamma(1 + n / 2)
      2 * (1 + n / 2) ** (1 + 2 / n) / (n * lam * kappa ** (2 / n))

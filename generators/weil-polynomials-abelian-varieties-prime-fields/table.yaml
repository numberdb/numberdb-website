Title: Weil polynomials of abelian varieties over prime fields
Definition: >-
  The Weil polynomial of an abelian variety $A/\mathbb{F}_q$ is
  $P_A(t)=\det(t-F\mid T_\ell A)$, where $F$ is the $q$-power Frobenius and
  $\ell\nmid q$ CITE{LMFDBWeil}. This table gives $P_A(t)$ for isogeny
  classes over prime fields.
Parameters:
  g:
    type: Z
    title: dimension
    display: $g$
    constraints: $g\geq1$
  q:
    type: Z
    title: base-field cardinality
    display: $q$
    constraints: $q$ is prime
  label:
    type: Symbolic
    title: LMFDB isogeny-class label
    display: label
Comments:
  comment-convention: >-
    The polynomial stored here is the characteristic polynomial
    $P_A(t)$. The L-polynomial $L_A(x)$ used on LMFDB class pages is its
    reverse, as in CITE{formula-reverse}.
  comment-labels: >-
    The label is the LMFDB label for the isogeny class CITE{LMFDBLabel}.
    It is part of the index because the same base field and dimension have
    many isogeny classes with nearby coefficients.
  comment-prime-fields: >-
    The table is restricted to prime fields. For prime powers the root-size
    inequalities for a Weil polynomial do not by themselves give exactly the
    elliptic-curve traces that occur; Waterhouse's occurrence conditions are
    then an extra part of the convention CITE{Waterhouse}.
  comment-entry-data: >-
    Each entry comment says whether the isogeny class is simple, its
    $p$-rank, and whether it is ordinary. The question whether a genus $2$
    class contains a Jacobian is not recorded here.
Formulas:
  formula-reverse: >-
    $L_A(x)=x^{2g}P_A(1/x)$ and $P_A(t)=t^{2g}L_A(1/t)$, so the roots of
    $P_A$ have absolute value $\sqrt q$ while the roots of $L_A$ have
    absolute value $q^{-1/2}$ CITE{LMFDBLPolynomial}.
  formula-shape: >-
    $P_A(t)=t^{2g}+a_1t^{2g-1}+\cdots+a_gt^g+
    qa_{g-1}t^{g-1}+\cdots+q^{g-1}a_1t+q^g$.
  formula-label: >-
    The final part of the LMFDB label encodes $a_1,\ldots,a_g$ from
    CITE{formula-shape} in base $26$, with $a=0$, $b=1$, and an initial
    $a$ marking a negative integer CITE{LMFDBLabel}.
  formula-p-rank: >-
    For $q=p$ prime, the $p$-rank is the largest $r$ with $0\leq r\leq g$
    such that $p\nmid a_r$, where $a_0=1$ CITE{LMFDBPRank}.
  formula-elliptic: >-
    For $g=1$, $P_A(t)=t^2-a_qt+q$, where $a_q=q+1-\#E(\mathbb{F}_q)$ for
    an elliptic curve $E$ in the isogeny class.
  formula-surface-bounds: >-
    For $g=2$, $P_A(t)=t^4+a_1t^3+a_2t^2+qa_1t+q^2$ is a Weil
    $q$-polynomial exactly when $|a_1|\leq4\sqrt q$ and
    $2|a_1|\sqrt q-2q\leq a_2\leq a_1^2/4+2q$.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<t> = ZZ[]
      q = 17
      [t^2 + a*t + q for a in range(-floor(2*sqrt(q)), floor(2*sqrt(q)) + 1)]

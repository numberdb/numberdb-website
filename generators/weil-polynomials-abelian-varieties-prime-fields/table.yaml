Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every isogeny class for $g=1$ and prime $q\leq13$, and every
    isogeny class for $g=2$ and prime $q\leq7$
  rigour details: >-
    The generator enumerates the coefficient tuples in CITE{formula-shape}
    exactly. For $g=1$ it uses the Hasse bound $a_1^2\leq4q$, giving
    $5,7,9,11,13,15$ classes for $q=2,3,5,7,11,13$. For $g=2$ it uses
    CITE{formula-surface-bounds}, giving $35,63,129,207$ classes for
    $q=2,3,5,7$, which matches OEIS A362198 CITE{OEISSurfaces}. Before an
    entry is returned, the generator requires the polynomial to be monic,
    to have degree $2g$, to satisfy the $q$-reciprocity in
    CITE{formula-shape}, to satisfy the coefficient bounds for its dimension,
    and to have the LMFDB label and the $p$-rank stated in the entry comment.
Display properties:
  number-header: $P_A(t)$
  group parameters: [['g'], ['q'], ['label']]

Data properties:
  type: R
  rigour: proven
  rigour details: >-
    Each value was computed as a Sage complex ball with arb at
    `numberdb.bits(digits, losing=64)` bits, with the imaginary part checked
    to contain zero. The entries were checked against mpmath at 90 decimal
    digits with `zeroprec=200`, against Kummer's transformation in
    CITE{formula-kummer-transformation} wherever the transformed row is also
    stored, against CITE{formula-elementary} for all stored rows with
    $(a,b)=(1,2)$, against CITE{formula-error} for $x=1,2$, and against
    CITE{formula-bessel-i} for all stored rows with $b=2a$ and positive
    argument. The widest returned ball had radius less than
    $3\cdot10^{-115}$ for 100 requested digits.
  complete: no
  complete-note: >-
    it holds every entry with
    $a\in\{-5/2,-3/2,-1/2,1/2,1,3/2,2,5/2,3\}$,
    $b\in\{1/2,1,3/2,2,5/2,3\}$, and
    $z\in\{\pm1/2,\pm1,\pm2,\pm4\}$, except the rows with $a=b$
Display properties:
  number-header: $M(a;b;z)$

Title: Values of Kummer's confluent hypergeometric function $M(a;b;z)$
Definition: >-
  This table gives the real values of Kummer's confluent hypergeometric
  function of the first kind $M(a;b;z)={}_1F_1(a;b;z)$ CITE{Wiki}
  CITE{DLMFDefinitions}, for rational $a$, rational
  $b\notin\mathbb{Z}_{\leq0}$, and rational $z$. The function is the standard
  solution of Kummer's equation normalised by $M(a;b;0)=1$.
Keywords:
  - Kummer function
  - Kummer M
  - confluent hypergeometric function
  - confluent hypergeometric function of the first kind
  - Hypergeometric1F1
  - 1F1
  - Beta distribution moment generating function
  - Coulomb wave function
Parameters:
  a:
    type: Q
    title: first parameter
    display: $a$
    constraints: $a\in\mathbb{Q}$
  b:
    type: Q
    title: second parameter
    display: $b$
    constraints: $b\in\mathbb{Q}\setminus\mathbb{Z}_{\leq0}$
  z:
    type: Q
    title: argument
    display: $z$
    constraints: $z\in\mathbb{Q}$
Comments:
  comment-standard-m: >-
    This is the unregularised Kummer function $M$, not Olver's entire
    function $\mathbf{M}(a,b,z)=M(a;b;z)/\Gamma(b)$ from CITE{DLMFDefinitions}.
  comment-simple-rows: >-
    Rows with $z=0$ or $a=b$ are not listed separately, because
    $M(a;b;0)=1$ and $M(a;a;z)=e^z$ by CITE{formula-elementary}. When
    $a=-n$ is a non-positive integer, $M(-n;\alpha+1;z)$ is a terminating
    Laguerre-type polynomial by CITE{formula-laguerre}; the ordinary case
    $M(-n;1;z)=L_n(z)$ is in HREF{Laguerre_polynomials}[the table of
    Laguerre polynomials].
  comment-whittaker: >-
    This table does not store the Whittaker function $M_{\kappa,\mu}(z)$,
    whose normalisation is defined separately in CITE{DLMFWhittaker}.
Formulas:
  formula-series: >-
    With $(a)_n$ denoting the Pochhammer symbol,
    $M(a;b;z)=\sum_{n=0}^{\infty}(a)_n z^n/((b)_n n!)$
    CITE{DLMFDefinitions}.
  formula-kummer-transformation: >-
    Kummer's transformation is
    $M(a;b;z)=e^z M(b-a;b;-z)$ CITE{DLMFDefinitions}.
  formula-elementary: >-
    $M(a;a;z)=e^z$, and for $z\neq0$,
    $M(1;2;z)=(e^z-1)/z$ CITE{DLMFRelations}.
  formula-error: >-
    For $x\neq0$,
    $M(1/2;3/2;-x^2)=\sqrt{\pi}\operatorname{erf}(x)/(2x)$
    CITE{DLMFRelations}.
  formula-bessel-i: >-
    For $z>0$,
    $M(\nu+1/2;2\nu+1;2z)=\Gamma(\nu+1)e^z(z/2)^{-\nu}I_\nu(z)$, where
    $I_\nu$ is HREF{Values_of_modified_Bessel_functions_of_the_first_kind}[the
    modified Bessel function of the first kind] CITE{DLMFRelations}.
  formula-laguerre: >-
    For $n\in\mathbb{Z}_{\geq0}$,
    $M(-n;\alpha+1;z)=n!L_n^{(\alpha)}(z)/(\alpha+1)_n$
    CITE{DLMFRelations}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.complex_arb import ComplexBallField
      from sage.rings.rational_field import QQ

      CBF = ComplexBallField(numberdb.bits(100, losing=64))
      a = CBF(QQ(1) / QQ(2))
      b = CBF(QQ(3) / QQ(2))
      z = CBF(-1)

      # Sage's arb method is called on the argument and takes parameter lists.
      z.hypergeometric([a], [b]).real()
  program-python:
    language: Python
    code: |-
      import mpmath

      mpmath.mp.dps = 100
      mpmath.hyp1f1(mpmath.mpf(1) / 2, mpmath.mpf(3) / 2, -1)

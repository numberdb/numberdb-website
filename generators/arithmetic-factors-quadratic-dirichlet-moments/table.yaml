Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds $k=1/2,1,3/2,\ldots,6$ and every integer $7\leq k\leq12$
  rigour details: >-
    The generator computes the small-prime local factors directly, computes
    the middle prime range from the exact power-series coefficients of the
    logarithm of the local factor in CITE{formula-ak}, and computes the
    remaining prime tail from prime-zeta values. The written 100 digits were
    computed with 140-digit settings and recomputed with 160-digit settings;
    the written digits agreed. The checks include CITE{formula-control} and
    the integer rows against PARI's `prodeulerrat` applied to
    CITE{formula-integer-local-factor} CITE{PARIProdEulerRat}.
Display properties:
  number-header: $A_k$

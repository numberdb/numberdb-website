# Draft document for T380, Arithmetic factors in the moments of quadratic
# Dirichlet L-functions. It was created through the API with X-Draft: yes and
# Numbers: [] so generate.py can fill it once. Publishing is a person's act.
Title: Arithmetic factors in the moments of quadratic Dirichlet $L$-functions
Definition: >-
  For $k>0$ rational, $A_k$ is the positive real Euler product in
  CITE{formula-ak}. It is the arithmetic factor in the CFKRS moment
  conjecture for central values $L(1/2,\chi_d)$ of quadratic Dirichlet
  $L$-functions CITE{WikiDirichlet} CITE{CFKRS}.
Keywords:
  - quadratic Dirichlet L-function moment
  - Dirichlet L-function moment
  - arithmetic factor
  - Euler product
  - symplectic family
  - Keating-Snaith
  - CFKRS
Parameters:
  k:
    type: Q
    title: moment parameter
    display: $k$
    constraints: $k>0$
Comments:
  comment-indexing: >-
    The same key $k$ is used throughout the moment-constant family. In this
    symplectic family it is the power of $L(1/2,\chi_d)$, while in the zeta
    table the same $k$ labels the $2k$-th absolute moment.
  comment-factor: >-
    This table stores the arithmetic factor $A_k$ alone. The leading constant
    pairs it with the symplectic random-matrix factor $f_{USp}(k)$, whose
    integer normalisation $g_{USp}(k)$ is stored in
    HREF{T379}[the random-matrix factor table].
  comment-branches: >-
    The rational powers in CITE{formula-ak} are taken on positive real bases.
    Since $p>1$, both $1-p^{-1/2}$ and $1+p^{-1/2}$ are positive.
Formulas:
  formula-moment: >-
    Conjecturally, the leading coefficient in the CFKRS polynomial for
    $\sum_d^* L(1/2,\chi_d)^k$ is $A_k f_{USp}(k)$, with exponent
    $k(k+1)/2$ in the logarithm of the conductor.
  formula-ak: >-
    $A_k=\prod_p (1-p^{-1})^{k(k+1)/2}
    \frac{\frac12\left((1-p^{-1/2})^{-k}+(1+p^{-1/2})^{-k}\right)+p^{-1}}
    {1+p^{-1}}$, where the product runs over rational primes.
  formula-integer-local-factor: >-
    If $k$ is a positive integer, the local factor in CITE{formula-ak} is
    $(1-p^{-1})^{k(k+1)/2}
    \frac{(1-p^{-1})^{-k}\sum_{m=0}^{\lfloor k/2\rfloor}
    {k\choose 2m}p^{-m}+p^{-1}}{1+p^{-1}}$.
  formula-control: >-
    $A_1=\prod_p(1-1/(p(p+1)))$.
Programs:
  program-pari-integers:
    language: PARI/GP
    code: |-
      \\ positive integer k only
      default(realprecision, 140)
      k = 3
      e = k*(k + 1)/2
      s = sum(m = 0, floor(k/2), binomial(k, 2*m)/p^m)
      prodeulerrat((1 - 1/p)^e * ((s/(1 - 1/p)^k + 1/p)/(1 + 1/p)), 1, 2)
Similar tables:
  - table: HREF{T377}[Arithmetic factors $a_k$ in the moments of the Riemann zeta function]
    relation: stores the analogous arithmetic factor for the unitary zeta-moment family
  - table: HREF{T379}[Moments of the characteristic polynomials of unitary, orthogonal and symplectic matrices]
    relation: stores the random-matrix factors paired with arithmetic factors in this moment-constant family

Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds the orientable cusped SnapPea census manifolds whose names begin
    with $m$, the part with at most five ideal tetrahedra
  rigour details: >-
    Each value is computed with SnapPy 3.3.2's verified
    `volume(verified=True, bits_prec=...)` method, which returns a Sage
    interval containing the true volume CITE{SnapPyVerify}. The generator
    writes $100$ digits. Before the draft was filled, all rows were compared
    with SnapPy's high-precision unverified volume as a transcription check,
    and the relations to the figure-eight knot complement and the Bianchi
    covolumes were checked against the stored entries in the linked tables.
Display properties:
  number-header: $\mathrm{Vol}(M)$

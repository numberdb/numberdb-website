# Draft document for T251, the Zernike polynomials proposed in numberdb-data#77.
# Publishing is a person's act.
Title: Zernike polynomials $Z_n^l$
Definition: >-
  For integers $n\geq0$ and $l$ with $|l|\leq n$ and $n-l$ even, the
  Zernike polynomial on the unit disk is
  $Z_n^l(\rho,\varphi)=R_n^{|l|}(\rho)\cos(l\varphi)$ for $l\geq0$ and
  $Z_n^l(\rho,\varphi)=R_n^{|l|}(\rho)\sin(|l|\varphi)$ for $l<0$
  CITE{Wiki}. This table stores the unnormalised radial polynomial
  $R_n^{|l|}(\rho)$ and the unnormalised Cartesian polynomial $Z_n^l(x,y)$,
  where $x=\rho\cos\varphi$ and $y=\rho\sin\varphi$.
Parameters:
  n:
    type: Z
    title: radial degree
    display: $n$
    constraints: $n\geq0$
  l:
    type: Z
    title: signed azimuthal degree
    display: $l$
    constraints: $|l|\leq n$ and $n-l$ is even
  form:
    type: Symbolic
    title: stored representation
    display: form
    constraints: either `radial` or `cartesian`
    values:
      radial: $R_n^{|l|}(\rho)$
      cartesian: $Z_n^l(x,y)$
Comments:
  comment-forms: >-
    The `radial` entries use only $l\geq0$, since
    $R_n^{|-l|}=R_n^l$. The `cartesian` entries use the signed upper index
    $l$: nonnegative $l$ gives the cosine mode and negative $l$ gives the
    sine mode. The angle $\varphi$ is measured anticlockwise from the
    positive $x$-axis.
  comment-normalisation: >-
    The entries are unnormalised. The OSA/ANSI and Noll normalised modes
    multiply these polynomials by $\sqrt{n+1}$ when $l=0$ and by
    $\sqrt{2(n+1)}$ when $l\ne0$ CITE{Wiki}.
  comment-omissions: >-
    The monomial rows are omitted: $R_n^n(\rho)=\rho^n$ for the radial form,
    and the Cartesian rows $Z_0^0=1$, $Z_1^1=x$ and $Z_1^{-1}=y$. The
    non-monomial edge modes such as $Z_2^2=x^2-y^2$ and
    $Z_2^{-2}=2xy$ are included.
  comment-indices: >-
    Entry comments give the Noll, OSA/ANSI, Fringe and Wyant single indices
    for the corresponding Cartesian mode. For a radial entry with $l>0$ the
    comment gives both signs of $l$, because the same radial polynomial is
    shared by the sine and cosine modes.
  comment-uses: >-
    Zernike polynomials are used for wavefront aberrations on circular pupils,
    Zernike moments in image analysis and related expansions on the unit disk
    CITE{Wiki} CITE{MathWorld}. The classical aberration names for the first
    modes are included in the Cartesian entry comments.
Formulas:
  formula-radial-sum: >-
    $R_n^m(\rho)=\sum_{k=0}^{(n-m)/2}(-1)^k
    \binom{n-k}{k}\binom{n-2k}{(n-m)/2-k}\rho^{n-2k}$ for
    $0\leq m\leq n$ and $n-m$ even CITE{Wiki}.
  formula-cartesian: >-
    If $R_n^m(\rho)=\sum_s c_s\rho^{m+2s}$, then
    $Z_n^l(x,y)=\sum_s c_s(x^2+y^2)^s\operatorname{Re}(x+iy)^m$ for
    $l=m>0$, $Z_n^l(x,y)=\sum_s c_s(x^2+y^2)^s\operatorname{Im}(x+iy)^m$
    for $l=-m<0$, and
    $Z_n^0(x,y)=R_n^0(\sqrt{x^2+y^2})$.
  formula-jacobi: >-
    $R_n^m(\rho)=(-1)^{(n-m)/2}\rho^m
    P_{(n-m)/2}^{(m,0)}(1-2\rho^2)$, where
    $P_k^{(\alpha,\beta)}$ is the
    HREF{Jacobi_polynomials}[Jacobi polynomial] CITE{Wiki} CITE{MathWorld}.
    In particular $R_{2k}^0(\rho)=P_k(2\rho^2-1)$ for the
    HREF{Legendre_polynomials}[Legendre polynomials].
  formula-orthogonality: >-
    $\int_0^1 R_n^m(\rho)R_{n'}^m(\rho)\rho\,d\rho
    =\delta_{n,n'}/(2n+2)$, and
    $\int Z_n^l Z_{n'}^{l'}\,d^2r
    =\epsilon_l\pi\,\delta_{n,n'}\delta_{l,l'}/(2n+2)$ on the unit disk,
    with $\epsilon_0=2$ and $\epsilon_l=1$ for $l\ne0$ CITE{Wiki}.
  formula-noll: >-
    The Noll index is $j_N=n(n+1)/2+|l|+\epsilon$, where
    $\epsilon=0$ for $l>0$ and $n\equiv0,1\pmod4$, or for $l<0$ and
    $n\equiv2,3\pmod4$, and $\epsilon=1$ otherwise CITE{Wiki}.
  formula-osa: >-
    The OSA/ANSI index is $j_{\mathrm{OSA}}=(n(n+2)+l)/2$ CITE{Wiki}.
  formula-fringe: >-
    The Fringe index is
    $j_F=(1+(n+|l|)/2)^2-2|l|+\lfloor(1-\operatorname{sgn}l)/2\rfloor$,
    with $\operatorname{sgn}0=0$; the Wyant index is $j_F-1$ CITE{Wiki}.
  formula-hankel: >-
    $\int_0^1 R_n^m(\rho)J_m(v\rho)\rho\,d\rho
    =(-1)^{(n-m)/2}J_{n+1}(v)/v$ CITE{MathWorld}, relating the radial
    polynomials to the HREF{Zeros_of_Bessel_J_functions}[zeros of Bessel
    functions of the first kind].
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.arith.misc import binomial
      from sage.rings.integer_ring import ZZ
      from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing

      R = PolynomialRing(ZZ, 'rho')
      rho = R.gen()

      def radial(n, m):
          return sum((-1)**k * ZZ(binomial(n - k, k)) *
                     ZZ(binomial(n - 2*k, (n - m)//2 - k)) *
                     rho**(n - 2*k)
                     for k in range((n - m)//2 + 1))

      radial(22, 0)                       # the next even radial row after this table
Similar tables:
  - table: HREF{Jacobi_polynomials}[Jacobi polynomials]
    relation: the radial polynomials are Jacobi polynomials after the change of variable in CITE{formula-jacobi}
  - table: HREF{Legendre_polynomials}[Legendre polynomials]
    relation: the $m=0$ radial polynomials are Legendre polynomials evaluated at $2\rho^2-1$
  - table: HREF{Zeros_of_Bessel_J_functions}[Zeros of Bessel functions of the first kind]
    relation: the Hankel transform in CITE{formula-hankel} has $J_{n+1}$ in its numerator

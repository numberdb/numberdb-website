Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every non-monomial radial polynomial with $n\leq20$ and every
    non-monomial Cartesian polynomial with $n\leq12$
  rigour details: >-
    Every entry is exact, a polynomial with integer coefficients. The
    generator computes CITE{formula-radial-sum} over Sage's integer
    polynomial rings and forms the Cartesian entries with
    CITE{formula-cartesian}. Before an entry is returned, the radial
    polynomial must agree with the Jacobi-polynomial identity
    CITE{formula-jacobi}; the radial polynomials must satisfy $R_n^m(1)=1$
    and the exact orthogonality relation CITE{formula-orthogonality}; and
    the single-index formulas must reproduce the checked initial Noll and
    Fringe lists.
Display properties:
  number-header: $R_n^{|l|}(\rho)$ or $Z_n^l(x,y)$

Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: every prime $p<200$ and every divisor $k$ of $p-1$ with $2\leq k\leq 12$ and $k<p-1$ is here, 158 entries
  rigour details: >-
    Each polynomial is the product $\prod(x-\eta_j)$ computed exactly in
    Sage's cyclotomic field $\mathbb{Q}(\zeta_p)$, with every coefficient
    required to be a rational integer. The generator requires it to equal
    PARI's polsubcyclo(p, k), a different algorithm, and requires the same
    product computed in ComplexBallField at 256 bits to enclose every
    coefficient in a ball of radius below $1/2$ (the worst radius over the
    table is $1.7\cdot 10^{-66}$), which determines an integer coefficient
    on its own. Before an entry is returned it must be monic, irreducible
    of degree $k$, with $x^{k-1}$ coefficient $1$; congruent to $(x-f)^k$
    modulo $p$; equal to the closed forms of CITE{formula-quadratic} and
    CITE{formula-cubic} when $k=2$ or $3$; have discriminant
    $(-1)^{r_2}p^{k-1}$ times a perfect square, and $p^{k-1}$ exactly when
    $f=2$; and have no root ball meeting the real axis when $f$ is odd.
    Outside the generator, the 21 cubic constant terms agree with OEIS
    A394567, the seven $f=2$ discriminants with OEIS A203411, the field
    each $\Psi_{p,k}$ defines is isomorphic to Sage's subfield of degree
    $k$ of $\mathbb{Q}(\zeta_p)$ for $p\leq 61$ (52 rows), the relation
    CITE{formula-gauss-sums} holds exactly against Sage's Gauss sums for
    every character of order dividing $k$ with $p\leq 61$ (91 pairs) and in
    balls against the stored digits of the table of Gauss sums for $p\leq
    50$ (71 pairs), the $f=2$ rows have the roots $2\cos(2\pi a/p)$ in
    balls, and $\Psi_{7,6}$, computed as a control and not stored, is
    $\Phi_7$. Two controls that must fail did: $\Psi_{7,3}$ is not
    polsubcyclo(7, 2), and $\Psi_{13,3}$ is not $(x-3)^3$ modulo $13$.
Display properties:
  number-header: $\Psi_{p,k}(x)$

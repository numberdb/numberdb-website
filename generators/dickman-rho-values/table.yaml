Title: Values of the Dickman-de Bruijn function $\rho(u)$
Definition: >-
  The Dickman-de Bruijn function $\rho$ is the continuous function with
  $\rho(u)=1$ for $0\leq u\leq1$ and
  $u\rho'(u)=-\rho(u-1)$ for $u>1$ CITE{WikiDickman}
  CITE{deBruijn1951}. This table gives $\rho(u)$ at rational smoothness
  ratios $u$.
Keywords:
  - Dickman function
  - de Bruijn function
  - Dickman-de Bruijn function
  - smooth numbers
  - smoothness ratio
  - rho function
Parameters:
  u:
    type: Q
    title: smoothness ratio $\log x/\log y$
    display: $u$
    constraints: $u\geq0$
Comments:
  comment-smooth-numbers: >-
    If $\Psi(x,y)$ counts the positive integers $n\leq x$ whose prime factors
    are all at most $y$, then $\rho(u)$ is the limiting density for
    $y=x^{1/u}$ in the fixed-$u$ smooth-number theorem CITE{HildebrandTenenbaum}.
  comment-trivial-range: >-
    The entries begin with $u=1.00$, where $\rho(1)=1$. For
    $0\leq u<1$, the function has the same value $\rho(u)=1$, and those
    repeated integer rows are not listed.
Formulas:
  formula-delay: >-
    $\rho(u)=1$ for $0\leq u\leq1$, and
    $u\rho'(u)=-\rho(u-1)$ for $u>1$ CITE{WikiDickman}.
  formula-first-interval: >-
    For $1\leq u\leq2$, $\rho(u)=1-\log u$.
  formula-smooth-density: >-
    For fixed $u\geq1$,
    $\lim_{x\to\infty}\Psi(x,x^{1/u})/x=\rho(u)$, where $\Psi(x,y)$ counts
    the positive integers $n\leq x$ whose prime factors are at most $y$
    CITE{HildebrandTenenbaum}.
Programs:
  program-sage:
    language: Sage
    code: |-
      import numberdb.sage as numberdb
      from sage.rings.rational_field import QQ

      # The attached generate.py evaluates rho(u) by the delay equation
      # and can be run with sage -python generate.py.
      from generate import DickmanRhoValues

      DickmanRhoValues().value({"u": str(QQ(5))}, 100)

Data properties:
  type: R
  rigour: proven
  sources:
    - CITE{deBruijn1951}
    - CITE{HildebrandTenenbaum}
  complete: 'no'
  complete-note: >-
    it holds $\rho(u)$ for every $u$ of two decimal places with
    $1\leq u\leq10$
  rigour details: >-
    Each entry was computed in Sage real ball arithmetic by the method of
    steps. On each unit interval the generator represents $\rho$ by a Taylor
    series about the midpoint with ball coefficients, applies
    $u\rho'(u)=-\rho(u-1)$ coefficient by coefficient, and includes an
    explicit geometric tail bound for the truncated product by $1/u$.

    The values on $1<u\leq2$ were checked against
    CITE{formula-first-interval}. Sample entries through $u=10$ were also
    compared with Sage's independent `dickman_rho` implementation
    CITE{SageDickman}.
Display properties:
  number-header: $\rho(u)$

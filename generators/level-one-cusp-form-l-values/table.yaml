# Created as draft T323 through the API (X-Draft: yes), to be filled by
# generate.py beside it and offered for review. Publishing is a person's act.
Title: Special values of the $L$-functions of level one cusp forms
Definition: >-
  For a normalised Hecke eigenform
  $f_{k,i}(q)=\sum_{n\geq1}a_nq^n$ in the space
  $S_k(\mathrm{SL}_2(\mathbb{Z}))$ of level one cusp forms CITE{WikiCusp},
  this table gives the critical value
  $L(f_{k,i},s)=\sum_{n\geq1}a_n n^{-s}$ of its $L$-function CITE{WikiL}.
  The index $i$ orders the eigenforms of weight $k$ by increasing $a_2$, the
  eigenvalue of $T_2$ in
  HREF{Hecke_polynomials_of_level_one_cusp_forms}[the Hecke polynomial table].
Parameters:
  k:
    type: Z
    title: weight
    display: $k$
    constraints: $k$ is even and $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$
  i:
    type: Z
    title: position by increasing $a_2$
    display: $i$
    constraints: >-
      $1\leq i\leq\dim S_k(\mathrm{SL}_2(\mathbb{Z}))$, with positions counted
      after sorting the eigenforms by increasing $a_2$
  s:
    type: Z
    title: argument of $L$
    display: $s$
    constraints: $s$ is an integer with $1\leq s\leq k-1$
Comments:
  comment-normalisation: >-
    The table uses the arithmetic normalisation: $a_1=1$ and
    $L(f,s)=\sum a_nn^{-s}$, so the critical strip is
    $0<\operatorname{Re}s<k$ and the centre is $s=k/2$. The analytic
    normalisation often written with centre $1/2$ is obtained by shifting
    $s$ by $(k-1)/2$.
  comment-ordering: >-
    Library orderings are not used as table orderings. In each weight, the
    generator embeds the Hecke field into the real numbers, computes the
    corresponding value of $a_2$, and then sorts the forms by that real value.
    Each entry comment names the same $a_2$ ordering through the row
    $(k,2)$ of
    HREF{Hecke_polynomials_of_level_one_cusp_forms}[the Hecke polynomial
    table].
  comment-central-zero: >-
    The sign of the functional equation is $(-1)^{k/2}$, so for
    $k\equiv2\pmod4$ the central value $L(f,k/2)$ vanishes. Those forced
    zeros are omitted from the entries rather than making every search for
    $0$ match this table.
Formulas:
  formula-completed: >-
    The completed $L$-function is
    $\Lambda(f,s)=(2\pi)^{-s}\Gamma(s)L(f,s)$, and for level one it satisfies
    $\Lambda(f,s)=(-1)^{k/2}\Lambda(f,k-s)$.
  formula-euler-product: >-
    For $\operatorname{Re}s>(k+1)/2$,
    $L(f,s)=\prod_p(1-a_pp^{-s}+p^{k-1-2s})^{-1}$.
Programs:
  program-pari:
    language: PARI/GP
    code: |-
      mf = mfinit([1, 12], 0);
      lfun(lfunmf(mf)[1][1], 6)       \\ 0.79212283864603056935...
  program-sage:
    language: Sage
    code: |-
      f = Newforms(1, 12, names='a')[0]
      f.lseries()(6)                  # 0.79212283864603056935...

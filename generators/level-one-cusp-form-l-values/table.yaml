Data properties:
  type: R
  rigour: heuristic (agreement-checked)
  complete: 'no'
  complete-note: >-
    it holds every even weight $12\leq k\leq40$ with
    $\dim S_k(\mathrm{SL}_2(\mathbb{Z}))>0$, every eigenform in the
    increasing-$a_2$ ordering, and every critical integer $1\leq s\leq k-1$,
    except the forced central zeros for $k\equiv2\pmod4$
  rigour details: >-
    The generator evaluates the PARI/GP `lfunmf` $L$-functions documented in
    CITE{PARILfun} and CITE{PARIModular} at two decimal working precisions,
    and stores only the digits common to both computations. It sorts the
    embeddings of each Hecke orbit by the embedded value of $a_2$, computed
    from PARI's `mfeigenbasis` and `mfcoefs`. An independent check compares
    the values with Sage's `Newforms` $L$-series CITE{SageNewforms}, after
    sorting Sage's embeddings by the same $a_2$ values, and checks the
    functional equation with PARI's `lfuncheckfeq`.
Display properties:
  number-header: $L(f_{k,i},s)$
  group parameters: [['k'], ['i'], ['s']]

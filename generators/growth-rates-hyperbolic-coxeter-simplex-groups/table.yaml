Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds all nine compact Coxeter tetrahedral groups in $\mathbb{H}^3$,
    the complete compact rank-$4$ list in Humphreys CITE{Humphreys}, and no
    paracompact tetrahedral groups or simplex groups in dimensions $4$ to $9$
  rigour details: >-
    The generator computes the rational growth series exactly from
    CITE{formula-steinberg}, using the finite special subgroups of each
    Coxeter diagram. It factors the reciprocal denominator, isolates the
    largest real root greater than $1$ in interval arithmetic, and writes
    $100$ digits. As checks, the minimal polynomial printed for $[3,5,3]$ was
    reproduced exactly, the Coxeter relations were checked in the exact Tits
    representation, and the first growth-series coefficients of every row were
    compared with breadth-first counts in that representation.
Display properties:
  number-header: $\tau$

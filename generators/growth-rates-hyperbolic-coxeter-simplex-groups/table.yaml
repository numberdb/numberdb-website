Title: Growth rates of hyperbolic Coxeter simplex groups
Definition: >-
  Let $(W,S)$ be the Coxeter group generated by the reflections in the
  facets of a finite-volume hyperbolic Coxeter simplex in $\mathbb{H}^n$,
  with the standard Coxeter generating set $S$ CITE{WikiCoxeter}. Listed is
  the exponential growth rate $\tau=\lim_{k\to\infty}a_k^{1/k}$, where
  $a_k$ is the number of elements of word length $k$ with respect to $S$
  CITE{WikiGrowth}.
Keywords:
  - Coxeter simplex group
  - hyperbolic Coxeter group
  - Coxeter group growth rate
  - compact hyperbolic Coxeter tetrahedral group
  - Perron number
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: an integer with $3\leq n\leq9$
  diagram:
    type: Symbolic
    title: Coxeter diagram
    display: diagram
    constraints: a Coxeter diagram of a finite-volume hyperbolic Coxeter simplex
Comments:
  comment-range: >-
    The entries currently held are the nine compact Coxeter tetrahedral
    groups in $\mathbb{H}^3$, the compact rank-$4$ list in Humphreys
    CITE{Humphreys}. Paracompact tetrahedral groups and higher-dimensional
    simplex groups are not included yet.
  comment-generators: >-
    The generating set is the set of reflections in the facets of the
    simplex. The orientation-preserving subgroup has index $2$, and its
    growth rate with respect to its own generators is a different convention.
  comment-addresses: >-
    Entry addresses use ASCII Coxeter bracket symbols and record the
    dimension separately. The same bracket notation is also used in lower-rank
    Coxeter families, including HREF{Growth_rates_of_hyperbolic_Coxeter_triangle_groups}[hyperbolic Coxeter triangle groups].
Formulas:
  formula-steinberg: >-
    For $W(t)=\sum_{k\geq0}a_k t^k$, Steinberg's formula CITE{Steinberg}
    gives
    $1/W(t^{-1})=\sum_{T\subseteq S,\ W_T\text{ finite}}
    (-1)^{|T|}/W_T(t)$.
  formula-rate: >-
    The radius of convergence of $W(t)$ is the smallest positive pole of the
    reduced rational function $W(t)$, and $\tau$ is its reciprocal.
Programs:
  program-sage:
    language: Sage
    code: |-
      R.<t> = QQ[]
      def qint(m):
          return sum(t^k for k in range(m))
      def finite_coxeter_growth(degrees):
          out = R(1)
          for d in degrees:
              out *= qint(d)
          return out
      # Use Steinberg's formula with the finite special subgroups of the diagram.
Similar tables:
  - table: HREF{Growth_rates_of_hyperbolic_Coxeter_triangle_groups}[Growth rates of hyperbolic Coxeter triangle groups]
    relation: the same convention for Coxeter reflection generators, in dimension $2$ rather than for simplex groups in dimensions $3$ and higher
  - table: HREF{Viswanath's_constant}[Viswanath's constant]
    relation: another exponential growth rate, from random Fibonacci recurrences rather than Coxeter groups

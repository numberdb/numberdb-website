Data properties:
  type: R
  rigour: proven
  complete: 'no'
  complete-note: >-
    it holds the nine compact Coxeter tetrahedral groups in $\mathbb{H}^3$
  rigour details: >-
    The generator computes the rational growth series exactly from
    CITE{formula-steinberg}, using the finite special subgroups of each
    Coxeter diagram. It factors the reciprocal denominator, isolates the
    largest real root greater than $1$ in interval arithmetic, and writes
    $100$ digits. Before the draft was filled, the known minimal polynomial
    for $[3,5,3]$ was checked exactly, the Coxeter relations were checked in
    the exact Tits representation, and the first growth-series coefficients of
    every row were compared with breadth-first counts in that representation.
Display properties:
  number-header: $\tau$

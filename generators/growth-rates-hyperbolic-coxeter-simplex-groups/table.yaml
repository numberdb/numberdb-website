Title: Growth rates of hyperbolic Coxeter simplex groups
Definition: >-
  Let $S$ be the set of facet reflections of a finite-volume hyperbolic
  Coxeter simplex in $\mathbb{H}^n$, and let $W=\langle S\rangle$
  CITE{WikiCoxeter}. Listed is the growth rate
  $\tau=\lim_{k\to\infty}a_k^{1/k}$, where $a_k$ counts the elements of $W$
  of word length $k$ with respect to $S$ CITE{WikiGrowth}.
Keywords:
  - Coxeter simplex group
  - hyperbolic Coxeter group
  - Coxeter group growth rate
  - compact hyperbolic Coxeter tetrahedral group
  - Perron number
  - Salem number
Parameters:
  n:
    type: Z
    title: dimension
    display: $n$
    constraints: an integer with $3\leq n\leq9$
  diagram:
    type: Symbolic
    title: Coxeter symbol
    display: Coxeter symbol
    constraints: a Coxeter symbol of a finite-volume hyperbolic Coxeter simplex
Comments:
  comment-generators: >-
    The index-$2$ orientation-preserving subgroup has a different word metric,
    so its growth rate is a different number and is not held here.
  comment-addresses: >-
    Entries are labelled by Coxeter symbols CITE{WikiCoxeterNotation}:
    $[p,q,r]$ is the linear diagram with branch labels $p,q,r$,
    $[(p,q,r,s)]$ is the cyclic diagram, and $[5,3^{1,1}]$ is the branched
    diagram with one edge labelled $5$ before a split into two edges labelled
    $3$.
  comment-minimum: >-
    Each value is a Salem number CITE{Kellerhals}. Among all cocompact
    hyperbolic Coxeter groups in $\mathbb{H}^3$, $[3,5,3]$ has the smallest
    growth rate, and it is the only group attaining it CITE{Kellerhals}, as
    HREF{Growth_rates_of_hyperbolic_Coxeter_triangle_groups#[7,3]}[Lehmer's number]
    is for cocompact triangle groups.
Formulas:
  formula-steinberg: >-
    For $W(t)=\sum_{k\geq0}a_k t^k$, Steinberg's formula CITE{Steinberg}
    gives
    $1/W(t^{-1})=\sum_{T\subseteq S,\ W_T\text{ finite}}
    (-1)^{|T|}/W_T(t)$, where $W_T$ is the subgroup generated by $T$ and
    $W_T(t)=\prod_i(1+t+\cdots+t^{d_i-1})$ is its growth polynomial, with
    $d_i$ the degrees of $W_T$ when $W_T$ is finite.
  formula-rate: >-
    The radius of convergence of $W(t)$ is the smallest positive pole of the
    reduced rational function $W(t)$, and $\tau$ is its reciprocal.
Programs:
  program-sage:
    language: Sage
    code: |-
      def growth_rate(M):
          # M is a Coxeter matrix; the final line uses [3,5,3].
          t = polygen(QQ, 't')
          total = 0
          for T in Subsets(range(len(M))):
              T = sorted(T)
              C = CoxeterMatrix([[M[i][j] for j in T] for i in T]) if T else None
              if T and not C.is_finite():
                  continue
              W_T = prod(sum(t^k for k in range(d)) for d in CoxeterGroup(C).degrees()) if T else 1
              total += (-1)^len(T) / W_T
          q = (1 / total(1/t)).denominator()
          return max(q.roots(AA, multiplicities=False)).n(digits=100)

      growth_rate([[1,3,2,2], [3,1,5,2], [2,5,1,3], [2,2,3,1]])

Keywords:
  - general polynomial discriminant
  - universal polynomial discriminant
  - discriminant in coefficients
  - polynomial discriminant
Tags:
  - polynomial
  - algebra
  - invariant theory
Data properties:
  type: Z[]
  rigour: exact
  complete: 'no'
  complete-note: >-
    it holds every degree $1\leq n\leq 5$; degree $6$ would use seven
    coefficient variables, more than polynomial search accepts, and the degree
    $5$ entry is already 1338 characters
  rigour details: >-
    The generator computes exact integer coefficients in
    $\mathbb Z[a_0,\dots,a_5]$ from the resultant identity in Formula
    CITE{formula-resultant} and all arithmetic is exact. It checks Formula
    CITE{formula-roots} by substituting
    $a_i=a_n(-1)^{n-i}e_{n-i}(\alpha_1,\dots,\alpha_n)$ for every stored
    degree, compares the quadratic and cubic rows from Formula
    CITE{formula-quadratic} and Formula CITE{formula-cubic} against the
    stored values, and compares
    integer specialisations with Sage's exact univariate discriminant over
    $\mathbb Z[x]$.
Display properties:
  number-header: $\operatorname{disc}(f)$

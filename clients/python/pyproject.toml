[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numberdb"
version = "0.1.9"
description = "Look a number up in NumberDB and find out whether it is already known"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Benjamin Matschke"}]
keywords = ["mathematics", "number theory", "constants", "sagemath", "numberdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# No runtime dependencies on purpose. The package uses urllib from the standard
# library rather than requests, so that installing it into a SageMath
# environment cannot disturb what is already there. Sage itself is optional and
# imported only when a Sage object is asked for.
dependencies = []

# Deliberately no [sage] extra. It would be typed by exactly the people it can
# hurt: `sage -pip install numberdb[sage]` inside a full SageMath installs
# passagemath over the top of it. The passagemath-flint wheel writes 383 files
# under sage/, 349 of which already exist in a full Sage -- including compiled
# .so extensions -- and pip reports no conflict, because Sage's own files
# belong to no pip distribution and so cannot be detected as clashing.
#
# numberdb.sage needs no extra: it uses whatever Sage is already there.

# Building the reference needs pdoc and nothing else, since the docstrings are
# already there:
#
#     pdoc -t pdoc-templates -o docs numberdb numberdb.sage
#
# The template directory holds one override, renaming pdoc's "API
# Documentation" sidebar heading -- "the API" here is the web API, which has
# its own separate reference. Drop the flag and that heading comes back.
[project.optional-dependencies]
docs = ["pdoc>=14"]

[project.urls]
Homepage = "https://numberdb.org"
# The subdirectory, not the repository root. The package lives inside the
# website's repository -- deliberately, because a third of the changes that
# touch it also touch the server it talks to -- and someone arriving from PyPI
# should not have to work that out by looking.
Source = "https://github.com/numberdb/numberdb-website/tree/main/clients/python"
Issues = "https://github.com/numberdb/numberdb-website/issues"
Documentation = "https://numberdb.org/help#section-sage-interface"

[tool.setuptools.packages.find]
include = ["numberdb*"]

[tool.setuptools.package-data]
# Marks the package as carrying inline type information (PEP 561).
numberdb = ["py.typed"]

[tool.mypy]
# The package is published with `py.typed`, so a user's own type checker reads
# these annotations and reports against them. Checking them here means the
# errors are ours to see rather than theirs.
python_version = "3.8"
files = ["numberdb"]

# The rule that makes `__all__` mean something: a name imported into a module
# is not part of its interface unless it is exported deliberately. Without
# this, `numberdb.Fraction` would look like part of the API to a checker, and
# it is Python's, not ours.
no_implicit_reexport = true

[[tool.mypy.overrides]]
# SageMath ships no type stubs, and there is nothing to be done about that
# from here. Every one of these imports is already inside a try/except that
# handles the absence at runtime.
module = ["sage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML is optional: a table is read as JSON when it is absent, which is the
# case in CI. Its stubs are a separate package and not worth requiring.
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `numberdb.real` exists in the website that shares this file and not in the
# client package, which is why the import sits in a try/except with a fallback
# class beside it.
module = ["numberdb.real"]
ignore_missing_imports = true

# Publish the numberdb client package to PyPI.
#
# Uses PyPI Trusted Publishing (OpenID Connect) rather than an API token: the
# runner proves which repository and workflow it is, and PyPI issues a
# short-lived credential. Nothing long-lived is stored in the repository, so
# there is no token to leak or rotate.
#
# One-time setup on PyPI, under the project's Publishing settings:
#
#     Owner:              numberdb
#     Repository:         numberdb-website
#     Workflow:           publish-numberdb.yml
#     Environment:        pypi
#
# For the very first upload the project does not exist yet, so add a *pending*
# publisher (PyPI - Your projects - Publishing - Add a pending publisher) with
# the project name `numberdb` and the same four values.
name: Publish numberdb to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The package has no dependencies and does not need Sage, which is the
      # point of it: these run in a bare interpreter.
      - name: Run the package's tests
        run: python -m unittest discover -s clients/python/tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
        working-directory: clients/python
      # Catches a README that PyPI would reject, before the upload rather than
      # during it.
      - run: python -m twine check dist/*
        working-directory: clients/python
      - uses: actions/upload-artifact@v4
        with:
          name: numberdb-dist
          path: clients/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: numberdb-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

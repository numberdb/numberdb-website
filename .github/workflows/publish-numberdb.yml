# Publish the numberdb client package to PyPI.
#
# Uses PyPI Trusted Publishing (OpenID Connect) rather than an API token: the
# runner proves which repository and workflow it is, and PyPI issues a
# short-lived credential. Nothing long-lived is stored in the repository, so
# there is no token to leak or rotate.
#
# One-time setup on PyPI, under the project's Publishing settings:
#
#     Owner:              numberdb
#     Repository:         numberdb-website
#     Workflow:           publish-numberdb.yml
#     Environment:        pypi
#
# For the very first upload the project does not exist yet, so add a *pending*
# publisher (PyPI - Your projects - Publishing - Add a pending publisher) with
# the project name `numberdb` and the same four values.
name: Publish numberdb to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Nothing else runs until the release being published is actually a release
  # of this package.
  #
  # The trigger is `release: published`, which fires for *any* release in this
  # repository -- and this repository is the website as well. A release cut for
  # the site would otherwise walk straight into an upload of whatever version
  # happened to be sitting in pyproject.toml: a failure if that version already
  # exists on PyPI, and a genuinely unintended publication if it does not.
  # Versions on PyPI cannot be replaced or reused, so that is not a mistake
  # anybody gets to undo.
  #
  # Two conditions, both cheap:
  #
  #   * the tag looks like a package version -- `v1.2.3`
  #   * and it *is* the version in pyproject.toml
  #
  # The second is the one that earns its keep. It catches the ordinary slip of
  # tagging v0.2.0 while the file still says 0.1.0, which otherwise publishes
  # the old version under the new name, or fails at the last step after the
  # release notes have already gone out.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than relying on the runner's default, because `tomllib`
      # is 3.11 and up and the default is not something this workflow chooses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release is a release of this package
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "Run by hand (workflow_dispatch); skipping the tag check."
            exit 0
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$tag' is not a package version (expected vX.Y.Z)."
               echo "If this release is for the website rather than the numberdb"
               echo "package, that is exactly what this check is for."
               exit 1 ;;
          esac
          version=$(cd clients/python && python -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag '$tag' does not match the package version '$version'."
            echo "Set the version in clients/python/pyproject.toml and tag it to match."
            exit 1
          fi
          echo "Publishing numberdb $version from tag $tag."

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The package itself needs nothing installed, which is the point of it.
      # Proved separately from the tests, because a test runner is a
      # development dependency and conflating the two hid the real problem:
      # discover -s only collects what imports cleanly, so when two test files
      # started needing pytest the release was gated on 145 of 271 tests, with
      # the ones covering writing not running at all.
      - name: The package imports and works with nothing installed
        run: |
          cd clients/python
          python -c "import numberdb; print(numberdb.__version__)"

      # pytest for the suite, and nothing else: still no Sage, still none of
      # the package's own dependencies, because it has none.
      - run: python -m pip install --upgrade pytest
      # From inside clients/python, so `import numberdb` finds the client and
      # not the Django project package of the same name at the repository root.
      - name: Run the package's tests
        run: |
          cd clients/python
          python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
        working-directory: clients/python
      # Catches a README that PyPI would reject, before the upload rather than
      # during it.
      - run: python -m twine check dist/*
        working-directory: clients/python
      - uses: actions/upload-artifact@v4
        with:
          name: numberdb-dist
          path: clients/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: numberdb-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

# How the access log records who asked.
#
# nginx's default log line begins with the visitor's full IP address. That is
# personal data, it was written for every request including every image, and it
# was kept for as long as the container's log happened to live -- which was
# forever, because nothing rotated it.
#
# None of what the log is actually for needs the last octet. It is read to
# answer "is something hammering the server", "did that request 500", and "is
# this one client or a hundred", all of which survive masking, because a /24 or
# a /64 is still one network. What does not survive is following one person
# around the site, which is not a thing anyone here wants to be able to do.
#
# Named 00- so nginx parses it before conf.d/default.conf: a log_format has to
# exist by the time an access_log names it.
#
# Defining the format is not enough on its own. The stock nginx.conf already
# has an `access_log ... main` in the http block, and a second access_log
# beside it would log twice rather than replace it -- so each server block
# carries its own `access_log ... anonymised`, which *does* replace what it
# inherits. Both templates do that; there is no third one.

# IPv4 keeps three octets, IPv6 keeps the routing prefix, and anything
# unrecognised becomes a fixed placeholder rather than falling through as
# itself -- a default of $remote_addr would quietly log everything in full the
# day a form of address turns up that these patterns do not match.
map $remote_addr $anonymised_addr {
    ~^(?P<ipv4>\d+\.\d+\.\d+)\.\d+$                                   $ipv4.0;
    ~^(?P<ipv6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $ipv6::;
    default                                                           0.0.0.0;
}

log_format anonymised '$anonymised_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $request_time';

version: "3.9"

services:
  web:
    build: .
    image: numberdb/web:latest
    command: gunicorn numberdb.wsgi:application --bind 0.0.0.0:8000 --workers 3
    entrypoint: ["/app/docker/entrypoint.web.sh"]
    env_file:
      - .env
    environment:
      - PYRO_NS_HOST=pyro-ns
      - PYRO_NS_PORT=9090
      - DJANGO_SETTINGS_MODULE=numberdb.settings
      - AUTO_MIGRATE=0
      - DATABASE_URL=postgres://u_numberdb:${POSTGRES_KEY:-password2_to_be_changed}@db:5432/numberdb
    depends_on:
      - db
      - pyro-ns
    volumes:
      - staticfiles:/app/staticfiles
      - numberdb-data:/numberdb-data
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./deploy/nginx/numberdb.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=numberdb
      - POSTGRES_USER=u_numberdb
      - POSTGRES_PASSWORD=${POSTGRES_KEY:-password2_to_be_changed}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pyro-ns:
    build: .
    image: numberdb/web:latest
    command: ["sage", "-python", "-m", "Pyro5.nameserver", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "9090:9090"

  eval:
    build: .
    image: numberdb/web:latest
    command: ["sage", "-python", "services/eval.py"]
    environment:
      - PYRO_NS_HOST=pyro-ns
      - PYRO_NS_PORT=9090
    depends_on:
      - pyro-ns

  data-fetcher:
    image: alpine/git:latest
    command: sh -c "git -C /numberdb-data pull || git clone --depth 1 https://github.com/numberdb/numberdb-data.git /numberdb-data"
    volumes:
      - numberdb-data:/numberdb-data
    restart: "no"

volumes:
  staticfiles:
  pgdata:
  numberdb-data:

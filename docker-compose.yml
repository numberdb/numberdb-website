version: "3.9"

services:
  web:
    build: .
    image: numberdb/web:latest
    command: gunicorn numberdb.wsgi:application --bind 0.0.0.0:8000 --workers 3
    entrypoint: ["/app/docker/entrypoint.web.sh"]
    env_file:
      - .env
    environment:
      - PYRO_NS_HOST=pyro-ns
      - PYRO_NS_PORT=9090
      - DJANGO_SETTINGS_MODULE=numberdb.settings
      - AUTO_MIGRATE=0
      - DATABASE_URL=postgres://u_numberdb:${POSTGRES_KEY:-password2_to_be_changed}@db:5432/numberdb
    depends_on:
      - db
      - pyro-ns
    volumes:
      - staticfiles:/app/staticfiles
      - numberdb-data:/numberdb-data
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      - web
    environment:
      - SERVER_NAME=${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/staticfiles:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=numberdb
      - POSTGRES_USER=u_numberdb
      - POSTGRES_PASSWORD=${POSTGRES_KEY:-password2_to_be_changed}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pyro-ns:
    build: .
    image: numberdb/web:latest
    command: ["sage", "-python", "-m", "Pyro5.nameserver", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "9090:9090"

  eval:
    build: .
    image: numberdb/web:latest
    command: ["sage", "-python", "services/eval.py"]
    environment:
      - PYRO_NS_HOST=pyro-ns
      - PYRO_NS_PORT=9090
    depends_on:
      - pyro-ns

  # One-shot issuance (run manually):
  # docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d ${SERVER_NAME} --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: "echo 'Run certbot commands manually as needed'"

  # Background renewer
  certbot-renew:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

  data-fetcher:
    image: alpine:3.20
    entrypoint: ["/bin/sh","-c"]
    command: "apk add --no-cache git && (git -C /numberdb-data pull || git clone --depth 1 https://github.com/numberdb/numberdb-data.git /numberdb-data)"
    volumes:
      - numberdb-data:/numberdb-data
    restart: "no"

volumes:
  staticfiles:
  pgdata:
  numberdb-data:
  certbot-www:
  letsencrypt:

services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: numberdb/web:latest
    command: ["sage","-python","-m","gunicorn","numberdb.wsgi:application","--bind","0.0.0.0:8000","--workers","${GUNICORN_WORKERS:-1}"]
    entrypoint: ["/app/docker/entrypoint.web.sh"]
    env_file:
      - .env
    environment:
      - PYRO_NS_HOST=pyro-ns
      - PYRO_NS_PORT=9090
      - DJANGO_SETTINGS_MODULE=numberdb.settings.prod
      - AUTO_MIGRATE=0
      - DATABASE_URL=postgres://u_numberdb:${POSTGRES_KEY:-password2_to_be_changed}@db:5432/numberdb
    depends_on:
      - db
      - pyro-ns
    volumes:
      - staticfiles:/app/staticfiles
      - numberdb-data:/numberdb-data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",8000),3); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      - SERVER_NAME=${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/staticfiles:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=numberdb
      - POSTGRES_USER=u_numberdb
      - POSTGRES_PASSWORD=${POSTGRES_KEY:-password2_to_be_changed}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-64MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - wal_compression=${PG_WAL_COMPRESSION:-on}
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-off}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      - -c
      - checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT:-10min}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pyro-ns:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: numberdb/web:latest
    command: ["sage", "-python", "-m", "Pyro5.nameserver", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "9090:9090"

  eval:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: numberdb/web:latest
    command: ["sage", "-python", "services/eval.py"]
    environment:
      - PYRO_NS_HOST=pyro-ns
      - PYRO_NS_PORT=9090
    depends_on:
      - pyro-ns

  # One-shot issuance (run manually):
  # docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d ${SERVER_NAME} --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: "echo 'Run certbot commands manually as needed'"

  # Background renewer
  certbot-renew:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

  data-fetcher:
    image: alpine/git:latest
    entrypoint: ["/bin/sh","-c"]
    command: "git -C /numberdb-data pull || git clone --depth 1 https://github.com/numberdb/numberdb-data.git /numberdb-data"
    volumes:
      - numberdb-data:/numberdb-data
    restart: "no"

volumes:
  staticfiles:
  pgdata:
  numberdb-data:
  certbot-www:
  letsencrypt:

services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: numberdb/web:latest
    command: ["sage","-python","-m","gunicorn","numberdb.wsgi:application","--bind","0.0.0.0:8000","--workers","${GUNICORN_WORKERS:-1}"]
    entrypoint: ["/app/docker/entrypoint.web.sh"]
    env_file:
      - .env
    environment:
      - EVALUATOR_SOCKET=/run/eval/evaluator.sock
      - DJANGO_SETTINGS_MODULE=numberdb.settings.prod
      - AUTO_MIGRATE=0
      - DATABASE_URL=postgres://u_numberdb:${POSTGRES_KEY:-password2_to_be_changed}@db:5432/numberdb
    depends_on:
      - db
      - evaluator
    volumes:
      - staticfiles:/app/staticfiles
      - numberdb-data:/numberdb-data
      - eval-sock:/run/eval
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "sage -python -c 'import socket; s=socket.create_connection((\"127.0.0.1\",8000),3); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      - SERVER_NAME=${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/staticfiles:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=numberdb
      - POSTGRES_USER=u_numberdb
      - POSTGRES_PASSWORD=${POSTGRES_KEY:-password2_to_be_changed}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-64MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - wal_compression=${PG_WAL_COMPRESSION:-on}
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-off}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      - -c
      - checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT:-10min}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Sandboxed evaluator for advanced-search expressions.
  # See docs/design/eval-sandbox.md. Replaces the Pyro5 name server + SafeEval
  # worker, which is why there is no pyro-ns service any more.
  evaluator:
    image: numberdb/web:latest
    command: ["sage", "-python", "workers/evaluator.py"]
    restart: unless-stopped
    # No network interfaces at all. User expressions are assumed to reach
    # arbitrary code execution, so the container must not be able to touch
    # Postgres, the Docker API, the internet or Tailscale peers even then. The
    # Unix socket below is the only channel in or out.
    #
    # Note a firewall would NOT be equivalent: Docker publishes ports through
    # its own iptables chain and bypasses ufw entirely.
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Per-container process cap. Preferred over RLIMIT_NPROC, which is per-UID
    # and counts pre-existing processes -- see workers/sandbox.py.
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      # The only shared surface. No source, no secrets, no .env.
      - eval-sock:/run/eval

  # One-shot issuance (run manually):
  # docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d ${SERVER_NAME} --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: ["--help"]

  # Background renewer
  certbot-renew:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"]

  data-fetcher:
    image: alpine/git:latest
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        set -e
        if [ -d /numberdb-data/.git ]; then
          git -C /numberdb-data pull
          exit 0
        fi

        if [ -n "$(ls -A /numberdb-data 2>/dev/null)" ]; then
          echo "WARN: /numberdb-data exists but is not a git repo; wiping and recloning." >&2
          rm -rf /numberdb-data/* /numberdb-data/.[!.]* /numberdb-data/..?* 2>/dev/null || true
        fi

        git clone --depth 1 https://github.com/numberdb/numberdb-data.git /numberdb-data
    volumes:
      - numberdb-data:/numberdb-data
    restart: "no"

volumes:
  eval-sock:
  staticfiles:
  pgdata:
  numberdb-data:
  certbot-www:
  letsencrypt:
